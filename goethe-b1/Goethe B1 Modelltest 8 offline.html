<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-weight: 700; margin-bottom: 1mm;\">Hören, Teil 1<\u002Fdiv><div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr);\"><span>1<\u002Fspan><span>Falsch<\u002Fspan><span>2<\u002Fspan><span>c<\u002Fspan><span>3<\u002Fspan><span>Richtig<\u002Fspan><span>4<\u002Fspan><span>b<\u002Fspan><span>5<\u002Fspan><span>Richtig<\u002Fspan><span>6<\u002Fspan><span>a<\u002Fspan><span>7<\u002Fspan><span>Falsch<\u002Fspan><span>8<\u002Fspan><span>c<\u002Fspan><span>9<\u002Fspan><span>Falsch<\u002Fspan><span>10<\u002Fspan><span>a<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-weight: 700; margin-bottom: 1mm;\">Hören, Teil 2<\u002Fdiv><div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr);\"><span>11<\u002Fspan><span>b<\u002Fspan><span>12<\u002Fspan><span>a<\u002Fspan><span>13<\u002Fspan><span>c<\u002Fspan><span>14<\u002Fspan><span>a<\u002Fspan><span>15<\u002Fspan><span>b<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-weight: 700; margin-bottom: 1mm;\">Hören, Teil 3<\u002Fdiv><div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr);\"><span>16<\u002Fspan><span>Falsch<\u002Fspan><span>17<\u002Fspan><span>Richtig<\u002Fspan><span>18<\u002Fspan><span>Falsch<\u002Fspan><span>19<\u002Fspan><span>Falsch<\u002Fspan><span>20<\u002Fspan><span>Richtig<\u002Fspan><span>21<\u002Fspan><span>Richtig<\u002Fspan><span>22<\u002Fspan><span>Falsch<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-weight: 700; margin-bottom: 1mm;\">Hören, Teil 4<\u002Fdiv><div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr);\"><span>23<\u002Fspan><span>b<\u002Fspan><span>24<\u002Fspan><span>a<\u002Fspan><span>25<\u002Fspan><span>c<\u002Fspan><span>26<\u002Fspan><span>b<\u002Fspan><span>27<\u002Fspan><span>c<\u002Fspan><span>28<\u002Fspan><span>a<\u002Fspan><span>29<\u002Fspan><span>b<\u002Fspan><span>30<\u002Fspan><span>c<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top: 6mm; border: 0.3mm solid #1a1a1a; padding: 3.5mm 5mm; font-size: 8.5pt; line-height: 1.45; color: #555; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3mm 10mm;\">\n      <div><div style=\"font-weight: 700; color: #1a1a1a; margin-bottom: 1mm;\">Lesen und Hören<\u002Fdiv>Je 30 Items, jedes Item zählt gleich viel. Die Rohpunkte werden auf 100 Punkte umgerechnet: 30 richtige Items = 100 Punkte, 27 = 90, 24 = 80, 21 = 70, <b style=\"color: #1a1a1a;\">18 = 60 (Bestehensgrenze)<\u002Fb>, 15 = 50.<\u002Fdiv>\n      <div><div style=\"font-weight: 700; color: #1a1a1a; margin-bottom: 1mm;\">Schreiben<\u002Fdiv>Aufgabe 1 = 40, Aufgabe 2 = 40, Aufgabe 3 = 20 Punkte. Kriterien pro Aufgabe: Erfüllung, Kohärenz, Wortschatz, Strukturen (Stufen A–E).<\u002Fdiv>\n      <div><div style=\"font-weight: 700; color: #1a1a1a; margin-bottom: 1mm;\">Sprechen<\u002Fdiv>Teil 1 = 28, Teil 2 = 40, Teil 3 = 16, Aussprache = 16 Punkte.<\u002Fdiv>\n      <div><div style=\"font-weight: 700; color: #1a1a1a; margin-bottom: 1mm;\">Bestehen<\u002Fdiv>Mindestens 60 von 100 Punkten in jedem Modul. Die Module werden einzeln bewertet und können auch einzeln wiederholt werden.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Musterlösungen Schreiben\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\" data-appendix-page=\"1\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">18<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; top: 11mm; font-size: 26pt; font-weight: 300; letter-spacing: 0.3em; color: #9a9a9a;\">Musterlösungen<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 20mm; top: 30mm; bottom: 12mm; overflow: hidden;\">\n    <div style=\"font-weight: 700; font-size: 12pt; margin-bottom: 1.5mm;\">Schreiben<\u002Fdiv>\n    <div style=\"font-size: 9pt; line-height: 1.45; color: #555; margin-bottom: 5mm;\">Beispiele für Texte auf Niveau B1, die alle Leitpunkte behandeln. Die grauen Ziffern am Rand zeigen, wo welcher Leitpunkt beantwortet wird. Bewertet wird nach Erfüllung, Kohärenz, Wortschatz und Strukturen.<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5mm 7mm; align-items: start; font-size: 9pt; line-height: 1.5;\">\n      <div>\n        <div style=\"font-weight: 700; margin-bottom: 1.5mm;\">Aufgabe 1 <span style=\"font-weight: 400; color: #555;\">· E-Mail an eine Freundin, ca. 90 Wörter<\u002Fspan><\u002Fdiv>\n        <div style=\"border: 0.3mm solid #1a1a1a; padding: 4.5mm 5mm 4.5mm 8mm;\">\n          <div style=\"margin-bottom: 3mm; padding-bottom: 1.5mm; border-bottom: 0.25mm solid #b8b8b8;\"><span style=\"color: #555;\">Betreff:<\u002Fspan> <b>Festival-Wochenende<\u002Fb><\u002Fdiv>\n          <p style=\"margin: 0 0 2.5mm;\">Liebe Ines,<\u002Fp>\n          <p style=\"margin: 0 0 2.5mm; position: relative;\"><span style=\"position: absolute; left: -5.5mm; top: 0.5mm; font-size: 7.5pt; font-weight: 700; color: #9a9a9a;\">1<\u002Fspan>am Wochenende war ich auf dem Seefestival in Konstanz. Drei Tage lang gab es Musik auf zwei Bühnen direkt am Wasser, und wir haben im Zelt geschlafen. Am Samstag hat es zwar geregnet, aber die Stimmung war trotzdem super.<\u002Fp>\n          <p style=\"margin: 0 0 2.5mm; position: relative;\"><span style=\"position: absolute; left: -5.5mm; top: 0.5mm; font-size: 7.5pt; font-weight: 700; color: #9a9a9a;\">2<\u002Fspan>Nächstes Jahr möchte ich unbedingt wieder hinfahren, weil man dort so viele neue Bands entdeckt und sehr nette Leute kennenlernt.<\u002Fp>\n          <p style=\"margin: 0 0 2.5mm; position: relative;\"><span style=\"position: absolute; left: -5.5mm; top: 0.5mm; font-size: 7.5pt; font-weight: 700; color: #9a9a9a;\">3<\u002Fspan>Im November spielt eine meiner neuen Lieblingsbands in Stuttgart. Sollen wir zusammen hingehen? Ich besorge die Karten.<\u002Fp>\n          <p style=\"margin: 0;\">Viele Grüße<br>Ana<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"font-weight: 700; margin: 5mm 0 1.5mm;\">Aufgabe 3 <span style=\"font-weight: 400; color: #555;\">· E-Mail an die Nachbarin, ca. 45 Wörter<\u002Fspan><\u002Fdiv>\n        <div style=\"border: 0.3mm solid #1a1a1a; padding: 4.5mm 5mm;\">\n          <p style=\"margin: 0 0 2.5mm;\">Sehr geehrte Frau Winter,<\u002Fp>\n          <p style=\"margin: 0 0 2.5mm;\">am Samstagabend feiere ich meinen Geburtstag in meiner Wohnung. Es kann etwas lauter werden, und dafür möchte ich mich schon jetzt entschuldigen. Ab 23 Uhr machen wir die Musik leiser. Wenn Sie Lust haben, kommen Sie doch gern vorbei!<\u002Fp>\n          <p style=\"margin: 0;\">Mit freundlichen Grüßen<br>Daniel Moreno<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-weight: 700; margin-bottom: 1.5mm;\">Aufgabe 2 <span style=\"font-weight: 400; color: #555;\">· Diskussionsbeitrag, ca. 95 Wörter<\u002Fspan><\u002Fdiv>\n        <div style=\"border: 0.3mm solid #1a1a1a; padding: 4.5mm 5mm;\">\n          <p style=\"margin: 0 0 2.5mm;\">Gisela spricht ein Problem an, das viele Familien kennen. Ich glaube aber, man muss nicht jede Mahlzeit genau planen, um weniger wegzuwerfen. Es hilft schon, vor dem Einkaufen kurz in den Kühlschrank zu schauen und eine Liste zu schreiben.<\u002Fp>\n          <p style=\"margin: 0 0 2.5mm;\">Außerdem kann man Reste am nächsten Tag essen oder einfrieren. Brot vom Vortag schmeckt geröstet noch sehr gut. In meinem Heimatland wirft man fast nie Essen weg, weil viele Menschen wenig Geld haben.<\u002Fp>\n          <p style=\"margin: 0;\">Ich finde, wir sollten Lebensmittel mehr schätzen – das spart am Ende auch Geld.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"margin-top: 5mm; border: 0.3mm solid #1a1a1a; padding: 3.5mm 4mm; font-size: 8.5pt; line-height: 1.45;\">\n          <div style=\"font-weight: 700; margin-bottom: 1.5mm;\">Bewertung<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 22mm minmax(0, 1fr); row-gap: 1mm;\"><b>Erfüllung<\u002Fb><span>Alle Leitpunkte, passende Textsorte und Register (du/Sie), ungefähre Wortzahl. Jeder fehlende Leitpunkt kostet eine Stufe.<\u002Fspan><b>Kohärenz<\u002Fb><span>Aufbau mit Anrede, Einleitung, Schluss; Verknüpfungen wie <i>zwar … aber, weil, außerdem<\u002Fi>.<\u002Fspan><b>Wortschatz<\u002Fb><span>Angemessen und variiert; Fehler dürfen das Verständnis nicht stören.<\u002Fspan><b>Strukturen<\u002Fb><span>Nebensätze, Fragen und Vorschläge (<i>Sollen wir …?, Wenn Sie Lust haben, …<\u002Fi>).<\u002Fspan><\u002Fdiv>\n          <div style=\"font-weight: 700; margin: 3mm 0 1.5mm;\">Typische Fehler<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 5mm minmax(0, 1fr); row-gap: 1mm; color: #555;\"><b style=\"color: #1a1a1a;\">1<\u002Fb><span>Nur das Festival wird beschrieben, die Begründung fehlt · Vorschlag ohne Zeitpunkt · <i>Sie<\u002Fi> statt <i>du<\u002Fi>.<\u002Fspan><b style=\"color: #1a1a1a;\">2<\u002Fb><span>Giselas Beitrag nur zusammenfassen · keine eigenen Vorschläge oder Beispiele · deutlich unter 80 Wörtern.<\u002Fspan><b style=\"color: #1a1a1a;\">3<\u002Fb><span>Keine Einladung · <i>Hallo Frau Winter<\u002Fi> oder <i>Liebe Grüße<\u002Fi> · keine Entschuldigung.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Musterlösung Sprechen\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\" data-appendix-page=\"1\">\n  <div style=\"position: absolute; right: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; justify-content: flex-end; padding-right: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">19<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 20mm; top: 18mm; bottom: 12mm; overflow: hidden; column-count: 2; column-gap: 8mm; column-fill: auto; font-size: 8.8pt; line-height: 1.4; hyphens: auto;\">\n    <div style=\"font-weight: 700; font-size: 12pt; margin-bottom: 1.5mm;\">Sprechen<\u002Fdiv>\n    <div style=\"color: #555; margin-bottom: 4mm;\">Beispiele, wie die drei Teile gelingen können. A und B sind die beiden Teilnehmenden.<\u002Fdiv>\n    <div style=\"font-weight: 700; font-size: 10.5pt; margin: 0 0 2mm;\">Teil 1 · Gemeinsam etwas planen<\u002Fdiv>\n    <p style=\"margin: 0 0 1.5mm;\"><b>A:<\u002Fb> Frau Hagen muss nächste Woche für sieben Tage ins Krankenhaus. Ich finde, wir sollten ihr helfen. Das Wichtigste ist ihre Katze, oder?<\u002Fp>\n    <p style=\"margin: 0 0 1.5mm;\"><b>B:<\u002Fb> Ja. Ich kann die Katze morgens und abends füttern, ich wohne ja direkt gegenüber.<\u002Fp>\n    <p style=\"margin: 0 0 1.5mm;\"><b>A:<\u002Fb> Gut. Dann kümmere ich mich um die Post und gieße die Blumen. Am besten holen wir uns morgen ihren Ersatzschlüssel.<\u002Fp>\n    <p style=\"margin: 0 0 1.5mm;\"><b>B:<\u002Fb> Einverstanden. Sollen wir sie auch im Krankenhaus besuchen?<\u002Fp>\n    <p style=\"margin: 0 0 1.5mm;\"><b>A:<\u002Fb> Auf jeden Fall, aber vielleicht nicht gleich am ersten Tag – am Anfang ist man im Krankenhaus meistens sehr müde. Wie wäre es mit Mittwoch?<\u002Fp>\n    <p style=\"margin: 0 0 1.5mm;\"><b>B:<\u002Fb> Mittwoch passt mir. Wir könnten ihr Zeitschriften und etwas Obst mitbringen.<\u002Fp>\n    <p style=\"margin: 0 0 1.5mm;\"><b>A:<\u002Fb> Gute Idee. Und wenn sie entlassen wird? Mit dem Bus ist das für sie bestimmt zu anstrengend.<\u002Fp>\n    <p style=\"margin: 0 0 1.5mm;\"><b>B:<\u002Fb> Ich habe ein Auto. Sie soll uns einfach anrufen, wenn sie den genauen Tag weiß, dann hole ich sie ab.<\u002Fp>\n    <p style=\"margin: 0 0 1.5mm;\"><b>A:<\u002Fb> Super. Und am ersten Abend zu Hause könnte ich für sie kochen, dann muss sie nicht gleich einkaufen gehen.<\u002Fp>\n    <p style=\"margin: 0 0 1.5mm;\"><b>B:<\u002Fb> Darüber freut sie sich bestimmt. Also: Ich füttere die Katze, du kümmerst dich um Post und Blumen, am Mittwoch besuchen wir sie zusammen, ich hole sie ab, und du kochst.<\u002Fp>\n    <p style=\"margin: 0 0 4mm;\"><b>A:<\u002Fb> Perfekt. Dann klingeln wir heute Abend bei ihr und erzählen ihr alles.<\u002Fp>\n    <div style=\"font-weight: 700; font-size: 10.5pt; margin: 3mm 0 2mm;\">Teil 2 · Ein Thema präsentieren (Thema 1)<\u002Fdiv>\n    <p style=\"margin: 0 0 1.5mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Folie 1<\u002Fspan> Ich möchte heute über das Thema „Sollen Kinder im Haushalt helfen?“ sprechen. Zuerst erzähle ich von meinen eigenen Erfahrungen, danach berichte ich über die Situation in meinem Heimatland. Dann nenne ich Vor- und Nachteile und sage meine Meinung. Zum Schluss fasse ich kurz zusammen.<\u002Fp>\n    <p style=\"margin: 0 0 1.5mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Folie 2<\u002Fspan> Als Kind musste ich jeden Tag den Tisch decken und am Wochenende mein Zimmer aufräumen. Damals fand ich das ungerecht, weil meine Freunde zu Hause nichts machen mussten. Heute bin ich meinen Eltern dankbar, denn als ich ausgezogen bin, konnte ich schon kochen und waschen.<\u002Fp>\n    <p style=\"margin: 0 0 1.5mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Folie 3<\u002Fspan> In meinem Heimatland helfen Kinder sehr viel, besonders auf dem Land. Viele kümmern sich um jüngere Geschwister oder arbeiten im Garten mit. In den Städten ändert sich das gerade, weil die Kinder mehr Zeit für die Schule brauchen.<\u002Fp>\n    <p style=\"margin: 0 0 1.5mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Folie 4<\u002Fspan> Ein Vorteil ist, dass Kinder selbstständig werden und lernen, dass man die Arbeit in einer Familie teilt. Ein Nachteil kann sein, dass sie zu wenig Zeit für Hausaufgaben oder Freunde haben, wenn es zu viel wird. Meiner Meinung nach sollten Kinder kleine, feste Aufgaben haben, die zu ihrem Alter passen.<\u002Fp>\n    <p style=\"margin: 0 0 4mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Folie 5<\u002Fspan> Zusammenfassend kann ich sagen: Ein bisschen Hilfe im Haushalt schadet keinem Kind – im Gegenteil. Vielen Dank fürs Zuhören. Haben Sie noch Fragen?<\u002Fp>\n    <div style=\"font-weight: 700; font-size: 10.5pt; margin: 3mm 0 2mm;\">Teil 3 · Über ein Thema sprechen<\u002Fdiv>\n    <p style=\"margin: 0 0 1.5mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Rückmeldung B<\u002Fspan> Vielen Dank für deine Präsentation. Mir hat gefallen, dass du ehrlich erzählt hast, wie ungerecht du das früher fandest. Interessant war für mich der Unterschied zwischen Stadt und Land in deinem Heimatland.<\u002Fp>\n    <p style=\"margin: 0 0 1.5mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Frage B<\u002Fspan> Welche Aufgaben haben deine eigenen Kinder?<\u002Fp>\n    <p style=\"margin: 0 0 1.5mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Antwort A<\u002Fspan> Meine Tochter ist acht. Sie füttert den Hamster und räumt nach dem Essen ihren Teller in die Spülmaschine.<\u002Fp>\n    <p style=\"margin: 0 0 4mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Prüferfrage<\u002Fspan> Sollten Jungen und Mädchen die gleichen Aufgaben bekommen? – <b>A:<\u002Fb> Ja, natürlich. Kochen und Rasenmähen kann jeder lernen.<\u002Fp>\n    <div style=\"break-inside: avoid; border: 0.3mm solid #1a1a1a; padding: 3.5mm 4mm; margin-top: 2mm;\">\n      <div style=\"font-weight: 700; margin-bottom: 1.5mm;\">Worauf die Prüfenden achten<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 12mm minmax(0, 1fr); row-gap: 1mm;\"><b>Teil 1<\u002Fb><span>Zu allen vier Punkten Vorschläge machen und begründen, auf den Partner reagieren (<i>Einverstanden, aber …<\u002Fi>), am Ende ein gemeinsames Ergebnis zusammenfassen.<\u002Fspan><b>Teil 2<\u002Fb><span>Struktur ankündigen, alle fünf Folien behandeln, Beispiele geben, die Meinung begründen, sich bedanken.<\u002Fspan><b>Teil 3<\u002Fb><span>Rückmeldung mit Inhalt (nicht nur „Das war gut“), eine echte Frage zum Vortrag, auf Fragen der Prüfenden eingehen.<\u002Fspan><b>Sprache<\u002Fb><span>Verständliche Aussprache; Fehler stören nicht, solange die Aussage verständlich bleibt.<\u002Fspan><\u002Fdiv>\n      <div style=\"margin-top: 2.5mm; color: #555;\">Nützliche Redemittel: <i>Ich finde, wir sollten … · Wie wäre es mit …? · Einverstanden. · Gute Idee. · Also: … · Meiner Meinung nach sollten …<\u002Fi><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Kommentar für Lehrende 1\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\" data-appendix-page=\"1\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">20<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; top: 11mm; font-size: 26pt; font-weight: 300; letter-spacing: 0.3em; color: #9a9a9a;\">Kommentar<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 20mm; top: 30mm; bottom: 12mm; overflow: hidden;\">\n    <div style=\"font-size: 9pt; color: #555; margin-bottom: 3.5mm; line-height: 1.4;\">Fallen und Distraktoren – Hinweise für Lehrende. Grundlage ist eine Analyse der offiziellen Modell- und Übungssätze (Modellsatz Erwachsene, Übungssatz 5, Modelltest 7, Probeprüfung): Fast jede Schwierigkeit lässt sich dort auf eines von acht Mustern zurückführen. Dieser Satz setzt alle acht bewusst ein, und zwar an denselben Stellen wie die Originale: Das erste Item in Teil 2 fragt nach dem Thema des Textes, in Teil 3 gibt es genau eine Situation ohne passende Anzeige, in Teil 4 kommen ein Meinungswechsel und ein Alternativvorschlag vor, und in Hören 4 bringt die Moderatorin eigene Informationen ein. Wie in Modelltest IV bis VII übernehmen die richtigen Lösungen fast nie ein Wort aus dem Text; Wörter aus dem Text stehen dagegen oft in den falschen Optionen. Die Lösungen bei Richtig/Falsch und Ja/Nein folgen keinem festen Muster, und die richtige Option ist nicht systematisch die längste.<\u002Fdiv>\n    <div style=\"border: 0.3mm solid #1a1a1a; padding: 2.5mm 4mm; margin-bottom: 3.5mm; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1mm 8mm; font-size: 7.8pt; line-height: 1.35;\">\n      <div style=\"grid-column: 1 / -1; font-weight: 700; font-size: 9pt; margin-bottom: 0.5mm;\">Acht Fallentypen<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">P<\u002Fb><b>Paraphrase<\u002Fb> – die Lösung steht nie wörtlich im Text (<i>ohne Erklärung<\u002Fi> → <i>muss nicht sagen, warum<\u002Fi>).<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">W<\u002Fb><b>Wortfalle<\u002Fb> – ein Schlüsselwort aus dem Text steht in der falschen Option.<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">N<\u002Fb><b>Negation / Einschränkung<\u002Fb> – <i>nicht, nur, kaum, außer, nicht mehr als, ausschließlich<\u002Fi>.<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">Z<\u002Fb><b>Zahlen und Zeit<\u002Fb> – Uhrzeiten, Wochentage, Altersgrenzen; oft muss man rechnen oder vergleichen.<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">A<\u002Fb><b>Absicht vs. Realität<\u002Fb> – <i>wollte eigentlich, sollte, hätte, geplant, notfalls<\u002Fi> – aber nicht geschehen.<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">S<\u002Fb><b>Sprecher / Perspektive<\u002Fb> – wer sagt oder tut es? Die Moderatorin informiert, der Gast bestätigt nur.<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">K<\u002Fb><b>Konzessiv<\u002Fb> – <i>Ich verstehe …, aber / natürlich … aber / trotzdem<\u002Fi>: Erst der zweite Teil zählt.<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">B<\u002Fb><b>Bedingung / Ausnahme<\u002Fb> – <i>nur wenn, falls, gegen Gebühr, in Begleitung<\u002Fi>.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"column-count: 2; column-gap: 8mm; font-size: 7.3pt; line-height: 1.25; hyphens: auto;\">\n      <div style=\"margin-bottom: 3mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Lesen, Teil 1 <span style=\"font-weight: 400; color: #555;\">· 3 × Richtig, 3 × Falsch<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>1<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">A<\u002Fspan><span>Corinna wollte Hanna überraschen – „Hanna wusste davon nichts“.<\u002Fspan>\n          <b>2<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„Am schwersten fällt mir nicht das Gebärden, sondern das Lesen“.<\u002Fspan>\n          <b>3<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„erst gelacht und dann vor Freude geweint“, danach geduldig korrigiert.<\u002Fspan>\n          <b>4<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">S<\u002Fspan><span>Zwei Kollegen machen den Kurs; der Chef sorgt für eine Dolmetscherin.<\u002Fspan>\n          <b>5<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">A<\u002Fspan><span>„Dolmetscherin werden will ich aber nicht“.<\u002Fspan>\n          <b>6<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„Und das klappt schon erstaunlich oft.“<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-bottom: 3mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Lesen, Teil 2<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>7<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">W<\u002Fspan><span>Globalfrage; „abends“ (a) und „Nachmittag“ (b) sind Wortfallen.<\u002Fspan>\n          <b>8<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„es kommen deutlich weniger zu spät“; über die Noten weiß man noch nichts (a, N).<\u002Fspan>\n          <b>9<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„Frühbetreuung in der Bibliothek“ vor dem Unterricht; die Busse haben nur den Fahrplan geändert (b, W).<\u002Fspan>\n          <b>10<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">W<\u002Fspan><span>Globalfrage; „jeden Freitag“ (a) und „Urlaub in Italien“ (c) sind Wortfallen.<\u002Fspan>\n          <b>11<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„ohne Erklärung und ohne einen Ausweis“ (b, N); den Freitag nennt der Text nur für einen Gast (c, S).<\u002Fspan>\n          <b>12<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„neben Kaffee auch aufgeschobene Suppen“; Missbrauch „gebe es kaum“ (a).<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-bottom: 3mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Lesen, Teil 3<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>13<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„Eine befreundete Köchin soll das Essen machen“ = Koch Ihrer Wahl; g: Essen an Bord, höchstens 100 Gäste.<\u002Fspan>\n          <b>14<\u002Fb><b style=\"color: #555;\">f<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„draußen grillen, am liebsten mitten in der Natur“ = Grillhütte am Waldsee, bis 40 Personen.<\u002Fspan>\n          <b>15<\u002Fb><b style=\"color: #555;\">h<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„zu Hause … unterhält“ = der Clown kommt nach Hause; d macht nur Musik.<\u002Fspan>\n          <b>16<\u002Fb><b style=\"color: #555;\">i<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„gemeinsam etwas tun“ = zusammen kochen, 8 bis 14 Personen; g erst ab 30 Gästen.<\u002Fspan>\n          <b>17<\u002Fb><b style=\"color: #555;\">j<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Tische, Bänke, Zelt = Biertischgarnitur und Festzelt.<\u002Fspan>\n          <b>18<\u002Fb><b style=\"color: #555;\">0<\u002Fb><span style=\"color: #9a9a9a;\">Z<\u002Fspan><span>g fährt nur von April bis Oktober.<\u002Fspan>\n          <b>19<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„ohne … danach abzuwaschen“ = Geschirr wird ungespült abgeholt; g ist keine Feier zu Hause.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-bottom: 3mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Lesen, Teil 4 <span style=\"font-weight: 400; color: #555;\">· 4 × Ja, 3 × Nein<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>20<\u002Fb><b style=\"color: #555;\">Ja<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„So etwas wünsche ich mir auch für unsere Schule“.<\u002Fspan>\n          <b>21<\u002Fb><b style=\"color: #555;\">Ja<\u002Fb><span style=\"color: #9a9a9a;\">K<\u002Fspan><span>Meinungswechsel: „war ich … skeptisch … Heute sehe ich das anders“.<\u002Fspan>\n          <b>22<\u002Fb><b style=\"color: #555;\">Nein<\u002Fb><span style=\"color: #9a9a9a;\">K<\u002Fspan><span>„Ich verstehe die Eltern … Aber eine Uniform ist nicht die Lösung“.<\u002Fspan>\n          <b>23<\u002Fb><b style=\"color: #555;\">Ja<\u002Fb><span style=\"color: #9a9a9a;\">B<\u002Fspan><span>Die Bedingung (bequem, Mitbestimmung) ist an der Schule der Tochter erfüllt.<\u002Fspan>\n          <b>24<\u002Fb><b style=\"color: #555;\">Nein<\u002Fb><span style=\"color: #9a9a9a;\">S<\u002Fspan><span>Eltern und Lehrer sind dafür; sie selbst: „Ich sehe das anders.“<\u002Fspan>\n          <b>25<\u002Fb><b style=\"color: #555;\">Nein<\u002Fb><span style=\"color: #9a9a9a;\">B<\u002Fspan><span>Alternativvorschlag: einfache Kleiderregeln statt Uniform.<\u002Fspan>\n          <b>26<\u002Fb><b style=\"color: #555;\">Ja<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„Ich verstehe nicht, warum man hier so viel Angst vor gleicher Kleidung hat.“<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-bottom: 3mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Lesen, Teil 5<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>27<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„beim Fahrer zahlen Sie allerdings zwei Euro mehr“ = Aufpreis.<\u002Fspan>\n          <b>28<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„kostenlos … umbuchen“; bei einer Absage gibt es nur einen Gutschein (a, N).<\u002Fspan>\n          <b>29<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">B<\u002Fspan><span>6 bis 14 Jahre nur „mit einer unterschriebenen Erlaubnis der Eltern“; der Kindersitz gilt unter 6 (b, Z).<\u002Fspan>\n          <b>30<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">B<\u002Fspan><span>„Haustiere dürfen nicht mitfahren; Assistenzhunde sind davon ausgenommen“.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Kommentar für Lehrende 2\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\" data-appendix-page=\"1\">\n  <div style=\"position: absolute; right: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; justify-content: flex-end; padding-right: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">21<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 20mm; top: 18mm; bottom: 12mm; overflow: hidden;\">\n    <div style=\"column-count: 2; column-gap: 8mm; font-size: 7.8pt; line-height: 1.3; hyphens: auto;\">\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Hören, Teil 1 <span style=\"font-weight: 400; color: #555;\">· jeder Text zweimal<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>1<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>Die Halle mit 4D-Kino und Spielwelt „bleibt geöffnet“.<\u002Fspan>\n          <b>2<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„Gutschein für einen weiteren Besuch“ = etwas für später; Geld gibt es nicht zurück (a, b).<\u002Fspan>\n          <b>3<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„Mein Auto ist in der Werkstatt“.<\u002Fspan>\n          <b>4<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„dass wir morgen Frau Kraus mitnehmen“; Treffpunkt ist die Bäckerei, nicht das Haus (a, W).<\u002Fspan>\n          <b>5<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„das gibt es nur an diesem Tag“.<\u002Fspan>\n          <b>6<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„Platzkarte … kostenlos am Eingang“ (b, N).<\u002Fspan>\n          <b>7<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>Die Rückgabe-Automaten sind „auch nach 20 Uhr noch erreichbar“.<\u002Fspan>\n          <b>8<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">Z<\u002Fspan><span>„bis 14 Uhr geschlossen“; die Lesung findet statt (a).<\u002Fspan>\n          <b>9<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„es geht ihm aber nicht schlimm“.<\u002Fspan>\n          <b>10<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„jemanden, der auf der Abholliste steht“ = eine andere berechtigte Person.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Hören, Teil 2 <span style=\"font-weight: 400; color: #555;\">· nur einmal<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>11<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Treffpunkt ist „immer der Brunnen auf dem Marktplatz“; Holstentor (c, W).<\u002Fspan>\n          <b>12<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Der Eintritt ist „im Preis der Führung enthalten“ (b, W).<\u002Fspan>\n          <b>13<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>Leise sein, nicht in die Fenster fotografieren – Fotos an sich sind erlaubt (a).<\u002Fspan>\n          <b>14<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Toiletten „auch wenn Sie nichts kaufen“; zwanzig Minuten Pause (c, Z).<\u002Fspan>\n          <b>15<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Rathausführung „vier Euro extra“; Ende am Rathaus, nicht am Holstentor (a, W).<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Hören, Teil 3 <span style=\"font-weight: 400; color: #555;\">· 3 × Richtig, 4 × Falsch<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>16<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>Weiße Schränke bestellt, graue geliefert.<\u002Fspan>\n          <b>17<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„den Aufbau bezahlt die Firma“.<\u002Fspan>\n          <b>18<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">K<\u002Fspan><span>Mehr ärgert sie der Urlaub, den sie umsonst genommen haben.<\u002Fspan>\n          <b>19<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">S<\u002Fspan><span>Den Kurs hat ihm der Enkel geschenkt.<\u002Fspan>\n          <b>20<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„Seitdem steht er jeden Tag im Keller und baut.“<\u002Fspan>\n          <b>21<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„auch für andere Leute im Haus etwas zu bauen“.<\u002Fspan>\n          <b>22<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>„Geld will er keins … ein Stück Kuchen reicht ihm“.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Hören, Teil 4 <span style=\"font-weight: 400; color: #555;\">· a 2 ×, b 3 ×, c 3 ×<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>23<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Böhm: Nach der Umstellung „schlafen viele Menschen schlechter“.<\u002Fspan>\n          <b>24<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">S<\u002Fspan><span>Die Moderatorin nennt den Grund; Steiner bestätigt nur („So hat man es uns damals erklärt“).<\u002Fspan>\n          <b>25<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Steiner: „Den Kühen ist egal, was auf der Uhr steht.“<\u002Fspan>\n          <b>26<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Böhm: „Gespart wird kaum etwas.“<\u002Fspan>\n          <b>27<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Steiner: die langen, hellen Abende sind „das Schönste am ganzen Jahr“.<\u002Fspan>\n          <b>28<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">S<\u002Fspan><span>Die Moderatorin nennt den Beschluss des Europäischen Parlaments von 2019.<\u002Fspan>\n          <b>29<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Böhm: die Winterzeit – „Wir sollten sie dauerhaft behalten.“<\u002Fspan>\n          <b>30<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">K<\u002Fspan><span>Steiner: „Gut, dann ist es im Winter morgens lange dunkel … das gebe ich zu.“<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Schreiben und Sprechen<\u002Fdiv>\n        <div style=\"color: #444;\">Schreiben 1 verlangt drei verschiedene Sprechhandlungen (beschreiben, begründen, vorschlagen); oft fehlt die Begründung, warum man wieder hinfahren möchte. Schreiben 2: Gisela beschreibt ihr eigenes Problem; gefragt sind eine Meinung und konkrete Vorschläge. Schreiben 3 prüft das Register: Nachbarin = Sie-Form, Entschuldigung im Voraus, Information und Einladung. Sprechen 1: Der Punkt „Wie kommt Frau Hagen nach Hause?“ wird am häufigsten vergessen. Sprechen 2: An Folie 3 (Heimatland) und Folie 4 (Meinung mit Begründung) zeigt sich, ob jemand das Niveau B1 erreicht.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Textlängen im Vergleich <span style=\"font-weight: 400; color: #555;\">· dieser Satz / Referenzsätze<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 16mm 20mm; gap: 0.8mm 2mm; color: #444;\">\n          <span style=\"font-weight: 700; color: #555;\">Wörter<\u002Fspan><span style=\"font-weight: 700; color: #555; text-align: right;\">hier<\u002Fspan><span style=\"font-weight: 700; color: #555; text-align: right;\">Original<\u002Fspan>\n          <span>Lesen 1, Blog<\u002Fspan><span style=\"text-align: right;\" data-wc=\"l1\">ca. 335<\u002Fspan><span style=\"text-align: right;\">330–360<\u002Fspan>\n          <span>Lesen 2, je Pressetext<\u002Fspan><span style=\"text-align: right;\" data-wc=\"l2\">ca. 220<\u002Fspan><span style=\"text-align: right;\">215–240<\u002Fspan>\n          <span>Lesen 3, je Anzeige<\u002Fspan><span style=\"text-align: right;\" data-wc=\"l3\">25–47<\u002Fspan><span style=\"text-align: right;\">25–60<\u002Fspan>\n          <span>Lesen 4, je Kommentar<\u002Fspan><span style=\"text-align: right;\" data-wc=\"l4\">57–60<\u002Fspan><span style=\"text-align: right;\">55–70<\u002Fspan>\n          <span>Lesen 5, Ordnung<\u002Fspan><span style=\"text-align: right;\" data-wc=\"l5\">ca. 245<\u002Fspan><span style=\"text-align: right;\">245–255<\u002Fspan>\n          <span>Hören 1, fünf Texte<\u002Fspan><span style=\"text-align: right;\" data-wc=\"h1\">ca. 355<\u002Fspan><span style=\"text-align: right;\">325–565<\u002Fspan>\n          <span>Hören 2, Monolog<\u002Fspan><span style=\"text-align: right;\" data-wc=\"h2\">ca. 410<\u002Fspan><span style=\"text-align: right;\">405–470<\u002Fspan>\n          <span>Hören 3, Gespräch<\u002Fspan><span style=\"text-align: right;\" data-wc=\"h3\">ca. 370<\u002Fspan><span style=\"text-align: right;\">310–535<\u002Fspan>\n          <span>Hören 4, Diskussion<\u002Fspan><span style=\"text-align: right;\" data-wc=\"h4\">ca. 530<\u002Fspan><span style=\"text-align: right;\">515–890<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Hörtexte 1\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\" data-appendix-page=\"1\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">22<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; top: 11mm; font-size: 26pt; font-weight: 300; letter-spacing: 0.3em; color: #9a9a9a;\">Hörtexte<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 20mm; top: 30mm; bottom: 12mm; overflow: hidden; column-count: 2; column-gap: 8mm; column-fill: auto; font-size: 9.6pt; line-height: 1.38; text-align: justify; hyphens: auto;\">\n<div style=\"font-weight: 700; font-size: 10.5pt; margin: 0 0 2mm;\">Hören, Teil 1<\u002Fdiv>\n<p style=\"margin: 0 0 2.5mm; color: #555; font-style: italic;\">Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung. Lesen Sie zuerst das Beispiel. Dazu haben Sie 10 Sekunden Zeit.<\u002Fp>\n<div style=\"font-weight: 700; margin: 2mm 0 0.5mm;\">Beispiel <span style=\"font-weight: 400; color: #555;\">· Sie hören eine Nachricht auf dem Anrufbeantworter.<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0 0 2.5mm;\">Guten Tag, Herr Schulte, hier ist die Reinigung Blitzblank. Ihr Anzug ist fertig, aber den Fleck auf der Hose konnten wir leider nicht ganz entfernen. Sie müssen deshalb nur die Hälfte bezahlen. Sie können den Anzug ab heute 15 Uhr abholen; bitte bringen Sie den Abholschein mit. Samstags haben wir übrigens nur bis 12 Uhr geöffnet. Auf Wiederhören.<\u002Fp>\n<div style=\"font-weight: 700; margin: 2mm 0 0.5mm;\">Text 1 <span style=\"font-weight: 400; color: #555;\">· Sie hören eine Durchsage in einem Freizeitpark.<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0 0 2.5mm;\">Liebe Gäste, wegen eines Gewitters sind alle Fahrgeschäfte im Freien ab sofort für etwa eine Stunde geschlossen. Die Wasserbahn und die Achterbahn öffnen wieder, sobald das Unwetter vorbei ist. Die Halle mit dem 4D-Kino und der Spielwelt bleibt geöffnet. Wer den Park jetzt verlassen möchte, bekommt an der Kasse einen Gutschein für einen weiteren Besuch in dieser Saison. Bitte suchen Sie jetzt Schutz in den Gebäuden und folgen Sie den Anweisungen unserer Mitarbeiter.<\u002Fp>\n<div style=\"font-weight: 700; margin: 2mm 0 0.5mm;\">Text 2 <span style=\"font-weight: 400; color: #555;\">· Sie hören eine Nachricht auf der Mailbox.<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0 0 2.5mm;\">Hallo Jens, hier ist Petra. Wegen morgen früh: Mein Auto ist in der Werkstatt, ich kann dich leider nicht abholen. Kannst du diesmal fahren? Dann warte ich um Viertel nach sieben vor der Bäckerei, nicht vor meinem Haus – da wird gerade die Straße aufgerissen. Und denk bitte daran, dass wir morgen Frau Kraus mitnehmen, ihr Zug fällt aus. Sie steigt am Bahnhof zu. Ruf mich kurz an, wenn das nicht klappt. Danke!<\u002Fp>\n<div style=\"font-weight: 700; margin: 2mm 0 0.5mm;\">Text 3 <span style=\"font-weight: 400; color: #555;\">· Sie hören einen Tipp im Radio.<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0 0 2.5mm;\">Und hier noch ein Tipp für Sonntag: Das Rathaus öffnet von 11 bis 17 Uhr seine Türen für alle Bürgerinnen und Bürger. Sie können den Ratssaal besichtigen, mit der Bürgermeisterin sprechen und – das gibt es nur an diesem Tag – auf den Rathausturm steigen. Für den Turm brauchen Sie allerdings eine Platzkarte, die Sie ab 10 Uhr kostenlos am Eingang bekommen. Für Kinder gibt es eine Rallye mit kleinen Preisen. Der Eintritt ist natürlich frei.<\u002Fp>\n<div style=\"font-weight: 700; margin: 2mm 0 0.5mm;\">Text 4 <span style=\"font-weight: 400; color: #555;\">· Sie hören eine Durchsage in einer Bibliothek.<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0 0 2.5mm;\">Liebe Besucherinnen und Besucher, in einer halben Stunde schließt die Stadtbibliothek. Bitte bringen Sie Bücher, die Sie ausleihen möchten, bis 19.45 Uhr zur Ausleihe. Die Rückgabe-Automaten im Eingang sind auch nach 20 Uhr noch erreichbar. Morgen bleibt die Bibliothek wegen einer Betriebsversammlung bis 14 Uhr geschlossen. Die Lesung mit der Autorin Mara Kern findet trotzdem wie geplant um 19 Uhr statt. Wir wünschen Ihnen einen schönen Abend.<\u002Fp>\n<div style=\"font-weight: 700; margin: 2mm 0 0.5mm;\">Text 5 <span style=\"font-weight: 400; color: #555;\">· Sie hören eine Nachricht auf dem Anrufbeantworter.<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0 0 2.5mm;\">Guten Tag, Frau Aydın, hier ist das Sekretariat der Grundschule am Park. Ihr Sohn Can hat Bauchschmerzen und möchte nach Hause. Er liegt gerade bei uns im Krankenzimmer, es geht ihm aber nicht schlimm. Bitte holen Sie ihn ab oder schicken Sie jemanden, der auf der Abholliste steht. Wenn Sie das nicht schaffen, rufen Sie uns bitte zurück; dann bleibt er bis zum Unterrichtsende bei uns. Vielen Dank.<\u002Fp>\n<div style=\"font-weight: 700; font-size: 10.5pt; margin: 8mm 0 2mm;\">Hören, Teil 2<\u002Fdiv>\n<p style=\"margin: 0 0 2.5mm; color: #555; font-style: italic;\">Sie hören nun einen Text. Sie hören den Text einmal. Dazu lösen Sie fünf Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c. Lesen Sie jetzt die Aufgaben 11 bis 15. Dazu haben Sie 60 Sekunden Zeit. – Sie machen eine Stadtführung durch Lübeck. Die Stadtführerin, Frau Behrendt, begrüßt die Gruppe.<\u002Fp>\n<p style=\"margin: 0 0 2mm;\">Herzlich willkommen in Lübeck! Mein Name ist Ute Behrendt, und ich zeige Ihnen in den nächsten zwei Stunden die Altstadt. Wir stehen hier vor dem Holstentor, dem bekanntesten Wahrzeichen der Stadt. Früher war es auf dem Fünfzig-Mark-Schein abgebildet – vielleicht erinnern sich einige von Ihnen noch daran.<\u002Fp>\n<p style=\"margin: 0 0 2mm;\">Das Holstentor ist übrigens etwas schief – das liegt nicht an Ihren Augen, sondern am weichen Boden, auf dem es steht. Wir gehen gleich hindurch, und auf der anderen Seite sehen Sie, wie dick die Mauern sind.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Hörtexte 2\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\" data-appendix-page=\"1\">\n  <div style=\"position: absolute; right: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; justify-content: flex-end; padding-right: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">23<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 20mm; top: 18mm; bottom: 12mm; overflow: hidden; column-count: 2; column-gap: 8mm; column-fill: auto; font-size: 9.6pt; line-height: 1.38; text-align: justify; hyphens: auto;\">\n<p style=\"margin: 0 0 2mm;\">Bevor wir losgehen, ein paar Hinweise. Wir sind eine große Gruppe, deshalb trage ich diesen roten Schirm. Wenn Sie mich in den engen Gassen einmal aus den Augen verlieren, schauen Sie einfach nach oben. Und falls wirklich jemand verloren geht: Unser Treffpunkt ist immer der Brunnen auf dem Marktplatz.<\u002Fp>\n<p style=\"margin: 0 0 2mm;\">Unser Weg führt zuerst über die Trave zu den alten Salzspeichern und dann hinauf zur Marienkirche. In der Kirche wird um zwölf ein kurzes Orgelkonzert gespielt; wir werden ungefähr pünktlich da sein und eine Viertelstunde zuhören. Der Eintritt in die Kirche kostet normalerweise zwei Euro, für unsere Gruppe ist er im Preis der Führung enthalten. In der Kirche liegen noch die Glocken, die im Zweiten Weltkrieg heruntergefallen sind – ein sehr bewegender Ort. Bitte bleiben Sie dort hinter der Absperrung.<\u002Fp>\n<p style=\"margin: 0 0 2mm;\">Danach gehen wir durch die Gänge und Höfe, das sind schmale Wege zwischen den Häusern. Dort wohnen bis heute Menschen. Bitte seien Sie leise, und fotografieren Sie nicht in die Fenster hinein.<\u002Fp>\n<p style=\"margin: 0 0 2mm;\">Unsere Pause machen wir bei Niederegger, dem berühmten Marzipancafé. Dort haben Sie zwanzig Minuten Zeit. Die Toiletten im Café dürfen Sie benutzen, auch wenn Sie nichts kaufen – das habe ich vorher mit dem Café abgesprochen. Wer Marzipan als Geschenk kaufen möchte, sollte das am besten dort tun; in den Geschäften am Bahnhof ist es oft teurer.<\u002Fp>\n<p style=\"margin: 0 0 2mm;\">Die Führung endet am Rathaus, nicht hier am Holstentor. Von dort sind es etwa zehn Minuten zu Fuß zurück zum Bahnhof. Wer möchte, kann um halb drei noch an einer kurzen Führung durch das Rathaus teilnehmen. Sie kostet vier Euro extra, und die Karten bekommen Sie direkt im Rathaus.<\u002Fp>\n<p style=\"margin: 0 0 2mm;\">Noch etwas zum Wetter: Es soll heute trocken bleiben, aber an der Ostsee ändert sich das schnell. Wer keinen Regenschirm dabeihat – im Café kann man welche kaufen. Und falls es wirklich regnet, gehen wir einfach öfter in die Kirchen.<\u002Fp>\n<p style=\"margin: 0 0 2mm;\">So, haben alle bequeme Schuhe an? Wir haben einiges an Kopfsteinpflaster vor uns. Dann geht es los – bitte folgen Sie dem roten Schirm!<\u002Fp>\n<div style=\"font-weight: 700; font-size: 10.5pt; margin: 8mm 0 2mm;\">Hören, Teil 3<\u002Fdiv>\n<p style=\"margin: 0 0 2.5mm; color: #555; font-style: italic;\">Sie hören nun ein Gespräch. Sie hören das Gespräch einmal. Dazu lösen Sie sieben Aufgaben. Wählen Sie: Sind die Aussagen Richtig oder Falsch? Lesen Sie jetzt die Aufgaben 16 bis 22. Dazu haben Sie 60 Sekunden Zeit. – Sie sind im Treppenhaus und hören, wie sich zwei Nachbarinnen, Frau Lehmann und Frau Çelik, unterhalten.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Çelik:<\u002Fb> Guten Morgen, Frau Lehmann! Na, ist Ihre neue Küche endlich da? Ich habe gestern den Lastwagen gesehen.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Lehmann:<\u002Fb> Ach, hören Sie bloß auf. Ja, sie ist geliefert worden – aber nicht die, die wir bestellt hatten. Wir wollten weiße Schränke, gekommen sind graue. Und der Herd hat nicht in die Lücke gepasst.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Çelik:<\u002Fb> Das gibt’s doch nicht! Und was machen Sie jetzt?<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Lehmann:<\u002Fb> Mein Mann hat sofort im Möbelhaus angerufen. Die Verkäuferin war sehr freundlich und hat sich entschuldigt. Die richtigen Schränke kommen in drei Wochen, und den Aufbau bezahlt die Firma. Bis dahin kochen wir auf einer kleinen Kochplatte im Wohnzimmer.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Çelik:<\u002Fb> Und was sagen Ihre Enkel dazu? Die sind doch am Wochenende immer bei Ihnen.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Lehmann:<\u002Fb> Die finden es lustig. Sie sagen, das ist wie Camping im Wohnzimmer.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Çelik:<\u002Fb> Drei Wochen ohne Küche – das stelle ich mir schwierig vor.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Lehmann:<\u002Fb> Ach, es geht. Wir gehen öfter essen, und unsere Tochter bringt uns am Wochenende etwas vorbei. Ganz ehrlich: Ich ärgere mich mehr über den Urlaub, den wir für die Lieferung genommen haben. Den hätten wir uns sparen können. Aber erzählen Sie mal: Wie gefällt Ihrem Mann denn die Rente?<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Çelik:<\u002Fb> Gut, glaube ich. Die ersten zwei Monate hat er fast nur geschlafen und Zeitung gelesen. Ich hatte schon Angst, dass er sich langweilt. Aber dann hat ihm unser Enkel zum Geburtstag einen Kurs bei einem Tischler geschenkt.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Lehmann:<\u002Fb> Einen Tischlerkurs? Das passt ja zu ihm, er hat doch immer alles selbst repariert.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Çelik:<\u002Fb> Genau. Seitdem steht er jeden Tag im Keller und baut. Zuerst ein Vogelhaus, dann einen Schuhschrank, und jetzt einen Tisch für den Balkon. Der Keller ist voller Holz, ich finde meine Waschmaschine kaum noch.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Lehmann:<\u002Fb> Hauptsache, er ist zufrieden.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Çelik:<\u002Fb> Das ist er. Und wissen Sie was? Er hat angeboten, auch für andere Leute im Haus etwas zu bauen. Herr Pohl aus dem dritten Stock hat schon ein Regal bestellt.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Lehmann:<\u002Fb> Und Ihnen gefällt das?<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Çelik:<\u002Fb> Ja, solange er nicht auch noch im Wohnzimmer sägt.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Hörtexte 3\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\" data-appendix-page=\"1\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">24<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 20mm; top: 18mm; bottom: 12mm; overflow: hidden; column-count: 2; column-gap: 8mm; column-fill: auto; font-size: 9.6pt; line-height: 1.38; text-align: justify; hyphens: auto;\">\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Lehmann:<\u002Fb> Dann frage ich ihn vielleicht auch – für unsere neue Küche bräuchten wir noch ein Gewürzregal. Aber nur, wenn er Geld dafür nimmt.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Çelik:<\u002Fb> Geld will er keins. Er sagt, ein Stück Kuchen reicht ihm.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Lehmann:<\u002Fb> Das lässt sich machen. Ich backe am Sonntag sowieso.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Çelik:<\u002Fb> Dann sage ich es ihm heute Abend. Er freut sich bestimmt.<\u002Fp>\n<div style=\"font-weight: 700; font-size: 10.5pt; margin: 8mm 0 2mm;\">Hören, Teil 4<\u002Fdiv>\n<p style=\"margin: 0 0 2.5mm; color: #555; font-style: italic;\">Sie hören nun eine Diskussion. Sie hören die Diskussion zweimal. Dazu lösen Sie acht Aufgaben. Ordnen Sie die Aussagen zu: Wer sagt was? Lesen Sie jetzt die Aussagen 23 bis 30. Dazu haben Sie 60 Sekunden Zeit. – Die Moderatorin der Radiosendung „Standpunkte“ diskutiert mit der Schlafforscherin Katrin Böhm und dem Landwirt Georg Steiner über die Frage: „Brauchen wir die Zeitumstellung noch?“<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Moderatorin:<\u002Fb> Guten Abend und willkommen bei „Standpunkte“. In der Nacht zum Sonntag ist es wieder so weit: Die Uhren werden eine Stunde zurückgestellt, und wir bekommen eine Stunde mehr Schlaf – zumindest theoretisch. Seit 1980 stellen wir in Deutschland zweimal im Jahr die Uhren um. Ob das noch sinnvoll ist, darüber spreche ich mit der Schlafforscherin Katrin Böhm und mit Georg Steiner, der einen Bauernhof mit sechzig Kühen hat. Frau Böhm, was macht die Umstellung mit unserem Körper?<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Böhm:<\u002Fb> Mehr, als viele denken. Unsere innere Uhr richtet sich nach dem Tageslicht, nicht nach dem Wecker. Wenn wir die Uhr plötzlich um eine Stunde verstellen, braucht der Körper mehrere Tage, manchmal sogar zwei Wochen, um sich anzupassen. In dieser Zeit schlafen viele Menschen schlechter, sie sind tagsüber müde und können sich schlechter konzentrieren.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Moderatorin:<\u002Fb> Gilt das für alle Menschen gleich?<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Böhm:<\u002Fb> Nein. Besonders schwer haben es Kinder, ältere Menschen und Leute, die im Schichtdienst arbeiten. Bei manchen dauert die Umstellung im Frühjahr deutlich länger als im Herbst.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Moderatorin:<\u002Fb> Herr Steiner, merken Ihre Kühe die Zeitumstellung?<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Steiner:<\u002Fb> Und wie! Den Kühen ist egal, was auf der Uhr steht. Sie wollen jeden Tag zur gleichen Zeit gemolken werden, und wenn ich plötzlich eine Stunde früher komme, sind sie unruhig und geben weniger Milch. Deshalb verschiebe ich die Melkzeit jeden Tag nur um zehn Minuten. Nach einer Woche haben wir es dann geschafft.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Moderatorin:<\u002Fb> Eingeführt wurde die Sommerzeit damals, um Energie zu sparen. Die Idee war: Wenn es abends länger hell ist, braucht man weniger Licht.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Steiner:<\u002Fb> So hat man es uns damals erklärt, ja.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Böhm:<\u002Fb> Aber das funktioniert nicht. Gespart wird kaum etwas, das zeigen inzwischen viele Untersuchungen. Was man abends an Licht spart, verbraucht man morgens zusätzlich fürs Heizen.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Moderatorin:<\u002Fb> Herr Steiner, wie ist das bei Ihnen persönlich?<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Steiner:<\u002Fb> Ich mag die Sommerzeit, ehrlich gesagt. Im Juni ist es bei uns bis halb elf hell. Nach der Arbeit im Stall sitze ich dann noch mit meiner Familie im Garten. Diese langen, hellen Abende sind für mich das Schönste am ganzen Jahr.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Böhm:<\u002Fb> Für den Schlaf sind helle Abende allerdings eher ungünstig: Wer abends lange Licht hat, wird später müde und kommt morgens schlecht aus dem Bett.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Moderatorin:<\u002Fb> Politisch ist das Thema übrigens längst entschieden – jedenfalls auf dem Papier. Das Europäische Parlament hat schon 2019 dafür gestimmt, die Zeitumstellung abzuschaffen. Passiert ist seitdem aber nichts, weil sich die Länder nicht einigen können, ob dann immer Sommer- oder immer Winterzeit gelten soll.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Böhm:<\u002Fb> Und genau da liegt das Problem. Aus medizinischer Sicht wäre die Winterzeit die richtige Wahl, denn sie passt am besten zum natürlichen Licht. Wir sollten sie dauerhaft behalten.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Steiner:<\u002Fb> Da sehe ich das anders als Frau Böhm. Ich wäre für eine Sommerzeit, die das ganze Jahr gilt. Gut, dann ist es im Winter morgens lange dunkel, wenn die Kinder zur Schule gehen – das gebe ich zu. Aber das nehme ich für die hellen Abende in Kauf.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Moderatorin:<\u002Fb> Frau Böhm, was raten Sie unseren Hörerinnen und Hörern für die nächsten Tage?<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Böhm:<\u002Fb> Gehen Sie morgens möglichst nach draußen, auch wenn es nur zehn Minuten sind. Das Tageslicht hilft der inneren Uhr am meisten. Und trinken Sie abends keinen Kaffee mehr.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Moderatorin:<\u002Fb> Frau Böhm, Herr Steiner, vielen Dank für das Gespräch. Und Ihnen, liebe Hörerinnen und Hörer, eine gute Nacht – mit einer Stunde mehr Schlaf.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showKey&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Lehrkraft&quot;},&quot;showAppendix&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Lehrkraft&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      keyAttr: (this.props.showKey ?? false) ? 'on' : 'off',\n      appendixAttr: (this.props.showAppendix ?? true) ? 'on' : 'off'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
