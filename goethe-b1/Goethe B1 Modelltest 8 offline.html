, Ja oder Nein?<\u002Fdiv>\n    <div style=\"font-size: 10.5pt; line-height: 1.45; margin: 0 0 4mm;\">In einer Zeitschrift lesen Sie Kommentare zu einem Artikel über Schulen, an denen alle Schülerinnen und Schüler die gleiche Kleidung tragen.<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.6mm 12mm; font-size: 10.5pt; margin: 0 0 4.5mm; padding: 3mm 4mm; border: 0.3mm solid #1a1a1a;\">\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center; color: #444;\"><b>0<\u002Fb><span>Karin <span style=\"color: #8c8c8c; font-size: 8pt;\">Beispiel<\u002Fspan><\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center; background: #1a1a1a; color: #fff;\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center;\"><b>24<\u002Fb><span>Lena<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\" class=\"k\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center;\"><b>20<\u002Fb><span>Sandra<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\" class=\"k\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center;\"><b>25<\u002Fb><span>Ibrahim<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\" class=\"k\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center;\"><b>21<\u002Fb><span>Michael<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\" class=\"k\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center;\"><b>26<\u002Fb><span>Peter<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\" class=\"k\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center;\"><b>22<\u002Fb><span>Julia<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\" class=\"k\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center;\"><b>23<\u002Fb><span>Oliver<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\" class=\"k\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.14em; text-transform: uppercase; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 1mm; margin-bottom: 3mm; display: flex; justify-content: space-between;\"><span>Leserkommentare<\u002Fspan><span style=\"color: #555; letter-spacing: 0.04em; text-transform: none;\">www.schule-und-familie.de/forum<\u002Fspan><\u002Fdiv>\n    <div style=\"column-count: 2; column-gap: 7mm; font-size: 9.4pt; line-height: 1.35; text-align: justify; hyphens: auto;\">\n      <div style=\"break-inside: avoid; margin-bottom: 2mm; color: #444;\"><b style=\"color: #1a1a1a;\">Beispiel<\u002Fb> Meine Kinder sollen in der Schule lernen, selbst zu entscheiden – auch, was sie anziehen. Kleidung ist für Jugendliche eine Möglichkeit, zu zeigen, wer sie sind. Wenn alle gleich aussehen, ändert das nichts daran, dass manche Eltern mehr Geld haben als andere. Das sieht man dann eben an den Handys, den Taschen oder an den Schuhen. Ich halte deshalb nichts davon.<div style=\"text-align: right; font-weight: 500; color: #555;\">Karin, 48, Freiburg<\u002Fdiv><\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 2mm;\"><b>20<\u002Fb> Jeden Morgen der gleiche Streit: Meine Tochter steht eine halbe Stunde vor dem Kleiderschrank und findet nichts, was „gut genug“ ist. An der Schule meines Neffen in Irland tragen dagegen alle dunkelblaue Pullover und graue Hosen, und kein Mensch diskutiert darüber. So etwas wünsche ich mir auch für unsere Schule – es würde uns allen viele Nerven sparen.<div style=\"text-align: right; font-weight: 500; color: #555;\">Sandra, 41, Augsburg<\u002Fdiv><\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 2mm;\"><b>21<\u002Fb> Als unsere Schule vor zwei Jahren einheitliche Schulshirts eingeführt hat, war ich als Lehrer skeptisch. Ich hielt das für altmodisch. Heute sehe ich das anders: Auf Ausflügen erkennt man unsere Schüler sofort, und das Mobbing wegen Kleidung ist deutlich zurückgegangen. Die Farben haben die Schülerinnen und Schüler übrigens selbst ausgesucht. Auch die Eltern sind inzwischen zufrieden.<div style=\"text-align: right; font-weight: 500; color: #555;\">Michael, 56, Wien<\u002Fdiv><\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 2mm;\"><b>22<\u002Fb> Ich verstehe die Eltern, die sich über teure Markenkleidung ärgern. Aber eine Uniform ist nicht die Lösung. Sie kostet auch Geld, oft mehr als normale Kleidung, und man braucht mehrere Teile zum Wechseln. Außerdem wachsen Kinder ständig. Gerade Familien mit mehreren Kindern hätten es dann schwer. Besser wäre es, mit den Jugendlichen darüber zu reden, was wirklich wichtig ist.<div style=\"text-align: right; font-weight: 500; color: #555;\">Julia, 37, Erfurt<\u002Fdiv><\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 2mm;\"><b>23<\u002Fb> Ich bin nur dafür, wenn die Kleidung bequem ist und die Schüler bei der Auswahl mitbestimmen dürfen. Genau so hat es die Schule meiner Tochter gemacht: Die Klassen haben über drei Entwürfe abgestimmt, und jetzt gibt es Kapuzenpullis mit dem Schullogo. Meine Tochter trägt ihren sogar am Wochenende – das sagt doch alles. Gezwungen fühlt sich dort niemand.<div style=\"text-align: right; font-weight: 500; color: #555;\">Oliver, 44, Potsdam<\u002Fdiv><\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 2mm;\"><b>24<\u002Fb> Meine Eltern und meine Lehrer finden Schuluniformen eine tolle Idee. Ich sehe das anders. Ich verbringe den größten Teil des Tages in der Schule, und dann soll ich nicht einmal selbst entscheiden dürfen, was ich trage? Meine Kleidung gehört zu mir, genauso wie meine Musik und meine Frisur. Außerdem lernen wir doch nicht besser, nur weil alle gleich aussehen.<div style=\"text-align: right; font-weight: 500; color: #555;\">Lena, 16, Münster<\u002Fdiv><\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 2mm;\"><b>25<\u002Fb> Statt einer Uniform sollte man lieber einfache Regeln festlegen: keine Kleidung mit Beleidigungen oder Werbung für Alkohol und nichts, was zu kurz ist. Wer sich nicht daran hält, muss sich eben umziehen. Mehr braucht es nicht. So behalten die Schüler ihre Freiheit, und die Schule hat trotzdem einen gewissen Rahmen. An unserer Schule funktioniert das seit Jahren gut.<div style=\"text-align: right; font-weight: 500; color: #555;\">Ibrahim, 39, Würzburg<\u002Fdiv><\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 2mm;\"><b>26<\u002Fb> Ich bin in Großbritannien zur Schule gegangen und habe jeden Tag eine Krawatte getragen. Geschadet hat mir das nicht – im Gegenteil: Wir haben uns als Gemeinschaft gefühlt, und morgens ging alles schneller. Viele meiner alten Klassenkameraden sehen das genauso. Natürlich muss die Kleidung bezahlbar sein. Ich verstehe nicht, warum man hier so viel Angst vor gleicher Kleidung hat.<div style=\"text-align: right; font-weight: 500; color: #555;\">Peter, 71, Hannover<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Lesen Teil 5\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">8<\u002Fdiv>\n  <div style=\"position: absolute; left: 0; top: 54mm; width: 19mm; height: 56mm; background: #e8e8e8; display: flex; align-items: center; justify-content: center;\"><div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.14em; color: #222; white-space: nowrap;\">Lesen<\u002Fdiv><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 6.5mm; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1mm; text-align: right; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><span style=\"color: #9a9a9a;\">Kandidatenblätter · 65 Minuten<\u002Fspan> <b>Lesen<\u002Fb><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 19mm; bottom: 14mm; overflow: hidden;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 4mm;\"><div style=\"font-size: 14pt; font-weight: 700;\">Lesen <span style=\"color: #8c8c8c; font-weight: 500;\">Teil 5<\u002Fspan><\u002Fdiv><div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 9pt; color: #555;\">Arbeitszeit: 10 Minuten<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-style: italic; font-size: 10.5pt; line-height: 1.45; margin: 0 0 3mm;\">Lesen Sie die Aufgaben 27 bis 30 und den Text dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.<\u002Fdiv>\n    <div style=\"font-size: 10.5pt; line-height: 1.45; margin: 0 0 5mm;\">Sie möchten mit dem Fernbus fahren und lesen die Beförderungsbedingungen.<\u002Fdiv>\n    <div style=\"border: 0.3mm solid #1a1a1a; padding: 3.5mm 5mm 3mm; margin: 0 0 6mm; font-size: 9.8pt; line-height: 1.48; text-align: justify; hyphens: auto;\">\n      <div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 1.5mm; margin-bottom: 2.5mm;\">Beförderungsbedingungen · FernExpress<\u002Fdiv>\n      <p style=\"margin: 0 0 1.8mm;\"><b>Fahrkarten:<\u002Fb> Ihre Fahrkarte können Sie online, in der App oder beim Fahrer kaufen; beim Fahrer zahlen Sie allerdings zwei Euro mehr. Bitte zeigen Sie beim Einsteigen Ihre Fahrkarte und einen gültigen Ausweis.<\u002Fp>\n      <p style=\"margin: 0 0 1.8mm;\"><b>Umbuchung und Stornierung:<\u002Fb> Bis 15 Minuten vor der Abfahrt können Sie Ihre Fahrt online kostenlos auf einen anderen Tag oder eine andere Uhrzeit umbuchen. Wer die Fahrt ganz absagt, erhält einen Gutschein über den Fahrpreis, aber kein Bargeld.<\u002Fp>\n      <p style=\"margin: 0 0 1.8mm;\"><b>Gepäck:<\u002Fb> Pro Person sind ein Koffer bis 20 Kilogramm und ein kleines Handgepäckstück im Preis enthalten. Ein zweiter Koffer kostet zwei Euro extra und muss vorher online gebucht werden. Fahrräder nehmen wir nur auf Strecken mit Fahrradträger mit; dafür brauchen Sie eine eigene Fahrradkarte. Kinderwagen und Rollstühle melden Sie bitte vorher an; ihr Transport ist kostenlos.<\u002Fp>\n      <p style=\"margin: 0 0 1.8mm;\"><b>Kinder und Jugendliche:<\u002Fb> Kinder unter 6 Jahren reisen nur in Begleitung eines Erwachsenen und brauchen einen eigenen Kindersitz. Kinder von 6 bis 14 Jahren dürfen nur mit einer unterschriebenen Erlaubnis der Eltern allein fahren; ab 15 Jahren ist keine Erlaubnis mehr nötig.<\u002Fp>\n      <p style=\"margin: 0 0 1.8mm;\"><b>Pünktlichkeit:<\u002Fb> Bitte seien Sie spätestens 15 Minuten vor der Abfahrt an der richtigen Haltestelle. Bei mehr als zwei Stunden Verspätung können Sie die Hälfte des Fahrpreises zurückverlangen. Fällt eine Fahrt ganz aus, bringt Sie der nächste Bus ohne Aufpreis ans Ziel.<\u002Fp>\n      <p style=\"margin: 0;\"><b>An Bord:<\u002Fb> Essen und Trinken sind an Bord erlaubt, Alkohol jedoch nicht. Bitte telefonieren Sie leise und hören Sie Musik nur mit Kopfhörern. Haustiere dürfen nicht mitfahren; Assistenzhunde sind davon ausgenommen.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4mm 8mm; font-size: 10pt; line-height: 1.38;\">\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm;\">\n        <b>27<\u002Fb><span>Wer seine Fahrkarte im Bus kauft, …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><span>bekommt sie etwas günstiger als im Internet.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><span>muss beim Einsteigen keinen Ausweis zeigen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">c<\u002Fb><span>zahlt einen Aufpreis.<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm;\">\n        <b>28<\u002Fb><span>Wer an einem anderen Tag fahren möchte, …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><span>bekommt sein Geld bar zurück.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">b<\u002Fb><span>kann die Fahrt gratis verschieben.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><span>muss dafür eine zusätzliche Gebühr bezahlen.<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm;\">\n        <b>29<\u002Fb><span>Ein Zwölfjähriger darf allein fahren, wenn …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">a<\u002Fb><span>seine Eltern es schriftlich erlaubt haben.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><span>er einen eigenen Kindersitz mitbringt und benutzt.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><span>er mindestens sechs Jahre alt ist und einen Ausweis hat.<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm;\">\n        <b>30<\u002Fb><span>Wer mit seinem Hund verreisen möchte, …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><span>muss für den Hund eine eigene Fahrkarte kaufen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\" mm minmax(0, 1fr); row-gap: 1mm;\"><b>02<\u002Fb><span>Herr Schulte soll …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1; background: #1a1a1a; color: #fff;\">a<\u002Fb><span>den Abholschein mitbringen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><span>den ganzen Preis bezahlen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><span>am Samstagnachmittag kommen.<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-bottom: 4mm;\">\n      <div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 9pt; letter-spacing: 0.1em; text-transform: uppercase; color: #555; margin-bottom: 1.1mm; border-bottom: 0.25mm solid #d0d0d0; padding-bottom: 0.5mm;\">Text 1<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 30mm; align-items: center; margin-bottom: 1.2mm;\"><b>1<\u002Fb><span>Im ganzen Park ist jetzt alles geschlossen.<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: ustify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><span>öffnet die Bibliothek wie immer zur gewohnten Zeit.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">c<\u002Fb><span>öffnet die Bibliothek erst am Nachmittag.<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 9pt; letter-spacing: 0.1em; text-transform: uppercase; color: #555; margin-bottom: 1.1mm; border-bottom: 0.25mm solid #d0d0d0; padding-bottom: 0.5mm;\">Text 5<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 30mm; align-items: center; margin-bottom: 1.2mm;\"><b>9<\u002Fb><span>Can muss sofort zu einem Arzt.<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\">Richtig<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\" class=\"k\">Falsch<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm;\"><b>10<\u002Fb><span>Frau Aydın kann …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">a<\u002Fb><span>auch ein isplay: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">b<\u002Fb><span>soll zu einem vorher vereinbarten Ort gehen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><span>soll am Holstentor auf die anderen warten.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1.2mm;\"><b>12<\u002Fb><span>Für die Marienkirche …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">a<\u002Fb><span>müssen die Teilnehmer nichts extra zahlen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><span>braucht man an der Kasse noch eine eigene Eintrittskarte.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><span>hat die Gruppe nur am Nachmittag Zeit.<\u002Fspan><\u002Fspan><\ ntent: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">c<\u002Fb><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Schreiben\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; right: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; justify-content: flex-end; padding-right: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">13<\u002Fdiv>\n  <div style=\"position: absolute; right: 0; top: 54mm; width: 19mm; height: 56mm; background: #e8e8e8; display: flex; align-items: center; justify-content: center;\"><div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.14em; color: #222; white-space: nowrap;\">Schreiben<\u002Fdiv><\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 28mm; top: 6.5mm; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1mm; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><span style=\"color: #9a9a9a;\">Kandidatenblätter · 60 Minuten<\u002Fspan> <b>Schreiben<\u002Fb><\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 28mm; top: 19mm; bottom: 14mm; overflow: hidden; font-size: 10pt; line-height: 1.42;\">\n    <div style=\"font-size: 14pt; font-weight: 700; margin: 0 0 4mm;\">Schreiben<\u002Fdiv>\n    <div style=\"font-size: 10pt; color: #555; line-height: 1.5; margin: 0 0 5mm;\">Das Modul Schreiben besteht aus drei Teilen. In den Aufgaben 1 und 3 schreiben Sie E-Mails, in Aufgabe 2 schreiben Sie einen Diskussionsbeitrag. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf den Antwortbogen.<\u002Fdiv>\n\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; border-top: 0.4mm solid #1a1a1a; padding-top: 2mm; margin: 0 0 2mm;\"><div style=\"font-size: 12pt; font-weight: 700;\">Aufgabe 1<\u002Fdiv><div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 9pt; color: #555;\">Arbeitszeit: 20 Minuten<\u002Fdiv><\u002Fdiv>\n    <p style=\"margin: 0 0 2mm;\">Sie waren am Wochenende auf einem Musikfestival. Ein Freund/Eine Freundin von Ihnen konnte leider nicht mitkommen.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: 5mm minmax(0, 1fr); row-gap: 0.8mm; margin: 0 0 2mm;\"><span>–<\u002Fspan><span>Beschreiben Sie: Wie war das Festival?<\u002Fspan><span>–<\u002Fspan><span>Begründen Sie: Warum möchten Sie nächstes Jahr wieder hinfahren?<\u002Fspan><span>–<\u002Fspan><span>Machen Sie einen Vorschlag für einen gemeinsamen Konzertbesuch.<\u002Fspan><\u002Fdiv>\n    <p style=\"margin: 0 0 13mm; font-style: italic;\">Schreiben Sie eine E-Mail (circa 80 Wörter). Schreiben Sie etwas zu allen drei Punkten. Achten Sie auf den Textaufbau (Anrede, Einleitung, Reihenfolge der Inhaltspunkte, Schluss).<\u002Fp>\n\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; border-top: 0.4mm solid #1a1a1a; padding-top: 2mm; margin: 0 0 2mm;\"><div style=\"font-size: 12pt; font-weight: 700;\">Aufgabe 2<\u002Fdiv><div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 9pt; color: #555;\">Arbeitszeit: 25 Minuten<\u002Fdiv><\u002Fdiv>\n    <p style=\"margin: 0 0 3mm;\">Sie haben im Fernsehen eine Sendung zum Thema „Lebensmittel wegwerfen – muss das sein?“ gesehen. Im Online-Gästebuch der Sendung finden Sie folgende Meinung:<\u002Fp>\n    <div style=\"border: 0.3mm solid #1a1a1a; max-width: 128mm; margin: 0 0 3mm; font-size: 10pt;\">\n      <div style=\"display: flex; justify-content: space-between; background: #ececec; padding: 1.5mm 4mm; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><b>www.tv-verbraucher.de<\u002Fb><span>Gästebuch<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 3mm 4mm; line-height: 1.5;\"><div style=\"color: #555; font-size: 8pt; margin-bottom: 1.5mm;\">Gisela · 21.09. 20:41 Uhr<\u002Fdiv>Ich kaufe für meine Familie jede Woche viel zu viel ein, weil ich Angst habe, dass etwas fehlt. Am Ende werfe ich Brot, Joghurt und Gemüse weg, und das tut mir jedes Mal leid. Meine Nachbarin plant jede Mahlzeit vorher, aber dafür habe ich neben der Arbeit keine Zeit.<\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 13mm; font-style: italic;\">Schreiben Sie nun Ihre Meinung zum Thema (circa 80 Wörter).<\u002Fp>\n\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; border-top: 0.4mm solid #1a1a1a; padding-top: 2mm; margin: 0 0 2mm;\"><div style=\"font-size: 12pt; font-weight: 700;\">Aufgabe 3<\u002Fdiv><div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 9pt; color: #555;\">Arbeitszeit: 15 Minuten<\u002Fdiv><\u002Fdiv>\n    <p style=\"margin: 0 0 2mm;\">Sie feiern am Samstagabend Ihren Geburtstag in Ihrer Wohnung. Es könnte etwas laut werden.<\u002Fp>\n    <p style=\"margin: 0 0 2mm;\">Schreiben Sie an Ihre Nachbarin, Frau Winter. Entschuldigen Sie sich im Voraus, informieren Sie sie über die Feier und laden Sie sie ein.<\u002Fp>\n    <p style=\"margin: 0; font-style: italic;\">Schreiben Sie eine E-Mail (circa 40 Wörter). Vergessen Sie nicht die Anrede und den Gruß am Schluss.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Sprechen Teil 1\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">14<\u002Fdiv>\n  <div style=\"position: absolute; left: 0; top: 54mm; width: 19mm; height: 56mm; background: #e8e8e8; display: flex; align-items: center; justify-content: center;\"><div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.14em; color: #222; white-space: nowrap;\">Sprechen<\u002Fdiv><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 6.5mm; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1mm; text-align: right; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><span style=\"color: #9a9a9a;\">Kandidatenblätter · 15 Minuten für zwei Teilnehmende<\u002Fspan> <b>Sprechen<\u002Fb><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 19mm; bottom: 14mm; overflow: hidden; font-size: 10.5pt; line-height: 1.5;\">\n    <div style=\"font-size: 14pt; font-weight: 700; margin: 0 0 4mm;\">Sprechen<\u002Fdiv>\n    <div style=\"font-size: 10pt; color: #555; line-height: 1.5; margin: 0 0 8mm;\">Das Modul Sprechen besteht aus drei Teilen. In Teil 1 planen Sie etwas gemeinsam mit Ihrem Partner/Ihrer Partnerin (circa 3 Minuten). In Teil 2 präsentieren Sie ein Thema (circa 3 Minuten); wählen Sie Thema 1 oder Thema 2. In Teil 3 sprechen Sie über Ihr Thema und das Ihres Partners/Ihrer Partnerin (circa 2 Minuten). Ihre Vorbereitungszeit beträgt 15 Minuten. Sie bereiten sich allein vor und dürfen sich Notizen machen. In der Prüfung sollen Sie frei sprechen.<\u002Fdiv>\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 5mm;\"><div style=\"font-size: 12pt; font-weight: 700;\">Teil 1 <span style=\"font-weight: 500; color: #555;\">Gemeinsam etwas planen<\u002Fspan><\u002Fdiv><div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 9pt; color: #555;\">Dauer: circa drei Minuten<\u002Fdiv><\u002Fdiv>\n    <p style=\"margin: 0 0 3mm; text-align: justify;\">Ihre Nachbarin, Frau Hagen, muss für eine Woche ins Krankenhaus. Sie und Ihr Partner/Ihre Partnerin möchten ihr in dieser Zeit helfen.<\u002Fp>\n    <p style=\"margin: 0 0 8mm; text-align: justify;\">Sprechen Sie über die Punkte unten, machen Sie Vorschläge und reagieren Sie auf die Vorschläge Ihres Gesprächspartners/Ihrer Gesprächspartnerin. Planen und entscheiden Sie gemeinsam, was Sie tun möchten.<\u002Fp>\n    <div style=\"border: 0.3mm solid #1a1a1a; padding: 6mm 8mm; max-width: 100mm; line-height: 1.8;\">\n      <div style=\"font-weight: 700; margin-bottom: 2mm;\">Hilfe für Frau Hagen<\u002Fdiv>\n      <div>– Wer kümmert sich um die Katze?<\u002Fdiv>\n      <div>– Post und Blumen?<\u002Fdiv>\n      <div>– Besuch im Krankenhaus?<\u002Fdiv>\n      <div>– Wie kommt Frau Hagen nach Hause?<\u002Fdiv>\n      <div>– …<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Sprechen Teil 2 Thema 1\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; right: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; justify-content: flex-end; padding-right: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">15<\u002Fdiv>\n  <div style=\"position: absolute; right: 0; top: 54mm; width: 19mm; height: 56mm; background: #e8e8e8; display: flex; align-items: center; justify-content: center;\"><div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.14em; color: #222; white-space: nowrap;\">Sprechen<\u002Fdiv><\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 28mm; top: 6.5mm; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1mm; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><span style=\"color: #9a9a9a;\">Kandidatenblätter · 15 Minuten für zwei Teilnehmende<\u002Fspan> <b>Sprechen<\u002Fb><\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 28mm; top: 19mm; bottom: 14mm; overflow: hidden; font-size: 10pt; line-height: 1.4;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 3mm;\"><div style=\"font-size: 12pt; font-weight: 700;\">Teil 2 <span style=\"font-weight: 500; color: #555;\">Ein Thema präsentieren<\u002Fspan><\u002Fdiv><div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 9pt; color: #555;\">Dauer: circa drei Minuten<\u002Fdiv><\u002Fdiv>\n    <p style=\"margin: 0 0 4mm; text-align: justify;\">Wählen Sie ein Thema (Thema 1 oder Thema 2) aus. Sie sollen Ihren Zuhörerinnen und Zuhörern ein aktuelles Thema präsentieren. Dazu finden Sie hier fünf Folien. Folgen Sie den Anweisungen links und schreiben Sie Ihre Notizen und Ideen rechts daneben.<\u002Fp>\n    <div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 10pt; letter-spacing: 0.12em; text-transform: uppercase; border-bottom: 0.4mm solid #1a1a1a; padding-bottom: 1mm; margin-bottom: 4mm;\">Thema 1<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 44mm 62mm min mm;\"><b>Nach Ihrer Präsentation:<\u002Fb> Reagieren Sie auf die Rückmeldung und auf die Fragen der Prüfer/-innen und des Gesprächspartners/der Gesprächspartnerin.<\u002Fp>\n      <p style=\"margin: 0 0 1mm;\"><b>Nach der Präsentation Ihres Partners/Ihrer Partnerin:<\u002Fb><\u002Fp>\n      <div style=\"display: grid; grid-template-columns: 6mm minmax(0, 1fr); row-gap: 0.8mm;\"><span>a)<\u002Fspan><span>Geben Sie eine Rückmeldung zur Präsentation Ihres Partners/Ihrer Partnerin (z. B. wie Ihnen die Präsentation gefallen hat, was für Sie neu oder besonders interessant war usw.).<\u002Fspan><span>b)<\u002Fspan><span>Stellen Sie auch eine Frage zur Präsentation Ihres Partners/Ihrer Partnerin.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Lösungsschlüssel\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\" data-appendix-page=\"1\">\n  <div style=\"position: absolute; right: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; justify-content: flex-end; padding-right: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">17<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 28mm; top: 19mm; bottom: 14mm; overflow: hidden;\">\n    <div style=\"font-size: 26pt; font-weight: 300; letter-spacing: 0.3em; color: #9a9a9a; margin-bottom: 3mm;\">Lösungsschlüssel<\u002Fdiv>\n    <div style=\"font-size: 10pt; color: #555; margin-bottom: 10mm;\">Modelltest VIII · Goethe-Zertifikat B1<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6mm 12mm; font-size: 10pt; line-height: 1.45;\">\n      <div><div style=\"font-weight: 700; margin-bottom: 1mm;\">Lesen, Teil 1<\u002Fdiv><div style=\"display
