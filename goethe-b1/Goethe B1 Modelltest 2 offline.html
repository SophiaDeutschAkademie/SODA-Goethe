>\n    <div style=\"font-style: italic; font-size: 10.5pt; line-height: 1.45; margin: 0 0 4mm;\">Lesen Sie die Situationen 13 bis 19 und die Anzeigen a bis j aus verschiedenen deutschsprachigen Medien. Wählen Sie: Welche Anzeige passt zu welcher Situation? Sie können jede Anzeige nur einmal verwenden. Die Anzeige aus dem Beispiel können Sie nicht mehr verwenden. Für eine Situation gibt es keine passende Anzeige. In diesem Fall schreiben Sie 0.<\u002Fdiv>\n    <div style=\"font-size: 10.5pt; line-height: 1.45; margin: 0 0 5mm;\">Einige Bekannte von Ihnen möchten sich ehrenamtlich engagieren und suchen eine passende Aufgabe.<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 30mm; row-gap: 3.2mm; align-items: baseline; font-size: 10.5pt; line-height: 1.4; margin: 0 0 8mm;\">\n      <b style=\"color: #8c8c8c; font-size: 8.5pt;\">Beispiel<\u002Fb><span><\u002Fspan><span><\u002Fspan>\n      <b>0<\u002Fb><span style=\"color: #444;\">Frau Ort möchte einem Kind beim Lesen helfen und hat vormittags Zeit.<\u002Fspan><span style=\"text-align: right; white-space: nowrap;\">Anzeige: <span style=\"display: inline-block; min-width: 12mm; border-bottom: 0.3mm solid #1a1a1a; text-align: center; font-weight: 700;\">b<\u002Fspan><\u002Fspan>\n      <b>13<\u002Fb><span>Sina studiert und hat nur am Wochenende Zeit. Mit Tieren kommt sie gut zurecht.<\u002Fspan><span style=\"text-align: right; white-space: nowrap;\">Anzeige: <span style=\"display: inline-block; min-width: 12mm; border-bottom: 0.3mm solid #1a1a1a; text-align: center; font-weight: 700;\"><span class=\"kt\" style=\"visibility: hidden;\">a<\u002Fspan><\u002Fspan><\u002Fspan>\n      <b>14<\u002Fb><span>Herr Öz ist Rentner, sitzt gern am Steuer und möchte für andere unterwegs sein.<\u002Fspan><span style=\"text-align: right; white-space: nowrap;\">Anzeige: <span style=\"display: inline-block; min-width: 12mm; border-bottom: 0.3mm solid #1a1a1a; text-align: center; font-weight: 700;\"><span class=\"kt\" style=\"visibility: hidden;\">e<\u002Fspan><\u002Fspan><\u002Fspan>\n      <b>15<\u002Fb><span>Malik spielt seit Jahren Fußball und würde gern mit Kindern trainieren.<\u002Fspan><span style=\"text-align: right; white-space: nowrap;\">Anzeige: <span style=\"display: inline-block; min-width: 12mm; border-bottom: 0.3mm solid #1a1a1a; text-align: center; font-weight: 700;\"><span class=\"kt\" style=\"visibility: hidden;\">d<\u002Fspan><\u002Fspan><\u002Fspan>\n      <b>16<\u002Fb><span>Frau Bauer arbeitet bis 18 Uhr und möchte Zugewanderten beim Üben helfen.<\u002Fspan><span style=\"text-align: right; white-space: nowrap;\">Anzeige: <span style=\"display: inline-block; min-width: 12mm; border-bottom: 0.3mm solid #1a1a1a; text-align: center; font-weight: 700;\"><span class=\"kt\" style=\"visibility: hidden;\">f<\u002Fspan><\u002Fspan><\u002Fspan>\n      <b>17<\u002Fb><span>Jan repariert in seiner Freizeit alte Elektrogeräte und Fahrräder.<\u002Fspan><span style=\"text-align: right; white-space: nowrap;\">Anzeige: <span style=\"display: inline-block; min-width: 12mm; border-bottom: 0.3mm solid #1a1a1a; text-align: center; font-weight: 700;\"><span class=\"kt\" style=\"visibility: hidden;\">j<\u002Fspan><\u002Fspan><\u002Fspan>\n      <b>18<\u002Fb><span>Frau Krieg ist wenig mobil und sucht eine Aufgabe für zu Hause.<\u002Fspan><span style=\"text-align: right; white-space: nowrap;\">Anzeige: <span style=\"display: inline-block; min-width: 12mm; border-bottom: 0.3mm solid #1a1a1a; text-align: center; font-weight: 700;\"><span class=\"kt\" style=\"visibility: hidden;\">0<\u002Fspan><\u002Fspan><\u002Fspan>\n      <b>19<\u002Fb><span>Herr Nowak, 34, möchte bei Unfällen und Bränden helfen und ist zu einer langen Ausbildung bereit.<\u002Fspan><span style=\"text-align: right; white-space: nowrap;\">Anzeige: <span style=\"display: inline-block; min-width: 12mm; border-bottom: 0.3mm solid #1a1a1a; text-align: center; font-weight: 700;\"><span class=\"kt\" style=\"visibility: hidden;\">c<\u002Fspan><\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6mm; flex: 1; min-height: 0; font-size: 9.5pt; line-height: 1.5;\">\n      <div style=\"position: relative; min-height: 0;\"><b style=\"position: absolute; left: -1mm; top: -4.5mm; background: #fff; padding: 0 1mm; font-size: 11pt; line-height: 1.2; z-index: 1;\">a<\u002Fb><div style=\"border: 0.3mm solid #1a1a1a; padding: 5mm 5.5mm; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: baseline; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 1.5mm; margin-bottom: 2.5mm;\"><span style=\"font-weight: 700; font-size: 11pt; white-space: nowrap;\">Tierheim Sonnenhof<\u002Fspan><span style=\"font-size: 8pt; letter-spacing: 0.1em; text-transform: uppercase; color: #555;\">Ehrenamt<\u002Fspan><\u002Fdiv>\n        <div><div style=\"font-weight: 700; font-size: 10pt; line-height: 1.2;\">Wer geht mit unseren Hunden spazieren?<\u002Fdiv><div style=\"margin-top: 1.5mm;\">Vierzig Hunde brauchen zweimal täglich Bewegung – vor allem am Samstag und Sonntag fehlen uns Helferinnen und Helfer. Ab 18 Jahren, Einführung durch unsere Pfleger, Gummistiefel leihen wir Ihnen. Zwei Stunden pro Woche genügen.<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-weight: 700;\">tierheim-sonnenhof.de · 0421 / 90 11 22<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n      <div style=\"position: relative; min-height: 0;\"><b style=\"position: absolute; left: -1mm; top: -4.5mm; background: #fff; padding: 0 1mm; font-size: 11pt; line-height: 1.2; z-index: 1;\">b<\u002Fb><div style=\"border: 0.3mm solid #1a1a1a; padding: 5mm 5.5mm; height: 100%; box-sizing: border-box; font-family: Georgia, 'Times New Roman', serif; background: #f7f7f7; display: flex; flex-direction: column; justify-content: space-between;\">\n        <div style=\"text-align: center; font-size: 12.5pt; font-weight: 700; line-height: 1.1;\">Grundschule am Wall<\u002Fdiv>\n        <div><div style=\"text-align: center; font-style: italic; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 1.5mm; margin-bottom: 2.5mm;\">Lesepaten und Lesepatinnen gesucht<\u002Fdiv>Einmal in der Woche lesen Sie eine Stunde mit einem Kind, dem das Lesen noch schwerfällt – dienstags oder donnerstags zwischen 9 und 11 Uhr. Eine kurze Einführung gibt unsere Lehrerin Frau Reuter.<\u002Fdiv>\n        <div style=\"font-family: Archivo, sans-serif; font-size: 8pt;\">Anmeldung im Sekretariat · 0421 / 22 33 44<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Lesen Teil 3 Anzeigen c–j\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">6<\u002Fdiv>\n  <div style=\"position: absolute; left: 0; top: 54mm; width: 19mm; height: 56mm; background: #e8e8e8; display: flex; align-items: center; justify-content: center;\"><div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.14em; color: #222; white-space: nowrap;\">Lesen<\u002Fdiv><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 6.5mm; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1mm; text-align: right; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><span style=\"color: #9a9a9a;\">Kandidatenblätter · 65 Minuten<\u002Fspan> <b>Lesen<\u002Fb><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 19mm; bottom: 14mm; overflow: hidden; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 6mm 6mm; padding-top: 3mm; box-sizing: border-box; font-size: 9pt; line-height: 1.42;\">\n    <div style=\"position: relative; min-height: 0;\"><b style=\"position: absolute; left: -1mm; top: -4.5mm; background: #fff; padding: 0 1mm; font-size: 11pt; line-height: 1.2; z-index: 1;\">c<\u002Fb><div style=\"height: 100%; box-sizing: border-box; overflow: hidden; border: 0.8mm double #1a1a1a; padding: 3.5mm 4mm; display: flex; flex-direction: column; justify-content: space-between;\">\n      <div><div style=\"font-weight: 700; font-size: 11pt; line-height: 1.1;\">Freiwillige Feuerwehr Reinsdorf<\u002Fdiv>\n      <div style=\"font-size: 7.5pt; letter-spacing: 0.14em; text-transform: uppercase; margin: 0.8mm 0 2mm;\">Wir bilden aus<\u002Fdiv><\u002Fdiv>\n      <div>Wenn es brennt oder ein Auto verunglückt, sind wir die Ersten am Ort – und das lernen Sie bei uns von Anfang an. Die Grundausbildung umfasst 80 Stunden an Wochenenden, danach wird jeden Montagabend geübt. Voraussetzung: mindestens 18 Jahre alt und gesundheitlich fit.<\u002Fdiv>\n      <div style=\"font-weight: 700;\">Kommen Sie montags um 19 Uhr vorbei · ff-reinsdorf.de<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"position: relative; min-height: 0;\"><b style=\"position: absolute; left: -1mm; top: -4.5mm; background: #fff; padding: 0 1mm; font-size: 11pt; line-height: 1.2; z-index: 1;\">d<\u002Fb><div style=\"height: 100%; box-sizing: border-box; overflow: hidden; border: 0.3mm solid #1a1a1a; padding: 3.5mm 4mm; font-family: Georgia, 'Times New Roman', serif; display: flex; flex-direction: column; justify-content: space-between;\">\n      <div style=\"font-style: italic; font-size: 12pt; font-weight: 700; line-height: 1.05;\">SV Grün-Weiß Reinsdorf<\u002Fdiv>\n      <div><div style=\"font-family: Archivo, sans-serif; font-weight: 700; margin-bottom: 1.5mm;\">Kindertraining (6 bis 10 Jahre)<\u002Fdiv>Zweimal pro Woche, montags und mittwochs ab 16.30 Uhr. Erfahrung auf dem Platz ist uns wichtiger als ein Diplom – den Trainerschein bezahlt der Verein.<\u002Fdiv>\n      <div style=\"font-family: Archivo, sans-serif; font-size: 8pt;\">Jugendleiter Tim Ahrens · sv-gruen-weiss.de<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"position: relative; min-height: 0;\"><b style=\"position: absolute; left: -1mm; top: -4.5mm; background: #fff; padding: 0 1mm; font-size: 11pt; line-height: 1.2; z-index: 1;\">e<\u002Fb><div style=\"height: 100%; box-sizing: border-box; overflow: hidden; border: 0.3mm solid #1a1a1a; display: flex; flex-direction: column;\">\n      <div style=\"background: #1a1a1a; color: #fff; padding: 2mm 4mm; font-weight: 700; font-size: 10.5pt; letter-spacing: 0.04em;\">Bürgerbus-Verein Reinsdorf<\u002Fdiv>\n      <div style=\"padding: 3mm 4mm; flex: 1; display: flex; flex-direction: column; justify-content: center;\"><b style=\"display: block; margin-bottom: 1.5mm;\">Fahrerinnen und Fahrer gesucht.<\u002Fb>Dienstags, donnerstags und samstags bringen wir Nachbarn in die Kreisstadt. Ein normaler Führerschein genügt, die Schulung dauert zwei Abende. Sie sagen uns, wann Sie Zeit haben.<div style=\"margin-top: 2mm;\">Elke Kranz · 0 44 21 / 78 12<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"position: relative; min-height: 0;\"><b style=\"position: absolute; left: -1mm; top: -4.5mm; background: #fff; padding: 0 1mm; font-size: 11pt; line-height: 1.2; z-index: 1;\">f<\u002Fb><div style=\"height: 100%; box-sizing: border-box; overflow: hidden; border: 0.5mm dashed #1a1a1a; padding: 3.5mm 4mm; display: flex; flex-direction: column; justify-content: space-between;\">\n      <div><div style=\"font-weight: 700; font-size: 10.5pt; line-height: 1.1;\">Stadtteilzentrum Nord<\u002Fdiv>\n      <div style=\"font-weight: 700; margin: 1.5mm 0;\">Sprachcafé: Wer spricht mit?<\u002Fdiv><\u002Fdiv>\n      <div>Jeden Dienstag von 19 bis 21 Uhr sprechen Erwachsene aus vielen Ländern Deutsch – in kleinen Runden, bei Tee und Keksen. Sie brauchen keine Ausbildung, nur Geduld und Freude am Zuhören.<\u002Fdiv>\n      <div>Einfach vorbeikommen: Nordstraße 8<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"position: relative; min-height: 0;\"><b style=\"position: absolute; left: -1mm; top: -4.5mm; background: #fff; padding: 0 1mm; font-size: 11pt; line-height: 1.2; z-index: 1;\">g<\u002Fb><div style=\"height: 100%; box-sizing: border-box; overflow: hidden; border: 0.3mm solid #1a1a1a; border-left: 4mm solid #1a1a1a; padding: 3.5mm 4mm; display: flex; flex-direction: column; justify-content: space-between;\">\n      <div><div style=\"font-weight: 700; font-size: 10.5pt; letter-spacing: 0.06em;\">STADTMUSEUM REINSDORF<\u002Fdiv>\n      <div style=\"font-weight: 700; margin: 1.5mm 0;\">Führungen für Schulklassen<\u002Fdiv><\u002Fdiv>\n      <div>Sie zeigen Kindern unsere Ausstellung zur Stadtgeschichte. Die Termine liegen mittwochs und freitags zwischen 9 und 12 Uhr; die Einarbeitung dauert vier Wochen. Abends und am Wochenende finden keine Führungen statt.<\u002Fdiv>\n      <div style=\"font-weight: 700;\">museum-reinsdorf.de<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"position: relative; min-height: 0;\"><b style=\"position: absolute; left: -1mm; top: -4.5mm; background: #fff; padding: 0 1mm; font-size: 11pt; line-height: 1.2; z-index: 1;\">h<\u002Fb><div style=\"height: 100%; box-sizing: border-box; overflow: hidden; background: #1a1a1a; color: #fff; padding: 3.5mm 4mm; display: flex; flex-direction: column; justify-content: space-between;\">\n      <div><div style=\"font-weight: 700; font-size: 13pt; letter-spacing: 0.08em; line-height: 1;\">TAFEL REINSDORF<\u002Fdiv>\n      <div style=\"font-size: 7.5pt; letter-spacing: 0.18em; text-transform: uppercase; margin: 1.5mm 0 2mm; border-bottom: 0.25mm solid #fff; padding-bottom: 1.2mm;\">Helfen Sie beim Sortieren<\u002Fdiv><\u002Fdiv>\n      <div>Wir holen Lebensmittel ab, prüfen sie und geben sie weiter. Gearbeitet wird vormittags in unserer Halle – von zu Hause aus ist das leider nicht möglich. Feste Schichten ab drei Stunden.<\u002Fdiv>\n      <div style=\"font-weight: 700;\">tafel-reinsdorf.de<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"position: relative; min-height: 0;\"><b style=\"position: absolute; left: -1mm; top: -4.5mm; background: #fff; padding: 0 1mm; font-size: 11pt; line-height: 1.2; z-index: 1;\">i<\u002Fb><div style=\"height: 100%; box-sizing: border-box; overflow: hidden; border-top: 0.6mm solid #1a1a1a; border-bottom: 0.25mm solid #9a9a9a; padding: 3mm 1.5mm; font-family: Georgia, 'Times New Roman', serif; text-align: justify; display: flex; flex-direction: column; justify-content: space-between;\">\n      <div style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 7.5pt; letter-spacing: 0.16em; text-transform: uppercase; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 1mm;\">Jugendfeuerwehr Reinsdorf<\u002Fdiv>\n      <div><b style=\"font-family: Archivo, sans-serif;\">Mitmachen ab 10 Jahren.<\u002Fb> Wir treffen uns freitags um 17 Uhr, üben mit echten Geräten und fahren im Sommer ins Zeltlager. Das Angebot gilt für Jugendliche bis 17 Jahre.<\u002Fdiv>\n      <div style=\"font-family: Archivo, sans-serif; font-size: 8pt;\">Jugendwart Sven Post · 0 44 21 / 65 09<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"position: relative; min-height: 0;\"><b style=\"position: absolute; left: -1mm; top: -4.5mm; background: #fff; padding: 0 1mm; font-size: 11pt; line-height: 1.2; z-index: 1;\">j<\u002Fb><div style=\"height: 100%; box-sizing: border-box; overflow: hidden; border: 0.3mm solid #1a1a1a; padding: 3.5mm 4mm; font-family: 'Courier New', Courier, monospace; font-size: 8pt; line-height: 1.36; text-align: left; display: flex; flex-direction: column; justify-content: space-between;\">\n      <div style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 10.5pt; line-height: 1.1;\">Repair-Café im Bürgerhaus<\u002Fdiv>\n      <div>Samstags von 10 bis 14 Uhr reparieren wir gemeinsam mit den Gästen Toaster, Lampen und Fahrräder. Wer sich mit Elektrogeräten oder Rädern auskennt, ist bei uns goldrichtig. Werkzeug steht bereit. Wie oft Sie kommen, entscheiden Sie selbst.<\u002Fdiv>\n      <div style=\"font-family: Archivo, sans-serif; font-size: 8pt; font-weight: 700;\">repaircafe-reinsdorf.de<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Lesen Teil 4\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; right: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; justify-content: flex-end; padding-right: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">7<\u002Fdiv>\n  <div style=\"position: absolute; right: 0; top: 54mm; width: 19mm; height: 56mm; background: #e8e8e8; display: flex; align-items: center; justify-content: center;\"><div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.14em; color: #222; white-space: nowrap;\">Lesen<\u002Fdiv><\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 28mm; top: 6.5mm; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1mm; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><span style=\"color: #9a9a9a;\">Kandidatenblätter · 65 Minuten<\u002Fspan> <b>Lesen<\u002Fb><\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 28mm; top: 19mm; bottom: 14mm; overflow: hidden;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 4mm;\"><div style=\"font-size: 14pt; font-weight: 700;\">Lesen <span style=\"color: #8c8c8c; font-weight: 500;\">Teil 4<\u002Fspan><\u002Fdiv><div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 9pt; color: #555;\">Arbeitszeit: 15 Minuten<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-style: italic; font-size: 10.5pt; line-height: 1.45; margin: 0 0 3mm;\">Lesen Sie die Texte 20 bis 26. Wählen Sie: Ist die Person für die Vier-Tage-Woche, Ja oder Nein?<\u002Fdiv>\n    <div style=\"font-size: 10.5pt; line-height: 1.45; margin: 0 0 5mm;\">In einer Zeitschrift lesen Sie Kommentare zu einem Artikel über Betriebe, die ihren Beschäftigten vier Arbeitstage bei gleichem Lohn anbieten.<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.2mm 12mm; font-size: 10.5pt; margin: 0 0 6mm; padding: 3mm 4mm; border: 0.3mm solid #1a1a1a;\">\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center; color: #444;\"><b>0<\u002Fb><span>Ingrid <span style=\"color: #8c8c8c; font-size: 8pt;\">Beispiel<\u002Fspan><\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center; background: #1a1a1a; color: #fff;\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center;\"><b>24<\u002Fb><span>Sonja<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\" class=\"k\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center;\"><b>20<\u002Fb><span>Andreas<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\" class=\"k\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center;\"><b>25<\u002Fb><span>Hanna<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\" class=\"k\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center;\"><b>21<\u002Fb><span>Melike<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\" class=\"k\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center;\"><b>26<\u002Fb><span>Thomas<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\" class=\"k\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center;\"><b>22<\u002Fb><span>Robert<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\" class=\"k\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 24mm; align-items: center;\"><b>23<\u002Fb><span>Pawel<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\">Ja<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 8mm; text-align: center;\" class=\"k\">Nein<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.14em; text-transform: uppercase; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 1mm; margin-bottom: 3mm; display: flex; justify-content: space-between;\"><span>Leserkommentare<\u002Fspan><span style=\"color: #555; letter-spacing: 0.04em; text-transform: none;\">www.arbeit-heute.de/forum<\u002Fspan><\u002Fdiv>\n    <div style=\"column-count: 2; column-gap: 7mm; font-size: 9.6pt; line-height: 1.42; text-align: justify; hyphens: auto;\">\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm; color: #444;\"><b style=\"color: #1a1a1a;\">Beispiel<\u002Fb> Unsere Abteilung macht das seit Januar: freitags ist zu, der Lohn bleibt gleich. Ich bin erholter, und liegen geblieben ist bisher nichts. Sogar mein Mann sagt, ich sei am Wochenende geduldiger. Warum haben wir das nicht schon vor zehn Jahren gemacht?<div style=\"text-align: right; font-weight: 500; color: #555;\">Ingrid, 57, Kiel<\u002Fdiv><\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\"><b>20<\u002Fb> Ich verstehe den Wunsch, ehrlich. In meiner Schreinerei sind wir vier Leute, und unsere Kunden rufen nun einmal freitags an. Wenn ich einen Tag zumache, geht der Auftrag zum Nächsten. Für Büros mag das passen, für kleine Betriebe wie meinen ist es einfach nicht zu machen. Zwei meiner Gesellen sehen das übrigens genauso.<div style=\"text-align: right; font-weight: 500; color: #555;\">Andreas, 45, Coburg<\u002Fdiv><\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\"><b>21<\u002Fb> Bei uns liefen sechs Monate zur Probe mit vier Tagen. Wir haben kürzere Besprechungen gehalten und weniger E-Mails geschrieben – geschafft haben wir am Ende genauso viel. Dass die Geschäftsführung jetzt dabei bleibt, war die logische Folge. Krank war in dem halben Jahr fast niemand. Ich möchte nicht mehr zurück.<div style=\"text-align: right; font-weight: 500; color: #555;\">Melike, 33, Duisburg<\u002Fdiv><\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\"><b>22<\u002Fb> Vier Tage klingen gut, lösen mein Problem aber nicht. Ich brauche keinen freien Freitag, sondern Arbeitszeiten, die zu meinen Kindern passen. Lieber jeden Tag zwei Stunden früher Schluss oder zwei Tage im Homeoffice – das wäre eine echte Hilfe. Darüber redet in unserer Firma leider niemand.<div style=\"text-align: right; font-weight: 500; color: #555;\">Robert, 39, Erfurt<\u002Fdiv><\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\"><b>23<\u002Fb> Ich habe zwölf Angestellte in zwei Bäckereien. Meine Leute wären natürlich sofort dafür – aber wer steht dann am Samstag im Laden? Ich müsste drei Leute zusätzlich einstellen und finde schon jetzt keine. Solche Vorschläge kommen immer von Menschen, die nie selbst Personal gesucht haben. In der Stadt findet man vielleicht noch jemanden, bei uns auf dem Land bestimmt nicht.<div style=\"text-align: right; font-weight: 500; color: #555;\">Pawel, 52, Bremen<\u002Fdiv><\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\"><b>24<\u002Fb> Anfangs war ich skeptisch: Wie soll die Arbeit von fünf Tagen in vier passen? Dann hat unsere Klinik es in der Verwaltung ausprobiert. Heute sind die Krankmeldungen seltener, und wir finden wieder Bewerberinnen. Selbst die Ärztinnen, die zuerst dagegen waren, wollen es behalten. Wenn es sogar bei uns geht, kann man es überall versuchen.<div style=\"text-align: right; font-weight: 500; color: #555;\">Sonja, 48, Halle<\u002Fdiv><\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\"><b>25<\u002Fb> Für mich hängt alles am Geld: vier Tage ja, aber nicht mit zwanzig Prozent weniger im Portemonnaie. Bleibt der Lohn gleich, bin ich sofort dabei. Mein Kollege hat es privat schon gerechnet – ohne die Fahrten zur Arbeit spart man am fünften Tag ohnehin. Vier Tage arbeiten und den vollen Lohn bekommen: Das wäre für mich in Ordnung.<div style=\"text-align: right; font-weight: 500; color: #555;\">Hanna, 29, Wien<\u002Fdiv><\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\"><b>26<\u002Fb> Nach vier langen Tagen bin ich abends zu müde für die Kinder. Ich hätte lieber fünf kürzere Tage, dann sehe ich sie jeden Nachmittag. Freie Freitage helfen mir wenig, wenn die Woche vorher aus Zehn-Stunden-Tagen besteht. Meine Frau arbeitet ohnehin im Schichtdienst, da passt das schon heute kaum zusammen.<div style=\"text-align: right; font-weight: 500; color: #555;\">Thomas, 41, Passau<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Lesen Teil 5\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">8<\u002Fdiv>\n  <div style=\"position: absolute; left: 0; top: 54mm; width: 19mm; height: 56mm; background: #e8e8e8; display: flex; align-items: center; justify-content: center;\"><div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.14em; color: #222; white-space: nowrap;\">Lesen<\u002Fdiv><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 6.5mm; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1mm; text-align: right; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><span style=\"color: #9a9a9a;\">Kandidatenblätter · 65 Minuten<\u002Fspan> <b>Lesen<\u002Fb><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 19mm; bottom: 14mm; overflow: hidden;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 4mm;\"><div style=\"font-size: 14pt; font-weight: 700;\">Lesen <span style=\"color: #8c8c8c; font-weight: 500;\">Teil 5<\u002Fspan><\u002Fdiv><div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 9pt; color: #555;\">Arbeitszeit: 10 Minuten<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-style: italic; font-size: 10.5pt; line-height: 1.45; margin: 0 0 3mm;\">Lesen Sie die Aufgaben 27 bis 30 und den Text dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.<\u002Fdiv>\n    <div style=\"font-size: 10.5pt; line-height: 1.45; margin: 0 0 5mm;\">Sie sind in ein Mietshaus gezogen und lesen die Hausordnung.<\u002Fdiv>\n    <div style=\"border: 0.3mm solid #1a1a1a; padding: 3.5mm 5mm 3mm; margin: 0 0 6mm; font-size: 9.8pt; line-height: 1.48; text-align: justify; hyphens: auto;\">\n      <div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 1.5mm; margin-bottom: 2.5mm;\">Hausordnung · Gartenstraße 14<\u002Fdiv>\n      <p style=\"margin: 0 0 1.8mm;\"><b>Ruhezeiten:<\u002Fb> Von 22 bis 6 Uhr sowie sonn- und feiertags ganztägig ist Lärm zu vermeiden. Musizieren ist außerhalb der Ruhezeiten bis zu zwei Stunden täglich erlaubt. Wer ein Fest plant, hängt bitte zwei Tage vorher einen Hinweis im Treppenhaus aus; eine Genehmigung der Verwaltung ist dafür nicht nötig.<\u002Fp>\n      <p style=\"margin: 0 0 1.8mm;\"><b>Waschküche:<\u002Fb> Die Waschmaschinen im Keller stehen von 7 bis 21 Uhr zur Verfügung. Die Zeiten werden im Plan an der Tür eingetragen, pro Wohnung höchstens zwei Termine in der Woche. Nach dem Waschen sind Sieb und Boden zu reinigen. Wäsche darf nur im Trockenraum aufgehängt werden, nicht auf dem Balkon.<\u002Fp>\n      <p style=\"margin: 0 0 1.8mm;\"><b>Treppenhaus und Keller:<\u002Fb> Flure und Treppen müssen frei bleiben; Fahrräder, Kinderwagen und Schuhregale gehören nicht dorthin. Für Fahrräder ist der Raum neben der Einfahrt vorgesehen. Das Treppenhaus wird von einer Firma gereinigt, die Kosten trägt die Hausgemeinschaft.<\u002Fp>\n      <p style=\"margin: 0 0 1.8mm;\"><b>Müll:<\u002Fb> Papier, Glas und Verpackungen werden getrennt. Die Tonnen werden montags von der Hausmeisterin an die Straße gestellt. Sperrmüll darf nicht im Hof abgestellt werden; eine Abholung melden Sie selbst bei der Stadt an.<\u002Fp>\n      <p style=\"margin: 0 0 1.8mm;\"><b>Grillen und Balkon:<\u002Fb> Auf den Balkonen ist Grillen mit Kohle untersagt, elektrische Geräte sind erlaubt. Blumenkästen sind an der Innenseite des Geländers zu befestigen. Gegossen wird so, dass kein Wasser auf den Balkon darunter läuft.<\u002Fp>\n      <p style=\"margin: 0;\"><b>Schäden und Schlüssel:<\u002Fb> Schäden melden Sie bitte sofort der Hausmeisterin, bei Wasserschäden auch außerhalb der Bürozeiten. Zusätzliche Schlüssel erhalten Sie gegen eine Gebühr von 15 Euro bei der Verwaltung. Wer den Hausschlüssel verliert, haftet für den Austausch der Schließanlage.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4mm 8mm; font-size: 10pt; line-height: 1.38;\">\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm;\">\n        <b>27<\u002Fb><span>Wer am Samstagabend Gäste einlädt, …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><span>braucht die Erlaubnis der Verwaltung.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">b<\u002Fb><span>informiert die Nachbarn vorher mit einem Aushang.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><span>darf bis 24 Uhr Musik machen.<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm;\">\n        <b>28<\u002Fb><span>In der Waschküche …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">a<\u002Fb><span>darf jede Wohnung zweimal pro Woche waschen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><span>ist das Waschen ab 6 Uhr möglich.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><span>reinigt die Hausmeisterin die Maschinen.<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm;\">\n        <b>29<\u002Fb><span>Fahrräder …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><span>dürfen im Treppenhaus stehen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">b<\u002Fb><span>haben einen eigenen Abstellraum.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><span>werden montags an die Straße gestellt.<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm;\">\n        <b>30<\u002Fb><span>Auf dem Balkon …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><span>darf man mit Kohle grillen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><span>darf man keine Blumenkästen anbringen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">c<\u002Fb><span>ist ein elektrischer Grill erlaubt.<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Hören Teil 1\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; right: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; justify-content: flex-end; padding-right: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">9<\u002Fdiv>\n  <div style=\"position: absolute; right: 5.5mm; top: 19mm; width: 8mm; height: 8mm; border-radius: 50%; background: radial-gradient(circle, #8d8d8d 0 1mm, #ffffff 1.1mm 1.8mm, #8d8d8d 1.9mm 100%);\"><\u002Fdiv>\n  <div style=\"position: absolute; right: 0; top: 54mm; width: 19mm; height: 56mm; background: #e8e8e8; display: flex; align-items: center; justify-content: center;\"><div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.14em; color: #222; white-space: nowrap;\">Hören<\u002Fdiv><\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 28mm; top: 6.5mm; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1mm; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><span style=\"color: #9a9a9a;\">Kandidatenblätter · 40 Minuten<\u002Fspan> <b>Hören<\u002Fb><\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 28mm; top: 17mm; bottom: 9mm; overflow: hidden; font-size: 10pt; line-height: 1.3;\">\n    <div style=\"font-size: 14pt; font-weight: 700; margin: 0 0 3mm;\">Hören <span style=\"color: #8c8c8c; font-weight: 500;\">Teil 1<\u002Fspan><\u002Fdiv>\n    <div style=\"font-style: italic; font-size: 10.5pt; line-height: 1.4; margin: 0 0 4mm;\">Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.<br>Lesen Sie zuerst das Beispiel. Dazu haben Sie 10 Sekunden Zeit.<\u002Fdiv>\n    <div style=\"margin-bottom: 4mm; color: #444;\">\n      <div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 9pt; letter-spacing: 0.1em; text-transform: uppercase; color: #8c8c8c; margin-bottom: 1.1mm; border-bottom: 0.25mm solid #d0d0d0; padding-bottom: 0.5mm;\">Beispiel<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 30mm; align-items: center; margin-bottom: 1.2mm;\"><b>01<\u002Fb><span>Der Termin von Frau Mehl findet nicht statt.<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center; background: #1a1a1a; color: #fff;\">Richtig<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\">Falsch<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm;\"><b>02<\u002Fb><span>Frau Mehl soll …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><span>am Donnerstag später kommen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><span>einen Termin im Internet buchen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1; background: #1a1a1a; color: #fff;\">c<\u002Fb><span>die Praxis anrufen.<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-bottom: 4mm;\">\n      <div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 9pt; letter-spacing: 0.1em; text-transform: uppercase; color: #555; margin-bottom: 1.1mm; border-bottom: 0.25mm solid #d0d0d0; padding-bottom: 0.5mm;\">Text 1<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 30mm; align-items: center; margin-bottom: 1.2mm;\"><b>1<\u002Fb><span>Der Zug fährt von einem anderen Bahnsteig ab.<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\" class=\"k\">Richtig<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\">Falsch<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm;\"><b>2<\u002Fb><span>Wer ein Fahrrad mitnehmen möchte, …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><span>stellt es in den letzten Wagen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">b<\u002Fb><span>muss einen späteren Zug nehmen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><span>braucht eine Reservierung.<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-bottom: 4mm;\">\n      <div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 9pt; letter-spacing: 0.1em; text-transform: uppercase; color: #555; margin-bottom: 1.1mm; border-bottom: 0.25mm solid #d0d0d0; padding-bottom: 0.5mm;\">Text 2<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 30mm; align-items: center; margin-bottom: 1.2mm;\"><b>3<\u002Fb><span>Die Wanderung beginnt später als geplant.<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\">Richtig<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\" class=\"k\">Falsch<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm;\"><b>4<\u002Fb><span>Nele bittet Jan, …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">a<\u002Fb><span>für Verpflegung zu sorgen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><span>mit dem Auto zu kommen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><span>die Fahrkarten zu kaufen.<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-bottom: 4mm;\">\n      <div style=\"font-family: 'Archivo Narrow', "><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\">Richtig<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\" class=\"k\">Falsch<\u002Fspan><\u002Fspan>\n      <b>20<\u002Fb><span>Unterwegs hatten sie ein Problem mit einem Fahrrad.<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\" class=\"k\">Richtig<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\">Falsch<\u002Fspan><\u002Fspan>\n      <b>21<\u002Fb><span>Das Wetter war besser als vorhergesagt.<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\" class=\"k\">Richtig<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\">Falsch<\u002Fspan><\u002Fspan>\n      <b>22<\u002Fb><span>Frau Vogt möchte die Tour im nächsten Jahr wiederholen.<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\" class=\"k\">Richtig<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\">Falsch<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Hören Teil 4\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">12<\u002Fdiv>\n  <div style=\"position: absolute; left: 5.5mm; top: 19mm; width: 8mm; height: 8mm; border-radius: 50%; background: radial-gradient(circle, #8d8d8d 0 1mm, #ffffff 1.1mm 1.8mm, #8d8d8d 1.9mm 100%);\"><\u002Fdiv>\n  <div style=\"position: absolute; left: 0; top: 54mm; width: 19mm; height: 56mm; background: #e8e8e8; display: flex; align-items: center; justify-content: center;\"><div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.14em; color: #222; white-space: nowrap;\">Hören<\u002Fdiv><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 6.5mm; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1mm; text-align: right; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><span style=\"color: #9a9a9a;\">Kandidatenblätter · 40 Minuten<\u002Fspan> <b>Hören<\u002Fb><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 19mm; bottom: 14mm; overflow: hidden; font-size: 10.5pt; line-height: 1.4;\">\n    <div style=\"font-size: 14pt; font-weight: 700; margin: 0 0 4mm;\">Hören <span style=\"color: #8c8c8c; font-weight: 500;\">Teil 4<\u002Fspan><\u002Fdiv>\n    <div style=\"font-style: italic; font-size: 10.5pt; line-height: 1.45; margin: 0 0 5mm;\">Sie hören nun eine Diskussion. Sie hören die Diskussion zweimal. Dazu lösen Sie acht Aufgaben. Ordnen Sie die Aussagen zu: Wer sagt was?<br>Lesen Sie jetzt die Aussagen 23 bis 30. Dazu haben Sie 60 Sekunden Zeit.<\u002Fdiv>\n    <div style=\"margin: 0 0 7mm; padding: 3mm 4mm; background: #f3f3f3;\">Die Moderatorin der Radiosendung „Standpunkte“ diskutiert mit der Verkehrsplanerin Sanne Weber und dem Taxiunternehmer Ali Demir über die Frage: „Soll in der ganzen Stadt Tempo 30 gelten?“<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 42mm; align-items: center; margin-bottom: 3mm; font-size: 8pt; color: #555;\"><span><\u002Fspan><span><\u002Fspan><span style=\"display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; line-height: 1.2;\"><span><b style=\"color: #1a1a1a;\">a<\u002Fb><br>Moderatorin<\u002Fspan><span><b style=\"color: #1a1a1a;\">b<\u002Fb><br>Sanne Weber<\u002Fspan><span><b style=\"color: #1a1a1a;\">c<\u002Fb><br>Ali Demir<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 42mm; row-gap: 6mm; align-items: center;\">\n      <b style=\"color: #8c8c8c; font-size: 8.5pt; align-self: end;\">Beispiel<\u002Fb><span><\u002Fspan><span><\u002Fspan>\n      <b>0<\u002Fb><span style=\"color: #444;\">Über Tempo 30 wird in vielen Städten heftig gestritten.<\u002Fspan><span style=\"display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center;\"><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1; background: #1a1a1a; color: #fff;\">a<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><\u002Fspan>\n      <b>23<\u002Fb><span>Bei Tempo 30 sind die Folgen eines Unfalls weniger schlimm.<\u002Fspan><span style=\"display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center;\"><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">b<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><\u002Fspan>\n      <b>24<\u002Fb><span>Für eine Fahrt durch die Stadt braucht man künftig länger.<\u002Fspan><span style=\"display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center;\"><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">c<\u002Fb><\u002Fspan>\n      <b>25<\u002Fb><span>Der Verkehr wird insgesamt ruhiger und flüssiger.<\u002Fspan><span style=\"display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center;\"><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">b<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><\u002Fspan>\n      <b>26<\u002Fb><span>Geschwindigkeitsregeln werden ohnehin oft ignoriert.<\u002Fspan><span style=\"display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center;\"><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">c<\u002Fb><\u002Fspan>\n      <b>27<\u002Fb><span>Vor Schulen und in Wohngebieten ist das schon heute üblich.<\u002Fspan><span style=\"display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center;\"><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">a<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><\u002Fspan>\n      <b>28<\u002Fb><span>Der Umbau der Kreuzungen wird teuer.<\u002Fspan><span style=\"display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center;\"><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">c<\u002Fb><\u002Fspan>\n      <b>29<\u002Fb><span>Besonders Kinder und alte Menschen haben einen Vorteil.<\u002Fspan><span style=\"display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center;\"><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">b<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><\u002Fspan>\n      <b>30<\u002Fb><span>Vor der Entscheidung braucht man belastbare Zahlen.<\u002Fspan><span style=\"display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center;\"><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">a<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">b<\u002Fb><b style=\"display: inline-flex; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Schreiben\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; right: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; justify-content: flex-end; padding-right: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">13<\u002Fdiv>\n  <div style=\"position: absolute; right: 0; top: 54mm; width: 19mm; height: 56mm; background: #e8e8e8; display: flex; align-items: center; justify-content: center;\"><div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.14em; color: #222; white-space: nowrap;\">Schreiben<\u002Fdiv><\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 28mm; top: 6.5mm; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1mm; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><span style=\"color: #9a9a9a;\">Kandidatenblätter · 60 Minuten<\u002Fspan> <b>Schreiben<\u002Fb><\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 28mm; top: 19mm; bottom: 14mm; overflow: hidden; font-size: 10pt; line-height: 1.42;\">\n    <div style=\"font-size: 14pt; font-weight: 700; margin: 0 0 4mm;\">Schreiben<\u002Fdiv>\n    <div style=\"font-size: 10pt; color: #555; line-height: 1.5; margin: 0 0 5mm;\">Das Modul Schreiben besteht aus drei Teilen. In den Aufgaben 1 und 3 schreiben Sie E-Mails, in Aufgabe 2 schreiben Sie einen Diskussionsbeitrag. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf den Antwortbogen.<\u002Fdiv>\n\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; border-top: 0.4mm solid #1a1a1a; padding-top: 2mm; margin: 0 0 2mm;\"><div style=\"font-size: 12pt; font-weight: 700;\">Aufgabe 1<\u002Fdiv><div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 9pt; color: #555;\">Arbeitszeit: 20 Minuten<\u002Fdiv><\u002Fdiv>\n    <p style=\"margin: 0 0 2mm;\">Sie haben am Wochenende einen Fotokurs besucht. Eine Freundin/Ein Freund von Ihnen wollte mitkommen, hatte aber keine Zeit.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: 5mm minmax(0, 1fr); row-gap: 0.8mm; margin: 0 0 2mm;\"><span>–<\u002Fspan><span>Beschreiben Sie: Wie war der Kurs?<\u002Fspan><span>–<\u002Fspan><span>Begründen Sie: Was hat Ihnen besonders gut gefallen und warum?<\u002Fspan><span>–<\u002Fspan><span>Machen Sie einen Vorschlag, was Sie gemeinsam fotografieren könnten.<\u002Fspan><\u002Fdiv>\n    <p style=\"margin: 0 0 13mm; font-style: italic;\">Schreiben Sie eine E-Mail (circa 80 Wörter). Schreiben Sie etwas zu allen drei Punkten. Achten Sie auf den Textaufbau (Anrede, Einleitung, Reihenfolge der Inhaltspunkte, Schluss).<\u002Fp>\n\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; border-top: 0.4mm solid #1a1a1a; padding-top: 2mm; margin: 0 0 2mm;\"><div style=\"font-size: 12pt; font-weight: 700;\">Aufgabe 2<\u002Fdiv><div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 9pt; color: #555;\">Arbeitszeit: 25 Minuten<\u002Fdiv><\u002Fdiv>\n    <p style=\"margin: 0 0 3mm;\">Sie haben im Radio eine Sendung zum Thema „Gebraucht statt neu?“ gehört. Im Online-Gästebuch der Sendung finden Sie folgende Meinung:<\u002Fp>\n    <div style=\"border: 0.3mm solid #1a1a1a; max-width: 128mm; margin: 0 0 3mm; font-size: 10pt;\">\n      <div style=\"display: flex; justify-content: space-between; background: #ececec; padding: 1.5mm 4mm; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><b>www.radio-thema.de<\u002Fb><span>Gästebuch<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 3mm 4mm; line-height: 1.5;\"><div style=\"color: #555; font-size: 8pt; margin-bottom: 1.5mm;\">Miriam · 03.05. 18:22 Uhr<\u002Fdiv>Unsere Wohnung ist fast komplett gebraucht eingerichtet, und ich finde das gut: Wir sparen Geld, und die alten Möbel halten länger als das Billigregal von letztem Jahr. Kleidung kaufe ich allerdings lieber neu. Und ehrlich: Das Suchen kostet viel Zeit.<\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 13mm; font-style: italic;\">Schreiben Sie nun Ihre Meinung zum Thema (circa 80 Wörter).<\u002Fp>\n\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; border-top: 0.4mm solid #1a1a1a; padding-top: 2mm; margin: 0 0 2mm;\"><div style=\"font-size: 12pt; font-weight: 700;\">Aufgabe 3<\u002Fdiv><div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 9pt; color: #555;\">Arbeitszeit: 15 Minuten<\u002Fdiv><\u002Fdiv>\n    <p style=\"margin: 0 0 2mm;\">Ihr Internetanschluss funktioniert seit Tagen nicht. Ein Techniker der Firma NetOne möchte am Dienstagvormittag kommen. Zu dieser Zeit sind Sie bei der Arbeit.<\u002Fp>\n    <p style=\"margin: 0 0 2mm;\">Schreiben Sie an Herrn Kaiser von der Firma NetOne. Erklären Sie höflich, warum der Termin nicht passt, und schlagen Sie einen anderen vor.<\u002Fp>\n    <p style=\"margin: 0; font-style: italic;\">Schreiben Sie eine E-Mail (circa 40 Wörter). Vergessen Sie nicht die Anrede und den Gruß am Schluss.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Sprechen Teil 1\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">14<\u002Fdiv>\n  <div style=\"position: absolute; left: 0; top: 54mm; width: 19mm; height: 56mm; background: #e8e8e8; display: flex; align-items: center; justify-content: center;\"><div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.14em; color: #222; white-space: nowrap;\">Sprechen<\u002Fdiv><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 6.5mm; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1mm; text-align: right; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><span style=\"color: #9a9a9a;\">Kandidatenblätter · 15 Minuten für zwei Teilnehmende<\u002Fspan> <b>Sprechen<\u002Fb><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 19mm; bottom: 14mm; overflow: hidden; font-size: 10.5pt; line-height: 1.5;\">\n    <div style=\"font-size: 14pt; font-weight: 700; margin: 0 0 4mm;\">Sprechen<\u002Fdiv>\n    <div style=\"font-size: 10pt; color: #555; line-height: 1.5; margin: 0 0 8mm;\">Das Modul Sprechen besteht aus drei Teilen. In Teil 1 planen Sie etwas gemeinsam mit Ihrem Partner/Ihrer Partnerin (circa 3 Minuten). In Teil 2 präsentieren Sie ein Thema (circa 3 Minuten); wählen Sie Thema 1 oder Thema 2. In Teil 3 sprechen Sie über Ihr Thema und das Ihres Partners/Ihrer Partnerin (circa 2 Minuten). Ihre Vorbereitungszeit beträgt 15 Minuten. Sie bereiten sich allein vor und dürfen sich Notizen machen. In der Prüfung sollen Sie frei sprechen.<\u002Fdiv>\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 5mm;\"><div style=\"font-size: 12pt; font-weight: 700;\">Teil 1 <span style=\"font-weight: 500; color: #555;\">Gemeinsam etwas planen<\u002Fspan><\u002Fdiv><div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 9pt; color: #555;\">Dauer: circa drei Minuten<\u002Fdiv><\u002Fdiv>\n    <p style=\"margin: 0 0 3mm; text-align: justify;\">Eine Kollegin verlässt Ende des Monats die Firma. Sie und Ihr Partner/Ihre Partnerin sollen für sie ein Abschiedsfest organisieren.<\u002Fp>\n    <p style=\"margin: 0 0 8mm; text-align: justify;\">Sprechen Sie über die Punkte unten, machen Sie Vorschläge und reagieren Sie auf die Vorschläge Ihres Gesprächspartners/Ihrer Gesprächspartnerin. Planen und entscheiden Sie gemeinsam, was Sie tun möchten.<\u002Fp>\n    <div style=\"border: 0.3mm solid #1a1a1a; padding: 6mm 8mm; max-width: 100mm; line-height: 1.8;\">\n      <div style=\"font-weight: 700; margin-bottom: 2mm;\">Abschiedsfest organisieren<\u002Fdiv>\n      <div>– Wo feiern? (Büro, Restaurant, Park, …)<\u002Fdiv>\n      <div>– Wann? Nach der Arbeit oder am Wochenende?<\u002Fdiv>\n      <div>– Essen und Getränke: selbst mitbringen oder bestellen?<\u002Fdiv>\n      <div>– Geschenk: was schenken, wer bezahlt?<\u002Fdiv>\n      <div>– …<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Sprechen Teil 2 Thema 1\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; right: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; justify-content: flex-end; padding-right: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">15<\u002Fdiv>\n  <div style=\"position: absolute; right: 0; top: 54mm; width: 19mm; height: 56mm; background: #e8e8e8; display: flex; align-items: center; justify-content: center;\"><div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.14em; color: #222; white-space: nowrap;\">Sprechen<\u002Fdiv><\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 28mm; top: 6.5mm; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1mm; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><span style=\"color: #9a9a9a;\">Kandidatenblätter · 15 Minuten für zwei Teilnehmende<\u002Fspan> <b>Sprechen<\u002Fb><\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 28mm; top: 19mm; bottom: 14mm; overflow: hidden; font-size: 10pt; line-height: 1.4;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 3mm;\"><div style=\"font-size: 12pt; font-weight: 700;\">Teil 2 <span style=\"font-weight: 500; color: #555;\">Ein Thema präsentieren<\u002Fspan><\u002Fdiv><div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 9pt; color: #555;\">Dauer: circa drei Minuten<\u002Fdiv><\u002Fdiv>\n    <p style=\"margin: 0 0 4mm; text-align: justify;\">Wählen Sie ein Thema (Thema 1 oder Thema 2) aus. Sie sollen Ihren Zuhörern ein aktuelles Thema präsentieren. Dazu finden Sie hier fünf Folien. Folgen Sie den Anweisungen links und schreiben Sie Ihre Notizen und Ideen rechts daneben.<\u002Fp>\n    <div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 10pt; letter-spacing: 0.12em; text-transform: uppercase; border-bottom: 0.4mm solid #1a1a1a; padding-bottom: 1mm; margin-bottom: 4mm;\">Thema 1<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 44mm 62mm minmax(0, 1fr); grid-template-rows: repeat(5, 33mm); gap: 4mm 5mm; font-size: 9pt; line-height: 1.4;\">\n      <div style=\"color: #444;\">Stellen Sie Ihr Thema vor. Erklären Sie den Inhalt und die Struktur Ihrer Präsentation.<\u002Fdiv>\n      <div style=\"border: 0.4mm solid #1a1a1a; background: #1f2d3d; color: #fff; padd
