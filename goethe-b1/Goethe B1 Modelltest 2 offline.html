  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 column; align-items: center; gap: 8mm; padding: 8mm 0; background: #6b6b6b; min-width: 226mm;\">\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Titel\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 100%; height: 118mm; background: #1f2d3d; color: #fff; padding: 22mm 20mm 0; box-sizing: border-box;\">\n    <div style=\"position: absolute; right: 20mm; top: 18mm; display: flex; align-items: center; gap: 5mm;\">\n      <div style=\"text-align: right; line-height: 1.15;\"><div style=\"font-size: 13pt; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap;\">Sophia Deutsch Akademie<\u002Fdiv><div style=\"font-size: 8.5pt; color: #c9d3de; letter-spacing: 0.12em; text-transform: uppercase;\">Prüfungsvorbereitung<\u002Fdiv><\u002Fdiv>\n      <img src=\"ebe47d1e-adee-40ed-bd99-788bb2d2dde5\" alt=\"Sophia Deutsch Akademie\" style=\"width: 20mm; height: 23mm; object-fit: contain; display: block;\">\n    <\u002Fdiv>\n    <div style=\"font-size: 56pt; font-weight: 700; line-height: 1; display: inline-block;\">B1<\u002Fdiv>\n    <div style=\"margin-top: 10mm; font-size: 20pt; font-weight: 700; letter-spacing: 0.08em;\">MODELLTEST II<\u002Fdiv>\n    <div style=\"font-size: 20pt; font-weight: 300; letter-spacing: 0.08em;\">GOETHE-ZERTIFIKAT B1<\u002Fdiv>\n    <div style=\"margin-top: 6mm; font-size: 11pt; color: #c9d3de;\">Nach dem Format Goethe-/ÖSD-Zertifikat B1 · Erwachsene · Module Lesen, Hören, Schreiben und Sprechen<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 20mm; top: 132mm;\">\n    <div style=\"font-size: 15pt; font-weight: 700; margin-bottom: 6mm;\">Testformat<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 28mm 19mm minmax(0, 1fr) 33mm; font-size: 9.5pt; line-height: 1.4; border-top: 0.4mm solid #1a1a1a;\">\n      <div style=\"padding: 2.5mm 1.5mm; border-bottom: 0.4mm solid #1a1a1a; font-weight: 700;\">Modul<\u002Fdiv><div style=\"padding: 2.5mm 0; border-bottom: 0.4mm solid #1a1a1a;\"><\u002Fdiv><div style=\"padding: 2.5mm 1.5mm; border-bottom: 0.4mm solid #1a1a1a; font-weight: 700;\">Prüfungsziel<\u002Fdiv><div style=\"padding: 2.5mm 1.5mm; border-bottom: 0.4mm solid #1a1a1a; font-weight: 700; text-align: right;\">Zeit<\u002Fdiv>\n\n      <div style=\"grid-row: span 5; padding: 2.5mm 1.5mm; border-bottom: 0.25mm solid #b8b8b8; font-weight: 700;\">Lesen<\u002Fdiv>\n      <div style=\"padding: 2.5mm 0 0.8mm;\">Teil 1<\u002Fdiv><div style=\"padding: 2.5mm 1.5mm 0.8mm;\">Korrespondenz lesen (Blog, E-Mail)<\u002Fdiv>\n      <div style=\"grid-row: span 5; padding: 2.5mm 1.5mm; border-bottom: 0.25mm solid #b8b8b8; text-align: right;\">65 Min.<\u002Fdiv>\n      <div style=\"padding: 0.8mm 0;\">Teil 2<\u002Fdiv><div style=\"padding: 0.8mm 1.5mm;\">Information und Argumentation verstehen (Presse)<\u002Fdiv>\n      <div style=\"padding: 0.8mm 0;\">Teil 3<\u002Fdiv><div style=\"padding: 0.8mm 1.5mm;\">Zur Orientierung lesen (Anzeigen)<\u002Fdiv>\n      <div style=\"padding: 0.8mm 0;\">Teil 4<\u002Fdiv><div style=\"padding: 0.8mm 1.5mm;\">Meinungen verstehen (Leserkommentare)<\u002Fdiv>\n      <div style=\"padding: 0.8mm 0 2.5mm; border-bottom: 0.25mm solid #b8b8b8;\">Teil 5<\u002Fdiv><div style=\"padding: 0.8mm 1.5mm 2.5mm; border-bottom: 0.25mm solid #b8b8b8;\">Schriftliche Anweisungen verstehen (Hausordnung, Regeln)<\u002Fdiv>\n\n      <div style=\"grid-row: span 4; padding: 2.5mm 1.5mm; border-bottom: 0.25mm solid #b8b8b8; font-weight: 700;\">Hören<\u002Fdiv>\n      <div style=\"padding: 2.5mm 0 0.8mm;\">Teil 1<\u002Fdiv><div style=\"padding: 2.5mm 1.5mm 0.8mm;\">Ankündigungen, Durchsagen und Anweisungen verstehen<\u002Fdiv>\n      <div style=\"grid-row: span 4; padding: 2.5mm 1.5mm; border-bottom: 0.25mm solid #b8b8b8; text-align: right;\">40 Min.<\u002Fdiv>\n      <div style=\"padding: 0.8mm 0;\">Teil 2<\u002Fdiv><div style=\"padding: 0.8mm 1.5mm;\">Als Zuhörerin oder Zuhörer im Publikum verstehen<\u002Fdiv>\n      <div style=\"padding: 0.8mm 0;\">Teil 3<\u002Fdiv><div style=\"padding: 0.8mm 1.5mm;\">Gespräche zwischen Muttersprachlern verstehen<\u002Fdiv>\n      <div style=\"padding: 0.8mm 0 2.5mm; border-bottom: 0.25mm solid #b8b8b8;\">Teil 4<\u002Fdiv><div style=\"padding: 0.8mm 1.5mm 2.5mm; border-bottom: 0.25mm solid #b8b8b8;\">Radiosendungen und Tonaufnahmen verstehen<\u002Fdiv>\n\n      <div style=\"grid-row: span 3; padding: 2.5mm 1.5mm; border-bottom: 0.25mm solid #b8b8b8; font-weight: 700;\">Schreiben<\u002Fdiv>\n      <div style=\"padding: 2.5mm 0 0.8mm;\">Aufgabe 1<\u002Fdiv><div style=\"padding: 2.5mm 1.5mm 0.8mm;\">Persönliche Mitteilung zur Kontaktpflege<\u002Fdiv>\n      <div style=\"grid-row: span 3; padding: 2.5mm 1.5mm; border-bottom: 0.25mm solid #b8b8b8; text-align: right;\">60 Min.<\u002Fdiv>\n      <div style=\"padding: 0.8mm 0;\">Aufgabe 2<\u002Fdiv><div style=\"padding: 0.8mm 1.5mm;\">Persönliche Meinung zu einem Thema äußern<\u002Fdiv>\n      <div style=\"padding: 0.8mm 0 2.5mm; border-bottom: 0.25mm solid #b8b8b8;\">Aufgabe 3<\u002Fdiv><div style=\"padding: 0.8mm 1.5mm 2.5mm; border-bottom: 0.25mm solid #b8b8b8;\">Persönliche Mitteilung zur Handlungsregulierung<\u002Fdiv>\n\n      <div style=\"grid-row: span 3; padding: 2.5mm 1.5mm; border-bottom: 0.4mm solid #1a1a1a; font-weight: 700;\">Sprechen<\u002Fdiv>\n      <div style=\"padding: 2.5mm 0 0.8mm;\">Teil 1<\u002Fdiv><div style=\"padding: 2.5mm 1.5mm 0.8mm;\">Gemeinsam etwas planen und aushandeln<\u002Fdiv>\n      <div style=\"grid-row: span 3; padding: 2.5mm 1.5mm; border-bottom: 0.4mm solid #1a1a1a; text-align: right; line-height: 1.35;\">15 Min.<br><span style=\"color: #555; font-size: 8pt;\">für zwei Teilnehmende,<br>Vorbereitung 15 Min.<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 0.8mm 0;\">Teil 2<\u002Fdiv><div style=\"padding: 0.8mm 1.5mm;\">In einem Monolog ein Thema präsentieren<\u002Fdiv>\n      <div style=\"padding: 0.8mm 0 2.5mm; border-bottom: 0.4mm solid #1a1a1a;\">Teil 3<\u002Fdiv><div style=\"padding: 0.8mm 1.5mm 2.5mm; border-bottom: 0.4mm solid #1a1a1a;\">Über ein Thema sprechen, situationsadäquat reagieren<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top: 7mm; font-size: 9pt; line-height: 1.5; color: #555;\">Übungsmaterial nach dem Format der Prüfung Goethe-Zertifikat B1 (Goethe-Institut · ÖSD). Kein offizielles Prüfungsmaterial. Pro Modul sind 100 Punkte möglich; bestanden hat, wer 60 Punkte erreicht. Lösungsschlüssel Seite 17, Musterlösungen Seite 18–19, Kommentar für Lehrende Seite 20–21, Hörtexte Seite 22–24.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Lesen Teil 1\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">2<\u002Fdiv>\n  <div style=\"position: absolute; left: 0; top: 54mm; width: 19mm; height: 56mm; background: #e8e8e8; display: flex; align-items: center; justify-content: center;\"><div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.14em; color: #222; white-space: nowrap;\">Lesen<\u002Fdiv><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 6.5mm; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1mm; text-align: right; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><span style=\"color: #9a9a9a;\">Kandidatenblätter · 65 Minuten<\u002Fspan> <b>Lesen<\u002Fb><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 19mm; bottom: 14mm; overflow: hidden;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 4mm;\"><div style=\"font-size: 14pt; font-weight: 700;\">Lesen <span style=\"color: #8c8c8c; font-weight: 500;\">Teil 1<\u002Fspan><\u002Fdiv><div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 9pt; color: #555;\">Arbeitszeit: 10 Minuten<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-style: italic; font-size: 10.5pt; line-height: 1.45; margin: 0 0 3.5mm;\">Lesen Sie den Text und die Aufgaben 1 bis 6 dazu. Wählen Sie: Sind die Aussagen Richtig oder Falsch?<\u002Fdiv>\n    <div style=\"border: 0.3mm solid #1a1a1a; padding: 4mm 6mm 3.5mm; margin: 0 0 4mm;\">\n      <div style=\"display: flex; justify-content: space-between; align-items: baseline; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1.5mm; margin-bottom: 3mm; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8.5pt; letter-spacing: 0.04em;\"><span style=\"white-space: nowrap;\"><b>mein-erstes-jahr.de<\u002Fb> · Timo<\u002Fspan><span style=\"color: #555;\">Montag, 8. April<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size: 12.5pt; font-weight: 700; margin-bottom: 2mm;\">Umzug mit Hindernissen<\u002Fdiv>\n      <div style=\"font-size: 10.2pt; line-height: 1.5; text-align: justify; hyphens: auto;\">\n        <p style=\"margin: 0 0 2.2mm;\">Seit Samstag wohne ich also in der Gartenstraße. Drei Zimmer, vierter Stock, eigener Balkon – und ein Umzug, über den ich in zehn Jahren bestimmt lachen kann. Den Transporter hatte ich schon drei Wochen vorher reserviert, zusammen mit einer Sackkarre und zehn Umzugsdecken. Die Sackkarre war die beste Idee des Tages – ohne sie hätten wir den Kühlschrank nie in den vierten Stock gebracht. Als ich am Samstagmorgen um acht bei der Autovermietung stand, war der große Wagen allerdings noch nicht zurück. „Nehmen Sie den kleinen, der reicht doch“, meinte der Mann am Schalter. Er reichte natürlich nicht: Wir sind dreimal gefahren statt einmal.<\u002Fp>\n        <p style=\"margin: 0 0 2.2mm;\">Zugesagt hatten mir zwei Freunde. Jonas hat um halb neun geklingelt, mit zwei Kaffeebechern in der Hand, und ist bis zum Abend geblieben. Der andere lag mit Grippe im Bett – wirklich ärgerlich war das nicht, er hatte mich am Abend vorher angerufen. Dafür stand plötzlich meine neue Nachbarin aus dem dritten Stock im Treppenhaus, sah unsere Kisten und drückte mir ihre Bohrmaschine in die Hand: „Die brauchen Sie sowieso.“ Am Abend hat sie uns dann auch noch zwei Tassen Kaffee hochgebracht.<\u002Fp>\n        <p style=\"margin: 0 0 2.2mm;\">Das eigentliche Problem war der Aufzug. Am Freitag lief er noch, am Samstag hing ein Zettel an der Tür: „Wartung“. Vierter Stock, achtzig Stufen, ein Sofa. Jonas hat irgendwann nur noch gelacht. Zwischendurch haben wir dreimal Pause gemacht, und ein Nachbar aus dem Erdgeschoss hat die Haustür offen gehalten, weil unser Keil nicht hielt. Gegen sechs waren wir fertig, danach gab es Pizza auf dem Fußboden, weil der Tisch noch in Teilen im Flur lag.<\u002Fp>\n        <p style=\"margin: 0 0 2.2mm;\">Ein Rätsel ist noch offen: Für den Keller fehlt mir der Schlüssel. Der Vermieter hat mir am Telefon versprochen, dass er diese Woche einen zweiten bringt. Bis dahin stehen meine Fahrräder im Wohnzimmer, und im Flur warten noch alle Bücherkartons. Nächstes Wochenende kommen die Regale an die Wand – mit der Bohrmaschine von oben.<\u002Fp>\n        <p style=\"margin: 0;\">Bis dann, Timo<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr) 30mm; row-gap: 2.55mm; align-items: center; font-size: 10.8pt; line-height: 1.35;\">\n      <b style=\"color: #8c8c8c; font-size: 8.5pt; align-self: end;\">Beispiel<\u002Fb><span><\u002Fspan><span><\u002Fspan>\n      <b>0<\u002Fb><span>Timo ist in eine andere Wohnung gezogen.<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center; background: #1a1a1a; color: #fff;\">Richtig<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\">Falsch<\u002Fspan><\u002Fspan>\n      <b>1<\u002Fb><span>Um das Fahrzeug hatte sich Timo früh gekümmert.<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\" class=\"k\">Richtig<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\">Falsch<\u002Fspan><\u002Fspan>\n      <b>2<\u002Fb><span>Timo hat den Wagen bekommen, den er wollte.<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\">Richtig<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\" class=\"k\">Falsch<\u002Fspan><\u002Fspan>\n      <b>3<\u002Fb><span>Von Timos Freunden hat nur einer beim Umzug geholfen.<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\" class=\"k\">Richtig<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\">Falsch<\u002Fspan><\u002Fspan>\n      <b>4<\u002Fb><span>Der Aufzug war am Umzugstag in Betrieb.<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\">Richtig<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\" class=\"k\">Falsch<\u002Fspan><\u002Fspan>\n      <b>5<\u002Fb><span>Die Nachbarin hat Timo ein Werkzeug geliehen.<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\" class=\"k\">Richtig<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\">Falsch<\u002Fspan><\u002Fspan>\n      <b>6<\u002Fb><span>Timo hat den Kellerschlüssel inzwischen erhalten.<\u002Fspan><span style=\"display: flex; gap: 1.5mm; justify-content: flex-end;\"><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\">Richtig<\u002Fspan><span style=\"display: inline-block; border: 0.3mm solid #1a1a1a; padding: 0.3mm 1.6mm; font-size: 8pt; line-height: 1.35; min-width: 10mm; text-align: center;\" class=\"k\">Falsch<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Lesen Teil 2 Text A\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; right: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; justify-content: flex-end; padding-right: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">3<\u002Fdiv>\n  <div style=\"position: absolute; right: 0; top: 54mm; width: 19mm; height: 56mm; background: #e8e8e8; display: flex; align-items: center; justify-content: center;\"><div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.14em; color: #222; white-space: nowrap;\">Lesen<\u002Fdiv><\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 28mm; top: 6.5mm; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1mm; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><span style=\"color: #9a9a9a;\">Kandidatenblätter · 65 Minuten<\u002Fspan> <b>Lesen<\u002Fb><\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 28mm; top: 19mm; bottom: 14mm; overflow: hidden;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 4mm;\"><div style=\"font-size: 14pt; font-weight: 700;\">Lesen <span style=\"color: #8c8c8c; font-weight: 500;\">Teil 2<\u002Fspan><\u002Fdiv><div style=\"font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 9pt; color: #555;\">Arbeitszeit: 20 Minuten<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-style: italic; font-size: 10.5pt; line-height: 1.45; margin: 0 0 5mm;\">Lesen Sie den Text aus der Presse und die Aufgaben 7 bis 9 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.<\u002Fdiv>\n    <div style=\"border-top: 0.6mm solid #1a1a1a; border-bottom: 0.25mm solid #1a1a1a; padding: 3.5mm 0 3mm; margin: 0 0 1.5mm;\">\n      <div style=\"font-size: 15pt; font-weight: 700; line-height: 1.1; margin-bottom: 1.5mm;\">Der Bus, den die Nachbarn fahren<\u002Fdiv>\n      <div style=\"font-size: 10pt; font-weight: 500; color: #444; margin-bottom: 3mm;\">In Reinsdorf bringt ein Kleinbus die Dorfbewohner in die Stadt – am Steuer sitzen Freiwillige.<\u002Fdiv>\n      <div style=\"column-count: 2; column-gap: 6mm; font-size: 10.2pt; line-height: 1.5; text-align: justify; hyphens: auto;\">Wer in Reinsdorf ohne Auto zum Arzt oder zum Einkaufen in die Kreisstadt wollte, hatte es jahrelang schwer: Die Buslinie wurde 2019 gestrichen, weil zu wenige Fahrgäste einstiegen. Heute fährt wieder ein Bus – ein Kleinbus mit acht Plätzen, und am Steuer sitzt kein Angestellter, sondern ein Nachbar. Achtzehn Freiwillige teilen sich den Dienstplan, gefahren wird dienstags, donnerstags und samstags, jeweils dreimal hin und zurück. Die Fahrkarte kostet zwei Euro, Kinder zahlen nichts. Wer nicht sicher ist, wann der Bus kommt, findet den Fahrplan im Schaukasten am Rathaus und als Zettel an jeder Haltestelle. Den Bus hat der Landkreis bezahlt, für Versicherung, Benzin und Werkstatt kommt der Verein auf. „Viele denken, dafür bräuchte man einen Busführerschein. Den braucht man nicht“, sagt Elke Kranz, die den Dienstplan schreibt. „Ein normaler Führerschein genügt, dazu eine Schulung an zwei Abenden. Mitglied im Verein muss man auch nicht sein.“ Gemeldet haben sich vor allem Rentner, inzwischen fahren aber auch zwei Frauen mit, die Schichtdienst haben. Die Fahrgäste sind älter, als der Verein erwartet hatte; freitags sitzen allerdings vor allem Jugendliche im Bus, die zum Schwimmbad wollen. Aus drei Nachbardörfern kommen jetzt Anfragen. Kranz rät ihnen, nicht mit dem Fahrplan anzufangen: „Suchen Sie zuerst die Fahrer. Ein schöner Fahrplan hilft nichts, wenn samstags niemand fahren will.“<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size: 8.5pt; font-style: italic; color: #555; text-align: right; margin: 0 0 3.5mm;\">aus einer deutschen Zeitung<\u002Fdiv>\n    <div style=\"font-size: 10.5pt; line-height: 1.4;\">\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm; margin-bottom: 5mm; color: #444;\">\n        <b style=\"color: #8c8c8c; font-size: 8.5pt;\">Beispiel<\u002Fb><span><\u002Fspan>\n        <b>0<\u002Fb><span>In Reinsdorf …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><span>fährt seit 2019 kein Bus mehr.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1; background: #1a1a1a; color: #fff;\">b<\u002Fb><span>fahren Freiwillige einen Kleinbus.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><span>zahlen alle Fahrgäste zwei Euro.<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm; margin-bottom: 4.5mm;\">\n        <b>7<\u002Fb><span>In diesem Text geht es um …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; widt x; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">4<\u002Fdiv>\n  <div style=\"position: absolute; left: 0; top: 54mm; width: 19mm; height: 56mm; background: #e8e8e8; display: flex; align-items: center; justify-content: center;\"><div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.14em; color: #222; white-space: nowrap;\">Lesen<\u002Fdiv><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 6.5mm; border-bottom: 0.25mm solid #b8b8b8; padding-bottom: 1mm; text-align: right; font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 8pt; letter-spacing: 0.04em;\"><span style=\"color: #9a9a9a;\">Kandidatenblätter · 65 Minuten<\u002Fspan> <b>Lesen<\u002Fb><\u002Fdiv>\n  <div style=\"position: absolute; left: 28mm; right: 20mm; top: 19mm; bottom: 14mm; overflow: hidden;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 4mm;\"><div style=\"font-size: 14pt; font-weight: 700;\">Lesen <span style=\"color: #8c8c8c; font-weight: 500;\">noch Teil 2<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"font-style: italic; font-size: 10.5pt; line-height: 1.45; margin: 0 0 5mm;\">Lesen Sie den Text aus der Presse und die Aufgaben 10 bis 12 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.<\u002Fdiv>\n    <div style=\"border-top: 0.6mm solid #1a1a1a; border-bottom: 0.25mm solid #1a1a1a; padding: 3.5mm 0 3mm; margin: 0 0 1.5mm;\">\n      <div style=\"font-size: 15pt; font-weight: 700; line-height: 1.1; margin-bottom: 1.5mm;\">Milch holen um Mitternacht<\u002Fdiv>\n      <div style=\"font-size: 10pt; font-weight: 500; color: #444; margin-bottom: 3mm;\">In Lehen verkauft ein Bauernhof rund um die Uhr – aus einem Automaten am Hoftor.<\u002Fdiv>\n      <div style=\"column-count: 2; column-gap: 6mm; font-size: 10.2pt; line-height: 1.5; text-align: justify; hyphens: auto;\">Vor dem Hoftor der Familie Gruber in Lehen steht seit zwei Jahren ein weißer Kasten mit Glasfenstern: ein Verkaufsautomat für Milch, Eier, Käse und Speck. Vorher gab es einen Hofladen, geöffnet von 16 bis 18 Uhr. „Die Leute kamen um sieben von der Arbeit und standen vor einer verschlossenen Tür“, erzählt Maria Gruber. Den Automaten kaufte die Familie gebraucht von einem Betrieb, der aufgegeben hatte; neu wäre er kaum zu bezahlen gewesen. Jetzt ist rund um die Uhr geöffnet, und der Umsatz hat sich mehr als verdoppelt. Ganz ohne Probleme lief es nicht: Bis zum Sommer nahm das Gerät nur Münzen, viele Kunden standen ratlos davor. Seit Juli kann man auch mit Karte zahlen, seither kommen deutlich mehr Kunden von außerhalb. Im ersten Winter fror die Technik ein; inzwischen sorgt eine kleine Heizung dafür, dass der Automat auch bei minus zehn Grad läuft. Das Brot liefert die Bäckerin aus dem Dorf, dafür darf sie ihre Semmeln im Automaten verkaufen. Am Gerät hängt eine Preisliste; geändert wird sie einmal im Jahr. Am besten gehen im Sommer Käse und Speck – viele Wanderer holen sich hier ihre Jause*. Der Nachbarhof möchte nun ebenfalls einen Automaten aufstellen. Maria Gruber ist skeptisch: „Bei uns funktioniert das, weil die Straße zum See direkt am Hof vorbeiführt. Wer weit weg von der Straße liegt, wartet umsonst.“<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; justify-content: space-between; font-size: 8.5pt; font-style: italic; color: #555; margin: 0 0 6mm;\"><span>*Jause = österreichischer Standard für „Imbiss, Zwischenmahlzeit“<\u002Fspan><span>aus einer österreichischen Zeitung<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size: 10.5pt; line-height: 1.4;\">\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm; margin-bottom: 4.5mm;\">\n        <b>10<\u002Fb><span>In diesem Text geht es um …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">a<\u002Fb><span>eine Bäckerei, die Automaten aufstellt.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">b<\u002Fb><span>einen Bauernhof, der Tag und Nacht verkauft.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\">c<\u002Fb><span>ein Dorf ohne Einkaufsmöglichkeiten.<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr); row-gap: 1mm; margin-bottom: 4.5mm;\">\n        <b>11<\u002Fb><span>Der Automat …<\u002Fspan>\n        <span><\u002Fspan><span style=\"display: grid; grid-template-columns: 7.5mm minmax(0, 1fr); align-items: start;\"><b style=\"display: inline-flex; flex: none; width: 5mm; height: 5mm; border: 0.3mm solid #1a1a1a; align-items: center; justify-content: center; font-size: 8.5pt; line-height: 1;\" class=\"k\">a<\u002Fb><span>war am Anfang nur mit Bargeld zu bedienen.<\u002Fspan><\u002Fspan>\n        <span><\u002Fspan><span style=\"display: g
