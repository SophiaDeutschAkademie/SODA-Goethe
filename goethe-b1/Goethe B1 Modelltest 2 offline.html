an>Falsch<\u002Fspan><span>4<\u002Fspan><span>a<\u002Fspan><span>5<\u002Fspan><span>Falsch<\u002Fspan><span>6<\u002Fspan><span>c<\u002Fspan><span>7<\u002Fspan><span>Richtig<\u002Fspan><span>8<\u002Fspan><span>b<\u002Fspan><span>9<\u002Fspan><span>Richtig<\u002Fspan><span>10<\u002Fspan><span>c<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-weight: 700; margin-bottom: 1mm;\">Hören, Teil 2<\u002Fdiv><div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr);\"><span>11<\u002Fspan><span>a<\u002Fspan><span>12<\u002Fspan><span>b<\u002Fspan><span>13<\u002Fspan><span>a<\u002Fspan><span>14<\u002Fspan><span>b<\u002Fspan><span>15<\u002Fspan><span>c<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-weight: 700; margin-bottom: 1mm;\">Hören, Teil 3<\u002Fdiv><div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr);\"><span>16<\u002Fspan><span>Falsch<\u002Fspan><span>17<\u002Fspan><span>Richtig<\u002Fspan><span>18<\u002Fspan><span>Falsch<\u002Fspan><span>19<\u002Fspan><span>Falsch<\u002Fspan><span>20<\u002Fspan><span>Richtig<\u002Fspan><span>21<\u002Fspan><span>Richtig<\u002Fspan><span>22<\u002Fspan><span>Richtig<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-weight: 700; margin-bottom: 1mm;\">Hören, Teil 4<\u002Fdiv><div style=\"display: grid; grid-template-columns: 9mm minmax(0, 1fr);\"><span>23<\u002Fspan><span>b<\u002Fspan><span>24<\u002Fspan><span>c<\u002Fspan><span>25<\u002Fspan><span>b<\u002Fspan><span>26<\u002Fspan><span>c<\u002Fspan><span>27<\u002Fspan><span>a<\u002Fspan><span>28<\u002Fspan><span>c<\u002Fspan><span>29<\u002Fspan><span>b<\u002Fspan><span>30<\u002Fspan><span>a<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top: 6mm; border: 0.3mm solid #1a1a1a; padding: 3.5mm 5mm; font-size: 8.5pt; line-height: 1.45; color: #555; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3mm 10mm;\">\n      <div><div style=\"font-weight: 700; color: #1a1a1a; margin-bottom: 1mm;\">Lesen und Hören<\u002Fdiv>Je 30 Items, jedes Item zählt gleich viel. Die Rohpunkte werden auf 100 Punkte umgerechnet: 30 richtige Items = 100, 27 = 90, 24 = 80, 21 = 70, <b style=\"color: #1a1a1a;\">18 = 60 Punkte (Bestehensgrenze)<\u002Fb>, 15 = 50.<\u002Fdiv>\n      <div><div style=\"font-weight: 700; color: #1a1a1a; margin-bottom: 1mm;\">Schreiben<\u002Fdiv>Aufgabe 1 = 40, Aufgabe 2 = 40, Aufgabe 3 = 20 Punkte. Kriterien pro Aufgabe: Erfüllung, Kohärenz, Wortschatz, Strukturen (Stufen A–E).<\u002Fdiv>\n      <div><div style=\"font-weight: 700; color: #1a1a1a; margin-bottom: 1mm;\">Sprechen<\u002Fdiv>Teil 1 = 28, Teil 2 = 40, Teil 3 = 16, Aussprache = 16 Punkte.<\u002Fdiv>\n      <div><div style=\"font-weight: 700; color: #1a1a1a; margin-bottom: 1mm;\">Bestehen<\u002Fdiv>Mindestens 60 von 100 Punkten in jedem Modul. Die Module werden einzeln bewertet und können einzeln wiederholt werden.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Musterlösungen Schreiben\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\" data-appendix-page=\"1\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">18<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; top: 11mm; font-size: 26pt; font-weight: 300; letter-spacing: 0.3em; color: #9a9a9a;\">Musterlösungen<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 20mm; top: 30mm; bottom: 12mm; overflow: hidden;\">\n    <div style=\"font-weight: 700; font-size: 12pt; margin-bottom: 1.5mm;\">Schreiben<\u002Fdiv>\n      <div style=\"font-size: 9pt; line-height: 1.45; color: #555; margin-bottom: 5mm;\">Beispiele für Texte auf Niveau B1, die alle Leitpunkte behandeln. Die grauen Ziffern am Rand zeigen, wo welcher Leitpunkt beantwortet wird. Bewertet wird nach Erfüllung, Kohärenz, Wortschatz und Strukturen.<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5mm 7mm; align-items: start; font-size: 9pt; line-height: 1.5;\">\n        <div>\n          <div style=\"font-weight: 700; margin-bottom: 1.5mm;\">Aufgabe 1 <span style=\"font-weight: 400; color: #555;\">· E-Mail an eine Freundin, ca. 95 Wörter<\u002Fspan><\u002Fdiv>\n          <div style=\"border: 0.3mm solid #1a1a1a; padding: 4.5mm 5mm 4.5mm 8mm;\">\n            <div style=\"margin-bottom: 3mm; padding-bottom: 1.5mm; border-bottom: 0.25mm solid #b8b8b8;\"><span style=\"color: #555;\">Betreff:<\u002Fspan> <b>Der Fotokurs – du hast was verpasst!<\u002Fb><\u002Fdiv>\n            <p style=\"margin: 0 0 2.5mm;\">Liebe Yara,<\u002Fp>\n            <p style=\"margin: 0 0 2.5mm; position: relative;\"><span style=\"position: absolute; left: -5.5mm; top: 0.5mm; font-size: 7.5pt; font-weight: 700; color: #9a9a9a;\">1<\u002Fspan>schade, dass du keine Zeit hattest! Der Fotokurs war am Samstag und Sonntag, jeweils von zehn bis sechs. Wir waren nur acht Leute, und der Kursleiter hat zuerst die Technik erklärt. Danach sind wir in die Altstadt gegangen und haben draußen fotografiert.<\u002Fp>\n            <p style=\"margin: 0 0 2.5mm; position: relative;\"><span style=\"position: absolute; left: -5.5mm; top: 0.5mm; font-size: 7.5pt; font-weight: 700; color: #9a9a9a;\">2<\u002Fspan>Am besten hat mir der Sonntagnachmittag gefallen, weil wir unsere Bilder gemeinsam angeschaut haben. Man lernt viel mehr, wenn jemand erklärt, warum ein Foto gut ist.<\u002Fp>\n            <p style=\"margin: 0 0 2.5mm; position: relative;\"><span style=\"position: absolute; left: -5.5mm; top: 0.5mm; font-size: 7.5pt; font-weight: 700; color: #9a9a9a;\">3<\u002Fspan>Wollen wir am nächsten Samstag zusammen an den Hafen gehen und die Schiffe fotografieren? Gegen vier ist das Licht dort besonders schön.<\u002Fp>\n            <p style=\"margin: 0;\">Liebe Grüße<br>Nora<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"font-weight: 700; margin: 5mm 0 1.5mm;\">Aufgabe 3 <span style=\"font-weight: 400; color: #555;\">· E-Mail an eine Firma, ca. 45 Wörter<\u002Fspan><\u002Fdiv>\n          <div style=\"border: 0.3mm solid #1a1a1a; padding: 4.5mm 5mm;\">\n            <p style=\"margin: 0 0 2.5mm;\">Sehr geehrter Herr Kaiser,<\u002Fp>\n            <p style=\"margin: 0 0 2.5mm;\">am Dienstagvormittag bin ich leider nicht zu Hause, weil ich bis 17 Uhr arbeiten muss. Wäre ein Termin am Donnerstag nach 17 Uhr oder am Samstagvormittag möglich? Bitte teilen Sie mir kurz mit, was Ihnen passt.<\u002Fp>\n            <p style=\"margin: 0;\">Mit freundlichen Grüßen<br>Nora Baumann<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-weight: 700; margin-bottom: 1.5mm;\">Aufgabe 2 <span style=\"font-weight: 400; color: #555;\">· Diskussionsbeitrag, ca. 95 Wörter<\u002Fspan><\u002Fdiv>\n          <div style=\"border: 0.3mm solid #1a1a1a; padding: 4.5mm 5mm;\">\n            <p style=\"margin: 0 0 2.5mm;\">Ich kann Miriam gut verstehen. Bei uns sind der Schreibtisch, das Bett und fast alle Regale gebraucht, und wir haben dafür wenig bezahlt. Meiner Meinung nach sind alte Möbel oft besser gebaut als neue.<\u002Fp>\n            <p style=\"margin: 0 0 2.5mm;\">Beim Suchen hat Miriam allerdings recht: Es dauert. Ich schaue deshalb nur einmal pro Woche in die Anzeigen, und wenn ich etwas brauche, warte ich auch mal zwei Monate.<\u002Fp>\n            <p style=\"margin: 0;\">Kleidung kaufe ich dagegen gern gebraucht. Man findet Sachen, die es neu längst nicht mehr gibt – und nach dem Waschen ist alles wie neu. Für mich ist das kein Verzicht, sondern ein Vergnügen.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"margin-top: 5mm; border: 0.3mm solid #1a1a1a; padding: 3.5mm 4mm; font-size: 8.5pt; line-height: 1.45;\">\n            <div style=\"font-weight: 700; margin-bottom: 1.5mm;\">Bewertung<\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 22mm minmax(0, 1fr); row-gap: 1mm;\"><b>Erfüllung<\u002Fb><span>Alle Leitpunkte, passende Textsorte und Register (du/Sie), ungefähre Wortzahl. Jeder fehlende Leitpunkt kostet eine Stufe.<\u002Fspan><b>Kohärenz<\u002Fb><span>Aufbau mit Anrede, Einleitung, Schluss; Verknüpfungen wie <i>weil, deshalb, allerdings, wollen wir<\u002Fi>.<\u002Fspan><b>Wortschatz<\u002Fb><span>Angemessen und variiert; Fehler dürfen das Verständnis nicht stören.<\u002Fspan><b>Strukturen<\u002Fb><span>Nebensätze, Konjunktiv II bei Vorschlägen und Bitten (<i>wäre, würde, könnten Sie<\u002Fi>).<\u002Fspan><\u002Fdiv>\n            <div style=\"font-weight: 700; margin: 3mm 0 1.5mm;\">Typische Fehler<\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 5mm minmax(0, 1fr); row-gap: 1mm; color: #555;\"><b style=\"color: #1a1a1a;\">1<\u002Fb><span>Leitpunkt 3 (Vorschlag) fehlt oder bleibt ohne Ort und Zeit · den Kurs nur beschreiben, ohne zu begründen · <i>Sie<\u002Fi> statt <i>du<\u002Fi>.<\u002Fspan><b style=\"color: #1a1a1a;\">2<\u002Fb><span>Miriams Beitrag nur zusammenfassen, statt eine eigene Meinung zu schreiben · keine Beispiele · deutlich unter 80 Wörtern.<\u002Fspan><b style=\"color: #1a1a1a;\">3<\u002Fb><span>Terminvorschlag fehlt · <i>Hallo Herr Kaiser<\u002Fi> oder <i>Liebe Grüße<\u002Fi> in einer Firmenmail · Grund für die Absage nicht genannt.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Musterlösung Sprechen\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\" data-appendix-page=\"1\">\n  <div style=\"position: absolute; right: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; justify-content: flex-end; padding-right: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">19<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 20mm; top: 18mm; bottom: 12mm; overflow: hidden; column-count: 2; column-gap: 8mm; column-fill: auto; font-size: 8.8pt; line-height: 1.4; hyphens: auto;\">\n    <div style=\"font-weight: 700; font-size: 12pt; margin-bottom: 1.5mm;\">Sprechen<\u002Fdiv>\n      <div style=\"color: #555; margin-bottom: 4mm;\">Beispiele, wie die drei Teile gelingen können. A und B sind die beiden Teilnehmenden.<\u002Fdiv>\n      <div style=\"font-weight: 700; font-size: 10.5pt; margin: 0 0 2mm;\">Teil 1 · Gemeinsam etwas planen<\u002Fdiv>\n      <p style=\"margin: 0 0 1.5mm;\"><b>A:<\u002Fb> Ich würde das Fest nicht im Büro machen. Nach der Arbeit sitzen alle müde am Besprechungstisch – das ist keine Feier. Was hältst du vom Restaurant an der Brücke?<\u002Fp>\n      <p style=\"margin: 0 0 1.5mm;\"><b>B:<\u002Fb> Gute Idee, aber dort ist es teuer. Mein Vorschlag: Wir fragen, ob wir den Garten hinter dem Haus benutzen dürfen. Bei schlechtem Wetter gehen wir in die Kantine.<\u002Fp>\n      <p style=\"margin: 0 0 1.5mm;\"><b>A:<\u002Fb> Einverstanden. Und wann? Freitag direkt nach der Arbeit oder lieber Samstagnachmittag?<\u002Fp>\n      <p style=\"margin: 0 0 1.5mm;\"><b>B:<\u002Fb> Freitag ist praktischer, da sind alle schon da. Fangen wir um 17 Uhr an, dann kommen auch die Kolleginnen mit Kindern früh nach Hause.<\u002Fp>\n      <p style=\"margin: 0 0 1.5mm;\"><b>A:<\u002Fb> Beim Essen würde ich bestellen: Pizza und Salat, das mag jeder. Getränke bringen wir selbst mit, das ist billiger.<\u002Fp>\n      <p style=\"margin: 0 0 1.5mm;\"><b>B:<\u002Fb> Dann übernehme ich die Getränke, ich habe ein Auto. Könntest du am Donnerstag das Essen bestellen und eine Liste aufhängen, wer was mitbringt?<\u002Fp>\n      <p style=\"margin: 0 0 1.5mm;\"><b>A:<\u002Fb> Mache ich. Fehlt noch das Geschenk. Frau Reimer hat einen Balkon voller Pflanzen – vielleicht etwas dafür?<\u002Fp>\n      <p style=\"margin: 0 0 1.5mm;\"><b>B:<\u002Fb> Ich fände einen Gutschein für den Gartenmarkt besser, dann kann sie sich selbst etwas aussuchen. Wir sammeln zehn Euro pro Person, ich gehe mit der Liste durch die Abteilung.<\u002Fp>\n      <p style=\"margin: 0 0 4mm;\"><b>A:<\u002Fb> Perfekt. Dann schreibe ich heute die E-Mail an alle Kolleginnen und Kollegen – mit Ort, Zeit und der Bitte, es Frau Reimer nicht zu erzählen.<\u002Fp>\n      <div style=\"font-weight: 700; font-size: 10.5pt; margin: 3mm 0 2mm;\">Teil 2 · Ein Thema präsentieren (Thema 1)<\u002Fdiv>\n      <p style=\"margin: 0 0 1.5mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Folie 1<\u002Fspan> Ich möchte heute über das Thema „Einkaufen im Internet oder im Geschäft?“ sprechen. Zuerst erzähle ich von meinen eigenen Erfahrungen, dann berichte ich über die Situation in meinem Heimatland, danach nenne ich Vor- und Nachteile und sage meine Meinung. Zum Schluss fasse ich kurz zusammen.<\u002Fp>\n      <p style=\"margin: 0 0 1.5mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Folie 2<\u002Fspan> Ich kaufe etwa die Hälfte online: Bücher, Technik, manchmal Schuhe. Zwei Paar habe ich letztes Jahr zurückgeschickt, weil sie zu klein waren – das hat mich zwei Wege zur Post gekostet. Lebensmittel kaufe ich immer im Laden, weil ich sehen möchte, was ich mitnehme.<\u002Fp>\n      <p style=\"margin: 0 0 1.5mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Folie 3<\u002Fspan> In meinem Heimatland ging der Wandel sehr schnell. Meine Eltern kaufen noch auf dem Markt, meine Geschwister bestellen fast alles mit dem Handy. In den kleinen Städten haben deshalb viele Geschäfte geschlossen; in der Hauptstadt liefern manche Läden innerhalb einer Stunde.<\u002Fp>\n      <p style=\"margin: 0 0 1.5mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Folie 4<\u002Fspan> Vorteile des Internets: Man vergleicht Preise, kauft nachts und spart Wege. Nachteile: Man sieht die Ware nicht, wartet auf die Lieferung, und viele Pakete gehen zurück. Im Geschäft bekomme ich Beratung und habe die Sache sofort. Meiner Meinung nach hängt es vom Produkt ab: Technik online, Kleidung und Essen im Laden.<\u002Fp>\n      <p style=\"margin: 0 0 4mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Folie 5<\u002Fspan> Zusammenfassend kann ich sagen: Beides hat seinen Platz, aber wir sollten die Geschäfte in unserer Stadt nicht vergessen. Vielen Dank fürs Zuhören. Haben Sie noch Fragen?<\u002Fp>\n      <div style=\"font-weight: 700; font-size: 10.5pt; margin: 3mm 0 2mm;\">Teil 3 · Über ein Thema sprechen<\u002Fdiv>\n      <p style=\"margin: 0 0 1.5mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Rückmeldung B<\u002Fspan> Vielen Dank für deine Präsentation. Sie war klar aufgebaut, und neu war für mich, dass in deinem Land in kleinen Städten so viele Geschäfte geschlossen haben.<\u002Fp>\n      <p style=\"margin: 0 0 1.5mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Frage B<\u002Fspan> Du hast gesagt, du schickst manchmal Schuhe zurück. Würdest du trotzdem wieder Kleidung im Internet kaufen?<\u002Fp>\n      <p style=\"margin: 0 0 1.5mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Antwort A<\u002Fspan> Nur bei Marken, deren Größe ich schon kenne. Sonst gehe ich lieber in die Stadt und probiere an.<\u002Fp>\n      <p style=\"margin: 0 0 4mm;\"><span style=\"color: #9a9a9a; font-weight: 700;\">Prüferfrage<\u002Fspan> Sollten Pakete teurer werden? – <b>A:<\u002Fb> Ein kleiner Betrag pro Paket wäre in Ordnung, wenn er den Städten hilft. Für Menschen auf dem Land darf es aber nicht zu teuer werden.<\u002Fp>\n      <div style=\"break-inside: avoid; border: 0.3mm solid #1a1a1a; padding: 3.5mm 4mm; margin-top: 2mm;\">\n        <div style=\"font-weight: 700; margin-bottom: 1.5mm;\">Worauf die Prüfenden achten<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 12mm minmax(0, 1fr); row-gap: 1mm;\"><b>Teil 1<\u002Fb><span>Zu allen vier Punkten Vorschläge machen und begründen, auf den Partner reagieren (<i>Einverstanden, aber …<\u002Fi>), am Ende ein gemeinsames Ergebnis mit Aufgabenverteilung.<\u002Fspan><b>Teil 2<\u002Fb><span>Struktur ankündigen, alle fünf Folien behandeln, Beispiele geben, die Meinung begründen, sich bedanken.<\u002Fspan><b>Teil 3<\u002Fb><span>Rückmeldung mit Inhalt (nicht nur „Das war gut“), eine echte Frage zum Vortrag, auf Fragen der Prüfenden eingehen.<\u002Fspan><b>Sprache<\u002Fb><span>Verständliche Aussprache; Fehler stören nicht, solange die Aussage klar bleibt.<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top: 2.5mm; color: #555;\">Nützliche Redemittel: <i>Ich würde vorschlagen, dass … · Was hältst du von …? · Da bin ich anderer Meinung, weil … · Zuerst …, dann …, zum Schluss … · Ein Vorteil ist, dass … · Mich würde interessieren, ob …<\u002Fi><\u002Fdiv>\n      <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Kommentar für Lehrende 1\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\" data-appendix-page=\"1\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">20<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; top: 11mm; font-size: 26pt; font-weight: 300; letter-spacing: 0.3em; color: #9a9a9a;\">Kommentar<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 20mm; top: 30mm; bottom: 12mm; overflow: hidden;\">\n    <div style=\"font-size: 9pt; color: #555; margin-bottom: 3.5mm; line-height: 1.4;\">Fallen und Distraktoren – Hinweise für Lehrende. Grundlage ist eine Analyse der offiziellen Modell- und Übungssätze (Modellsatz Erwachsene, Übungssatz 5, Modelltest 7, Probeprüfung): Fast jede Schwierigkeit lässt sich dort auf acht Muster zurückführen. Dieser Satz setzt alle acht bewusst ein, und zwar an denselben Stellen wie die Originale: Das erste Item in Teil 2 fragt nach dem Thema des Textes, in Teil 3 gibt es genau eine Situation ohne passende Anzeige, in Teil 4 kommen ein Meinungswechsel und ein Alternativvorschlag vor, und in Hören 4 fasst der Moderator zusammen.<\u002Fdiv>\n    <div style=\"border: 0.3mm solid #1a1a1a; padding: 2.5mm 4mm; margin-bottom: 3.5mm; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1mm 8mm; font-size: 7.8pt; line-height: 1.35;\">\n      <div style=\"grid-column: 1 / -1; font-weight: 700; font-size: 9pt; margin-bottom: 0.5mm;\">Acht Fallentypen<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">P<\u002Fb><b>Paraphrase<\u002Fb> – die Lösung steht nie wörtlich im Text (<i>eine Dame erzählt<\u002Fi> → <i>sich unterhalten<\u002Fi>).<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">W<\u002Fb><b>Wortfalle<\u002Fb> – ein Schlüsselwort aus dem Text steht in der falschen Option.<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">N<\u002Fb><b>Negation / Einschränkung<\u002Fb> – <i>nicht, nur, kaum, außer, nicht mehr als, ausschließlich<\u002Fi>.<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">Z<\u002Fb><b>Zahlen und Zeit<\u002Fb> – Uhrzeiten, Wochentage, Altersgrenzen; oft muss man rechnen oder vergleichen.<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">A<\u002Fb><b>Absicht vs. Realität<\u002Fb> – <i>wollte eigentlich, sollte, hätte, versprochen, geplant<\u002Fi> – aber nicht geschehen.<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">S<\u002Fb><b>Sprecher / Perspektive<\u002Fb> – wer sagt oder tut es? Der Moderator fasst zusammen, der Gast antwortet nur.<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">K<\u002Fb><b>Konzessiv<\u002Fb> – <i>Ich verstehe …, aber / zwar … aber / trotzdem<\u002Fi>: Erst der zweite Teil zählt.<\u002Fdiv>\n      <div><b style=\"display: inline-block; width: 5mm;\">B<\u002Fb><b>Bedingung / Ausnahme<\u002Fb> – <i>nur wenn, falls, gegen Gebühr, in Begleitung<\u002Fi>.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"column-count: 2; column-gap: 8mm; font-size: 7.5pt; line-height: 1.28; hyphens: auto;\">\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Lesen, Teil 1 <span style=\"font-weight: 400; color: #555;\">· 3 × Richtig, 3 × Falsch<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>1<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„schon drei Wochen vorher reserviert“ = sich früh darum kümmern.<\u002Fspan>\n          <b>2<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">A<\u002Fspan><span>Bestellt war der große Wagen, bekommen hat Timo den kleinen.<\u002Fspan>\n          <b>3<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">Z<\u002Fspan><span>Zwei hatten zugesagt, gekommen ist nur Jonas – man muss zwei Angaben verbinden.<\u002Fspan>\n          <b>4<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>Am Freitag lief er noch, am Samstag hing der Zettel „Wartung“ an der Tür.<\u002Fspan>\n          <b>5<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„drückte mir ihre Bohrmaschine in die Hand“ = leihen.<\u002Fspan>\n          <b>6<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">A<\u002Fspan><span>Der Vermieter hat den Schlüssel nur versprochen; die Räder stehen noch im Wohnzimmer.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Lesen, Teil 2<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>7<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">W<\u002Fspan><span>Globalfrage; Landkreis und Führerschein kommen im Text vor, sind aber nicht das Thema.<\u002Fspan>\n          <b>8<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>Die „Schulung an zwei Abenden“ ist der kurze Kurs (c); die Sätze zu Führerschein (b) und Mitgliedschaft (a) stehen als Verneinung im Text.<\u002Fspan>\n          <b>9<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„Suchen Sie zuerst die Fahrer“; b verdreht den Satz über den schönen Fahrplan.<\u002Fspan>\n          <b>10<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">W<\u002Fspan><span>a greift die Bäckerin auf, c das Dorf – beide nur Nebendetails.<\u002Fspan>\n          <b>11<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">Z<\u002Fspan><span>„Bis zum Sommer nur Münzen“ = Bargeld; gebraucht gekauft, also nicht teuer (b); den Hofladen gibt es nicht mehr (c).<\u002Fspan>\n          <b>12<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">B<\u002Fspan><span>„weil die Straße zum See am Hof vorbeiführt“ – eine Bedingung, kein Nein; die Kosten in c kommen im Text nicht vor.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Lesen, Teil 3<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>13<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">B<\u002Fspan><span>Wochenende + Tiere; die Lesepaten-Anzeige (b) ist vormittags und schon im Beispiel verbraucht.<\u002Fspan>\n          <b>14<\u002Fb><b style=\"color: #555;\">e<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„sitzt gern am Steuer“ = fahren; e nennt ausdrücklich den normalen Führerschein.<\u002Fspan>\n          <b>15<\u002Fb><b style=\"color: #555;\">d<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Nur d sucht jemanden für das Training von Kindern; i arbeitet ebenfalls mit Jugendlichen, hat aber nichts mit Fußball zu tun.<\u002Fspan>\n          <b>16<\u002Fb><b style=\"color: #555;\">f<\u002Fb><span style=\"color: #9a9a9a;\">Z<\u002Fspan><span>Nur f liegt abends (19–21 Uhr); g ist vormittags, obwohl es inhaltlich lockt.<\u002Fspan>\n          <b>17<\u002Fb><b style=\"color: #555;\">j<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Reparieren ist das gemeinsame Merkmal; j nennt dazu Werkzeug und freie Termine.<\u002Fspan>\n          <b>18<\u002Fb><b style=\"color: #555;\">0<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>h passt thematisch, schließt Heimarbeit aber aus („von zu Hause aus nicht möglich“). Das ist die Falle.<\u002Fspan>\n          <b>19<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">Z<\u002Fspan><span>i ist die Jugendfeuerwehr bis 17 Jahre; c gilt ab 18 und nennt die 80 Stunden Ausbildung.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Lesen, Teil 4 <span style=\"font-weight: 400; color: #555;\">· 4 × Ja, 3 × Nein<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>20<\u002Fb><b style=\"color: #555;\">Nein<\u002Fb><span style=\"color: #9a9a9a;\">K<\u002Fspan><span>„Ich verstehe den Wunsch, ehrlich. In meiner Schreinerei …“ – Verständnis ist keine Zustimmung.<\u002Fspan>\n          <b>21<\u002Fb><b style=\"color: #555;\">Ja<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Erzählt vom Versuch im Betrieb, ohne das Wort „dafür“ zu benutzen.<\u002Fspan>\n          <b>22<\u002Fb><b style=\"color: #555;\">Nein<\u002Fb><span style=\"color: #9a9a9a;\">A<\u002Fspan><span>Will keinen freien Freitag, sondern andere Arbeitszeiten – Alternativvorschlag.<\u002Fspan>\n          <b>23<\u002Fb><b style=\"color: #555;\">Nein<\u002Fb><span style=\"color: #9a9a9a;\">S<\u002Fspan><span>Spricht über die Wünsche seiner Angestellten, nicht über seine eigene Zustimmung.<\u002Fspan>\n          <b>24<\u002Fb><b style=\"color: #555;\">Ja<\u002Fb><span style=\"color: #9a9a9a;\">K<\u002Fspan><span>Meinungswechsel: „Anfangs war ich skeptisch“ – heute überzeugt.<\u002Fspan>\n          <b>25<\u002Fb><b style=\"color: #555;\">Ja<\u002Fb><span style=\"color: #9a9a9a;\">B<\u002Fspan><span>Bedingung: „Bleibt der Lohn gleich, bin ich sofort dabei“ – trotzdem Ja.<\u002Fspan>\n          <b>26<\u002Fb><b style=\"color: #555;\">Nein<\u002Fb><span style=\"color: #9a9a9a;\">A<\u002Fspan><span>Möchte fünf kürzere Tage; die Vier-Tage-Woche hilft ihm gerade nicht.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Lesen, Teil 5<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>27<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>Hinweis aushängen ja, Genehmigung „nicht nötig“ (a); 24 Uhr widerspricht der Ruhezeit ab 22 Uhr (c).<\u002Fspan>\n          <b>28<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">Z<\u002Fspan><span>„höchstens zwei Termine in der Woche“; geöffnet ab 7, nicht ab 6 Uhr (b).<\u002Fspan>\n          <b>29<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">W<\u002Fspan><span>„Für Fahrräder ist der Raum neben der Einfahrt vorgesehen“; montags werden die Tonnen gestellt (c).<\u002Fspan>\n          <b>30<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>„Grillen mit Kohle untersagt, elektrische Geräte erlaubt“; Blumenkästen nur nach innen (b).<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Kommentar für Lehrende 2\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\" data-appendix-page=\"1\">\n  <div style=\"position: absolute; right: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; justify-content: flex-end; padding-right: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">21<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 20mm; top: 18mm; bottom: 12mm; overflow: hidden;\">\n    <div style=\"column-count: 2; column-gap: 8mm; font-size: 7.8pt; line-height: 1.3; hyphens: auto;\">\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Hören, Teil 1 <span style=\"font-weight: 400; color: #555;\">· jeder Text zweimal<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>1<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„nicht von Gleis 3, sondern von Gleis 8“.<\u002Fspan>\n          <b>2<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>„Fahrräder können in diesem Zug nicht mitgenommen werden“; der spätere Zug ist die Lösung, nicht der letzte Wagen (a).<\u002Fspan>\n          <b>3<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">Z<\u002Fspan><span>„Wir starten wie geplant um neun“ – geändert ist nur der Treffpunkt.<\u002Fspan>\n          <b>4<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">S<\u002Fspan><span>Sven fährt das Auto (b); Getränke hat Nele schon, mitbringen soll Jan das Essen.<\u002Fspan>\n          <b>5<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>Gesperrt ist nur die Richtung Norden; in der Gegenrichtung „rollt der Verkehr“.<\u002Fspan>\n          <b>6<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">W<\u002Fspan><span>Die A1 wird erwähnt, dort ist die Baustelle aber beendet (b); 18 Uhr ist die Prognose, kein Rat (a).<\u002Fspan>\n          <b>7<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„Kommen Sie bitte umgehend aus dem Wasser“.<\u002Fspan>\n          <b>8<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">A<\u002Fspan><span>„sagen Ihnen in etwa einer halben Stunde“; die Schließung ist noch nicht entschieden (a), Geld gibt es nicht zurück (c).<\u002Fspan>\n          <b>9<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„Ihr Rad ist fertig“.<\u002Fspan>\n          <b>10<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">A<\u002Fspan><span>Angekündigt waren 60 Euro, es sind 95; der Sattel ist neu, aber nicht geschenkt (b), sonntags geschlossen (a).<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Hören, Teil 2 <span style=\"font-weight: 400; color: #555;\">· nur einmal<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>11<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">Z<\u002Fspan><span>„freitags für die ganze folgende Woche“; die Schichten wechseln (b).<\u002Fspan>\n          <b>12<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>Mahlzeit und Kaffee sind kostenlos, nur die Getränke aus dem Automaten kosten etwas; „drei Euro“ kommt nicht vor (c).<\u002Fspan>\n          <b>13<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>„Sie müssen also nichts zu Hause waschen“; behalten darf man nur die eigenen Schuhe (c).<\u002Fspan>\n          <b>14<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>„Eine Nachricht an die Kollegen reicht uns nicht“ – der Anruf vor sieben Uhr ist Pflicht.<\u002Fspan>\n          <b>15<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">B<\u002Fspan><span>Wer bleibt, kann sich für die Wintersaison bewerben – „drei Ihrer Vorgängerinnen und Vorgänger arbeiten heute fest bei uns“. Das Zeugnis gibt es nur auf Wunsch, also nicht für alle (a).<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Hören, Teil 3 <span style=\"font-weight: 400; color: #555;\">· 4 × Richtig, 3 × Falsch<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>16<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">S<\u002Fspan><span>Der Tipp kam von der Kollegin seiner Frau; an Anzeigen „glaube ich nicht mehr“.<\u002Fspan>\n          <b>17<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">Z<\u002Fspan><span>72 statt 58 Quadratmeter – rechnen oder vergleichen.<\u002Fspan>\n          <b>18<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">N<\u002Fspan><span>„Die Vormieter lassen sie drin, wir zahlen nichts dafür“; getauscht wird die Waschmaschine.<\u002Fspan>\n          <b>19<\u002Fb><b style=\"color: #555;\">F<\u002Fb><span style=\"color: #9a9a9a;\">A<\u002Fspan><span>Geplant war die Freundin, gefahren ist sie mit der Schwester.<\u002Fspan>\n          <b>20<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„die Kette gerissen“ = Problem mit dem Fahrrad.<\u002Fspan>\n          <b>21<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">Z<\u002Fspan><span>Vorhergesagt waren vier Regentage, gekommen ist ein halber Tag.<\u002Fspan>\n          <b>22<\u002Fb><b style=\"color: #555;\">R<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>„Nächstes Jahr fahren wir die Strecke bis Hamburg weiter.“<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Hören, Teil 4 <span style=\"font-weight: 400; color: #555;\">· a 3 ×, b 3 ×, c 3 ×<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5mm 8mm 5mm minmax(0, 1fr); gap: 1mm 1.2mm;\">\n          <b>23<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Weber rechnet mit Bremswegen: „sie enden viel seltener schwer“.<\u002Fspan>\n          <b>24<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">Z<\u002Fspan><span>Demir: „zwanzig Minuten, mit Tempo 30 fünfundzwanzig oder dreißig“.<\u002Fspan>\n          <b>25<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Weber: „Der Verkehr läuft gleichmäßiger“ – Widerspruch zu Demir.<\u002Fspan>\n          <b>26<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Demir: „Auf meiner Straße stehen 50, gefahren werden 60.“<\u002Fspan>\n          <b>27<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">S<\u002Fspan><span>Die Moderatorin nennt die bestehenden 30er-Zonen; Weber greift sie nur auf.<\u002Fspan>\n          <b>28<\u002Fb><b style=\"color: #555;\">c<\u002Fb><span style=\"color: #9a9a9a;\">Z<\u002Fspan><span>Demir: Ampeln, Kreuzungen, Schilder – „über zwei Millionen Euro“.<\u002Fspan>\n          <b>29<\u002Fb><b style=\"color: #555;\">b<\u002Fb><span style=\"color: #9a9a9a;\">P<\u002Fspan><span>Weber: Kinder schätzen schlecht ein, Ältere brauchen länger.<\u002Fspan>\n          <b>30<\u002Fb><b style=\"color: #555;\">a<\u002Fb><span style=\"color: #9a9a9a;\">S<\u002Fspan><span>Der Vorschlag zu messen kommt von der Moderatorin; beide Gäste stimmen nur zu.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Schreiben und Sprechen<\u002Fdiv>\n        <div style=\"color: #444;\">Schreiben 1 verlangt drei verschiedene Sprechhandlungen (beschreiben, begründen, vorschlagen); Lernende beschreiben oft dreimal, statt auch zu begründen. Schreiben 2: Miriams Beitrag ist bewusst gemischt (Möbel ja, Kleidung nein, Suchen kostet Zeit), damit eine eigene Position nötig wird. Schreiben 3 testet das Register: Firma = Sie, Grund nennen, Alternativtermin anbieten. Sprechen 1: Der Punkt „Geschenk: was schenken, wer bezahlt?“ wird am häufigsten vergessen. Sprechen 2: An Folie 3 (Heimatland) und Folie 4 (Meinung mit Begründung) zeigt sich, ob jemand B1 erreicht.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"break-inside: avoid; margin-bottom: 3.5mm;\">\n        <div style=\"font-weight: 700; font-size: 9.5pt; margin-bottom: 1.5mm; border-bottom: 0.25mm solid #1a1a1a; padding-bottom: 0.8mm;\">Textlängen im Vergleich <span style=\"font-weight: 400; color: #555;\">· dieser Satz / Referenzsätze<\u002Fspan><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 16mm 20mm; gap: 0.8mm 2mm; color: #444;\">\n          <span style=\"font-weight: 700; color: #555;\">Wörter<\u002Fspan><span style=\"font-weight: 700; color: #555; text-align: right;\">hier<\u002Fspan><span style=\"font-weight: 700; color: #555; text-align: right;\">Original<\u002Fspan>\n          <span>Lesen 1, Blog<\u002Fspan><span style=\"text-align: right;\">ca. 320<\u002Fspan><span style=\"text-align: right;\">330–360<\u002Fspan>\n          <span>Lesen 2, je Pressetext<\u002Fspan><span style=\"text-align: right;\">210–225<\u002Fspan><span style=\"text-align: right;\">215–240<\u002Fspan>\n          <span>Lesen 3, je Anzeige<\u002Fspan><span style=\"text-align: right;\">40–60<\u002Fspan><span style=\"text-align: right;\">25–60<\u002Fspan>\n          <span>Lesen 4, je Kommentar<\u002Fspan><span style=\"text-align: right;\">50–65<\u002Fspan><span style=\"text-align: right;\">55–70<\u002Fspan>\n          <span>Lesen 5, Ordnung<\u002Fspan><span style=\"text-align: right;\">ca. 255<\u002Fspan><span style=\"text-align: right;\">245–255<\u002Fspan>\n          <span>Hören 1, fünf Texte<\u002Fspan><span style=\"text-align: right;\">ca. 455<\u002Fspan><span style=\"text-align: right;\">325–565<\u002Fspan>\n          <span>Hören 2, Monolog<\u002Fspan><span style=\"text-align: right;\">ca. 435<\u002Fspan><span style=\"text-align: right;\">405–470<\u002Fspan>\n          <span>Hören 3, Gespräch<\u002Fspan><span style=\"text-align: right;\">ca. 475<\u002Fspan><span style=\"text-align: right;\">310–535<\u002Fspan>\n          <span>Hören 4, Diskussion<\u002Fspan><span style=\"text-align: right;\">ca. 665<\u002Fspan><span style=\"text-align: right;\">515–890<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Hörtexte 1\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\" data-appendix-page=\"1\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">22<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; top: 11mm; font-size: 26pt; font-weight: 300; letter-spacing: 0.3em; color: #9a9a9a;\">Hörtexte<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 20mm; top: 30mm; bottom: 12mm; overflow: hidden; column-count: 2; column-gap: 8mm; column-fill: auto; font-size: 9.6pt; line-height: 1.38; text-align: justify; hyphens: auto;\">\n<div data-t=\"0\" style=\"font-weight: 700; font-size: 10.5pt; margin: 0 0 2mm;\">Hören, Teil 1<\u002Fdiv>\n<p data-t=\"1\" style=\"margin: 0 0 2.5mm; color: #555; font-style: italic;\">Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung. Lesen Sie zuerst das Beispiel. Dazu haben Sie 10 Sekunden Zeit.<\u002Fp>\n<div data-t=\"2\" style=\"font-weight: 700; margin: 2mm 0 0.5mm;\">Beispiel <span style=\"font-weight: 400; color: #555;\">· Sie hören eine Nachricht auf dem Anrufbeantworter.<\u002Fspan><\u002Fdiv>\n<p data-t=\"3\" style=\"margin: 0 0 2.5mm;\">Guten Tag, Frau Mehl, hier ist die Praxis Dr. Weiler. Leider müssen wir Ihren Termin am Donnerstag um 15 Uhr absagen, Dr. Weiler ist erkrankt. Freie Termine haben wir am Montag um 8.30 Uhr und am Mittwoch um 17 Uhr. Rufen Sie uns bitte kurz an, dann tragen wir Sie neu ein; online ist das bei uns leider nicht möglich. Sie erreichen uns von 8 bis 12 und von 14 bis 17 Uhr. Auf Wiederhören.<\u002Fp>\n<div data-t=\"4\" style=\"font-weight: 700; margin: 2mm 0 0.5mm;\">Text 1 <span style=\"font-weight: 400; color: #555;\">· Sie hören eine Durchsage am Bahnhof.<\u002Fspan><\u002Fdiv>\n<p data-t=\"5\" style=\"margin: 0 0 2.5mm;\">Information zum Regionalexpress 4711 nach Lübeck, planmäßige Abfahrt 14.22 Uhr: Der Zug fährt heute nicht von Gleis 3, sondern von Gleis 8. Bitte beachten Sie außerdem, dass der Fahrradwagen fehlt; Fahrräder können in diesem Zug nicht mitgenommen werden. Wir empfehlen Reisenden mit Fahrrad den Zug um 15.22 Uhr; in diesem Zug ist der Fahrradwagen vorhanden. Fahrgäste nach Itzehoe steigen bitte in Neumünster um.<\u002Fp>\n<div data-t=\"6\" style=\"font-weight: 700; margin: 2mm 0 0.5mm;\">Text 2 <span style=\"font-weight: 400; color: #555;\">· Sie hören eine Nachricht auf der Mailbox.<\u002Fspan><\u002Fdiv>\n<p data-t=\"7\" style=\"margin: 0 0 2.5mm;\">Hallo Jan, Nele hier. Wegen morgen: Wir starten wie geplant um neun, treffen uns aber nicht am Bahnhof, sondern direkt am Parkplatz beim Waldcafé – Sven holt uns beide mit dem Auto ab, du musst also nichts fahren. Bring bitte etwas zu essen mit, unterwegs gibt es nichts zu kaufen; Getränke habe ich schon eingepackt. Und feste Schuhe, es soll matschig sein. Bis morgen!<\u002Fp>\n<div data-t=\"8\" style=\"font-weight: 700; margin: 2mm 0 0.5mm;\">Text 3 <span style=\"font-weight: 400; color: #555;\">· Sie hören die Verkehrsmeldungen im Radio.<\u002Fspan><\u002Fdiv>\n<p data-t=\"9\" style=\"margin: 0 0 2.5mm;\">Und nun die Verkehrsmeldungen: Auf der A7 zwischen Quickborn und Kaltenkirchen ist nach einem Unfall die Fahrbahn in Richtung Norden gesperrt. Die Feuerwehr rechnet damit, dass die Strecke erst gegen 18 Uhr wieder frei ist. Fahren Sie bitte über Bad Segeberg, die Umleitung ist ausgeschildert. In der Gegenrichtung rollt der Verkehr, allerdings mit rund zwanzig Minuten Verzögerung. Auf der A1 bei Bargteheide ist die Baustelle seit heute Mittag beendet.<\u002Fp>\n<div data-t=\"10\" style=\"font-weight: 700; margin: 2mm 0 0.5mm;\">Text 4 <span style=\"font-weight: 400; color: #555;\">· Sie hören eine Durchsage im Freibad.<\u002Fspan><\u002Fdiv>\n<p data-t=\"11\" style=\"margin: 0 0 2.5mm;\">Liebe Badegäste, wegen eines Gewitters müssen wir alle Becken sofort schließen. Kommen Sie bitte umgehend aus dem Wasser und verlassen Sie auch die Liegewiese; Umkleiden und Bistro bleiben geöffnet. Wir beobachten das Wetter und sagen Ihnen in etwa einer halben Stunde, ob wir heute noch einmal öffnen. Sollte das Bad geschlossen bleiben, erhalten Sie an der Kasse eine Karte für einen anderen Tag – Geld können wir nicht erstatten.<\u002Fp>\n<div data-t=\"12\" style=\"font-weight: 700; margin: 2mm 0 0.5mm;\">Text 5 <span style=\"font-weight: 400; color: #555;\">· Sie hören eine Nachricht auf dem Anrufbeantworter.<\u002Fspan><\u002Fdiv>\n<p data-t=\"13\" style=\"margin: 0 0 2.5mm;\">Guten Tag, Herr Lang, hier ist die Fahrradwerkstatt Zahn und Kette. Ihr Rad ist fertig, die Bremsen sind neu eingestellt. Beim Sattel hatten wir von einer Reparatur gesprochen; das ging leider nicht. Wir haben deshalb einen neuen eingebaut, und dadurch kostet die Reparatur 95 Euro statt der genannten 60 Euro. Abholen können Sie das Rad heute bis 18 Uhr und morgen ab 9 Uhr, sonntags haben wir geschlossen. Bringen Sie bitte den Abholschein mit.<\u002Fp>\n<div data-t=\"14\" style=\"font-weight: 700; font-size: 10.5pt; margin: 14mm 0 2mm;\">Hören, Teil 2<\u002Fdiv>\n<p data-t=\"15\" style=\"margin: 0 0 2.5mm; color: #555; font-style: italic;\">Sie hören nun einen Text. Sie hören den Text einmal. Dazu lösen Sie fünf Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c. Lesen Sie jetzt die Aufgaben 11 bis 15. Dazu haben Sie 60 Sekunden Zeit. – Sie haben einen Ferienjob im Hotel Seeblick. Am ersten Tag begrüßt die Personalleiterin die neuen Mitarbeitenden.<\u002Fp>\n<p data-t=\"16\" style=\"margin: 0 0 2mm;\">Herzlich willkommen im Hotel Seeblick! Mein Name ist Carla Simon, ich bin für das Personal zuständig. Schön, dass Sie alle pünktlich da sind. Ich erkläre Ihnen jetzt, was Sie in den nächsten Wochen wissen müssen.<\u002Fp>\n<p data-t=\"17\" style=\"margin: 0 0 2mm;\">Zuerst zum Dienstplan: Er hängt im Flur neben der Küche und steht freitags für die ganze folgende Woche fest. Schauen Sie also jeden Freitag nach, wann Sie dran sind. Ihre Schichten sind nicht immer gleich – manchmal Frühdienst ab sechs, manchmal Spätdienst bis 22 Uhr. Wenn Sie einmal tauschen möchten, sprechen Sie das bitte untereinander ab und sagen Sie mir vorher Bescheid.<\u002Fp>\n<p data-t=\"18\" style=\"margin: 0 0 2mm;\">Das Essen ist geregelt: In der Kantine im Erdgeschoss bekommen Sie während der Schicht eine warme Mahlzeit, und die zahlen Sie nicht. Kaffee gibt es dort ebenfalls kostenlos, nur die Getränke aus dem Automaten im Pausenraum kosten etwas. Bitte essen Sie nicht in den Gästebereichen, auch nicht schnell zwischen zwei Zimmern.<\u002Fp>\n<p data-t=\"19\" style=\"margin: 0px; text-align-last: justify;\">Die Arbeitskleidung liegt morgen für alle bereit, jedes Stück mit Namen. Geben Sie sie am Ende der Schicht in den grünen Wagen im Keller; unsere Wäscherei wäscht sie und hängt sie wieder zurück.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Hörtexte 2\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\" data-appendix-page=\"1\">\n  <div style=\"position: absolute; right: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; justify-content: flex-end; padding-right: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">23<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 20mm; top: 18mm; bottom: 12mm; overflow: hidden; column-count: 2; column-gap: 8mm; column-fill: auto; font-size: 9.6pt; line-height: 1.38; text-align: justify; hyphens: auto;\">\n<p data-t=\"19\" style=\"margin: 0 0 2mm;\">Sie müssen also nichts zu Hause waschen. Nur die Schuhe bringen Sie selbst mit, am besten geschlossen und mit weicher Sohle.<\u002Fp>\n<p data-t=\"20\" style=\"margin: 0 0 2mm;\">Ein wichtiger Punkt: Wenn Sie krank werden, rufen Sie bitte vor sieben Uhr morgens die Rezeption an. Eine Nachricht an die Kollegen reicht uns nicht, denn wir müssen dann jemanden zusätzlich einteilen. Ab dem dritten Tag brauchen wir ein Attest vom Arzt.<\u002Fp>\n<p data-t=\"21\" style=\"margin: 0 0 2mm;\">Zu den Schlüsseln: Jede und jeder bekommt heute eine Karte. Sie öffnet die Stockwerke, in denen Sie arbeiten, und den Pausenraum. Verlieren Sie sie nicht – eine neue Karte kostet zehn Euro. Handys bleiben während der Schicht in der Tasche, außer Sie haben Bereitschaft an der Rezeption.<\u002Fp>\n<p style=\"margin: 0 0 2mm;\">Zwei Dinge noch zum Umgang mit den Gästen: Grüßen Sie jeden, auch wenn Sie es eilig haben – das ist bei uns wichtiger als alles andere. Und wenn ein Gast etwas möchte, das Sie nicht entscheiden können, sagen Sie bitte nicht Nein, sondern holen Sie jemanden von uns. Trinkgeld dürfen Sie behalten; wir sammeln es am Abend in der Dose an der Rezeption und verteilen es am Freitag an alle, die in der Woche gearbeitet haben. Ihre Pausen stehen im Plan: bei sechs Stunden eine halbe Stunde, bei acht Stunden 45 Minuten.<\u002Fp>\n<p data-t=\"22\" style=\"margin: 0 0 2mm;\">Und zum Schluss etwas Erfreuliches: Wer den Sommer über bleibt und gute Arbeit macht, kann sich anschließend für die Wintersaison bewerben; drei Ihrer Vorgängerinnen und Vorgänger arbeiten heute fest bei uns. Ein Zeugnis schreiben wir Ihnen gern, aber bitte sagen Sie uns eine Woche vorher, dass Sie eines möchten. Fragen? Dann gehen wir jetzt durch das Haus.<\u002Fp>\n<div data-t=\"23\" style=\"font-weight: 700; font-size: 10.5pt; margin: 14mm 0 2mm;\">Hören, Teil 3<\u002Fdiv>\n<p data-t=\"24\" style=\"margin: 0 0 2.5mm; color: #555; font-style: italic;\">Sie hören nun ein Gespräch. Sie hören das Gespräch einmal. Dazu lösen Sie sieben Aufgaben. Wählen Sie: Sind die Aussagen Richtig oder Falsch? Lesen Sie jetzt die Aufgaben 16 bis 22. Dazu haben Sie 60 Sekunden Zeit. – Sie sitzen in einem Wartezimmer und hören, wie sich zwei Bekannte, Frau Vogt und Herr Jahn, über ihre Pläne unterhalten.<\u002Fp>\n<p data-t=\"25\" style=\"margin: 0 0 1.5mm;\"><b>Frau Vogt:<\u002Fb> Herr Jahn! Das ist ja ein Zufall. Wie geht es Ihnen?<\u002Fp>\n<p data-t=\"26\" style=\"margin: 0 0 1.5mm;\"><b>Herr Jahn:<\u002Fb> Frau Vogt, guten Tag! Gut, aber stressig – wir ziehen in drei Wochen um.<\u002Fp>\n<p data-t=\"27\" style=\"margin: 0 0 1.5mm;\"><b>Frau Vogt:<\u002Fb> Wirklich? Haben Sie endlich etwas gefunden? Sie haben doch monatelang die Anzeigen durchgesehen.<\u002Fp>\n<p data-t=\"28\" style=\"margin: 0 0 1.5mm;\"><b>Herr Jahn:<\u002Fb> Genau deshalb glaube ich nicht mehr an Anzeigen. Am Ende hat eine Kollegin meiner Frau erzählt, dass in ihrem Haus eine Wohnung frei wird. Wir haben angerufen, waren am nächsten Tag da – und zwei Tage später hatten wir den Vertrag.<\u002Fp>\n<p data-t=\"29\" style=\"margin: 0 0 1.5mm;\"><b>Frau Vogt:<\u002Fb> So läuft das heute. Und ist sie größer als Ihre jetzige?<\u002Fp>\n<p data-t=\"30\" style=\"margin: 0 0 1.5mm;\"><b>Herr Jahn:<\u002Fb> Deutlich. 72 Quadratmeter statt 58, und ein Zimmer mehr. Mein Sohn bekommt endlich sein eigenes.<\u002Fp>\n<p data-t=\"31\" style=\"margin: 0 0 1.5mm;\"><b>Frau Vogt:<\u002Fb> Und die Lage? Sie wohnen doch so gern in der Nähe vom Park.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Herr Jahn:<\u002Fb> Zwei Straßen weiter, wir bleiben also im Viertel. Zur Arbeit fahre ich künftig sogar zehn Minuten kürzer, weil die Straßenbahn direkt vor der Tür hält.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Vogt:<\u002Fb> Das wird teuer mit der Einrichtung, nehme ich an. Küche, Lampen, alles neu?<\u002Fp>\n<p data-t=\"32\" style=\"margin: 0 0 1.5mm;\"><b>Herr Jahn:<\u002Fb> Bei der Küche haben wir Glück: Die Vormieter lassen sie drin, wir zahlen nichts dafür. Sie ist nicht neu, aber in Ordnung. Nur die Waschmaschine passt nicht in die Nische, die müssen wir tauschen.<\u002Fp>\n<p data-t=\"33\" style=\"margin: 0 0 1.5mm;\"><b>Frau Vogt:<\u002Fb> Immerhin. Und der Umzug selbst?<\u002Fp>\n<p data-t=\"34\" style=\"margin: 0 0 1.5mm;\"><b>Herr Jahn:<\u002Fb> Samstag in drei Wochen, mit einem Transporter und vier Freunden. Danach gibt es Pizza, so haben wir es abgemacht. Aber erzählen Sie – Sie waren doch mit dem Fahrrad unterwegs?<\u002Fp>\n<p data-t=\"35\" style=\"margin: 0 0 1.5mm;\"><b>Frau Vogt:<\u002Fb> Sechs Tage an der Elbe, von Dresden bis Wittenberg. Eigentlich wollte eine Freundin mitkommen, sie hat sich aber den Fuß verletzt. Am Ende bin ich mit meiner Schwester gefahren.<\u002Fp>\n<p data-t=\"36\" style=\"margin: 0 0 1.5mm;\"><b>Herr Jahn:<\u002Fb> Und wo haben Sie geschlafen? Das muss man doch früh buchen.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Frau Vogt:<\u002Fb> Wir haben jeden Morgen entschieden, wie weit wir fahren, und mittags angerufen. Einmal war alles voll, da haben wir zwanzig Kilometer weiter ein Zimmer über einem Gasthaus bekommen – mit Blick auf die Elbe.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Herr Jahn:<\u002Fb> Sechs Tage – ganz ohne Probleme?<\u002Fp>\n<p data-t=\"37\" style=\"margin: 0 0 1.5mm;\"><b>Frau Vogt:<\u002Fb> Fast. Am vierten Tag ist meiner Schwester die Kette gerissen, mitten im Wald. Ein Ehepaar hat uns mit dem Auto in die nächste Werkstatt gebracht, nach zwei Stunden ging es weiter. So etwas erlebt man nur unterwegs.<\u002Fp>\n<p data-t=\"38\" style=\"margin: 0 0 1.5mm;\"><b>Herr Jahn:<\u002Fb> Und das Wetter? Es hat doch im Juni ständig geregnet.<\u002Fp>\n<p data-t=\"39\" style=\"margin: 0 0 1.5mm;\"><b>Frau Vogt:<\u002Fb> Vorhergesagt waren vier Regentage. Bekommen haben wir einen halben. Wir sind fast jeden Tag in der Sonne gefahren und haben abends draußen gegessen.<\u002Fp>\n<p data-t=\"40\" style=\"margin: 0 0 1.5mm;\"><b>Herr Jahn:<\u002Fb> Da haben Sie Glück gehabt. Machen Sie das wieder?<\u002Fp>\n<p data-t=\"41\" style=\"margin: 0px; text-align-last: justify;\"><b>Frau Vogt:<\u002Fb> Auf jeden Fall. Nächstes Jahr fahren wir die Strecke bis Hamburg weiter – meine Schwester hat schon den nächsten Abschnitt ausgesucht.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" lang=\"de\" data-screen-label=\"Hörtexte 3\" style=\"position: relative; width: 210mm; height: 297mm; flex: none; overflow: hidden; box-sizing: border-box; box-shadow: 0 2mm 6mm rgba(0,0,0,.35); background: #fff; color: #1a1a1a; font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif;\" data-appendix-page=\"1\">\n  <div style=\"position: absolute; left: 0; top: 0; width: 19mm; height: 9mm; background: #ececec; display: flex; align-items: center; padding-left: 6.5mm; box-sizing: border-box; font-weight: 700; font-size: 11pt;\">24<\u002Fdiv>\n  <div style=\"position: absolute; left: 20mm; right: 20mm; top: 18mm; bottom: 12mm; overflow: hidden; column-count: 2; column-gap: 8mm; column-fill: auto; font-size: 9.6pt; line-height: 1.38; text-align: justify; hyphens: auto;\">\n<p data-t=\"41\" style=\"margin: 0 0 1.5mm;\">Kommen Sie doch mit, wenn der Umzug überstanden ist.<\u002Fp>\n<p data-t=\"42\" style=\"margin: 0 0 1.5mm;\"><b>Herr Jahn:<\u002Fb> Nach dem Umzug will ich erst einmal nichts mehr tragen und nichts mehr planen. Aber fragen Sie mich im Frühling noch einmal.<\u002Fp>\n<div data-t=\"43\" style=\"font-weight: 700; font-size: 10.5pt; margin: 14mm 0 2mm;\">Hören, Teil 4<\u002Fdiv>\n<p data-t=\"44\" style=\"margin: 0 0 2.5mm; color: #555; font-style: italic;\">Sie hören nun eine Diskussion. Sie hören die Diskussion zweimal. Dazu lösen Sie acht Aufgaben. Ordnen Sie die Aussagen zu: Wer sagt was? Lesen Sie jetzt die Aussagen 23 bis 30. Dazu haben Sie 60 Sekunden Zeit. – Die Moderatorin der Radiosendung „Standpunkte“ diskutiert mit der Verkehrsplanerin Sanne Weber und dem Taxiunternehmer Ali Demir über die Frage: „Soll in der ganzen Stadt Tempo 30 gelten?“<\u002Fp>\n<p data-t=\"45\" style=\"margin: 0 0 1.5mm;\"><b>Moderatorin:<\u002Fb> Guten Abend und willkommen bei „Standpunkte“. Unser Thema heute: Tempo 30 in der ganzen Stadt. Über kaum einen Vorschlag wird in unseren Städten so heftig gestritten – in Leserbriefen, in Ratssitzungen, am Familientisch. Bei mir sind Sanne Weber, Verkehrsplanerin bei der Stadt, und Ali Demir, der ein Taxiunternehmen mit elf Wagen führt. Frau Weber, was spricht aus Ihrer Sicht für Tempo 30?<\u002Fp>\n<p data-t=\"46\" style=\"margin: 0 0 1.5mm;\"><b>Weber:<\u002Fb> Vor allem eine einfache Rechnung. Bei 50 Stundenkilometern braucht ein Auto etwa 28 Meter, bis es steht, bei 30 sind es 13. Das entscheidet darüber, ob ein Unfall passiert – und wenn er passiert, wie er ausgeht. Die Zahl der Unfälle sinkt nur leicht, aber sie enden viel seltener schwer. Das ist für mich das wichtigste Argument.<\u002Fp>\n<p data-t=\"47\" style=\"margin: 0 0 1.5mm;\"><b>Moderatorin:<\u002Fb> Herr Demir, Sie sind mit Ihren Fahrern jeden Tag in der Stadt unterwegs.<\u002Fp>\n<p data-t=\"48\" style=\"margin: 0 0 1.5mm;\"><b>Demir:<\u002Fb> Und genau deshalb sehe ich das anders. Quer durch die Stadt bin ich heute in zwanzig Minuten, mit Tempo 30 werden es fünfundzwanzig oder dreißig. Für meine Fahrgäste heißt das: Jede Fahrt dauert länger und wird teurer, denn die Uhr läuft weiter. Wer zum Zug muss, ruft dann eben kein Taxi mehr.<\u002Fp>\n<p data-t=\"49\" style=\"margin: 0 0 1.5mm;\"><b>Weber:<\u002Fb> Da muss ich widersprechen. In den Städten, die es eingeführt haben, sind die Fahrzeiten kaum gestiegen. Der Verkehr läuft gleichmäßiger, weil weniger gebremst und wieder angefahren wird. Wer ständig von 50 auf 0 und zurück muss, ist am Ende nicht schneller als der, der ruhig mit 30 rollt.<\u002Fp>\n<p data-t=\"50\" style=\"margin: 0 0 1.5mm;\"><b>Demir:<\u002Fb> Das ist die Theorie aus dem Büro. In der Praxis hält sich doch schon heute kaum jemand an die Grenzen. Auf meiner Straße stehen 50, gefahren werden 60. Warum sollte sich jemand plötzlich an 30 halten? Ohne Kontrollen ändert sich nichts, und für Kontrollen fehlt der Stadt das Personal.<\u002Fp>\n<p data-t=\"51\" style=\"margin: 0 0 1.5mm;\"><b>Moderatorin:<\u002Fb> Dabei gilt in einzelnen Straßen längst Tempo 30 – vor Schulen, Kindergärten und in vielen Wohngebieten. Für viele Menschen wäre das also keine große Umstellung.<\u002Fp>\n<p data-t=\"52\" style=\"margin: 0 0 1.5mm;\"><b>Weber:<\u002Fb> Richtig, und dort sehen wir auch, wem es nützt. Kinder schätzen Entfernungen und Geschwindigkeiten schlecht ein, ältere Menschen brauchen länger, um die Straße zu überqueren. Für diese beiden Gruppen ist der Unterschied zwischen 30 und 50 am größten. Dazu kommt, dass es deutlich leiser wird.<\u002Fp>\n<p data-t=\"53\" style=\"margin: 0 0 1.5mm;\"><b>Demir:<\u002Fb> Über eines redet dabei niemand: das Geld. Wenn überall 30 gilt, müssen Ampeln neu eingestellt und Kreuzungen umgebaut werden, dazu kommen Tausende von Schildern. In unserer Nachbarstadt hat das über zwei Millionen Euro gekostet. Dieses Geld wäre in Bussen und Radwegen besser angelegt.<\u002Fp>\n<p data-t=\"54\" style=\"margin: 0 0 1.5mm;\"><b>Weber:<\u002Fb> Die Schilder sind der kleinere Teil, und vieles lässt sich bei ohnehin geplanten Bauarbeiten mitmachen. Trotzdem stimmt es: Ganz ohne Geld geht es nicht.<\u002Fp>\n<p data-t=\"55\" style=\"margin: 0 0 1.5mm;\"><b>Moderatorin:<\u002Fb> Frau Weber, viele Menschen fürchten, dass die Busse dann ebenfalls langsamer werden. Wer soll dann noch umsteigen?<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Weber:<\u002Fb> Das prüfen wir gerade. Auf zwei Linien haben wir gemessen: Die Busse brauchen auf der ganzen Strecke etwa eine Minute länger, halten dafür aber ihren Fahrplan zuverlässiger ein, weil die Abstände im Verkehr gleichmäßiger sind. Wichtiger ist etwas anderes: Bei Tempo 30 können Radfahrer und Autos sich eine Spur teilen. Wir sparen dadurch teure Radwege – und dieses Geld brauchen wir an anderer Stelle dringend.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Demir:<\u002Fb> Und der Lieferverkehr? Die Pakete werden ja nicht weniger. Wenn jeder Transporter länger unterwegs ist, kostet das die Firmen Geld, und am Ende zahlt es der Kunde. Mit uns Taxifahrern hat übrigens vorher niemand gesprochen, das ärgert mich am meisten.<\u002Fp>\n<p style=\"margin: 0 0 1.5mm;\"><b>Moderatorin:<\u002Fb> Wäre es dann nicht klug, erst einmal zu messen, was wirklich passiert – auf einigen Hauptstraßen, ein Jahr lang, mit Zahlen zu Unfällen, Lärm und Fahrzeiten? Danach könnte der Rat entscheiden.<\u002Fp>\n<p data-t=\"56\" style=\"margin: 0 0 1.5mm;\"><b>Demir:<\u002Fb> Damit könnte ich leben, solange am Ende ehrlich gerechnet wird und die Taxis nicht vergessen werden.<\u002Fp>\n<p data-t=\"57\" style=\"margin: 0 0 1.5mm;\"><b>Weber:<\u002Fb> Auch von meiner Seite: gern. Wir haben die Messstellen schon, wir müssten sie nur auswerten.<\u002Fp>\n<p data-t=\"58\" style=\"margin: 0 0 1.5mm;\"><b>Moderatorin:<\u002Fb> Dann halten wir das fest. Frau Weber, Herr Demir, vielen Dank für das Gespräch. Und Ihnen zu Hause einen schönen Abend.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showKey&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Lehrkraft&quot;},&quot;showAppendix&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Lehrkraft&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      keyAttr: (this.props.showKey ?? false) ? 'on' : 'off',\n      appendixAttr: (this.props.showAppendix ?? true) ? 'on' : 'off'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
