<script id="soda-theme-js">
(function(){

  var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';

    var b=document.createElement('button'); b.type='button'; b.id='soda-theme-btn'; b.className='soda-theme-btn';
    function paint(){ var dk=d.getAttribute('data-theme')==='dark'; b.innerHTML=dk?SUN:MOON; b.setAttribute('aria-pressed',dk?'true':'false'); b.setAttribute('aria-label','다크 모드 '+(dk?'끄기':'켜기')); b.title='다크 모드 '+(dk?'켜짐':'꺼짐')+' · 누르면 '+(dk?'라이트':'다크')+'로 바뀌어요'; }

    paint(); document.body.appendChild(b);
    
  }
  if(document.body) mount(); else document.addEventListener('DOMContentLoaded',mount);
})();
</script>

:root{
  --bg:#e7eaee;--panel:#fff;--bar:#f5f6f8;--line:#cbd2da;--line-2:#e2e6eb;
  --ink:#1b2430;--ink-2:#434f5e;--muted:#68727f;
  --acc:#1d6a56;--acc-2:#165443;--acc-w:#e3f0eb;--acc-line:#93c4b2;
  --warn:#a8322a;--warn-w:#fbecea;--mark:#ffe680;
  --fs:16px;
  --font:"Pretendard SODA",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol{margin:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;height:58px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:5}
.top .logo{width:22px;height:auto;display:block;flex:none}
.top .id{display:flex;flex-direction:column;min-width:0;line-height:1.25;padding-left:12px;border-left:1px solid var(--line-2)}
.top .id b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .id > span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.tool{display:flex;align-items:center;gap:6px}
.hlp{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;font-weight:700;font-size:16px;color:var(--ink-2);padding:0}
.hlp:hover{background:var(--acc-w)}
.fz{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.fz button{border:0;background:none;width:34px;height:32px;padding:0;font-weight:700;color:var(--ink-2)}
.fz button+button{border-left:1px solid var(--line-2)}
.fz button[aria-pressed="true"]{background:var(--acc-w);color:var(--acc-2)}
.fz .s1{font-size:12px}.fz .s2{font-size:14px}.fz .s3{font-size:17px}
.vol{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:0 10px;height:34px;background:#fff;color:var(--ink-2)}
.vol input{width:96px;accent-color:var(--acc)}
.timer{display:flex;align-items:center;gap:9px;height:42px;padding:0 12px 0 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.timer svg{flex:none;color:var(--ink-2)}
.timer .tl{display:flex;flex-direction:column;line-height:1.1}
.timer .tl small{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.timer .tl b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.timer.low{border-color:var(--warn);background:var(--warn-w)}
.timer.low b,.timer.low svg{color:var(--warn)}

/* ---------- part tabs ---------- */
.tabs{display:flex;align-items:stretch;gap:0;background:var(--bar);border-bottom:1px solid var(--line);flex:none;padding:0 10px;min-height:46px}
.tabs .tl{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs .tl::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;border:0;border-top:3px solid transparent;background:none;padding:0 16px;font-weight:700;color:var(--ink-2);white-space:nowrap;position:relative}
.tab .pr{font-weight:400;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:0 7px;line-height:18px}
.tab.done .pr{background:var(--acc-w);border-color:var(--acc-line);color:var(--acc-2)}
.tab[aria-selected="true"]{background:#fff;border-top-color:var(--acc);color:var(--ink);box-shadow:1px 0 0 var(--line),-1px 0 0 var(--line)}
.tab:disabled{cursor:not-allowed;color:#9aa3ad}
.tab:disabled .pr{opacity:.6}
.tab .lock{display:inline-flex;color:#9aa3ad}
.tabs .tr{display:flex;align-items:center;gap:8px;padding-left:10px}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tbtn[aria-pressed="true"]{background:#fff6c7;border-color:#d9bf44;color:#5c4a00}
.tbtn.icon{padding:0 9px}

/* ---------- audio bar ---------- */
.abar{display:flex;align-items:center;gap:14px;padding:9px 18px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.abar .st{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap;min-width:0}
.abar .st .dot{width:10px;height:10px;border-radius:50%;background:#9aa3ad;flex:none}
.abar.on .st .dot{background:var(--acc);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.abar .pg{flex:1;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;min-width:60px}
.abar .pg i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s linear}
.abar .tm{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- main panes ---------- */
.exam{display:flex;flex-direction:column;height:100vh;height:100dvh}
.main{flex:1;min-height:0;display:flex;gap:12px;padding:12px}
.pane{flex:1 1 0;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pane.l{flex-basis:54%}.pane.r{flex-basis:46%}
.pane.one{max-width:980px;margin:0 auto;width:100%}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 18px;border-bottom:1px solid var(--line-2);background:#fafbfc;flex:none}
.ph h2{font-size:14px;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.ph .sub{display:flex;gap:4px}
.ph .sub button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.ph .sub button[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.pb{flex:1;overflow:auto;padding:20px 24px 48px;font-size:var(--fs);line-height:1.62;-webkit-overflow-scrolling:touch}
.pb.mk{cursor:text}
.pb.mk ::selection{background:var(--mark)}
mark.hl{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.pb.mk mark.hl{cursor:pointer}
.inst{color:var(--ink-2);font-weight:500;margin-bottom:16px}
.inst+.inst{margin-top:-8px}
.ctx{margin-bottom:16px;padding:12px 14px;background:#f6f8f9;border-left:3px solid var(--line);border-radius:0 4px 4px 0}
.h1t{font-size:calc(var(--fs)*1.15);font-weight:700;margin-bottom:10px}

/* texts */
.card{border:1px solid var(--line);border-radius:6px;padding:16px 18px;background:#fff}
.blog .bh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.86em;color:var(--muted);border-bottom:1px solid var(--line-2);padding-bottom:8px;margin-bottom:12px}
.blog .bh b{color:var(--ink-2)}
.blog h3,.art h3{font-size:1.3em;line-height:1.25;margin-bottom:10px}
.blog p,.art p,.doc p{margin:0 0 .75em}
.blog .cl{margin-top:.6em}
.art .lead{font-weight:600;color:var(--ink-2);margin-bottom:12px}
.art .src{text-align:right;font-size:.85em;color:var(--muted);margin-top:8px}
.art .fn{font-size:.85em;color:var(--muted);margin-top:8px}
/* ---------- Anzeigen (Lesen Teil 3): jede Anzeige mit eigenem Layout ---------- */
.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:20px 18px;align-items:start;
  --ad-sans:var(--font);--ad-serif:var(--font);--ad-hand:var(--font);--ad-cond:var(--font);
  --ad-mono:var(--font)}
.adw{min-width:0}
.adl{display:flex;align-items:flex-end;gap:8px;font-weight:800;font-size:1.05em;line-height:1;margin:0 0 7px;color:var(--ink)}
.adl::after{content:"";flex:1;border-bottom:1px solid #8a9099;margin-bottom:2px}
.ad{position:relative;font-family:var(--ad-sans);font-size:.92em;line-height:1.5;color:#1c1c1c;background:#fff;overflow-wrap:break-word}
.ad p{margin:0 0 .55em}
.ad h4{margin:0 0 .35em;font-size:1.08em;line-height:1.25}
.ad .af{margin:.9em 0 0;font-size:.86em}
.ad .tg{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:#555}
.ad .ti{font-weight:700}
.ad ul.fx{list-style:none;padding:0;margin:.3em 0 .7em}
.ad ul.fx li{font-weight:700}
.ad .ft{width:100%;border-collapse:collapse;margin:.3em 0 .9em;font-size:.95em}
.ad .ft td{padding:.28em 0;border-bottom:1px dotted #8c8c8c;vertical-align:top}
.ad .ft td+td{text-align:right;font-weight:700;padding-left:10px}
.ad svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ad .lead{font-weight:700}
.ad .nw{white-space:nowrap}
/* inst */
.d-inst{border:1px solid #2b2b2b;padding:16px 18px}
.d-inst .ah{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1.5px solid #222;padding-bottom:7px;margin-bottom:14px}
.d-inst .ah b{font-size:1.06em}
.d-inst .af{font-weight:700}
/* serif */
.d-serif{background:#f3f2ee;border:1px solid #b9b6ad;padding:18px 20px 14px;font-family:var(--ad-serif)}
.d-serif h4{text-align:center;font-size:1.42em;font-weight:300;letter-spacing:-.02em}
.d-serif .su{font-weight:600;text-align:center;border-bottom:1px solid #444;padding-bottom:8px;margin:8px 0 14px}
.d-serif .af{font-family:var(--ad-sans);font-size:.8em;color:#3a3a3a}
/* dashed */
.d-dashed{border:1.5px dashed #444;padding:16px 18px 0}
.d-dashed .hd b{display:block;font-size:1.08em}
.d-dashed .hd span{display:block;font-size:.72em;letter-spacing:.13em;text-transform:uppercase;color:#3d3d3d;margin:2px 0 12px}
.d-dashed .strip{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1.5px dashed #444;margin:14px -18px 0;padding:8px 18px;font-size:.86em}
/* barhead */
.d-barhead{border:1.5px solid #1c1c1c}
.d-barhead .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#1c1c1c;color:#fff;padding:9px 14px}
.d-barhead .bar b{letter-spacing:.03em}
.d-barhead .bar svg{width:22px;height:22px;flex:none}
.d-barhead .in{padding:14px 16px 12px}
/* rules */
.d-rules{border-top:3px solid #111;border-bottom:3px solid #111;padding:16px 6px 12px;font-family:var(--ad-serif)}
.d-rules h4{font-weight:800;font-size:1.5em;letter-spacing:-.02em;text-align:center;margin:0}
.d-rules .su{text-align:center;font-family:var(--ad-sans);font-size:.72em;letter-spacing:.17em;text-transform:uppercase;margin:6px 0 14px}
.d-rules .af{text-align:center;border-top:1px solid #111;padding-top:8px;margin:14px 18px 0;font-family:var(--ad-sans);font-size:.8em}
/* inverse */
.d-inverse{background:#161c24;color:#eef1f4;padding:18px 18px 16px}
.d-inverse h4{font-size:1.24em;letter-spacing:.07em;text-transform:uppercase;margin:0}
.d-inverse .su{font-size:.72em;letter-spacing:.19em;text-transform:uppercase;color:#b9c2cc;border-bottom:1px solid #6d7782;padding-bottom:9px;margin:5px 0 14px}
.d-inverse .tg{color:#b9c2cc}
.d-inverse .af{font-weight:700}
/* classified */
.d-classified{border-top:2.5px solid #111;border-bottom:1px solid #8a8a8a;padding:9px 2px 10px}
.d-classified .ah{display:flex;justify-content:space-between;gap:10px;font-size:.76em;font-weight:700;letter-spacing:.15em;text-transform:uppercase;border-bottom:1px solid #111;padding-bottom:7px;margin-bottom:12px}
.d-classified .ah span{font-weight:400}
.d-classified p:not(.af){text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.d-classified .lead{font-family:var(--ad-sans)}
.d-classified .af{font-size:.78em}
/* mono */
.d-mono{border:1px solid #333;padding:14px 16px}
.d-mono .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #333;padding-bottom:7px;margin-bottom:11px}
.d-mono .mh b{font-size:1.06em}
.d-mono .mh svg{width:22px;height:22px;flex:none}
.d-mono .ft,.d-mono p.mt{font-variant-numeric:tabular-nums}
.d-mono p.mt{font-size:.94em;line-height:1.6;color:#2a2a2a;letter-spacing:.01em}
.d-mono .af{font-weight:700}
/* tearoff */
.d-tearoff{border:1px solid #333}
.d-tearoff .in{padding:16px 16px 12px}
.d-tearoff .hd{font-weight:700;font-size:.82em;letter-spacing:.06em;margin-bottom:4px}
.d-tearoff h4{font-weight:900;letter-spacing:-.02em;font-size:1.42em;line-height:1.08;text-transform:uppercase;margin-bottom:.5em}
.d-tearoff .af{font-weight:700}
.d-tearoff .tear{display:flex;border-top:1.5px dashed #444}
.d-tearoff .tear i{flex:1;display:flex;align-items:center;justify-content:center;min-height:92px;border-left:1.5px dashed #444;font-style:normal}
.d-tearoff .tear i:first-child{border-left:0}
.d-tearoff .tear span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.66em;font-weight:700;white-space:nowrap;letter-spacing:.02em}
/* chalk */
.d-chalk{background:#6f5d48;padding:9px;border-radius:4px}
.d-chalk .bd{background:#2c3833;color:#f3f3ee;padding:18px 16px 14px;text-align:center;font-weight:300;line-height:1.55;border-radius:2px;box-shadow:inset 0 0 34px rgba(0,0,0,.4)}
.d-chalk .hd{font-size:.86em;opacity:.85;margin-bottom:2px}
.d-chalk h4{font-size:1.5em;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
.d-chalk .su{text-decoration:underline wavy rgba(243,243,238,.75);text-underline-offset:7px;margin:2px 0 16px}
.d-chalk p{line-height:1.55}
.d-chalk .af{opacity:.9}
/* corp */
.d-corp{border:1px solid #333;padding:12px 16px}
.d-corp .ah{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid #333;padding-bottom:7px;margin-bottom:11px}
.d-corp .wm{font-size:1.08em;font-weight:400;letter-spacing:-.01em}
.d-corp .wm b{font-weight:800}
.d-corp .wm small{font-size:.66em}
.d-corp .af{font-weight:700;border-top:1px solid #9a9a9a;padding-top:7px}
/* hotel */
.d-hotel{border:3px double #333;padding:5px}
.d-hotel .fr{border:1px solid #333;padding:14px 16px 12px;text-align:center;font-family:var(--ad-serif)}
.d-hotel .st{letter-spacing:.32em;font-size:.82em;margin-bottom:2px}
.d-hotel .hic{display:block;width:30px;height:30px;margin:0 auto 6px}
.d-hotel h4{font-weight:300;letter-spacing:.16em;text-transform:uppercase;font-size:1.12em;margin:0}
.d-hotel .ti{margin:4px 0 10px}
.d-hotel .fr>p:not(.st):not(.ti):not(.af){margin-top:10px}
.d-hotel .af{font-family:var(--ad-sans);font-size:.78em;letter-spacing:.06em}
/* band */
.d-band{border:1px solid #333}
.d-band .bn{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#dcdcdc;border-bottom:1px solid #333;padding:9px 14px}
.d-band .bn b{font-size:1.42em;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.d-band .bn span{font-size:.76em;font-weight:700;text-align:right;line-height:1.25;max-width:46%}
.d-band .in{padding:12px 14px}
/* stamp */
.d-stamp{border:1px solid #333;padding:16px 16px 12px}
.d-stamp .sb{float:right;margin:-4px -4px 8px 12px;width:68px;height:68px;border-radius:50%;background:#1d2a44;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:.66em;line-height:1.15;letter-spacing:.03em;text-transform:uppercase;transform:rotate(-12deg);padding:4px}
.d-stamp h4{font-size:1.32em}
.d-stamp .su{font-weight:700}
.d-stamp .bf{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px;border-top:2px solid #111;margin-top:12px;padding-top:8px}
.d-stamp .bf b{text-transform:uppercase;font-weight:800;font-size:.9em}
.d-stamp .bf span{font-size:.8em;text-align:right}
/* logo */
.d-logo{border:1px solid #333;padding:14px 16px 12px}
.d-logo .lg{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.d-logo .cir{width:44px;height:44px;border:1.5px solid #222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:300;font-size:1.35em;flex:none}
.d-logo .cir svg{width:24px;height:24px}
.d-logo .nm b{display:block;font-weight:400;letter-spacing:.2em;text-transform:uppercase;font-size:1.08em;line-height:1.25}
.d-logo .nm small{display:block;font-size:.66em;letter-spacing:.22em;text-transform:uppercase;color:#555}
.d-logo .af{text-align:right}
/* browser */
.d-browser{border:1px solid #333;border-radius:6px;overflow:hidden}
.d-browser .bb{display:flex;align-items:center;gap:5px;background:#eceff2;border-bottom:1px solid #c5cbd2;padding:6px 10px}
.d-browser .bb i{width:9px;height:9px;border-radius:50%;border:1.3px solid #555;flex:none}
.d-browser .url{flex:1;min-width:0;margin-left:8px;background:#fff;border:1px solid #c5cbd2;border-radius:10px;font-size:.72em;padding:1px 10px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-browser .in{padding:12px 14px}
.d-browser .hd{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:#555;margin-bottom:2px}
.d-browser .cta{text-align:right;margin-top:10px}
.d-browser .cta span{display:inline-block;background:#1b2430;color:#fff;font-weight:700;font-size:.82em;padding:5px 14px;border-radius:4px}
/* stripes */
.d-stripes{border:1px solid #222}
.d-stripes .sx{height:13px;background:repeating-linear-gradient(-45deg,#1d1d1d 0 8px,#fff 8px 16px)}
.d-stripes .in{padding:12px 14px 10px}
.d-stripes .hd{font-weight:700;font-size:.82em;margin-bottom:2px}
.d-stripes h4{font-size:1.24em;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
/* ticket */
.d-ticket{display:grid;grid-template-columns:40px minmax(0,1fr);border:1px solid #333}
.d-ticket::before,.d-ticket::after{content:"";position:absolute;left:31px;width:17px;height:17px;border-radius:50%;background:#fff;border:1px solid #333}
.d-ticket::before{top:-9px}.d-ticket::after{bottom:-9px}
.d-ticket .stub{background:#ececec;border-right:2px dashed #777;display:flex;align-items:center;justify-content:center}
.d-ticket .stub span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.64em;letter-spacing:.22em;font-weight:700;white-space:nowrap}
.d-ticket .in{padding:14px 14px 12px}
.d-ticket h4{font-size:1.38em;letter-spacing:.2em;font-weight:800;margin:0}
.d-ticket .su{font-size:.66em;letter-spacing:.32em;text-transform:uppercase;color:#555;margin:0 0 12px}
.d-ticket .af{font-weight:700}
/* postcard */
.d-postcard{border:1px solid #333;padding:14px}
.d-postcard .pc{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:12px}
.d-postcard h4{font-weight:300;font-size:1.6em;line-height:1.15;letter-spacing:-.02em;margin-bottom:12px}
.d-postcard .side{border-left:1px solid #555;padding-left:12px;display:flex;flex-direction:column;gap:12px}
.d-postcard .stp{border:1.5px dashed #444;text-align:center;padding:8px 4px;font-weight:800;line-height:1.1}
.d-postcard .stp small{display:block;font-size:.6em;letter-spacing:.06em;text-transform:uppercase}
.d-postcard .stp b{display:block;font-size:1.12em;margin:2px 0}
.d-postcard .side i{display:block;border-bottom:1px solid #777;height:16px}
.d-postcard .af{font-weight:700}
/* badge */
.d-badge{border:1px solid #333}
.d-badge .bt{display:flex;justify-content:space-between;align-items:stretch;border-bottom:1px solid #333}
.d-badge .bt>div:first-child{padding:10px 14px;min-width:0}
.d-badge .hd{font-size:.68em;letter-spacing:.14em;text-transform:uppercase;color:#444;margin-bottom:2px}
.d-badge .bt h4{font-size:1.12em;margin:0}
.d-badge .pbx{background:#151515;color:#fff;text-align:center;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;min-width:78px;line-height:1.1}
.d-badge .pbx b{font-size:1.22em;margin:2px 0}
.d-badge .pbx small{font-size:.62em}
.d-badge .in{padding:12px 14px}
.d-badge ul.sq{list-style:none;padding:0;margin:12px 0 0}
.d-badge ul.sq li{position:relative;padding-left:16px;font-size:.92em}
.d-badge ul.sq li::before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;background:#222}
/* timetable */
.d-timetable{border:1px solid #333}
.d-timetable .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#1c1c1c;color:#fff;padding:9px 14px}
.d-timetable .bar span{font-size:.74em;letter-spacing:.12em;white-space:nowrap}
.d-timetable .in{padding:12px 14px}
.d-timetable .tt{border-top:1.5px dashed #555;margin-top:12px;padding-top:8px;font-size:.84em;line-height:1.7;color:#2a2a2a;font-variant-numeric:tabular-nums}
.d-timetable .pr{text-align:right;font-weight:800;margin:12px 0 0}
/* bignum */
.d-bignum{border:1px solid #333;padding:14px 16px}
.d-bignum h4{font-weight:300;font-size:1.32em;letter-spacing:-.01em;text-align:right;margin-bottom:12px}
.d-bignum .bn2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.d-bignum .num{text-align:center;padding-right:14px;border-right:1.5px solid #222}
.d-bignum .num b{display:block;font-size:3.2em;line-height:1;font-weight:800;letter-spacing:-.04em}
.d-bignum .num small{display:block;letter-spacing:.2em;font-size:.7em;font-weight:700;margin-top:4px}
.d-bignum .af{font-weight:700}
/* route */
.d-route{border:1px solid #333;padding:14px 16px}
.d-route .ah{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.d-route .ah b{font-size:1.08em}
.d-route .rt{display:flex;justify-content:space-between;position:relative;margin:14px 0 16px}
.d-route .rt::before{content:"";position:absolute;left:6px;right:6px;top:6px;border-top:1.5px solid #222}
.d-route .rt span{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.72em;text-align:center;min-width:0}
.d-route .rt span:first-child{align-items:flex-start;text-align:left}
.d-route .rt span:last-child{align-items:flex-end;text-align:right}
.d-route .rt i{width:13px;height:13px;border-radius:50%;border:1.5px solid #222;background:#fff}
.d-route .af{font-weight:700}
/* pinned */
.d-pinned{padding:12px 6px 6px;background:transparent}
.d-pinned .pn{position:relative;background:#fbfaf6;border:1px solid #cfcac0;box-shadow:2px 5px 12px rgba(0,0,0,.18);padding:22px 16px 14px;transform:rotate(-1.2deg)}
.d-pinned .pin{position:absolute;top:-8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#22324d;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.d-pinned h4{text-align:center;font-size:1.06em;margin-bottom:.3em}
.d-pinned .ti{text-align:center;margin-bottom:.8em}
.d-pinned .af{text-align:center}
/* rounded */
.d-rounded{border:3px solid #1d1d1d;border-radius:16px;padding:16px;text-align:center}
.d-rounded .ric{display:block;width:30px;height:30px;margin:0 auto 6px}
.d-rounded h4{font-size:1.3em;letter-spacing:.22em;text-transform:uppercase;font-weight:800;margin:0}
.d-rounded .su{font-size:.7em;letter-spacing:.22em;text-transform:uppercase;margin:3px 0 13px}
.d-rounded .af{font-weight:700}
/* dropcap */
.d-dropcap{border-top:2px solid #111;border-bottom:1px solid #111;padding:9px 2px 10px}
.d-dropcap .ah{display:flex;justify-content:space-between;gap:10px;font-family:var(--ad-sans);font-size:.72em;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding-bottom:8px;margin-bottom:12px}
.d-dropcap .ah span{font-weight:400}
.d-dropcap .dc{text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.d-dropcap .dc::first-letter{float:left;font-size:3.3em;line-height:.85;font-weight:700;margin:5px 8px 0 0}
.d-dropcap .af{font-family:var(--ad-sans);font-size:.78em;clear:both}
/* coupon */
.d-coupon{border:1.5px dashed #444;padding:16px}
.d-coupon .sc{position:absolute;top:-12px;right:14px;width:22px;height:22px;background:#fff;padding:1px}
.d-coupon .su{font-size:.7em;letter-spacing:.12em;text-transform:uppercase;margin:2px 0 12px}
.d-coupon .cf{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.84em;margin-top:12px}
/* greyband */
.d-greyband{border:1px solid #333}
.d-greyband .gb{background:#e1e1e1;border-bottom:1px solid #333;padding:8px 14px;font-size:1.1em}
.d-greyband .in{padding:12px 14px}
.d-greyband .af{font-weight:700}
/* club */
.d-club{border:1.5px solid #2c5e3f}
.d-club .cb{background:#2c5e3f;color:#fff;padding:12px 16px;font-weight:800;letter-spacing:-.01em;font-size:1.2em;border-bottom:5px solid #fff;box-shadow:0 5px 0 #2c5e3f}
.d-club .in{padding:16px 16px 12px}
.d-club h4{color:#1f4a31}
/* speech */
.d-speech{border:1px solid #333;padding:14px 16px}
.d-speech .hd{font-weight:700;font-size:.84em;letter-spacing:.04em;margin-bottom:9px}
.d-speech .bub{position:relative;display:inline-block;background:#e3efe9;border:1.5px solid #2b5f4d;border-radius:16px;padding:8px 14px;font-weight:800;font-size:1.06em;margin-bottom:18px}
.d-speech .bub::after{content:"";position:absolute;left:22px;bottom:-8px;width:13px;height:13px;background:#e3efe9;border-right:1.5px solid #2b5f4d;border-bottom:1.5px solid #2b5f4d;transform:rotate(45deg)}
/* notebook */
.d-notebook{border:1px solid #9fb4c6;padding:12px 14px 12px 38px;line-height:1.65em;background:#fff repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.65em - 1px),#d3e2ef calc(1.65em - 1px),#d3e2ef 1.65em);background-position:0 12px}
.d-notebook::before{content:"";position:absolute;left:26px;top:0;bottom:0;border-left:1.5px solid #9fb4c6}
.d-notebook h4{font-weight:700;font-size:1.2em;line-height:1.375em;margin:0}
.d-notebook p{margin:0 0 1.65em}
.d-notebook .ti{margin:0}
.d-notebook .af{font-size:1em;margin:0;font-weight:700}
/* sign */
.d-sign{border:1px solid #333}
.d-sign .sg{background:#1f2d4a;color:#fff;margin:8px;border-radius:8px;outline:2px solid #fff;outline-offset:-6px;padding:14px 16px;text-align:center}
.d-sign .sic{display:block;width:26px;height:26px;margin:0 auto 4px}
.d-sign h4{font-size:1.16em;letter-spacing:.08em;text-transform:uppercase;margin:0}
.d-sign .su{font-size:.68em;letter-spacing:.2em;text-transform:uppercase;opacity:.88;margin:3px 0 0}
.d-sign .in{padding:6px 16px 14px}
.d-sign .af{font-weight:700}
.cmh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;letter-spacing:.06em;font-size:.86em;color:var(--ink-2);border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
.cmh span{letter-spacing:0;font-weight:400;color:var(--muted)}

<script id="exam-data" type="application/json">{"build":"202610251745","tests":{"1":{"id":1,"roman":"I","lesen":{"t1":{"instruction":"Lesen Sie den Text und die Aufgaben 1 bis 6 dazu. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","blog":{"site":"leas-reiseblog.de · Unterwegs mit Lea","date":"Sonntag, 17. März","title":"Plan B","paragraphs":["Eigentlich sollte dieser Eintrag schon gestern online sein. Stattdessen schreibe ich ihn jetzt in Janas Küche in Wien – aber der Reihe nach: Am Freitagmorgen stand ich um sechs am Hamburger Flughafen. Das Ticket hatte ich schon vor drei Monaten gebucht, weil meine Freundin Jana am Samstag ihren dreißigsten Geburtstag feiern wollte. An der Anzeigetafel dann die Überraschung: „Flug gestrichen“. Streik. Am Schalter warteten schon über hundert Leute, und die Mitarbeiterin konnte mir nur sagen, dass der nächste freie Platz in einem Flugzeug nach Wien erst am Montag frei sei. Montag! Da wäre die Feier längst vorbei gewesen!","Also habe ich auf dem Handy nach Zügen gesucht. Es gibt tatsächlich eine direkte Verbindung; sie dauert allerdings fast neun Stunden, und die Fahrkarte für denselben Tag kostete mehr als mein Flugticket. Ich habe trotzdem gebucht – was blieb mir übrig? Zum Glück hatte ich meinen Laptop dabei, so konnte ich unterwegs arbeiten und musste keinen Urlaubstag nehmen. Mein Vater meinte am Telefon, ich solle lieber ein Auto mieten. Aber neun Stunden allein auf der Autobahn? Nein danke.","Die Zugfahrt war dann überraschend angenehm: Ich hatte einen Fensterplatz, das WLAN funktionierte fast die ganze Zeit, und in Nürnberg stieg eine ältere Dame zu, die mir bis Passau von ihrer Zeit als Köchin auf einem Schiff erzählte. Nur der Speisewagen war eine Enttäuschung: Die Kaffeemaschine war kaputt.","Kurz nach zehn Uhr abends kam ich in Wien an, mit zwanzig Minuten Verspätung. Jana hat mich trotz der späten Stunde vom Bahnhof abgeholt. Wir haben dann noch bis zwei Uhr in ihrer Küche gesessen – so viel zu meinem Plan, früh ins Bett zu gehen. Die Feier gestern war wunderbar, und heute Nachmittag geht es mit dem Nachtzug zurück – auf das Flugzeug verzichte ich diesmal gern. Das Geld für das gestrichene Ticket bekomme ich übrigens zurück, das hat mir die Fluggesellschaft per E-Mail versprochen. Ob es wirklich ankommt, erzähle ich euch dann hier."],"closing":"Bis bald, eure Lea"},"example":{"no":"0","text":"Lea wollte mit dem Flugzeug nach Wien reisen.","answer":"R"},"items":[{"no":"1","text":"Die Reise war schon lange geplant.","answer":"R"},{"no":"2","text":"Mit dem Flugzeug wäre Lea zu spät zur Party gekommen.","answer":"R"},{"no":"3","text":"Die Bahn war die günstigere Lösung.","answer":"F"},{"no":"4","text":"Der Vorschlag mit der Bahn kam von Leas Vater.","answer":"F"},{"no":"5","text":"Auf der Fahrt hatte Lea Gesellschaft.","answer":"R"},{"no":"6","text":"Die Fluggesellschaft hat Lea den Ticketpreis bereits erstattet.","answer":"F"}]},"t2":{"texts":[{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 7 bis 9 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Pflücken erlaubt","lead":"In Lohheim wächst auf öffentlichen Flächen Gemüse – für alle.","paragraphs":["Wer im Sommer durch den Stadtpark von Lohheim spaziert, sieht statt Rosen Tomatenpflanzen und statt Rasen Kartoffelbeete. „Pflücken erlaubt“ steht auf kleinen Schildern. Seit fünf Jahren pflanzt die Stadt auf öffentlichen Flächen Obst und Gemüse, das sich alle Bürgerinnen und Bürger kostenlos nehmen dürfen. Die Idee kam aus der Stadtgärtnerei: Die Blumenbeete waren teuer und mussten jedes Jahr neu bepflanzt werden. „Gemüse kostet uns nicht mehr als Blumen, aber es nützt den Menschen“, sagt Stadtgärtner Ralf Beck. Die Zerstörungen, die viele am Anfang befürchtet hatten, blieben aus. „Was allen gehört, macht man nicht so schnell kaputt“, meint Beck. Nur die Kirschen im Kurpark seien jedes Jahr weg, bevor die Gärtner überhaupt hinschauen könnten. Am beliebtesten sind Tomaten und Kräuter; Kartoffeln bleiben dagegen oft liegen, weil viele nicht wissen, wann sie reif sind. Auf jedem Schild steht deshalb, woran man das erkennt. Inzwischen helfen rund 60 Freiwillige beim Gießen und Ernten, und eine Schulklasse kümmert sich um die Kräuterbeete am Bahnhof. Beck bekommt regelmäßig Anfragen aus anderen Städten. Sein Rat: klein anfangen, mit einem einzigen Beet an einer belebten Stelle. „Und Geduld haben. Im ersten Jahr wurde bei uns fast nichts geerntet – die Leute haben sich nicht getraut, obwohl es ausdrücklich erlaubt war.“"],"footnote":"","source":"aus einer deutschen Zeitung","example":{"no":"0","stem":"In Lohheim …","options":{"a":"darf man im Park kein Gemüse pflücken.","b":"kann jeder kostenlos Obst und Gemüse ernten.","c":"muss man Gemüse aus dem Park bezahlen."},"answer":"b"},"items":[{"no":"7","stem":"In diesem Text geht es um …","options":{"a":"eine Gemeinde, die ihre Grünflächen essbar macht.","b":"eine Schulklasse, die am Bahnhof Kräuter anbaut.","c":"einen Verein, der Lebensmittel an Bedürftige verteilt."},"answer":"a"},{"no":"8","stem":"Warum setzt Lohheim auf Gemüsebeete?","options":{"a":"Die Blumenbeete wurden häufig beschädigt.","b":"Gemüse ist in der Pflege günstiger.","c":"Die Einwohner haben etwas davon."},"answer":"c"},{"no":"9","stem":"Ralf Beck rät anderen Städten, …","options":{"a":"von Anfang an viele Helfer zu gewinnen.","b":"im kleinen Rahmen zu beginnen.","c":"die Beete im ersten Jahr einzuzäunen."},"answer":"b"}]},{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 10 bis 12 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Bücher statt Telefonate","lead":"In Aarburg ist aus einer alten Telefonkabine* eine Bibliothek geworden.","paragraphs":["Seit die Telefongesellschaft vor einigen Jahren die letzten öffentlichen Telefonkabinen abgebaut hat, stehen in vielen Gemeinden leere Häuschen ungenutzt herum. In Aarburg hat ein Verein die alte Kabine am Bahnhofplatz in eine Bibliothek verwandelt: Wer ein Buch bringt, darf ein anderes mitnehmen – ohne Ausweis, ohne Gebühr, rund um die Uhr. Die Idee hatte die pensionierte Lehrerin Ruth Kessler. „Bei mir zu Hause standen Hunderte Bücher, die ich nie mehr lesen würde“, erzählt sie. Sie fragte bei der Gemeinde nach, und diese vermietet ihr die Kabine seither für einen Franken pro Jahr. Die Regale baute ihr Nachbar, ein Schreiner. Ein Jahr später steht die Kabine nie leer: Krimis und Kinderbücher sind am beliebtesten, Kochbücher bleiben lange stehen. Einmal pro Woche schaut Kessler vorbei, sortiert die Bücher und räumt beschädigte aus. In die Kabine passen rund 150 Bände; Feuchtigkeit war am Anfang das größte Problem, doch seit an der Tür eine neue Dichtung sitzt, bleiben die Regale trocken. Probleme? „Am Anfang haben zwei Jugendliche ihre Getränkedosen in die Regale gestellt. Ich habe einen Abfalleimer danebengestellt, seitdem ist Ruhe.“ Die Kinderbücher stehen inzwischen in einem eigenen, niedrigen Regal, damit die Kleinen selbst auswählen können. Wie viele Bücher im Jahr durch die Kabine gehen, zählt die Gemeinde: 2023 waren es rund 4000. Die Gemeinde plant nun eine zweite Kabine beim Schwimmbad. Betreiben soll sie diesmal die Schule."],"footnote":"*Telefonkabine = Schweizer Standard für „Telefonzelle“","source":"aus einer Schweizer Zeitung","example":null,"items":[{"no":"10","stem":"In diesem Text geht es um …","options":{"a":"die Geschichte des öffentlichen Telefons in der Schweiz.","b":"eine Lehrerin, die ihre Büchersammlung verkauft.","c":"eine Idee, die einem ausgedienten Häuschen eine neue Aufgabe gibt."},"answer":"c"},{"no":"11","stem":"Ruth Kessler …","options":{"a":"wollte Bücher loswerden, die sie nicht mehr brauchte.","b":"zahlt der Gemeinde eine hohe Miete.","c":"hat die Regale selbst gezimmert."},"answer":"a"},{"no":"12","stem":"Die zweite Tauschbibliothek …","options":{"a":"ist bereits in Betrieb.","b":"wird nicht von denselben Leuten betreut wie die erste.","c":"ist eine Idee von Frau Kessler."},"answer":"b"}]}]},"t3":{"instruction":"Lesen Sie die Situationen 13 bis 19 und die Anzeigen a bis j aus verschiedenen deutschsprachigen Medien. Wählen Sie: Welche Anzeige passt zu welcher Situation? Sie können jede Anzeige nur einmal verwenden. Die Anzeige aus dem Beispiel können Sie nicht mehr verwenden. Für eine Situation gibt es keine passende Anzeige. In diesem Fall schreiben Sie 0.","context":"Einige Ihrer Bekannten möchten in ihrer Freizeit etwas Neues lernen und suchen passende Angebote.","example":{"no":"0","text":"Ayşe hat von ihrer Oma eine Nähmaschine bekommen und möchte endlich selbst etwas nähen.","answer":"b"},"items":[{"no":"13","text":"Paul fliegt im Sommer nach Mexiko und möchte sich dort verständigen können.","answer":"a"},{"no":"14","text":"Marta möchte ein Instrument lernen, arbeitet aber in wechselnden Schichten.","answer":"d"},{"no":"15","text":"Ben isst kein Fleisch und sucht am Feierabend Gesellschaft.","answer":"e"},{"no":"16","text":"Frau Yilmaz, 68, möchte ihre Enkel öfter auf dem Bildschirm sehen.","answer":"f"},{"no":"17","text":"Vom langen Sitzen im Büro tut Jonas der Rücken weh. Zeit hat er nur mittags.","answer":"j"},{"no":"18","text":"Lin braucht das Zertifikat B2, kann aber nur von zu Hause aus lernen.","answer":"0"},{"no":"19","text":"Herr Brandt sucht etwas, das er gemeinsam mit seiner zwölfjährigen Tochter machen kann.","answer":"c"}],"ads":[{"letter":"a","design":"inst","header":"Volkshochschule Nord","tag":"FRÜHJAHR","title":"Spanisch für die Reise – Mexiko, Kuba, Spanien","subtitle":"Sprache und Alltag für unterwegs","facts":["Montag und Mittwoch · 18.30–20.00 Uhr","12 Abende ab 8. April · 180 €"],"body":["Am Ende können Sie im Restaurant bestellen, nach dem Weg fragen und sich vorstellen. Für alle, die noch nie Spanisch gelernt haben. Kleine Gruppen, Lehrbuch inbegriffen."],"footer":"www.vhs-nord.de · 0421 / 36 10 10"},{"letter":"b","design":"serif","header":"Nähwerkstatt Faden & Knopf","tag":"","title":"","subtitle":"Vier Samstage, eine Tasche und ein Kissen","facts":[],"body":["Wir zeigen Ihnen die Grundlagen: Schnitt, gerade Naht, Reißverschluss und Saum. Am Ende nehmen Sie eine fertige Tasche und ein Kissen mit nach Hause. Stoffe und Garn stellen wir, Ihre eigene Nähmaschine bringen Sie bitte mit. Höchstens sechs Personen, 9 bis 13 Uhr."],"footer":"Anmeldung: 0421 / 55 66 77 · Werkstatt am Kanal 3"},{"letter":"c","design":"dashed","header":"Werkstatt am Deich","tag":"","title":"","subtitle":"ARBEITEN MIT TON – AN SECHS SAMSTAGEN","facts":[],"body":["Groß und Klein an einer Scheibe: Wir arbeiten immer zu zweit – ein Kind zwischen 8 und 14 Jahren und eine erwachsene Person aus der Familie. Nachmittags von 14 bis 17 Uhr, Material und Brennen inbegriffen."],"footer":"140 € pro Paar · werkstatt-am-deich.de"},{"letter":"d","design":"barhead","deco":{"icon":"note"},"header":"Musikschule Tonleiter","tag":"","title":"Nur Sie, die Lehrkraft und Ihr Instrument.","subtitle":"","facts":[],"body":["Gitarre, Klavier oder Geige – und weil niemand sonst in der Stunde sitzt, verabreden wir den Termin jede Woche neu, morgens, abends oder am Sonntag. Wer kurzfristig arbeiten muss, verschiebt die Stunde einfach. Leihinstrumente sind vorhanden, die erste Stunde ist kostenlos."],"footer":"Tel. 0421 / 33 20 20 · musikschule-tonleiter.de"},{"letter":"e","design":"rules","header":"Löffelweise","tag":"","title":"","subtitle":"KOCHEN OHNE FLEISCH UND FISCH","facts":[],"body":["Freitagabends kochen wir ein Menü aus drei Ländern – und setzen uns anschließend gemeinsam an die lange Tafel. Wer allein kommt, sitzt bestimmt nicht allein am Tisch. 18 bis 22 Uhr, keine Vorkenntnisse nötig, 65 € mit Getränken."],"footer":"Marktstraße 12 · www.loeffelweise.de"},{"letter":"f","design":"pinned","header":"Treffpunkt Mitte","tag":"","title":"Smartphone und Tablet verstehen – ab 60","subtitle":"","facts":[],"body":["Die Kinder wohnen weit weg? Wir üben in Ruhe, wie Sie Ihre Liebsten sehen und hören, Bilder verschicken und Nachrichten lesen. Vier Dienstagvormittage, kostenlos. Bitte bringen Sie Ihr eigenes Gerät mit."],"footer":"Anmeldung im Büro oder 0421 / 44 10 10"},{"letter":"g","design":"corp","header":"SPRACHINSTITUT LINGUA","tag":"","title":"Deutsch B2 – Vorbereitung auf die Prüfung","subtitle":"","facts":[],"body":["Vier Wochen Intensivkurs in kleinen Gruppen, Montag bis Freitag von 9 bis 12 Uhr. Der Unterricht findet ausschließlich bei uns am Theaterplatz statt; einen Fernkurs bieten wir bewusst nicht an. Start: 3. Juni."],"footer":"www.lingua-institut.de"},{"letter":"h","design":"inverse","header":"CODECLUB JUNIOR","tag":"","title":"","subtitle":"SAMSTAGS 10 BIS 13 UHR","facts":[],"body":["Wir bauen eigene Spiele und kleine Roboter, ganz ohne Vorkenntnisse. Für alle zwischen 10 und 14 Jahren, Laptops stehen bereit. Die Eltern holen ihre Kinder um 13 Uhr wieder ab – im Raum sitzen nur die Jugendlichen und unser Team."],"footer":"codeclub-junior.de"},{"letter":"i","design":"classified","header":"MUSIKVEREIN HARMONIE","tag":"KURSE","title":"","subtitle":"","facts":[],"body":["Gitarre in der Gruppe. Zehn Abende im Vereinsheim, donnerstags von 19 bis 20.30 Uhr. Wer fehlt, verpasst den Stoff – Nachholtermine gibt es nicht, weil die Gruppe gemeinsam weiterarbeitet. Ein eigenes Instrument ist erforderlich. 80 €, Anmeldung bis Ende März."],"footer":"harmonie-musikverein.de"},{"letter":"j","design":"mono","header":"Physiopraxis Rückgrat","tag":"","title":"","subtitle":"","facts":["Kräftigen und Dehnen · 30 Min.","Di + Do · 12.15–12.45","Am Marktplatz 4 · 8 €"],"body":["Für alle, die den ganzen Tag am Schreibtisch sitzen: eine halbe Stunde zwischen zwei Terminen, danach duschen und zurück ins Büro. Sportkleidung ist nicht nötig. Ab fünf Personen aus einem Betrieb wird es günstiger."],"footer":"Tel. 0421 / 78 90 12"}]},"t4":{"instruction":"Lesen Sie die Texte 20 bis 26. Wählen Sie: Ist die Person für ein Handyverbot in Restaurants, Ja oder Nein?","context":"In einer Zeitschrift lesen Sie Kommentare zu einem Artikel über Restaurants, in denen Gäste am Tisch weder telefonieren noch im Internet surfen dürfen.","header":"LESERKOMMENTARE","site":"www.gastro-magazin.de/forum","example":{"no":"0","name":"Renate","byline":"Renate, 61, Kassel","text":"Endlich! In unserem Lieblingsrestaurant sitzen am Nachbartisch vier junge Leute, und jeder starrt auf sein Handy – kein Wort. Ein Verbot wäre ein Segen – dann redet man wieder miteinander, so wie früher.","answer":"J"},"items":[{"no":"20","name":"Sabine","byline":"Sabine, 44, Bochum","text":"Als wir neulich in Italien waren, hat der Kellner die Handys der Kinder in einer Kiste gesammelt – und was soll ich sagen: Wir haben zwei Stunden gelacht und geredet wie seit Jahren nicht. Zu Hause schaffen wir das nicht freiwillig. Manchmal braucht es eben eine Regel von außen.","answer":"J"},{"no":"21","name":"Tobias","byline":"Tobias, 29, Linz","text":"Ich verstehe die Wirte, ehrlich gesagt. Aber ich bin oft beruflich unterwegs und esse allein – da lese ich beim Essen Nachrichten oder telefoniere kurz mit meiner Freundin. Soll ich stattdessen die Wand anstarren? Wer andere stört, den kann der Wirt auch so bitten, leiser zu sein. Mehr braucht es doch nicht.","answer":"N"},{"no":"22","name":"Marek","byline":"Marek, 35, Dresden","text":"Ein Restaurant ist kein Kindergarten. Ich bin erwachsen und entscheide selbst, ob mein Handy auf dem Tisch liegt. Wer mir das verbieten will, verliert mich als Gast. Übrigens fotografiere ich gern mein Essen – das ist kostenlose Werbung für den Wirt, darüber sollte er einmal nachdenken.","answer":"N"},{"no":"23","name":"Hanna","byline":"Hanna, 19, Bern","text":"Meiner Generation wird das Handy immer wieder vorgeworfen. Trotzdem: Wenn ich mit Freunden essen gehe und alle nur auf ihr Display gucken, nervt es mich auch. Ich fände es gut, wenn ein Lokal Handys am Tisch verbieten würde – dann weiß man vorher, worauf man sich einlässt, und geht bewusst dorthin.","answer":"J"},{"no":"24","name":"Ulrich","byline":"Ulrich, 52, Graz","text":"Strenge Regeln lösen selten Probleme, meistens schaffen sie neue. Wer wichtige Anrufe erwartet – Eltern kleiner Kinder oder Ärzte im Bereitschaftsdienst –, bleibt dann einfach zu Hause. Besser wäre ein freundlicher Hinweis auf der Speisekarte. Das haben wir in unserem Café so gemacht, und die meisten Gäste halten sich daran.","answer":"N"},{"no":"25","name":"Jasmin","byline":"Jasmin, 38, Hannover","text":"Ich habe lange gedacht, das geht zu weit. Dann habe ich ein Wochenende ohne Handy verbracht und gemerkt, wie viel entspannter ein Abendessen sein kann. Inzwischen gehe ich am liebsten in Restaurants, in denen das Handy in der Tasche bleiben muss – ja, es gibt schon einige. Für mich ist das kein Verbot, sondern ein Geschenk.","answer":"J"},{"no":"26","name":"Kemal","byline":"Kemal, 47, Frankfurt","text":"Als Vater von drei Kindern wünsche ich mir nichts mehr als ein Abendessen ohne Bildschirme. Aber das ist meine Aufgabe, nicht die des Wirts. Wenn ich es nicht schaffe, meinen Kindern Regeln beizubringen, hilft auch kein Schild an der Restauranttür.","answer":"N"}]},"t5":{"instruction":"Lesen Sie die Aufgaben 27 bis 30 und den Text dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","context":"Sie haben eine Jahreskarte für das städtische Hallenbad gekauft und informieren sich über die Badeordnung.","doc":{"title":"BADEORDNUNG · STÄDTISCHES HALLENBAD","intro":"","sections":[{"heading":"Eintritt","text":"Das Bad ist täglich von 7 bis 22 Uhr geöffnet. Der Einlass endet eine Stunde vor Schließung. Die Badezeit beginnt am Drehkreuz und endet mit der Rückgabe des Chips an der Kasse; wird die gebuchte Zeit überschritten, berechnen wir den Aufpreis nach. Jahreskarten sind nicht übertragbar. Bei Verlust stellen wir gegen eine Gebühr von 10 Euro eine Ersatzkarte aus."},{"heading":"Kinder","text":"Kinder unter acht Jahren dürfen das Bad nur in Begleitung einer erwachsenen Person besuchen. Für Kinder bis sechs Jahre ist der Eintritt frei. Das Schwimmerbecken (Tiefe 3,80 m) darf nur von Personen genutzt werden, die sicher schwimmen können."},{"heading":"Hygiene","text":"Vor dem Betreten der Becken ist zu duschen. Straßenschuhe sind in den Umkleiden auszuziehen; im gesamten Nassbereich sind ausschließlich Badeschuhe erlaubt. Das Bad stellt kostenlos Haartrockner zur Verfügung; die Benutzung eigener elektrischer Geräte ist untersagt."},{"heading":"Sicherheit","text":"Den Anweisungen des Personals ist Folge zu leisten. Der Sprungturm ist nur zu den ausgehängten Zeiten und nach Freigabe durch die Aufsicht benutzbar. Ballspiele sind ausschließlich im Nichtschwimmerbecken gestattet. Bei Gewitter ist das Außenbecken sofort zu verlassen."},{"heading":"Garderobe","text":"Für Kleidung und Wertsachen stehen abschließbare Schränke zur Verfügung; der Chip dient als Schlüssel. Für abhandengekommene Gegenstände übernimmt das Bad keine Haftung. Fundsachen werden zwei Wochen an der Kasse aufbewahrt und danach dem städtischen Fundbüro übergeben."},{"heading":"Essen und Trinken","text":"Mitgebrachte Speisen dürfen nur im Bistrobereich verzehrt werden. Glasflaschen sind im gesamten Bad verboten."},{"heading":"","text":"Wer gegen die Badeordnung verstößt, kann des Bades verwiesen werden; ein Anspruch auf Rückerstattung des Eintritts besteht in diesem Fall nicht."}],"footer":""},"example":null,"items":[{"no":"27","stem":"Wer um 21.30 Uhr zum Hallenbad kommt, …","options":{"a":"kann noch eine halbe Stunde schwimmen.","b":"muss den vollen Eintritt bezahlen.","c":"kommt nicht mehr hinein."},"answer":"c"},{"no":"28","stem":"Kinder …","options":{"a":"zahlen bis zum achten Geburtstag nichts.","b":"dürfen erst ab acht Jahren allein kommen.","c":"müssen im flachen Becken bleiben."},"answer":"b"},{"no":"29","stem":"Wenn man seine Jahreskarte verliert, …","options":{"a":"muss man für eine neue Karte bezahlen.","b":"kann man mit der Karte eines Bekannten schwimmen gehen.","c":"wendet man sich an das städtische Fundbüro."},"answer":"a"},{"no":"30","stem":"Im Hallenbad …","options":{"a":"ist Ballspielen überall erlaubt.","b":"darf man mitgebrachte Geräte an die Steckdose anschließen.","c":"darf man keine Getränke in Glasflaschen mitbringen."},"answer":"c"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.","readNote":"Lesen Sie zuerst das Beispiel. Dazu haben Sie 10 Sekunden Zeit.","example":[{"no":"01","type":"rf","text":"Herr Kowalskis Auto ist repariert.","answer":"R"},{"no":"02","type":"abc","stem":"Die Reparatur …","options":{"a":"fiel günstiger aus als besprochen.","b":"kostet 380 Euro.","c":"muss bar bezahlt werden."},"answer":"b"}],"texts":[{"label":"Text 1","items":[{"no":"1","type":"rf","text":"Der Zug fährt heute wie geplant bis zur Endstation.","answer":"F"},{"no":"2","type":"abc","stem":"Wer zum Flughafen will, …","options":{"a":"muss eine zusätzliche Fahrkarte kaufen.","b":"steigt in Frankfurt in einen anderen Zug um.","c":"verlässt den Zug schon in Mannheim."},"answer":"b"}]},{"label":"Text 2","items":[{"no":"3","type":"rf","text":"Marco muss den Plan für Samstag ändern.","answer":"R"},{"no":"4","type":"abc","stem":"Marco …","options":{"a":"kommt um acht bei Selin vorbei.","b":"hat die Karten schon gekauft.","c":"will erst Selins Zusage abwarten."},"answer":"c"}]},{"label":"Text 3","items":[{"no":"5","type":"rf","text":"Am Sonntag regnet es im ganzen Land.","answer":"F"},{"no":"6","type":"abc","stem":"In den Bergen …","options":{"a":"bleibt es den ganzen Sonntag trocken.","b":"fällt in höheren Lagen Schnee.","c":"steigen die Temperaturen auf 20 Grad."},"answer":"b"}]},{"label":"Text 4","items":[{"no":"7","type":"rf","text":"Die Durchsage richtet sich an die Kunden eines Möbelhauses.","answer":"R"},{"no":"8","type":"abc","stem":"Die Kinderbetreuung …","options":{"a":"ist vorübergehend an einen anderen Ort verlegt.","b":"befindet sich im dritten Stock.","c":"wird diese Woche nicht angeboten."},"answer":"a"}]},{"label":"Text 5","items":[{"no":"9","type":"rf","text":"Diese Woche findet keine Yogastunde statt.","answer":"R"},{"no":"10","type":"abc","stem":"Frau Nowak …","options":{"a":"erhält ihr Geld in jedem Fall zurück.","b":"soll sich telefonisch melden.","c":"bekommt einen Ersatztermin am Ende des Kurses."},"answer":"c"}]}]},"t2":{"instruction":"Sie hören nun einen Text. Sie hören den Text einmal. Dazu lösen Sie fünf Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","readNote":"Lesen Sie jetzt die Aufgaben 11 bis 15. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie machen mit Ihrer Familie Urlaub auf einem Bauernhof im Allgäu. Am ersten Abend begrüßt die Bäuerin alle Gäste.","items":[{"no":"11","stem":"Die Gäste …","options":{"a":"bekommen dreimal am Tag etwas zu essen.","b":"müssen sich mittags und abends selbst versorgen.","c":"sind auf die Gasthäuser im Dorf angewiesen."},"answer":"b"},{"no":"12","stem":"Wer beim Melken zuschauen möchte, …","options":{"a":"hat zweimal am Tag Gelegenheit dazu.","b":"muss dafür vor sechs Uhr aufstehen.","c":"muss sich in eine Liste eintragen."},"answer":"a"},{"no":"13","stem":"Reiten dürfen die Kinder …","options":{"a":"jeden Tag, wenn sie möchten.","b":"ohne vorherige Eintragung.","c":"nur an zwei festen Tagen in der Woche."},"answer":"c"},{"no":"14","stem":"Für die Wanderung zur Alm …","options":{"a":"kann man sich noch am Morgen anmelden.","b":"ist passendes Schuhwerk vorgeschrieben.","c":"ist man den ganzen Tag unterwegs."},"answer":"b"},{"no":"15","stem":"Fahrräder …","options":{"a":"leiht man sich im Dorf aus.","b":"darf man nur mit eigenem Helm benutzen.","c":"bekommt man auf dem Hof, ohne etwas zu bezahlen."},"answer":"c"}]},"t3":{"instruction":"Sie hören nun ein Gespräch. Sie hören das Gespräch einmal. Dazu lösen Sie sieben Aufgaben. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","readNote":"Lesen Sie jetzt die Aufgaben 16 bis 22. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie sitzen in der S-Bahn und hören, wie sich zwei Kollegen, Nina und Tom, über ihr Wochenende unterhalten.","items":[{"no":"16","text":"Die Idee zum Kochkurs kam von Nina selbst.","answer":"F"},{"no":"17","text":"Der Teig war schneller fertig, als Nina gedacht hatte.","answer":"R"},{"no":"18","text":"Nina wird zwei Kursteilnehmer bald wiedersehen.","answer":"R"},{"no":"19","text":"Ninas erster Versuch zu Hause hat geklappt.","answer":"F"},{"no":"20","text":"Tom hat auf der Feier vor allen Gästen gesprochen.","answer":"F"},{"no":"21","text":"Die Gäste hatten Einfluss auf die Musik.","answer":"R"},{"no":"22","text":"Die Tante hat sich mit ihrer Geschenkidee durchgesetzt.","answer":"F"}]},"t4":{"instruction":"Sie hören nun eine Diskussion. Sie hören die Diskussion zweimal. Dazu lösen Sie acht Aufgaben. Ordnen Sie die Aussagen zu: Wer sagt was?","readNote":"Lesen Sie jetzt die Aussagen 23 bis 30. Dazu haben Sie 60 Sekunden Zeit.","context":"Der Moderator der Radiosendung „Standpunkte“ diskutiert mit der Medizinstudentin Lea Hoffmann und dem Schreinermeister Karl Brenner zum Thema „Soll jeder junge Mensch nach der Schule ein soziales Jahr machen?“.","speakers":{"a":"Moderator","b":"Lea Hoffmann","c":"Karl Brenner"},"example":{"no":"0","text":"Viele junge Menschen wissen nach der Schule nicht, was sie machen wollen.","answer":"a"},"items":[{"no":"23","text":"Nach einem sozialen Jahr fällt die Berufswahl leichter.","answer":"b"},{"no":"24","text":"Im Handwerk bleiben Lehrstellen unbesetzt.","answer":"c"},{"no":"25","text":"Wer gezwungen wird, hilft niemandem wirklich.","answer":"c"},{"no":"26","text":"Soziale Einrichtungen haben zu wenige Mitarbeiter.","answer":"a"},{"no":"27","text":"Die Bezahlung im sozialen Jahr reicht nicht zum Leben.","answer":"b"},{"no":"28","text":"Auch eine Ausbildung im Betrieb nützt der Gesellschaft.","answer":"c"},{"no":"29","text":"Für manche Familien wäre ein schlecht bezahltes Jahr ein Problem.","answer":"a"},{"no":"30","text":"Das Angebot sollte nicht auf Schulabgänger beschränkt sein.","answer":"b"}]}},"schreiben":{"intro":"Das Modul Schreiben besteht aus drei Teilen. In den Aufgaben 1 und 3 schreiben Sie E-Mails, in Aufgabe 2 schreiben Sie einen Diskussionsbeitrag. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf den Antwortbogen.","tasks":[{"no":1,"minutes":20,"words":80,"situation":["Sie waren am Wochenende mit Freunden in Berlin. Ein Freund/Eine Freundin von Ihnen konnte nicht mitkommen, weil er/sie arbeiten musste."],"points":["Beschreiben Sie: Wie war das Wochenende?","Begründen Sie: Was hat Ihnen am besten gefallen und warum?","Machen Sie einen Vorschlag für eine gemeinsame Unternehmung."],"post":null,"instruction":"Schreiben Sie eine E-Mail (circa 80 Wörter). Schreiben Sie etwas zu allen drei Punkten. Achten Sie auf den Textaufbau (Anrede, Einleitung, Reihenfolge der Inhaltspunkte, Schluss).","model":{"label":"E-Mail an eine Freundin, ca. 95 Wörter","text":"Betreff: Unser Wochenende in Berlin\n\nLiebe Mia,\n\nschade, dass du am Wochenende arbeiten musstest! Berlin war toll. Wir sind am Freitagabend mit dem Zug gefahren und haben in einem Hostel in Kreuzberg gewohnt. Am Samstag haben wir das Brandenburger Tor gesehen und sind über einen Flohmarkt gebummelt, abends waren wir bei einem kleinen Konzert.\n\nAm besten hat mir die Bootsfahrt auf der Spree gefallen, weil man vom Wasser aus die ganze Stadt sieht und die Füße endlich einmal Pause hatten.\n\nWie wäre es, wenn wir im Herbst zusammen nach Dresden fahren? Ich könnte schon einmal nach günstigen Zugverbindungen schauen.\n\nLiebe Grüße\nSofia"},"typicalErrors":"Leitpunkt 3 (Vorschlag) vergessen oder ohne konkreten Termin · nur beschreiben, nicht begründen („weil …“) · Sie statt du."},{"no":2,"minutes":25,"words":80,"situation":["Sie haben im Fernsehen eine Diskussionssendung zum Thema „Immer erreichbar?“ gesehen. Im Online-Gästebuch der Sendung finden Sie folgende Meinung:"],"points":[],"post":{"site":"www.diskussion-aktuell.de","label":"Gästebuch","author":"Daniel · 12.03. 20:41 Uhr","text":"Mein Chef schickt auch am Sonntag E-Mails, und meine Freunde erwarten, dass ich sofort antworte. Seit einem Monat schalte ich das Handy abends aus. Am Anfang war das komisch, aber jetzt schlafe ich besser. Trotzdem habe ich manchmal Angst, etwas Wichtiges zu verpassen."},"instruction":"Schreiben Sie nun Ihre Meinung zum Thema (circa 80 Wörter).","model":{"label":"Diskussionsbeitrag, ca. 95 Wörter","text":"Ich verstehe Daniel gut. Auch ich bekomme abends noch Nachrichten von der Arbeit, und früher habe ich immer sofort geantwortet. Meiner Meinung nach ist das nicht gesund: Wer nie abschaltet, kann sich auch nicht erholen.\n\nIch finde, man braucht klare Regeln. Bei mir bleibt das Handy ab 21 Uhr in der Küche, und meine Freunde wissen das. Wirklich wichtige Nachrichten erreichen einen trotzdem – dann ruft jemand an.\n\nDie Angst, etwas zu verpassen, hatte ich am Anfang auch. Heute denke ich: Man verpasst viel mehr, wenn man ständig auf das Display schaut."},"typicalErrors":"Nur Daniels Meinung zusammenfassen, keine eigene · keine Beispiele · deutlich unter 80 Wörtern."},{"no":3,"minutes":15,"words":40,"situation":["Ihre Vermieterin, Frau Berger, möchte am Freitagnachmittag in Ihre Wohnung kommen, um die Heizung zu überprüfen. Sie sind zu dieser Zeit nicht zu Hause."],"points":[],"post":null,"instruction":"Schreiben Sie an Frau Berger. Entschuldigen Sie sich höflich und schlagen Sie einen anderen Termin vor. Schreiben Sie eine E-Mail (circa 40 Wörter). Vergessen Sie nicht die Anrede und den Gruß am Schluss.","model":{"label":"E-Mail an die Vermieterin, ca. 45 Wörter","text":"Sehr geehrte Frau Berger,\n\nleider bin ich am Freitagnachmittag nicht zu Hause, weil ich bis 18 Uhr arbeiten muss. Das tut mir sehr leid. Wäre es Ihnen möglich, stattdessen am Samstagvormittag oder am Montag nach 17 Uhr zu kommen? Bitte sagen Sie mir kurz Bescheid, welcher Termin Ihnen passt.\n\nMit freundlichen Grüßen\nAnna Kowal"},"typicalErrors":"Entschuldigung ohne Alternativtermin · Hallo Frau Berger / Liebe Grüße bei einer Vermieterin · Grund für die Abwesenheit fehlt."}]},"audio":[{"src":"Goethe%20B1%20Modelltest%201.1.mp3","dur":446.25},{"src":"Goethe%20B1%20Modelltest%201.2.mp3","dur":204.49},{"src":"Goethe%20B1%20Modelltest%201.3.mp3","dur":205.66},{"src":"Goethe%20B1%20Modelltest%201.4.mp3","dur":596.19}],"pdf":"Goethe%20B1%20Modelltest%201.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"2":{"id":2,"roman":"II","lesen":{"t1":{"instruction":"Lesen Sie den Text und die Aufgaben 1 bis 6 dazu. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","blog":{"site":"mein-erstes-jahr.de · Timo","date":"Montag, 8. April","title":"Umzug mit Hindernissen","paragraphs":["Seit Samstag wohne ich also in der Gartenstraße. Drei Zimmer, vierter Stock, eigener Balkon – und ein Umzug, über den ich in zehn Jahren bestimmt lachen kann. Den Transporter hatte ich schon drei Wochen vorher reserviert, zusammen mit einer Sackkarre und zehn Umzugsdecken. Die Sackkarre war die beste Idee des Tages – ohne sie hätten wir den Kühlschrank nie in den vierten Stock gebracht. Als ich am Samstagmorgen um acht bei der Autovermietung stand, war der große Wagen allerdings noch nicht zurück. „Nehmen Sie den kleinen, der reicht doch“, meinte der Mann am Schalter. Er reichte natürlich nicht: Wir sind dreimal gefahren statt einmal.","Zugesagt hatten mir zwei Freunde. Jonas hat um halb neun geklingelt, mit zwei Kaffeebechern in der Hand, und ist bis zum Abend geblieben. Der andere lag mit Grippe im Bett – wirklich ärgerlich war das nicht, er hatte mich am Abend vorher angerufen. Dafür stand plötzlich meine neue Nachbarin aus dem dritten Stock im Treppenhaus, sah unsere Kisten und drückte mir ihre Bohrmaschine in die Hand: „Die brauchen Sie sowieso.“ Am Abend hat sie uns dann auch noch zwei Tassen Kaffee hochgebracht.","Das eigentliche Problem war der Aufzug. Am Freitag lief er noch, am Samstag hing ein Zettel an der Tür: „Wartung“. Vierter Stock, achtzig Stufen, ein Sofa. Jonas hat irgendwann nur noch gelacht. Zwischendurch haben wir dreimal Pause gemacht, und ein Nachbar aus dem Erdgeschoss hat die Haustür offen gehalten, weil unser Keil nicht hielt. Gegen sechs waren wir fertig, danach gab es Pizza auf dem Fußboden, weil der Tisch noch in Teilen im Flur lag.","Ein Rätsel ist noch offen: Für den Keller fehlt mir der Schlüssel. Der Vermieter hat mir am Telefon versprochen, dass er diese Woche einen zweiten bringt. Bis dahin stehen meine Fahrräder im Wohnzimmer, und im Flur warten noch alle Bücherkartons. Nächstes Wochenende kommen die Regale an die Wand – mit der Bohrmaschine von unten."],"closing":"Bis dann, Timo"},"example":{"no":"0","text":"Timo ist in eine andere Wohnung gezogen.","answer":"R"},"items":[{"no":"1","text":"Um das Fahrzeug hatte sich Timo früh gekümmert.","answer":"R"},{"no":"2","text":"Timo hat den Wagen bekommen, den er wollte.","answer":"F"},{"no":"3","text":"Von Timos Freunden hat nur einer beim Umzug geholfen.","answer":"R"},{"no":"4","text":"Die Nachbarin hat Timo ein Werkzeug geliehen.","answer":"R"},{"no":"5","text":"Der Aufzug war am Umzugstag in Betrieb.","answer":"F"},{"no":"6","text":"Timo hat den Kellerschlüssel inzwischen erhalten.","answer":"F"}]},"t2":{"texts":[{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 7 bis 9 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Der Bus, den die Nachbarn fahren","lead":"In Reinsdorf bringt ein Kleinbus die Dorfbewohner in die Stadt – am Steuer sitzen Freiwillige.","paragraphs":["Wer in Reinsdorf ohne Auto zum Arzt oder zum Einkaufen in die Kreisstadt wollte, hatte es jahrelang schwer: Die Buslinie wurde 2019 gestrichen, weil zu wenige Fahrgäste einstiegen. Heute fährt wieder ein Bus – ein Kleinbus mit acht Plätzen, und am Steuer sitzt kein Angestellter, sondern ein Nachbar. Achtzehn Freiwillige teilen sich den Dienstplan, gefahren wird dienstags, donnerstags und samstags, jeweils dreimal hin und zurück. Die Fahrkarte kostet zwei Euro, Kinder zahlen nichts. Wer nicht sicher ist, wann der Bus kommt, findet den Fahrplan im Schaukasten am Rathaus und als Zettel an jeder Haltestelle. Den Bus hat der Landkreis bezahlt, für Versicherung, Benzin und Werkstatt kommt der Verein auf. „Viele denken, dafür bräuchte man einen Busführerschein. Den braucht man nicht“, sagt Elke Kranz, die den Dienstplan schreibt. „Ein normaler Führerschein genügt, dazu eine Schulung an zwei Abenden. Mitglied im Verein muss man auch nicht sein.“ Gemeldet haben sich vor allem Rentner, inzwischen fahren aber auch zwei Frauen mit, die Schichtdienst haben. Die Fahrgäste sind älter, als der Verein erwartet hatte; freitags sitzen allerdings vor allem Jugendliche im Bus, die zum Schwimmbad wollen. Aus drei Nachbardörfern kommen jetzt Anfragen. Kranz rät ihnen, nicht mit dem Fahrplan anzufangen: „Suchen Sie zuerst die Fahrer. Ein schöner Fahrplan hilft nichts, wenn samstags niemand fahren will.“"],"footnote":"","source":"aus einer deutschen Zeitung","example":{"no":"0","stem":"In Reinsdorf …","options":{"a":"fährt seit 2019 kein Bus mehr.","b":"fahren Freiwillige einen Kleinbus.","c":"zahlen alle Fahrgäste zwei Euro."},"answer":"b"},"items":[{"no":"7","stem":"In diesem Text geht es um …","options":{"a":"Nachbarn, die den Nahverkehr selbst organisieren.","b":"einen Landkreis, der neue Buslinien kauft.","c":"einen Verein, der Führerscheine finanziert."},"answer":"a"},{"no":"8","stem":"Wer den Bürgerbus fahren möchte, …","options":{"a":"muss dem Verein beitreten.","b":"braucht eine besondere Fahrerlaubnis.","c":"muss vorher einen kurzen Kurs besuchen."},"answer":"c"},{"no":"9","stem":"Elke Kranz empfiehlt anderen Dörfern, …","options":{"a":"mit der Suche nach Freiwilligen zu beginnen.","b":"einen genauen Fahrplan zu veröffentlichen.","c":"den Bus selbst zu kaufen."},"answer":"a"}]},{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 10 bis 12 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Milch holen um Mitternacht","lead":"In Lehen verkauft ein Bauernhof rund um die Uhr – aus einem Automaten am Hoftor.","paragraphs":["Vor dem Hoftor der Familie Gruber in Lehen steht seit zwei Jahren ein weißer Kasten mit Glasfenstern: ein Verkaufsautomat für Milch, Eier, Käse und Speck. Vorher gab es einen Hofladen, geöffnet von 16 bis 18 Uhr. „Die Leute kamen um sieben von der Arbeit und standen vor einer verschlossenen Tür“, erzählt Maria Gruber. Den Automaten kaufte die Familie gebraucht von einem Betrieb, der aufgegeben hatte; neu wäre er kaum zu bezahlen gewesen. Jetzt ist rund um die Uhr geöffnet, und der Umsatz hat sich mehr als verdoppelt. Ganz ohne Probleme lief es nicht: Bis zum Sommer nahm das Gerät nur Münzen, viele Kunden standen ratlos davor. Seit Juli kann man auch mit Karte zahlen, seither kommen deutlich mehr Kunden von außerhalb. Im ersten Winter fror die Technik ein; inzwischen sorgt eine kleine Heizung dafür, dass der Automat auch bei minus zehn Grad läuft. Das Brot liefert die Bäckerin aus dem Dorf, dafür darf sie ihre Semmeln im Automaten verkaufen. Am Gerät hängt eine Preisliste; geändert wird sie einmal im Jahr. Am besten gehen im Sommer Käse und Speck – viele Wanderer holen sich hier ihre Jause*. Der Nachbarhof möchte nun ebenfalls einen Automaten aufstellen. Maria Gruber ist skeptisch: „Bei uns funktioniert das, weil die Straße zum See direkt am Hof vorbeiführt. Wer weit weg von der Straße liegt, wartet umsonst.“"],"footnote":"*Jause = österreichischer Standard für „Imbiss, Zwischenmahlzeit“","source":"aus einer österreichischen Zeitung","example":null,"items":[{"no":"10","stem":"In diesem Text geht es um …","options":{"a":"eine Bäckerei, die Automaten aufstellt.","b":"einen Bauernhof, der Tag und Nacht verkauft.","c":"ein Dorf ohne Einkaufsmöglichkeiten."},"answer":"b"},{"no":"11","stem":"Der Automat …","options":{"a":"war am Anfang nur mit Bargeld zu bedienen.","b":"war in der Anschaffung sehr teuer.","c":"steht im früheren Hofladen."},"answer":"a"},{"no":"12","stem":"Maria Gruber meint, ein Automat …","options":{"a":"sollte erst im Sommer aufgestellt werden.","b":"lohnt sich nur an einer belebten Strecke.","c":"ist für kleine Höfe zu teuer."},"answer":"b"}]}]},"t3":{"instruction":"Lesen Sie die Situationen 13 bis 19 und die Anzeigen a bis j aus verschiedenen deutschsprachigen Medien. Wählen Sie: Welche Anzeige passt zu welcher Situation? Sie können jede Anzeige nur einmal verwenden. Die Anzeige aus dem Beispiel können Sie nicht mehr verwenden. Für eine Situation gibt es keine passende Anzeige. In diesem Fall schreiben Sie 0.","context":"Einige Bekannte von Ihnen möchten sich ehrenamtlich engagieren und suchen eine passende Aufgabe.","example":{"no":"0","text":"Frau Ort möchte einem Kind beim Lesen helfen und hat vormittags Zeit.","answer":"b"},"items":[{"no":"13","text":"Sina studiert und hat nur am Wochenende Zeit. Mit Tieren kommt sie gut zurecht.","answer":"a"},{"no":"14","text":"Herr Öz ist Rentner, sitzt gern am Steuer und möchte für andere unterwegs sein.","answer":"d"},{"no":"15","text":"Malik spielt seit Jahren Fußball und würde gern mit Kindern trainieren.","answer":"e"},{"no":"16","text":"Frau Bauer arbeitet bis 18 Uhr und möchte Zugewanderten beim Üben helfen.","answer":"f"},{"no":"17","text":"Frau Krieg ist wenig mobil und sucht eine Aufgabe für zu Hause.","answer":"0"},{"no":"18","text":"Jan repariert in seiner Freizeit alte Elektrogeräte und Fahrräder.","answer":"j"},{"no":"19","text":"Herr Nowak, 34, möchte bei Unfällen und Bränden helfen und ist zu einer langen Ausbildung bereit.","answer":"c"}],"ads":[{"letter":"a","design":"tearoff","header":"Tierheim Sonnenhof","tag":"EHRENAMT","title":"Wer geht mit unseren Hunden spazieren?","subtitle":"","facts":[],"body":["Vierzig Hunde brauchen zweimal täglich Bewegung – vor allem am Samstag und Sonntag fehlen uns Helferinnen und Helfer. Ab 18 Jahren, Einführung durch unsere Pfleger, Gummistiefel leihen wir Ihnen. Zwei Stunden pro Woche genügen."],"footer":"tierheim-sonnenhof.de · 0421 / 90 11 22"},{"letter":"b","design":"chalk","header":"Grundschule am Wall","tag":"","title":"Lesepaten und Lesepatinnen gesucht","subtitle":"","facts":[],"body":["Einmal in der Woche lesen Sie eine Stunde mit einem Kind, dem das Lesen noch schwerfällt – dienstags oder donnerstags zwischen 9 und 11 Uhr. Eine kurze Einführung gibt unsere Lehrerin Frau Reuter."],"footer":"Anmeldung im Sekretariat · 0421 / 22 33 44"},{"letter":"c","design":"stripes","header":"Freiwillige Feuerwehr Reinsdorf","tag":"WIR BILDEN AUS","title":"","subtitle":"","facts":[],"body":["Wenn es brennt oder ein Auto verunglückt, sind wir die Ersten am Ort – und das lernen Sie bei uns von Anfang an. Die Grundausbildung umfasst 80 Stunden an Wochenenden, danach wird jeden Montagabend geübt. Voraussetzung: mindestens 18 Jahre alt und gesundheitlich fit."],"footer":"Kommen Sie montags um 19 Uhr vorbei · ff-reinsdorf.de"},{"letter":"d","design":"logo","deco":{"icon":"bus"},"header":"Bürgerbus-Verein Reinsdorf","tag":"","title":"Fahrerinnen und Fahrer gesucht.","subtitle":"","facts":[],"body":["Dienstags, donnerstags und samstags bringen wir Nachbarn in die Kreisstadt. Ein normaler Führerschein genügt, die Schulung dauert zwei Abende. Sie sagen uns, wann Sie Zeit haben."],"footer":"Elke Kranz · 0 44 21 / 78 12"},{"letter":"e","design":"club","header":"SV Grün-Weiß Reinsdorf","tag":"","title":"Kindertraining (6 bis 10 Jahre)","subtitle":"","facts":[],"body":["Zweimal pro Woche, montags und mittwochs ab 16.30 Uhr. Erfahrung auf dem Platz ist uns wichtiger als ein Diplom – den Trainerschein bezahlt der Verein."],"footer":"Jugendleiter Tim Ahrens · sv-gruen-weiss.de"},{"letter":"f","design":"speech","header":"Stadtteilzentrum Nord","tag":"","title":"Sprachcafé: Wer spricht mit?","subtitle":"","facts":[],"body":["Jeden Dienstag von 19 bis 21 Uhr sprechen Erwachsene aus vielen Ländern Deutsch – in kleinen Runden, bei Tee und Keksen. Sie brauchen keine Ausbildung, nur Geduld und Freude am Zuhören."],"footer":"Einfach vorbeikommen: Nordstraße 8"},{"letter":"g","design":"hotel","deco":{"icon":"columns"},"header":"STADTMUSEUM REINSDORF","tag":"","title":"Führungen für Schulklassen","subtitle":"","facts":[],"body":["Sie zeigen Kindern unsere Ausstellung zur Stadtgeschichte. Die Termine liegen mittwochs und freitags zwischen 9 und 12 Uhr; die Einarbeitung dauert vier Wochen. Abends und am Wochenende finden keine Führungen statt."],"footer":"museum-reinsdorf.de"},{"letter":"h","design":"inverse","header":"TAFEL REINSDORF","tag":"","title":"","subtitle":"HELFEN SIE BEIM SORTIEREN","facts":[],"body":["Wir holen Lebensmittel ab, prüfen sie und geben sie weiter. Gearbeitet wird vormittags in unserer Halle – von zu Hause aus ist das leider nicht möglich. Feste Schichten ab drei Stunden."],"footer":"tafel-reinsdorf.de"},{"letter":"i","design":"dropcap","header":"JUGENDFEUERWEHR REINSDORF","tag":"","title":"","subtitle":"","facts":[],"body":["Mitmachen ab 10 Jahren. Wir treffen uns freitags um 17 Uhr, üben mit echten Geräten und fahren im Sommer ins Zeltlager. Das Angebot gilt für Jugendliche bis 17 Jahre."],"footer":"Jugendwart Sven Post · 0 44 21 / 65 09"},{"letter":"j","design":"mono","deco":{"icon":"wrench"},"header":"Repair-Café im Bürgerhaus","tag":"","title":"","subtitle":"","facts":[],"body":["Samstags von 10 bis 14 Uhr reparieren wir gemeinsam mit den Gästen Toaster, Lampen und Fahrräder. Wer sich mit Elektrogeräten oder Rädern auskennt, ist bei uns goldrichtig. Werkzeug steht bereit. Wie oft Sie kommen, entscheiden Sie selbst."],"footer":"repaircafe-reinsdorf.de"}]},"t4":{"instruction":"Lesen Sie die Texte 20 bis 26. Wählen Sie: Ist die Person für die Vier-Tage-Woche, Ja oder Nein?","context":"In einer Zeitschrift lesen Sie Kommentare zu einem Artikel über Betriebe, die ihren Beschäftigten vier Arbeitstage bei gleichem Lohn anbieten.","header":"LESERKOMMENTARE","site":"www.arbeit-heute.de/forum","example":{"no":"0","name":"Ingrid","byline":"Ingrid, 57, Kiel","text":"Unsere Abteilung macht das seit Januar: freitags ist zu, der Lohn bleibt gleich. Ich bin erholter, und liegen geblieben ist bisher nichts. Sogar mein Mann sagt, ich sei am Wochenende geduldiger. Warum haben wir das nicht schon vor zehn Jahren gemacht?","answer":"J"},"items":[{"no":"20","name":"Andreas","byline":"Andreas, 45, Coburg","text":"Ich verstehe den Wunsch, ehrlich. In meiner Schreinerei sind wir vier Leute, und unsere Kunden rufen nun einmal freitags an. Wenn ich einen Tag zumache, geht der Auftrag zum Nächsten. Für Büros mag das passen, für kleine Betriebe wie meinen ist es einfach nicht zu machen. Zwei meiner Gesellen sehen das übrigens genauso.","answer":"N"},{"no":"21","name":"Melike","byline":"Melike, 33, Duisburg","text":"Bei uns liefen sechs Monate zur Probe mit vier Tagen. Wir haben kürzere Besprechungen gehalten und weniger E-Mails geschrieben – geschafft haben wir am Ende genauso viel. Dass die Geschäftsführung jetzt dabei bleibt, war die logische Folge. Krank war in dem halben Jahr fast niemand. Ich möchte nicht mehr zurück.","answer":"J"},{"no":"22","name":"Robert","byline":"Robert, 39, Erfurt","text":"Vier Tage klingen gut, lösen mein Problem aber nicht. Ich brauche keinen freien Freitag, sondern Arbeitszeiten, die zu meinen Kindern passen. Lieber jeden Tag zwei Stunden früher Schluss oder zwei Tage im Homeoffice – das wäre eine echte Hilfe. Darüber redet in unserer Firma leider niemand.","answer":"N"},{"no":"23","name":"Sonja","byline":"Sonja, 48, Halle","text":"Anfangs war ich skeptisch: Wie soll die Arbeit von fünf Tagen in vier passen? Dann hat unsere Klinik es in der Verwaltung ausprobiert. Heute sind die Krankmeldungen seltener, und wir finden wieder Bewerberinnen. Selbst die Ärztinnen, die zuerst dagegen waren, wollen es behalten. Wenn es sogar bei uns geht, kann man es überall versuchen.","answer":"J"},{"no":"24","name":"Pawel","byline":"Pawel, 52, Bremen","text":"Ich habe zwölf Angestellte in zwei Bäckereien. Meine Leute wären natürlich sofort dafür – aber wer steht dann am Samstag im Laden? Ich müsste drei Leute zusätzlich einstellen und finde schon jetzt keine. Solche Vorschläge kommen immer von Menschen, die nie selbst Personal gesucht haben. In der Stadt findet man vielleicht noch jemanden, bei uns auf dem Land bestimmt nicht.","answer":"N"},{"no":"25","name":"Thomas","byline":"Thomas, 41, Passau","text":"Nach vier langen Tagen bin ich abends zu müde für die Kinder. Ich hätte lieber fünf kürzere Tage, dann sehe ich sie jeden Nachmittag. Freie Freitage helfen mir wenig, wenn die Woche vorher aus Zehn-Stunden-Tagen besteht. Meine Frau arbeitet ohnehin im Schichtdienst, da passt das schon heute kaum zusammen.","answer":"N"},{"no":"26","name":"Hanna","byline":"Hanna, 29, Wien","text":"Für mich hängt alles am Geld: vier Tage ja, aber nicht mit zwanzig Prozent weniger im Portemonnaie. Bleibt der Lohn gleich, bin ich sofort dabei. Mein Kollege hat es privat schon gerechnet – ohne die Fahrten zur Arbeit spart man am fünften Tag ohnehin. Vier Tage arbeiten und den vollen Lohn bekommen: Das wäre für mich in Ordnung.","answer":"J"}]},"t5":{"instruction":"Lesen Sie die Aufgaben 27 bis 30 und den Text dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","context":"Sie sind in ein Mietshaus gezogen und lesen die Hausordnung.","doc":{"title":"HAUSORDNUNG · GARTENSTRASSE 14","intro":"","sections":[{"heading":"Ruhezeiten","text":"Von 22 bis 6 Uhr sowie sonn- und feiertags ganztägig ist Lärm zu vermeiden. Musizieren ist außerhalb der Ruhezeiten bis zu zwei Stunden täglich erlaubt. Wer ein Fest plant, hängt bitte zwei Tage vorher einen Hinweis im Treppenhaus aus; eine Genehmigung der Verwaltung ist dafür nicht nötig."},{"heading":"Waschküche","text":"Die Waschmaschinen im Keller stehen von 7 bis 21 Uhr zur Verfügung. Die Zeiten werden im Plan an der Tür eingetragen, pro Wohnung höchstens zwei Termine in der Woche. Nach dem Waschen sind Sieb und Boden zu reinigen. Wäsche darf nur im Trockenraum aufgehängt werden, nicht auf dem Balkon."},{"heading":"Treppenhaus und Keller","text":"Flure und Treppen müssen frei bleiben; Fahrräder, Kinderwagen und Schuhregale gehören nicht dorthin. Für Fahrräder ist der Raum neben der Einfahrt vorgesehen. Das Treppenhaus wird von einer Firma gereinigt, die Kosten trägt die Hausgemeinschaft."},{"heading":"Müll","text":"Papier, Glas und Verpackungen werden getrennt. Die Tonnen werden montags von der Hausmeisterin an die Straße gestellt. Sperrmüll darf nicht im Hof abgestellt werden; eine Abholung melden Sie selbst bei der Stadt an."},{"heading":"Grillen und Balkon","text":"Auf den Balkonen ist Grillen mit Kohle untersagt, elektrische Geräte sind erlaubt. Blumenkästen sind an der Innenseite des Geländers zu befestigen. Gegossen wird so, dass kein Wasser auf den Balkon darunter läuft."},{"heading":"Schäden und Schlüssel","text":"Schäden melden Sie bitte sofort der Hausmeisterin, bei Wasserschäden auch außerhalb der Bürozeiten. Zusätzliche Schlüssel erhalten Sie gegen eine Gebühr von 15 Euro bei der Verwaltung. Wer den Hausschlüssel verliert, haftet für den Austausch der Schließanlage."}],"footer":""},"example":null,"items":[{"no":"27","stem":"Wer am Samstagabend Gäste einlädt, …","options":{"a":"braucht die Erlaubnis der Verwaltung.","b":"informiert die Nachbarn vorher mit einem Aushang.","c":"darf bis 24 Uhr Musik machen."},"answer":"b"},{"no":"28","stem":"In der Waschküche …","options":{"a":"darf jede Wohnung zweimal pro Woche waschen.","b":"ist das Waschen ab 6 Uhr möglich.","c":"reinigt die Hausmeisterin die Maschinen."},"answer":"a"},{"no":"29","stem":"Fahrräder …","options":{"a":"dürfen im Treppenhaus stehen.","b":"haben einen eigenen Abstellraum.","c":"werden montags an die Straße gestellt."},"answer":"b"},{"no":"30","stem":"Auf dem Balkon …","options":{"a":"darf man mit Kohle grillen.","b":"darf man keine Blumenkästen anbringen.","c":"ist ein elektrischer Grill erlaubt."},"answer":"c"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.","readNote":"Lesen Sie zuerst das Beispiel. Dazu haben Sie 10 Sekunden Zeit.","example":[{"no":"01","type":"rf","text":"Der Termin von Frau Mehl findet nicht statt.","answer":"R"},{"no":"02","type":"abc","stem":"Frau Mehl soll …","options":{"a":"am Donnerstag später kommen.","b":"einen Termin im Internet buchen.","c":"die Praxis anrufen."},"answer":"c"}],"texts":[{"label":"Text 1","items":[{"no":"1","type":"rf","text":"Der Zug fährt von einem anderen Bahnsteig ab.","answer":"R"},{"no":"2","type":"abc","stem":"Wer ein Fahrrad mitnehmen möchte, …","options":{"a":"stellt es in den letzten Wagen.","b":"muss einen späteren Zug nehmen.","c":"braucht eine Reservierung."},"answer":"b"}]},{"label":"Text 2","items":[{"no":"3","type":"rf","text":"Die Wanderung beginnt später als geplant.","answer":"F"},{"no":"4","type":"abc","stem":"Nele bittet Jan, …","options":{"a":"für Verpflegung zu sorgen.","b":"mit dem Auto zu kommen.","c":"die Fahrkarten zu kaufen."},"answer":"a"}]},{"label":"Text 3","items":[{"no":"5","type":"rf","text":"Die Autobahn ist in beiden Richtungen nicht befahrbar.","answer":"F"},{"no":"6","type":"abc","stem":"Die Autofahrer sollen …","options":{"a":"bis zum Abend warten.","b":"auf die A1 wechseln.","c":"einen anderen Weg nehmen."},"answer":"c"}]},{"label":"Text 4","items":[{"no":"7","type":"rf","text":"Die Gäste müssen sofort aus dem Wasser kommen.","answer":"R"},{"no":"8","type":"abc","stem":"Das Freibad …","options":{"a":"bleibt für heute geschlossen.","b":"entscheidet in einer halben Stunde, wie es weitergeht.","c":"gibt allen ihr Geld zurück."},"answer":"b"}]},{"label":"Text 5","items":[{"no":"9","type":"rf","text":"Herr Lang kann s
