{"no":"20","name":"Petra","byline":"Petra, 39, Münster","text":"Letzten Herbst bin ich auf nassem Laub ausgerutscht und mit dem Kopf auf die Bordsteinkante gefallen. Der Arzt hat mir gesagt, dass ich ohne Helm wahrscheinlich nicht mehr hier wäre. Seitdem fahre ich keinen Meter mehr ohne. Auch meine Kinder steigen nur noch mit Helm aufs Rad. Wenn alle einen tragen müssten, ließen sich viele schwere Verletzungen vermeiden.","answer":"J"},{"no":"21","name":"Max","byline":"Max, 22, Leipzig","text":"Früher fand ich Helme peinlich und habe mich über alle lustig gemacht, die einen trugen. Dann hatte mein bester Freund einen Unfall und lag zwei Wochen im Krankenhaus. Heute sehe ich das anders und trage selbst jeden Tag einen Helm. Eine Pflicht wäre richtig, denn freiwillig ändern die meisten ihre Meinung erst, wenn es zu spät ist.","answer":"J"},{"no":"22","name":"Annette","byline":"Annette, 45, Freiburg","text":"Natürlich ist ein Helm sinnvoll, und meine Kinder tragen immer einen. Trotzdem bin ich gegen eine Pflicht. In Städten wie Kopenhagen fahren viele Menschen Rad, gerade weil es so einfach ist: aufsteigen und losfahren. Müsste man immer einen Helm dabeihaben, würden viele lieber das Auto nehmen – und das wäre für alle schlechter. Wichtiger ist, dass überhaupt mehr Menschen Rad fahren.","answer":"N"},{"no":"23","name":"Hakan","byline":"Hakan, 34, Köln","text":"Viel wichtiger als eine Helmpflicht wären sichere Radwege. Die meisten schweren Unfälle passieren, weil sich Autos und Fahrräder die gleiche Straße teilen müssen. Ich fahre jeden Tag durch die Innenstadt und habe oft Angst vor den Lastwagen. Wenn die Städte endlich breite, getrennte Wege bauen würden, bräuchte niemand über Helme zu diskutieren. Dafür sollte man das Geld ausgeben, statt die Radfahrer zu bestrafen.","answer":"N"},{"no":"24","name":"Ingrid","byline":"Ingrid, 68, Innsbruck","text":"Mein Mann und meine Freundinnen finden, dass man Erwachsene nicht zu einem Helm zwingen sollte. Ich sehe das anders. Beim Skifahren tragen wir ganz selbstverständlich einen Helm, und niemand beschwert sich. Warum sollte das beim Fahrrad anders sein – gerade für ältere Menschen wie uns, die nicht mehr so schnell reagieren? Ich hoffe, das Gesetz kommt bald.","answer":"J"},{"no":"25","name":"Sven","byline":"Sven, 41, Bern","text":"Ich wäre sofort dafür, wenn es eine Pflicht nur für Kinder und für schnelle E-Bikes gäbe. Dort ist das Risiko am größten. Der Vorschlag im Artikel gilt aber für alle, auch für jemanden, der ganz langsam zum Markt fährt. Für viele Ältere wäre das eher ein Grund, das Rad stehen zu lassen. So geht mir das zu weit.","answer":"N"},{"no":"26","name":"Lena","byline":"Lena, 27, Hamburg","text":"Ich fahre jeden Tag mit dem Rad zur Arbeit, und mein Helm hängt trotzdem oft zu Hause, weil er nicht in die Tasche passt. Klingt banal, aber so geht es vielen. Jeder Erwachsene sollte selbst über sein Risiko entscheiden dürfen. Beim Wandern in den Bergen schreibt uns ja auch niemand vor, was wir tragen sollen.","answer":"N"}]},"t5":{"instruction":"Lesen Sie die Aufgaben 27 bis 30 und den Text dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","context":"Sie möchten an einem Fotowettbewerb teilnehmen und lesen die Teilnahmebedingungen.","doc":{"title":"TEILNAHMEBEDINGUNGEN · FOTOWETTBEWERB „UNSERE STADT“","intro":"","sections":[{"heading":"Teilnahme","text":"Mitmachen können alle, die in Neustadt wohnen oder arbeiten und mindestens 16 Jahre alt sind. Mitarbeiterinnen und Mitarbeiter der Stadtzeitung und ihre Familien sind ausgeschlossen. Die Teilnahme ist kostenlos und ohne Anmeldung möglich."},{"heading":"Fotos","text":"Jede Person darf höchstens drei Fotos einreichen. Die Bilder müssen in diesem Jahr im Stadtgebiet entstanden sein. Kleine Änderungen wie Helligkeit oder Farben sind erlaubt; Fotomontagen, bei denen Bildteile hinzugefügt oder entfernt werden, sind dagegen nicht zugelassen. Schwarz-Weiß-Fotos sind ebenfalls willkommen."},{"heading":"Personen auf Fotos","text":"Sind auf einem Foto Personen deutlich zu erkennen, brauchen wir deren schriftliches Einverständnis. Bei Kindern unter 18 Jahren unterschreiben die Eltern."},{"heading":"Einsendung","text":"Schicken Sie Ihre Fotos bis zum 31. August per E-Mail an fotowettbewerb@stadtzeitung.de. Bitte geben Sie Ihren Namen, Ihre Adresse und einen Titel für jedes Bild an. Jedes Foto darf höchstens 10 MB groß sein. Ausdrucke per Post können wir leider nicht annehmen."},{"heading":"Preise","text":"Eine Jury wählt im September die zehn besten Fotos aus. Der erste Preis ist ein Wochenende für zwei Personen am Bodensee, der zweite eine Kamera, der dritte ein Gutschein für ein Fotobuch. Die Gewinnerinnen und Gewinner werden bis zum 30. September per E-Mail benachrichtigt. Alle zehn Bilder werden im Oktober im Rathaus ausgestellt. Über die Reihenfolge entscheidet allein die Jury."},{"heading":"Rechte","text":"Mit der Teilnahme erlauben Sie der Stadtzeitung, Ihre Fotos zu veröffentlichen, auch im Internet. Ihr Name wird dabei immer genannt, auf Wunsch auch Ihr Wohnort. Die Rechte an den Bildern bleiben bei Ihnen."}],"footer":""},"example":null,"items":[{"no":"27","stem":"Wer 15 Jahre alt ist, …","options":{"a":"kann am Wettbewerb nicht teilnehmen.","b":"braucht für die Teilnahme die Unterschrift der Eltern.","c":"darf nur ein Foto einreichen."},"answer":"a"},{"no":"28","stem":"Bei der Bearbeitung der Fotos …","options":{"a":"ist jede Veränderung streng verboten.","b":"darf man störende Gegenstände aus dem Bild entfernen.","c":"sind kleine Korrekturen erlaubt."},"answer":"c"},{"no":"29","stem":"Wenn auf einem Foto ein fremdes Kind gut zu erkennen ist, …","options":{"a":"darf man das Foto nicht einreichen.","b":"muss man die Eltern um Erlaubnis bitten.","c":"genügt eine mündliche Zustimmung des Kindes selbst."},"answer":"b"},{"no":"30","stem":"Die zehn besten Fotos …","options":{"a":"kann man im Herbst im Rathaus sehen.","b":"gehören nach dem Ende des Wettbewerbs der Stadtzeitung.","c":"werden ohne Namen veröffentlicht."},"answer":"a"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.","readNote":"Lesen Sie zuerst das Beispiel. Dazu haben Sie 10 Sekunden Zeit.","example":[{"no":"01","type":"rf","text":"Herr Krauses Schuhe sind repariert.","answer":"R"},{"no":"02","stem":"Herr Krause soll …","options":{"a":"einen Beleg mitbringen.","b":"am Mittwoch kommen.","c":"vorher anrufen."},"answer":"a","type":"abc"}],"texts":[{"label":"Text 1","items":[{"no":"1","type":"rf","text":"Pflanzen sind heute günstiger als sonst.","answer":"R"},{"no":"2","stem":"Den gefundenen Schlüssel …","options":{"a":"bekommt man an der Kasse, an der er gefunden wurde.","b":"bringt man zum Holzzuschnitt.","c":"kann man am Eingang abholen."},"answer":"c","type":"abc"}]},{"label":"Text 2","items":[{"no":"3","type":"rf","text":"Bernd fährt Melanie morgen wie immer zur Arbeit.","answer":"F"},{"no":"4","stem":"Melanie soll …","options":{"a":"an einer anderen Stelle als sonst warten.","b":"etwas später als sonst bereit sein.","c":"Jens morgen früh gleich das Benzingeld geben."},"answer":"a","type":"abc"}]},{"label":"Text 3","items":[{"no":"5","type":"rf","text":"Man kann auch ohne die Benachrichtigung wählen.","answer":"R"},{"no":"6","stem":"Briefwahl …","options":{"a":"kann man noch am Wahltag selbst im Rathaus beantragen.","b":"muss man spätestens am Freitag beantragen.","c":"ist nur für Jugendliche möglich."},"answer":"b","type":"abc"}]},{"label":"Text 4","items":[{"no":"7","type":"rf","text":"Eine Veranstaltung wurde in einen größeren Raum verlegt.","answer":"R"},{"no":"8","stem":"Heute …","options":{"a":"können Besucher günstig in der Mensa essen.","b":"fällt die Führung durch die Bibliothek aus.","c":"kann man direkt vor dem Hauptgebäude parken."},"answer":"a","type":"abc"}]},{"label":"Text 5","items":[{"no":"9","type":"rf","text":"Der Schornsteinfeger kommt am Nachmittag.","answer":"F"},{"no":"10","stem":"Wenn Frau Novak am Montag nicht zu Hause ist, soll sie …","options":{"a":"selbst einen neuen Termin mit dem Schornsteinfeger vereinbaren.","b":"die Hausverwaltung anrufen.","c":"einer Nachbarin den Schlüssel geben."},"answer":"c","type":"abc"}]}]},"t2":{"instruction":"Sie hören nun einen Text. Sie hören den Text einmal. Dazu lösen Sie fünf Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","readNote":"Lesen Sie jetzt die Aufgaben 11 bis 15. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie machen eine geführte Wanderung im Nationalpark. Vor dem Start erklärt die Rangerin, Frau Hollweg, den Ablauf.","items":[{"no":"11","stem":"Wer nicht die ganze Strecke gehen kann, …","options":{"a":"wartet am Parkplatz auf die anderen.","b":"fährt von Anfang an mit dem Bus mit.","c":"kann unterwegs in den Bus steigen."},"answer":"c"},{"no":"12","stem":"Hunde …","options":{"a":"dürfen mit, wenn sie angeleint sind.","b":"sind im ganzen Nationalpark leider nicht erlaubt.","c":"dürfen auf den Wegen frei laufen."},"answer":"a"},{"no":"13","stem":"Pilze und Beeren …","options":{"a":"darf man nur am Wasserfall sammeln.","b":"darf man im Park nicht mitnehmen.","c":"kann man bei der Rangerin kaufen."},"answer":"b"},{"no":"14","stem":"Am Wasserfall …","options":{"a":"kann man am Kiosk etwas kaufen.","b":"soll man den Müll in die Eimer werfen.","c":"kann man frisches Trinkwasser holen."},"answer":"c"},{"no":"15","stem":"Ferngläser …","options":{"a":"muss jeder selbst mitbringen.","b":"kann man sich bei der Rangerin leihen.","c":"kann man an der Waldhütte für wenig Geld kaufen."},"answer":"b"}]},"t3":{"instruction":"Sie hören nun ein Gespräch. Sie hören das Gespräch einmal. Dazu lösen Sie sieben Aufgaben. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","readNote":"Lesen Sie jetzt die Aufgaben 16 bis 22. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie sind auf einem Flohmarkt und hören, wie sich zwei Freundinnen, Nadine und Elena, unterhalten.","items":[{"no":"16","text":"Für die Unterkunft in Dänemark hat Nadines Familie nichts bezahlt.","answer":"R"},{"no":"17","text":"Nadines Mann war von der Idee zuerst nicht begeistert.","answer":"R"},{"no":"18","text":"Nadine und die dänische Familie haben sich vor dem Urlaub persönlich getroffen.","answer":"F"},{"no":"19","text":"Die Reparatur der Spülmaschine musste Nadines Familie bezahlen.","answer":"F"},{"no":"20","text":"Elena hat sich gründlich auf den Test vorbereitet.","answer":"R"},{"no":"21","text":"Elenas Mann hat den Test zu Hause ohne Fehler geschafft.","answer":"F"},{"no":"22","text":"Elena musste ihren spanischen Pass abgeben.","answer":"F"}]},"t4":{"instruction":"Sie hören nun eine Diskussion. Sie hören die Diskussion zweimal. Dazu lösen Sie acht Aufgaben. Ordnen Sie die Aussagen zu: Wer sagt was?","readNote":"Lesen Sie jetzt die Aussagen 23 bis 30. Dazu haben Sie 60 Sekunden Zeit.","context":"Der Moderator der Radiosendung „Standpunkte“ diskutiert mit der Lungenärztin Dr. Katrin Wolf und dem Gastwirt Thomas Brenner über die Frage: „Soll das Rauchen in Parks und auf Spielplätzen verboten werden?“","speakers":{"a":"Moderator","b":"Katrin Wolf","c":"Thomas Brenner"},"example":{"no":"0","text":"In einigen Städten gibt es schon rauchfreie Zonen im Freien.","answer":"a"},"items":[{"no":"23","text":"Raucher werden schon heute an vielen Orten ausgeschlossen.","answer":"c"},{"no":"24","text":"Zigarettenreste sind der Müll, der am häufigsten gefunden wird.","answer":"a"},{"no":"25","text":"Auch im Freien kann der Rauch anderen Menschen schaden.","answer":"b"},{"no":"26","text":"Ein Verbot ließe sich kaum überwachen.","answer":"c"},{"no":"27","text":"Kinder übernehmen das Verhalten von Erwachsenen.","answer":"b"},{"no":"28","text":"In einem Nachbarland gibt es für das Rauchen in Parks Geldstrafen.","answer":"a"},{"no":"29","text":"Weniger Gelegenheiten zum Rauchen helfen beim Aufhören.","answer":"b"},{"no":"30","text":"Statt eines Verbots sollte es besondere Bereiche für Raucher geben.","answer":"c"}]}},"schreiben":{"intro":"Das Modul Schreiben besteht aus drei Teilen. In den Aufgaben 1 und 3 schreiben Sie E-Mails, in Aufgabe 2 schreiben Sie einen Diskussionsbeitrag. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf den Antwortbogen.","tasks":[{"no":1,"minutes":20,"words":80,"situation":["Sie haben im Winterurlaub zum ersten Mal Ski fahren gelernt. Ein Freund/Eine Freundin von Ihnen möchte wissen, wie es war."],"points":["Beschreiben Sie: Wie war der Kurs?","Begründen Sie: Warum haben Sie das ausprobiert?","Machen Sie einen Vorschlag für einen gemeinsamen Ausflug."],"post":null,"instruction":"Schreiben Sie eine E-Mail (circa 80 Wörter). Schreiben Sie etwas zu allen drei Punkten. Achten Sie auf den Textaufbau (Anrede, Einleitung, Reihenfolge der Inhaltspunkte, Schluss).","model":{"label":"E-Mail an eine Freundin, ca. 90 Wörter","text":"Betreff: Ich kann Ski fahren!\n\nLiebe Sophie,\n\nletzte Woche war ich im Allgäu und habe zum ersten Mal auf Skiern gestanden! Ich hatte jeden Vormittag drei Stunden Unterricht in einer kleinen Gruppe. Am ersten Tag bin ich ungefähr zwanzigmal hingefallen, aber am Ende der Woche konnte ich schon die blaue Piste fahren.\n\nAusprobiert habe ich es, weil meine Kollegen jedes Jahr zusammen Ski fahren und ich endlich mitkommen wollte.\n\nHast du Lust, im Februar mit mir einen Tag in die Berge zu fahren? Dann kannst du mir zeigen, wie man richtig bremst!\n\nViele Grüße\nAhmet"},"typicalErrors":"Der Kurs wird beschrieben, aber der Grund fehlt · Vorschlag ohne Zeitpunkt · Sie statt du."},{"no":2,"minutes":25,"words":80,"situation":["Sie haben im Radio eine Sendung zum Thema „Spenden – hilft das wirklich?“ gehört. Im Online-Gästebuch der Sendung finden Sie folgende Meinung:"],"points":[],"post":{"site":"www.radio-gesellschaft.de","label":"Gästebuch","author":"Jürgen · 04.12. 19:26 Uhr","text":"Ich spende jedes Jahr zu Weihnachten 100 Euro für Kinder in armen Ländern. Aber ehrlich gesagt weiß ich nie, wie viel davon wirklich ankommt. Meine Frau gibt das Geld lieber direkt dem Obdachlosen vor unserem Supermarkt. Was ist besser?"},"instruction":"Schreiben Sie nun Ihre Meinung zum Thema (circa 80 Wörter).","model":{"label":"Diskussionsbeitrag, ca. 95 Wörter","text":"Jürgen stellt eine gute Frage. Ich finde Spenden wichtig, weil viele Menschen ohne Hilfe nicht genug zu essen hätten oder nicht zur Schule gehen könnten. Man sollte aber genau prüfen, an wen man spendet. Es gibt Organisationen mit einem Spendensiegel, die zeigen, wofür sie das Geld ausgeben.\n\nIch verstehe aber auch Jürgens Frau. Wenn man jemandem direkt vor dem Supermarkt hilft, sieht man sofort, dass das Geld ankommt.\n\nIch selbst mache beides: Ich unterstütze regelmäßig eine Organisation und kaufe manchmal einem Obdachlosen einen Kaffee."},"typicalErrors":"Jürgens Beitrag nur zusammenfassen, statt eine eigene Meinung zu schreiben · keine Beispiele · deutlich unter 80 Wörtern."},{"no":3,"minutes":15,"words":40,"situation":["Gestern ist Ihre Waschmaschine ausgelaufen. Jetzt hat Ihr Nachbar in der Wohnung unter Ihnen, Herr Wagner, einen Wasserfleck an der Decke."],"points":[],"post":null,"instruction":"Schreiben Sie an Herrn Wagner. Entschuldigen Sie sich höflich, erklären Sie, was passiert ist, und machen Sie einen Vorschlag. Schreiben Sie eine E-Mail (circa 40 Wörter). Vergessen Sie nicht die Anrede und den Gruß am Schluss.","model":{"label":"E-Mail an den Nachbarn, ca. 50 Wörter","text":"Sehr geehrter Herr Wagner,\n\nes tut mir sehr leid, dass Sie meinetwegen einen Wasserfleck an der Decke haben. Gestern ist der Schlauch meiner Waschmaschine kaputtgegangen, und das Wasser ist unter den Boden gelaufen. Meine Versicherung bezahlt den Schaden. Darf ich morgen mit einem Maler bei Ihnen vorbeikommen?\n\nMit freundlichen Grüßen\nClara Hoffmann"},"typicalErrors":"Kein Vorschlag (Maler, Versicherung) · Hallo Herr Wagner oder Liebe Grüße · keine Entschuldigung."}]},"audio":[{"src":"Goethe%20B1%20Modelltest%2010.1.mp3","dur":553.09},{"src":"Goethe%20B1%20Modelltest%2010.2.mp3","dur":267.02},{"src":"Goethe%20B1%20Modelltest%2010.3.mp3","dur":231.29},{"src":"Goethe%20B1%20Modelltest%2010.4.mp3","dur":537.73}],"pdf":"Goethe%20B1%20Modelltest%2010.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}}}}</script>

    (H.t1.example || []).forEach(function (e) { h1 += e.type === 'rf' ? rfItem(e, true) : abcItem(e, true); });
    NOLABEL = false;
    H.t1.texts.forEach(function (tx) {
      h1 += '<p class="txh">' + esc(tx.label) + '</p>';
      tx.items.forEach(function (it) { h1 += it.type === 'rf' ? rfItem(it) : abcItem(it); });
    });
    pages.push({ key: 'H1', teil: 1, title: 'Hören Teil 1', inst: [H.t1.instruction, H.t1.readNote], rightTitle: 'Aufgaben 1–10', right: h1 });
    H.t1.texts.forEach(function (tx) { tx.items.forEach(function (it) { items.push({ no: it.no, type: it.type, answer: it.answer, teil: 1, page: 0, src: it }); }); });
    pages.push({ key: 'H2', teil: 2, title: 'Hören Teil 2', inst: [H.t2.instruction, H.t2.readNote], ctx: H.t2.context, rightTitle: 'Aufgaben 11–15',
      right: H.t2.items.map(function (it) { return abcItem(it); }).join('') });
    reg(H.t2.items, 'abc', 2, 1);
    pages.push({ key: 'H3', teil: 3, title: 'Hören Teil 3', inst: [H.t3.instruction, H.t3.readNote], ctx: H.t3.context, rightTitle: 'Aufgaben 16–22',
      right: H.t3.items.map(function (it) { return rfItem(it); }).join('') });
    reg(H.t3.items, 'rf', 3, 2);
    pages.push({ key: 'H4', teil: 4, title: 'Hören Teil 4', inst: [H.t4.instruction, H.t4.readNote], ctx: H.t4.context, rightTitle: 'Aussagen 23–30',
      right: gridHTML(H.t4) });
    reg(H.t4.items, 'grid', 4, 3);
    return { pages: pages, items: items, teile: [1, 2, 3, 4], two: false };
  }

  function taskHTML(tk) {
    var h = '<div class="task">' + (tk.situation || []).map(function (s) { return '<p>' + esc(s) + '</p>'; }).join('');
    if (tk.post) {
      h += '<div class="post"><div class="pt"><span>' + esc(tk.post.site) + '</span><span>' + esc(tk.post.label || '') + '</span></div>' +
        '<div class="pa">' + esc(tk.post.author) + '</div><p>' + esc(tk.post.text) + '</p></div>';
    }
    if (tk.points && tk.points.length) h += '<ul>' + tk.points.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';
    return h + '<p><b>' + esc(tk.instruction) + '</b></p></div>';
  }
  function buildSchreiben() {
    var pages = T.schreiben.tasks.map(function (tk, i) {
      return { key: 'S' + tk.no, teil: tk.no, title: 'Schreiben Aufgabe ' + tk.no, leftTitle: 'Aufgabe ' + tk.no + ' · Arbeitszeit: ' + tk.minutes + ' Minuten',
        left: (i === 0 && T.schreiben.intro ? '<p class="inst">' + esc(T.schreiben.intro.replace(/\s*Schreiben Sie Ihre Texte auf den Antwortbogen\.?/, '')) + '</p>' : '') + taskHTML(tk),
        task: tk };
    });
    return { pages: pages, items: [], teile: [1, 2, 3], two: true, writing: true };
  }

  var M = R.mod === 'lesen' ? buildLesen() : R.mod === 'hoeren' ? buildHoeren() : buildSchreiben();
  var ITEM = {};
  M.items.forEach(function (it) { ITEM[it.no] = it; });

  /* ---------- state ---------- */
  var S = null;
  var timerId = null, lastTick = 0, saveTimer = null, lastSave = 0, warned = {};
  var markMode = false, audioAllowPause = false, audioLastPos = 0, advanceTimer = null, probeTimer = null;

  function freshState() {
    return { build: D.build, page: 0, remaining: MOD[R.mod].minutes * 60, answers: {}, marks: {}, texts: { 1: '', 2: '', 3: '' },
      started: Date.now(), audio: { track: 0, pos: 0, done: false }, font: (lsGet('font') || 0) };
  }
  function save() { if (S) { S.saved = Date.now(); lsSet(STATE_KEY, S); lastSave = Date.now(); } }
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 350); }

  /* ---------- top bar ---------- */
  function topHTML(running) {
    var sec = S ? S.remaining : MOD[R.mod].minutes * 60;
    var f = S ? S.font : (lsGet('font') || 0);
    return '<header class="top">' +
      '<img class="logo" src="' + LOGO + '" alt="Sophia Deutsch Akademie">' +

      '<div class="sp"></div><div class="tool">' +
      (running && R.mod === 'hoeren' ? '<div class="vol" id="vol" title="Lautstärke">' + ICON.vol + '<input type="range" min="0" max="100" step="1" id="volr" aria-label="Lautstärke"></div>' : '') +
      (running ? '<button class="hlp" id="help" type="button" title="Hilfe: Tutorial noch einmal ansehen" aria-label="Hilfe">?</button>' : '') +
      (running ? '<div class="fz" id="fz" role="group" aria-label="Schriftgröße">' +
        [0, 1, 2].map(function (i) { return '<button type="button" class="s' + (i + 1) + '" data-fz="' + i + '" aria-pressed="' + (f === i) + '" aria-label="Schriftgröße ' + (i + 1) + '">A</button>'; }).join('') + '</div>' : '') +
      '<div class="timer" id="tm" role="timer" aria-live="off">' + ICON.clock + '<div class="tl"><small>Verbleibende Zeit</small><b id="tmv">' + fmt(sec) + '</b></div></div>' +
      '</div></header>';
  }

  /* ---------- start page ---------- */
  function showStart() {
    stopAll();
    var saved = lsGet(STATE_KEY), res = lsGet(RESULT_KEY);
    var info = MOD[R.mod];
    var facts = R.mod === 'lesen' ? ['65 Minuten', '5 Teile', '30 Aufgaben'] : R.mod === 'hoeren' ? ['ca. 40 Minuten', '4 Teile', '30 Aufgaben', 'Kopfhörer empfohlen'] : ['60 Minuten', '3 Aufgaben', 'ca. 80 / 80 / 40 Wörter'];
    var rules = {
      lesen: [
        ['Lesen Sie die Texte und lösen Sie die Aufgaben. Die Reihenfolge der Teile können Sie selbst wählen.', '지문을 읽고 문항을 풉니다. Teil 순서는 자유롭게 정할 수 있습니다.'],
        ['Links sehen Sie den Text, rechts die Aufgaben. Klicken Sie die richtige Lösung an.', '왼쪽은 지문, 오른쪽은 문항입니다. 정답을 클릭하세요.'],
        ['Mit „Markieren“ können Sie Textstellen farbig hervorheben.', '‘Markieren’을 켜고 드래그하면 지문에 형광펜을 칠할 수 있습니다.'],
        ['Sie können Ihre Antworten bis zum Ende der Prüfungszeit ändern. Danach wird das Modul automatisch abgegeben.', '시간이 끝날 때까지 답을 고칠 수 있고, 시간이 끝나면 자동으로 제출됩니다.']
      ],
      hoeren: [
        ['Die Hörtexte werden automatisch nacheinander abgespielt. Sie können sie nicht anhalten, zurückspulen oder wiederholen.', '음원은 자동으로 이어서 재생됩니다. 멈추거나 되감거나 다시 들을 수 없습니다.'],
        ['Die Teile 1 und 4 hören Sie zweimal, die Teile 2 und 3 einmal.', 'Teil 1과 4는 두 번, Teil 2와 3은 한 번 듣습니다.'],
        ['Der Bildschirm wechselt mit dem Hörtext automatisch zum nächsten Teil. Frühere Teile können Sie wieder öffnen und Antworten ändern.', '음원에 맞춰 화면이 다음 Teil로 넘어갑니다. 지나간 Teil은 다시 열어 답을 고칠 수 있습니다.'],
        ['Stellen Sie die Lautstärke vor dem Start ein. Verwenden Sie am besten Kopfhörer.', '시작 전에 음량을 맞추세요. 헤드폰 사용을 권합니다.']
      ],
      schreiben: [
        ['Das Modul besteht aus drei Aufgaben. Sie können mit jeder Aufgabe beginnen und zwischen den Aufgaben wechseln.', '세 과제로 이루어져 있고, 어느 과제부터 써도 되며 서로 오갈 수 있습니다.'],
        ['Schreiben Sie Ihre Texte in das Textfeld. Die Wörter werden automatisch gezählt.', '입력란에 글을 쓰면 단어 수가 자동으로 계산됩니다.'],
        ['Umlaute und ß können Sie mit den Sonderzeichen-Tasten einfügen.', 'ä, ö, ü, ß는 특수문자 버튼으로 넣을 수 있습니다.'],
        ['Bewertet wird nur der Text im Textfeld. Nach Ablauf der Zeit wird das Modul automatisch abgegeben.', '입력란의 글만 평가 대상이며, 시간이 끝나면 자동으로 제출됩니다.']
      ]
    }[R.mod];
    var resumeOK = saved && saved.remaining > 1;
    var h = '<div class="page">' + topHTML(false) + '<main class="pgm"><section class="sheet">' +
      '<p class="ey">Modelltest ' + esc(T.roman) + ' · Modul ' + info.name + '</p>' +
      '<h1>Goethe-Zertifikat B1 · ' + info.name + '</h1>' +
      '<p class="sl">Übungsprüfung im digitalen Format — so wie am Computer im Prüfungszentrum.</p>' +
      '<div class="facts">' + facts.map(function (f) { return '<span>' + esc(f) + '</span>'; }).join('') + '</div>' +
      '<div class="rules"><h2>Hinweise</h2><ul>' + rules.map(function (r) { return '<li>' + esc(r[0]) + '<small>' + esc(r[1]) + '</small></li>'; }).join('') + '</ul></div>' +
      '<div class="namef"><label for="nm">Name (für das Ergebnis) · 이름</label><input id="nm" autocomplete="name" maxlength="40" value="' + esc(lsGet('name') || '') + '"></div>';
    if (R.mod === 'hoeren') {
      h += '<div class="rules" style="margin-top:-6px"><h2>Tonprobe</h2><div class="acts"><div class="vol">' + ICON.vol +
        '<input type="range" min="0" max="100" step="1" id="volr0" aria-label="Lautstärke"></div><button class="btn sm" id="probe" type="button">Tonprobe abspielen</button></div>' +
        '<p class="note" style="margin-top:8px">Spielt die ersten Sekunden von Teil 1 ab. · 음량 확인용으로 Teil 1 앞부분을 몇 초 들려줍니다.</p></div>';
    }
    h += '<div class="acts">';
    if (resumeOK) {
      h += '<button class="btn pri" id="resume" type="button">Prüfung fortsetzen (' + fmt(saved.remaining) + ')</button><button class="btn" id="restart" type="button">Neu beginnen</button>';
    } else {
      h += '<button class="btn pri" id="tour" type="button">Tutorial ansehen und starten</button><button class="btn out" id="go" type="button">Ohne Tutorial starten</button>';
    }
    if (res) h += '<button class="btn" id="seeres" type="button">Letztes Ergebnis</button>';
    h += '</div><p class="note">Die Prüfungszeit beginnt erst, wenn Sie auf „Starten“ klicken. · 시작 버튼을 눌러야 시간이 흐릅니다. 시험 중 창을 닫으면 그 시점까지 저장되고, 다시 열면 이어서 풀 수 있습니다.</p>' +
      '<a class="back" href="' + BACK + '">← Modelltest ' + esc(T.roman) + ' · 모듈 선택</a></section></main></div>';
    app.innerHTML = h;
    var nm = $('#nm');
    nm.addEventListener('input', function () { lsSet('name', nm.value.trim()); });
    if (R.mod === 'hoeren') {
      var vr = $('#volr0'); vr.value = Math.round(getVol() * 100);
      vr.addEventListener('input', function () { setVol(vr.value / 100); });
      $('#probe').addEventListener('click', function () {
        var b = this;
        if (curSrc() !== T.audio[0].src) AUD.src = T.audio[0].src;
        else { try { AUD.currentTime = 0; } catch (e) { /* ignore */ } }
        AUD.volume = getVol();
        var p = AUD.play();
        b.disabled = true; b.textContent = 'Tonprobe läuft …';
        clearTimeout(probeTimer);
        probeTimer = setTimeout(function () {
          probeTimer = null;
          if (!timerId) { audioAllowPause = true; AUD.pause(); audioAllowPause = false; }
          b.disabled = false; b.textContent = 'Tonprobe abspielen';
        }, 6000);
        if (p && p.catch) p.catch(function () { b.disabled = false; b.textContent = 'Tonprobe abspielen'; toast('Audio konnte nicht abgespielt werden.', true); });
      });
    }
    if ($('#tour')) $('#tour').addEventListener('click', function () { begin(freshState(), true); });
    if ($('#go')) $('#go').addEventListener('click', function () { begin(freshState(), false); });
    if ($('#resume')) $('#resume').addEventListener('click', function () { begin(saved, false); });
    if ($('#restart')) $('#restart').addEventListener('click', function () {
      modal('Neu beginnen?', ['Ihre bisherigen Antworten in diesem Modul werden gelöscht.', '지금까지의 답이 지워집니다.'], [
        { label: 'Abbrechen' },
        { label: 'Neu beginnen', pri: true, fn: function () { lsDel(STATE_KEY); showStart(); } }
      ]);
    });
    if ($('#seeres')) $('#seeres').addEventListener('click', function () { showResult(res); });
    window.scrollTo(0, 0);
  }

  /* ---------- volume ---------- */
  function getVol() { var v = lsGet('vol'); return typeof v === 'number' ? v : 0.85; }
  function setVol(v) { v = Math.max(0, Math.min(1, v)); AUD.volume = v; lsSet('vol', v); }

  /* ---------- exam shell ---------- */
  function begin(state, withTour) {
    clearTimeout(probeTimer); probeTimer = null;
    if (R.mod === 'hoeren') { audioAllowPause = true; try { AUD.pause(); } catch (e) { /* ignore */ } audioAllowPause = false; }
    S = state;
    warned = {}; markMode = false;
    if (S.build !== D.build) { S.marks = {}; S.build = D.build; }
    if (typeof S.font !== 'number') S.font = 0;
    if (!(S.page >= 0 && S.page < M.pages.length)) S.page = 0;
    if (S.remaining < 60 * 10) warned[10] = true;
    if (S.remaining < 60 * 5) warned[5] = true;
    renderExam();
    if (withTour) runTour(function () { startClock(); });
    else startClock();
  }

  function renderExam() {
    var h = '<div class="exam" id="exam">' + topHTML(true);
    h += '<nav class="tabs" aria-label="Teile"><div class="tl" role="tablist" id="tabs"></div><div class="tr" id="tools"></div></nav>';
    if (R.mod === 'hoeren') {
      h += '<div class="abar" id="abar"><div class="st"><span class="dot"></span><span id="ast">Bereit</span></div><div class="pg"><i id="apg"></i></div><span class="tm" id="atm"></span></div>';
    }
    h += '<main class="main" id="main"></main>';
    h += '<footer class="foot"><div class="ovw" id="ov"><div class="lbl">Aufgabenübersicht<b id="ovc"></b></div><div class="chips" id="chips"></div>' +
      '<button class="btn sm ovbtn" id="ovbtn" type="button"></button></div>' +
      '<div class="nav" id="nav"><button class="btn" id="prev" type="button" aria-label="Zurück">' + ICON.prev + '<span class="tx">Zurück</span></button><button class="btn pri" id="next" type="button">Weiter' + ICON.next + '</button>' +
      '<button class="btn out" id="submit" type="button">Abgeben</button></div></footer></div>';
    app.innerHTML = h;
    applyFont();
    // tools
    var tools = '';
    if (R.mod === 'lesen') {
      tools = '<button class="tbtn" id="mk" type="button" aria-pressed="false" title="Textstellen markieren">' + ICON.marker + '<span class="tx">Markieren</span></button>' +
        '<button class="tbtn icon" id="mkx" type="button" title="Markierungen auf dieser Seite löschen" aria-label="Markierungen löschen">' + ICON.erase + '</button>';
    }
    $('#tools').innerHTML = tools;
    // events
    $$('#fz button').forEach(function (b) { b.addEventListener('click', function () { S.font = +b.getAttribute('data-fz'); lsSet('font', S.font); applyFont(); saveSoon(); }); });
    if (R.mod === 'hoeren') {
      var vr = $('#volr'); vr.value = Math.round(getVol() * 100); AUD.volume = getVol();
      vr.addEventListener('input', function () { setVol(vr.value / 100); });
    }
    $('#help').addEventListener('click', function () { if (!tourEls) runTour(null); });
    $('#prev').addEventListener('click', function () { go(S.page - 1); });
    $('#next').addEventListener('click', function () { go(S.page + 1); });
    $('#submit').addEventListener('click', askSubmit);
    $('#ovbtn').addEventListener('click', openOverview);
    if (R.mod === 'lesen') {
      $('#mk').addEventListener('click', function () { markMode = !markMode; this.setAttribute('aria-pressed', String(markMode)); var pl = $('#pbL'); if (pl) pl.classList.toggle('mk', markMode); });
      $('#mkx').addEventListener('click', function () {
        var pl = $('#pbL'); if (!pl) return;
        $$('mark.hl', pl).forEach(unwrap); pl.normalize(); delete S.marks[M.pages[S.page].key]; saveSoon();
      });
    }
    var main = $('#main');
    main.addEventListener('change', onAnswer);
    main.addEventListener('mouseup', onMarkUp);
    main.addEventListener('touchend', function (e) { setTimeout(function () { onMarkUp(e); }, 30); });
    main.addEventListener('click', onMarkClick);
    renderPage();
  }

  function applyFont() {
    var root = document.documentElement;
    root.style.setProperty('--fs', FS[S ? S.font : 0] + 'px');
    $$('#fz button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.getAttribute('data-fz') === S.font)); });
  }

  function teilPages(teil) { var r = []; M.pages.forEach(function (p, i) { if (p.teil === teil) r.push(i); }); return r; }
  function maxReachable() {
    if (R.mod !== 'hoeren' || S.audio.done) return M.pages.length - 1;
    return S.audio.track;
  }

  function renderTabs() {
    var cur = M.pages[S.page].teil;
    var h = M.teile.map(function (teil) {
      var pidx = teilPages(teil)[0];
      var locked = pidx > maxReachable();
      var label, pr = '', done = false;
      if (M.writing) {
        var wc = wordCount(S.texts[teil]);
        label = 'Aufgabe ' + teil;
        pr = wc + ' Wörter';
        done = wc >= (T.schreiben.tasks[teil - 1].words || 40);
      } else {
        var its = M.items.filter(function (it) { return it.teil === teil; });
        var ans = its.filter(function (it) { return S.answers[it.no] != null; }).length;
        label = 'Teil ' + teil; pr = ans + '/' + its.length; done = ans === its.length;
      }
      return '<button class="tab' + (done ? ' done' : '') + '" role="tab" type="button" data-teil="' + teil + '" aria-selected="' + (teil === cur) + '"' + (locked ? ' disabled' : '') + '>' +
        (locked ? '<span class="lock">' + ICON.lock + '</span>' : '') + esc(label) + ' <span class="pr">' + (done && !M.writing ? ICON.check + ' ' : '') + esc(pr) + '</span></button>';
    }).join('');
    var tabs = $('#tabs');
    tabs.innerHTML = h;
    $$('.tab', tabs).forEach(function (b) {
      b.addEventListener('click', function () {
        var teil = +b.getAttribute('data-teil');
        if (teil === M.pages[S.page].teil) return;
        go(teilPages(teil)[0]);
      });
    });
    var sel = $('.tab[aria-selected="true"]', tabs);
    if (sel && sel.scrollIntoView) { try { sel.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) { /* old browser */ } }
  }

  function renderChips() {
    var chips = $('#chips');
    if (M.writing) {
      $('#ov').style.visibility = 'hidden';
      return;
    }
    var page = M.pages[S.page], h = '', lastTeil = 0;
    var open = 0, reach = maxReachable();
    M.items.forEach(function (it) {
      if (lastTeil && it.teil !== lastTeil) h += '<span class="gap"></span>';
      lastTeil = it.teil;
      var ans = S.answers[it.no] != null;
      if (!ans) open++;
      h += '<button class="chip' + (ans ? ' ans' : '') + (it.page === S.page ? ' cur' : '') + '" type="button" data-no="' + esc(it.no) + '"' +
        (it.page > reach ? ' disabled' : '') + ' title="Aufgabe ' + esc(it.no) + (ans ? ' – beantwortet' : ' – offen') + '">' + esc(it.no) + '</button>';
    });
    chips.innerHTML = h;
    $('#ovc').textContent = (M.items.length - open) + ' von ' + M.items.length + ' beantwortet';
    $('#ovbtn').textContent = 'Übersicht ' + (M.items.length - open) + '/' + M.items.length;
    $$('.chip', chips).forEach(function (c) { c.addEventListener('click', function () { jumpTo(c.getAttribute('data-no')); }); });
    var cur = $('.chip.cur', chips);
    if (cur && chips.scrollWidth > chips.clientWidth) { chips.scrollLeft = cur.offsetLeft - chips.clientWidth / 2; }
    void page;
  }

  function renderNav() {
    $('#prev').disabled = S.page <= 0;
    $('#next').disabled = S.page >= M.pages.length - 1 || S.page + 1 > maxReachable();
  }

  function renderPage() {
    var p = M.pages[S.page];
    var main = $('#main');
    var h = '';
    var inst = (p.inst || []).filter(Boolean).map(function (s) { return '<p class="inst">' + esc(s) + '</p>'; }).join('');
    var sub = '';
    var tp = teilPages(p.teil);
    if (tp.length > 1) {
      sub = '<div class="sub">' + tp.map(function (pi, k) { return '<button type="button" data-go="' + pi + '" aria-current="' + (pi === S.page) + '">Text ' + (k + 1) + '</button>'; }).join('') + '</div>';
    }
    if (M.writing) {
      h += '<section class="pane l" aria-label="Aufgabe"><div class="ph"><h2>' + esc(p.leftTitle) + '</h2></div><div class="pb">' + p.left + '</div></section>';
      h += '<section class="pane r wr" aria-label="Ihr Text"><div class="ph"><h2>Ihr Text</h2></div><div class="pb">' +
        '<div class="sz" id="sz"><span>Sonderzeichen</span>' + ['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü', '„', '“'].map(function (c) { return '<button type="button" data-ch="' + c + '" tabindex="-1">' + c + '</button>'; }).join('') + '</div>' +
        '<textarea class="ed" id="ed" spellcheck="false" autocomplete="off" autocapitalize="sentences" aria-label="Text für Aufgabe ' + p.teil + '"></textarea>' +
        '<div class="wc" id="wc"><span>circa ' + esc(p.task.words) + ' Wörter</span><span>Wörter: <b id="wcn">0</b></span></div></div></section>';
    } else if (M.two) {

      h += '</tbody></table>';
      h += '<div class="links">' +
        (pg.loesung ? '<a class="btn sm" href="' + pdf + '#page=' + pg.loesung + '" target="_blank" rel="noopener">Lösungsschlüssel (PDF S. ' + pg.loesung + ')</a>' : '') +
        (pg.kommentar ? '<a class="btn sm" href="' + pdf + '#page=' + pg.kommentar + '" target="_blank" rel="noopener">Kommentar für Lehrende (S. ' + pg.kommentar + ')</a>' : '') +
        (R.mod === 'hoeren' && pg.hoertexte ? '<a class="btn sm" href="' + pdf + '#page=' + pg.hoertexte + '" target="_blank" rel="noopener">Hörtexte (S. ' + pg.hoertexte + ')</a>' : '') + '</div>';
    } else {
      T.schreiben.tasks.forEach(function (tk) {
        var tx = res.texts[tk.no] || '', wc = wordCount(tx);
        h += '<div class="wtask"><h3>Aufgabe ' + tk.no + '<small>' + wc + ' Wörter · circa ' + tk.words + ' Wörter verlangt</small></h3>' +
          '<pre>' + (tx.trim() ? esc(tx) : '(kein Text)') + '</pre>';
        if (tk.model && tk.model.text) {
          h += '<details><summary>Musterlösung' + (tk.model.label ? ' · ' + esc(tk.model.label) : '') + '</summary><div class="mdl">' + esc(tk.model.text) + '</div>' +
            (tk.typicalErrors ? '<p class="terr"><b>Typische Fehler:</b> ' + esc(tk.typicalErrors) + '</p>' : '') + '</details>';
        }
        h += '</div>';
      });
      h += '<p class="note">Schreiben wird von Prüfenden bewertet (Aufgabe 1 = 40, Aufgabe 2 = 40, Aufgabe 3 = 20 Punkte). Schicken Sie Ihre Texte zur Korrektur an Ihre Lehrkraft. · 쓰기는 자동 채점되지 않습니다. 아래 버튼으로 선생님께 답안을 보내 첨삭을 받으세요.</p>';
      h += '<div class="links">' + (pg.muster ? '<a class="btn sm" href="' + pdf + '#page=' + pg.muster + '" target="_blank" rel="noopener">Musterlösungen (PDF S. ' + pg.muster + ')</a>' : '') + '</div>';
    }
    h += '<div class="acts" style="margin-top:22px"><button class="btn pri" id="cp" type="button">' + (M.writing ? '답안 복사' : '결과 복사') + '</button>' +
      '<button class="btn" id="dl" type="button">txt로 저장</button><button class="btn" id="ml" type="button">메일로 보내기</button>' +
      '<button class="btn" id="again" type="button">다시 풀기</button><a class="btn" href="' + BACK + '">모듈 선택</a></div>' +
      '<a class="back" href="index.html#digital">← 디지털 시험 목록</a></section></main></div>';
    app.innerHTML = h;
    var txt = resultText(res);
    var fname = 'Goethe B1 Modelltest ' + T.roman + ' ' + MOD[R.mod].name + (res.name ? ' ' + res.name : '') + '.txt';
    $('#cp').addEventListener('click', function () { copyText(txt); });
    $('#dl').addEventListener('click', function () { downloadText(txt, fname.replace(/[\\/:*?"<>|_]+/g, ' ')); });
    $('#ml').addEventListener('click', function () {
      var subj = 'Goethe B1 Modelltest ' + T.roman + ' · ' + MOD[R.mod].name + (res.name ? ' · ' + res.name : '');
      location.href = 'mailto:' + encodeURIComponent(LEHRER_MAIL) + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(txt);
    });
    $('#again').addEventListener('click', function () {
      modal('Noch einmal?', ['Das Modul beginnt von vorn. Das letzte Ergebnis bleibt gespeichert, bis Sie das Modul erneut abgeben.', '처음부터 다시 풉니다. 다시 제출하기 전까지 지난 결과는 남아 있습니다.'], [
        { label: 'Abbrechen' }, { label: 'Neu beginnen', pri: true, fn: function () { lsDel(STATE_KEY); showStart(); } }
      ]);
    });
    window.scrollTo(0, 0);
  }

  /* ---------- overlays ---------- */
  function modal(title, lines, buttons, blocking) {
    var bg = document.createElement('div');
    bg.className = 'mbg';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdt"><h3 id="mdt">' + esc(title) + '</h3>' +
      lines.map(function (l, i) { return '<p class="' + (i ? 'ko' : '') + '">' + esc(l) + '</p>'; }).join('') +
      '<div class="mb">' + buttons.map(function (b, i) { return '<button type="button" class="btn' + (b.pri ? ' pri' : '') + '" data-i="' + i + '">' + esc(b.label) + '</button>'; }).join('') + '</div></div>';
    document.body.appendChild(bg);
    function close() { if (bg.parentNode) bg.parentNode.removeChild(bg); document.removeEventListener('keydown', onKey); }
    close.el = bg;
    function onKey(e) { if (e.key === 'Escape' && !blocking) close(); }
    document.addEventListener('keydown', onKey);
    $$('button', bg).forEach(function (btn) {
      btn.addEventListener('click', function () { var b = buttons[+btn.getAttribute('data-i')]; close(); if (b.fn) b.fn(); });
    });
    if (!blocking) bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    var pri = $('.btn.pri', bg) || $('.btn', bg); if (pri) pri.focus();
    return close;
  }
  var toastTimer = null;
  function toast(msg, warn) {
    var t = $('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.toggle('w', !!warn); t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 4200);
  }
  function openOverview() {
    if (M.writing) return;
    var reach = maxReachable();
    var h = '<div class="ovgrid">', last = 0;
    M.items.forEach(function (it) {
      if (it.teil !== last) { h += '<span class="tp">Teil ' + it.teil + '</span>'; last = it.teil; }
      var ans = S.answers[it.no] != null;
      h += '<button class="chip' + (ans ? ' ans' : '') + '" type="button" data-no="' + esc(it.no) + '"' + (it.page > reach ? ' disabled' : '') + '>' + esc(it.no) + '</button>';
    });
    h += '</div>';
    var close = modal('Aufgabenübersicht', [countOpen() + ' offene Aufgaben', '번호를 누르면 그 문항으로 이동합니다.'], [{ label: 'Schließen' }]);
    var md = $('.modal', close.el);
    md.insertAdjacentHTML('beforeend', h);
    $$('.ovgrid .chip', md).forEach(function (c) { c.addEventListener('click', function () { close(); jumpTo(c.getAttribute('data-no')); }); });
  }

  /* ---------- tutorial ---------- */
  var tourEls = null;
  function tourSteps() {
    var common = [
      ['#tm', timerId ? 'Hier sehen Sie die verbleibende Zeit. Die Zeit läuft weiter, während Sie das Tutorial ansehen.' : 'Hier sehen Sie die verbleibende Zeit. Die Zeit läuft erst, wenn Sie die Prüfung starten.',
        timerId ? '남은 시험 시간입니다. 튜토리얼을 보는 동안에도 시간은 흐릅니다.' : '남은 시험 시간입니다. 시험을 시작해야 시간이 흐릅니다.']
    ];
    if (R.mod === 'lesen') return common.concat([
      ['#tabs', 'Hier wechseln Sie zwischen den Teilen 1 bis 5. Die Zahl zeigt, wie viele Aufgaben Sie im Teil schon gelöst haben.', 'Teil 1–5 사이를 이동합니다. 숫자는 그 Teil에서 푼 문항 수입니다.'],
      ['#paneL', 'Links steht der Text. In Teil 2 wechseln Sie oben rechts zwischen Text 1 und Text 2.', '왼쪽에는 지문이 있습니다. Teil 2에서는 오른쪽 위에서 Text 1과 Text 2를 바꿉니다.'],
      ['#paneR', 'Rechts stehen die Aufgaben. Klicken Sie die richtige Lösung an. Sie können Ihre Antwort jederzeit ändern.', '오른쪽에는 문항이 있습니다. 정답을 클릭하세요. 답은 언제든 바꿀 수 있습니다.'],
      ['#mk', 'Mit „Markieren“ heben Sie wichtige Textstellen farbig hervor: einschalten, dann Text mit der Maus markieren. Ein Klick auf die Markierung löscht sie wieder.', '‘Markieren’을 켜고 지문을 드래그하면 형광펜이 칠해집니다. 칠한 곳을 누르면 지워집니다.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#ov', 'In der Aufgabenübersicht sehen Sie, welche Aufgaben schon beantwortet (grün) und welche noch offen sind. Mit einem Klick springen Sie direkt zur Aufgabe.', '문항 번호표에서 푼 문항(초록)과 남은 문항을 확인하고, 번호를 눌러 바로 이동합니다.'],
      ['#nav', 'Mit „Weiter“ und „Zurück“ blättern Sie. Wenn Sie fertig sind, klicken Sie auf „Abgeben“.', '‘Weiter’와 ‘Zurück’으로 넘기고, 다 풀면 ‘Abgeben’을 누릅니다.']
    ]);
    if (R.mod === 'hoeren') return common.concat([
      ['#vol', 'Hier stellen Sie die Lautstärke ein.', '음량을 조절합니다.'],
      ['#abar', 'Hier sehen Sie, welcher Hörtext gerade läuft. Die Hörtexte starten automatisch. Sie können sie nicht anhalten oder wiederholen.', '지금 재생 중인 음원이 표시됩니다. 음원은 자동으로 시작되며 멈추거나 다시 들을 수 없습니다.'],
      ['#tabs', 'Mit dem Hörtext wechselt auch der Teil. Spätere Teile sind gesperrt, frühere Teile können Sie wieder öffnen.', '음원에 맞춰 Teil이 바뀝니다. 다음 Teil은 잠겨 있고, 지나간 Teil은 다시 열 수 있습니다.'],
      ['#paneR', 'Lesen Sie die Aufgaben und klicken Sie die richtige Lösung an.', '문항을 읽고 정답을 클릭하세요.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#ov', 'Die Aufgabenübersicht zeigt, welche Aufgaben noch offen sind.', '문항 번호표에서 남은 문항을 확인합니다.'],
      ['#nav', 'Nach dem letzten Hörtext können Sie Ihre Antworten noch prüfen und dann auf „Abgeben“ klicken.', '마지막 음원이 끝난 뒤 답을 확인하고 ‘Abgeben’을 누릅니다.']
    ]);
    return common.concat([
      ['#tabs', 'Hier wechseln Sie zwischen den Aufgaben 1 bis 3. Sie können mit jeder Aufgabe beginnen.', '과제 1–3 사이를 이동합니다. 어느 과제부터 써도 됩니다.'],
      ['.pane.l', 'Hier steht die Aufgabe.', '여기에 과제가 있습니다.'],
      ['#ed', 'Schreiben Sie Ihren Text in dieses Feld.', '이 입력란에 글을 씁니다.'],
      ['#wc', 'Die Wörter werden automatisch gezählt.', '단어 수가 자동으로 계산됩니다.'],
      ['#sz', 'Mit diesen Tasten fügen Sie ä, ö, ü, ß und Anführungszeichen ein.', '이 버튼으로 ä, ö, ü, ß와 따옴표를 넣습니다.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#nav', 'Wenn Sie fertig sind, klicken Sie auf „Abgeben“.', '다 쓰면 ‘Abgeben’을 누릅니다.']
    ]);
  }
  function runTour(done) {
    var steps = tourSteps().filter(function (s) { return $(s[0]); });
    if ($('#help') && $('#help').offsetParent !== null) {
      steps.splice(steps.length - 1, 0, ['#help', 'Mit „?“ können Sie dieses Tutorial während der Prüfung noch einmal ansehen.', '‘?’를 누르면 시험 중에도 이 튜토리얼을 다시 볼 수 있습니다.']);
    }
    var i = 0;
    var block = document.createElement('div'); block.className = 'tipblock';
    var hole = document.createElement('div'); hole.className = 'hole';
    var tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role', 'dialog'); tip.setAttribute('aria-live', 'polite');
    document.body.appendChild(block); document.body.appendChild(hole); document.body.appendChild(tip);
    tourEls = [block, hole, tip];
    function place() {
      var el = $(steps[i][0]); if (!el) return;
      try { el.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ }
      var r = el.getBoundingClientRect(), pad = 5;
      var vw = window.innerWidth, vh = window.innerHeight;
      var top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad);
      var w = Math.min(vw - 8, r.width + pad * 2), hh = Math.min(vh - 8, r.height + pad * 2);
      hole.style.top = top + 'px'; hole.style.left = left + 'px'; hole.style.width = w + 'px'; hole.style.height = hh + 'px';
      tip.innerHTML = '<div class="stp">Tutorial · Schritt ' + (i + 1) + ' von ' + steps.length + '</div><p>' + esc(steps[i][1]) + '</p><p class="ko">' + esc(steps[i][2]) + '</p>' +
        '<div class="tb"><button class="btn sm" type="button" id="tskip">Tutorial beenden</button><span style="display:flex;gap:6px">' +
        (i > 0 ? '<button class="btn sm" type="button" id="tprev">Zurück</button>' : '') +
        '<button class="btn sm pri" type="button" id="tnext">' + (i < steps.length - 1 ? 'Weiter' : 'Fertig') + '</button></span></div>';
      var tw = tip.offsetWidth, th = tip.offsetHeight, gap = 14, tx, ty;
      var clampX = function (x) { return Math.min(Math.max(8, x), vw - tw - 8); };
      var clampY = function (y) { return Math.min(Math.max(8, y), vh - th - 8); };
      if (top + hh + gap + th <= vh - 8) { ty = top + hh + gap; tx = clampX(left); }            // below
      else if (top - gap - th >= 8) { ty = top - gap - th; tx = clampX(left); }                // above
      else if (left - gap - tw >= 8) { tx = left - gap - tw; ty = clampY(top + hh / 2 - th / 2); }   // left
      else if (left + w + gap + tw <= vw - 8) { tx = left + w + gap; ty = clampY(top + hh / 2 - th / 2); } // right
      else { tx = clampX(left + w / 2 - tw / 2); ty = clampY(top + hh - th - 16); }              // inside, bottom
      tip.style.top = ty + 'px'; tip.style.left = tx + 'px';
      $('#tnext').addEventListener('click', function () { if (i < steps.length - 1) { i++; place(); } else end(); });
      if ($('#tprev')) $('#tprev').addEventListener('click', function () { i--; place(); });
      $('#tskip').addEventListener('click', end);
      $('#tnext').focus();
    }
    function end() {
      closeTour();
      window.removeEventListener('resize', place);
      if (!done) return;
      modal('Prüfung starten', ['Das Tutorial ist beendet. Wenn Sie auf „Prüfung starten“ klicken, beginnt die Prüfungszeit' + (R.mod === 'hoeren' ? ' und der erste Hörtext wird abgespielt.' : '.'),
        '‘Prüfung starten’을 누르면 시험 시간이 시작됩니다' + (R.mod === 'hoeren' ? '. 첫 음원도 바로 재생됩니다.' : '.')], [
        { label: 'Prüfung starten', pri: true, fn: done }
      ], true);
    }
    window.addEventListener('resize', place);
    place();
  }
  function closeTour() { if (tourEls) { tourEls.forEach(function (e) { if (e.parentNode) e.parentNode.removeChild(e); }); tourEls = null; } }

  /* ---------- go ---------- */
  if (R.view === 'ergebnis') {
    var rr = lsGet(RESULT_KEY);
    if (rr) { showResult(rr); return; }
  }
  showStart();
  window.__exam = {
    model: M, data: T,
    state: function () { return S; },
    seekEnd: function (left) { var t = Math.max(0, (AUD.duration || 0) - (left || 1)); audioLastPos = t; AUD.currentTime = t; }
  };
})();
</script>
