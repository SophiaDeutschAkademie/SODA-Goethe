 Möller und dem Tierschützer Daniel Seidel über die Frage: „Brauchen wir noch Zoos?“","speakers":{"a":"Moderator","b":"Christine Möller","c":"Daniel Seidel"},"example":{"no":"0","text":"Zoos haben jedes Jahr sehr viele Besucher.","answer":"a"},"items":[{"no":"23","text":"Manche Tiere leiden darunter, dass sie zu wenig Platz haben.","answer":"c"},{"no":"24","text":"Ohne Zoos gäbe es einige Tierarten heute nicht mehr.","answer":"b"},{"no":"25","text":"Nur ein kleiner Teil der Zootiere gehört zu bedrohten Arten.","answer":"a"},{"no":"26","text":"Das Geld sollte besser direkt dort ausgegeben werden, wo die Tiere leben.","answer":"c"},{"no":"27","text":"Im Zoo erleben Kinder Tiere so, wie es kein Film zeigen kann.","answer":"b"},{"no":"28","text":"Bestimmte Tierarten sollten gar nicht mehr in Zoos leben.","answer":"c"},{"no":"29","text":"Einige Zoos halten schon heute keine Elefanten oder Eisbären mehr.","answer":"a"},{"no":"30","text":"Zoos haben nur eine Zukunft, wenn sie sich verändern.","answer":"b"}]}},"schreiben":{"intro":"Das Modul Schreiben besteht aus drei Teilen. In den Aufgaben 1 und 3 schreiben Sie E-Mails, in Aufgabe 2 schreiben Sie einen Diskussionsbeitrag. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf den Antwortbogen.","tasks":[{"no":1,"minutes":20,"words":80,"situation":["Sie haben am Freitag mit Ihren Kolleginnen und Kollegen einen Betriebsausflug gemacht. Ein Freund/Eine Freundin von Ihnen möchte wissen, wie es war."],"points":["Beschreiben Sie: Was haben Sie gemacht?","Begründen Sie: Warum ist so ein Ausflug für Ihr Team wichtig?","Machen Sie einen Vorschlag für ein Treffen."],"post":null,"instruction":"Schreiben Sie eine E-Mail (circa 80 Wörter). Schreiben Sie etwas zu allen drei Punkten. Achten Sie auf den Textaufbau (Anrede, Einleitung, Reihenfolge der Inhaltspunkte, Schluss).","model":{"label":"E-Mail an einen Freund, ca. 90 Wörter","text":"Betreff: Unser Betriebsausflug\n\nLieber Marco,\n\nam Freitag war ich mit meinem Team auf Betriebsausflug. Wir sind mit dem Schiff über den Bodensee gefahren und haben danach in einem Kletterpark ein Teamtraining gemacht. Am Abend haben wir zusammen gegrillt.\n\nSo ein Ausflug ist für uns wichtig, weil wir im Büro kaum Zeit haben, miteinander zu reden. Ich habe zwei Kollegen aus der IT-Abteilung zum ersten Mal richtig kennengelernt.\n\nHast du am Samstag Zeit? Wir könnten zusammen frühstücken, dann erzähle ich dir mehr.\n\nViele Grüße\nElena"},"typicalErrors":"Nur der Ausflug wird beschrieben, die Begründung fehlt · Vorschlag ohne Zeitpunkt · Sie statt du."},{"no":2,"minutes":25,"words":80,"situation":["Sie haben im Radio eine Sendung zum Thema „Pünktlichkeit – wie wichtig ist sie heute noch?“ gehört. Im Online-Gästebuch der Sendung finden Sie folgende Meinung:"],"points":[],"post":{"site":"www.radio-alltag.de","label":"Gästebuch","author":"Holger · 03.11. 18:35 Uhr","text":"Bei uns im Büro kommt die Hälfte der Kollegen zu jeder Besprechung fünf oder zehn Minuten zu spät. Wer pünktlich ist, sitzt dann allein im Raum und wartet. Meine Kollegen sagen, das sei heute eben normal, man könne ja kurz eine Nachricht schreiben. Ich finde das unhöflich."},"instruction":"Schreiben Sie nun Ihre Meinung zum Thema (circa 80 Wörter).","model":{"label":"Diskussionsbeitrag, ca. 95 Wörter","text":"Holger spricht ein Thema an, das ich gut kenne. Ich finde Pünktlichkeit sehr wichtig, weil man damit zeigt, dass man die Zeit der anderen respektiert. Wenn fünf Leute zehn Minuten warten, ist fast eine Stunde Arbeitszeit verloren.\n\nNatürlich kann jeder einmal im Stau stehen oder den Bus verpassen. Dann ist eine kurze Nachricht in Ordnung. Aber wer immer zu spät kommt, ist unhöflich. In meinem Heimatland ist man bei privaten Treffen etwas lockerer, bei der Arbeit aber auch pünktlich.\n\nIch würde Holger raten, das Problem in der nächsten Besprechung offen anzusprechen."},"typicalErrors":"Holgers Beitrag nur wiederholen · keine eigene Meinung oder keine Begründung · deutlich unter 80 Wörtern."},{"no":3,"minutes":15,"words":40,"situation":["Ihr Sohn spielt in einem Fußballverein. Am Samstag hat seine Mannschaft ein wichtiges Turnier, aber Ihr Sohn ist krank."],"points":[],"post":null,"instruction":"Schreiben Sie an den Trainer, Herrn Lang. Entschuldigen Sie Ihren Sohn, erklären Sie die Situation und fragen Sie nach dem nächsten Training. Schreiben Sie eine E-Mail (circa 40 Wörter). Vergessen Sie nicht die Anrede und den Gruß am Schluss.","model":{"label":"E-Mail an den Trainer, ca. 45 Wörter","text":"Sehr geehrter Herr Lang,\n\nleider kann mein Sohn Tim am Samstag nicht beim Turnier spielen, weil er seit gestern Fieber hat. Das tut ihm und uns leid, denn er hat sich sehr auf das Turnier gefreut. Können Sie mir bitte sagen, wann das nächste Training stattfindet?\n\nMit freundlichen Grüßen\nSandra Kovač"},"typicalErrors":"Keine Frage nach dem Training · Hallo Herr Lang oder Liebe Grüße · kein Grund genannt."}]},"audio":[{"src":"Goethe%20B1%20Modelltest%207.1.mp3","dur":541.34},{"src":"Goethe%20B1%20Modelltest%207.2.mp3","dur":263.21},{"src":"Goethe%20B1%20Modelltest%207.3.mp3","dur":242.42},{"src":"Goethe%20B1%20Modelltest%207.4.mp3","dur":538.38}],"pdf":"Goethe%20B1%20Modelltest%207.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"8":{"id":8,"roman":"VIII","lesen":{"t1":{"instruction":"Lesen Sie den Text und die Aufgaben 1 bis 6 dazu. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","blog":{"site":"lauter-leise.de · Corinna","date":"Sonntag, 9. Februar","title":"Mit den Händen sprechen","paragraphs":["Seit vergangenem März haben wir eine neue Kollegin in der Buchhaltung: Hanna. Sie ist von Geburt an gehörlos. In den ersten Wochen haben wir uns nur mit Zetteln und Nachrichten auf dem Handy verständigt. Das hat zwar funktioniert, aber in der Mittagspause saß Hanna meistens allein am Tisch, weil ihr die Gespräche viel zu schnell waren. Das hat mich mehr beschäftigt, als ich zugeben wollte.","Im Herbst habe ich mich deshalb an der Volkshochschule für einen Kurs in Deutscher Gebärdensprache angemeldet. Hanna wusste davon nichts – ich wollte sie überraschen. Der Kurs findet jeden Montagabend statt, und unsere Lehrerin ist selbst gehörlos. Gesprochen wird im Unterricht kein einziges Wort. Am ersten Abend war ich völlig verloren und habe mich gefragt, warum ich mir das antue.","Inzwischen weiß ich: Gebärdensprache ist nicht einfach Deutsch mit den Händen. Sie hat eine eigene Grammatik, und das Gesicht spielt eine große Rolle. Wer eine Frage stellt, zieht zum Beispiel die Augenbrauen hoch. Am schwersten fällt mir nicht das Gebärden, sondern das Lesen: Wenn jemand schnell gebärdet, verstehe ich oft nur jedes dritte Wort.","Kurz vor Weihnachten habe ich mich dann getraut. Ich bin in der Pause zu Hanna gegangen und habe ihr in Gebärdensprache gesagt, dass ich mich auf die Weihnachtsfeier freue. Ich habe bestimmt drei Fehler gemacht. Hanna hat erst gelacht und dann vor Freude geweint, und danach hat sie mich korrigiert – sehr geduldig, wie eine echte Lehrerin.","Seitdem hat sich in unserer Abteilung einiges verändert. Zwei Kollegen haben sich für den nächsten Kurs angemeldet, und unser Chef hat beschlossen, dass bei Teambesprechungen künftig eine Dolmetscherin dabei ist. Hanna sitzt mittags nicht mehr allein. Manchmal bringt sie uns in der Pause ein neues Zeichen bei, meistens für etwas zu essen.","Im Sommer möchte ich die Prüfung für die zweite Stufe machen. Dolmetscherin werden will ich aber nicht – dafür bräuchte ich ein ganzes Studium. Mir reicht es, wenn ich mich mit Hanna über alles unterhalten kann, was uns interessiert. Und das klappt schon erstaunlich oft."],"closing":"Bis bald, Corinna"},"example":{"no":"0","text":"Corinna lernt seit einiger Zeit Gebärdensprache.","answer":"R"},"items":[{"no":"1","text":"Hanna hatte Corinna vorgeschlagen, Gebärdensprache zu lernen.","answer":"F"},{"no":"2","text":"Für Corinna ist es schwieriger, andere zu verstehen, als selbst zu gebärden.","answer":"R"},{"no":"3","text":"Hanna hat sich über Corinnas Überraschung gefreut.","answer":"R"},{"no":"4","text":"Corinnas Chef hat selbst einen Kurs angefangen.","answer":"F"},{"no":"5","text":"Corinna möchte später als Dolmetscherin arbeiten.","answer":"F"},{"no":"6","text":"Corinna kann sich mit Hanna schon oft gut unterhalten.","answer":"R"}]},"t2":{"texts":[{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 7 bis 9 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Ausgeschlafen in den Unterricht","lead":"Am Gymnasium Lindenberg beginnt der Unterricht seit einem Jahr erst um neun Uhr.","paragraphs":["Um 7.30 Uhr ist der Schulhof des Gymnasiums Lindenberg noch leer. Früher saßen um diese Zeit schon tausend Jugendliche in ihren Klassenräumen, viele mit müden Augen. Seit einem Jahr beginnt die erste Stunde erst um neun Uhr. Die Idee stammt von der Schülervertretung, die sich auf Untersuchungen von Schlafforschern berief: Jugendliche werden abends später müde als Erwachsene und brauchen morgens mehr Schlaf. „Um acht Uhr ist der Körper eines Fünfzehnjährigen eigentlich noch im Bett“, sagt Schulleiter Thomas Engel. Nach einem Jahr ist die Bilanz positiv: Laut einer Umfrage der Schule schlafen die Schülerinnen und Schüler im Durchschnitt 40 Minuten länger, und es kommen deutlich weniger zu spät. Ob die Noten besser geworden sind, lässt sich noch nicht sagen. Nicht alle sind begeistert. Weil der Unterricht jetzt eine Stunde später endet, haben viele Jugendliche weniger Zeit für Sport oder Musik am Nachmittag. Einige Eltern, die früh zur Arbeit müssen, bringen ihre Kinder trotzdem um halb acht zur Schule. Für sie gibt es seit diesem Schuljahr eine Frühbetreuung in der Bibliothek, in der man lesen oder Hausaufgaben machen kann. Auch die Busunternehmen mussten ihre Fahrpläne ändern. Für die Lehrkräfte bedeutet der spätere Beginn längere Tage; manche korrigieren jetzt am frühen Morgen. Das Kultusministerium beobachtet den Versuch genau; ab dem nächsten Schuljahr wollen zwei weitere Schulen in der Region mitmachen."],"footnote":"","source":"aus einer deutschen Zeitung","example":{"no":"0","stem":"Die erste Stunde …","options":{"a":"beginnt um 7.30 Uhr.","b":"beginnt später als früher.","c":"fällt seit einem Jahr aus."},"answer":"b"},"items":[{"no":"7","stem":"In diesem Text geht es um …","options":{"a":"Schüler, die abends zu lange am Handy sind.","b":"eine Schule, die den Unterricht am Nachmittag verkürzt hat.","c":"eine Schule, an der der Schultag später anfängt."},"answer":"c"},{"no":"8","stem":"Nach einem Jahr …","options":{"a":"haben sich die Noten deutlich verbessert.","b":"kommen weniger Schüler verspätet.","c":"hat die Schule den Versuch wieder beendet."},"answer":"b"},{"no":"9","stem":"Für Kinder berufstätiger Eltern …","options":{"a":"gibt es vor dem Unterricht ein Angebot.","b":"fährt jetzt ein früherer Bus direkt zur Schule.","c":"endet der Unterricht schon am Mittag."},"answer":"a"}]},{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 10 bis 12 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Ein Kaffee für den Nächsten","lead":"In einem Wiener Kaffeehaus zahlen Gäste für Menschen mit, die sich keinen Kaffee leisten können.","paragraphs":["Wer im Café Moser in Wien-Ottakring bezahlt, wird manchmal gefragt: „Möchten Sie einen Kaffee aufschieben?“ Gemeint ist ein Kaffee, den man bezahlt, aber nicht selbst trinkt. Für jeden aufgeschobenen Kaffee macht die Kellnerin einen Strich auf einer Tafel neben der Tür. Wer wenig Geld hat, kann an der Theke nach einem dieser Kaffees fragen – ohne Erklärung und ohne einen Ausweis zu zeigen. Die Idee kommt ursprünglich aus Neapel. Dort heißt der aufgeschobene Kaffee „caffè sospeso“, und die Tradition ist über hundert Jahre alt. Inhaberin Eva Moser hat die Idee vor drei Jahren nach einem Urlaub in Italien eingeführt. „Am Anfang hatte ich Angst, dass niemand mitmacht“, erzählt sie. Inzwischen werden jede Woche rund sechzig Kaffees aufgeschoben, meistens eine Melange*. Wer möchte, kann auch einen kleinen Betrag in eine Spardose werfen; das Geld reicht dann für einen weiteren Kaffee. Manche Stammgäste zahlen gleich fünf auf einmal, ein älterer Herr kommt jeden Freitag und zahlt zehn. Abgeholt werden die Kaffees von Studierenden, Rentnerinnen mit kleiner Pension und Menschen, die auf der Straße leben. Missbrauch gebe es kaum, sagt Moser: Wer zweimal am Tag kommt, wird freundlich darauf hingewiesen, dass die Kaffees für möglichst viele reichen sollen. Seit dem Frühjahr gibt es neben Kaffee auch aufgeschobene Suppen. Zwei weitere Kaffeehäuser im Bezirk haben die Idee schon übernommen, und Moser hofft, dass es bald noch mehr werden."],"footnote":"*Melange = österreichischer Standard für „Milchkaffee“","source":"aus einer österreichischen Zeitung","example":null,"items":[{"no":"10","stem":"In diesem Text geht es um …","options":{"a":"ein Café, das jeden Freitag kostenlos Kaffee an alle ausschenkt.","b":"Gäste, die für andere Menschen einen Kaffee mitbezahlen.","c":"eine Kellnerin, die in Italien Urlaub gemacht hat."},"answer":"b"},{"no":"11","stem":"Wer einen aufgeschobenen Kaffee möchte, …","options":{"a":"muss nicht sagen, warum.","b":"muss an der Theke seinen Ausweis zeigen.","c":"bekommt ihn nur am Freitag."},"answer":"a"},{"no":"12","stem":"Eva Moser …","options":{"a":"musste die Aktion wegen Missbrauchs stark einschränken.","b":"will die Idee bald auch nach Italien bringen.","c":"hat ihr Angebot inzwischen um Essen erweitert."},"answer":"c"}]}]},"t3":{"instruction":"Lesen Sie die Situationen 13 bis 19 und die Anzeigen a bis j aus verschiedenen deutschsprachigen Medien. Wählen Sie: Welche Anzeige passt zu welcher Situation? Sie können jede Anzeige nur einmal verwenden. Die Anzeige aus dem Beispiel können Sie nicht mehr verwenden. Für eine Situation gibt es keine passende Anzeige. In diesem Fall schreiben Sie 0.","context":"Einige Ihrer Bekannten planen eine Feier und suchen ein passendes Angebot.","example":{"no":"0","text":"Frau Lindqvist möchte für den Geburtstag ihrer Mutter eine Torte bestellen.","answer":"b"},"items":[{"no":"13","text":"Familie Brandner feiert die Hochzeit ihrer Tochter mit 120 Gästen. Eine befreundete Köchin soll das Essen machen; gesucht wird ein passender Raum.","answer":"a"},{"no":"14","text":"Herr Demir möchte im Sommer mit 25 Freunden draußen grillen, am liebsten mitten in der Natur.","answer":"f"},{"no":"15","text":"Lucas wird sieben. Seine Eltern wollen zu Hause feiern und suchen jemanden, der die Kinder unterhält.","answer":"h"},{"no":"16","text":"Frau Kühn organisiert die Weihnachtsfeier ihrer Abteilung (12 Personen). Alle sollen dabei gemeinsam etwas tun, und ein Essen soll auch dazugehören.","answer":"i"},{"no":"17","text":"Herr und Frau Petrović feiern ihre Silberhochzeit im eigenen Garten und brauchen noch Tische, Bänke und ein Zelt.","answer":"j"},{"no":"18","text":"Anna möchte ihren Geburtstag im Dezember auf einem Schiff feiern.","answer":"0"},{"no":"19","text":"Herr Bauer lädt Gäste zu sich nach Hause ein. Er will ihnen ein Essen anbieten, ohne selbst zu kochen oder danach abzuwaschen.","answer":"c"}],"ads":[{"letter":"a","design":"hotel","header":"","tag":"SAALVERMIETUNG","title":"Bürgerhaus Lindenhof","subtitle":"","facts":[],"body":["Unser großer Saal bietet Platz für bis zu 120 Gäste. Eine voll ausgestattete Küche gehört dazu – Sie dürfen Ihr Essen selbst mitbringen oder von einem Koch Ihrer Wahl zubereiten lassen. Feiern sind bis 23 Uhr möglich."],"footer":"Saalmiete ab 450 € · Tel. 0421 / 30 12 12"},{"letter":"b","design":"serif","header":"","tag":"","title":"Konditorei Zuckerhut","subtitle":"TORTEN AUF BESTELLUNG","facts":[],"body":["Torten für jeden Anlass – vom Kindergeburtstag bis zur Hochzeit. Bitte bestellen Sie mindestens drei Tage im Voraus. Auf Wunsch schreiben wir Namen oder Glückwünsche auf die Torte."],"footer":"Bahnhofstraße 12 · Di–So 8–18 Uhr"},{"letter":"c","design":"corp","header":"","tag":"","title":"Feinkost Hagedorn","subtitle":"PARTYSERVICE","facts":[],"body":["Kalte und warme Buffets für 20 bis 200 Personen. Wir liefern pünktlich zu Ihnen nach Hause oder in Ihren Festsaal und holen Geschirr, Besteck und Gläser am nächsten Tag ungespült wieder ab."],"footer":"feinkost-hagedorn.de"},{"letter":"d","design":"barhead","deco":{"icon":"note"},"header":"","tag":"","title":"DJ SOUND-MIKE","subtitle":"","facts":[],"body":["Musik für Hochzeiten, runde Geburtstage und Firmenfeiern – von Schlager bis Hip-Hop. Licht- und Tonanlage bringe ich mit. Ihre Musikwünsche besprechen wir vorher in Ruhe."],"footer":"ab 300 € pro Abend"},{"letter":"e","design":"inst","header":"","tag":"REC","title":"Fotostudio Blende 8","subtitle":"","facts":[],"body":["Wir begleiten Ihre Hochzeit oder Familienfeier mit der Kamera und liefern die Bilder zwei Wochen später auf einem USB-Stick. Neu: unsere Fotobox für Ihre Gäste – mit Hüten, Brillen und sofortigem Ausdruck."],"footer":"blende8-foto.de"},{"letter":"f","design":"greyband","header":"","tag":"","title":"GRILLPLATZ AM WALDSEE","subtitle":"","facts":[],"body":["Mitten im Wald, direkt am Wasser: Grillhütte mit Feuerstelle für bis zu 40 Personen. Toiletten sind vorhanden, Strom leider nicht. Musik bitte nur bis 22 Uhr."],"footer":"50 € pro Tag · Buchung bei der Gemeinde"},{"letter":"g","design":"rounded","header":"","tag":"","title":"Partyschiff MS Aurora","subtitle":"FEIERN AUF DEM RHEIN","facts":[],"body":["Platz für 30 bis 100 Gäste. Essen und Getränke an Bord sind im Preis enthalten; eigenes Essen ist leider nicht erlaubt. Fahrten von April bis Oktober."],"footer":""},{"letter":"h","design":"speech","header":"","tag":"","title":"Clown Pepe kommt!","subtitle":"","facts":[],"body":["Kindergeburtstag ohne Stress: Clown Pepe kommt zu Ihnen nach Hause und begeistert Kinder von 4 bis 10 Jahren zwei Stunden lang mit Zaubertricks, Spielen und Luftballontieren."],"footer":"Tel. 0170 / 2 23 45 67"},{"letter":"i","design":"dashed","header":"","tag":"","title":"Kochschule Pfeffer & Salz","subtitle":"FEIERN EINMAL ANDERS","facts":[],"body":["Bei uns kochen Gruppen von 8 bis 14 Personen gemeinsam ein Menü mit drei Gängen und essen es anschließend zusammen. Ideal für Geburtstage und Firmenfeiern. Getränke inklusive."],"footer":""},{"letter":"j","design":"mono","header":"Partyverleih Feierabend","tag":"pro Tag","title":"","subtitle":"","facts":["Festzelt (6 × 3 m) · 90 €","Biertischgarnitur · 12 €","50 Gläser · 15 €","Hüpfburg · 80 €"],"body":["Lieferung und Aufbau im Umkreis von 30 km kostenlos."],"footer":""}]},"t4":{"instruction":"Lesen Sie die Texte 20 bis 26. Wählen Sie: Ist die Person für Schuluniformen, Ja oder Nein?","context":"In einer Zeitschrift lesen Sie Kommentare zu einem Artikel über Schulen, an denen alle Schülerinnen und Schüler die gleiche Kleidung tragen.","header":"LESERKOMMENTARE","site":"www.schule-und-familie.de/forum","example":{"no":"0","name":"Karin","byline":"Karin, 48, Freiburg","text":"Meine Kinder sollen in der Schule lernen, selbst zu entscheiden – auch, was sie anziehen. Kleidung ist für Jugendliche eine Möglichkeit, zu zeigen, wer sie sind. Wenn alle gleich aussehen, ändert das nichts daran, dass manche Eltern mehr Geld haben als andere. Das sieht man dann eben an den Handys, den Taschen oder an den Schuhen. Ich halte deshalb nichts davon.","answer":"N"},"items":[{"no":"20","name":"Sandra","byline":"Sandra, 41, Augsburg","text":"Jeden Morgen der gleiche Streit: Meine Tochter steht eine halbe Stunde vor dem Kleiderschrank und findet nichts, was „gut genug“ ist. An der Schule meines Neffen in Irland tragen dagegen alle dunkelblaue Pullover und graue Hosen, und kein Mensch diskutiert darüber. So etwas wünsche ich mir auch für unsere Schule – es würde uns allen viele Nerven sparen.","answer":"J"},{"no":"21","name":"Michael","byline":"Michael, 56, Wien","text":"Als unsere Schule vor zwei Jahren einheitliche Schulshirts eingeführt hat, war ich als Lehrer skeptisch. Ich hielt das für altmodisch. Heute sehe ich das anders: Auf Ausflügen erkennt man unsere Schüler sofort, und das Mobbing wegen Kleidung ist deutlich zurückgegangen. Die Farben haben die Schülerinnen und Schüler übrigens selbst ausgesucht. Auch die Eltern sind inzwischen zufrieden.","answer":"J"},{"no":"22","name":"Julia","byline":"Julia, 37, Erfurt","text":"Ich verstehe die Eltern, die sich über teure Markenkleidung ärgern. Aber eine Uniform ist nicht die Lösung. Sie kostet auch Geld, oft mehr als normale Kleidung, und man braucht mehrere Teile zum Wechseln. Außerdem wachsen Kinder ständig. Gerade Familien mit mehreren Kindern hätten es dann schwer. Besser wäre es, mit den Jugendlichen darüber zu reden, was wirklich wichtig ist.","answer":"N"},{"no":"23","name":"Oliver","byline":"Oliver, 44, Potsdam","text":"Ich bin nur dafür, wenn die Kleidung bequem ist und die Schüler bei der Auswahl mitbestimmen dürfen. Genau so hat es die Schule meiner Tochter gemacht: Die Klassen haben über drei Entwürfe abgestimmt, und jetzt gibt es Kapuzenpullis mit dem Schullogo. Meine Tochter trägt ihren sogar am Wochenende – das sagt doch alles. Gezwungen fühlt sich dort niemand.","answer":"J"},{"no":"24","name":"Lena","byline":"Lena, 16, Münster","text":"Meine Eltern und meine Lehrer finden Schuluniformen eine tolle Idee. Ich sehe das anders. Ich verbringe den größten Teil des Tages in der Schule, und dann soll ich nicht einmal selbst entscheiden dürfen, was ich trage? Meine Kleidung gehört zu mir, genauso wie meine Musik und meine Frisur. Außerdem lernen wir doch nicht besser, nur weil alle gleich aussehen.","answer":"N"},{"no":"25","name":"Ibrahim","byline":"Ibrahim, 39, Würzburg","text":"Statt einer Uniform sollte man lieber einfache Regeln festlegen: keine Kleidung mit Beleidigungen oder Werbung für Alkohol und nichts, was zu kurz ist. Wer sich nicht daran hält, muss sich eben umziehen. Mehr braucht es nicht. So behalten die Schüler ihre Freiheit, und die Schule hat trotzdem einen gewissen Rahmen. An unserer Schule funktioniert das seit Jahren gut.","answer":"N"},{"no":"26","name":"Peter","byline":"Peter, 71, Hannover","text":"Ich bin in Großbritannien zur Schule gegangen und habe jeden Tag eine Krawatte getragen. Geschadet hat mir das nicht – im Gegenteil: Wir haben uns als Gemeinschaft gefühlt, und morgens ging alles schneller. Viele meiner alten Klassenkameraden sehen das genauso. Natürlich muss die Kleidung bezahlbar sein. Ich verstehe nicht, warum man hier so viel Angst vor gleicher Kleidung hat.","answer":"J"}]},"t5":{"instruction":"Lesen Sie die Aufgaben 27 bis 30 und den Text dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","context":"Sie möchten mit dem Fernbus fahren und lesen die Beförderungsbedingungen.","doc":{"title":"BEFÖRDERUNGSBEDINGUNGEN · FERNEXPRESS","intro":"","sections":[{"heading":"Fahrkarten","text":"Ihre Fahrkarte können Sie online, in der App oder beim Fahrer kaufen; beim Fahrer zahlen Sie allerdings zwei Euro mehr. Bitte zeigen Sie beim Einsteigen Ihre Fahrkarte und einen gültigen Ausweis."},{"heading":"Umbuchung und Stornierung","text":"Bis 15 Minuten vor der Abfahrt können Sie Ihre Fahrt online kostenlos auf einen anderen Tag oder eine andere Uhrzeit umbuchen. Wer die Fahrt ganz absagt, erhält einen Gutschein über den Fahrpreis, aber kein Bargeld."},{"heading":"Gepäck","text":"Pro Person sind ein Koffer bis 20 Kilogramm und ein kleines Handgepäckstück im Preis enthalten. Ein zweiter Koffer kostet zwei Euro extra und muss vorher online gebucht werden. Fahrräder nehmen wir nur auf Strecken mit Fahrradträger mit; dafür brauchen Sie eine eigene Fahrradkarte. Kinderwagen und Rollstühle melden Sie bitte vorher an; ihr Transport ist kostenlos."},{"heading":"Kinder und Jugendliche","text":"Kinder unter 6 Jahren reisen nur in Begleitung eines Erwachsenen und brauchen einen eigenen Kindersitz. Kinder von 6 bis 14 Jahren dürfen nur mit einer unterschriebenen Erlaubnis der Eltern allein fahren; ab 15 Jahren ist keine Erlaubnis mehr nötig."},{"heading":"Pünktlichkeit","text":"Bitte seien Sie spätestens 15 Minuten vor der Abfahrt an der richtigen Haltestelle. Bei mehr als zwei Stunden Verspätung können Sie die Hälfte des Fahrpreises zurückverlangen. Fällt eine Fahrt ganz aus, bringt Sie der nächste Bus ohne Aufpreis ans Ziel."},{"heading":"An Bord","text":"Essen und Trinken sind an Bord erlaubt, Alkohol jedoch nicht. Bitte telefonieren Sie leise und hören Sie Musik nur mit Kopfhörern. Haustiere dürfen nicht mitfahren; Assistenzhunde sind davon ausgenommen."}],"footer":""},"example":null,"items":[{"no":"27","stem":"Wer seine Fahrkarte im Bus kauft, …","options":{"a":"bekommt sie etwas günstiger als im Internet.","b":"muss beim Einsteigen keinen Ausweis zeigen.","c":"zahlt einen Aufpreis."},"answer":"c"},{"no":"28","stem":"Wer an einem anderen Tag fahren möchte, …","options":{"a":"bekommt sein Geld bar zurück.","b":"kann die Fahrt gratis verschieben.","c":"muss dafür eine zusätzliche Gebühr bezahlen."},"answer":"b"},{"no":"29","stem":"Ein Zwölfjähriger darf allein fahren, wenn …","options":{"a":"seine Eltern es schriftlich erlaubt haben.","b":"er einen eigenen Kindersitz mitbringt und benutzt.","c":"er mindestens sechs Jahre alt ist und einen Ausweis hat."},"answer":"a"},{"no":"30","stem":"Wer mit seinem Hund verreisen möchte, …","options":{"a":"muss für den Hund eine eigene Fahrkarte kaufen.","b":"darf ihn nur in ganz bestimmten Fällen mitnehmen.","c":"muss ihn während der Fahrt im Gepäckraum unter dem Bus lassen."},"answer":"b"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.","readNote":"Lesen Sie zuerst das Beispiel. Dazu haben Sie 10 Sekunden Zeit.","example":[{"no":"01","type":"rf","text":"Herr Schulte kann seinen Anzug heute abholen.","answer":"R"},{"no":"02","type":"abc","stem":"Herr Schulte soll …","options":{"a":"den Abholschein mitbringen.","b":"den ganzen Preis bezahlen.","c":"am Samstagnachmittag kommen."},"answer":"a"}],"texts":[{"label":"Text 1","items":[{"no":"1","type":"rf","text":"Im ganzen Park ist jetzt alles geschlossen.","answer":"F"},{"no":"2","type":"abc","stem":"Wer den Park früher verlässt, …","options":{"a":"bekommt den ganzen Eintritt zurück.","b":"bekommt einen Teil des Eintritts bar zurück.","c":"erhält etwas für einen späteren Besuch."},"answer":"c"}]},{"label":"Text 2","items":[{"no":"3","type":"rf","text":"Petra kann morgen nicht mit ihrem eigenen Auto fahren.","answer":"R"},{"no":"4","type":"abc","stem":"Jens soll …","options":{"a":"Petra wie immer vor ihrem Haus abholen.","b":"unterwegs noch jemanden mitnehmen.","c":"Frau Kraus am Bahnhof anrufen."},"answer":"b"}]},{"label":"Text 3","items":[{"no":"5","type":"rf","text":"Den Turm kann man nur an diesem einen Tag besteigen.","answer":"R"},{"no":"6","type":"abc","stem":"Wer auf den Turm möchte, …","options":{"a":"muss sich am Eingang eine Karte holen.","b":"muss dafür einen kleinen Betrag extra bezahlen.","c":"muss sich vorher telefonisch anmelden."},"answer":"a"}]},{"label":"Text 4","items":[{"no":"7","type":"rf","text":"Bücher zurückgeben kann man nur während der Öffnungszeiten.","answer":"F"},{"no":"8","type":"abc","stem":"Morgen …","options":{"a":"fällt die Lesung mit der Autorin aus.","b":"öffnet die Bibliothek wie immer zur gewohnten Zeit.","c":"öffnet die Bibliothek erst am Nachmittag."},"answer":"c"}]},{"label":"Text 5","items":[{"no":"9","type":"rf","text":"Can muss sofort zu einem Arzt.","answer":"F"},{"no":"10","type":"abc","stem":"Frau Aydın kann …","options":{"a":"auch eine andere berechtigte Person schicken.","b":"Can allein mit dem Bus nach Hause fahren lassen.","c":"Can am nächsten Morgen in der Schule abholen."},"answer":"a"}]}]},"t2":{"instruction":"Sie hören nun einen Text. Sie hören den Text einmal. Dazu lösen Sie fünf Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","readNote":"Lesen Sie jetzt die Aufgaben 11 bis 15. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie machen eine Stadtführung durch Lübeck. Die Stadtführerin, Frau Behrendt, begrüßt die Gruppe.","items":[{"no":"11","stem":"Wer die Gruppe verliert, …","options":{"a":"soll die Stadtführerin sofort auf dem Handy anrufen.","b":"soll zu einem vorher vereinbarten Ort gehen.","c":"soll am Holstentor auf die anderen warten."},"answer":"b"},{"no":"12","stem":"Für die Marienkirche …","options":{"a":"müssen die Teilnehmer nichts extra zahlen.","b":"braucht man an der Kasse noch eine eigene Eintrittskarte.","c":"hat die Gruppe nur am Nachmittag Zeit."},"answer":"a"},{"no":"13","stem":"In den Gängen und Höfen …","options":{"a":"darf man überhaupt keine Fotos von den Häusern machen.","b":"gibt es viele kleine Geschäfte.","c":"soll man die Bewohner nicht stören."},"answer":"c"},{"no":"14","stem":"Im Marzipancafé …","options":{"a":"darf man die Toiletten auch ohne Einkauf benutzen.","b":"bekommt jeder Teilnehmer ein kleines Stück Marzipan geschenkt.","c":"hat die Gruppe eine Stunde Pause."},"answer":"a"},{"no":"15","stem":"Am Ende der Führung …","options":{"a":"ist die Gruppe wieder am Holstentor angekommen.","b":"kann man gegen Bezahlung noch mehr sehen.","c":"fährt ein Sonderbus direkt zum Bahnhof."},"answer":"b"}]},"t3":{"instruction":"Sie hören nun ein Gespräch. Sie hören das Gespräch einmal. Dazu lösen Sie sieben Aufgaben. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","readNote":"Lesen Sie jetzt die Aufgaben 16 bis 22. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie sind im Treppenhaus und hören, wie sich zwei Nachbarinnen, Frau Lehmann und Frau Çelik, unterhalten.","items":[{"no":"16","text":"Frau Lehmann hat genau die Küche bekommen, die sie bestellt hatte.","answer":"F"},{"no":"17","text":"Das Möbelhaus übernimmt die Kosten für den Aufbau.","answer":"R"},{"no":"18","text":"Frau Lehmann ärgert sich vor allem darüber, dass sie nicht richtig kochen kann.","answer":"F"},{"no":"19","text":"Herr Çelik hat sich den Tischlerkurs selbst ausgesucht.","answer":"F"},{"no":"20","text":"Herr Çelik verbringt viel Zeit mit seinem neuen Hobby.","answer":"R"},{"no":"21","text":"Herr Çelik möchte auch für Nachbarn Möbel bauen.","answer":"R"},{"no":"22","text":"Herr Çelik möchte mit seinen Möbeln Geld verdienen.","answer":"F"}]},"t4":{"instruction":"Sie hören nun eine Diskussion. Sie hören die Diskussion zweimal. Dazu lösen Sie acht Aufgaben. Ordnen Sie die Aussagen zu: Wer sagt was?","readNote":"Lesen Sie jetzt die Aussagen 23 bis 30. Dazu haben Sie 60 Sekunden Zeit.","context":"Die Moderatorin der Radiosendung „Standpunkte“ diskutiert mit der Schlafforscherin Katrin Böhm und dem Landwirt Georg Steiner über die Frage: „Brauchen wir die Zeitumstellung noch?“","speakers":{"a":"Moderatorin","b":"Katrin Böhm","c":"Georg Steiner"},"example":{"no":"0","text":"Zweimal im Jahr werden die Uhren umgestellt.","answer":"a"},"items":[{"no":"23","text":"Viele Menschen haben nach der Umstellung Probleme mit dem Schlaf.","answer":"b"},{"no":"24","text":"Mit der Sommerzeit wollte man ursprünglich Energie sparen.","answer":"a"},{"no":"25","text":"Für die Tiere auf dem Hof spielt die Uhrzeit keine Rolle.","answer":"c"},{"no":"26","text":"Mit der Zeitumstellung spart man kaum Energie.","answer":"b"},{"no":"27","text":"Lange helle Abende im Sommer sind ein großer Gewinn.","answer":"c"},{"no":"28","text":"Das Europaparlament war bereits für eine Abschaffung.","answer":"a"},{"no":"29","text":"Man sollte für immer bei der Winterzeit bleiben.","answer":"b"},{"no":"30","text":"Bei dauerhafter Sommerzeit wäre es im Winter morgens lange dunkel.","answer":"c"}]}},"schreiben":{"intro":"Das Modul Schreiben besteht aus drei Teilen. In den Aufgaben 1 und 3 schreiben Sie E-Mails, in Aufgabe 2 schreiben Sie einen Diskussionsbeitrag. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf den Antwortbogen.","tasks":[{"no":1,"minutes":20,"words":80,"situation":["Sie waren am Wochenende auf einem Musikfestival. Ein Freund/Eine Freundin von Ihnen konnte leider nicht mitkommen."],"points":["Beschreiben Sie: Wie war das Festival?","Begründen Sie: Warum möchten Sie nächstes Jahr wieder hinfahren?","Machen Sie einen Vorschlag für einen gemeinsamen Konzertbesuch."],"post":null,"instruction":"Schreiben Sie eine E-Mail (circa 80 Wörter). Schreiben Sie etwas zu allen drei Punkten. Achten Sie auf den Textaufbau (Anrede, Einleitung, Reihenfolge der Inhaltspunkte, Schluss).","model":{"label":"E-Mail an eine Freundin, ca. 90 Wörter","text":"Betreff: Festival-Wochenende\n\nLiebe Ines,\n\nam Wochenende war ich auf dem Seefestival in Konstanz. Drei Tage lang gab es Musik auf zwei Bühnen direkt am Wasser, und wir haben im Zelt geschlafen. Am Samstag hat es zwar geregnet, aber die Stimmung war trotzdem super.\n\nNächstes Jahr möchte ich unbedingt wieder hinfahren, weil man dort so viele neue Bands entdeckt und sehr nette Leute kennenlernt.\n\nIm November spielt eine meiner neuen Lieblingsbands in Stuttgart. Sollen wir zusammen hingehen? Ich besorge die Karten.\n\nViele Grüße\nAna"},"typicalErrors":"Nur das Festival wird beschrieben, die Begründung fehlt · Vorschlag ohne Zeitpunkt · Sie statt du."},{"no":2,"minutes":25,"words":80,"situation":["Sie haben im Fernsehen eine Sendung zum Thema „Lebensmittel wegwerfen – muss das sein?“ gesehen. Im Online-Gästebuch der Sendung finden Sie folgende Meinung:"],"points":[],"post":{"site":"www.tv-verbraucher.de","label":"Gästebuch","author":"Gisela · 21.09. 20:41 Uhr","text":"Ich kaufe für meine Familie jede Woche viel zu viel ein, weil ich Angst habe, dass etwas fehlt. Am Ende werfe ich Brot, Joghurt und Gemüse weg, und das tut mir jedes Mal leid. Meine Nachbarin plant jede Mahlzeit vorher, aber dafür habe ich neben der Arbeit keine Zeit."},"instruction":"Schreiben Sie nun Ihre Meinung zum Thema (circa 80 Wörter).","model":{"label":"Diskussionsbeitrag, ca. 95 Wörter","text":"Gisela spricht ein Problem an, das viele Familien kennen. Ich glaube aber, man muss nicht jede Mahlzeit genau planen, um weniger wegzuwerfen. Es hilft schon, vor dem Einkaufen kurz in den Kühlschrank zu schauen und eine Liste zu schreiben.\n\nAußerdem kann man Reste am nächsten Tag essen oder einfrieren. Brot vom Vortag schmeckt geröstet noch sehr gut. In meinem Heimatland wirft man fast nie Essen weg, weil viele Menschen wenig Geld haben.\n\nIch finde, wir sollten Lebensmittel mehr schätzen – das spart am Ende auch Geld."},"typicalErrors":"Giselas Beitrag nur zusammenfassen · keine eigenen Vorschläge oder Beispiele · deutlich unter 80 Wörtern."},{"no":3,"minutes":15,"words":40,"situation":["Sie feiern am Samstagabend Ihren Geburtstag in Ihrer Wohnung. Es könnte etwas laut werden."],"points":[],"post":null,"instruction":"Schreiben Sie an Ihre Nachbarin, Frau Winter. Entschuldigen Sie sich im Voraus, informieren Sie sie über die Feier und laden Sie sie ein. Schreiben Sie eine E-Mail (circa 40 Wörter). Vergessen Sie nicht die Anrede und den Gruß am Schluss.","model":{"label":"E-Mail an die Nachbarin, ca. 45 Wörter","text":"Sehr geehrte Frau Winter,\n\nam Samstagabend feiere ich meinen Geburtstag in meiner Wohnung. Es kann etwas lauter werden, und dafür möchte ich mich schon jetzt entschuldigen. Ab 23 Uhr machen wir die Musik leiser. Wenn Sie Lust haben, kommen Sie doch gern vorbei!\n\nMit freundlichen Grüßen\nDaniel Moreno"},"typicalErrors":"Keine Einladung · Hallo Frau Winter oder Liebe Grüße · keine Entschuldigung."}]},"audio":[{"src":"Goethe%20B1%20Modelltest%208.1.mp3","dur":510.25},{"src":"Goethe%20B1%20Modelltest%208.2.mp3","dur":254.09},{"src":"Goethe%20B1%20Modelltest%208.3.mp3","dur":238.13},{"src":"Goethe%20B1%20Modelltest%208.4.mp3","dur":542.48}],"pdf":"Goethe%20B1%20Modelltest%208.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"9":{"id":9,"roman":"IX","lesen":{"t1":{"instruction":"Lesen Sie den Text und die Aufgaben 1 bis 6 dazu. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","blog":{"site":"oma-auf-zeit.de · Gisela","date":"Donnerstag, 14. November","title":"Oma auf Zeit","paragraphs":["Vor einem Jahr bin ich in Rente gegangen, und ehrlich gesagt wusste ich zuerst nicht, was ich mit meiner freien Zeit anfangen sollte. Meine eigenen Enkel leben mit meiner Tochter in Kanada; wir sehen uns höchstens einmal im Jahr. Im Wartezimmer meiner Ärztin habe ich dann einen Zettel des Familienzentrums gelesen: „Leihgroßeltern gesucht“. Angerufen habe ich erst drei Wochen später – so lange habe ich mich nicht getraut.","Im Familienzentrum habe ich dann Jasmin kennengelernt. Sie ist Krankenschwester, arbeitet im Schichtdienst und zieht ihre beiden Kinder allein groß: Noah ist fünf, Lina drei. Noah hat mir sofort sein Lieblingsauto gezeigt, die Kleine dagegen hat sich die ganze Stunde hinter ihrer Mutter versteckt. Am Ende hat Jasmin gefragt, ob ich mir das vorstellen kann. Ich konnte.","Seit Februar hole ich die beiden jeden Dienstag und Donnerstag von der Kita ab und bleibe bei ihnen, bis Jasmin nach Hause kommt. Geld wollte ich dafür nie haben, und das Familienzentrum ist sowieso dagegen. Jasmin hat aber darauf bestanden, mir wenigstens die Monatskarte für den Bus zu bezahlen.","Natürlich läuft nicht alles glatt. Im März habe ich vergessen, dass die Kita an einem Donnerstag früher schließt, und Noah und Lina haben mit einer Erzieherin auf mich gewartet. Ich hätte im Boden versinken können. Jasmin hat nur gelacht: Das passiere ihr auch ständig. Seitdem steht jeder Termin der Kita in meinem Kalender.","Inzwischen backen wir zusammen, und Lina, die mich anfangs kaum angesehen hat, klettert mir jetzt sofort auf den Schoß. Noahs Lieblingskuchen ist Marmorkuchen, den gibt es fast jede Woche. Meine Tochter in Kanada war am Anfang ein bisschen eifersüchtig, glaube ich. Mittlerweile fragt sie bei jedem Videoanruf nach „deinen Kleinen“, und Noah zeigt ihr stolz seine Bilder.","Im nächsten Sommer fliege ich für vier Wochen nach Kanada. Vier Wochen sind lang, für die Kinder und für mich. Jasmin hat aber schon eine Nachbarin gefunden, die mich in dieser Zeit vertritt. Ich habe Noah erklärt, dass ich wiederkomme. Er hat lange überlegt und dann gesagt: „Gut. Aber bring mir einen Bären mit.“"],"closing":"Eure Gisela"},"example":{"no":"0","text":"Gisela ist seit einiger Zeit nicht mehr berufstätig.","answer":"R"},"items":[{"no":"1","text":"Gisela hat sich gleich nach dem Lesen des Zettels gemeldet.","answer":"F"},{"no":"2","text":"Beim ersten Treffen hatten beide Kinder sofort Vertrauen zu Gisela.","answer":"F"},{"no":"3","text":"Jasmin übernimmt einen Teil von Giselas Ausgaben.","answer":"R"},{"no":"4","text":"Einmal mussten die Kinder in der Kita auf Gisela warten.","answer":"R"},{"no":"5","text":"Giselas Tochter findet es bis heute nicht gut, dass ihre Mutter sich um fremde Kinder kümmert.","answer":"F"},{"no":"6","text":"Während Giselas Reise übernimmt jemand anders ihre Aufgaben.","answer":"R"}]},"t2":{"texts":[{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 7 bis 9 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Das Dorf als Wirt","lead":"In Hollerbach gehört das letzte Gasthaus jetzt den Einwohnern.","paragraphs":["Als die Wirtsleute des „Goldenen Hirschen“ vor zwei Jahren in Rente gehen wollten, fand sich kein Käufer. Für Hollerbach, ein Dorf mit 900 Einwohnern im Odenwald, wäre das das Ende gewesen: Die Bäckerei hatte schon geschlossen, die Bankfiliale auch. „Ohne Gasthaus gibt es keinen Ort mehr, an dem man sich trifft“, sagt Bürgermeisterin Karin Weidner. Deshalb gründeten die Bewohner eine Genossenschaft. Wer mitmachen will, kauft mindestens einen Anteil für 500 Euro. Inzwischen gehört das Gasthaus 340 Mitgliedern, darunter auch ehemalige Hollerbacher, die längst in Frankfurt oder Hamburg leben. Mit dem Geld wurden die Küche erneuert und die Toiletten barrierefrei umgebaut. Den Rest haben viele Mitglieder selbst erledigt: Sie haben gestrichen, Böden verlegt und den Biergarten neu angelegt. Gekocht wird von einem angestellten Koch; bedient werden die Gäste aber vor allem von Freiwilligen aus dem Dorf, die sich in einen Plan eintragen. Bezahlt werden sie nicht, dafür bekommen sie an ihrem Abend ein kostenloses Essen. Geöffnet ist von Mittwoch bis Sonntag. Donnerstags treffen sich mittags die älteren Bewohner zum Seniorenessen, freitags ist Stammtisch. Reich wird mit dem Gasthaus niemand: Was am Jahresende übrig bleibt, wird in das Haus investiert; Gewinne werden nicht ausgezahlt. Schwierig ist im Moment nur die Suche nach Helfern für die Wochenenden, an denen viele Freiwillige selbst unterwegs sind. Im Frühjahr soll deshalb eine zweite Kraft für den Service fest angestellt werden."],"footnote":"","source":"aus einer deutschen Zeitung","example":{"no":"0","stem":"Die früheren Wirtsleute …","options":{"a":"haben das Gasthaus an die Gemeinde verkauft.","b":"wollten mit dem Arbeiten aufhören.","c":"leben heute in Frankfurt."},"answer":"b"},"items":[{"no":"7","stem":"In diesem Text geht es um …","options":{"a":"ein Dorf, in dem es keine Geschäfte mehr gibt.","b":"eine Bürgermeisterin, die ein altes Gasthaus gekauft hat.","c":"Bewohner, die gemeinsam ihr Gasthaus weiterführen."},"answer":"c"},{"no":"8","stem":"Im Gasthaus …","options":{"a":"arbeiten ausschließlich bezahlte Angestellte.","b":"bedienen Dorfbewohner, ohne Lohn zu bekommen.","c":"kochen die Mitglieder der Genossenschaft abwechselnd."},"answer":"b"},{"no":"9","stem":"Das Geld, das am Ende des Jahres übrig bleibt, …","options":{"a":"bekommen die freiwilligen Helferinnen und Helfer.","b":"wird unter den Mitgliedern verteilt.","c":"fließt wieder zurück in das Gasthaus."},"answer":"c"}]},{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 10 bis 12 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Wenn um Mitternacht das Licht ausgeht","lead":"In der steirischen Gemeinde Gamsbach bleiben die Straßenlaternen nachts aus.","paragraphs":["Seit Jänner* ist es in Gamsbach nachts wirklich dunkel: Um Mitternacht gehen in der steirischen Gemeinde alle Straßenlaternen aus, erst um fünf Uhr früh werden sie wieder eingeschaltet. Der wichtigste Grund ist das Geld. Die Stromkosten der Gemeinde haben sich in den letzten Jahren fast verdoppelt, und durch die Abschaltung spart Gamsbach rund 18.000 Euro im Jahr. „Davon können wir den Kindergartenbus ein ganzes Jahr bezahlen“, sagt Bürgermeister Franz Leitner. Auch für die Natur sei die Dunkelheit gut: Weniger Licht bedeutet weniger tote Insekten, und Vögel und Fledermäuse finden sich besser zurecht. Nicht alle Bewohner waren von Anfang an begeistert. Vor allem ältere Frauen hatten Angst, nachts allein nach Hause zu gehen. Bei einer Bürgerversammlung im Herbst gab es deshalb heftige Diskussionen, und einige Bewohner sammelten Unterschriften gegen die Pläne. Die Polizei kann allerdings keinen Anstieg von Einbrüchen oder Überfällen feststellen. Für Schichtarbeiter, die nach Mitternacht vom Bahnhof kommen, gibt es eine Ausnahme: Die Straße vom Bahnhof ins Zentrum bleibt beleuchtet. Außerdem verteilt die Gemeinde kostenlos Stirnlampen; über 300 Stück wurden bereits abgeholt. Mit der Dunkelheit kommen inzwischen sogar Gäste: Hobby-Astronomen reisen an, um den Sternenhimmel zu beobachten, und ein Gasthof bietet schon geführte „Sternwanderungen“ an. Ab dem Sommer werden die alten Laternen nach und nach durch sparsame LED-Lampen ersetzt. An der nächtlichen Abschaltung ändert das aber nichts."],"footnote":"*Jänner = österreichischer Standard für „Januar“","source":"aus einer österreichischen Zeitung","example":null,"items":[{"no":"10","stem":"In diesem Text geht es um …","options":{"a":"eine Gemeinde, die neue Straßenlampen gekauft hat.","b":"einen Ort, der nachts auf Straßenlicht verzichtet.","c":"Bewohner, die sich nachts nicht mehr allein auf die Straße trauen."},"answer":"b"},{"no":"11","stem":"Wer nachts mit dem Zug ankommt, …","options":{"a":"findet auf dem Weg ins Zentrum genug Licht.","b":"muss sich selbst eine Stirnlampe kaufen.","c":"wird von der Polizei bis nach Hause begleitet."},"answer":"a"},{"no":"12","stem":"Die Dunkelheit …","options":{"a":"hat zu mehr Einbrüchen im Ort geführt.","b":"soll durch die LED-Lampen bald wieder enden.","c":"lockt neue Besucher an."},"answer":"c"}]}]},"t3":{"instruction":"Lesen Sie die Situationen 13 bis 19 und die Anzeigen a bis j aus verschiedenen deutschsprachigen Medien. Wählen Sie: Welche Anzeige passt zu welcher Situation? Sie können jede Anzeige nur einmal verwenden. Die Anzeige aus dem Beispiel können Sie nicht mehr verwenden. Für eine Situation gibt es keine passende Anzeige. In diesem Fall schreiben Sie 0.","context":"Einige Ihrer Bekannten möchten essen gehen oder suchen ein Angebot rund ums Essen.","example":{"no":"0","text":"Familie Weber möchte am Sonntagvormittag gemütlich und lange frühstücken gehen.","answer":"b"},"items":[{"no":"13","text":"Frau Lindner feiert ihren 70. Geburtstag mit 40 Gästen im Gemeindehaus. Kochen möchte sie an diesem Tag nicht.","answer":"d"},{"no":"14","text":"Familie Arslan möchte am Wochenende essen gehen. Ihr Sohn ist zwei und kann nicht lange still sitzen.","answer":"a"},{"no":"15","text":"Paul hat bis 23 Uhr Dienst im Krankenhaus. Danach möchte er gern noch irgendwo eine warme Mahlzeit essen.","answer":"0"},{"no":"16","text":"Sandra lebt vegan und sucht für ein Abendessen mit Freunden ein Lokal, in dem sie alles auf der Karte essen kann.","answer":"f"},{"no":"17","text":"Herr Takahashi kocht gern und möchte lernen, wie man Nudeln selbst herstellt.","answer":"c"},{"no":"18","text":"Herr Novak hat mittags nur eine halbe Stunde Pause und will in dieser Zeit etwas Warmes essen.","answer":"e"},{"no":"19","text":"Nina möchte ihrem Freund einen besonderen Abend schenken: Ein Profi soll für die beiden bei ihnen zu Hause kochen.","answer":"g"}],"ads":[{"letter":"a","design":"chalk","header":"","tag":"","title":"Gasthaus Zwergenland","subtitle":"DAS FAMILIENRESTAURANT","facts":[],"body":["Bei uns dürfen Kinder laut sein! Im großen Spielzimmer mit Rutsche und Bällebad kümmert sich am Wochenende eine Erzieherin um die Kleinen ab zwei Jahren – die Eltern essen in Ruhe. Kinderteller ab 4,90 €."],"footer":"Sa + So 11–20 Uhr · Am Mühlbach 2"},{"letter":"b","design":"rules","header":"CAFÉ MORGENROT","tag":"","title":"Sonntags-Brunch","subtitle":"","facts":[],"body":["Jeden Sonntag von 9 bis 14 Uhr: großes Buffet mit frischen Brötchen, Eierspeisen, Obst und hausgemachtem Kuchen – so lange Sie möchten. Kaffee und Tee sind inklusive."],"footer":"19,50 € · Reservierung: 0421 / 55 12 80"},{"letter":"c","design":"dashed","header":"Trattoria Da Lucia","tag":"","title":"PASTA-KURS","subtitle":"","facts":[],"body":["Jeden zweiten Samstag zeigt Lucia Ihnen in unserer Küche, wie aus Mehl und Eiern Tagliatelle und Ravioli werden. Danach essen wir gemeinsam."],"footer":"3 Stunden · 69 € · Anmeldung im Lokal"},{"letter":"d","design":"corp","header":"","tag":"","title":"Partyservice Tafelfreuden","subtitle":"SIE FEIERN – WIR KOCHEN","facts":[],"body":["Warmes Buffet für Feiern ab 20 Personen, geliefert an jeden Ort in der Region. Geschirr und Besteck bringen wir mit. Bitte mindestens zwei Wochen vorher bestellen."],"footer":"tafelfreuden.de"},{"letter":"e","design":"bignum","header":"","tag":"10 MIN","title":"Mittagstisch im Bistro Takt","subtitle":"MO–FR 11.30 – 14.30 UHR","facts":[],"body":["Täglich zwei warme Gerichte zur Wahl. Ihr Essen steht spätestens zehn Minuten nach der Bestellung auf dem Tisch – sonst ist der Kaffee gratis."],"footer":"Menü 8,50 € · Lindenstraße 14"},{"letter":"f","design":"barhead","header":"","tag":"","title":"Grünkern","subtitle":"VEGAN ESSEN","facts":[],"body":["Bei uns kommen weder Fleisch noch Fisch, Milch oder Eier auf den Teller – alles ist rein pflanzlich. Abendkarte Dienstag bis Samstag, 18 bis 22 Uhr. Für Gruppen ab sechs Personen bitte reservieren."],"footer":""},{"letter":"g","design":"pinned","header":"","tag":"","title":"Der Koch kommt zu Ihnen","subtitle":"","facts":[],"body":["Ich kaufe ein, koche in Ihrer Küche ein Menü mit drei oder vier Gängen und räume hinterher auf – für zwei bis zwölf Personen. Auch als Geschenkgutschein."],"footer":"Marco Behrens · 0170 / 22 33 44"},{"letter":"h","design":"sign","header":"","tag":"","title":"RODEO","subtitle":"STEAKHOUSE · FREITAGS LIVE-MUSIK","facts":[],"body":["Steaks vom Grill, Burger und Spareribs – für alle, die Fleisch lieben. Dienstag bis Sonntag ab 17 Uhr, warme Küche bis 22.30 Uhr."],"footer":""},{"letter":"i","design":"ticket","header":"","tag":"","title":"FOOD-TRUCK-FESTIVAL","subtitle":"SA, 7. JUNI · MESSEPLATZ","facts":[],"body":["20 Food Trucks mit Burgern, Tacos, Currys und Crêpes. Von 12 bis 23 Uhr, Eintritt frei. Sitzplätze unter Zelten sind vorhanden."],"footer":""},{"letter":"j","design":"hotel","header":"WEINBAR","tag":"","title":"Rebe","subtitle":"","facts":[],"body":["Über 100 Weine aus Europa, dazu Käse, Schinken und Oliven. Warme Küche gibt es bei uns nicht. Mittwoch bis Samstag, 19 bis 2 Uhr."],"footer":"Marktgasse 5"}]},"t4":{"instruction":"Lesen Sie die Texte 20 bis 26. Wählen Sie: Ist die Person für ein Pflichtjahr für junge Menschen, Ja oder Nein?","context":"In einer Zeitschrift lesen Sie Kommentare zu einem Artikel über den Vorschlag, dass alle jungen Menschen nach der Schule ein Jahr lang einen sozialen Dienst leisten sollen.","header":"LESERKOMMENTARE","site":"www.junge-stimmen.de/forum","example":{"no":"0","name":"Paula","byline":"Paula, 19, Freiburg","text":"Ich mache gerade ein Freiwilliges Soziales Jahr in einem Kindergarten, und es ist das beste Jahr meines Lebens – aber genau deshalb, weil ich es mir selbst ausgesucht habe. Wer gezwungen wird, kommt jeden Morgen schlecht gelaunt zur Arbeit. Davon haben weder die Kinder noch die Erzieherinnen etwas. Helfen muss man wirklich wollen, sonst funktioniert es nicht.","answer":"N"},"items":[{"no":"20","name":"Leonie","byline":"Leonie, 18, Bremen","text":"Ich verstehe ja, dass Krankenhäuser und Altenheime dringend Personal brauchen, und ich finde soziales Engagement wichtig. Trotzdem: Ich habe gerade Abitur gemacht und einen Studienplatz in Medizin bekommen, auf den ich zwei Jahre gewartet habe. Ein Jahr Pause würde mich einfach zurückwerfen. Der Staat sollte lieber dafür sorgen, dass Pflegekräfte endlich besser bezahlt werden und gern in ihrem Beruf bleiben.","answer":"N"},{"no":"21","name":"Ursula","byline":"Ursula, 58, Erfurt","text":"Ich leite seit zwanzig Jahren ein Altenheim. Jedes Jahr kommen einige Freiwillige zu uns, und ich sehe, wie sie sich verändern: Am Anfang sind sie unsicher, nach ein paar Monaten unterhalten sie sich ganz selbstverständlich mit Menschen, die ihre Großeltern sein könnten. Diese Erfahrung sollte niemand verpassen. Ein Jahr für die Gemeinschaft ist nicht zu viel verlangt.","answer":"J"},{"no":"22","name":"Dirk","byline":"Dirk, 49, Wiesbaden","text":"Als mein Sohn nach der Schule ein freiwilliges Jahr beim Rettungsdienst machen wollte, war ich dagegen. Ich dachte, er verliert nur Zeit. Heute weiß er, was er beruflich will, ist selbstständiger geworden und hat Freunde aus ganz anderen Kreisen. Seitdem sehe ich das anders: Ich fände es richtig, wenn alle jungen Leute so ein Jahr machen müssten.","answer":"J"},{"no":"23","name":"Mehmet","byline":"Mehmet, 24, Duisburg","text":"Ich wäre sofort dafür, wenn die jungen Leute einen richtigen Lohn bekämen, von dem sie auch leben können. Laut dem Artikel ist aber nur ein Taschengeld von 400 Euro im Monat geplant. Wer nicht mehr bei den Eltern wohnen kann, zahlt davon nicht einmal die Miete. So, wie es jetzt aussieht, halte ich nichts von der Idee.","answer":"N"},{"no":"24","name":"Tim","byline":"Tim, 31, Zürich","text":"Statt die Jugendlichen zu zwingen, sollte man das freiwillige Jahr endlich attraktiver machen: mehr Geld, ein kostenloses Ticket für Bus und Bahn und Pluspunkte bei der Bewerbung um einen Studienplatz. Dann würden sich viel mehr junge Menschen von selbst melden. Mit Druck erreicht man bei Jugendlichen meistens das Gegenteil – das habe ich als Jugendtrainer oft genug erlebt.","answer":"N"},{"no":"25","name":"Christa","byline":"Christa, 66, Linz","text":"Meine Enkel finden die Idee furchtbar, und meine Tochter sagt, man dürfe jungen Leuten nicht ein ganzes Jahr wegnehmen. Ich sehe das ganz anders. Ich habe in meiner Jugend ein Jahr lang in einem Krankenhaus ausgeholfen und dort mehr fürs Leben gelernt als in der Schule. Dass bald alle so eine Erfahrung machen sollen, begrüße ich sehr.","answer":"J"},{"no":"26","name":"Gabi","byline":"Gabi, 53, Rostock","text":"Junge Menschen haben heute ohnehin sehr viel Druck: Schule, Prüfungen, die Suche nach einer Ausbildung und nach einer bezahlbaren Wohnung. Jetzt will man ihnen auch noch vorschreiben, wie sie ein ganzes Jahr ihres Lebens verbringen sollen. Ich musste so etwas in meiner Jugend zum Glück auch nicht machen. Ob man sich engagiert, sollte jeder selbst entscheiden dürfen.","answer":"N"}]},"t5":{"instruction":"Lesen Sie die Aufgaben 27 bis 30 und den Text dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","context":"Sie möchten an der Volkshochschule einen Kurs besuchen und lesen die Teilnahmebedingungen.","doc":{"title":"TEILNAHMEBEDINGUNGEN · VOLKSHOCHSCHULE LINDENBERG","intro":"","sections":[{"heading":"Anmeldung","text":"Sie können sich online, telefonisch oder persönlich in unserer Geschäftsstelle anmelden, am besten spätestens zwei Wochen vor Kursbeginn. Die Anmeldung ist verbindlich. Eine schriftliche Bestätigung verschicken wir nicht; wir melden uns nur, wenn ein Kurs ausfällt oder sich etwas ändert."},{"heading":"Gebühren","text":"Die Kursgebühr wird eine Woche vor Kursbeginn von Ihrem Konto abgebucht. Schülerinnen und Schüler, Studierende und Arbeitsuchende erhalten mit einem gültigen Nachweis 50 Prozent Ermäßigung. Für Material wie Bücher oder Lebensmittel in Kochkursen kann eine zusätzliche Gebühr anfallen. Eine Ermäßigung muss bei der Anmeldung beantragt werden; nachträglich ist das nicht möglich."},{"heading":"Mindestzahl","text":"Ein Kurs findet nur statt, wenn sich mindestens acht Personen angemeldet haben. Muss ein Kurs abgesagt werden, erstatten wir die volle Gebühr."},{"heading":"Abmeldung","text":"Bis sieben Tage vor Kursbeginn können Sie sich kostenlos abmelden. Danach müssen Sie die volle Gebühr bezahlen, es sei denn, Sie nennen uns eine Person, die Ihren Platz übernimmt. Die Abmeldung muss schriftlich oder per E-Mail erfolgen."},{"heading":"Unterrichtsausfall","text":"Fällt eine Kursstunde wegen Krankheit der Kursleitung aus, wird sie nachgeholt. Stunden, die Sie selbst versäumen, werden nicht erstattet. Über Änderungen informieren wir Sie per SMS oder E-Mail."},{"heading":"Kursort","text":"Die meisten Kurse finden im Bildungszentrum am Marktplatz statt. Dort gibt es nur wenige Parkplätze; bitte kommen Sie möglichst mit dem Bus oder dem Fahrrad."},{"heading":"Bescheinigung","text":"Eine Teilnahmebescheinigung erhalten Sie kostenlos, wenn Sie mindestens 80 Prozent der Kursstunden besucht haben."},{"heading":"Hausordnung","text":"Essen ist in unseren Räumen nur in der Cafeteria erlaubt. Kinder dürfen leider nicht in den Unterricht mitgebracht werden."}],"footer":""},"example":null,"items":[{"no":"27","stem":"Nach der Anmeldung …","options":{"a":"bekommt man eine Bestätigung per Post.","b":"muss man die Gebühr sofort bezahlen.","c":"hört man nur bei Änderungen etwas."},"answer":"c"},{"no":"28","stem":"Wer sich fünf Tage vor Kursbeginn abmeldet, …","options":{"a":"kann eine andere Person schicken.","b":"bekommt die halbe Gebühr zurück.","c":"muss für den Kurs nichts mehr bezahlen."},"answer":"a"},{"no":"29","stem":"Wenn die Kursleiterin krank ist, …","options":{"a":"bekommen alle einen Teil der Gebühr zurück.","b":"wird die Stunde verschoben.","c":"fällt der ganze Kurs ersatzlos aus."},"answer":"b"},{"no":"30","stem":"Eine Teilnahmebescheinigung …","options":{"a":"ist nicht kostenlos.","b":"gibt es nur nach einer bestandenen Prüfung.","c":"bekommt, wer selten gefehlt hat."},"answer":"c"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.","readNote":"Lesen Sie zuerst das Beispiel. Dazu haben Sie 10 Sekunden Zeit.","example":[{"no":"01","type":"rf","text":"Frau Petersens Termin am Donnerstag fällt aus.","answer":"R"},{"no":"02","type":"abc","stem":"Frau Petersen soll …","options":{"a":"sich telefonisch melden.","b":"am Freitag vorbeikommen.","c":"eine andere Friseurin wählen."},"answer":"a"}],"texts":[{"label":"Text 1","items":[{"no":"1","type":"rf","text":"Die Kinder können heute Abend wie geplant ans Lagerfeuer kommen.","answer":"F"},{"no":"2","type":"abc","stem":"Gäste mit kleinen Zelten …","options":{"a":"sollen ihr Zelt abbauen und nach Hause fahren.","b":"dürfen an einem anderen Ort übernachten.","c":"bekommen an der Rezeption ein neues Zelt."},"answer":"b"}]},{"label":"Text 2","items":[{"no":"3","type":"rf","text":"Der Umzug beginnt früher als zuerst geplant.","answer":"R"},{"no":"4","type":"abc","stem":"Tarek soll …","options":{"a":"Essen mitbringen.","b":"direkt zur neuen Wohnung kommen.","c":"ein Werkzeug mitnehmen."},"answer":"c"}]},{"label":"Text 3","items":[{"no":"5","type":"rf","text":"Im Sommer fehlt es den Krankenhäusern oft an Blut.","answer":"R"},{"no":"6","type":"abc","stem":"Wer zum ersten Mal Blut spenden möchte, …","options":{"a":"darf nicht über 64 sein.","b":"muss vorher auf das Frühstück verzichten.","c":"braucht eine Bescheinigung vom Arzt."},"answer":"a"}]},{"label":"Text 4","items":[{"no":"7","type":"rf","text":"Die Eltern von Jonas sollen ins Restaurant kommen.","answer":"F"},{"no":"8","type":"abc","stem":"Heute …","options":{"a":"bekommen alle Kunden Rabatt auf Lampen.","b":"ist das Restaurant den ganzen Tag geschlossen.","c":"kann man nachmittags noch Kuchen essen."},"answer":"c"}]},{"label":"Text 5","items":[{"no":"9","type":"rf","text":"Herr Lorenz fliegt am 3. Mai früher als geplant.","answer":"F"},{"no":"10","type":"abc","stem":"Die Reiseunterlagen …","options":{"a":"muss Herr Lorenz persönlich im Büro abholen.","b":"kann Herr Lorenz auch per Mail bekommen.","c":"kosten eine zusätzliche Gebühr."},"answer":"b"}]}]},"t2":{"instruction":"Sie hören nun einen Text. Sie hören den Text einmal. Dazu lösen Sie fünf Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","readNote":"Lesen Sie jetzt die Aufgaben 11 bis 15. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie wohnen in einem Mehrfamilienhaus. Bei einer Mieterversammlung informiert Herr Kraft von der Hausverwaltung über die Renovierung des Hauses.","items":[{"no":"11","stem":"Das Gerüst …","options":{"a":"wird nur für die neuen Fenster aufgestellt.","b":"steht mehrere Monate am Haus.","c":"wird im Juli abgebaut."},"answer":"b"},{"no":"12","stem":"Den Termin für die neuen Fenster …","options":{"a":"erfahren die Mieter vorher schriftlich.","b":"können sich die Mieter selbst aussuchen und ändern.","c":"vereinbart jeder Mieter direkt mit dem Hausmeister."},"answer":"a"},{"no":"13","stem":"Für die Monate Juli und August …","options":{"a":"müssen die Mieter einen Antrag stellen.","b":"steigt die Miete um 40 Euro.","c":"zahlen die Mieter weniger Miete."},"answer":"c"},{"no":"14","stem":"Nach der Renovierung …","options":{"a":"wird die Wohnung etwas teurer.","b":"bleibt die Miete so hoch wie vorher.","c":"steigen die Heizkosten."},"answer":"a"},{"no":"15","stem":"Wer ein Auto hat, …","options":{"a":"kann auf dem Hof parken.","b":"muss sich in der Nähe einen Parkplatz mieten.","c":"parkt gratis in einer anderen Straße."},"answer":"c"}]},"t3":{"instruction":"Sie hören nun ein Gespräch. Sie hören das Gespräch einmal. Dazu lösen Sie sieben Aufgaben. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","readNote":"Lesen Sie jetzt die Aufgaben 16 bis 22. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie sind auf einer Geburtstagsfeier und hören, wie sich zwei Gäste, Katja und Ömer, unterhalten.","items":[{"no":"16","text":"Katja hat ihren Beruf gewechselt, weil ihr die Arbeit im Büro keinen Spaß mehr gemacht hat.","answer":"F"},{"no":"17","text":"Während der Ausbildung hatte Katja kein Einkommen.","answer":"F"},{"no":"18","text":"Vor ihrer ersten Fahrt allein war Katja sehr nervös.","answer":"R"},{"no":"19","text":"Katja findet das Fahren schwieriger als die Arbeitszeiten.","answer":"F"},{"no":"20","text":"Ömer und sein Bruder haben ihren Imbisswagen selbst eingerichtet.","answer":"R"},{"no":"21","text":"Am Anfang lief das Geschäft mit dem Imbisswagen schlecht.","answer":"R"},{"no":"22","text":"Ömer will bald nur noch mit dem Imbisswagen arbeiten.","answer":"F"}]},"t4":{"instruction":"Sie hören nun eine Diskussion. Sie hören die Diskussion zweimal. Dazu lösen Sie acht Aufgaben. Ordnen Sie die Aussagen zu: Wer sagt was?","readNote":"Lesen Sie jetzt die Aussagen 23 bis 30. Dazu haben Sie 60 Sekunden Zeit.","context":"Die Moderatorin der Radiosendung „Standpunkte“ diskutiert mit Sabine Krüger, Geschäftsführerin eines Regionalflughafens, und dem Verkehrsexperten Jonas Ebert von einem Umweltverband über die Frage: „Sollen Kurzstreckenflüge verboten werden?“","speakers":{"a":"Moderatorin","b":"Sabine Krüger","c":"Jonas Ebert"},"example":{"no":"0","text":"Schon seit Längerem wird gefordert, kurze Flüge zu verbieten.","answer":"a"},"items":[{"no":"23","text":"Für manche Reisende gibt es zum Flugzeug keine gute Alternative.","answer":"b"},{"no":"24","text":"Wenn man alle Zeiten zusammenrechnet, ist der Zug auf manchen Strecken schneller.","answer":"c"},{"no":"25","text":"Im Zug kann man unterwegs besser arbeiten als im Flugzeug.","answer":"c"},{"no":"26","text":"In einem anderen Land gibt es ein solches Verbot bereits.","answer":"a"},{"no":"27","text":"Ein Verbot würde Arbeitsplätze in der Region gefährden.","answer":"b"},{"no":"28","text":"Bahnfahren müsste billiger werden.","answer":"c"},{"no":"29","text":"Die Luftfahrt bemüht sich selbst um mehr Umweltschutz.","answer":"b"},{"no":"30","text":"Inzwischen fliegen viel weniger Menschen innerhalb Deutschlands als vor einigen Jahren.","answer":"a"}]}},"schreiben":{"intro":"Das Modul Schreiben besteht aus drei Teilen. In den Aufgaben 1 und 3 schreiben Sie E-Mails, in Aufgabe 2 schreiben Sie einen Diskussionsbeitrag. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf den Antwortbogen.","tasks":[{"no":1,"minutes":20,"words":80,"situation":["Sie haben am Sonntag zum ersten Mal an einem Halbmarathon teilgenommen. Ein Freund/Eine Freundin von Ihnen möchte wissen, wie es war."],"points":["Beschreiben Sie: Wie war der Lauf?","Begründen Sie: Warum haben Sie mitgemacht?","Machen Sie einen Vorschlag für ein gemeinsames Training."],"post":null,"instruction":"Schreiben Sie eine E-Mail (circa 80 Wörter). Schreiben Sie etwas zu allen drei Punkten. Achten Sie auf den Textaufbau (Anrede, Einleitung, Reihenfolge der Inhaltspunkte, Schluss).","model":{"label":"E-Mail an eine Freundin, ca. 90 Wörter","text":"Betreff: Mein erster Halbmarathon!\n\nLiebe Anna,\n\nam Sonntag bin ich meinen ersten Halbmarathon gelaufen! Die Strecke führte am Rhein entlang und durch die Altstadt. Bei Kilometer 15 taten mir die Beine so weh, dass ich fast aufgehört hätte. Nach zwei Stunden und zehn Minuten war ich im Ziel – total müde, aber glücklich.\n\nMitgemacht habe ich, weil ich nach meiner Knieoperation wieder fit werden wollte. Außerdem wollte ich mir selbst zeigen, dass ich das schaffe.\n\nHast du Lust, mit mir zu trainieren? Wir könnten jeden Samstagmorgen zusammen im Park laufen.\n\nLiebe Grüße\nLuca"},"typicalErrors":"Der Lauf wird beschrieben, aber der Grund fehlt · Vorschlag ohne Zeitpunkt · Sie statt du."},{"no":2,"minutes":25,"words":80,"situation":["Sie haben im Fernsehen eine Diskussionssendung zum Thema „Hunde am Arbeitsplatz – eine gute Idee?“ gesehen. Im Online-Gästebuch der Sendung finden Sie folgende Meinung:"],"points":[],"post":{"site":"www.tv-arbeitswelt.de","label":"Gästebuch","author":"Carina · 12.09. 20:41 Uhr","text":"In unserer Firma dürfen alle ihren Hund mit ins Büro bringen. Ich finde das super: Die Stimmung ist viel entspannter, und mittags gehen wir zusammen spazieren. Ein Kollege hat allerdings eine Hundeallergie und arbeitet jetzt meistens im Homeoffice. Das ist doch auch keine Lösung."},"instruction":"Schreiben Sie nun Ihre Meinung zum Thema (circa 80 Wörter).","model":{"label":"Diskussionsbeitrag, ca. 95 Wörter","text":"Carina spricht ein interessantes Thema an. Ich kann verstehen, dass ein Hund im Büro die Stimmung verbessert. Viele Menschen sind entspannter, wenn ein Tier in der Nähe ist, und gemeinsame Spaziergänge sind gut für das Team.\n\nTrotzdem bin ich eher dagegen. Nicht alle mögen Hunde, manche haben Angst oder eine Allergie wie Carinas Kollege. Es ist nicht fair, wenn diese Menschen deshalb zu Hause arbeiten müssen.\n\nVielleicht wäre es eine Lösung, Hunde nur in bestimmten Räumen zu erlauben. So könnten alle zufrieden sein."},"typicalErrors":"Carinas Beitrag nur zusammenfassen, statt eine eigene Meinung zu schreiben · keine Beispiele · deutlich unter 80 Wörtern."},{"no":3,"minutes":15,"words":40,"situation":["Ihre Nachbarin, Frau Roth, ist im Urlaub. Sie haben versprochen, zwei Wochen lang ihre Blumen zu gießen. Jetzt müssen Sie aber für ein paar Tage dringend verreisen."],"points":[],"post":null,"instruction":"Schreiben Sie an Frau Roth. Entschuldigen Sie sich höflich, erklären Sie die Situation und machen Sie einen Vorschlag. Schreiben Sie eine E-Mail (circa 40 Wörter). Vergessen Sie nicht die Anrede und den Gruß am Schluss.","model":{"label":"E-Mail an die Nachbarin, ca. 50 Wörter","text":"Sehr geehrte Frau Roth,\n\nleider muss ich morgen für vier Tage zu meiner Mutter fahren, weil sie krank ist. Es tut mir sehr leid, dass ich Ihre Blumen in dieser Zeit nicht gießen kann. Meine Freundin, Frau Ilić, würde das gern übernehmen. Darf ich ihr Ihren Schlüssel geben?\n\nMit freundlichen Grüßen\nDaniel Weber"},"typicalErrors":"Kein Vorschlag, wer die Blumen gießt · Hallo Frau Roth oder Liebe Grüße · keine Entschuldigung."}]},"audio":[{"src":"Goethe%20B1%20Modelltest%209.1.mp3","dur":553.61},{"src":"Goethe%20B1%20Modelltest%209.2.mp3","dur":263.42},{"src":"Goethe%20B1%20Modelltest%209.3.mp3","dur":232.49},{"src":"Goethe%20B1%20Modelltest%209.4.mp3","dur":573.31}],"pdf":"Goethe%20B1%20Modelltest%209.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"10":{"id":10,"roman":"X","lesen":{"t1":{"instruction":"Lesen Sie den Text und die Aufgaben 1 bis 6 dazu. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","blog":{"site":"wieder-auf-den-beinen.de · Helmut","date":"Sonntag, 23. März","title":"Neues Knie mit 61","paragraphs":["Zwei Jahre lang habe ich die Schmerzen ignoriert. Erst konnte ich nicht mehr wandern, dann kaum noch Treppen steigen. Meine Frau hat mich schließlich zum Orthopäden geschickt – oder besser gesagt: Sie hat den Termin gemacht und mich hingefahren. Die Diagnose war eindeutig: Das rechte Knie war völlig kaputt, ich brauchte ein künstliches Gelenk.","Vor der Operation hatte ich mehr Angst als vor jeder Prüfung meines Lebens. Mein Nachbar, der vor drei Jahren die gleiche Operation hatte, hat mir Mut gemacht. „Am zweiten Tag läufst du schon über den Flur“, hat er gesagt. Trotzdem habe ich in der Nacht davor kaum geschlafen. Er hatte übrigens recht – allerdings mit Krücken und sehr, sehr langsam.","Nach einer Woche im Krankenhaus ging es für drei Wochen in eine Reha-Klinik im Schwarzwald. Eigentlich hätte ich lieber eine ambulante Reha in der Nähe gemacht, um abends zu Hause zu sein, aber dafür hätte ich jeden Tag mit dem Taxi fahren müssen. Im Nachhinein bin ich froh: In der Klinik hatte ich jeden Tag Physiotherapie, Training im Wasser und Zeit, mich nur um mein Knie zu kümmern.","Am schwierigsten war nicht der Schmerz, sondern die Geduld. Ich wollte jeden Tag Fortschritte sehen, und manchmal ging es zwei Tage lang gar nicht weiter. Dann war ich schlecht gelaunt und habe mit niemandem gesprochen. In solchen Momenten hat meine Physiotherapeutin Jana nur gesagt: „Ihr Knie ist nicht im Urlaub, es arbeitet.“","Jetzt bin ich seit vier Wochen wieder zu Hause. Die Krücken stehen in der Ecke, nur für längere Wege nehme ich noch eine mit. Treppen steige ich langsam, aber ohne Schmerzen. Autofahren darf ich erst nach der nächsten Kontrolle beim Arzt, deshalb fährt mich meine Frau zweimal pro Woche zur Physiotherapie.","Und das Wandern? Im Mai möchte ich mit meinem Wanderverein wieder mitgehen, zuerst nur die kurze Runde von acht Kilometern. Die große Alpentour im Sommer lasse ich dieses Jahr aus. Das tut weh, aber nicht so sehr wie mein altes Knie. Meine Wanderfreunde haben mir schon eine Karte geschrieben: Sie warten auf mich."],"closing":"Euer Helmut"},"example":{"no":"0","text":"Helmut hatte lange Zeit Probleme mit seinem Knie.","answer":"R"},"items":[{"no":"1","text":"Den Termin beim Orthopäden hat nicht Helmut selbst vereinbart.","answer":"R"},{"no":"2","text":"Ein Bekannter hatte die gleiche Operation schon hinter sich.","answer":"R"},{"no":"3","text":"Helmut wollte die Reha unbedingt in einer Klinik machen.","answer":"F"},{"no":"4","text":"In der Reha waren die Schmerzen für Helmut das größte Problem.","answer":"F"},{"no":"5","text":"Helmut fährt inzwischen wieder selbst mit dem Auto zur Physiotherapie.","answer":"F"},{"no":"6","text":"Helmut wird in diesem Jahr auf eine längere Tour verzichten.","answer":"R"}]},"t2":{"texts":[{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 7 bis 9 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Ein Baum für jedes Baby","lead":"In Mittelbach pflanzt die Stadt für jedes neugeborene Kind einen Baum.","paragraphs":["Wenn in Mittelbach ein Kind zur Welt kommt, bekommen die Eltern seit drei Jahren nicht nur Glückwünsche vom Bürgermeister, sondern auch einen Brief mit einer besonderen Einladung: Im Herbst dürfen sie für ihr Kind einen Baum pflanzen. Etwa 600 Babys werden in der Stadt jedes Jahr geboren, entsprechend viele junge Bäume kommen dazu. Gepflanzt wird auf einer ehemaligen Wiese am Stadtrand, die inzwischen „Geburtswald“ heißt. Jeder Baum trägt ein kleines Schild mit dem Vornamen und dem Geburtsjahr des Kindes. Die Kosten von rund 80 Euro pro Baum übernimmt die Stadt; wer möchte, kann mit einer Spende helfen. Welche Baumart gepflanzt wird, entscheiden die Förster, denn nicht jeder Baum verträgt die immer trockeneren Sommer. „Am Anfang wollten viele Eltern Apfelbäume“, erzählt Förster Jens Hollmann. „Die passen hier aber nicht.“ Die größte Sorge sind die heißen Monate: Im letzten Sommer sind fast hundert junge Bäume vertrocknet. Seitdem gießen Freiwillige, oft die Familien selbst, die jungen Bäume nach einem festen Plan. Geht ein Baum trotzdem ein, wird er im nächsten Herbst kostenlos ersetzt. Für viele Eltern ist der Wald längst mehr als ein Umweltprojekt: Am Wochenende sieht man dort Familien beim Picknick, und Großeltern fotografieren ihre Enkel neben „ihrem“ Baum. Die Stadt plant nun einen Rundweg mit Bänken – und überlegt, das Angebot auf Kinder auszuweiten, die neu nach Mittelbach ziehen."],"footnote":"","source":"aus einer deutschen Zeitung","example":{"no":"0","stem":"Die Eltern eines neugeborenen Kindes …","options":{"a":"bekommen vom Bürgermeister einen Baum geschenkt.","b":"werden zu einer Pflanzaktion eingeladen.","c":"müssen für den Baum eine Gebühr zahlen."},"answer":"b"},"items":[{"no":"7","stem":"In diesem Text geht es um …","options":{"a":"einen Förster, der in einem trockenen Wald neue Baumarten testet.","b":"eine Stadt, die für jedes neue Kind einen Baum pflanzt.","c":"Eltern, die einen Wald gekauft haben."},"answer":"b"},{"no":"8","stem":"Welche Bäume gepflanzt werden, …","options":{"a":"dürfen die Eltern selbst aussuchen.","b":"hängt von der Spende der Familie ab.","c":"entscheiden Fachleute."},"answer":"c"},{"no":"9","stem":"Wenn ein junger Baum vertrocknet, …","options":{"a":"pflanzt die Stadt einen neuen.","b":"müssen die Eltern einen neuen kaufen.","c":"bleibt die Stelle im Wald leer."},"answer":"a"}]},{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 10 bis 12 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Der Zaun, den man nicht sieht","lead":"Auf einer Alp* im Kanton Graubünden tragen Kühe GPS-Halsbänder statt Zäune.","paragraphs":["Auf der Alp Furna im Kanton Graubünden sucht man die Zäune vergeblich. Trotzdem bleiben die 80 Kühe von Bauer Reto Casutt brav auf ihrer Weide. Jede trägt ein Halsband mit GPS-Empfänger. Auf dem Handy legt Casutt fest, wo die Tiere grasen dürfen. Nähert sich eine Kuh der unsichtbaren Grenze, hört sie zuerst einen Ton. Geht sie trotzdem weiter, bekommt sie einen leichten Stromstoss – etwa so stark wie bei einem normalen Weidezaun. „Nach zwei, drei Tagen haben die meisten Kühe verstanden, dass sie beim Ton umkehren müssen“, sagt Casutt. Früher hat er jeden Sommer mehrere Wochen damit verbracht, kilometerlange Zäune aufzustellen und wieder abzubauen. Diese Zeit spart er jetzt. Stattdessen kann er sich mehr um die Tiere und die Käserei kümmern. Ein Halsband kostet allerdings rund 300 Franken, dazu kommen Gebühren für die Software. Die Hälfte der Kosten übernimmt in der Testphase der Kanton. Tierschützer sehen das Projekt kritisch: Sie wollen genau wissen, wie oft die Tiere einen Stromstoss bekommen. Die Daten werden deshalb von einer Hochschule ausgewertet. Auch Wanderer mussten sich an die neue Technik gewöhnen: Weil kein Tor mehr zeigt, wo eine Weide beginnt, stehen sie plötzlich mitten in der Herde. Schilder an den Wegen erklären inzwischen, wie man sich verhält: ruhig weitergehen und die Tiere nicht füttern. Wenn die Ergebnisse gut sind, sollen ab nächstem Jahr zehn weitere Alpen mitmachen."],"footnote":"*Alp = Schweizer Standard für „Alm“","source":"aus einer Schweizer Zeitung","example":null,"items":[{"no":"10","stem":"In diesem Text geht es um …","options":{"a":"Kühe, die ohne sichtbare Zäune auf der Weide bleiben.","b":"einen Bauern, der für seine Alp neue, moderne Zäune kauft.","c":"Wanderer, die sich auf einer Alp vor Kühen fürchten."},"answer":"a"},{"no":"11","stem":"Die Halsbänder …","options":{"a":"bezahlt der Kanton vollständig.","b":"geben den Kühen ohne Warnung sofort einen Stromstoss.","c":"warnen die Tiere zuerst mit einem Geräusch."},"answer":"c"},{"no":"12","stem":"Die Daten der Halsbänder …","options":{"a":"bekommen die Wanderer auf ihr Handy.","b":"werden wissenschaftlich untersucht.","c":"dürfen nur Tierschützer sehen."},"answer":"b"}]}]},"t3":{"instruction":"Lesen Sie die Situationen 13 bis 19 und die Anzeigen a bis j aus verschiedenen deutschsprachigen Medien. Wählen Sie: Welche Anzeige passt zu welcher Situation? Sie können jede Anzeige nur einmal verwenden. Die Anzeige aus dem Beispiel können Sie nicht mehr verwenden. Für eine Situation gibt es keine passende Anzeige. In diesem Fall schreiben Sie 0.","context":"Einige Ihrer Bekannten suchen eine Veranstaltung oder ein Kulturangebot.","example":{"no":"0","text":"Herr Becker interessiert sich für alte Autos und möchte eine Ausstellung besuchen.","answer":"b"},"items":[{"no":"13","text":"Frau Yildiz möchte mit ihren Kindern (4 und 6) ein Theaterstück sehen.","answer":"g"},{"no":"14","text":"Jonas lernt Deutsch und möchte einen deutschen Film sehen, bei dem er den Text mitlesen kann.","answer":"c"},{"no":"15","text":"Herr und Frau Brandt wollen an ihrem Hochzeitstag klassische Musik hören und vorher elegant essen.","answer":"j"},{"no":"16","text":"Lisa möchte an diesem Freitagabend mit Freundinnen eine lustige Vorstellung besuchen.","answer":"0"},{"no":"17","text":"Frau Sommer sieht sehr schlecht, möchte aber trotzdem eine Ausstellung erleben.","answer":"e"},{"no":"18","text":"Paul möchte einen bekannten Schriftsteller einmal persönlich erleben.","answer":"a"},{"no":"19","text":"Familie Klein sucht für Sonntag ein kostenloses Musikangebot im Freien.","answer":"h"}],"ads":[{"letter":"a","design":"serif","header":"LITERATURHAUS","tag":"","title":"Lesung","subtitle":"","facts":[],"body":["Anna Berger liest aus ihrem neuen Roman „Das Haus am Fluss“.","Danach beantwortet die Autorin ihre Fragen und signiert ihre Bücher."],"footer":"Donnerstag, 19.30 Uhr · Eintritt 12 €"},{"letter":"b","design":"band","header":"","tag":"OLD · 1920","title":"","subtitle":"","facts":[],"body":["Oldtimer-Ausstellung im Messezentrum: über 200 Autos und Motorräder aus den Jahren 1920 bis 1980. Samstag und Sonntag, 10 bis 18 Uhr."],"footer":"Eintritt 9 € · Kinder unter 12 frei"},{"letter":"c","design":"ticket","header":"","tag":"","title":"Kino im Hinterhof","subtitle":"","facts":[],"body":["Jeden Dienstag zeigen wir deutsche Filme mit deutschen Untertiteln – ideal für alle, die Deutsch lernen. Danach: Gespräch über den Film in einfacher Sprache."],"footer":"20 Uhr · Karten 6 €"},{"letter":"d","design":"inverse","header":"","tag":"","title":"Kabarett im Keller","subtitle":"","facts":[],"body":["„Alles im grünen Bereich“ – das neue Programm von Lotte Kranz. Samstag und Sonntag, jeweils 20 Uhr."],"footer":"TICKETS AB 18 € · ABENDKASSE AB 19 UHR"},{"letter":"e","design":"hotel","header":"","tag":"","title":"Stadtmuseum","subtitle":"","facts":[],"body":["Kunst zum Anfassen: Tastführungen für blinde und sehbehinderte Menschen durch unsere Skulpturensammlung. Jeden ersten Sonntag im Monat, 11 Uhr."],"footer":"Begleitpersonen frei · Tel. 0421 / 36 61 00"},{"letter":"f","design":"rounded","header":"IMPROVISATIONSTHEATER","tag":"","title":"SPONTAN","subtitle":"","facts":[],"body":["Das Publikum bestimmt, was auf der Bühne passiert. Jeden Freitag, 20 Uhr, ab 16 Jahren. Achtung: Die Vorstellung an diesem Freitag ist bereits ausverkauft."],"footer":""},{"letter":"g","design":"rules","header":"","tag":"","title":"Figurentheater Wackelzahn","subtitle":"","facts":[],"body":["„Der kleine Drache Funkel“ – ein Stück mit Puppen und viel Musik für Kinder ab vier Jahren. Samstag und Sonntag, 15 Uhr."],"footer":"Dauer 45 Minuten · Eintritt 7 €"},{"letter":"h","design":"barhead","deco":{"icon":"columns"},"header":"","tag":"","title":"Sommerkonzerte im Kurpark","subtitle":"JUNI BIS AUGUST","facts":[],"body":["Jeden Sonntag um 11 Uhr spielen Blasorchester und Jazzbands im Musikpavillon. Der Eintritt ist frei. Bei Regen findet das Konzert in der Wandelhalle statt."],"footer":""},{"letter":"i","design":"greyband","header":"","tag":"","title":"OPEN-AIR-KINO AM SEE","subtitle":"FR + SA NACH SONNENUNTERGANG","facts":[],"body":["Filme in Originalsprache mit englischen Untertiteln, empfohlen ab 12 Jahren. Eintritt 8 €, Getränke gibt es an der Bar. Bitte bringen Sie Decken mit."],"footer":""},{"letter":"j","design":"inst","header":"","tag":"JEDEN SAMSTAG","title":"Schlosskonzert mit Menü","subtitle":"","facts":["18 Uhr · Drei-Gänge-Menü","20 Uhr · Mozart und Haydn im Spiegelsaal"],"body":["Erst essen Sie im Schlossrestaurant, danach hören Sie Kammermusik."],"footer":"Konzert und Menü: 79 € pro Person"}]},"t4":{"instruction":"Lesen Sie die Texte 20 bis 26. Wählen Sie: Ist die Person für eine Helmpflicht beim Radfahren, Ja oder Nein?","context":"In einer Zeitschrift lesen Sie Kommentare zu einem Artikel über den Vorschlag, dass alle Radfahrerinnen und Radfahrer einen Helm tragen müssen.","header":"LESERKOMMENTARE","site":"www.rad-und-recht.de/forum","example":{"no":"0","name":"Rolf","byline":"Rolf, 57, Hannover","text":"Ich bin seit fast vierzig Jahren Polizist und habe zu viele Unfälle mit Radfahrern gesehen. Oft waren es keine schnellen Sportler, sondern ganz normale Leute auf dem Weg zum Bäcker. Ein Helm kostet so viel wie ein Abendessen und kann ein Leben retten. Freiwillig setzen ihn leider zu wenige auf, also brauchen wir eine Pflicht.","answer":"J"},"items":[
