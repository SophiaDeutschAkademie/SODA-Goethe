 mit dem Rad reisen, ihre Koffer aber nicht selbst tragen.","answer":"e"},{"no":"14","text":"Clara ist 34 und möchte ihr Spanisch verbessern. Am liebsten würde sie bei Einheimischen wohnen.","answer":"h"},{"no":"15","text":"Tobias hat nur ein langes Wochenende frei. Er möchte in die Berge, besitzt aber kein Auto.","answer":"c"},{"no":"16","text":"Familie Özdemir sucht für die Sommerferien einen Campingplatz, auf dem ihre beiden Kinder (6 und 9) etwas erleben können.","answer":"0"},{"no":"17","text":"Frau Lange ist auf einen Rollstuhl angewiesen und möchte ein paar Tage eine Stadt besichtigen.","answer":"j"},{"no":"18","text":"Nils möchte seinen Urlaub nutzen, um sich für die Natur einzusetzen.","answer":"f"},{"no":"19","text":"Herr Albers hat nur wenig Geld, möchte aber trotzdem ein paar Tage ans Meer.","answer":"a"}],"ads":[{"letter":"a","design":"postcard","header":"","tag":"ab 19 € PRO NACHT","title":"Grüße von der Ostsee!","subtitle":"","facts":[],"body":["Übernachten im Strandhostel Warnemünde: Mehrbettzimmer ab 19 € pro Nacht, Doppelzimmer ab 48 €. Frühstück 6 €, Gästeküche zur Selbstversorgung. Für Gäste jeden Alters, ohne Mitgliedsausweis. Zum Strand sind es drei Minuten."],"footer":"strandhostel-warnemuende.de"},{"letter":"b","design":"badge","header":"SANKT PETER-ORDING · NORDSEE","tag":"ab 140 € pro Nacht","title":"Ferienhaus Dünenblick","subtitle":"","facts":["Mindestaufenthalt eine Woche","Endreinigung inklusive"],"body":["Reetdachhaus für bis zu sechs Personen, 300 Meter hinter dem Deich, mit eingezäuntem Garten. Hunde sind bei uns herzlich willkommen – der Hundestrand liegt gleich um die Ecke."],"footer":""},{"letter":"c","design":"timetable","header":"","tag":"FR – MO","title":"Bahnwochenende Allgäu","subtitle":"","facts":["Fr 16.08 München Hbf → Oberstdorf 18.40","Mo 17.20 Oberstdorf → München Hbf 19.52","289 € pro Person"],"body":["In die Berge – ganz ohne Auto: Hin- und Rückfahrt mit dem Zug ab jedem Bahnhof in Bayern, drei Nächte in der Berghütte „Edelweiß“ mit Halbpension und eine geführte Wanderung."],"footer":""},{"letter":"d","design":"bignum","header":"","tag":"12 TAGE","title":"Nordland-Kreuzfahrt","subtitle":"","facts":[],"body":["Entlang der norwegischen Küste – Fjorde, Gletscher und Mitternachtssonne. Außenkabine, Vollpension und Landausflüge inklusive. Ab 2.490 € pro Person; wer bis 31. März bucht, spart zehn Prozent."],"footer":"Reederei Polaris · 040 / 77 88 99"},{"letter":"e","design":"route","header":"","tag":"8 TAGE","title":"Elbe-Radreisen","subtitle":"","facts":["Dresden – Meißen – Torgau – Wittenberg"],"body":["Täglich 40 bis 60 Kilometer auf flachen Radwegen. Ihr Gepäck bringen wir jeden Morgen ins nächste Hotel – Sie fahren nur mit einer kleinen Tasche. E-Bikes gegen Aufpreis. Besonders beliebt bei Gästen ab 60."],"footer":"elbe-radreisen.de"},{"letter":"f","design":"pinned","header":"","tag":"","title":"Nationalpark Harz sucht Helfer","subtitle":"","facts":[],"body":["Ein Urlaub, der etwas bewirkt: Mit unseren Rangern reparieren Sie Wanderwege, pflanzen junge Bäume und zählen Vögel. Unterkunft und Essen sind kostenlos, die Anreise zahlen Sie selbst. Voraussetzung: Sie sind mindestens 18 und gut zu Fuß."],"footer":"Infos im Besucherzentrum Torfhaus"},{"letter":"g","design":"rounded","header":"","tag":"","title":"RUHE","subtitle":"CAMPINGPLATZ SEEBLICK","facts":[],"body":["Bei uns gibt es keinen Spielplatz und keine Animation – dafür Stille, einen Saunasteg und Stellplätze direkt am Wasser. Bitte beachten Sie: Kinder und Jugendliche unter 16 Jahren können wir leider nicht aufnehmen."],"footer":"camping-seeblick.de"},{"letter":"h","design":"dropcap","header":"SPRACHREISEN SOL","tag":"SALAMANCA","title":"","subtitle":"","facts":[],"body":["Spanisch lernen, wo es gesprochen wird: Unterricht in kleinen Gruppen, vier Stunden am Vormittag, für Erwachsene aller Niveaus. Sie wohnen bei einer spanischen Gastfamilie mit Frühstück und Abendessen – so sprechen Sie auch nach dem Unterricht Spanisch."],"footer":"Ab zwei Wochen buchbar · sprachreisen-sol.de"},{"letter":"i","design":"coupon","header":"","tag":"","title":"Sprachcamp Costa Brava","subtitle":"FÜR JUGENDLICHE VON 12 BIS 17 JAHREN","facts":[],"body":["Zwei Wochen Zeltlager am Meer: morgens Spanischunterricht, nachmittags Surfen, Klettern und Ausflüge. Erfahrene Teamer betreuen die Gruppe rund um die Uhr. Anreise im Reisebus ab Köln."],"footer":"Jugendreisen Mar · Frühbucherrabatt bis 30. April"},{"letter":"j","design":"greyband","header":"","tag":"","title":"Dresden ohne Hindernisse","subtitle":"","facts":[],"body":["Städtereise für Rollstuhlfahrerinnen und Rollstuhlfahrer: zwei Nächte im Hotel „Elbufer“ mit rollstuhlgerechten Zimmern und Bädern, eine Stadtführung auf stufenlosen Wegen und ein Opernabend mit reservierten Rollstuhlplätzen. Begleitpersonen erhalten 30 Prozent Rabatt."],"footer":"Reisebüro Weitblick · 0351 / 40 50 60"}]},"t4":{"instruction":"Lesen Sie die Texte 20 bis 26. Wählen Sie: Ist die Person für einen fleischfreien Tag in Kantinen, Ja oder Nein?","context":"In einer Zeitschrift lesen Sie Kommentare zu einem Artikel über Firmen und Schulen, deren Kantinen einmal pro Woche kein Fleisch mehr anbieten.","header":"LESERKOMMENTARE","site":"www.essen-und-arbeit.de/forum","example":{"no":"0","name":"Katrin","byline":"Katrin, 52, Mainz","text":"In unserer Kantine gibt es seit einem Jahr jeden Donnerstag nur Gerichte ohne Fleisch. Am Anfang wurde gemeckert, heute ist der Donnerstag der Tag mit den meisten Gästen. Die Köche geben sich mehr Mühe, und ich habe Gerichte kennengelernt, die ich jetzt zu Hause selbst koche. Ein Tag in der Woche tut niemandem weh – dem Klima aber gut.","answer":"J"},"items":[{"no":"20","name":"Bernd","byline":"Bernd, 58, Essen","text":"Ich verstehe ja, dass viele weniger Fleisch essen wollen, und das ist auch in Ordnung. Aber ich arbeite auf dem Bau, und mittags brauche ich etwas Ordentliches. Die Kantine ist für viele von uns die einzige warme Mahlzeit am Tag. Wer kein Fleisch will, soll eben das Gemüse nehmen – mir sollte aber niemand vorschreiben, was auf meinen Teller kommt.","answer":"N"},{"no":"21","name":"Selin","byline":"Selin, 27, Wien","text":"Bei uns in der Firma wird jeden Mittwoch vegetarisch gekocht, und seitdem sitze ich mittags endlich mit meinen Kollegen an einem Tisch, statt mir einen Salat mitzubringen. Ich esse seit Jahren kein Fleisch. Dass die anderen einmal pro Woche probieren, was ich jeden Tag esse, finde ich nur fair. Und ehrlich gesagt: Die meisten merken gar nicht, dass etwas fehlt.","answer":"J"},{"no":"22","name":"Thomas","byline":"Thomas, 44, Zürich","text":"Als die Schule meiner Tochter den Veggie-Tag eingeführt hat, habe ich mich beim Elternabend darüber beschwert. Ein Kind braucht Fleisch, dachte ich. Dann hat uns die Köchin zum Probeessen eingeladen: Linsencurry, Gemüselasagne, Käsespätzle. Meine Tochter hat zweimal nachgenommen – ich übrigens auch. Seitdem sehe ich das entspannter und würde mir so einen Tag auch in meiner Firma wünschen.","answer":"J"},{"no":"23","name":"Yvonne","byline":"Yvonne, 36, Bremen","text":"Meine Kinder erzählen begeistert vom Veggie-Tag in der Schule, und meine Nachbarin hält ihn für eine tolle Idee. Ich sehe das anders. Mein Sohn isst ohnehin kaum Gemüse; an diesen Tagen kommt er hungrig nach Hause, weil er sein Essen stehen lässt. Die Schule sollte die Kinder lieber für gesundes Essen begeistern, statt ihnen etwas zu verbieten.","answer":"N"},{"no":"24","name":"Ahmet","byline":"Ahmet, 49, Nürnberg","text":"Ich bin nur dafür, wenn das vegetarische Essen genauso satt macht und nicht teurer ist als die Fleischgerichte. Sonst gehen die Leute einfach zur Imbissbude gegenüber. In unserer Kantine klappt das: Freitags gibt es Eintöpfe mit Bohnen oder Linsen für 4,50 Euro, und die Schlange ist so lang wie an anderen Tagen. So kann es bleiben.","answer":"J"},{"no":"25","name":"Laura","byline":"Laura, 31, Linz","text":"Warum muss man den Leuten etwas wegnehmen? Viel besser fände ich es, wenn es jeden Tag ein richtig gutes vegetarisches Gericht gäbe – günstiger als das Schnitzel und gleich am Anfang der Theke. Dann greifen die meisten von allein zu, das hat man an unserer Uni schon ausprobiert. Ein fester Tag ohne Fleisch sorgt dagegen nur für schlechte Laune.","answer":"N"},{"no":"26","name":"Klaus","byline":"Klaus, 63, Rostock","text":"Grundsätzlich hätte ich nichts dagegen, wenn die Qualität stimmen würde. Aber in unserer Betriebskantine gibt es am fleischfreien Montag immer dasselbe: zerkochte Nudeln mit Tomatensoße, und das seit zwei Jahren. Kein Wunder, dass montags die Hälfte der Tische leer bleibt. Solange dem Koch nicht mehr einfällt, ist so ein Tag nur ärgerlich. Ich bringe mir montags inzwischen ein Brot von zu Hause mit.","answer":"N"}]},"t5":{"instruction":"Lesen Sie die Aufgaben 27 bis 30 und den Text dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","context":"Sie möchten ein Carsharing-Angebot nutzen und lesen die Nutzungsbedingungen.","doc":{"title":"NUTZUNGSBEDINGUNGEN · STADTAUTO","intro":"","sections":[{"heading":"Anmeldung","text":"Kundin oder Kunde kann werden, wer mindestens 21 Jahre alt ist und seit mindestens zwei Jahren einen gültigen Führerschein besitzt. Die Anmeldung erfolgt online; Führerschein und Personalausweis zeigen Sie einmalig in einer unserer Filialen vor. Die Aufnahmegebühr beträgt 30 Euro."},{"heading":"Buchung","text":"Fahrzeuge können Sie über die App oder telefonisch bis zu vier Wochen im Voraus reservieren. Bis eine Stunde vor Fahrtbeginn können Sie eine Buchung kostenlos stornieren; danach berechnen wir die Hälfte des Preises. Kindersitze können Sie kostenlos dazubuchen."},{"heading":"Kosten","text":"Abgerechnet wird nach Zeit und gefahrenen Kilometern. Versicherung und Kraftstoff sind im Preis enthalten. Ist der Tank weniger als ein Viertel voll, tanken Sie bitte mit der Tankkarte aus dem Handschuhfach; dafür schreiben wir Ihnen zehn Minuten Fahrzeit gut."},{"heading":"Rückgabe","text":"Bringen Sie das Fahrzeug pünktlich an den Stellplatz zurück, an dem Sie es abgeholt haben. Bei Verspätung ohne vorherigen Anruf berechnen wir 15 Euro pro angefangene halbe Stunde."},{"heading":"Schäden und Sauberkeit","text":"Melden Sie Schäden vor Fahrtbeginn über die App; sonst müssen wir davon ausgehen, dass Sie sie verursacht haben. Rauchen ist in allen Fahrzeugen verboten. Tiere dürfen nur in einer Transportbox mitfahren."},{"heading":"Kündigung","text":"Die Mitgliedschaft kann jederzeit mit einer Frist von vier Wochen zum Monatsende gekündigt werden. Der Monatsbeitrag von 9 Euro entfällt für Kundinnen und Kunden, die ein Jahresabo für Bus und Bahn besitzen."},{"heading":"Weitere Fahrer","text":"Das Fahrzeug dürfen nur angemeldete Kundinnen und Kunden fahren. Personen, die im selben Haushalt leben, können sich kostenlos als Zusatzfahrer registrieren lassen."}],"footer":""},"example":null,"items":[{"no":"27","stem":"Wer seit einem Jahr einen Führerschein hat, …","options":{"a":"kann sich nur in einer Filiale anmelden.","b":"kann noch nicht Kunde werden.","c":"zahlt eine höhere Aufnahmegebühr."},"answer":"b"},{"no":"28","stem":"Wer eine Buchung 30 Minuten vor Fahrtbeginn absagt, …","options":{"a":"hat keine zusätzlichen Kosten.","b":"darf in den nächsten vier Wochen nichts mehr buchen.","c":"muss einen Teil des Preises bezahlen."},"answer":"c"},{"no":"29","stem":"Wenn der Tank fast leer ist, …","options":{"a":"bekommt man fürs Tanken einen kleinen Bonus.","b":"zahlt man das Benzin zunächst selbst.","c":"muss man das Auto sofort zurückbringen."},"answer":"a"},{"no":"30","stem":"Der Mann einer Kundin, der mit ihr zusammenwohnt, …","options":{"a":"darf das Auto ohne Anmeldung fahren.","b":"muss erst selbst eine Aufnahmegebühr von 30 Euro bezahlen.","c":"kann sich kostenlos als Fahrer eintragen lassen."},"answer":"c"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.","readNote":"Lesen Sie zuerst das Beispiel. Dazu haben Sie 10 Sekunden Zeit.","example":[{"no":"01","type":"rf","text":"Frau Scholl kann ihre Katze heute abholen.","answer":"R"},{"no":"02","type":"abc","stem":"Frau Scholl soll …","options":{"a":"den Transportkorb mitbringen.","b":"die Tabletten in der Apotheke kaufen.","c":"morgen früh in der Praxis anrufen."},"answer":"a"}],"texts":[{"label":"Text 1","items":[{"no":"1","type":"rf","text":"Die Fans müssen heute ein anderes Verkehrsmittel nehmen als sonst.","answer":"R"},{"no":"2","type":"abc","stem":"Die Ersatzbusse …","options":{"a":"fahren wie die Straßenbahn am Ausgang Süd ab.","b":"sind für Besucher mit Eintrittskarte kostenlos.","c":"bringen die Fans direkt zu den Parkplätzen am Stadion."},"answer":"b"}]},{"label":"Text 2","items":[{"no":"3","type":"rf","text":"Herr Wolf kann Frau Brenner das Paket heute Abend persönlich geben.","answer":"F"},{"no":"4","type":"abc","stem":"Frau Brenner soll das Paket …","options":{"a":"in einer Woche bei Familie Wolf abholen.","b":"beim Paketdienst in der Filiale abholen.","c":"noch heute bei Frau Wolf abholen."},"answer":"c"}]},{"label":"Text 3","items":[{"no":"5","type":"rf","text":"In dieser Woche wird der Müll überall einen Tag später abgeholt.","answer":"F"},{"no":"6","type":"abc","stem":"Die Wertstoffhöfe …","options":{"a":"haben am Samstag länger geöffnet als sonst.","b":"sind in dieser Woche ganz geschlossen.","c":"öffnen am Donnerstag erst um 6 Uhr."},"answer":"a"}]},{"label":"Text 4","items":[{"no":"7","type":"rf","text":"Jemand hat eine gefundene Tasche abgegeben.","answer":"R"},{"no":"8","type":"abc","stem":"Heute Abend …","options":{"a":"wird das Konzert verschoben.","b":"fällt ein Programmpunkt aus.","c":"schließt der Infostand früher."},"answer":"b"}]},{"label":"Text 5","items":[{"no":"9","type":"rf","text":"Der Kurs beginnt ab nächster Woche zu einer anderen Uhrzeit.","answer":"F"},{"no":"10","type":"abc","stem":"Herr Kowalczyk soll …","options":{"a":"sich im Büro der Sprachschule noch einmal neu anmelden.","b":"im Kurs den Aufzug benutzen.","c":"ein Formular unterschrieben abgeben."},"answer":"c"}]}]},"t2":{"instruction":"Sie hören nun einen Text. Sie hören den Text einmal. Dazu lösen Sie fünf Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","readNote":"Lesen Sie jetzt die Aufgaben 11 bis 15. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie nehmen an einer Führung hinter den Kulissen des Stadttheaters teil. Zu Beginn spricht die Theaterpädagogin Frau Engel.","items":[{"no":"11","stem":"Die Führung …","options":{"a":"endet auf jeden Fall auf der großen Bühne des Theaters.","b":"beginnt dort, wo die Bühnenbilder entstehen.","c":"dauert ungefähr eine halbe Stunde."},"answer":"b"},{"no":"12","stem":"Fotos …","options":{"a":"darf man nur auf der Bühne machen.","b":"sind in einem Raum nicht erlaubt.","c":"sind im ganzen Theater verboten."},"answer":"b"},{"no":"13","stem":"Im Kostümfundus …","options":{"a":"dürfen nur Kinder etwas anprobieren.","b":"kann man Kostüme ausleihen.","c":"darf man einzelne Stücke anziehen."},"answer":"c"},{"no":"14","stem":"Die Garderobe …","options":{"a":"kostet einen kleinen Betrag.","b":"ist für die Teilnehmenden kostenlos.","c":"befindet sich im Untergeschoss."},"answer":"b"},{"no":"15","stem":"Mit der Führungskarte …","options":{"a":"kann man im Internet günstigere Karten für diesen Monat kaufen.","b":"sieht man die Vorstellung heute Abend kostenlos.","c":"zahlt man für Theaterkarten an der Kasse weniger."},"answer":"c"}]},"t3":{"instruction":"Sie hören nun ein Gespräch. Sie hören das Gespräch einmal. Dazu lösen Sie sieben Aufgaben. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","readNote":"Lesen Sie jetzt die Aufgaben 16 bis 22. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie sind in der Kantine und hören, wie sich zwei Kolleginnen, Birte und Anja, in der Mittagspause unterhalten.","items":[{"no":"16","text":"Birte fährt inzwischen meistens mit dem Rad zur Arbeit.","answer":"R"},{"no":"17","text":"Das E-Bike hat Birte selbst bezahlt.","answer":"F"},{"no":"18","text":"Mit dem Rad braucht Birte länger als früher mit dem Auto.","answer":"F"},{"no":"19","text":"Am Anfang war Haruka in der Familie sehr zurückhaltend.","answer":"R"},{"no":"20","text":"Anjas Sohn war von der Gastschülerin zunächst nicht begeistert.","answer":"R"},{"no":"21","text":"Haruka darf ihren Aufenthalt verlängern.","answer":"F"},{"no":"22","text":"Anjas Familie plant, Haruka in Japan zu besuchen.","answer":"R"}]},"t4":{"instruction":"Sie hören nun eine Diskussion. Sie hören die Diskussion zweimal. Dazu lösen Sie acht Aufgaben. Ordnen Sie die Aussagen zu: Wer sagt was?","readNote":"Lesen Sie jetzt die Aussagen 23 bis 30. Dazu haben Sie 60 Sekunden Zeit.","context":"Der Moderator der Radiosendung „Standpunkte“ diskutiert mit der Grundschullehrerin Claudia Reuter und dem Vater und Elternvertreter Martin Kühne über die Frage: „Sollen Hausaufgaben abgeschafft werden?“","speakers":{"a":"Moderator","b":"Claudia Reuter","c":"Martin Kühne"},"example":{"no":"0","text":"An vielen Schulen wird über Hausaufgaben diskutiert.","answer":"a"},"items":[{"no":"23","text":"Was früher zu Hause geübt wurde, üben die Kinder jetzt im Unterricht.","answer":"b"},{"no":"24","text":"Hausaufgaben zeigen Eltern, womit sich ihr Kind gerade beschäftigt.","answer":"c"},{"no":"25","text":"Manche Eltern arbeiten abends oder sprechen kaum Deutsch.","answer":"a"},{"no":"26","text":"Ohne Hausaufgaben ist das Familienleben entspannter.","answer":"b"},{"no":"27","text":"Lernstoff muss man oft wiederholen, damit man ihn behält.","answer":"c"},{"no":"28","text":"Für Hausaufgaben sollte es eine feste Zeitgrenze geben.","answer":"c"},{"no":"29","text":"Auf die Noten jüngerer Kinder haben Hausaufgaben wenig Wirkung.","answer":"a"},{"no":"30","text":"Auch die Lehrkräfte profitieren davon, dass es keine Hausaufgaben mehr gibt.","answer":"b"}]}},"schreiben":{"intro":"Das Modul Schreiben besteht aus drei Teilen. In den Aufgaben 1 und 3 schreiben Sie E-Mails, in Aufgabe 2 schreiben Sie einen Diskussionsbeitrag. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf den Antwortbogen.","tasks":[{"no":1,"minutes":20,"words":80,"situation":["Sie haben am Wochenende Ihren 30. Geburtstag gefeiert. Ein Freund/Eine Freundin von Ihnen konnte leider nicht kommen, weil er/sie krank war."],"points":["Beschreiben Sie: Wie war die Feier?","Begründen Sie: Welches Geschenk hat Ihnen am besten gefallen und warum?","Machen Sie einen Vorschlag, wie Sie beide nachfeiern können."],"post":null,"instruction":"Schreiben Sie eine E-Mail (circa 80 Wörter). Schreiben Sie etwas zu allen drei Punkten. Achten Sie auf den Textaufbau (Anrede, Einleitung, Reihenfolge der Inhaltspunkte, Schluss).","model":{"label":"E-Mail an einen Freund, ca. 95 Wörter","text":"Betreff: Schade, dass du nicht da warst!\n\nLieber Markus,\n\nwie geht es dir? Ich hoffe, du bist wieder gesund! Meine Geburtstagsfeier am Samstag war wunderschön. Wir waren ungefähr zwanzig Leute in meinem Garten, haben gegrillt und bis zwei Uhr nachts getanzt.\n\nAm besten hat mir das Geschenk meiner Schwester gefallen: ein Fotobuch mit Bildern aus dreißig Jahren. Beim Anschauen habe ich gleichzeitig gelacht und geweint, weil ich so viele Erinnerungen wiedergefunden habe.\n\nWollen wir nächsten Samstag zusammen essen gehen und ein bisschen nachfeiern? Ich lade dich ein – such dir ein Restaurant aus!\n\nViele Grüße\nLucía"},"typicalErrors":"Das Geschenk wird nur genannt, nicht begründet · Vorschlag ohne Zeitpunkt · Sie statt du."},{"no":2,"minutes":25,"words":80,"situation":["Sie haben im Radio eine Sendung zum Thema „Ausbildung statt Studium?“ gehört. Im Online-Gästebuch der Sendung finden Sie folgende Meinung:"],"points":[],"post":{"site":"www.radio-bildung.de","label":"Gästebuch","author":"Petra · 08.02. 20:14 Uhr","text":"Mein Sohn hat ein sehr gutes Abitur und will trotzdem Tischler werden. Ich verstehe das nicht ganz – mit einem Studium hätte er später bessere Chancen. Andererseits ist er in der Werkstatt so glücklich, wie er es in der Schule nie war. Und Handwerker werden überall gesucht."},"instruction":"Schreiben Sie nun Ihre Meinung zum Thema (circa 80 Wörter).","model":{"label":"Diskussionsbeitrag, ca. 95 Wörter","text":"Petra spricht ein wichtiges Thema an. Ich finde, ein Studium ist nicht für jeden der richtige Weg. Wer gern mit den Händen arbeitet, ist in einer Ausbildung oft glücklicher, und das ist genauso viel wert wie ein Abschluss an der Universität.\n\nAußerdem haben Handwerker heute sehr gute Chancen: Sie finden schnell eine Stelle und können sich später selbstständig machen. Mein Cousin ist Elektriker und verdient mehr als viele seiner Freunde mit Studium.\n\nTrotzdem verstehe ich Petras Sorge. Ihr Sohn sollte aber wissen, dass er auch nach der Ausbildung noch studieren kann."},"typicalErrors":"Petras Beitrag nur zusammenfassen, statt eine eigene Meinung zu schreiben · keine Beispiele · deutlich unter 80 Wörtern."},{"no":3,"minutes":15,"words":40,"situation":["Sie haben sich von Ihrem Nachbarn, Herrn Keller, eine Leiter ausgeliehen. Beim Renovieren ist die Leiter kaputtgegangen."],"points":[],"post":null,"instruction":"Schreiben Sie an Herrn Keller. Entschuldigen Sie sich höflich, erklären Sie, was passiert ist, und machen Sie einen Vorschlag. Schreiben Sie eine E-Mail (circa 40 Wörter). Vergessen Sie nicht die Anrede und den Gruß am Schluss.","model":{"label":"E-Mail an den Nachbarn, ca. 45 Wörter","text":"Sehr geehrter Herr Keller,\n\nes tut mir sehr leid, aber beim Streichen ist Ihre Leiter umgefallen, und eine Stufe ist gebrochen. Ich möchte Ihnen gern eine neue Leiter kaufen. Hätten Sie am Samstag Zeit, mit mir in den Baumarkt zu fahren? Dann können Sie selbst ein Modell aussuchen.\n\nMit freundlichen Grüßen\nOmar Saleh"},"typicalErrors":"Kein Vorschlag (ersetzen, reparieren) · Hallo Herr Keller oder Liebe Grüße · keine Entschuldigung."}]},"audio":[{"src":"Goethe%20B1%20Modelltest%205.1.mp3","dur":643.19},{"src":"Goethe%20B1%20Modelltest%205.2.mp3","dur":301.17},{"src":"Goethe%20B1%20Modelltest%205.3.mp3","dur":245.58},{"src":"Goethe%20B1%20Modelltest%205.4.mp3","dur":568.84}],"pdf":"Goethe%20B1%20Modelltest%205.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"6":{"id":6,"roman":"VI","lesen":{"t1":{"instruction":"Lesen Sie den Text und die Aufgaben 1 bis 6 dazu. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","blog":{"site":"ute-im-gruenen.de · Ute","date":"Samstag, 20. Juli","title":"Summende Mitbewohner","paragraphs":["Vor einem Jahr hätte ich jeden ausgelacht, der mir gesagt hätte, dass ich einmal Imkerin werde. Über Bienen wusste ich damals nur zwei Dinge: Sie machen Honig, und sie stechen. Dann hat mein Sohn Paul in der Schule ein Projekt über das Bienensterben gemacht und mir so lange davon erzählt, bis ich mich im Herbst beim Imkerverein für einen Anfängerkurs angemeldet habe.","Im März haben wir zum ersten Mal an echten Bienenkästen gearbeitet, und meine Hände haben vor Angst gezittert. Herr Brandl, unser Kursleiter, imkert seit vierzig Jahren und hat nur gesagt: „Ruhig bleiben. Bienen merken, wenn du nervös bist.“","Ein Bienenvolk kostet beim Züchter etwa 200 Euro, dazu kommen Kasten, Werkzeug und Schutzkleidung. Mein Volk habe ich aber von Herrn Brandl bekommen: Im April hat er mir einen Kasten in den Garten gestellt und gesagt, er sei froh, wenn jemand Neues anfängt. Nur die Ausrüstung musste ich selbst bezahlen.","Mit unserer Nachbarin, Frau Kessler, gab es am Anfang Ärger. Sie kam gleich am zweiten Tag herüber, weil sie Angst um ihre Enkel hatte. Ich habe ihr den Kasten gezeigt und erklärt, dass Bienen nur stechen, wenn man sie stört. Inzwischen sitzt sie manchmal mit einer Tasse Kaffee am Zaun und schaut den Bienen zu.","Zweimal pro Woche schaue ich nach den Bienen. Den Schutzanzug ziehe ich dafür inzwischen nicht mehr an; Schleier und Handschuhe reichen mir. Nur beim Honigernten bin ich von Kopf bis Fuß eingepackt. Gestochen wurde ich trotzdem schon dreimal – immer am Handgelenk.","Letzte Woche war es dann so weit: die erste Ernte. Zwölf Gläser sind es geworden, und ich habe noch nie so leckeren Honig gegessen. Paul wollte sofort einen Stand vor dem Haus aufbauen, aber für einen Verkauf ist das viel zu wenig. Die Hälfte haben wir an Familie und Nachbarn verschenkt – Frau Kessler hat natürlich das erste Glas bekommen.","Im nächsten Frühjahr kommt ein zweites Volk dazu; Herr Brandl hat schon eins für mich reserviert. Mehr als zwei sollen es aber nicht werden – mein Garten ist klein, und ich will im Sommer auch noch Zeit für anderes haben."],"closing":"Summende Grüße, Ute"},"example":{"no":"0","text":"Ute hat seit diesem Frühjahr eigene Bienen.","answer":"R"},"items":[{"no":"1","text":"Schon vor dem Kurs kannte sich Ute gut mit Bienen aus.","answer":"F"},{"no":"2","text":"Für ihr erstes Bienenvolk musste Ute nichts bezahlen.","answer":"R"},{"no":"3","text":"Frau Kessler hatte von Anfang an nichts gegen die Bienen.","answer":"F"},{"no":"4","text":"Ute trägt bei der Arbeit an den Bienen immer ihren Schutzanzug.","answer":"F"},{"no":"5","text":"Mit ihrem Honig hat Ute bisher kein Geld verdient.","answer":"R"},{"no":"6","text":"Ute möchte im nächsten Jahr mehr Bienen halten als jetzt.","answer":"R"}]},"t2":{"texts":[{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 7 bis 9 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Besuch in der Nacht","lead":"In Waldhagen kommen Wildschweine bis in die Gärten – die Stadt sucht nach Lösungen.","paragraphs":["Frank Lehner traute seinen Augen nicht: Als er an einem Sonntagmorgen im Oktober aus dem Fenster sah, war sein Rasen vollständig umgegraben. In der Nacht hatte eine Gruppe Wildschweine den Garten nach Würmern und Wurzeln durchsucht. Lehner ist kein Einzelfall. In Waldhagen, einer Kleinstadt direkt am Wald, kommen die Tiere seit zwei Jahren immer häufiger in die Wohngebiete. Nicht nur Gärten, auch Spielplätze, Friedhöfe und der Sportplatz der Grundschule wurden schon umgegraben. „Sie finden hier einfach mehr zu fressen als im Wald“, erklärt Förster Uwe Kamps. Schuld seien vor allem offene Mülltonnen, Obst, das unter den Bäumen liegen bleibt, und Komposthaufen. Manche Bewohner füttern die Tiere sogar, weil sie sie niedlich finden – obwohl das verboten ist und bis zu 5.000 Euro Strafe kosten kann. Angriffe auf Menschen sind selten. Wer einem Wildschwein begegnet, sollte stehen bleiben, langsam zurückgehen und dem Tier einen Weg zur Flucht lassen. Vorsichtig sein sollte man vor allem im Frühjahr, wenn die Mütter ihre Jungen verteidigen. Die Stadt hat inzwischen ein Wildtiertelefon eingerichtet, bei dem man Begegnungen melden kann. Außerdem verteilt sie kostenlos Schlösser für Mülltonnen. Wer sein Fallobst nicht selbst aufsammeln kann, bekommt Hilfe von der Stadtgärtnerei. Jagen darf in den Gärten niemand, und daran soll sich auch nichts ändern. Stattdessen will die Stadt im Frühjahr einen Zaun am Waldrand testen – zunächst auf einem Kilometer Länge."],"footnote":"","source":"aus einer deutschen Zeitung","example":{"no":"0","stem":"Frank Lehner …","options":{"a":"hat die Wildschweine in seinem Garten beobachtet.","b":"hat am Morgen gesehen, was die Tiere angerichtet hatten.","c":"hat die Tiere in der Nacht gefüttert."},"answer":"b"},"items":[{"no":"7","stem":"In diesem Text geht es um …","options":{"a":"Wildtiere, die immer öfter in eine Stadt kommen.","b":"einen Förster, der im Wald die Wildschweine zählt.","c":"Bewohner, die gegen einen neuen Zaun protestieren."},"answer":"a"},{"no":"8","stem":"Die Tiere kommen in die Wohngebiete, weil …","options":{"a":"sie im Wald immer weniger Platz zum Leben haben.","b":"sie in den Gärten vor den Jägern sicher sind.","c":"es dort mehr Futter gibt."},"answer":"c"},{"no":"9","stem":"Die Stadt …","options":{"a":"erlaubt den Bewohnern, die Tiere in ihren Gärten zu jagen.","b":"hilft den Bewohnern dabei, ihren Müll vor Tieren zu sichern.","c":"hat am Waldrand bereits einen kilometerlangen Zaun aufgestellt."},"answer":"b"}]},{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 10 bis 12 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Kühle Zuflucht an heißen Tagen","lead":"In Graz öffnen bei großer Hitze Pfarrsäle und Seniorenzentren ihre Türen für alle, die sich abkühlen möchten.","paragraphs":["Wenn das Thermometer in Graz über 30 Grad steigt, hängt vor dem Pfarrsaal St. Leonhard ein blaues Schild: „Kühler Raum – Eintritt frei“. Drinnen stehen Liegestühle, ein Wasserspender und ein Regal mit Zeitungen und Gesellschaftsspielen. Auch am Nachmittag ist es hier mit 23 Grad angenehm kühl. Zweimal pro Woche kommt eine Krankenschwester vorbei und misst auf Wunsch den Blutdruck. Heuer* gibt es in der Stadt bereits vierzehn solcher Räume, die meisten in Pfarrsälen, Seniorenzentren und Bibliotheken. Gedacht ist das Angebot vor allem für ältere Menschen, die allein leben und in ihren Wohnungen unter der Hitze leiden. „Viele trinken zu wenig, weil sie keinen Durst spüren, und merken nicht, wie gefährlich das ist“, sagt die Ärztin Andrea Pichler, die das Projekt mitentwickelt hat. Gekommen sind bisher aber auch viele Mütter mit Babys und Menschen ohne Wohnung; an manchen Nachmittagen sind alle Liegestühle besetzt. Wer den Weg nicht allein schafft, kann sich von Freiwilligen des Roten Kreuzes abholen lassen; ein Anruf am Vortag genügt. Das größte Problem: Gerade die Menschen, für die das Angebot gedacht ist, verlassen bei Hitze ihre Wohnung oft gar nicht. Deshalb rufen Ehrenamtliche an heißen Tagen ältere Menschen an, die sich vorher dafür angemeldet haben, und fragen, wie es ihnen geht. Im nächsten Sommer sollen die Räume auch am Wochenende geöffnet sein – bisher schließen sie am Freitag um 18 Uhr."],"footnote":"*heuer = österreichischer Standard für „in diesem Jahr“","source":"aus einer österreichischen Zeitung","example":null,"items":[{"no":"10","stem":"In diesem Text geht es um …","options":{"a":"Ärzte, die ältere Menschen an heißen Tagen zu Hause besuchen.","b":"eine Stadt, in der es im Sommer nicht genug Trinkwasser gibt.","c":"Orte, an denen man sich bei Hitze abkühlen kann."},"answer":"c"},{"no":"11","stem":"Wer nicht allein zu einem kühlen Raum kommen kann, …","options":{"a":"bekommt für die Fahrt ein kostenloses Taxi der Stadt.","b":"wird nach vorheriger Anmeldung von Helfern gebracht.","c":"wird an heißen Tagen von einer Ärztin angerufen."},"answer":"b"},{"no":"12","stem":"Ein Problem ist, dass …","options":{"a":"ältere Menschen bei Hitze oft zu Hause bleiben.","b":"an den Wochenenden zu viele Besucher kommen.","c":"es auch in den Räumen am Nachmittag oft zu warm wird."},"answer":"a"}]}]},"t3":{"instruction":"Lesen Sie die Situationen 13 bis 19 und die Anzeigen a bis j aus verschiedenen deutschsprachigen Medien. Wählen Sie: Welche Anzeige passt zu welcher Situation? Sie können jede Anzeige nur einmal verwenden. Die Anzeige aus dem Beispiel können Sie nicht mehr verwenden. Für eine Situation gibt es keine passende Anzeige. In diesem Fall schreiben Sie 0.","context":"Einige Ihrer Bekannten suchen eine Wohnung oder ein Zimmer.","example":{"no":"0","text":"Malik beginnt im Oktober sein Studium und sucht ein günstiges Zimmer in der Nähe der Uni.","answer":"b"},"items":[{"no":"13","text":"Frau Ivanova arbeitet ab März für vier Monate als Krankenschwester in der Stadt. Eigene Möbel möchte sie nicht mitbringen.","answer":"c"},{"no":"14","text":"Familie Brandt hat zwei Kinder und einen Hund. Sie braucht mehr Platz und möchte im Sommer draußen sitzen können.","answer":"f"},{"no":"15","text":"Herr und Frau Yilmaz, beide über siebzig, suchen eine Wohnung für die nächsten Jahre. Treppen sind für sie ein Problem; Geschäfte und Ärzte sollen zu Fuß erreichbar sein.","answer":"g"},{"no":"16","text":"Carla studiert und hat wenig Geld. Sie würde einem älteren Menschen gern im Alltag helfen, wenn sie dafür weniger Miete zahlt.","answer":"a"},{"no":"17","text":"Herr Becker lebt allein und arbeitet von zu Hause aus. Er braucht einen eigenen Raum für seine Arbeit und möchte nicht im Zentrum wohnen.","answer":"j"},{"no":"18","text":"Herr und Frau Klein möchten in die Innenstadt ziehen und ihre beiden Katzen mitnehmen.","answer":"0"},{"no":"19","text":"Jan ist 26 und arbeitet als Koch. Er möchte mit Leuten in seinem Alter zusammenwohnen, aber nicht mit Studenten.","answer":"i"}],"ads":[{"letter":"a","design":"notebook","header":"","tag":"","title":"WOHNEN FÜR HILFE","subtitle":"","facts":[],"body":["Ältere Menschen bieten Studierenden ein Zimmer an. Statt Miete zu zahlen, helfen Sie beim Einkaufen, im Garten oder im Haushalt: pro Quadratmeter eine Stunde im Monat. Nur die Nebenkosten zahlen Sie selbst."],"footer":"Studierendenwerk · Beratung Mo–Do 10–14 Uhr"},{"letter":"b","design":"inverse","header":"","tag":"","title":"ZIMMER FREI","subtitle":"STUDENTENWOHNHEIM AM CAMPUS","facts":[],"body":["Einzelzimmer mit eigenem Bad ab 290 Euro warm, fünf Minuten zu Fuß zur Universität. Gemeinschaftsküche auf jeder Etage, WLAN inklusive. Nur für eingeschriebene Studierende. Bewerbungen ab dem 1. Juli online."],"footer":"wohnheim-am-campus.de · ab Oktober"},{"letter":"c","design":"corp","header":"Apartmenthaus Kranich","tag":"Wohnen auf Zeit","title":"","subtitle":"","facts":[],"body":["Voll möblierte Apartments am Hauptbahnhof – mit Küche, Bettwäsche und wöchentlicher Reinigung. Für Berufstätige, die vorübergehend in der Stadt arbeiten. Mietdauer drei bis zwölf Monate. Haustiere sind leider nicht erlaubt."],"footer":"0421 / 66 70 80 · kranich-apartments.de"},{"letter":"d","design":"ticket","deco":{"stub":"7 · ALTSTADT"},"header":"","tag":"","title":"Ferienwohnung Altstadtblick","subtitle":"MITTEN IN DER ALTSTADT","facts":[],"body":["Gemütliche Zwei-Zimmer-Wohnung für zwei bis vier Gäste, buchbar für mindestens drei Nächte und höchstens drei Wochen. Hunde und Katzen sind bei uns herzlich willkommen!"],"footer":"Buchung: altstadtblick.de"},{"letter":"e","design":"classified","header":"KLEINANZEIGEN","tag":"VERMIETUNG","title":"","subtitle":"","facts":[],"body":["REIHENHAUS MIT GARTEN am Stadtpark, 5 Zimmer, 125 m², Garage, frei ab 1. September. Nur an Familien mit Kindern, keine Haustiere. Kaltmiete 1.480 Euro plus Nebenkosten."],"footer":"Tel. 0421 / 22 81 90 (ab 18 Uhr)"},{"letter":"f","design":"stamp","header":"WOHNUNGSGENOSSENSCHAFT","tag":"NEUBAU","title":"Lindenhof","subtitle":"","facts":[],"body":["Am Stadtrand entstehen Vier-Zimmer-Wohnungen für Familien mit Kindern, jede mit eigenem kleinem Garten. Spielplatz im Innenhof, Kita und Grundschule in der Nähe. Haustiere sind erlaubt. Einzug ab Herbst."],"footer":"Infotag: Samstag, 14 Uhr · Lindenhof 3"},{"letter":"g","design":"mono","header":"MIETWOHNUNG · EXPOSÉ NR. 112","tag":"","title":"Barrierefrei wohnen am Marktplatz","subtitle":"","facts":["Zimmer · 2","Wohnfläche · 58 m²","Etage · 3. OG, Aufzug","Eingang · stufenlos","Im Haus · Supermarkt, Hausarzt","Haustiere · nein","Warmmiete · 890 €"],"body":[],"footer":"Hausverwaltung Koch · 0421 / 50 40 30"},{"letter":"h","design":"speech","header":"","tag":"","title":"Mehrgenerationen-WG Sonnenwinkel","subtitle":"","facts":[],"body":["Bei uns wohnen Jung und Alt zusammen: Studierende, Berufstätige und Rentner. Jeder hat ein eigenes Zimmer mit Bad; Küche und Garten teilen wir. Gesucht: Mitbewohner, die länger bleiben und gern etwas gemeinsam unternehmen."],"footer":"Am Ortsrand · Bus alle 30 Minuten · sonnenwinkel-wg.de"},{"letter":"i","design":"browser","deco":{"button":"Antworten"},"header":"WG-BÖRSE","tag":"jetzt","title":"Zimmer frei in Berufstätigen-WG","subtitle":"","facts":[],"body":["Wir sind drei Berufstätige zwischen 25 und 32 und suchen ab Mai einen netten Mitbewohner. 16-m²-Zimmer, unmöbliert, unbefristet, 420 Euro warm. Bitte keine Studierenden. Haustiere leider nicht (Allergie)."],"footer":"Später · Antworten"},{"letter":"j","design":"dashed","header":"","tag":"","title":"3-Zimmer-Wohnung","subtitle":"STADTRAND NORD","facts":[],"body":["Helle Wohnung im 3. Stock (ohne Aufzug), ruhige Lage, Bus ins Zentrum. Ein Zimmer eignet sich als Arbeitszimmer. Ideal für Singles oder Paare. Warmmiete 960 Euro."],"footer":"Tel. 0421 / 73 12 45"}]},"t4":{"instruction":"Lesen Sie die Texte 20 bis 26. Wählen Sie: Ist die Person für ein Verbot von privatem Feuerwerk an Silvester, Ja oder Nein?","context":"In einer Zeitschrift lesen Sie Kommentare zu einem Artikel über Städte, die privates Feuerwerk an Silvester verbieten wollen.","header":"LESERKOMMENTARE","site":"www.stadtleben-magazin.de/forum","example":{"no":"0","name":"Werner","byline":"Werner, 61, Dortmund","text":"Silvester ohne Raketen? Das kann ich mir nicht vorstellen. Seit meiner Kindheit gehen wir um Mitternacht mit der ganzen Familie auf die Straße, stoßen mit den Nachbarn an und schauen in den bunten Himmel. Natürlich muss man vorsichtig sein und hinterher aufräumen. Aber einmal im Jahr darf es ruhig laut werden. Wer seine Ruhe will, kann ja für ein paar Tage aufs Land fahren.","answer":"N"},"items":[{"no":"20","name":"Sabine","byline":"Sabine, 44, Hannover","text":"Ich arbeite als Tierärztin, und für mich ist Silvester die schlimmste Nacht des Jahres. Hunde verstecken sich stundenlang unter dem Bett, Katzen laufen in Panik weg, und am Neujahrstag bringen mir Leute Vögel, die gegen Fensterscheiben geflogen sind. Ein großes Feuerwerk der Stadt, weit weg von den Wohnhäusern, wäre für mich in Ordnung. Die Knallerei in jeder einzelnen Straße muss aber endlich aufhören.","answer":"J"},{"no":"21","name":"Markus","byline":"Markus, 39, Köln","text":"Ich kann gut verstehen, dass sich viele über den Lärm und den Müll am Neujahrsmorgen ärgern. Trotzdem halte ich ein Verbot für den falschen Weg. Wer soll das in dieser Nacht kontrollieren? Die Polizei hat schon jetzt genug zu tun. Die Leute würden ihre Raketen dann eben im Ausland kaufen, und die sind oft viel gefährlicher als die geprüften Produkte bei uns.","answer":"N"},{"no":"22","name":"Eva","byline":"Eva, 52, Salzburg","text":"Statt alles zu verbieten, sollte jede Stadt Zonen festlegen: In der Altstadt und in der Nähe von Krankenhäusern und Altenheimen darf niemand Böller zünden, auf großen Plätzen und Wiesen am Stadtrand dagegen schon. So hätten alle etwas davon – die Familien, die gern feiern, und die Menschen, die ihre Ruhe brauchen. Bei uns funktioniert das seit drei Jahren erstaunlich gut.","answer":"N"},{"no":"23","name":"Dennis","byline":"Dennis, 35, Leipzig","text":"Früher habe ich jedes Jahr für mindestens hundert Euro Raketen gekauft und mich wochenlang darauf gefreut. Letztes Silvester hat dann ein Böller die Fensterscheibe im Kinderzimmer zerstört – zum Glück hat unser Sohn an diesem Abend bei den Großeltern geschlafen. Seitdem sehe ich die Sache anders: Ein paar Minuten Spaß sind dieses Risiko nicht wert. Ich hoffe, dass unsere Stadt bald handelt.","answer":"J"},{"no":"24","name":"Helga","byline":"Helga, 68, Graz","text":"Meine Enkel finden Feuerwerk wunderbar, und mein Mann würde am liebsten selbst noch Raketen in den Himmel schießen. Ich sehe das ganz anders, auch wenn ich damit in meiner Familie allein bin. Ich habe vierzig Jahre lang als Krankenschwester in der Notaufnahme gearbeitet und jedes Jahr an Silvester verbrannte Hände und verletzte Augen gesehen, oft bei Jugendlichen. Das alles muss wirklich nicht sein.","answer":"J"},{"no":"25","name":"Leonie","byline":"Leonie, 29, Bremen","text":"Ich wäre sofort dafür, wenn die Stadt stattdessen ein schönes gemeinsames Feuerwerk am Fluss organisieren würde, wie es viele andere Städte machen. Das hat unser Bürgermeister aber schon abgelehnt – zu teuer, sagt er. Dann soll man den Leuten wenigstens ihre eigenen Raketen lassen. Ein Jahreswechsel ganz ohne Lichter am Himmel wäre für viele, besonders für die Kinder, einfach traurig.","answer":"N"},{"no":"26","name":"Ralf","byline":"Ralf, 57, Kassel","text":"Am Neujahrsmorgen sieht unsere Straße jedes Mal aus wie eine Müllhalde: Papier, Plastik und Glasflaschen überall, und aufräumen müssen am Ende wir Anwohner. Dazu kommt die Luft: In dieser einen Nacht misst man so viel Feinstaub wie sonst in mehreren Wochen. Für mich ist die Sache klar: Raketen und Böller gehören nicht in die Hände von Privatleuten.","answer":"J"}]},"t5":{"instruction":"Lesen Sie die Aufgaben 27 bis 30 und den Text dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","context":"Ihr Sohn geht ab September in eine Kindertagesstätte. Sie lesen die Kita-Ordnung.","doc":{"title":"KITA-ORDNUNG · KITA SONNENBLUME","intro":"","sections":[{"heading":"Öffnungszeiten","text":"Die Kita ist montags bis freitags von 7 bis 17 Uhr geöffnet; ab 16 Uhr werden die Gruppen zusammengelegt. Bitte bringen Sie Ihr Kind bis spätestens 9 Uhr, denn dann beginnt das gemeinsame Frühstück. Wenn Sie später kommen, melden Sie sich bitte vorher telefonisch in der Gruppe."},{"heading":"Abholen","text":"Wir übergeben Kinder nur an die Eltern oder an Personen, die Sie uns bei der Anmeldung schriftlich genannt haben. Soll ausnahmsweise jemand anders Ihr Kind abholen, geben Sie uns bitte vorher eine unterschriebene Vollmacht. Die abholende Person muss außerdem einen Ausweis vorzeigen."},{"heading":"Krankheit","text":"Kranke Kinder dürfen die Kita nicht besuchen. Nach Fieber, Erbrechen oder Durchfall muss Ihr Kind mindestens 24 Stunden ohne Beschwerden gewesen sein, bevor es wiederkommt. Medikamente geben wir nur nach schriftlicher Absprache. Bitte sagen Sie bis 8.30 Uhr Bescheid, wenn Ihr Kind fehlt."},{"heading":"Essen","text":"Frühstück, Mittagessen und ein Snack am Nachmittag sind im Monatsbeitrag enthalten. Süßigkeiten geben Sie Ihrem Kind bitte nicht mit, auch nicht zum Geburtstag; dafür backen wir an diesem Tag gemeinsam in der Gruppe einen Kuchen. Allergien teilen Sie uns bitte mit einem ärztlichen Attest mit."},{"heading":"Schließzeiten","text":"In den Sommerferien bleibt die Kita drei Wochen geschlossen, außerdem zwischen Weihnachten und Neujahr. Wer in dieser Zeit keine Betreuung hat, kann sein Kind bis zum 31. März für die Notgruppe anmelden."},{"heading":"Kündigung","text":"Der Betreuungsvertrag kann mit einer Frist von drei Monaten zum Monatsende gekündigt werden. Die Kündigung muss schriftlich bei der Kita-Leitung erfolgen; eine E-Mail reicht nicht."}],"footer":""},"example":null,"items":[{"no":"27","stem":"Wenn ausnahmsweise die Großmutter das Kind abholt, …","options":{"a":"muss sie das vorher telefonisch in der Gruppe ankündigen.","b":"genügt es, wenn sie an der Tür ihren Ausweis zeigt.","c":"braucht die Kita eine schriftliche Erlaubnis der Eltern."},"answer":"c"},{"no":"28","stem":"Ein Kind, das am Montag Fieber hatte, …","options":{"a":"darf erst wiederkommen, wenn es einen Tag lang gesund war.","b":"braucht ein ärztliches Attest, bevor es wieder in die Kita darf.","c":"darf am Dienstag wiederkommen, wenn das Fieber weg ist."},"answer":"a"},{"no":"29","stem":"Zum Geburtstag eines Kindes …","options":{"a":"dürfen die Eltern Süßigkeiten für alle mitbringen.","b":"müssen die Eltern einen Kuchen backen.","c":"macht die Gruppe gemeinsam einen Kuchen."},"answer":"c"},{"no":"30","stem":"Wer in den Sommerferien arbeiten muss, …","options":{"a":"kann sein Kind ohne Anmeldung in die Notgruppe bringen.","b":"muss sich früh um einen Betreuungsplatz kümmern.","c":"zahlt in diesen Wochen einen niedrigeren Beitrag."},"answer":"b"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.","readNote":"Lesen Sie zuerst das Beispiel. Dazu haben Sie 10 Sekunden Zeit.","example":[{"no":"01","type":"rf","text":"Herr Hofmann kann sein Auto heute abholen.","answer":"R"},{"no":"02","type":"abc","stem":"Herr Hofmann soll …","options":{"a":"vorher in der Werkstatt anrufen.","b":"den Ersatzschlüssel mitbringen.","c":"die Rechnung überweisen."},"answer":"a"}],"texts":[{"label":"Text 1","items":[{"no":"1","type":"rf","text":"Auf der Talabfahrt kann man heute bis ganz nach unten fahren.","answer":"F"},{"no":"2","type":"abc","stem":"Die Kinder der Skischule …","options":{"a":"treffen sich heute an einem anderen Ort.","b":"haben heute Nachmittag keinen Kurs.","c":"beginnen ihren Kurs heute später als sonst."},"answer":"a"}]},{"label":"Text 2","items":[{"no":"3","type":"rf","text":"Die Trauung findet früher statt, als Tim dachte.","answer":"R"},{"no":"4","type":"abc","stem":"Tim soll …","options":{"a":"mit dem eigenen Auto zum Gasthof fahren.","b":"etwas für die neue Wohnung des Paares kaufen.","c":"Mara am Samstag Geld für das Paar geben."},"answer":"c"}]},{"label":"Text 3","items":[{"no":"5","type":"rf","text":"Die Anrufer melden einen Einbruch in der Wohnung der Angerufenen.","answer":"F"},{"no":"6","type":"abc","stem":"Wer so einen Anruf bekommt, soll …","options":{"a":"die Rückruftaste drücken und bei der Polizei nachfragen.","b":"auflegen und selbst die Polizei anrufen.","c":"Wertsachen nur einem Polizisten in Uniform geben."},"answer":"b"}]},{"label":"Text 4","items":[{"no":"7","type":"rf","text":"Die Führung beginnt heute zu einer anderen Uhrzeit als sonst.","answer":"R"},{"no":"8","type":"abc","stem":"Die Schließfächer …","options":{"a":"kosten heute einen Euro pro Fach.","b":"sind heute wegen der Veranstaltung geschlossen.","c":"kosten am Ende nichts."},"answer":"c"}]},{"label":"Text 5","items":[{"no":"9","type":"rf","text":"An einem Tag pro Woche ist das Fundbüro auch nachmittags geöffnet.","answer":"R"},{"no":"10","type":"abc","stem":"Frau Nowak muss …","options":{"a":"beim Abholen ein wenig Geld bezahlen.","b":"dem Finder einen Finderlohn zahlen.","c":"vorher anrufen und einen Termin machen."},"answer":"a"}]}]},"t2":{"instruction":"Sie hören nun einen Text. Sie hören den Text einmal. Dazu lösen Sie fünf Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","readNote":"Lesen Sie jetzt die Aufgaben 11 bis 15. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie helfen als Freiwillige oder Freiwilliger beim Stadtlauf. Vor dem Start erklärt Frau Wagner vom Organisationsteam die Aufgaben.","items":[{"no":"11","stem":"Die Becher …","options":{"a":"sollen möglichst voll sein.","b":"geben die Helfer den Läufern auf der Straße.","c":"füllt man nur bis zur Hälfte."},"answer":"c"},{"no":"12","stem":"Nach dem letzten Läufer …","options":{"a":"holen die Helfer den Müll mit einem Auto ab.","b":"räumen die Helfer ihre Station selbst auf.","c":"ist die Arbeit der Helfer sofort zu Ende."},"answer":"b"},{"no":"13","stem":"Wenn es einem Läufer schlecht geht, sollen die Helfer …","options":{"a":"nicht von seiner Seite gehen, bis Hilfe kommt.","b":"ihm etwas gegen die Schmerzen zu schlucken geben.","c":"ihn selbst zur nächsten Station bringen."},"answer":"a"},{"no":"14","stem":"Ein Mittagessen …","options":{"a":"bekommen die Helfer direkt an ihrer Station.","b":"gibt es für die Helfer im Zelt am Start.","c":"gibt es für die Helfer erst am Nachmittag."},"answer":"c"},{"no":"15","stem":"Wer mit dem Auto da ist, …","options":{"a":"soll sein Auto jetzt woanders abstellen.","b":"darf den ganzen Tag an der Turnhalle stehen bleiben.","c":"bekommt von den Gruppenleitern einen Parkausweis."},"answer":"a"}]},"t3":{"instruction":"Sie hören nun ein Gespräch. Sie hören das Gespräch einmal. Dazu lösen Sie sieben Aufgaben. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","readNote":"Lesen Sie jetzt die Aufgaben 16 bis 22. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie sind auf dem Wochenmarkt und hören, wie sich zwei frühere Schulfreunde, Tanja und Martin, unterhalten.","items":[{"no":"16","text":"Tanja hat sich selbst für die Quizshow angemeldet.","answer":"F"},{"no":"17","text":"Vor der Einladung wurde Tanjas Wissen geprüft.","answer":"R"},{"no":"18","text":"Als die Kameras liefen, war Tanja weniger aufgeregt.","answer":"R"},{"no":"19","text":"Tanjas Mann konnte ihr bei der Frage über Fußball helfen.","answer":"F"},{"no":"20","text":"Seit Martin nicht mehr raucht, ist er schwerer geworden.","answer":"R"},{"no":"21","text":"Martins Arzt hat ihn dazu gebracht, mit dem Rauchen aufzuhören.","answer":"F"},{"no":"22","text":"Seit dem Neujahrstag hat Martin keine einzige Zigarette mehr geraucht.","answer":"F"}]},"t4":{"instruction":"Sie hören nun eine Diskussion. Sie hören die Diskussion zweimal. Dazu lösen Sie acht Aufgaben. Ordnen Sie die Aussagen zu: Wer sagt was?","readNote":"Lesen Sie jetzt die Aussagen 23 bis 30. Dazu haben Sie 60 Sekunden Zeit.","context":"Die Moderatorin der Radiosendung „Standpunkte“ diskutiert mit der Hotelbesitzerin Ulrike Sander und dem Reiseblogger Felix Navarro über die Frage: „Kann man Bewertungen im Internet trauen?“","speakers":{"a":"Moderatorin","b":"Ulrike Sander","c":"Felix Navarro"},"example":{"no":"0","text":"Viele Menschen informieren sich im Internet, bevor sie sich entscheiden.","answer":"a"},"items":[{"no":"23","text":"Eine einzige falsche Bewertung hat dem Betrieb deutlich geschadet.","answer":"b"},{"no":"24","text":"Gäste beschreiben ein Hotel realistischer als das Hotel selbst.","answer":"c"},{"no":"25","text":"Ein Teil der Kommentare im Netz stammt nicht von echten Kunden.","answer":"a"},{"no":"26","text":"Manche Gäste versuchen, mit Bewertungen Druck zu machen.","answer":"b"},{"no":"27","text":"Bewertungen ohne sehr gute oder sehr schlechte Noten sind oft am hilfreichsten.","answer":"c"},{"no":"28","text":"Es lohnt sich, auf negative Kommentare öffentlich zu reagieren.","answer":"b"},{"no":"29","text":"Für Buchungsportale gelten inzwischen strengere Regeln.","answer":"a"},{"no":"30","text":"Man sollte sich bei der Wahl nicht allein auf Bewertungen verlassen.","answer":"c"}]}},"schreiben":{"intro":"Das Modul Schreiben besteht aus drei Teilen. In den Aufgaben 1 und 3 schreiben Sie E-Mails, in Aufgabe 2 schreiben Sie einen Diskussionsbeitrag. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf den Antwortbogen.","tasks":[{"no":1,"minutes":20,"words":80,"situation":["Sie haben vor einem Monat mit einem Tanzkurs angefangen. Ein Freund/Eine Freundin von Ihnen weiß noch nichts davon."],"points":["Beschreiben Sie: Wie ist der Kurs?","Begründen Sie: Warum haben Sie mit dem Tanzen angefangen?","Machen Sie einen Vorschlag, wie er/sie den Kurs kennenlernen kann."],"post":null,"instruction":"Schreiben Sie eine E-Mail (circa 80 Wörter). Schreiben Sie etwas zu allen drei Punkten. Achten Sie auf den Textaufbau (Anrede, Einleitung, Reihenfolge der Inhaltspunkte, Schluss).","model":{"label":"E-Mail an eine Freundin, ca. 90 Wörter","text":"Betreff: Ich tanze jetzt!\n\nLiebe Jana,\n\nstell dir vor: Seit einem Monat gehe ich jeden Mittwoch zu einem Salsakurs! Wir sind zwölf Leute, und unser Lehrer kommt aus Kuba. Er ist sehr geduldig, auch wenn ich ihm manchmal auf die Füße trete.\n\nAngefangen habe ich, weil ich den ganzen Tag am Schreibtisch und abends nur auf dem Sofa saß. Beim Tanzen bewege ich mich und lerne gleichzeitig neue Leute kennen.\n\nAm 12. Mai gibt es eine kostenlose Probestunde. Komm doch mit, dann kannst du es selbst ausprobieren!\n\nViele Grüße\nSofia"},"typicalErrors":"Nur der Kurs wird beschrieben, der Grund fehlt · Vorschlag ohne Zeitpunkt · Sie statt du."},{"no":2,"minutes":25,"words":80,"situation":["Sie haben im Fernsehen eine Sendung zum Thema „Markenkleidung für Kinder – muss das sein?“ gesehen. Im Online-Gästebuch der Sendung finden Sie folgende Meinung:"],"points":[],"post":{"site":"www.tv-elternforum.de","label":"Gästebuch","author":"Martina · 15.03. 21:02 Uhr","text":"Meine Tochter ist 14 und will nur noch Kleidung von bestimmten Marken tragen. Eine Jacke kostet dann schnell 200 Euro, und ehrlich gesagt sehe ich kaum einen Unterschied. Aber sie sagt, ohne die richtigen Marken wird sie in der Schule ausgelacht. Soll ich nachgeben?"},"instruction":"Schreiben Sie nun Ihre Meinung zum Thema (circa 80 Wörter).","model":{"label":"Diskussionsbeitrag, ca. 95 Wörter","text":"Martina spricht ein Problem an, das viele Eltern kennen. Ich verstehe, dass Jugendliche dazugehören möchten. Mit 14 ist es sehr wichtig, was die anderen in der Klasse denken.\n\nTrotzdem finde ich, dass Eltern nicht alles bezahlen müssen. Eine Idee wäre, dass Martina einen festen Betrag gibt, zum Beispiel so viel, wie eine normale Jacke kostet. Den Rest kann ihre Tochter vom Taschengeld oder mit einem kleinen Job bezahlen. So lernt sie, was Dinge wirklich kosten.\n\nIch selbst habe als Jugendliche auch lange für eine teure Jeans gespart – und sie danach viel besser gepflegt."},"typicalErrors":"Martinas Beitrag nur zusammenfassen, statt eine eigene Meinung zu schreiben · keine Beispiele · deutlich unter 80 Wörtern."},{"no":3,"minutes":15,"words":40,"situation":["Sie haben am Donnerstag um 10 Uhr einen Termin bei Ihrer Zahnärztin, Frau Dr. Hartwig. Sie können zu diesem Termin aber nicht kommen."],"points":[],"post":null,"instruction":"Schreiben Sie an Frau Dr. Hartwig. Entschuldigen Sie sich höflich, nennen Sie den Grund und bitten Sie um einen neuen Termin. Schreiben Sie eine E-Mail (circa 40 Wörter). Vergessen Sie nicht die Anrede und den Gruß am Schluss.","model":{"label":"E-Mail an die Zahnarztpraxis, ca. 45 Wörter","text":"Sehr geehrte Frau Dr. Hartwig,\n\nleider kann ich am Donnerstag um 10 Uhr nicht zu meinem Termin kommen, weil ich kurzfristig für eine kranke Kollegin auf eine Messe fahren muss. Das tut mir sehr leid. Könnten Sie mir bitte einen neuen Termin geben, am besten nächste Woche am Nachmittag?\n\nMit freundlichen Grüßen\nKarim Aziz"},"typicalErrors":"Keine Bitte um einen neuen Termin · Hallo Frau Hartwig oder Liebe Grüße · kein Grund genannt."}]},"audio":[{"src":"Goethe%20B1%20Modelltest%206.1.mp3","dur":588.07},{"src":"Goethe%20B1%20Modelltest%206.2.mp3","dur":265.12},{"src":"Goethe%20B1%20Modelltest%206.3.mp3","dur":237.66},{"src":"Goethe%20B1%20Modelltest%206.4.mp3","dur":571.4}],"pdf":"Goethe%20B1%20Modelltest%206.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"7":{"id":7,"roman":"VII","lesen":{"t1":{"instruction":"Lesen Sie den Text und die Aufgaben 1 bis 6 dazu. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","blog":{"site":"tagebuch-einer-pendlerin.de · Miriam","date":"Mittwoch, 6. März","title":"Plötzlich Ersthelferin","paragraphs":["Ich habe lange überlegt, ob ich darüber schreiben soll. Aber vielleicht bringt es ja jemanden dazu, einen Erste-Hilfe-Kurs zu machen. Mein letzter Kurs lag zwanzig Jahre zurück – damals, für den Führerschein. Im Januar hat dann meine Firma einen Auffrischungskurs angeboten, während der Arbeitszeit und kostenlos. Ehrlich gesagt habe ich mich nur angemeldet, weil ich so einen Nachmittag lang keine E-Mails beantworten musste.","Der Trainer war früher Rettungssanitäter und hat uns vor allem eines beigebracht: Das Schlimmste ist, gar nichts zu tun. Dann haben wir an Puppen geübt, wie man richtig auf den Brustkorb drückt – hundertmal pro Minute, fünf bis sechs Zentimeter tief. Nach zehn Minuten taten mir die Arme weh. Am Ende hat jeder von uns einmal den Defibrillator ausprobiert – das Gerät sagt einem sogar, was man tun soll.","Genau drei Wochen später stand ich morgens beim Bäcker in der Schlange, als vor mir ein älterer Mann einfach umfiel. Er atmete nicht mehr. Für einen Moment standen alle nur da. Dann habe ich der Verkäuferin zugerufen, sie solle den Notruf wählen, und angefangen zu drücken. Ein junger Mann hat aus der Apotheke gegenüber einen Defibrillator geholt – ich wusste nicht einmal, dass es dort einen gibt.","Bis der Rettungswagen kam, hat es acht Minuten gedauert. Mir kam es vor wie eine Stunde. Als die Sanitäter übernommen hatten, zitterten meine Knie so, dass ich mich auf den Boden setzen musste. Zur Arbeit bin ich an diesem Tag nicht mehr gegangen.","Vorgestern klingelte es dann an meiner Tür. Draußen stand Herr Wendt, der Mann vom Bäcker, mit einem riesigen Blumenstrauß. Seine Tochter hatte über die Bäckerei herausgefunden, wer ich bin. Er lag zwei Wochen im Krankenhaus und bekommt jetzt einen Herzschrittmacher. „Ohne Sie wäre ich nicht mehr hier“, hat er gesagt. Da musste ich weinen.","Meine Firma will mich jetzt zur Ersthelferin für unsere Abteilung ausbilden lassen, und ich habe Ja gesagt. Auf eine Ausbildung zur Sanitäterin, wie mein Mann vorschlägt, habe ich aber keine Lust – so ein Morgen reicht mir für mein ganzes Leben. Macht bitte alle einen Kurs. Er dauert nur einen Tag."],"closing":"Eure Miriam"},"example":{"no":"0","text":"Miriam hat vor Kurzem einen Erste-Hilfe-Kurs gemacht.","answer":"R"},"items":[{"no":"1","text":"Der Kurs fand nicht in Miriams Freizeit statt.","answer":"R"},{"no":"2","text":"Im Kurs hat Miriam vor allem theoretisches Wissen gelernt.","answer":"F"},{"no":"3","text":"Miriam hat selbst den Rettungsdienst alarmiert.","answer":"F"},{"no":"4","text":"Nach dem Einsatz ging es Miriam selbst nicht gut.","answer":"R"},{"no":"5","text":"Herr Wendt hat sich bei Miriam persönlich bedankt.","answer":"R"},{"no":"6","text":"Miriam möchte eine Ausbildung zur Sanitäterin machen.","answer":"F"}]},"t2":{"texts":[{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 7 bis 9 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Die Ärztin kommt per Bildschirm","lead":"In Krummbach hat seit einem Jahr eine Gesundheitsstation die Arztpraxis ersetzt.","paragraphs":["Als Dr. Helmut Reiners vor zwei Jahren in Rente ging, stand Krummbach ohne Arzt da. Einen Nachfolger für die Praxis fand das Dorf mit seinen 1.800 Einwohnern nicht, und die nächste Hausarztpraxis liegt 25 Kilometer entfernt. Seit einem Jahr gibt es in den alten Praxisräumen nun eine Gesundheitsstation. Dort arbeitet die Krankenschwester Anja Fuchs. Sie misst Blutdruck, wechselt Verbände und nimmt Blut ab. Für viele Patienten ist sie inzwischen die wichtigste Ansprechpartnerin, auch wenn es nur um eine Frage zu ihren Tabletten geht. Wenn nötig, verbindet sie die Patienten per Video mit einer Ärztin in der Kreisstadt, die dann Medikamente verschreiben kann. Das Rezept liegt eine Stunde später in der Apotheke im Ort. Geöffnet ist die Station dienstags und donnerstags von 8 bis 13 Uhr; einen Termin muss man vorher telefonisch vereinbaren. Viele ältere Krummbacher waren am Anfang skeptisch. „Ich will keinen Fernseher, ich will einen Arzt“, sagte ein Rentner bei der Eröffnung. Inzwischen kommt er jede Woche. Wer nicht mehr Auto fahren kann, wird von Nachbarn gebracht. Für Notfälle ist die Station allerdings nicht gedacht; dann muss man weiterhin die 112 wählen. Bezahlt wird das Projekt zunächst für drei Jahre von der Krankenkasse und vom Land. Der Bürgermeister hofft trotzdem, dass sich irgendwann wieder ein Arzt im Dorf niederlässt – die Wohnung über der Praxis hält die Gemeinde dafür frei."],"footnote":"","source":"aus einer deutschen Zeitung","example":{"no":"0","stem":"Dr. Reiners …","options":{"a":"arbeitet jetzt in der Kreisstadt.","b":"hat aufgehört zu arbeiten.","c":"hat die Gesundheitsstation gegründet."},"answer":"b"},"items":[{"no":"7","stem":"In diesem Text geht es um …","options":{"a":"einen Arzt, der in einem Dorf eine neue Praxis eröffnet.","b":"ein Dorf, das ohne eigene Arztpraxis versorgt wird.","c":"eine Krankenschwester, die Patienten zu Hause besucht."},"answer":"b"},{"no":"8","stem":"In der Gesundheitsstation …","options":{"a":"bekommt man Rezepte, ohne wegzufahren.","b":"werden auch Notfälle direkt von der Krankenschwester behandelt.","c":"kann man jederzeit auch ohne vorherige Anmeldung vorbeikommen."},"answer":"a"},{"no":"9","stem":"Die Gemeinde …","options":{"a":"bezahlt das ganze Projekt ohne Hilfe von außen.","b":"will die Räume der alten Praxis möglichst bald verkaufen.","c":"hält für einen künftigen Arzt eine Unterkunft bereit."},"answer":"c"}]},{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 10 bis 12 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Wenn der Pager piepst","lead":"In vielen Schweizer Dörfern fehlen der Feuerwehr Leute – Rüti geht neue Wege.","paragraphs":["In Rüti im Zürcher Oberland löschen keine Berufsfeuerwehrleute die Brände, sondern Nachbarn: der Bäcker, die Lehrerin, der Landwirt. Wie in den meisten Schweizer Gemeinden ist die Feuerwehr hier eine Milizfeuerwehr – die Mitglieder haben einen normalen Beruf und rücken nur aus, wenn ihr Pager piepst. Insgesamt gehören 48 Frauen und Männer dazu; im Jahr gibt es rund 80 Einsätze, vom Küchenbrand bis zum umgestürzten Baum. Das Problem: Tagsüber arbeiten viele von ihnen nicht mehr im Dorf, sondern in Zürich oder Winterthur. „Bei einem Alarm um zehn Uhr morgens hatten wir manchmal nur vier Leute“, sagt Kommandant Beat Keller. Deshalb hat die Gemeinde mit den Firmen im Ort eine Vereinbarung getroffen: Wer Pikett* hat, darf während der Arbeit jederzeit weggehen, und die Gemeinde bezahlt dem Arbeitgeber die verlorene Arbeitszeit. Ausserdem wirbt die Feuerwehr gezielt um Frauen und um Menschen, die neu ins Dorf gezogen sind. Mit Erfolg: Seit letztem Jahr sind elf neue Mitglieder dazugekommen, darunter fünf Frauen. Die Jüngste ist 19 und studiert in Zürich. Neue besuchen zuerst einen Grundkurs an drei Wochenenden; danach gibt es jeden zweiten Dienstag eine Übung. Für jeden Einsatz erhalten die Mitglieder 30 Franken pro Stunde. Schwierig bleibt die Nacht: Wer kleine Kinder hat, kann nicht einfach aus dem Haus laufen. Ab dem nächsten Jahr will Rüti deshalb mit der Feuerwehr des Nachbardorfs zusammenarbeiten."],"footnote":"*Pikett = Schweizer Standard für „Bereitschaftsdienst“","source":"aus einer Schweizer Zeitung","example":null,"items":[{"no":"10","stem":"In diesem Text geht es um …","options":{"a":"ein Dorf, das für seine Feuerwehr Lösungen sucht.","b":"eine Feuerwehr, die nur noch aus Frauen besteht.","c":"Firmen, die ihre Mitarbeiter zu Feuerwehrleuten ausbilden."},"answer":"a"},{"no":"11","stem":"Wer an einem Tag für Einsätze eingeteilt ist, …","options":{"a":"muss sich für diesen Tag bei der Arbeit freinehmen.","b":"bekommt dafür von seinem Chef einen höheren Lohn.","c":"darf bei Alarm sofort die Arbeit verlassen."},"answer":"c"},{"no":"12","stem":"Ein Problem ist, dass …","options":{"a":"die neuen Mitglieder für Einsätze zu wenig Geld bekommen.","b":"Eltern in der Nacht oft nicht kommen können.","c":"die Übungen nur am Wochenende stattfinden."},"answer":"b"}]}]},"t3":{"instruction":"Lesen Sie die Situationen 13 bis 19 und die Anzeigen a bis j aus verschiedenen deutschsprachigen Medien. Wählen Sie: Welche Anzeige passt zu welcher Situation? Sie können jede Anzeige nur einmal verwenden. Die Anzeige aus dem Beispiel können Sie nicht mehr verwenden. Für eine Situation gibt es keine passende Anzeige. In diesem Fall schreiben Sie 0.","context":"Einige Ihrer Bekannten suchen für ihre Kinder ein Freizeitangebot.","example":{"no":"0","text":"Frau Kraus möchte, dass ihr Sohn (8) ein Instrument lernt.","answer":"b"},"items":[{"no":"13","text":"Lea ist zwölf und interessiert sich für Computer. Sie möchte lernen, wie man selbst ein kleines Spiel entwickelt.","answer":"e"},{"no":"14","text":"Herr Novak braucht für seine Zwillinge (9) in der ersten Woche der Sommerferien eine Betreuung, während er arbeitet.","answer":"h"},{"no":"15","text":"Paul (10) ist sehr schüchtern. Seine Eltern wünschen sich, dass er lernt, vor anderen Menschen sicherer aufzutreten.","answer":"c"},{"no":"16","text":"Familie Sahin möchte am Wochenende mit ihren Kindern (5 und 7) zusammen etwas Kreatives machen.","answer":"g"},{"no":"17","text":"Mia (14) liebt Tiere und möchte sich regelmäßig um sie kümmern. Auf ein Pferd will sie sich aber nicht setzen.","answer":"j"},{"no":"18","text":"Jonas ist 16. Er möchte in einer Halle klettern lernen.","answer":"0"},{"no":"19","text":"Frau Ostermann sucht für ihre Tochter (11) ein wöchentliches Angebot im Freien, bei dem sie andere Kinder kennenlernt.","answer":"d"}],"ads":[{"letter":"a","design":"dashed","header":"","tag":"","title":"Reiterhof Sonnental","subtitle":"REITUNTERRICHT FÜR KINDER","facts":["30 Minuten · 18 €","45 Minuten · 25 €","60 Minuten · 32 €"],"body":["Kinder ab 6 Jahren lernen bei uns auf freundlichen Ponys reiten. Wir unterrichten ausschließlich in Einzelstunden, damit jedes Kind in seinem eigenen Tempo lernt. Helm und Stiefel können ausgeliehen werden."],"footer":"Anmeldung: 0421 / 61 22 30"},{"letter":"b","design":"barhead","header":"","tag":"","title":"Städtische Musikschule","subtitle":"INSTRUMENTALUNTERRICHT AB 6 JAHREN","facts":[],"body":["Gitarre, Klavier, Geige oder Schlagzeug: Bei uns lernen Kinder ein Instrument – im Einzelunterricht, einmal pro Woche. Die erste Stunde ist eine kostenlose Probestunde. Instrumente kann man für die ersten sechs Monate mieten."],"footer":"musikschule-stadt.de · Mo–Fr 9–12 Uhr","deco":{"icon":"note"}},{"letter":"c","design":"stripes","header":"","tag":"","title":"BÜHNE FREI!","subtitle":"THEATERKURS · 8 BIS 12 JAHRE","facts":[],"body":["Jeden Dienstag von 16 bis 17.30 Uhr im Jugendhaus lernen Kinder spielerisch, laut und deutlich zu sprechen und vor Publikum aufzutreten. Am Ende des Halbjahres zeigen wir ein eigenes Stück."],"footer":"Anmeldung im Jugendhaus"},{"letter":"d","design":"rounded","header":"","tag":"","title":"Pfadfinderstamm Adler","subtitle":"ALLZEIT BEREIT","facts":[],"body":["Jeden Freitag um 16 Uhr treffen sich bei uns Mädchen und Jungen von 10 bis 13 Jahren. Wir bauen Hütten im Wald, kochen am Lagerfeuer und lernen, uns mit Karte und Kompass zu orientieren."],"footer":"Schnuppern ohne Anmeldung · Waldweg 4"},{"letter":"e","design":"browser","header":"","tag":"","title":"// CODING-CLUB","subtitle":"für 11- bis 15-Jährige","facts":[],"body":["Wir programmieren eigene Spiele und kleine Apps.","Jeden Donnerstag, 17–19 Uhr, in der Stadtbibliothek.","Vorkenntnisse? Nicht nötig.","Laptops sind vorhanden, die Teilnahme ist kostenlos."],"footer":"> anmelden: coding-club.de","deco":{"url":"coding-club.txt"}},{"letter":"f","design":"band","header":"KLETTERHALLE","tag":"","title":"GIPFELSTÜRMER","subtitle":"KINDERKLETTERN","facts":[],"body":["In kleinen Gruppen lernen Kinder von 6 bis 12 Jahren mit erfahrenen Trainern sicheres Klettern. Jeden Samstag von 10 bis 12 Uhr. Achtung: Unser Kursangebot gilt nur für Kinder bis 12 Jahre."],"footer":"gipfelstuermer-halle.de"},{"letter":"g","design":"serif","header":"Töpferwerkstatt","tag":"","title":"Lehm & Glut","subtitle":"TÖPFERN FÜR GROSS UND KLEIN","facts":[],"body":["Jeden Samstagvormittag gestalten Eltern und Kinder ab 4 Jahren gemeinsam Schalen, Tassen und Figuren. Ton und Brennen sind im Preis enthalten."],"footer":"15 Euro pro Person · Mühlenstraße 9"},{"letter":"h","design":"timetable","header":"","tag":"1. WOCHE DER SOMMERFERIEN","title":"Ferienspaß im Jugendhaus","subtitle":"","facts":["Mo 8–16","Di 8–16","Mi 8–16","Do 8–16","Fr 8–16","Sa –","So –"],"body":["Für Kinder von 6 bis 12 Jahren: Spiele, Ausflüge ins Schwimmbad und ein gemeinsames Mittagessen, betreut von ausgebildeten Pädagogen. 90 Euro für die ganze Woche."],"footer":""},{"letter":"i","design":"mono","header":"*** SPIELECAFÉ ***","tag":"","title":"WÜRFELGLÜCK","subtitle":"","facts":["Sa + So · 11–20 Uhr","Spielen p. P. · 3,00 €","Kinder unter 6 · frei"],"body":["Über 500 Brett- und Kartenspiele für die ganze Familie","Waffeln & Kakao gibt es auch!"],"footer":""},{"letter":"j","design":"pinned","header":"","tag":"","title":"TIERSCHUTZJUGEND","subtitle":"","facts":[],"body":["Du bist zwischen 12 und 17 und magst Tiere? Jeden Mittwochnachmittag hilfst du uns im Tierheim beim Füttern, machst die Gehege sauber und gehst mit unseren Hunden spazieren. Dabei lernst du viel über Tierschutz."],"footer":"Tierheim Am Mühlbach · tierheim-muehlbach.de"}]},"t4":{"instruction":"Lesen Sie die Texte 20 bis 26. Wählen Sie: Ist die Person für ein Wahlrecht ab 16, Ja oder Nein?","context":"In einer Zeitschrift lesen Sie Kommentare zu einem Artikel über die Frage, ob Jugendliche schon mit 16 Jahren wählen dürfen sollen.","header":"LESERKOMMENTARE","site":"www.politik-im-alltag.de/forum","example":{"no":"0","name":"Johanna","byline":"Johanna, 17, Rostock","text":"Mit 16 darf ich arbeiten, Steuern zahlen und selbst entscheiden, welche Ausbildung ich mache. Nur bei der Frage, wer unser Land regiert, darf ich nicht mitreden. Das verstehe ich nicht. Viele in meiner Klasse lesen mehr Nachrichten als ihre Eltern. Gebt uns endlich die Möglichkeit, unsere Meinung auch bei Wahlen zu zeigen. Schließlich geht es auch um unsere Zukunft.","answer":"J"},"items":[{"no":"20","name":"Gerhard","byline":"Gerhard, 70, Ulm","text":"Ich habe vier Enkel zwischen 14 und 20, und ich mag junge Leute sehr. Aber mit 16 ist man noch leicht zu beeinflussen – von Freunden, von Videos im Internet, manchmal auch von den Lehrern. Man darf mit 16 ja auch noch kein Auto fahren und keinen Vertrag ohne die Eltern unterschreiben. Warum sollte man dann schon über die Regierung entscheiden?","answer":"N"},{"no":"21","name":"Svenja","byline":"Svenja, 45, Bonn","text":"Ich unterrichte seit fünfzehn Jahren Politik an einer Gesamtschule. Meine Schülerinnen und Schüler diskutieren oft ernsthafter über Themen wie Wohnungsnot oder Klimaschutz als viele Erwachsene, die ich kenne. Viele engagieren sich in der Schülervertretung oder in Umweltgruppen, ohne dass sie jemand dazu auffordert. Wer sie fragt, bekommt kluge Antworten. Es wird höchste Zeit, dass ihre Stimme auch auf dem Wahlzettel zählt.","answer":"J"},{"no":"22","name":"Murat","byline":"Murat, 19, Bielefeld","text":"Natürlich ist es gut, wenn sich junge Menschen für Politik interessieren – ich war mit 16 selbst bei jeder Demonstration dabei. Trotzdem glaube ich, dass 18 die richtige Grenze ist. Mit 16 wohnen fast alle noch bei den Eltern und kennen viele Probleme nur aus der Ferne. Ein, zwei Jahre mehr Erfahrung schaden niemandem. Wählen kann man dann noch lange genug.","answer":"N"},{"no":"23","name":"Nicole","byline":"Nicole, 41, Mainz","text":"Ich wäre sofort dafür, wenn Jugendliche in der Schule vorher richtig lernen würden, wie unser politisches System funktioniert. Davon ist an der Schule meines Sohnes aber nichts zu sehen: Politik steht dort in der neunten Klasse gerade einmal eine Stunde pro Woche auf dem Stundenplan, und oft fällt sie aus. Unter diesen Bedingungen sollte man das Wahlalter lieber nicht senken.","answer":"N"},{"no":"24","name":"Lukas","byline":"Lukas, 16, Kiel","text":"Meine Eltern sagen immer, junge Leute interessieren sich sowieso nicht für Politik. Ich sehe das ganz anders. Ich bin 16, lese jeden Tag Nachrichten und engagiere mich im Jugendparlament unserer Stadt. Dort entscheiden wir sogar über ein eigenes Budget für Projekte. Wenn wir das können, können wir auch einen Stimmzettel ausfüllen. Politikmüde Menschen gibt es übrigens in jedem Alter.","answer":"J"},{"no":"25","name":"Brigitte","byline":"Brigitte, 63, Graz","text":"Als Österreich 2007 das Wahlalter auf 16 gesenkt hat, war ich strikt dagegen. Ich dachte, die Jugendlichen wählen dann nur, was gerade im Internet modern ist. Heute sehe ich das ganz anders: Meine Enkelin hat sich vor ihrer ersten Wahl wochenlang informiert und mir mehr über die Parteien erklärt als jede Zeitung. Ich möchte es auf keinen Fall wieder ändern.","answer":"J"},{"no":"26","name":"Paul","byline":"Paul, 52, Essen","text":"Wir reden ständig darüber, dass sich junge Menschen mehr engagieren sollen. Gleichzeitig lassen wir sie bei den wichtigsten Entscheidungen außen vor. In einigen Bundesländern dürfen 16-Jährige schon heute den Landtag wählen, und nach allem, was man hört, mit großem Interesse. Wer mit 16 eine Ausbildung macht und Sozialabgaben zahlt, sollte auch mitbestimmen dürfen. Ich sehe keinen Grund, warum das nicht auch bundesweit gelten sollte.","answer":"J"}]},"t5":{"instruction":"Lesen Sie die Aufgaben 27 bis 30 und den Text dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","context":"Sie möchten in einem Baumarkt Werkzeug ausleihen und lesen die Mietbedingungen.","doc":{"title":"MIETBEDINGUNGEN · WERKZEUGVERLEIH HAMMER & CO","intro":"","sections":[{"heading":"Voraussetzungen","text":"Werkzeug ausleihen kann, wer mindestens 18 Jahre alt ist. Bitte bringen Sie Ihren Personalausweis mit; ohne Ausweis können wir leider nichts verleihen. Firmenkunden benötigen zusätzlich eine Kopie ihrer Gewerbeanmeldung."},{"heading":"Mietdauer und Preise","text":"Die Geräte werden tageweise vermietet. Wer ein Gerät am Samstag ab 12 Uhr abholt und am Montag bis 10 Uhr zurückbringt, zahlt nur den Preis für einen Tag (Wochenendtarif). Feiertage werden nicht berechnet. Eine Reservierung ist telefonisch oder online bis zu zwei Wochen im Voraus möglich."},{"heading":"Kaution","text":"Für jedes Gerät hinterlegen Sie eine Kaution von 50 bis 200 Euro, je nach Wert. Sie erhalten die Kaution bei der Rückgabe zurück, wenn das Gerät vollständig und unbeschädigt ist. Fehlt ein Zubehörteil, behalten wir einen Teil der Kaution ein."},{"heading":"Zahlung","text":"Die Miete bezahlen Sie bei der Abholung, bar oder mit Karte. Die Kaution kann nur bar hinterlegt werden."},{"heading":"Einweisung","text":"Bei Maschinen wie Fliesenschneidern und Bohrhämmern erklärt Ihnen unser Personal vor der Ausleihe, wie das Gerät funktioniert. Diese Einweisung ist kostenlos, aber Pflicht; planen Sie dafür etwa 15 Minuten ein."},{"heading":"Rückgabe","text":"Bitte bringen Sie die Geräte gereinigt zurück; für stark verschmutzte Geräte berechnen wir 15 Euro. Wenn Sie ein Gerät länger brauchen, rufen Sie uns bitte vor Ablauf der Mietzeit an. Bei verspäteter Rückgabe ohne Anruf berechnen wir einen zusätzlichen Miettag."},{"heading":"Schäden","text":"Melden Sie Defekte bitte sofort und reparieren Sie die Geräte nicht selbst. Für Schäden durch falsche Bedienung haften Sie selbst. Verschleißteile wie Sägeblätter und Bohrer stellen wir extra in Rechnung."}],"footer":""},"example":null,"items":[{"no":"27","stem":"Ein 17-Jähriger, der eine Bohrmaschine braucht, …","options":{"a":"kann sie mit seinem eigenen Personalausweis ausleihen.","b":"darf das Gerät noch nicht selbst mieten.","c":"muss eine höhere Kaution hinterlegen."},"answer":"b"},{"no":"28","stem":"Wer ein Gerät am Wochenende braucht, …","options":{"a":"kann von einem günstigeren Tarif profitieren.","b":"muss es mindestens zwei Wochen vorher reservieren.","c":"bekommt die Kaution erst am Montag zurück."},"answer":"a"},{"no":"29","stem":"Bevor man einen Bohrhammer mitnehmen darf, …","options":{"a":"muss man für eine Erklärung bezahlen.","b":"muss man eine Kopie der Gewerbeanmeldung vorlegen.","c":"muss man sich das Gerät erklären lassen."},"answer":"c"},{"no":"30","stem":"Wer ein Gerät später zurückbringen möchte, …","options":{"a":"sollte vorher Bescheid sagen.","b":"muss es vorher reinigen lassen.","c":"bekommt die Kaution nicht zurück."},"answer":"a"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.","readNote":"Lesen Sie zuerst das Beispiel. Dazu haben Sie 10 Sekunden Zeit.","example":[{"no":"01","type":"rf","text":"Frau Berg kann ihre neue Brille ab morgen abholen.","answer":"R"},{"no":"02","type":"abc","stem":"Frau Berg soll …","options":{"a":"ihre alte Brille mitbringen.","b":"die Brille vorher bezahlen.","c":"am Samstag kommen."},"answer":"a"}],"texts":[{"label":"Text 1","items":[{"no":"1","type":"rf","text":"Die Pause ist kürzer als geplant.","answer":"R"},{"no":"2","type":"abc","stem":"Die Fahrgäste …","options":{"a":"sollen ihre Wertsachen im Bus lassen.","b":"bekommen für die Toilette etwas zurück.","c":"können länger bleiben, wenn sie dem Fahrer Bescheid sagen."},"answer":"b"}]},{"label":"Text 2","items":[{"no":"3","type":"rf","text":"Lisa soll das Kind bei sich zu Hause betreuen.","answer":"R"},{"no":"4","type":"abc","stem":"Lisa soll …","options":{"a":"Nina vor dem Abend Bescheid geben.","b":"für Emil am Abend etwas kochen.","c":"ein Kuscheltier für Emil kaufen und mitbringen."},"answer":"a"}]},{"label":"Text 3","items":[{"no":"5","type":"rf","text":"Für die Aktion muss man sich vorher anmelden.","answer":"F"},{"no":"6","type":"abc","stem":"Kinder …","options":{"a":"können ab sechs Jahren allein mitmachen.","b":"bekommen besondere Handschuhe.","c":"dürfen nur mit Begleitung teilnehmen."},"answer":"c"}]},{"label":"Text 4","items":[{"no":"7","type":"rf","text":"Der Vortrag findet am selben Ort statt wie geplant.","answer":"F"},{"no":"8","type":"abc","stem":"Die Gewinner des Gewinnspiels …","options":{"a":"werden um 17 Uhr am Eingang bekannt gegeben.","b":"erfahren es später auf elektronischem Weg.","c":"müssen ihren Preis am Haupteingang abholen."},"answer":"b"}]},{"label":"Text 5","items":[{"no":"9","type":"rf","text":"Herr Brückner muss am Mittwoch nicht unbedingt zu Hause sein.","answer":"R"},{"no":"10","type":"abc","stem":"Wenn Herr Brückner den Zählerstand nicht meldet, …","options":{"a":"kommen die Stadtwerke noch ein zweites Mal vorbei.","b":"setzen die Stadtwerke einen ungefähren Wert an.","c":"muss er dafür eine zusätzliche Gebühr bezahlen."},"answer":"b"}]}]},"t2":{"instruction":"Sie hören nun einen Text. Sie hören den Text einmal. Dazu lösen Sie fünf Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","readNote":"Lesen Sie jetzt die Aufgaben 11 bis 15. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie sind auf einem Elternabend. Die Klassenlehrerin, Frau Hesse, informiert über die Klassenfahrt.","items":[{"no":"11","stem":"Am Tag der Abreise …","options":{"a":"sollen die Kinder 15 Minuten vor der Abfahrt da sein.","b":"fährt der Bus nicht an der Schule, sondern am Bahnhof ab.","c":"fährt der Bus schon um Viertel vor acht ab."},"answer":"a"},{"no":"12","stem":"Die Zimmer …","options":{"a":"können die Eltern für ihr Kind auswählen.","b":"haben jeweils zwei Betten.","c":"haben die Schüler selbst verteilt."},"answer":"c"},{"no":"13","stem":"Für den Ausflug nach Norderney …","options":{"a":"müssen die Eltern zusätzlich etwas bezahlen.","b":"brauchen die Kinder einen gültigen Reisepass.","c":"brauchen die Kinder ein bestimmtes Dokument."},"answer":"c"},{"no":"14","stem":"Das Taschengeld …","options":{"a":"ist im Preis der Fahrt enthalten.","b":"sollte nicht zu hoch sein.","c":"wird von der Lehrerin verwaltet."},"answer":"b"},{"no":"15","stem":"Die Handys …","options":{"a":"müssen die Kinder über Nacht abgeben.","b":"dürfen nicht mitgenommen werden.","c":"dürfen die Kinder nur im Notfall benutzen."},"answer":"a"}]},"t3":{"instruction":"Sie hören nun ein Gespräch. Sie hören das Gespräch einmal. Dazu lösen Sie sieben Aufgaben. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","readNote":"Lesen Sie jetzt die Aufgaben 16 bis 22. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie sind auf einem Spielplatz und hören, wie sich zwei Väter, Ben und Yusuf, unterhalten.","items":[{"no":"16","text":"Yusufs Frau arbeitet inzwischen wieder.","answer":"R"},{"no":"17","text":"Yusufs Chef hatte mit der Elternzeit kein Problem.","answer":"R"},{"no":"18","text":"Yusufs Familie fährt dieses Jahr wie geplant nach Spanien.","answer":"F"},{"no":"19","text":"Die Idee zu Ellas Projekt entstand im Urlaub.","answer":"R"},{"no":"20","text":"Ben hat seiner Tochter beim Bauen geholfen.","answer":"F"},{"no":"21","text":"Ella hat sich schon für das Bundesfinale qualifiziert.","answer":"F"},{"no":"22","text":"Ella will mit ihrem Preisgeld ihr Projekt weiterentwickeln.","answer":"R"}]},"t4":{"instruction":"Sie hören nun eine Diskussion. Sie hören die Diskussion zweimal. Dazu lösen Sie acht Aufgaben. Ordnen Sie die Aussagen zu: Wer sagt was?","readNote":"Lesen Sie jetzt die Aussagen 23 bis 30. Dazu haben Sie 60 Sekunden Zeit.","context":"Der Moderator der Radiosendung „Standpunkte“ diskutiert mit der Zoodirektorin Christine
