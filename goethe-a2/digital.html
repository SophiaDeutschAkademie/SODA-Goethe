<script id="soda-theme-js">
(function(){
  var KEY='soda-theme', d=document.documentElement, t='dark';

  function apply(v){
    d.setAttribute('data-theme',v); d.style.colorScheme=v;
    var m=document.querySelector('meta[name="color-scheme"]'); if(m) m.setAttribute('content',v);

  }
  apply(t);

  var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  function mount(){
    if(document.getElementById('soda-theme-btn')) return;
    var b=document.createElement('button'); b.type='button'; b.id='soda-theme-btn'; b.className='soda-theme-btn';
    function paint(){ var dk=d.getAttribute('data-theme')==='dark'; b.innerHTML=dk?SUN:MOON; b.setAttribute('aria-pressed',dk?'true':'false'); b.setAttribute('aria-label','다크 모드 '+(dk?'끄기':'켜기')); b.title='다크 모드 '+(dk?'켜짐':'꺼짐')+' · 누르면 '+(dk?'라이트':'다크')+'로 바뀌어요'; }

    paint(); document.body.appendChild(b);
    
  }
  if(document.body) mount(); else document.addEventListener('DOMContentLoaded',mount);
})();
</script>

:root{
  --bg:#e7eaee;--panel:#fff;--bar:#f5f6f8;--line:#cbd2da;--line-2:#e2e6eb;
  --ink:#1b2430;--ink-2:#434f5e;--muted:#68727f;
  --acc:#1d6a56;--acc-2:#165443;--acc-w:#e3f0eb;--acc-line:#93c4b2;
  --warn:#a8322a;--warn-w:#fbecea;--mark:#ffe680;
  --fs:16px;
  --font:"Pretendard SODA",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol{margin:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;height:58px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:5}
.top .logo{width:22px;height:auto;display:block;flex:none}
.top .id{display:flex;flex-direction:column;min-width:0;line-height:1.25;padding-left:12px;border-left:1px solid var(--line-2)}
.top .id b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .id > span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.tool{display:flex;align-items:center;gap:6px}
.hlp{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;font-weight:700;font-size:16px;color:var(--ink-2);padding:0}
.hlp:hover{background:var(--acc-w)}
.fz{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.fz button{border:0;background:none;width:34px;height:32px;padding:0;font-weight:700;color:var(--ink-2)}
.fz button+button{border-left:1px solid var(--line-2)}
.fz button[aria-pressed="true"]{background:var(--acc-w);color:var(--acc-2)}
.fz .s1{font-size:12px}.fz .s2{font-size:14px}.fz .s3{font-size:17px}
.vol{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:0 10px;height:34px;background:#fff;color:var(--ink-2)}
.vol input{width:96px;accent-color:var(--acc)}
.timer{display:flex;align-items:center;gap:9px;height:42px;padding:0 12px 0 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.timer svg{flex:none;color:var(--ink-2)}
.timer .tl{display:flex;flex-direction:column;line-height:1.1}
.timer .tl small{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.timer .tl b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.timer.low{border-color:var(--warn);background:var(--warn-w)}
.timer.low b,.timer.low svg{color:var(--warn)}

/* ---------- part tabs ---------- */
.tabs{display:flex;align-items:stretch;gap:0;background:var(--bar);border-bottom:1px solid var(--line);flex:none;padding:0 10px;min-height:46px}
.tabs .tl{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs .tl::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;border:0;border-top:3px solid transparent;background:none;padding:0 16px;font-weight:700;color:var(--ink-2);white-space:nowrap;position:relative}
.tab .pr{font-weight:400;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:0 7px;line-height:18px}
.tab.done .pr{background:var(--acc-w);border-color:var(--acc-line);color:var(--acc-2)}
.tab[aria-selected="true"]{background:#fff;border-top-color:var(--acc);color:var(--ink);box-shadow:1px 0 0 var(--line),-1px 0 0 var(--line)}
.tab:disabled{cursor:not-allowed;color:#9aa3ad}
.tab:disabled .pr{opacity:.6}
.tab .lock{display:inline-flex;color:#9aa3ad}
.tabs .tr{display:flex;align-items:center;gap:8px;padding-left:10px}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tbtn[aria-pressed="true"]{background:#fff6c7;border-color:#d9bf44;color:#5c4a00}
.tbtn.icon{padding:0 9px}

/* ---------- audio bar ---------- */
.abar{display:flex;align-items:center;gap:14px;padding:9px 18px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.abar .st{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap;min-width:0}
.abar .st .dot{width:10px;height:10px;border-radius:50%;background:#9aa3ad;flex:none}
.abar.on .st .dot{background:var(--acc);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.abar .pg{flex:1;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;min-width:60px}
.abar .pg i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s linear}
.abar .tm{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- main panes ---------- */
.exam{display:flex;flex-direction:column;height:100vh;height:100dvh}
.main{flex:1;min-height:0;display:flex;gap:12px;padding:12px}
.pane{flex:1 1 0;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pane.l{flex-basis:54%}.pane.r{flex-basis:46%}
.pane.one{max-width:1040px;margin:0 auto;width:100%}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 18px;border-bottom:1px solid var(--line-2);background:#fafbfc;flex:none}
.ph h2{font-size:14px;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.ph .sub{display:flex;gap:4px}
.ph .sub button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.ph .sub button[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.pb{flex:1;overflow:auto;padding:20px 24px 48px;font-size:var(--fs);line-height:1.62;-webkit-overflow-scrolling:touch}
.pb.mk{cursor:text}
.pb.mk ::selection{background:var(--mark)}
mark.hl{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.pb.mk mark.hl{cursor:pointer}
.inst{color:var(--ink-2);font-weight:500;margin-bottom:16px}
.inst+.inst{margin-top:-8px}
.ctx{margin-bottom:16px;padding:12px 14px;background:#f6f8f9;border-left:3px solid var(--line);border-radius:0 4px 4px 0}
.h1t{font-size:calc(var(--fs)*1.15);font-weight:700;margin-bottom:10px}

/* texts */
.card{border:1px solid var(--line);border-radius:6px;padding:16px 18px;background:#fff}
.art h3,.doc h3,.forum h3{font-size:1.3em;line-height:1.25;margin-bottom:10px}
.art p,.doc p{margin:0 0 .75em}
.art .lead{font-weight:600;color:var(--ink-2);margin-bottom:12px}
.art .src{text-align:right;font-size:.85em;color:var(--muted);margin-top:8px}
.bsp{font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* items */

<script id="exam-data" type="application/json">{"build":"202610271535","tests":{"1":{"id":1,"roman":"I","lesen":{"t1":{"instruction":"Sie lesen in einer Zeitung diesen Text. Wählen Sie für die Aufgaben 1 bis 5 die richtige Lösung a, b oder c.","title":"Die Bücher kommen zu den Leuten","lead":"Marion Kessler fährt mit einem Bücherbus über die Dörfer – und ist für viele Menschen mehr als eine Bibliothekarin.","paragraphs":["Dienstags um halb neun steht Marion Kessler mit ihrem gelben Bus vor der Grundschule in Lindhorst. Im Bus gibt es fast 4000 Bücher, aber auch Hörbücher, Spiele und Filme. „Viele Dörfer hier haben keine eigene Bibliothek mehr. Deshalb kommen wir zu ihnen“, erzählt sie.","Eigentlich wollte Kessler Lehrerin werden. Nach zwei Semestern hat sie das Studium aber abgebrochen und eine Ausbildung in einer Stadtbibliothek gemacht. Für den Bus musste sie mit 41 Jahren erst einen Lkw-Führerschein machen. „Das war schwerer als jede Prüfung an der Uni“, sagt sie und lacht.","Das Ausleihen kostet nichts, nur für Filme bezahlt man einen Euro. Besonders die älteren Leute kommen nicht nur wegen der Bücher. „Manche erzählen mir von ihren Enkeln oder von ihrem Garten. Für sie bin ich oft der einzige Besuch in der Woche.“","Im nächsten Jahr bekommt die Bibliothek einen neuen Bus. Er ist kleiner als der alte, fährt elektrisch und hat Platz für Rollstühle."],"quote":"„Für viele bin ich oft der einzige Besuch in der Woche.“","source":"aus einer deutschen Tageszeitung","tasksIntro":"Lesen Sie die Aufgaben 1 bis 5 zum Artikel „Die Bücher kommen zu den Leuten“. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","example":{"no":"0","stem":"Marion Kessler …","options":{"a":"arbeitet als Lehrerin an einer Grundschule.","b":"bringt Bücher in Orte ohne Bibliothek.","c":"hat in Lindhorst eine Bibliothek eröffnet."},"answer":"b"},"items":[{"no":"1","stem":"Im Bücherbus kann man …","options":{"a":"nur Bücher für Kinder finden.","b":"mehr als nur Bücher ausleihen.","c":"alles kostenlos mitnehmen."},"answer":"b"},{"no":"2","stem":"Marion Kessler …","options":{"a":"hat ihr Studium nicht zu Ende gemacht.","b":"hat einige Jahre als Lehrerin gearbeitet.","c":"hat erst nach ihrer Ausbildung studiert."},"answer":"a"},{"no":"3","stem":"Für die Arbeit im Bücherbus …","options":{"a":"musste sie noch etwas Neues lernen.","b":"braucht man keinen besonderen Führerschein.","c":"hat sie an der Universität eine Prüfung gemacht."},"answer":"a"},{"no":"4","stem":"Viele ältere Menschen …","options":{"a":"leihen vor allem Filme aus.","b":"freuen sich, dass sie mit jemandem sprechen können.","c":"suchen im Bus Bücher für ihre Enkel."},"answer":"b"},{"no":"5","stem":"Der neue Bus …","options":{"a":"hat mehr Platz für Bücher.","b":"fährt schon in diesem Jahr.","c":"ist auch für Menschen geeignet, die nicht gehen können."},"answer":"c"}],"image":"img/mt1-lesen-foto.jpg","imageAlt":"Eine Frau steht an der Tür eines gelben Bücherbusses. Davor warten drei Kinder mit Schulrucksäcken."},"t2":{"instruction":"Sie sind in einem Gesundheitszentrum. Lesen Sie die Aufgaben 6 bis 10 und die Informationstafel. In welchen Stock gehen Sie? Wählen Sie die richtige Lösung a, b oder c.","board":{"title":"Gesundheitszentrum am Lindenplatz","label":"WEGWEISER","rows":[{"floor":"4. Stock","text":"Dr. med. Petra Lang – Kinder- und Jugendärztin · Hebammenpraxis Storchennest · Logopädie (Sprachtherapie für Kinder und Erwachsene) · Ernährungsberatung (nur nach Terminvereinbarung) · Kursraum (Yoga, Rückenschule, Babymassage)"},{"floor":"3. Stock","text":"Dr. med. Ahmet Yıldız – Zahnarzt (Notdienst am Wochenende) · Kieferorthopädie (Zahnspangen für Kinder und Erwachsene) · Zahnlabor · Hörgeräte Klangwerk (Hörtest, Reparatur)"},{"floor":"2. Stock","text":"Dr. med. Sven Bauer – Augenarzt · Optik Weitblick (Brillen, Kontaktlinsen, kostenloser Sehtest) · Dr. med. Hanna Roth – Hautärztin (auch Allergietests)"},{"floor":"1. Stock","text":"Gemeinschaftspraxis Dr. Klein und Dr. Wolf – Allgemeinmedizin, Hausbesuche, Impfungen · Labor (Blutabnahme Mo–Fr 7–9 Uhr) · Physiotherapie Aktiv (Massage, Krankengymnastik)"},{"floor":"EG","text":"Information · Apotheke am Lindenplatz (Mo–Sa 8–20 Uhr) · Sanitätshaus (Rollstühle, Gehhilfen, Bandagen) · Café „Pause“ · Abstellplatz für Kinderwagen"},{"floor":"UG","text":"Tiefgarage (erste Stunde kostenlos) · Fahrradkeller · Fundbüro · Toiletten · Schließfächer"}]},"example":{"no":"0","stem":"Ihr Sohn ist sechs Jahre alt und hat seit gestern Fieber.","options":{"a":"4. Stock","b":"1. Stock","c":"anderer Stock"},"answer":"a"},"items":[{"no":"6","stem":"Sie brauchen eine neue Brille. Sie wissen aber nicht, ob Ihre Augen schlechter geworden sind.","options":{"a":"3. Stock","b":"2. Stock","c":"anderer Stock"},"answer":"b"},{"no":"7","stem":"Ihre Großmutter versteht am Telefon fast nichts mehr, weil sie schlecht hört.","options":{"a":"3. Stock","b":"4. Stock","c":"anderer Stock"},"answer":"a"},{"no":"8","stem":"Ihr Arzt sagt, Sie sollen weniger Zucker essen. Sie möchten lernen, wie Sie gesünder kochen können.","options":{"a":"EG","b":"1. Stock","c":"anderer Stock"},"answer":"c"},{"no":"9","stem":"Sie haben sich beim Joggen am Fuß verletzt und brauchen für ein paar Wochen Krücken.","options":{"a":"1. Stock","b":"EG","c":"anderer Stock"},"answer":"b"},{"no":"10","stem":"Sie haben gestern im Wartezimmer Ihren Schal liegen lassen.","options":{"a":"UG","b":"EG","c":"anderer Stock"},"answer":"a"}]},"t3":{"instruction":"Sie lesen eine E-Mail. Wählen Sie für die Aufgaben 11 bis 15 die richtige Lösung a, b oder c.","mail":{"from":"Jana Wolff","to":"Annika Brandt","subject":"Neuigkeiten von mir … und von Bruno!","greeting":"Liebe Annika,","closing":["Viele Grüße","Jana"],"paragraphs":["endlich habe ich Zeit, dir zu schreiben! Seit drei Wochen wohne ich nicht mehr allein: Ich habe einen Hund aus dem Tierheim geholt. Er heißt Bruno, ist vier Jahre alt und ziemlich groß. Im Tierheim hat er fast ein Jahr auf eine Familie gewartet. Eigentlich wollte ich einen kleinen Hund, aber dann habe ich Bruno gesehen und mich sofort in ihn verliebt.","Die ersten Tage waren nicht leicht. Bruno hatte Angst vor dem Aufzug und vor lauten Autos. Deshalb sind wir am Anfang nur im Park hinter dem Haus spazieren gegangen. Inzwischen fährt er sogar mit mir Straßenbahn – natürlich mit Maulkorb, das ist hier Pflicht.","Mein Leben hat sich ganz schön verändert. Ich stehe jetzt jeden Morgen um sechs auf, auch am Wochenende. Früher bin ich nie vor neun aus dem Bett gekommen, das weißt du ja! Ins Büro darf ich Bruno leider nicht mitnehmen. Aber meine Nachbarin, Frau Petrović, ist schon in Rente und passt gern auf ihn auf. Dafür kaufe ich manchmal für sie ein, denn das Tragen fällt ihr schwer.","Und noch etwas: Durch Bruno habe ich viele Leute kennengelernt. Im Park sprechen mich ständig andere Hundebesitzer an. Mit zwei von ihnen gehe ich jetzt jeden Sonntag im Wald wandern. Danach trinken wir oft noch zusammen Kaffee – so etwas habe ich früher nie gemacht.","Hast du Lust, mich im Mai zu besuchen? Du hast ja keine Angst vor Hunden, oder? Bruno ist sehr lieb, aber er springt gern an Leuten hoch. Zieh also lieber keine helle Hose an. :-)","Ich freue mich auf deine Antwort!"]},"tasksIntro":"Lesen Sie die Aufgaben 11 bis 15 zur E-Mail von Jana. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","example":{"no":"0","stem":"Jana schreibt, dass …","options":{"a":"sie seit drei Wochen einen Hund hat.","b":"sie in eine neue Wohnung gezogen ist.","c":"sie jetzt in einem Tierheim arbeitet."},"answer":"a"},"items":[{"no":"11","stem":"Bruno …","options":{"a":"ist kleiner, als Jana gedacht hatte.","b":"ist nicht der Hund, den Jana zuerst wollte.","c":"ist noch sehr jung."},"answer":"b"},{"no":"12","stem":"In der ersten Zeit …","options":{"a":"sind Jana und Bruno nicht weit weggegangen.","b":"ist Bruno gern mit der Straßenbahn gefahren.","c":"hatte Jana ein bisschen Angst vor Bruno."},"answer":"a"},{"no":"13","stem":"Jana …","options":{"a":"steht jetzt viel früher auf als vorher.","b":"schläft am Wochenende immer noch lange.","c":"nimmt Bruno jeden Tag mit ins Büro."},"answer":"a"},{"no":"14","stem":"Frau Petrović …","options":{"a":"geht jeden Sonntag mit Jana in den Wald.","b":"arbeitet im selben Büro wie Jana.","c":"bekommt auch Hilfe von Jana."},"answer":"c"},{"no":"15","stem":"Annika soll bei ihrem Besuch …","options":{"a":"ihren eigenen Hund mitbringen.","b":"keine Angst vor großen Hunden haben.","c":"überlegen, was sie anzieht."},"answer":"c"}]},"t4":{"instruction":"Sechs Personen suchen im Internet nach Kursen. Lesen Sie die Aufgaben 16 bis 20 und die Anzeigen a bis f. Welche Anzeige passt zu welcher Person? Für eine Aufgabe gibt es keine Lösung. Markieren Sie so: X. Die Anzeige aus dem Beispiel können Sie nicht mehr wählen.","example":{"no":"0","text":"Tim möchte mit seinem Handy schönere Fotos machen.","answer":"a"},"items":[{"no":"16","text":"Gabis Lieblingsjeans ist zu lang. Sie möchte die Hose selbst kürzer machen, hat aber zu Hause keine Nähmaschine.","answer":"d"},{"no":"17","text":"Oliver arbeitet im Krankenhaus, oft auch nachts. Er möchte endlich ein Instrument spielen lernen.","answer":"e"},{"no":"18","text":"Lina sucht ein Geburtstagsgeschenk für ihre zehnjährige Tochter. Das Mädchen steht gern in der Küche.","answer":"b"},{"no":"19","text":"Kemal wird im Sommer Vater. Er möchte wissen, was er tun muss, wenn sich sein Kind verletzt.","answer":"f"},{"no":"20","text":"Sandra möchte zusammen mit ihrer besten Freundin am Wochenende tanzen lernen.","answer":"X"}],"ads":{"a":{"img":"img/mt1-anzeige-a.png","alt":"VHS Lindau-Mitte Programm Frühjahr Kurs-Nr. 214-F Fotografieren mit dem Smartphone Licht, Perspektive, Bildbearbeitung: Machen Sie mehr aus Ihren Handyfotos! Keine Vorkenntnisse nötig. Bitte bringen Sie Ihr eigenes Smartphone mit. Termin Sa., 7. März, 10–14 Uhr Gebühr 39 € Anmeldung www.vhs-lindau-mitte.de"},"b":{"img":"img/mt1-anzeige-b.png","alt":"Löffel & Co. KOCHSCH liegen die Schlüssel?","options":{"a":{"img":"img/mt1-hoeren3-12a.webp","alt":"Jacke mit Schlüssel"},"b":{"img":"img/mt1-hoeren3-12b.webp","alt":"Auto mit Schlüssel"},"c":{"img":"img/mt1-hoeren3-12c.webp","alt":"Kaffeemaschine mit Schlüssel"}},"answer":"c"},{"no":"13","stem":"Wann hat Frau Krüger ihren Termin?","options":{"a":{"img":"img/mt1-hoeren3-13a.webp","alt":"Uhr: Viertel nach neun"},"b":{"img":"img/mt1-hoeren3-13b.webp","alt":"Uhr: halb zehn"},"c":{"img":"img/mt1-hoeren3-13c.webp","alt":"Uhr: zehn Uhr"}},"answer":"a"},{"no":"14","stem":"Welche Pflanze kauft der Mann?","options":{"a":{"img":"img/mt1-hoeren3-14a.webp","alt":"Kaktus"},"b":{"img":"img/mt1-hoeren3-14b.webp","alt":"Grünpflanze"},"c":{"img":"img/mt1-hoeren3-14c.webp","alt":"Orchidee"}},"answer":"b"},{"no":"15","stem":"Wo treffen sich die beiden morgen?","options":{"a":{"img":"img/mt1-hoeren3-15a.webp","alt":"Brunnen"},"b":{"img":"img/mt1-hoeren3-15b.webp","alt":"Café"},"c":{"img":"img/mt1-hoeren3-15c.webp","alt":"Museum"}},"answer":"a"}]},"t4":{"instruction":"Sie hören ein Interview. Sie hören den Text zweimal. Wählen Sie für die Aufgaben 16 bis 20 Ja oder Nein. Lesen Sie jetzt die Aufgaben.","context":"In der Sendung „Ehrensache“ spricht ein Moderator mit Elif Demir. Sie ist Bäckerin und Mitglied der Freiwilligen Feuerwehr.","example":{"no":"0","text":"Elif Demir ist schon seit acht Jahren bei der Feuerwehr.","answer":"Ja"},"items":[{"no":"16","text":"Elif wollte von Anfang an bei der Feuerwehr mitmachen.","answer":"Nein"},{"no":"17","text":"Heute ist Elif nicht mehr die einzige Frau in ihrer Gruppe.","answer":"Ja"},{"no":"18","text":"Bei den meisten Einsätzen muss die Feuerwehr ein großes Feuer löschen.","answer":"Nein"},{"no":"19","text":"Wenn es einen Einsatz gibt, darf Elif die Bäckerei sofort verlassen.","answer":"Ja"},{"no":"20","text":"Elifs Sohn ist schon Mitglied in der Kinderfeuerwehr.","answer":"Nein"}]}},"schreiben":{"intro":"Das Modul Schreiben hat zwei Teile. In Teil 1 schreiben Sie eine SMS, in Teil 2 eine E-Mail. Schreiben Sie Ihre Texte auf den Antwortbogen. Schreiben Sie bitte deutlich und nicht mit Bleistift. Wörterbücher und Mobiltelefone sind nicht erlaubt.","tasks":[{"no":1,"minutes":10,"words":[20,30],"situation":["Sie waren am Samstag auf der Geburtstagsfeier Ihrer Freundin Carla. Heute finden Sie in Ihrer Tasche einen Schlüssel, der nicht Ihnen gehört. Schreiben Sie Carla eine SMS:"],"points":["Schreiben Sie, was Sie gefunden haben.","Fragen Sie, ob der Schlüssel Carla gehört oder ob sie weiß, wem er gehört.","Schlagen Sie vor, wann und wo Sie ihn zurückgeben."],"instruction":"Schreiben Sie 20–30 Wörter. Schreiben Sie zu allen drei Punkten.","model":{"label":"SMS, 30 Wörter","text":"Hallo Carla,\n\nin meiner Tasche war ein fremder Schlüssel.\nIst das deiner, oder weißt du, wem er gehört?\nIch bringe ihn morgen um 18 Uhr zu dir.\n\nLiebe Grüße, Mia"},"typicalErrors":"Nur *Ich habe deinen Schlüssel* – Punkt 2 fehlt, denn man weiß noch nicht, wem er gehört."},{"no":2,"minutes":20,"words":[30,40],"situation":["Ihre Vermieterin, Frau Albers, hat Ihnen geschrieben: Nächsten Dienstag um 9 Uhr kommt ein Handwerker und repariert das Fenster in Ihrer Küche. Sie sind an diesem Tag nicht zu Hause. Schreiben Sie Frau Albers eine E-Mail."],"points":["Bedanken Sie sich für die Information.","Schreiben Sie, warum Sie am Dienstag nicht zu Hause sind.","Machen Sie einen Vorschlag, wie der Handwerker in die Wohnung kommt."],"instruction":"Schreiben Sie 30–40 Wörter. Schreiben Sie zu allen drei Punkten. Vergessen Sie Anrede und Gruß nicht.","model":{"label":"E-Mail an die Vermieterin, 39 Wörter","text":"Betreff: Handwerker am Dienstag\n\nSehr geehrte Frau Albers,\n\nvielen Dank für Ihre Nachricht.\nLeider bin ich am Dienstag nicht zu Hause, weil ich eine Fortbildung habe.\nMein Nachbar hat einen Schlüssel und kann dem Handwerker die Tür öffnen.\n\nMit freundlichen Grüßen\nMia Kovač"},"typicalErrors":"*Hallo Frau Albers*, kein Grund, kein Vorschlag – nur *Ich bin nicht da*."}],"good":[{"label":"Erfüllung","text":"Alle drei Punkte, jeder in einem eigenen Satz; der Vorschlag ist konkret (Uhrzeit, Nachbar)."},{"label":"Register","text":"SMS mit *du* und *Hallo*, E-Mail mit *Sie*, *Sehr geehrte* und *Mit freundlichen Grüßen*."},{"label":"Wortschatz","text":"*fremder Schlüssel, Fortbildung, die Tür öffnen* statt *machen* und *Ding*."},{"label":"Strukturen","text":"Nebensätze mit *weil* und *wem* (indirekte Frage), Präteritum *war*, Dativ *dem Handwerker*."}]},"audio":[{"src":"Goethe%20A2%20Modelltest%201.1.mp3","dur":462.26},{"src":"Goethe%20A2%20Modelltest%201.2.mp3","dur":153.34},{"src":"Goethe%20A2%20Modelltest%201.3.mp3","dur":261.07},{"src":"Goethe%20A2%20Modelltest%201.4.mp3","dur":246.2}],"pdf":"Goethe%20A2%20Modelltest%201.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"2":{"id":2,"roman":"II","lesen":{"t1":{"instruction":"Sie lesen in einer Zeitung diesen Text. Wählen Sie für die Aufgaben 1 bis 5 die richtige Lösung a, b oder c.","title":"Der jüngste Ladenbesitzer im Landkreis","lead":"Leon Brandt ist 19 und führt den einzigen Laden in Hohenfeld. Für das Dorf ist er mehr als ein Verkäufer.","paragraphs":["Morgens um sechs schließt Leon Brandt die Tür seines Ladens auf. Die ersten Kunden sind Handwerker, die sich schnell noch ein Frühstück holen. Seit Januar gehört der kleine Supermarkt in Hohenfeld ihm. Die frühere Besitzerin, Frau Mertens, ist mit 68 Jahren in Rente gegangen. Zwei Jahre lang hat sie jemanden gesucht, der den Laden weiterführt. Niemand wollte das – bis Leon kam.","Nach der Schule hat Leon eine Ausbildung in einem großen Supermarkt in der Stadt gemacht. „Dort war ich nur eine Nummer“, sagt er. In Hohenfeld kennt er jeden Kunden mit Namen. Neben Lebensmitteln gibt es bei ihm auch Briefmarken und Zeitungen – und zwei Tische, an denen man Kaffee trinken kann. Besonders ältere Leute kommen oft nur zum Reden.","Der Laden ist sechs Tage in der Woche geöffnet, deshalb hat Leon wenig Freizeit. Seine Freunde besuchen ihn meistens im Laden. Trotzdem möchte er mit niemandem tauschen. Im Frühling will er einen Lieferservice anbieten: Dann bringt er Kunden, die nicht mehr gut laufen können, die Einkäufe mit dem Lastenrad nach Hause."],"quote":"„Hier kenne ich jeden Kunden mit Namen.“","source":"aus einer deutschen Tageszeitung","tasksIntro":"Lesen Sie die Aufgaben 1 bis 5 zum Artikel „Der jüngste Ladenbesitzer im Landkreis“. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","example":{"no":"0","stem":"Leon Brandt …","options":{"a":"hat in Hohenfeld einen neuen Laden eröffnet.","b":"hat den Laden von Frau Mertens übernommen.","c":"arbeitet in einem Supermarkt in der Stadt."},"answer":"b"},"items":[{"no":"1","stem":"Frau Mertens …","options":{"a":"hat den Laden sofort an Leon verkauft.","b":"hilft Leon noch im Laden.","c":"hat lange niemanden für den Laden gefunden."},"answer":"c"},{"no":"2","stem":"In der Stadt …","options":{"a":"hat sich Leon nicht wohlgefühlt.","b":"kannte Leon alle Kunden mit Namen.","c":"hatte Leon einen eigenen Laden."},"answer":"a"},{"no":"3","stem":"Im Laden …","options":{"a":"gibt es nur Dinge zum Essen und Trinken.","b":"kann man sich auch hinsetzen.","c":"ist der Kaffee für ältere Leute kostenlos."},"answer":"b"},{"no":"4","stem":"Leon …","options":{"a":"hat viel Freizeit.","b":"sieht seine Freunde nur selten.","c":"ist mit seinem Leben zufrieden."},"answer":"c"},{"no":"5","stem":"Im Frühling …","options":{"a":"soll der Laden auch sonntags öffnen.","b":"will Leon Waren liefern.","c":"bekommen die Kunden Fahrräder zum Ausleihen."},"answer":"b"}],"image":"img/mt2-lesen-foto.jpg","imageAlt":"Ein junger Mann in grüner Schürze steht in seinem kleinen Laden. Hinter ihm liegen Brot, Obst und Zeitungen, im Hintergrund steht eine Kundin."},"t2":{"instruction":"Sie sind im Rathaus. Lesen Sie die Aufgaben 6 bis 10 und die Informationstafel am Eingang. In welchen Stock gehen Sie? Wählen Sie die richtige Lösung a, b oder c.","board":{"title":"Rathaus Neustadt","label":"WEGWEISER","rows":[{"floor":"3. Stock","text":"Bürgermeisterin Dr. Anne Kolb · Büro des Stadtrats · Sitzungssaal · Pressestelle · Stadtarchiv (Besuch nur mit Termin) · Umweltamt (Mülltonnen, Müllabfuhr)"},{"floor":"2. Stock","text":"Standesamt (Hochzeiten, Geburts- und Sterbeurkunden) · Ausländerbehörde (Aufenthaltstitel, Mo–Do 8–12 Uhr) · Wohngeldstelle · Sozialamt · Beratung für Seniorinnen und Senioren (Di 9–12 Uhr)"},{"floor":"1. Stock","text":"Bürgerbüro (Personalausweis, Reisepass, An-, Ab- und Ummeldung, Führungszeugnis) · Kfz-Zulassung (Fahrzeuge an- und abmelden, Kennzeichen, Mo–Fr 8–13 Uhr) · Führerscheinstelle"},{"floor":"EG","text":"Information · Stadtkasse (Gebühren und Bußgelder bezahlen) · Tourist-Information (Stadtpläne, Souvenirs, Tickets für Stadtführungen) · Jugendamt (Anmeldung für Kita und Hort) · Café im Foyer (Mo–Fr 8–16 Uhr) · Wartebereich mit Spielecke"},{"floor":"UG","text":"Tiefgarage (Mo–Fr 7–19 Uhr) · Fahrradparkplatz (überdacht) · Toiletten (barrierefrei) · Kantine (Mo–Fr 11.30– 14 Uhr, auch für Gäste)"}]},"example":{"no":"0","stem":"Sie sind umgezogen und müssen Ihre neue Adresse melden.","options":{"a":"1. Stock","b":"2. Stock","c":"anderer Stock"},"answer":"a"},"items":[{"no":"6","stem":"Sie sind zu schnell gefahren und müssen jetzt 30 Euro Strafe bezahlen.","options":{"a":"EG","b":"1. Stock","c":"anderer Stock"},"answer":"a"},{"no":"7","stem":"Ihre Tochter ist drei Jahre alt und soll ab dem Sommer in den Kindergarten gehen.","options":{"a":"2. Stock","b":"3. Stock","c":"anderer Stock"},"answer":"c"},{"no":"8","stem":"Sie haben ein gebrauchtes Auto gekauft und brauchen ein Kennzeichen.","options":{"a":"1. Stock","b":"UG","c":"anderer Stock"},"answer":"a"},{"no":"9","stem":"Ihr Cousin aus Kanada ist zu Besuch. Sie möchten ihm die Altstadt zeigen, aber Sie kennen die Geschichte der Stadt nicht gut.","options":{"a":"3. Stock","b":"EG","c":"anderer Stock"},"answer":"b"},{"no":"10","stem":"Sie und Ihre Freundin möchten im Mai heiraten.","options":{"a":"1. Stock","b":"3. Stock","c":"anderer Stock"},"answer":"c"}]},"t3":{"instruction":"Sie lesen eine E-Mail. Wählen Sie für die Aufgaben 11 bis 15 die richtige Lösung a, b oder c.","mail":{"from":"Jonas Weber","to":"Paul Richter","subject":"Mein neues Hobby – und eine Einladung","greeting":"Hallo Paul,","closing":["Viele Grüße","Jonas"],"paragraphs":["du hast lange nichts von mir gehört – das liegt an meinem neuen Hobby! Seit März habe ich einen Schrebergarten am Stadtrand. Fast zwei Jahre lang stand ich auf der Warteliste. Im Winter hat dann eine ältere Dame ihren Garten aufgegeben, und ich habe ihn bekommen. Zum Garten gehört eine kleine Hütte mit Tisch, Stühlen und einem alten Ofen. Im Sommer übernachte ich manchmal sogar dort.","Am Anfang habe ich die Arbeit unterschätzt. Das Gras war kniehoch, und die Hütte musste ich neu streichen. Jedes Wochenende war ich von morgens bis abends im Garten. Zum Glück sind meine Gartennachbarn sehr nett. Herr Özdemir zum Beispiel hat mir seine Geräte geliehen und mir erklärt, wann man was pflanzen muss. Er hat mir wirklich sehr geholfen.","Jetzt wachsen bei mir Tomaten, Gurken, Zucchini und sogar ein kleiner Apfelbaum. Die ersten Tomaten habe ich letzte Woche geerntet – so gut schmecken die aus dem Supermarkt nie! Es gibt aber auch viele Regeln im Verein: Der Rasen muss kurz sein, nach 22 Uhr darf man keine Musik mehr machen, und einmal im Monat muss jeder bei der Gemeinschaftsarbeit mithelfen.","Am 20. August feiert der Verein sein Sommerfest. Alle Mitglieder kochen etwas, und abends spielt eine Band. Die Kinder aus dem Verein führen ein kleines Theaterstück auf. Hast du Lust zu kommen? Du kannst gern bei mir übernachten, in der Hütte ist Platz für zwei. Bring aber einen warmen Schlafsack mit, nachts wird es dort ziemlich kühl.","Melde dich bald!"]},"tasksIntro":"Lesen Sie die Aufgaben 11 bis 15 zu Jonas’ E-Mail. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","example":{"no":"0","stem":"Jonas …","options":{"a":"hat seit ein paar Monaten einen eigenen Garten.","b":"hat eine ältere Dame besucht.","c":"ist an den Stadtrand gezogen."},"answer":"a"},"items":[{"no":"11","stem":"Jonas hat den Garten bekommen, …","options":{"a":"weil eine andere Person ihn abgegeben hat.","b":"weil er lange im Verein mitgearbeitet hat.","c":"obwohl er nicht auf der Warteliste stand."},"answer":"a"},{"no":"12","stem":"Am Anfang …","options":{"a":"hat Jonas mit Herrn Özdemir eine neue Hütte gebaut.","b":"war Jonas nur selten im Garten.","c":"war mehr Arbeit nötig, als Jonas gedacht hatte."},"answer":"c"},{"no":"13","stem":"Herr Özdemir …","options":{"a":"hat seinen Garten an Jonas verkauft.","b":"hat Jonas Werkzeug geliehen.","c":"hat für Jonas den Rasen gemäht."},"answer":"b"},{"no":"14","stem":"Im Verein …","options":{"a":"muss jeder regelmäßig für alle mitarbeiten.","b":"darf man nur am Wochenende Musik machen.","c":"müssen alle ihr Gemüse zusammen verkaufen."},"answer":"a"},{"no":"15","stem":"Paul soll …","options":{"a":"etwas zu essen für das Fest mitbringen.","b":"mit seinem Zelt kommen.","c":"an warme Sachen für die Nacht denken."},"answer":"c"}]},"t4":{"instruction":"Sechs Personen suchen im Internet nach Freizeitangeboten. Lesen Sie die Aufgaben 16 bis 20 und die Anzeigen a bis f. Welche Anzeige passt zu welcher Person? Für eine Aufgabe gibt es keine Lösung. Markieren Sie so: X. Die Anzeige aus dem Beispiel können Sie nicht mehr wählen.","example":{"no":"0","text":"Tim möchte ein E-Bike ausprobieren, bevor er sich eines kauft.","answer":"c"},"items":[{"no":"16","text":"Familie Sommer hat zwei Kinder, vier und sieben Jahre alt. Die Kinder lieben Tiere.","answer":"e"},{"no":"17","text":"Frau Albrecht ist 78 und kann nicht mehr lange laufen. Trotzdem möchte sie am Sonntag etwas von der Stadt sehen.","answer":"b"},{"no":"18","text":"Yusuf und Marie wollen am Samstag draußen aktiv sein. Beide haben keine Höhenangst.","answer":"a"},{"no":"19","text":"Herr Nowak hat Probleme mit dem Rücken. Sein Arzt sagt, Wärme tut ihm gut.","answer":"d"},{"no":"20","text":"Drei Freunde, alle 15 Jahre alt, suchen etwas für den Freitagabend.","answer":"X"}],"ads":{"a":{"img":"img/mt2-anzeige-a.png","alt":"KLETTERWALD HOHE EICHE Hoch hinaus! Zehn Parcours in den Bäumen, bis zu 15 Meter hoch. Keine Erfahrung nötig, unsere Trainer erklären alles. Für Kinder ab 8 Jahren, nur mit Erwachsenen. Täglich 10–18 Uhr · Erwachsene 24 €, Kinder 16 €"},"b":{"img":"img/mt2-anzeige-b.png","alt":"Weiße Flotte 85 Die Stadt vom Wasser aus Altstadt, Brücken und Schloss in 90 Minuten. Bequeme Sitzplätze innen und auf dem Sonnendeck, Kaffee an Bord. Abfahrt stündlich von 11 bis 17 Uhr. Samstags um 20 Uhr: Abendfahrt mit Live-Musik (ab 18 Jahren)"},"c":{"img":"img/mt2-anzeige-c.png","alt":"KLEINANZEIGEN · FREIZEIT RADSTATION AM BAHNHOF Fahrräder und E-Bikes zum Leihen – schon ab einer Stunde Ist ein E-Bike etwas für Sie? Testen Sie es einen ganzen Tag! Wenn Sie danach ein E-Bike bei uns kaufen, bezahlen Sie nichts für den Test. Helme kostenlos. Rückgabe bis 19 Uhr · radstation-neustadt.de"},"d":{"img":"img/mt2-anzeige-d.png","alt":"36° THERME AQUARIA Sieben Becken mit 32 bis 36 Grad warmem Wasser, dazu Ruheräume. Wohltuend bei Rückenschmerzen. Tageskarte 19 €, nach 17 Uhr 12 €. Freitags ab 18 Uhr Saunanacht – dann nur für Erwachsene"},"e":{"img":"img/mt2-anzeige-e.png","alt":"Ferien auf dem Bauernhof – für einen Tag ERLEBNISHOF LINDENHOF Kühe, Schweine, Hühner und Ponys freuen sich auf Besuch! Kinder dürfen beim Füttern helfen und auf einem Pony reiten. Im Hofcafé gibt es Kuchen. Sa und So 10–17 Uhr · Eintritt 5 €, Kinder bis 3 Jahre frei"},"f":{"img":"img/mt2-anzeige-f.png","alt":"NACHTWÄCHTER-FÜHRUNG Hört, ihr Leut’, und lasst euch sagen … Der Nachtwächter führt Sie mit Laterne durch die dunkle Altstadt und erzählt Geschichten aus 500 Jahren. Freitags und samstags um 21 Uhr, Treffpunkt am Marktbrunnen. 12 € pro Person · ab 16 Jahren · keine Anmeldung nötig"}},"unused":["f"]}},"hoeren":{"t1":{"instruction":"Sie hören fünf kurze Texte. Sie hören jeden Text zweimal. Wählen Sie für die Aufgaben 1 bis 5 die richtige Lösung a, b oder c.","items":[{"no":"1","stem":"Wohin soll Leas Mutter gehen?","options":{"a":"Zur Kasse drei.","b":"In den ersten Stock.","c":"Zum Eingang."},"answer":"b"},{"no":"2","stem":"Welchen neuen Termin bekommt Herr Lorenz?","options":{"a":"Am Donnerstag um 15 Uhr.","b":"Am Montag um 15 Uhr.","c":"Am Montag um 10 Uhr."},"answer":"c"},{"no":"3","stem":"Warum gibt es auf der A7 Stau?","options":{"a":"Weil es einen Unfall gab.","b":"Weil dort eine Baustelle ist.","c":"Weil die Straße nass ist."},"answer":"a"},{"no":"4","stem":"Was machen die Kinder der Klasse 2b morgen?","options":{"a":"Sie gehen ins Theater.","b":"Sie haben frei.","c":"Sie haben Schule."},"answer":"c"},{"no":"5","stem":"Was ist heute billiger?","options":{"a":"Jacken.","b":"Schuhe.","c":"Hosen."},"answer":"a"}]},"t2":{"instruction":"Sie hören ein Gespräch. Sie hören den Text einmal. Was machen die ehemaligen Mitschülerinnen und Mitschüler heute beruflich? Wählen Sie für die Aufgaben 6 bis 10 ein passendes Bild aus a bis i. Wählen Sie jeden Buchstaben nur einmal. Sehen Sie sich jetzt die Bilder an.","persons":[{"no":"0","name":"Sara","answer":"d"},{"no":"6","name":"Murat","answer":"c"},{"no":"7","name":"Lisa","answer":"a"},{"no":"8","name":"Tom","answer":"e"},{"no":"9","name":"Jule","answer":"i"},{"no":"10","name":"David","answer":"h"}],"pictures":{"a":{"img":"img/mt2-hoeren2-a.webp","alt":"Koch / Köchin"},"b":{"img":"img/mt2-hoeren2-b.webp","alt":"Ärztin / Arzt"},"c":{"img":"img/mt2-hoeren2-c.webp","alt":"Busfahrer / Busfahrerin"},"d":{"img":"img/mt2-hoeren2-d.webp","alt":"Lehrerin / Lehrer"},"e":{"img":"img/mt2-hoeren2-e.webp","alt":"Friseur / Friseurin"},"f":{"img":"img/mt2-hoeren2-f.webp","alt":"Polizistin / Polizist"},"g":{"img":"img/mt2-hoeren2-g.webp","alt":"Kellner / Kellnerin"},"h":{"img":"img/mt2-hoeren2-h.webp","alt":"Mechaniker / Mechanikerin"},"i":{"img":"img/mt2-hoeren2-i.webp","alt":"Tierärztin / Tierarzt"}},"unused":["b","f","g"]},"t3":{"instruction":"Sie hören fünf kurze Gespräche. Sie hören jeden Text einmal. Wählen Sie für die Aufgaben 11 bis 15 die richtige Lösung a, b oder c.","items":[{"no":"11","stem":"Welches Obst kauft die Frau?","options":{"a":{"img":"img/mt2-hoeren3-11a.webp","alt":"Pfirsiche"},"b":{"img":"img/mt2-hoeren3-11b.webp","alt":"Kirschen"},"c":{"img":"img/mt2-hoeren3-11c.webp","alt":"Birnen"}},"answer":"a"},{"no":"12","stem":"Was schenken die beiden ihrem Kollegen?","options":{"a":{"img":"img/mt2-hoeren3-12a.webp","alt":"Buch"},"b":{"img":"img/mt2-hoeren3-12b.webp","alt":"Kopfhörer"},"c":{"img":"img/mt2-hoeren3-12c.webp","alt":"Gutschein für ein Restaurant"}},"answer":"c"},{"no":"13","stem":"Wo hat der Mann Urlaub gemacht?","options":{"a":{"img":"img/mt2-hoeren3-13a.webp","alt":"Strand"},"b":{"img":"img/mt2-hoeren3-13b.webp","alt":"Berge"},"c":{"img":"img/mt2-hoeren3-13c.webp","alt":"Stadt"}},"answer":"b"},{"no":"14","stem":"Welchen Sport macht die Frau jetzt?","options":{"a":{"img":"img/mt2-hoeren3-14a.webp","alt":"Yoga"},"b":{"img":"img/mt2-hoeren3-14b.webp","alt":"Schwimmen"},"c":{"img":"img/mt2-hoeren3-14c.webp","alt":"Tennis"}},"answer":"a"},{"no":"15","stem":"Was kauft der Mann?","options":{"a":{"img":"img/mt2-hoeren3-15a.webp","alt":"Jacke"},"b":{"img":"img/mt2-hoeren3-15b.webp","alt":"Pullover"},"c":{"img":"img/mt2-hoeren3-15c.webp","alt":"Hemd"}},"answer":"b"}]},"t4":{"instruction":"Sie hören ein Interview. Sie hören den Text zweimal. Wählen Sie für die Aufgaben 16 bis 20 Ja oder Nein. Lesen Sie jetzt die Aufgaben.","context":"In der Sendung „Mitten im Leben“ spricht eine Moderatorin mit Paula Ortega. Sie ist Medizinstudentin und wohnt bei einer 81-jährigen Frau.","example":{"no":"0","text":"Paula studiert in Freiburg Medizin.","answer":"Ja"},"items":[{"no":"16","text":"Paula hat Frau Reuter über das Internet kennengelernt.","answer":"Nein"},{"no":"17","text":"Für ihr Zimmer bezahlt Paula keine Miete.","answer":"Ja"},{"no":"18","text":"Paula hilft Frau Reuter jeden Tag mehrere Stunden.","answer":"Nein"},{"no":"19","text":"Paula und Frau Reuter kochen am Wochenende zusammen.","answer":"Ja"},{"no":"20","text":"Paula möchte nach dem Studium in Deutschland arbeiten.","answer":"Ja"}]}},"schreiben":{"intro":"Das Modul Schreiben hat zwei Teile. In Teil 1 schreiben Sie eine SMS, in Teil 2 eine E-Mail. Schreiben Sie Ihre Texte auf den Antwortbogen. Schreiben Sie bitte deutlich und nicht mit Bleistift. Wörterbücher und Mobiltelefone sind nicht erlaubt.","tasks":[{"no":1,"minutes":10,"words":[20,30],"situation":["Sie sind mit Ihrer Freundin Mia um 19 Uhr vor dem Konzerthaus verabredet. Ihr Zug hat 30 Minuten Verspätung. Schreiben Sie Mia eine SMS:"],"points":["Schreiben Sie, warum Sie zu spät kommen.","Schreiben Sie, wann Sie ungefähr ankommen.","Machen Sie einen Vorschlag, was Mia bis dahin machen kann."],"instruction":"Schreiben Sie 20–30 Wörter. Schreiben Sie zu allen drei Punkten.","model":{"label":"SMS, 29 Wörter","text":"Hallo Mia,\n\nmein Zug hat 30 Minuten Verspätung.\nIch bin erst um halb acht da.\nGeh doch schon ins Café gegenüber und warte dort auf mich.\n\nBis gleich, Tom"},"typicalErrors":"Nur *Ich komme später* – ohne Grund und ohne Uhrzeit fehlen zwei Punkte."},{"no":2,"minutes":20,"words":[30,40],"situation":["Sie haben für Freitag ein Zimmer im Hotel Seeblick reserviert. Sie kommen aber erst spät am Abend an. Schreiben Sie dem Hotel eine E-Mail."],"points":["Schreiben Sie, wann Sie ungefähr ankommen und warum Sie so spät kommen.","Fragen Sie, bis wann die Rezeption geöffnet ist.","Fragen Sie, ob Sie so spät noch etwas zu essen bekommen."],"instruction":"Schreiben Sie 30–40 Wörter. Schreiben Sie zu allen drei Punkten. Vergessen Sie Anrede und Gruß nicht.","model":{"label":"E-Mail an das Hotel, 40 Wörter","text":"Betreff: Späte Ankunft am Freitag\n\nSehr geehrte Damen und Herren,\n\nich habe für Freitag ein Zimmer reserviert. Ich komme erst gegen 23 Uhr, weil ich arbeiten muss.\nBis wann ist die Rezeption geöffnet?\nGibt es dann noch etwas zu essen?\n\nMit freundlichen Grüßen\nTom Berger"},"typicalErrors":"*Hallo Hotel*, keine Frage nach der Rezeption – die Aufgabe verlangt zwei Fragen."}],"good":[{"label":"Erfüllung","text":"Alle drei Punkte, jeder in einem eigenen Satz; die Angaben sind konkret (halb acht, gegen 23 Uhr)."},{"label":"Register","text":"SMS mit *du* und *Hallo*, E-Mail mit *Sie*, *Sehr geehrte Damen und Herren* und *Mit freundlichen Grüßen*."},{"label":"Wortschatz","text":"*Verspätung, Rezeption, reserviert* statt allgemeiner Wörter wie *Ding* oder *machen*."},{"label":"Strukturen","text":"Nebensatz mit *weil*, Imperativ (*Geh doch schon …*), Modalverb *müssen*, W-Frage mit *bis wann*."}]},"audio":[{"src":"Goethe%20A2%20Modelltest%202.1.mp3","dur":477.13},{"src":"Goethe%20A2%20Modelltest%202.2.mp3","dur":157.96},{"src":"Goethe%20A2%20Modelltest%202.3.mp3","dur":249.18},{"src":"Goethe%20A2%20Modelltest%202.4.mp3","dur":254.93}],"pdf":"Goethe%20A2%20Modelltest%202.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"3":{"id":3,"roman":"III","lesen":{"t1":{"instruction":"Sie lesen in einer Zeitung diesen Text. Wählen Sie für die Aufgaben 1 bis 5 die richtige Lösung a, b oder c.","title":"Schwimmen lernen mit 63","lead":"Jeden Montagabend gehört das Hallenbad in Hagenow den Anfängern. Die meisten von ihnen sind über 50.","paragraphs":["Gerd Paulsen steht am Beckenrand und zögert. Dann geht er langsam die Treppe hinunter ins Wasser. Der 63-Jährige hatte sein ganzes Leben lang Angst vor dem Wasser. „Als Kind bin ich einmal fast ertrunken. Danach wollte ich nie wieder ins Wasser“, erzählt er. Jetzt lernt er schwimmen – gemeinsam mit elf anderen Erwachsenen.","Der Kurs war die Idee von Ayşe Kaya. Die 34-Jährige arbeitet als Bademeisterin im Hallenbad. Immer wieder hat sie gesehen, dass Erwachsene am Beckenrand sitzen und nur ihren Enkeln zuschauen. „Viele schämen sich. Deshalb gibt es bei uns keine Kinder und keine Zuschauer“, sagt sie. In zehn Kursstunden lernen die Teilnehmer, sich im Wasser sicher zu bewegen. Richtig schwimmen können danach aber noch nicht alle.","Gerd Paulsen hat sich angemeldet, weil seine Enkelin im Sommer mit ihm an den See fahren möchte. „Ich will nicht wieder nur am Ufer sitzen.“ Nach der vierten Stunde schwimmt er schon fünf Meter ohne Hilfe. Der nächste Kurs beginnt im Oktober. Es gibt schon eine Warteliste."],"quote":"„Viele schämen sich. Deshalb gibt es bei uns keine Kinder und keine Zuschauer.“","source":"aus einer deutschen Tageszeitung","tasksIntro":"Lesen Sie die Aufgaben 1 bis 5 zum Artikel „Schwimmen lernen mit 63“. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","example":{"no":"0","stem":"Gerd Paulsen …","options":{"a":"ist Bademeister im Hallenbad.","b":"lernt als Erwachsener schwimmen.","c":"geht mit seinen Enkeln ins Hallenbad."},"answer":"b"},"items":[{"no":"1","stem":"Gerd Paulsen hatte Angst vor dem Wasser, weil …","options":{"a":"er nie Zeit für einen Kurs hatte.","b":"er lange nicht im Wasser war.","c":"ihm als Kind etwas Schlimmes passiert ist."},"answer":"c"},{"no":"2","stem":"Im Kurs …","options":{"a":"dürfen keine Kinder mitmachen.","b":"schauen die Enkel zu.","c":"sind alle Teilnehmer über 50."},"answer":"a"},{"no":"3","stem":"Nach dem Kurs …","options":{"a":"können alle Teilnehmer schwimmen.","b":"machen die Teilnehmer eine Prüfung.","c":"fühlen sich die Teilnehmer im Wasser sicherer."},"answer":"c"},{"no":"4","stem":"Gerd Paulsen macht den Kurs, …","options":{"a":"weil seine Enkelin auch schwimmen lernt.","b":"weil er im Sommer mit seiner Enkelin baden will.","c":"weil er im Sommer am See arbeitet."},"answer":"b"},{"no":"5","stem":"Der nächste Kurs …","options":{"a":"beginnt im Sommer.","b":"ist schon ausgebucht.","c":"hat noch freie Plätze."},"answer":"b"}],"image":"img/mt3-lesen-foto.jpg","imageAlt":"Ein älterer Mann sitzt im Schwimmbecken. Eine Schwimmlehrerin in roter Kleidung hockt am Beckenrand und erklärt ihm etwas."},"t2":{"instruction":"Sie sind am Flughafen. Lesen Sie die Aufgaben 6 bis 10 und die Informationstafel. Auf welche Ebene gehen Sie? Wählen Sie die richtige Lösung a, b oder c.","board":{"title":"Flughafen Nordstadt · Terminal 1","label":"WEGWEISER","rows":[{"floor":"Ebene 3","text":"Besucherterrasse (Blick auf die Startbahn) · Restaurant „Wolke 7“ · Konferenzräume · Kapelle"},{"floor":"Ebene 2","text":"Abflug · Check-in-Schalter 1–60 · Sicherheitskontrolle · Geschäfte (Mode, Bücher, Elektronik) · Drogerie · Ruhezone mit Liegen · Kinderwagenverleih"},{"floor":"Ebene 1","text":"Ankunft · Gepäckausgabe · Gepäckermittlung (vermisste Koffer) · Zoll · Information · Mietwagen · Wechselstube · Spielecke für Kinder · Café"},{"floor":"Ebene 0","text":"Bahnhof (S-Bahn S1 und S8, Regionalzüge) · Fahrkartenautomaten · Bushaltestellen · Taxistand · Apotheke · Bäckerei (ab 5 Uhr) · Blumenladen"},{"floor":"Ebene –1","text":"Parkhaus P1 (Kurzzeitparken) · Gepäckaufbewahrung (Schließfächer, bis 72 Stunden) · Fundbüro · Toiletten · Duschen · Fahrradparkplatz"}]},"example":{"no":"0","stem":"Sie möchten mit der S-Bahn in die Stadt fahren und brauchen eine Fahrkarte.","options":{"a":"Ebene 0","b":"Ebene 1","c":"andere Ebene"},"answer":"a"},"items":[{"no":"6","stem":"Sie sind gerade gelandet, aber Ihr Koffer ist nicht da.","options":{"a":"Ebene –1","b":"Ebene 1","c":"andere Ebene"},"answer":"b"},{"no":"7","stem":"Sie haben vier Stunden Zeit bis zum nächsten Flug. Sie sind müde und möchten ein bisschen schlafen.","options":{"a":"Ebene 1","b":"Ebene 3","c":"andere Ebene"},"answer":"c"},{"no":"8","stem":"Sie haben noch Zeit und möchten den Flugzeugen beim Start zusehen.","options":{"a":"Ebene 3","b":"Ebene 2","c":"andere Ebene"},"answer":"a"},{"no":"9","stem":"Sie fliegen nach London und müssen noch Euro in Pfund tauschen.","options":{"a":"Ebene 1","b":"Ebene 0","c":"andere Ebene"},"answer":"a"},{"no":"10","stem":"Sie haben sechs Stunden Aufenthalt und möchten ohne Ihren Koffer in die Stadt fahren.","options":{"a":"Ebene 1","b":"Ebene –1","c":"andere Ebene"},"answer":"b"}]},"t3":{"instruction":"Sie lesen eine E-Mail. Wählen Sie für die Aufgaben 11 bis 15 die richtige Lösung a, b oder c.","mail":{"from":"Clara Hoffmann","to":"Rosa Hoffmann","subject":"Grüße aus Leipzig!","greeting":"Liebe Tante Rosa,","closing":["Ganz liebe Grüße, auch an Onkel Peter","Clara"],"paragraphs":["jetzt bin ich schon sechs Wochen in Leipzig, und endlich habe ich Zeit, dir zu schreiben. Das Studium hat gut angefangen, aber die ersten Tage waren nicht leicht. Alles war neu: die Stadt, die Uni, die Leute. Ich kannte niemanden, und abends habe ich oft mit Mama telefoniert. Das ist jetzt zum Glück vorbei.","Ich wohne in einer WG mit zwei anderen Studierenden: Mert studiert Informatik, Sofia kommt aus Portugal und lernt noch Deutsch. Mein Zimmer ist klein, hat aber einen Balkon. Die Wohnung liegt im vierten Stock ohne Aufzug – so bleibe ich wenigstens fit. Die Küche teilen wir uns, und jeden Sonntag kocht einer von uns für alle. Letzte Woche war ich dran – es gab deine Kartoffelsuppe, und alle wollten das Rezept!","An der Uni gefällt es mir sehr gut. Die Vorlesungen sind interessant, nur die Bibliothek ist immer voll. Deshalb lerne ich meistens zu Hause. Zweimal in der Woche singe ich im Uni-Chor. Dort habe ich die meisten meiner Freunde kennengelernt. Nächsten Monat haben wir unser erstes Konzert.","Das Geld ist leider knapp. Seit Oktober arbeite ich deshalb an zwei Abenden in der Woche im Kino an der Kasse. Die Arbeit ist nicht schwer, und ich kann alle Filme kostenlos sehen. Nur den Heimweg um Mitternacht mag ich nicht so gern – mit dem Fahrrad bin ich zwanzig Minuten durch die dunkle Stadt unterwegs.","Kommst du mich im Dezember besuchen? Der Weihnachtsmarkt hier soll wunderschön sein. Du kannst in meinem Zimmer schlafen, ich nehme das Sofa im Wohnzimmer. Sag mir einfach, welches Wochenende dir passt."]},"tasksIntro":"Lesen Sie die Aufgaben 11 bis 15 zu Claras E-Mail. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","example":{"no":"0","stem":"Clara …","options":{"a":"wohnt seit sechs Wochen in Leipzig.","b":"hat ihr Studium schon beendet.","c":"besucht ihre Tante in Leipzig."},"answer":"a"},"items":[{"no":"11","stem":"Am Anfang …","options":{"a":"hat Clara sich einsam gefühlt.","b":"hat Claras Mutter in Leipzig gewohnt.","c":"hatte Clara Probleme mit dem Studium."},"answer":"a"},{"no":"12","stem":"In der WG …","options":{"a":"hat jedes Zimmer einen Balkon.","b":"kochen die Mitbewohner abwechselnd für alle.","c":"isst jeder für sich allein."},"answer":"b"},{"no":"13","stem":"Clara lernt meistens zu Hause, weil …","options":{"a":"die Vorlesungen langweilig sind.","b":"sie gern mit Mert und Sofia zusammen lernt.","c":"es in der Bibliothek zu wenig Platz gibt."},"answer":"c"},{"no":"14","stem":"Die Arbeit im Kino …","options":{"a":"findet jeden Abend statt.","b":"ist sehr anstrengend.","c":"hat auch einen Vorteil."},"answer":"c"},{"no":"15","stem":"Tante Rosa soll …","options":{"a":"im Wohnzimmer auf dem Sofa schlafen.","b":"Clara sagen, wann sie Zeit hat.","c":"ein Zimmer im Hotel nehmen."},"answer":"b"}]},"t4":{"instruction":"Sechs Personen suchen im Internet nach einem Job. Lesen Sie die Aufgaben 16 bis 20 und die Anzeigen a bis f. Welche Anzeige passt zu welcher Person? Für eine Aufgabe gibt es keine Lösung. Markieren Sie so: X. Die Anzeige aus dem Beispiel können Sie nicht mehr wählen.","example":{"no":"0","text":"Lea studiert und hat nur morgens vor der Uni Zeit.","answer":"a"},"items":[{"no":"16","text":"Herr Krause ist Rentner und war früher Mathematiklehrer. Er möchte wieder etwas mit jungen Leuten machen.","answer":"b"},{"no":"17","text":"Sabine kann von Montag bis Donnerstag abends arbeiten. Sie hat einen Führerschein und ein eigenes Auto.","answer":"f"},{"no":"18","text":"Tarik ist 17 und möchte in den Sommerferien an der frischen Luft arbeiten und Geld verdienen.","answer":"c"},{"no":"19","text":"Frau Yilmaz liebt Kinder. Sie hat am Wochenende Zeit, aber abends möchte sie nicht arbeiten.","answer":"e"},{"no":"20","text":"Jonas ist 15 und sucht einen Job für den Samstagvormittag.","answer":"X"}],"ads":{"a":{"img":"img/mt3-anzeige-a.png","alt":"Tageszeitung Nordkurier STELLENMARKT Zusteller/in gesucht Sie bringen unsere Zeitung zu den Leserinnen und Lesern im Stadtteil Westend – Montag bis Samstag von 5 bis 7 Uhr. Eigenes Fahrrad nötig, ab 18 Jahren. 14 Euro pro Stunde. Bewerbung: zustellung@nordkurier.de"},"b":{"img":"img/mt3-anzeige-b.png","alt":"Können Sie Mathe erklären? Lernstudio Plus Wir suchen Nachhilfelehrer/innen für Mathematik, Klasse 5 bis 10. Unterricht montags bis freitags von 15 bis 18 Uhr in kleinen Gruppen. Erfahrung mit Jugendlichen erwünscht – auch Rentnerinnen und Rentner sind willkommen! Tel. 0451 / 88 20 15"},"c":{"img":"img/mt3-anzeige-c.png","alt":"OBSTHOF LINDNER Erdbeeren pflücken Wir suchen Erntehelfer/innen für Juni und Juli, täglich von 6 bis 13 Uhr. Arbeit im Freien, ab 16 Jahren. Kostenloser Bus vom Bahnhof. Bezahlung pro Kiste, am Ende der Woche in bar. Einfach vorbeikommen: Lindenweg 3, Grünfeld"},"d":{"img":"img/mt3-anzeige-d.png","alt":"FAMILIE BRANDT SUCHT Babysitter/in für Zwillinge (3 Jahre) Freitag- und Samstagabend von 19 bis 24 Uhr. Erfahrung mit kleinen Kindern nötig, Nichtraucher/in. 15 Euro pro Stunde, die Fahrt nach Hause bezahlen wir. Bitte nur per SMS: 0170 / 44 12 390"},"e":{"img":"img/mt3-anzeige-e.png","alt":"MÖBELHAUS WOHNWELT MINIJOB Spielen ist Ihr Job! Für unsere Kinderspielecke suchen wir eine Betreuerin oder einen Betreuer, samstags von 10 bis 18 Uhr. Sie spielen und basteln mit Kindern von 3 bis 8 Jahren und lesen ihnen vor. Mindestalter 18 Jahre. Bewerbung online: wohnwelt.de/jobs"},"f":{"img":"img/mt3-anzeige-f.png","alt":"Pizzeria Napoli Fahrer/in gesucht Sie bringen unsere Pizzen zu den Kunden – Montag bis Donnerstag von 18 bis 22 Uhr. Führerschein und eigenes Auto oder Roller nötig. Das Trinkgeld gehört Ihnen! Fragen Sie nach Marco: 0451 / 70 31 88"}},"unused":["d"]}},"hoeren":{"t1":{"instruction":"Sie hören fünf kurze Texte. Sie hören jeden Text zweimal. Wählen Sie für die Aufgaben 1 bis 5 die richtige Lösung a, b oder c.","items":[{"no":"1","stem":"Wo beginnt die Führung heute?","options":{"a":"Im Museumscafé.","b":"Am Eingang.","c":"Im zweiten Stock."},"answer":"a"},{"no":"2","stem":"Wann hat Frau Jansen ihre nächste Fahrstunde?","options":{"a":"Am Mittwoch um 17 Uhr.","b":"Am Mittwoch um 18 Uhr.","c":"Am Freitag um 17 Uhr."},"answer":"c"},{"no":"3","stem":"Wo findet das Konzert bei Regen statt?","options":{"a":"Im Stadtpark.","b":"In der Stadthalle.","c":"In der Kirche."},"answer":"b"},{"no":"4","stem":"Was soll Herr Beck tun?","options":{"a":"Bei der Nachbarin laut klopfen.","b":"Das Paket bei der Post abholen.","c":"Die Nachbarin morgen anrufen."},"answer":"a"},{"no":"5","stem":"In welchem Saal läuft der Film „Sommerregen“?","options":{"a":"In Saal 1.","b":"In Saal 3.","c":"In Saal 5."},"answer":"b"}]},"t2":{"instruction":"Sie hören ein Gespräch. Sie hören den Text einmal. Welches Instrument spielen die Kinder? Wählen Sie für die Aufgaben 6 bis 10 ein passendes Bild aus a bis i. Wählen Sie jeden Buchstaben nur einmal. Sehen Sie sich jetzt die Bilder an.","persons":[{"no":"0","name":"Emma","answer":"a"},{"no":"6","name":"Leon","answer":"d"},{"no":"7","name":"Zoe","answer":"b"},{"no":"8","name":"Ali","answer":"h"},{"no":"9","name":"Nele","answer":"e"},{"no":"10","name":"Noah","answer":"i"}],"pictures":{"a":{"img":"img/mt3-hoeren2-a.webp","alt":"Klavier"},"b":{"img":"img/mt3-hoeren2-b.webp","alt":"Geige"},"c":{"img":"img/mt3-hoeren2-c.webp","alt":"Trompete"},"d":{"img":"img/mt3-hoeren2-d.webp","alt":"Schlagzeug"},"e":{"img":"img/mt3-hoeren2-e.webp","alt":"Querflöte"},"f":{"img":"img/mt3-hoeren2-f.webp","alt":"Gitarre"},"g":{"img":"img/mt3-hoeren2-g.webp","alt":"Cello"},"h":{"img":"img/mt3-hoeren2-h.webp","alt":"Saxofon"},"i":{"img":"img/mt3-hoeren2-i.webp","alt":"Akkordeon"}},"unused":["c","f","g"]},"t3":{"instruction":"Sie hören fünf kurze Gespräche. Sie hören jeden Text einmal. Wählen Sie für die Aufgaben 11 bis 15 die richtige Lösung a, b oder c.","items":[{"no":"11","stem":"Was isst der Mann zu Mittag?","options":{"a":{"img":"img/mt3-hoeren3-11a.webp","alt":"Suppe"},"b":{"img":"img/mt3-hoeren3-11b.webp","alt":"Pizza"},"c":{"img":"img/mt3-hoeren3-11c.webp","alt":"Salat"}},"answer":"a"},{"no":"12","stem":"Was nimmt die Frau mit?","options":{"a":{"img":"img/mt3-hoeren3-12a.webp","alt":"Regenschirm"},"b":{"img":"img/mt3-hoeren3-12b.webp","alt":"Schal"},"c":{"img":"img/mt3-hoeren3-12c.webp","alt":"Sonnenbrille"}},"answer":"b"},{"no":"13","stem":"Was kaufen die beiden?","options":{"a":{"img":"img/mt3-hoeren3-13a.webp","alt":"Regal"},"b":{"img":"img/mt3-hoeren3-13b.webp","alt":"Sofa"},"c":{"img":"img/mt3-hoeren3-13c.webp","alt":"Schreibtisch"}},"answer":"a"},{"no":"14","stem":"Wie viel bezahlt der Mann für den Helm?","options":{"a":{"img":"img/mt3-hoeren3-14a.webp","alt":"Fahrradhelm für 25 Euro"},"b":{"img":"img/mt3-hoeren3-14b.webp","alt":"Fahrradhelm für 40 Euro"},"c":{"img":"img/mt3-hoeren3-14c.webp","alt":"Fahrradhelm für 60 Euro"}},"answer":"b"},{"no":"15","stem":"An welchem Tag treffen sich die beiden?","options":{"a":{"img":"img/mt3-hoeren3-15a.webp","alt":"Montag, der 4."},"b":{"img":"img/mt3-hoeren3-15b.webp","alt":"Mittwoch, der 6."},"c":{"img":"img/mt3-hoeren3-15c.webp","alt":"Freitag, der 8."}},"answer":"c"}]},"t4":{"instruction":"Sie hören ein Interview. Sie hören den Text zweimal. Wählen Sie für die Aufgaben 16 bis 20 Ja oder Nein. Lesen Sie jetzt die Aufgaben.","context":"In der Sendung „Stadtgeschichten“ spricht ein Moderator mit Hanna Vogel. Sie ist Buchhalterin und hat ein ungewöhnliches Hobby: Sie hält Bienen mitten in der Stadt.","example":{"no":"0","text":"Hanna Vogel hat ihre Bienen in der Stadt.","answer":"Ja"},"items":[{"no":"16","text":"Hanna hat alles über Bienen von ihrem Großvater gelernt.","answer":"Nein"},{"no":"17","text":"Die Bienen stehen auf dem Dach von Hannas Wohnhaus.","answer":"Nein"},{"no":"18","text":"Die Bienen stechen Hanna nur selten.","answer":"Ja"},{"no":"19","text":"Hanna verkauft ihren Honig auf dem Wochenmarkt.","answer":"Nein"},{"no":"20","text":"Im Winter hat Hanna wenig Arbeit mit den Bienen.","answer":"Ja"}]}},"schreiben":{"intro":"Das Modul Schreiben hat zwei Teile. In Teil 1 schreiben Sie eine SMS, in Teil 2 eine E-Mail. Schreiben Sie Ihre Texte auf den Antwortbogen. Schreiben Sie bitte deutlich und nicht mit Bleistift. Wörterbücher und Mobiltelefone sind nicht erlaubt.","tasks":[{"no":1,"minutes":10,"words":[20,30],"situation":["Sie wollten heute Abend mit Ihrer Freundin Nele ins Kino gehen. Jetzt sind Sie krank. Schreiben Sie Nele eine SMS:"],"points":["Schreiben Sie, warum Sie nicht kommen können.","Schreiben Sie, was Nele mit Ihrer Karte machen soll.","Schlagen Sie einen anderen Tag für ein Treffen vor."],"instruction":"Schreiben Sie 20–30 Wörter. Schreiben Sie zu allen drei Punkten.","model":{"label":"SMS, 27 Wörter","text":"Hallo Nele,\n\nich habe Fieber und muss im Bett bleiben.\nGib meine Karte einfach deiner Schwester.\nWollen wir uns am Sonntag zum Kaffee treffen?\n\nLiebe Grüße, Lara"},"typicalErrors":"Nur *Ich bin krank, sorry* – ohne Hinweis zur Karte und ohne neuen Termin fehlen zwei Punkte."},{"no":2,"minutes":20,"words":[30,40],"situation":["Sie arbeiten in einem Büro. Am nächsten Freitag haben Sie einen wichtigen Termin und können nicht zur Arbeit kommen. Schreiben Sie Ihrer Chefin, Frau Steinmann, eine E-Mail."],"points":["Schreiben Sie, warum Sie am Freitag nicht kommen können.","Fragen Sie, ob Sie an diesem Tag freinehmen können.","Machen Sie einen Vorschlag, wann Sie die Arbeit nachholen."],"instruction":"Schreiben Sie 30–40 Wörter. Schreiben Sie zu allen drei Punkten. Vergessen Sie Anrede und Gruß nicht.","model":{"label":"E-Mail an die Chefin, 39 Wörter","text":"Betreff: Freier Tag am Freitag\n\nSehr geehrte Frau Steinmann,\n\nam Freitag um 10 Uhr habe ich einen wichtigen Termin in der Schule meiner Tochter.\nKönnte ich an diesem Tag bitte freinehmen?\nDie Arbeit hole ich gern am Samstagvormittag nach.\n\nMit freundlichen Grüßen\nLara Weiss"},"typicalErrors":"*Hallo Chefin, ich komme Freitag nicht* – falsches Register, keine Frage, kein Vorschlag zum Nachholen."}],"good":[{"label":"Erfüllung","text":"Alle drei Punkte, jeder in einem eigenen Satz; die Angaben sind konkret (Fieber, Sonntag, Freitag 10 Uhr, Samstagvormittag)."},{"label":"Register","text":"SMS mit *du* und *Hallo*, E-Mail mit *Sie*, *Sehr geehrte Frau Steinmann* und *Mit freundlichen Grüßen*."},{"label":"Wortschatz","text":"*Fieber, freinehmen, nachholen, Termin* statt allgemeiner Wörter wie *Sache* oder *machen*."},{"label":"Strukturen","text":"Modalverben (*muss*, *könnte*), Imperativ (*Gib … einfach*), Ja/Nein-Frage mit Verb an Position 1 (*Wollen wir uns … treffen?*), Zeitangaben mit *am* und *um*."}]},"audio":[{"src":"Goethe%20A2%20Modelltest%203.1.mp3","dur":475.53},{"src":"Goethe%20A2%20Modelltest%203.2.mp3","dur":155.14},{"src":"Goethe%20A2%20Modelltest%203.3.mp3","dur":245.08},{"src":"Goethe%20A2%20Modelltest%203.4.mp3","dur":256.81}],"pdf":"Goethe%20A2%20Modelltest%203.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"4":{"id":4,"roman":"IV","lesen":{"t1":{"instruction":"Sie lesen in einer Zeitung diesen Text. Wählen Sie für die Aufgaben 1 bis 5 die richtige Lösung a, b oder c.","title":"Ein Jahr ohne Auto","lead":"Familie Hartmann aus Bergheim hat zwölf Monate ohne eigenes Auto gelebt. Jetzt erzählt sie, wie es war.","paragraphs":["Als im letzten Frühjahr das alte Auto der Hartmanns kaputtging, wollten sie eigentlich sofort ein neues kaufen. „Aber dann hat unsere Tochter gefragt, ob wir es nicht ein Jahr lang ohne Auto versuchen wollen“, erzählt Sandra Hartmann. Die Familie wohnt am Rand einer Kleinstadt. Bis zur Arbeit und zur Schule sind es sechs Kilometer.","Statt eines neuen Autos hat die Familie ein Lastenrad gekauft. Damit bringt Sandra Hartmann morgens ihren kleinen Sohn in den Kindergarten und fährt nachmittags zum Einkaufen. Ihr Mann Jens fährt mit dem Bus ins Büro. „Im Winter war das anstrengend, besonders bei Regen“, sagt er. Für den Besuch bei den Großeltern, die 200 Kilometer entfernt wohnen, nimmt die Familie den Zug. Wenn es gar nicht anders geht, leihen sich die Hartmanns in der Stadt ein Carsharing-Auto.","Das Ergebnis nach einem Jahr: Die Familie hat fast 3000 Euro gespart und ist viel öfter draußen. Ein neues Auto wollen die Hartmanns nicht mehr kaufen. Zwei Wünsche an die Stadt haben sie aber noch: mehr Radwege und einen Bus, der auch sonntags fährt."],"quote":"„Im Winter war das anstrengend, besonders bei Regen.“","source":"aus einer deutschen Tageszeitung","tasksIntro":"Lesen Sie die Aufgaben 1 bis 5 zum Artikel „Ein Jahr ohne Auto“. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","example":{"no":"0","stem":"Familie Hartmann …","options":{"a":"hat ein neues Auto gekauft.","b":"hat ein Jahr lang ohne Auto gelebt.","c":"wohnt im Zentrum einer Großstadt."},"answer":"b"},"items":[{"no":"1","stem":"Die Idee, ein Jahr ohne Auto zu leben, …","options":{"a":"hatte die Tochter.","b":"kam von den Eltern.","c":"stand in der Zeitung."},"answer":"a"},{"no":"2","stem":"Sandra Hartmann …","options":{"a":"bringt ihren Sohn mit dem Bus in den Kindergarten.","b":"arbeitet in einem Büro in der Stadt.","c":"fährt zum Einkaufen nicht mit dem Auto."},"answer":"c"},{"no":"3","stem":"Jens Hartmann …","options":{"a":"fährt gern bei Regen mit dem Bus.","b":"findet den Winter ohne Auto schwierig.","c":"fährt mit dem Rad ins Büro."},"answer":"b"},{"no":"4","stem":"Zu den Großeltern …","options":{"a":"fährt die Familie mit dem Zug.","b":"fährt die Familie mit einem geliehenen Auto.","c":"fahren die Hartmanns nicht mehr."},"answer":"a"},{"no":"5","stem":"Nach dem Jahr …","options":{"a":"will die Familie wieder ein Auto kaufen.","b":"gibt es in Bergheim mehr Radwege.","c":"hat die Familie weniger Geld ausgegeben als vorher."},"answer":"c"}],"image":"img/mt4-lesen-foto.jpg","imageAlt":"Eine Frau fährt mit dem Lastenrad durch ein Dorf. Vorn im Rad sitzt ein Kind mit Helm, im Hintergrund fährt ein Bus."},"t2":{"instruction":"Sie sind im Stadttheater. Lesen Sie die Aufgaben 6 bis 10 und die Informationstafel. In welchen Stock gehen Sie? Wählen Sie die richtige Lösung a, b oder c.","board":{"title":"Stadttheater Grünberg","label":"WEGWEISER","rows":[{"floor":"2. Stock","text":"Zweiter Rang (Reihen 1–8) · Studiobühne (kleine Stücke, Lesungen) · Theaterpädagogik (Kurse für Schulklassen) · Büro der Theaterleitung"},{"floor":"1. Stock","text":"Erster Rang (Reihen 1–6) · Foyer-Bar (Getränke in der Pause, Vorbestellung vor der Vorstellung möglich) · Garderobe Rang · Ausstellung „100 Jahre Stadttheater“"},{"floor":"EG","text":"Haupteingang · Abendkasse (reservierte Karten abholen und bezahlen, bis 15 Minuten vor Beginn) · Garderobe Parkett · Parkett (Reihen 1–18) · Rollstuhlplätze (Reihe 1) · Theatershop (Programmhefte, Bücher, CDs)"},{"floor":"UG","text":"Theatercafé (warme Küche ab zwei Stunden vor Beginn) · Toiletten · Kinderbetreuung bei Nachmittagsvorstellungen (3–8 Jahre) · Fundsachen · Ausgang zur Tiefgarage"}]},"example":{"no":"0","stem":"Sie haben Karten reserviert und möchten sie jetzt bezahlen.","options":{"a":"EG","b":"1. Stock","c":"anderer Stock"},"answer":"a"},"items":[{"no":"6","stem":"Auf Ihrer Karte steht: Erster Rang, Reihe 3. Sie möchten vorher Ihren Mantel abgeben.","options":{"a":"EG","b":"1. Stock","c":"anderer Stock"},"answer":"b"},{"no":"7","stem":"Sie möchten in der Pause ein Glas Sekt trinken, aber nicht lange warten.","options":{"a":"EG","b":"2. Stock","c":"anderer Stock"},"answer":"c"},{"no":"8","stem":"Sie sind früh da und möchten vor der Vorstellung noch etwas essen.","options":{"a":"UG","b":"EG","c":"anderer Stock"},"answer":"a"},{"no":"9","stem":"Ihre Freundin sitzt im Rollstuhl und kommt heute mit ins Theater.","options":{"a":"1. Stock","b":"EG","c":"anderer Stock"},"answer":"b"},{"no":"10","stem":"Sie suchen für die Nachmittagsvorstellung eine Betreuung für Ihre fünfjährige Tochter.","options":{"a":"2. Stock","b":"1. Stock","c":"anderer Stock"},"answer":"c"}]},"t3":{"instruction":"Sie lesen eine E-Mail. Wählen Sie für die Aufgaben 11 bis 15 die richtige Lösung a, b oder c.","mail":{"from":"Nina Schulte","to":"Katja Winter","subject":"Wir heiraten! Und eine Bitte …","greeting":"Liebe Katja,","closing":["Liebe Grüße, auch von Tom","Nina"],"paragraphs":["du wirst es nicht glauben: Tom und ich heiraten – nach sieben Jahren zusammen! Die Hochzeit ist am Samstag, dem 15. August. Tom hat mich beim Wandern in den Bergen gefragt, ob ich ihn heiraten will. Den Ring hatte er die ganze Zeit im Rucksack. Eigentlich wollten wir nur zu zweit aufs Standesamt gehen. Aber meine Mutter hat so lange geredet, bis wir zu einer kleinen Feier Ja gesagt haben. Jetzt kommen sogar fünfzig Gäste.","Die Trauung ist um 11 Uhr im Standesamt, danach feiern wir im Garten meiner Eltern. Ein Zelt haben wir schon bestellt, falls es regnet. Das Essen macht ein Restaurant aus dem Dorf, aber den Kuchen backen meine Tante und ihre Nachbarinnen. Ich darf nicht helfen, das ist in unserer Familie Tradition. Die Musik macht eine Band aus Toms Fußballverein. Sonst spielt sie nur auf Dorffesten.","Und jetzt meine Bitte: Du fotografierst doch so gern. Könntest du bei der Feier die Fotos machen? Für einen richtigen Fotografen reicht unser Geld nach dem Zelt und der Musik nicht mehr. Mein Vater wollte zuerst selbst fotografieren, aber auf seinen Fotos fehlen immer die Köpfe. Natürlich musst du nicht den ganzen Tag fotografieren, nur bei der Trauung und danach ein bisschen im Garten.","Außerdem suchen wir noch jemanden, der Toms Oma abholt. Sie wohnt in Halle und fährt nicht mehr gern Zug. Mit dem Auto braucht man etwa zwei Stunden. Vielleicht hast du eine Idee.","Komm bitte schon am Freitag, dann können wir zusammen den Garten schmücken und abends in Ruhe reden. Schlafen kannst du bei uns, das Gästezimmer ist frei. Ich freue mich so!"]},"tasksIntro":"Lesen Sie die Aufgaben 11 bis 15 zu Ninas E-Mail. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","example":{"no":"0","stem":"Nina und Tom …","options":{"a":"haben vor sieben Jahren geheiratet.","b":"heiraten im August.","c":"wollen nur zu zweit feiern."},"answer":"b"},"items":[{"no":"11","stem":"Die Feier …","options":{"a":"ist größer geworden als geplant.","b":"findet im Standesamt statt.","c":"war die Idee von Nina und Tom."},"answer":"a"},{"no":"12","stem":"Den Kuchen …","options":{"a":"bestellen Nina und Tom im Restaurant.","b":"backt Nina zusammen mit ihrer Tante.","c":"machen Verwandte und Nachbarinnen."},"answer":"c"},{"no":"13","stem":"Nina bittet Katja, …","options":{"a":"einen Fotografen zu suchen.","b":"den ganzen Tag zu fotografieren.","c":"bei der Trauung Fotos zu machen."},"answer":"c"},{"no":"14","stem":"Toms Oma …","options":{"a":"fährt mit dem Zug nach Halle.","b":"soll mit dem Auto abgeholt werden.","c":"wohnt bei Toms Eltern."},"answer":"b"},{"no":"15","stem":"Katja soll …","options":{"a":"schon einen Tag vor der Hochzeit kommen.","b":"in einem Hotel übernachten.","c":"den Garten der Eltern fotografieren."},"answer":"a"}]},"t4":{"instruction":"Sechs Personen suchen in der Zeitung und im Internet eine Wohnung. Lesen Sie die Aufgaben 16 bis 20 und die Anzeigen a bis f. Welche Anzeige passt zu welcher Person? Für eine Aufgabe gibt es keine Lösung. Markieren Sie so: X. Die Anzeige aus dem Beispiel können Sie nicht mehr wählen.","example":{"no":"0","text":"Jana studiert ab Oktober in Grünberg und sucht ein Zimmer. Viel Geld hat sie nicht.","answer":"a"},"items":[{"no":"16","text":"Familie Aydin hat zwei Kinder und einen Hund. Die Kinder möchten draußen spielen können.","answer":"c"},{"no":"17","text":"Herr und Frau Lemke sind über 70. Treppensteigen fällt ihnen schwer.","answer":"d"},{"no":"18","text":"Marco arbeitet für drei Monate in Grünberg und braucht eine Wohnung mit Möbeln.","answer":"e"},{"no":"19","text":"Nora und Elias arbeiten beide im Zentrum und haben kein Auto. Sie suchen eine Wohnung für zwei Personen, die nicht zu teuer ist.","answer":"b"},{"no":"20","text":"Familie Kowalski sucht für zwei Wochen im August eine Ferienwohnung am Meer.","answer":"X"}],"ads":{"a":{"img":"img/mt4-anzeige-a.png","alt":"P Pia & Anton heute, 18:42 Zimmer frei in unserer 3er-WG! 14 m², ab 1. Oktober, 290 € warm. Wir sind Pia (24, Lehramt) und Anton (26, Informatik). Küche und Bad teilen wir uns, eine Waschmaschine ist da. Möbel musst du selbst mitbringen. Mit dem Rad bist du in zehn Minuten an der Uni. Nur Nichtraucher/innen. Schreib uns einfach eine Nachricht!"},"b":{"img":"img/mt4-anzeige-b.png","alt":"IMMOBILIEN KRÜGER EXPOSÉ Nr. 2231 Altbauwohnung im Zentrum 2 Zimmer, Küche, Bad, 58 m², 3. Stock ohne Aufzug, Balkon zum Hof. 620 € plus Nebenkosten. Keine Haustiere. Bus und Straßenbahn direkt vor der Tür, aber kein Parkplatz. Besichtigung: Samstag 10–12 Uhr"},"c":{"img":"img/mt4-anzeige-c.png","alt":"IMMOBILIEN · VERMIETUNG Reihenhaus am Stadtrand 4 Zi., Garten, Garage 110 m², Terrasse, Kindergarten und Grundschule im Ort. Haustiere nach Absprache erlaubt. 1.150 € kalt, frei ab 1. September. Chiffre 4471 · Antworten an die Zeitung"},"d":{"img":"img/mt4-anzeige-d.png","alt":"Wohnen ohne Stufen WOHNPARK LINDENHOF 2-Zimmer-Wohnung, 55 m², 2. Stock mit Aufzug, breite Türen, Dusche ohne Schwelle, Notrufknopf. Für Mieterinnen und Mieter ab 60 Jahren. Hausmeister im Haus, Supermarkt und Apotheke nur 200 Meter entfernt. 680 € warm · Tel. 0641 / 55 03 12"},"e":{"img":"img/mt4-anzeige-e.png","alt":"KOMPLETT MÖBLIERT 750 €/Monat Apartment Bahnhofstraße 32 m² mit Bett, Schrank, Küche mit Geschirr, Fernseher und WLAN. 5 Minuten zu Fuß zum Bahnhof.
