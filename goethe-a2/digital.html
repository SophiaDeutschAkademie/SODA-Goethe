ung „Menschen am Meer“ spricht eine Moderatorin mit Maren Petersen. Sie ist Briefträgerin auf einer kleinen Nordseeinsel.","example":{"no":"0","text":"Maren Petersen arbeitet auf einer Insel.","answer":"Ja"},"items":[{"no":"16","text":"Maren ist auf der Insel aufgewachsen.","answer":"Nein"},{"no":"17","text":"Maren bringt die Post mit dem Fahrrad.","answer":"Ja"},{"no":"18","text":"Im Winter kommt die Post jeden Tag auf die Insel.","answer":"Nein"},{"no":"19","text":"Maren hilft älteren Leuten auch beim Einkaufen.","answer":"Ja"},{"no":"20","text":"Im Sommer hat Maren weniger zu tun.","answer":"Nein"}]}},"schreiben":{"intro":"Das Modul Schreiben hat zwei Teile. In Teil 1 schreiben Sie eine SMS, in Teil 2 eine E-Mail. Schreiben Sie Ihre Texte auf den Antwortbogen. Schreiben Sie bitte deutlich und nicht mit Bleistift. Wörterbücher und Mobiltelefone sind nicht erlaubt.","tasks":[{"no":1,"minutes":10,"words":[20,30],"situation":["Ihre Freundin Anna hat Ihnen für das Wochenende ihr Fahrrad geliehen. Jetzt ist ein Reifen kaputt. Schreiben Sie Anna eine SMS:"],"points":["Schreiben Sie, was passiert ist.","Entschuldigen Sie sich.","Machen Sie einen Vorschlag, wie Sie das Problem lösen wollen."],"instruction":"Schreiben Sie 20–30 Wörter. Schreiben Sie zu allen drei Punkten.","model":{"label":"SMS, 30 Wörter","text":"Hallo Anna,\n\nbeim Fahren ist ein Reifen an deinem Rad kaputtgegangen.\nDas tut mir sehr leid!\nIch bringe es morgen in die Werkstatt und bezahle die Reparatur.\n\nLiebe Grüße, Julia"},"typicalErrors":"Nur *Sorry, dein Rad ist kaputt* – Punkt 1 ist zu knapp, und Punkt 3 (Vorschlag) fehlt."},{"no":2,"minutes":20,"words":[30,40],"situation":["Sie haben in einem Online-Shop Sportschuhe bestellt. Heute ist das Paket gekommen, aber die Schuhe haben die falsche Größe. Schreiben Sie dem Kundenservice eine E-Mail."],"points":["Schreiben Sie, was Sie bestellt und was Sie bekommen haben.","Schreiben Sie, was Sie jetzt möchten.","Fragen Sie, wie Sie die falschen Schuhe zurückschicken können."],"instruction":"Schreiben Sie 30–40 Wörter. Schreiben Sie zu allen drei Punkten. Vergessen Sie Anrede und Gruß nicht.","model":{"label":"E-Mail an den Online-Shop, 39 Wörter","text":"Betreff: Bestellung 48213 – falsche Größe\n\nSehr geehrte Damen und Herren,\n\nich habe Sportschuhe in Größe 42 bestellt, bekommen habe ich aber Größe 39.\nBitte schicken Sie mir die Schuhe in Größe 42.\nWie kann ich die falschen Schuhe zurückschicken?\n\nMit freundlichen Grüßen\nJulia Kern"},"typicalErrors":"*Hallo, die Schuhe sind falsch* – falsche Anrede, keine Größenangabe, kein Wunsch und keine Frage zur Rücksendung."}],"good":[{"label":"Erfüllung","text":"Alle drei Punkte, jeder in einem eigenen Satz; die Angaben sind konkret (Reifen, morgen, Werkstatt; Größe 42 und 39)."},{"label":"Register","text":"SMS mit *du* und *Hallo*, E-Mail mit *Sie*, *Sehr geehrte Damen und Herren* und *Mit freundlichen Grüßen*."},{"label":"Wortschatz","text":"*kaputtgegangen, Reparatur, bestellt, zurückschicken* statt allgemeiner Wörter wie *Problem* oder *machen*."},{"label":"Strukturen","text":"Perfekt (*ist kaputtgegangen*, *habe bestellt*), Gegensatz mit *aber*, höfliche Bitte mit *Bitte schicken Sie*, W-Frage (*Wie kann ich …?*)."}]},"audio":[{"src":"Goethe%20A2%20Modelltest%204.1.mp3","dur":473.44},{"src":"Goethe%20A2%20Modelltest%204.2.mp3","dur":151.17},{"src":"Goethe%20A2%20Modelltest%204.3.mp3","dur":266.37},{"src":"Goethe%20A2%20Modelltest%204.4.mp3","dur":254.41}],"pdf":"Goethe%20A2%20Modelltest%204.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"5":{"id":5,"roman":"V","lesen":{"t1":{"instruction":"Sie lesen in einer Zeitung diesen Text. Wählen Sie für die Aufgaben 1 bis 5 die richtige Lösung a, b oder c.","title":"Reparieren statt wegwerfen","lead":"Im Repair-Café in Wittenberg reparieren Freiwillige kaputte Dinge – kostenlos. Das Team um Horst Krämer hat viel zu tun.","paragraphs":["Ein Toaster, der nicht mehr warm wird, ein Radio ohne Ton, eine Jacke mit kaputtem Reißverschluss: Jeden ersten Samstag im Monat bringen die Leute solche Dinge ins Gemeindehaus in Wittenberg. Dort warten Horst Krämer und zehn andere Freiwillige. Der 72-Jährige hat 40 Jahre lang als Elektriker gearbeitet. „Früher hat man Sachen repariert. Heute wirft man sie weg und kauft neue“, sagt er. „Das wollten wir ändern.“","Das Repair-Café gibt es seit drei Jahren. Die Reparatur kostet nichts, nur neue Teile muss man bezahlen. Krämer ist aber noch etwas anderes wichtig: „Die Leute sollen nicht nur zuschauen, sondern mithelfen. Dann können sie es beim nächsten Mal vielleicht selbst.“ Etwa zwei von drei Geräten funktionieren am Ende wieder.","Die meisten Besucher sind Rentner, aber es kommen auch immer mehr junge Familien. Für sie gibt es seit diesem Jahr eine eigene Ecke für kaputtes Spielzeug. Am längsten wartet man am Tisch von Renate Voss: Sie repariert Uhren – und sie ist die Einzige hier, die das kann. Deshalb sucht das Team noch einen zweiten Uhrmacher."],"quote":"„Die Leute sollen nicht nur zuschauen, sondern mithelfen.“","source":"aus einer deutschen Tageszeitung","tasksIntro":"Lesen Sie die Aufgaben 1 bis 5 zum Artikel „Reparieren statt wegwerfen“. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","example":{"no":"0","stem":"Horst Krämer …","options":{"a":"hat ein Geschäft für Elektrogeräte.","b":"repariert mit anderen kaputte Dinge.","c":"verkauft gebrauchte Radios."},"answer":"b"},"items":[{"no":"1","stem":"Das Repair-Café …","options":{"a":"findet einmal im Monat statt.","b":"ist jede Woche geöffnet.","c":"ist nur für Rentner."},"answer":"a"},{"no":"2","stem":"Im Repair-Café …","options":{"a":"kostet jede Reparatur zehn Euro.","b":"muss man nichts bezahlen.","c":"bezahlt man nur für neue Teile."},"answer":"c"},{"no":"3","stem":"Horst Krämer möchte, dass die Besucher …","options":{"a":"beim Reparieren zuschauen.","b":"selbst mitarbeiten.","c":"ihre Geräte zu Hause reparieren."},"answer":"b"},{"no":"4","stem":"Seit diesem Jahr …","options":{"a":"gibt es ein Angebot für Kinder.","b":"kommen keine Familien mehr.","c":"ist das Café in einem neuen Haus."},"answer":"a"},{"no":"5","stem":"Das Team sucht …","options":{"a":"jemanden, der Spielzeug repariert.","b":"noch einen Elektriker.","c":"jemanden für die Uhren."},"answer":"c"}],"image":"img/mt5-lesen-foto.jpg","imageAlt":"Ein älterer Mann repariert mit einem Schraubenzieher einen Toaster. Eine Frau und ein Junge helfen ihm. Im Hintergrund arbeiten weitere Menschen an Tischen."},"t2":{"instruction":"Sie sind am Hauptbahnhof. Lesen Sie die Aufgaben 6 bis 10 und die Informationstafel. In welchen Stock gehen Sie? Wählen Sie die richtige Lösung a, b oder c.","board":{"title":"Hauptbahnhof Westfeld","label":"WEGWEISER","rows":[{"floor":"2. Stock","text":"Bahnhofshotel (Rezeption, 40 Zimmer) · Konferenzräume (Reservierung an der Hotelrezeption) · Verwaltung der Bahn (kein Kundenservice) · Dachterrasse für Hotelgäste"},{"floor":"1. Stock","text":"Restaurant „Gleis 1“ (warme Küche 11–22 Uhr) · Warteraum · Bahnhofsmission (Hilfe für Reisende, Ruheraum) · Friseur · Toiletten · Übergang zum Parkhaus"},{"floor":"EG","text":"Gleise 1–8 · Reisezentrum (Fahrkarten und Beratung, täglich 6–21 Uhr) · Information · Bäckerei · Zeitungen und Reisebedarf · Blumenladen · Apotheke (Mo–Sa 7–22 Uhr) · Polizei · Taxistand vor dem Haupteingang"},{"floor":"UG","text":"S-Bahn (Gleise 11–14) · Schließfächer · Gepäckaufbewahrung · Fahrradparkhaus (überwacht) · Supermarkt (täglich bis 23 Uhr) · Toiletten und Duschen · Ausgang zum Busbahnhof"}]},"example":{"no":"0","stem":"Sie möchten eine Fahrkarte nach München kaufen und sich beraten lassen.","options":{"a":"EG","b":"UG","c":"anderer Stock"},"answer":"a"},"items":[{"no":"6","stem":"Ihr Zug fährt erst in zwei Stunden. Sie möchten Ihren schweren Koffer so lange nicht mit sich herumtragen.","options":{"a":"EG","b":"UG","c":"anderer Stock"},"answer":"b"},{"no":"7","stem":"Sie haben Kopfschmerzen und brauchen Tabletten.","options":{"a":"1. Stock","b":"UG","c":"anderer Stock"},"answer":"c"},{"no":"8","stem":"Sie kommen mit dem Rad zum Bahnhof und möchten es dort sicher abstellen.","options":{"a":"UG","b":"1. Stock","c":"anderer Stock"},"answer":"a"},{"no":"9","stem":"Sie wollen vor der Abfahrt noch etwas Warmes essen.","options":{"a":"EG","b":"1. Stock","c":"anderer Stock"},"answer":"b"},{"no":"10","stem":"Ihre Mutter kommt mit dem Zug und bleibt eine Nacht. Sie sucht ein Hotel direkt am Bahnhof.","options":{"a":"1. Stock","b":"EG","c":"anderer Stock"},"answer":"c"}]},"t3":{"instruction":"Sie lesen eine E-Mail. Wählen Sie für die Aufgaben 11 bis 15 die richtige Lösung a, b oder c.","mail":{"from":"Hilde Neumann","to":"Emma Neumann","subject":"Meine erste E-Mail!","greeting":"Liebe Emma,","closing":["Viele Grüße und einen Kuss","deine Oma Hilde"],"paragraphs":["du liest richtig: Das ist meine erste E-Mail! Seit September gehe ich jeden Dienstag in einen Computerkurs im Seniorentreff. Dein Vater hat laut gelacht, als ich ihm das am Telefon erzählt habe. Aber ich wollte endlich verstehen, was ihr alle den ganzen Tag mit euren Handys und Computern macht.","Wir sind acht im Kurs, alle über 65. Unser Lehrer Jakob ist Student und erst 22. Er hat viel Geduld, denn ich frage jede Woche dreimal dasselbe. Zuerst habe ich gelernt, wie man E-Mails schreibt und Fotos schickt. Letzte Woche haben wir im Internet Rezepte gesucht und uns ein Kochvideo angesehen. Ich wusste nicht, dass es so viele davon gibt!","Meine Nachbarin Frau Kurz sagt, das Internet ist gefährlich. Ein bisschen Angst habe ich auch. Jakob sagt, ich darf nie mein Passwort weitergeben und keine E-Mails von Fremden öffnen. Das habe ich mir auf einen Zettel geschrieben. Er hängt jetzt am Kühlschrank, neben deinem Foto.","Jetzt zu meiner Bitte: Dein Opa und ich möchten euch so gern öfter sehen. Jakob sagt, man kann mit dem Computer auch telefonieren und sich dabei sehen. Kannst du mir das am Sonntag zeigen, wenn ihr zum Kaffee kommt? Dann können wir auch mit Onkel Peter in Kanada sprechen. Er ist im März Opa geworden, und wir haben das Baby bisher nur auf zwei Fotos gesehen.","Antworte mir bitte – aber nicht zu schnell, ich muss erst lernen, wie ich deine Antwort finde!"]},"tasksIntro":"Lesen Sie die Aufgaben 11 bis 15 zur E-Mail von Hilde. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","example":{"no":"0","stem":"Hilde …","options":{"a":"schreibt zum ersten Mal eine E-Mail.","b":"arbeitet im Seniorentreff.","c":"hat einen Computer gekauft."},"answer":"a"},"items":[{"no":"11","stem":"Der Kurs …","options":{"a":"findet einmal pro Woche statt.","b":"ist nur für junge Leute.","c":"dauert bis September."},"answer":"a"},{"no":"12","stem":"Jakob …","options":{"a":"erklärt die Dinge auch mehrmals.","b":"wird schnell ungeduldig.","c":"ist der älteste Teilnehmer."},"answer":"a"},{"no":"13","stem":"Hilde …","options":{"a":"hat gar keine Angst vor dem Internet.","b":"hat sich die Regeln aufgeschrieben.","c":"hat ihr Passwort an die Nachbarin gegeben."},"answer":"b"},{"no":"14","stem":"Am Sonntag soll Emma …","options":{"a":"Onkel Peter in Kanada besuchen.","b":"ihrer Oma einen Videoanruf erklären.","c":"Kuchen für die Großeltern backen."},"answer":"b"},{"no":"15","stem":"Hilde bittet Emma, …","options":{"a":"sofort zu antworten.","b":"nicht per E-Mail zu antworten.","c":"ihr Zeit für die Antwort zu lassen."},"answer":"c"}]},"t4":{"instruction":"Sechs Personen suchen im Internet Hilfe im Alltag. Lesen Sie die Aufgaben 16 bis 20 und die Anzeigen a bis f. Welche Anzeige passt zu welcher Person? Für eine Aufgabe gibt es keine Lösung. Markieren Sie so: X. Die Anzeige aus dem Beispiel können Sie nicht mehr wählen.","example":{"no":"0","text":"Herr Bauer zieht nächste Woche um und hat viele Kisten, aber kein Auto.","answer":"a"},"items":[{"no":"16","text":"Frau Lindner fliegt für zwei Wochen nach Portugal. Ihr Hund kann nicht mitkommen.","answer":"b"},{"no":"17","text":"Frau Jansen ist 85 und :{"instruction":"Sie hören ein Interview. Sie hören den Text zweimal. Wählen Sie für die Aufgaben 16 bis 20 Ja oder Nein. Lesen Sie jetzt die Aufgaben.","context":"In der Sendung „Landleben“ spricht ein Moderator mit Lena Hofer. Sie ist 28 Jahre alt und arbeitet als Schäferin.","example":{"no":"0","text":"Lena Hofer arbeitet mit Schafen.","answer":"Ja"},"items":[{"no":"16","text":"Lena ist auf einem Bauernhof aufgewachsen.","answer":"Nein"},{"no":"17","text":"Lena hat den Beruf durch ein Praktikum kennengelernt.","answer":"Ja"},{"no":"18","text":"Im Winter sind die Schafe draußen auf der Wiese.","answer":"Nein"},{"no":"19","text":"Lena fühlt sich bei der Arbeit oft allein.","answer":"Nein"},{"no":"20","text":"Lena möchte später Käse aus Schafsmilch machen.","answer":"Ja"}]}},"schreiben":{"intro":"Das Modul Schreiben hat zwei Teile. In Teil 1 schreiben Sie eine SMS, in Teil 2 eine E-Mail. Schreiben Sie Ihre Texte auf den Antwortbogen. Schreiben Sie bitte deutlich und nicht mit Bleistift. Wörterbücher und Mobiltelefone sind nicht erlaubt.","tasks":[{"no":1,"minutes":10,"words":[20,30],"situation":["Sie haben zwei Karten für ein Basketballspiel am Freitagabend. Ihr Bruder wollte mitkommen, aber er ist krank geworden. Schreiben Sie Ihrem Freund Timo eine SMS:"],"points":["Schreiben Sie, warum Sie eine Karte übrig haben.","Fragen Sie, ob Timo Zeit hat.","Schlagen Sie vor, wo und wann Sie sich treffen."],"instruction":"Schreiben Sie 20–30 Wörter. Schreiben Sie zu allen drei Punkten.","model":{"label":"SMS, 30 Wörter","text":"Hallo Timo,\n\nich habe eine Karte fürs Basketballspiel am Freitag übrig, mein Bruder ist krank.\nHast du Zeit?\nTreffen wir uns um 19 Uhr vor der Halle?\n\nViele Grüße, Sam"},"typicalErrors":"Nur *Kommst du Freitag Basketball?* – der Grund (Karte übrig, Bruder krank) und der Treffpunkt fehlen."},{"no":2,"minutes":20,"words":[30,40],"situation":["Sie möchten Ihr Deutsch verbessern und haben eine Anzeige der Sprachschule Lingua gelesen: „Deutschkurs am Abend“. Schreiben Sie der Sprachschule eine E-Mail."],"points":["Schreiben Sie, warum Sie einen Kurs suchen.","Fragen Sie nach den Kurszeiten und dem Preis.","Fragen Sie, ob Sie vorher einen Test machen müssen."],"instruction":"Schreiben Sie 30–40 Wörter. Schreiben Sie zu allen drei Punkten. Vergessen Sie Anrede und Gruß nicht.","model":{"label":"E-Mail an die Sprachschule, 40 Wörter","text":"Betreff: Deutschkurs am Abend\n\nSehr geehrte Damen und Herren,\n\nich arbeite seit einem Jahr in Deutschland und möchte mein Deutsch für den Beruf verbessern.\nWann findet der Abendkurs statt, und was kostet er?\nMuss ich vorher einen Test machen?\n\nMit freundlichen Grüßen\nSam Costa"},"typicalErrors":"*Hallo, ich will Deutschkurs. Wie viel?* – falsche Anrede, kein Grund, keine Frage nach dem Test."}],"good":[{"label":"Erfüllung","text":"Alle drei Punkte, jeder in einem eigenen Satz; die Angaben sind konkret (Basketballspiel, Freitag, 19 Uhr, vor der Halle; seit einem Jahr, für den Beruf)."},{"label":"Register","text":"SMS mit *du* und *Hallo*, E-Mail mit *Sie*, *Sehr geehrte Damen und Herren* und *Mit freundlichen Grüßen*."},{"label":"Wortschatz","text":"*Karten, Halle, verbessern, Abendkurs, Test* statt allgemeiner Wörter wie *Sache* oder *machen*."},{"label":"Strukturen","text":"Zwei W-Fragen in einem Satz (*Wann … und was …?*), Modalverben *möchte*, *muss*, Zeitangabe mit *seit*, Ja/Nein-Frage (*Hast du Zeit?*)."}]},"audio":[{"src":"Goethe%20A2%20Modelltest%205.1.mp3","dur":483.0},{"src":"Goethe%20A2%20Modelltest%205.2.mp3","dur":155.72},{"src":"Goethe%20A2%20Modelltest%205.3.mp3","dur":263.11},{"src":"Goethe%20A2%20Modelltest%205.4.mp3","dur":265.01}],"pdf":"Goethe%20A2%20Modelltest%205.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}}}}</script>

  /* ---------- volume ---------- */
  function getVol() { var v = lsGet('vol'); return typeof v === 'number' ? v : 0.85; }

  /* ---------- exam shell ---------- */
  function begin(state, withTour) {
    clearTimeout(probeTimer); probeTimer = null;
    if (R.mod === 'hoeren') { audioAllowPause = true; try { AUD.pause(); } catch (e) { /* ignore */ } audioAllowPause = false; }
    S = state;
    warned = {}; markMode = false;
    if (S.build !== D.build) { S.marks = {}; S.build = D.build; }

    if (!(S.page >= 0 && S.page < M.pages.length)) S.page = 0;
    if (S.remaining < 60 * 10) warned[10] = true;
    if (S.remaining < 60 * 5) warned[5] = true;
    renderExam();
    if (withTour) runTour(function () { startClock(); });

  }

  function renderExam() {

      $('#mkx').addEventListener('click', function () {

  function applyFont() {
    var root = document.documentElement;

    $$('#fz button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.getAttribute('data-fz') === S.font)); });
  }

  function teilPages(teil) { var r = []; M.pages.forEach(function (p, i) { if (p.teil === teil) r.push(i); }); return r; }
  function maxReachable() {
    if (R.mod !== 'hoeren' || S.audio.done) return M.pages.length - 1;
    return S.audio.track;
  }

  function renderTabs() {
    var cur = M.pages[S.page].teil;
    var h = M.teile.map(function (teil) {
      var pidx = teilPages(teil)[0];
      var locked = pidx > maxReachable();
      var label, pr = '', done = false;
      if (M.writing) {
        var wc = wordCount(S.texts[teil]);
        label = 'Aufgabe ' + teil;
        pr = wc + ' Wörter';
        done = wc >= T.schreiben.tasks[teil - 1].words[0];
      } else {
        var its = M.items.filter(function (it) { return it.teil === teil; });
        var ans = its.filter(function (it) { return S.answers[it.no] != null; }).length;
        label = 'Teil ' + teil; pr = ans + '/' + its.length; done = ans === its.length;
      }
      return '<button class="tab' + (done ? ' done' : '') + '" role="tab" type="button" data-teil="' + teil + '" aria-selected="' + (teil === cur) + '"' + (locked ? ' disabled' : '') + '>' +
        (locked ? '<span class="lock">' + ICON.lock + '</span>' : '') + esc(label) + ' <span class="pr">' + (done && !M.writing ? ICON.check + ' ' : '') + esc(pr) + '</span></button>';
    }).join('');

    $$('.tab', tabs).forEach(function (b) {

        var teil = +b.getAttribute('data-teil');

    });
    var sel = $('.tab[aria-selected="true"]', tabs);

  }

  function renderChips() {
    var chips = $('#chips');

      h += '<button class="chip' + (ans ? ' ans' : '') + (it.page === S.page ? ' cur' : '') + '" type="button" data-no="' + esc(it.no) + '"' +
        (it.page > reach ? ' disabled' : '') + ' title="Aufgabe ' + esc(it.no) + (ans ? ' – beantwortet' : ' – offen') + '">' + esc(it.no) + '</button>';

  }

    $('#next').disabled = S.page >= M.pages.length - 1 || S.page + 1 > maxReachable();
  }

  function renderPage() {
    var p = M.pages[S.page];

    }

      h += '<section class="pane l" aria-label="Aufgabe"><div class="ph"><h2>' + esc(p.leftTitle) + '</h2></div><div class="pb">' + p.left + '</div></section>';
      h += '<section class="pane r wr" aria-label="Ihr Text"><div class="ph"><h2>Ihr Text</h2></div><div class="pb">' +
        '<div class="sz" id="sz"><span>Sonderzeichen</span>' + ['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü', '„', '“'].map(function (c) { return '<button type="button" data-ch="' + c + '" tabindex="-1">' + c + '</button>'; }).join('') + '</div>' +
        '<textarea class="ed" id="ed" spellcheck="false" autocomplete="off" autocapitalize="sentences" aria-label="Text für Aufgabe ' + p.teil + '"></textarea>' +
        '<div class="wc" id="wc"><span>' + esc(wordsText(p.task)) + '</span><span>Wörter: <b id="wcn">0</b></span></div></div></section>';
    } else if (M.two) {
      var left = S.marks[p.key] || p.left;
      h += '<section class="pane l" id="paneL" aria-label="Text"><div class="ph"><h2>' + esc(p.title) + ' · ' + esc(p.leftTitle) + '</h2>' + sub + '</div><div class="pb' + (markMode ? ' mk' : '') + '" id="pbL">' + inst + left + '</div></section>';
      h += '<section class="pane r" id="paneR" aria-label="Aufgaben"><div class="ph"><h2>' + esc(p.rightTitle) + '</h2></div><div class="pb" id="pbR">' + p.right + '</div></section>';
    } else {
      h += '<section class="pane one" id="paneR" aria-label="Aufgaben"><div class="ph"><h2>' + esc(p.title) + ' · ' + esc(p.rightTitle) + '</h2></div><div class="pb" id="pbR">' + inst +
        (p.ctx ? '<p class="ctx">' + esc(p.ctx) + '</p>' : '') + p.right + '</div></section>';
    }
    main.innerHTML = h;
    // restore answers
    if (!M.writing) {
      Object.keys(S.answers).forEach(function (no) {
        var v = S.answers[no];
        var inp = main.querySelector('input[data-no="' + no + '"][value="' + v + '"]');
        if (inp) { inp.checked = true; setOn(inp); }
        var sel = main.querySelector('select[data-no="' + no + '"]');
        if (sel) sel.value = v;
        markAnswered(no);
      });
      updateMatch();
    } else {
      var ed = $('#ed');
      ed.value = S.texts[p.teil] || '';
      updateWC();
      ed.addEventListener('input', function () { S.texts[p.teil] = ed.value; updateWC(); renderTabs(); saveSoon(); });
      $$('#sz button').forEach(function (b) {
        b.addEventListener('mousedown', function (e) { e.preventDefault(); });
        b.addEventListener('click', function () { insertAtCaret(ed, b.getAttribute('data-ch')); });
      });
    }
    $$('.ph .sub button', main).forEach(function (b) { b.addEventListener('click', function () { go(+b.getAttribute('data-go')); }); });
    $$('.pb', main).forEach(function (pb) { pb.scrollTop = 0; });
    if (window.innerWidth <= 900) window.scrollTo(0, 0);
    renderTabs(); renderChips(); renderNav();
    if (R.mod === 'hoeren') renderAudioBar();
  }

  function insertAtCaret(ed, ch) {
    var s = ed.selectionStart, e = ed.selectionEnd, v = ed.value;
    ed.value = v.slice(0, s) + ch + v.slice(e);
    ed.selectionStart = ed.selectionEnd = s + ch.length;
    ed.focus();
    ed.dispatchEvent(new Event('input'));
  }
  function updateWC() {
    var ed = $('#ed'); if (!ed) return;
    var n = wordCount(ed.value), w = M.pages[S.page].task.words[0];
    $('#wcn').textContent = n; $('#wc').classList.toggle('reach', n >= w);
  }

  function go(i) {
    if (i < 0 || i >= M.pages.length) return;
    if (i > maxReachable()) { toast('Dieser Teil beginnt erst mit dem nächsten Hörtext.'); return; }
    if (R.mod === 'lesen') saveMarks();
    S.page = i; renderPage(); saveSoon();
  }
  function jumpTo(no) {
    var it = ITEM[no]; if (!it) return;
    if (it.page !== S.page) go(it.page);
    var el = document.getElementById('q-' + no);
    if (el) {
      try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      var f = el.querySelector('input:not([disabled]),select:not([disabled])'); if (f) { try { f.focus({ preventScroll: true }); } catch (e2) { /* ignore */ } }
    }
  }

  function setOn(inp) {
    $$('input[name="' + inp.name + '"]').forEach(function (o) {
      var lab = o.closest('label'); if (lab) lab.classList.toggle('on', o.checked);
    });
  }
  function markAnswered(no) {
    var el = document.getElementById('q-' + no);
    if (el) el.classList.toggle('ans', S.answers[no] != null);
  }
  function onAnswer(e) {
    var t = e.target, no = t.getAttribute && t.getAttribute('data-no');
    if (!no || !S) return;
    if (t.type === 'radio') { S.answers[no] = t.value; setOn(t); }
    else if (t.tagName === 'SELECT') { if (t.value) S.answers[no] = t.value; else delete S.answers[no]; }
    markAnswered(no); updateMatch(); renderTabs(); renderChips(); saveSoon();
  }
  /* Lückentext-Felder und Auswahllisten (Sätze, Überschriften, Äußerungen) mit den Antworten abgleichen */
  function updateMatch() {
    if (!S || M.writing) return;
    $$('.gp').forEach(function (g) {
      var v = S.answers[g.getAttribute('data-no')];
      g.classList.toggle('on', v != null);
      var gl = $('.gl', g); if (gl) gl.textContent = v == null ? '' : v;
    });
    var p = M.pages[S.page];
    if (!p || !p.nos) return;
    var used = {};
    p.nos.forEach(function (no) { if (S.answers[no] != null) used[S.answers[no]] = true; });
    $$('[data-l]').forEach(function (el) { el.classList.toggle('used', !!used[el.getAttribute('data-l')] || el.getAttribute('data-ex') === '1'); });
  }

  /* ---------- highlighting (Lesen) ---------- */
  function unwrap(m) { var p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); }
  function saveMarks() {
    var pl = $('#pbL'); if (!pl || !S) return;
    var key = M.pages[S.page].key;
    if ($('mark.hl', pl)) {
      var clone = pl.cloneNode(true);
      $$('.inst', clone).forEach(function (n) { n.parentNode.removeChild(n); });
      S.marks[key] = clone.innerHTML;
    } else delete S.marks[key];
  }
  function onMarkUp() {
    if (!markMode || R.mod !== 'lesen') return;
    var pl = $('#pbL'); if (!pl) return;
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    if (!pl.contains(range.commonAncestorContainer)) return;
    var rootNode = range.commonAncestorContainer.nodeType === 1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentNode;
    var walker = document.createTreeWalker(rootNode, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [], n;
    while ((n = walker.nextNode())) { if (range.intersectsNode(n)) nodes.push(n); }
    nodes.forEach(function (node) {
      if (node.parentNode && node.parentNode.closest && (node.parentNode.closest('mark.hl') || node.parentNode.closest('.inst') || node.parentNode.closest('.gp'))) return;
      var start = node === range.startContainer ? range.startOffset : 0;
      var end = node === range.endContainer ? range.endOffset : node.nodeValue.length;
      if (end <= start) return;
      var mid = node;
      if (start > 0) mid = node.splitText(start);
      if (end - start < mid.nodeValue.length) mid.splitText(end - start);
      if (!mid.nodeValue.replace(/\s/g, '')) return;
      var mk = document.createElement('mark'); mk.className = 'hl';
      mid.parentNode.insertBefore(mk, mid); mk.appendChild(mid);
    });
    sel.removeAllRanges();
    saveMarks(); saveSoon();
  }
  function onMarkClick(e) {
    var gp = e.target.closest && e.target.closest('.gp');
    if (gp) { jumpTo(gp.getAttribute('data-no')); return; }
    if (!markMode) return;
    var m = e.target.closest && e.target.closest('mark.hl');
    if (!m) return;
    var sel = window.getSelection();
    if (sel && !sel.isCollapsed) return;
    var p = m.parentNode; unwrap(m); p.normalize(); saveMarks(); saveSoon();
  }

  /* ---------- clock ---------- */
  function startClock() {
    stopClock();
    lastTick = performance.now();
    timerId = setInterval(tick, 250);
    window.addEventListener('beforeunload', onLeave);
    document.addEventListener('visibilitychange', onVis);
    if (R.mod === 'hoeren') startAudioFlow();
    save();
  }
  function stopClock() { if (timerId) clearInterval(timerId); timerId = null; }
  function tick() {
    var t = performance.now(), dt = (t - lastTick) / 1000; lastTick = t;
    if (dt > 5) dt = 5;
    S.remaining -= dt;
    var tv = $('#tmv'); if (tv) tv.textContent = fmt(S.remaining);
    var tm = $('#tm'); if (tm) tm.classList.toggle('low', S.remaining <= 300);
    [10, 5, 1].forEach(function (m) {
      if (S.remaining <= m * 60 && S.remaining > m * 60 - 3 && !warned[m]) {
        warned[m] = true;
        toast(m === 1 ? 'Sie haben noch 1 Minute Zeit.' : 'Sie haben noch ' + m + ' Minuten Zeit.', m <= 5);

  function score() {

      '<div class="mb">' + buttons.map(function (b, i) { return '<button type="button" class="btn' + (b.pri ? ' pri' : '') + '" data-i="' + i + '">' + esc(b.label) + '</button>'; }).join('') + '</div></div>';

    var md = $('.modal', close.el);
    md.insertAdjacentHTML('beforeend', h);
    $$('.ovgrid .chip', md).forEach(function (c) { c.addEventListener('click', function () { close(); jumpTo(c.getAttribute('data-no')); }); });
  }

  /* ---------- tutorial ---------- */
  var tourEls = null;
  function tourSteps() {
    var common = [
      ['#tm', timerId ? 'Hier sehen Sie die verbleibende Zeit. Die Zeit läuft weiter, während Sie das Tutorial ansehen.' : 'Hier sehen Sie die verbleibende Zeit. Die Zeit läuft erst, wenn Sie die Prüfung starten.',
        timerId ? '남은 시험 시간입니다. 튜토리얼을 보는 동안에도 시간은 흐릅니다.' : '남은 시험 시간입니다. 시험을 시작해야 시간이 흐릅니다.']
    ];
    if (R.mod === 'lesen') return common.concat([
      ['#tabs', 'Hier wechseln Sie zwischen den Teilen 1 bis 4. Die Zahl zeigt, wie viele Aufgaben Sie im Teil schon gelöst haben.', 'Teil 1–4 사이를 이동합니다. 숫자는 그 Teil에서 푼 문항 수입니다.'],
      ['#paneL', 'Links steht der Text: in Teil 1 der Zeitungsartikel, in Teil 2 die Informationstafel, in Teil 3 die E-Mail und in Teil 4 die Anzeigen a–f.', '왼쪽에는 지문이 있습니다. Teil 1은 Zeitungsartikel, Teil 2는 Informationstafel, Teil 3은 E-Mail, Teil 4는 Anzeige a–f입니다.'],
      ['#paneR', 'Rechts stehen die Aufgaben. Klicken Sie die richtige Lösung an. Sie können Ihre Antwort jederzeit ändern.', '오른쪽에는 문항이 있습니다. 정답을 클릭하세요. 답은 언제든 바꿀 수 있습니다.'],
      ['#mk', 'Mit „Markieren“ heben Sie wichtige Textstellen farbig hervor: einschalten, dann Text mit der Maus markieren. Ein Klick auf die Markierung löscht sie wieder.', '‘Markieren’을 켜고 지문을 드래그하면 형광펜이 칠해집니다. 칠한 곳을 누르면 지워집니다.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#ov', 'In der Aufgabenübersicht sehen Sie, welche Aufgaben schon beantwortet (grün) und welche noch offen sind. Mit einem Klick springen Sie direkt zur Aufgabe.', '문항 번호표에서 푼 문항(초록)과 남은 문항을 확인하고, 번호를 눌러 바로 이동합니다.'],
      ['#nav', 'Mit „Weiter“ und „Zurück“ blättern Sie. Wenn Sie fertig sind, klicken Sie auf „Abgeben“.', '‘Weiter’와 ‘Zurück’으로 넘기고, 다 풀면 ‘Abgeben’을 누릅니다.']
    ]);
    if (R.mod === 'hoeren') return common.concat([
      ['#vol', 'Hier stellen Sie die Lautstärke ein.', '음량을 조절합니다.'],
      ['#abar', 'Hier sehen Sie, welcher Hörtext gerade läuft. Die Hörtexte starten automatisch. Sie können sie nicht anhalten oder wiederholen.', '지금 재생 중인 음원이 표시됩니다. 음원은 자동으로 시작되며 멈추거나 다시 들을 수 없습니다.'],
      ['#tabs', 'Mit dem Hörtext wechselt auch der Teil. Spätere Teile sind gesperrt, frühere Teile können Sie wieder öffnen.', '음원에 맞춰 Teil이 바뀝니다. 다음 Teil은 잠겨 있고, 지나간 Teil은 다시 열 수 있습니다.'],
      ['#paneR', 'Lesen Sie die Aufgaben und klicken Sie die richtige Lösung an.', '문항을 읽고 정답을 클릭하세요.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#ov', 'Die Aufgabenübersicht zeigt, welche Aufgaben noch offen sind.', '문항 번호표에서 남은 문항을 확인합니다.'],
      ['#nav', 'Nach dem letzten Hörtext können Sie Ihre Antworten noch prüfen und dann auf „Abgeben“ klicken.', '마지막 음원이 끝난 뒤 답을 확인하고 ‘Abgeben’을 누릅니다.']
    ]);
    return common.concat([
      ['#tabs', 'Hier wechseln Sie zwischen Aufgabe 1 und Aufgabe 2. Sie können mit jeder Aufgabe beginnen.', '과제 1과 과제 2 사이를 이동합니다. 어느 과제부터 써도 됩니다.'],
      ['.pane.l', 'Hier steht die Aufgabe.', '여기에 과제가 있습니다.'],
      ['#ed', 'Schreiben Sie Ihren Text in dieses Feld.', '이 입력란에 글을 씁니다.'],
      ['#wc', 'Die Wörter werden automatisch gezählt.', '단어 수가 자동으로 계산됩니다.'],
      ['#sz', 'Mit diesen Tasten fügen Sie ä, ö, ü, ß und Anführungszeichen ein.', '이 버튼으로 ä, ö, ü, ß와 따옴표를 넣습니다.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#nav', 'Wenn Sie fertig sind, klicken Sie auf „Abgeben“.', '다 쓰면 ‘Abgeben’을 누릅니다.']
    ]);
  }
  function runTour(done) {
    var steps = tourSteps().filter(function (s) { return $(s[0]); });
    if ($('#help') && $('#help').offsetParent !== null) {
      steps.splice(steps.length - 1, 0, ['#help', 'Mit „?“ können Sie dieses Tutorial während der Prüfung noch einmal ansehen.', '‘?’를 누르면 시험 중에도 이 튜토리얼을 다시 볼 수 있습니다.']);
    }
    var i = 0;
    var block = document.createElement('div'); block.className = 'tipblock';
    var hole = document.createElement('div'); hole.className = 'hole';
    var tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role', 'dialog'); tip.setAttribute('aria-live', 'polite');
    document.body.appendChild(block); document.body.appendChild(hole); document.body.appendChild(tip);
    tourEls = [block, hole, tip];
    function place() {
      var el = $(steps[i][0]); if (!el) return;
      try { el.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ }
      var r = el.getBoundingClientRect(), pad = 5;
      var vw = window.innerWidth, vh = window.innerHeight;
      var top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad);
      var w = Math.min(vw - 8, r.width + pad * 2), hh = Math.min(vh - 8, r.height + pad * 2);
      hole.style.top = top + 'px'; hole.style.left = left + 'px'; hole.style.width = w + 'px'; hole.style.height = hh + 'px';
      tip.innerHTML = '<div class="stp">Tutorial · Schritt ' + (i + 1) + ' von ' + steps.length + '</div><p>' + esc(steps[i][1]) + '</p><p class="ko">' + esc(steps[i][2]) + '</p>' +
        '<div class="tb"><button class="btn sm" type="button" id="tskip">Tutorial beenden</button><span style="display:flex;gap:6px">' +
        (i > 0 ? '<button class="btn sm" type="button" id="tprev">Zurück</button>' : '') +
        '<button class="btn sm pri" type="button" id="tnext">' + (i < steps.length - 1 ? 'Weiter' : 'Fertig') + '</button></span></div>';
      var tw = tip.offsetWidth, th = tip.offsetHeight, gap = 14, tx, ty;
      var clampX = function (x) { return Math.min(Math.max(8, x), vw - tw - 8); };
      var clampY = function (y) { return Math.min(Math.max(8, y), vh - th - 8); };
      if (top + hh + gap + th <= vh - 8) { ty = top + hh + gap; tx = clampX(left); }            // below
      else if (top - gap - th >= 8) { ty = top - gap - th; tx = clampX(left); }                // above
      else if (left - gap - tw >= 8) { tx = left - gap - tw; ty = clampY(top + hh / 2 - th / 2); }   // left
      else if (left + w + gap + tw <= vw - 8) { tx = left + w + gap; ty = clampY(top + hh / 2 - th / 2); } // right
      else { tx = clampX(left + w / 2 - tw / 2); ty = clampY(top + hh - th - 16); }              // inside, bottom
      tip.style.top = ty + 'px'; tip.style.left = tx + 'px';
      $('#tnext').addEventListener('click', function () { if (i < steps.length - 1) { i++; place(); } else end(); });
      if ($('#tprev')) $('#tprev').addEventListener('click', function () { i--; place(); });
      $('#tskip').addEventListener('click', end);
      $('#tnext').focus();
    }
    function end() {
      closeTour();
      window.removeEventListener('resize', place);
      if (!done) return;
      modal('Prüfung starten', ['Das Tutorial ist beendet. Wenn Sie auf „Prüfung starten“ klicken, beginnt die Prüfungszeit' + (R.mod === 'hoeren' ? ' und der erste Hörtext wird abgespielt.' : '.'),
        '‘Prüfung starten’을 누르면 시험 시간이 시작됩니다' + (R.mod === 'hoeren' ? '. 첫 음원도 바로 재생됩니다.' : '.')], [
        { label: 'Prüfung starten', pri: true, fn: done }
      ], true);
    }
    window.addEventListener('resize', place);
    place();
  }
  function closeTour() { if (tourEls) { tourEls.forEach(function (e) { if (e.parentNode) e.parentNode.removeChild(e); }); tourEls = null; } }

  /* ---------- go ---------- */
  if (R.view === 'ergebnis') {
    var rr = lsGet(RESULT_KEY);
    if (rr) { showResult(rr); return; }
  }
  showStart();
  window.__exam = {
    model: M, data: T,
    state: function () { return S; },
    seekEnd: function (left) { var t = Math.max(0, (AUD.duration || 0) - (left || 1)); audioLastPos = t; AUD.currentTime = t; }
  };
})();
</script>
</body>
