<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>Goethe B2 digital — Sophia Deutsch Akademie</title>
<style>
/* Pretendard (SIL Open Font License 1.1, digital-src/fonts/Pretendard-OFL.txt), Teilmenge mit den hier verwendeten Zeichen */
@font-face{font-family:"Pretendard SODA";src:url(data:font/woff;base64,__UI_FONT__) format("woff");font-weight:45 930;font-style:normal;font-display:swap}
:root{
  --bg:#e7eaee;--panel:#fff;--bar:#f5f6f8;--line:#cbd2da;--line-2:#e2e6eb;
  --ink:#1b2430;--ink-2:#434f5e;--muted:#68727f;
  --acc:#1d6a56;--acc-2:#165443;--acc-w:#e3f0eb;--acc-line:#93c4b2;
  --warn:#a8322a;--warn-w:#fbecea;--mark:#ffe680;
  --fs:16px;
  --font:"Pretendard SODA",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol{margin:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;height:58px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:5}
.top .logo{width:22px;height:auto;display:block;flex:none}
.top .id{display:flex;flex-direction:column;min-width:0;line-height:1.25;padding-left:12px;border-left:1px solid var(--line-2)}
.top .id b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .id > span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.tool{display:flex;align-items:center;gap:6px}
.hlp{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;font-weight:700;font-size:16px;color:var(--ink-2);padding:0}
.hlp:hover{background:var(--acc-w)}
.fz{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.fz button{border:0;background:none;width:34px;height:32px;padding:0;font-weight:700;color:var(--ink-2)}
.fz button+button{border-left:1px solid var(--line-2)}
.fz button[aria-pressed="true"]{background:var(--acc-w);color:var(--acc-2)}
.fz .s1{font-size:12px}.fz .s2{font-size:14px}.fz .s3{font-size:17px}
.vol{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:0 10px;height:34px;background:#fff;color:var(--ink-2)}
.vol input{width:96px;accent-color:var(--acc)}
.timer{display:flex;align-items:center;gap:9px;height:42px;padding:0 12px 0 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.timer svg{flex:none;color:var(--ink-2)}
.timer .tl{display:flex;flex-direction:column;line-height:1.1}
.timer .tl small{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.timer .tl b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.timer.low{border-color:var(--warn);background:var(--warn-w)}
.timer.low b,.timer.low svg{color:var(--warn)}

/* ---------- part tabs ---------- */
.tabs{display:flex;align-items:stretch;gap:0;background:var(--bar);border-bottom:1px solid var(--line);flex:none;padding:0 10px;min-height:46px}
.tabs .tl{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs .tl::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;border:0;border-top:3px solid transparent;background:none;padding:0 16px;font-weight:700;color:var(--ink-2);white-space:nowrap;position:relative}
.tab .pr{font-weight:400;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:0 7px;line-height:18px}
.tab.done .pr{background:var(--acc-w);border-color:var(--acc-line);color:var(--acc-2)}
.tab[aria-selected="true"]{background:#fff;border-top-color:var(--acc);color:var(--ink);box-shadow:1px 0 0 var(--line),-1px 0 0 var(--line)}
.tab:disabled{cursor:not-allowed;color:#9aa3ad}
.tab:disabled .pr{opacity:.6}
.tab .lock{display:inline-flex;color:#9aa3ad}
.tabs .tr{display:flex;align-items:center;gap:8px;padding-left:10px}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tbtn[aria-pressed="true"]{background:#fff6c7;border-color:#d9bf44;color:#5c4a00}
.tbtn.icon{padding:0 9px}

/* ---------- audio bar ---------- */
.abar{display:flex;align-items:center;gap:14px;padding:9px 18px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.abar .st{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap;min-width:0}
.abar .st .dot{width:10px;height:10px;border-radius:50%;background:#9aa3ad;flex:none}
.abar.on .st .dot{background:var(--acc);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.abar .pg{flex:1;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;min-width:60px}
.abar .pg i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s linear}
.abar .tm{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- main panes ---------- */
.exam{display:flex;flex-direction:column;height:100vh;height:100dvh}
.main{flex:1;min-height:0;display:flex;gap:12px;padding:12px}
.pane{flex:1 1 0;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pane.l{flex-basis:54%}.pane.r{flex-basis:46%}
.pane.one{max-width:980px;margin:0 auto;width:100%}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 18px;border-bottom:1px solid var(--line-2);background:#fafbfc;flex:none}
.ph h2{font-size:14px;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.ph .sub{display:flex;gap:4px}
.ph .sub button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.ph .sub button[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.pb{flex:1;overflow:auto;padding:20px 24px 48px;font-size:var(--fs);line-height:1.62;-webkit-overflow-scrolling:touch}
.pb.mk{cursor:text}
.pb.mk ::selection{background:var(--mark)}
mark.hl{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.pb.mk mark.hl{cursor:pointer}
.inst{color:var(--ink-2);font-weight:500;margin-bottom:16px}
.inst+.inst{margin-top:-8px}
.ctx{margin-bottom:16px;padding:12px 14px;background:#f6f8f9;border-left:3px solid var(--line);border-radius:0 4px 4px 0}
.h1t{font-size:calc(var(--fs)*1.15);font-weight:700;margin-bottom:10px}

/* texts */
.card{border:1px solid var(--line);border-radius:6px;padding:16px 18px;background:#fff}
.art h3,.doc h3,.forum h3{font-size:1.3em;line-height:1.25;margin-bottom:10px}
.art p,.doc p{margin:0 0 .75em}
.art .lead{font-weight:600;color:var(--ink-2);margin-bottom:12px}
.art .src{text-align:right;font-size:.85em;color:var(--muted);margin-top:8px}

/* Lesen Teil 1: Forum */
.post2{border:1px solid var(--line);border-radius:6px;margin-bottom:14px;background:#fff;overflow:hidden}
.post2 .ph2{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#f3f5f7;border-bottom:1px solid var(--line-2);font-size:.92em}
.post2 .pl{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.82em;flex:none}
.post2 .pt2{margin-left:auto;color:var(--muted);font-size:.85em;text-align:right}
.post2 p{padding:10px 14px 2px;margin:0}
.post2 p:last-child{padding-bottom:12px}

/* Lesen Teil 2: Lückentext */
.gp{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-width:2.6em;height:1.6em;padding:0 .55em;margin:0 .15em;border:1.5px solid var(--ink-2);border-radius:4px;background:#fff;font-weight:700;font-size:.82em;line-height:1;vertical-align:baseline;cursor:pointer;white-space:nowrap}
.gp .gl{display:none;padding-left:.4em;border-left:1px solid rgba(255,255,255,.65)}
.gp.on{background:var(--acc);border-color:var(--acc);color:#fff}
.gp.on .gl{display:inline}
.exs{background:#e9ecef;border-radius:4px;padding:1px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.exs b{margin-right:4px;font-size:.72em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Auswahllisten (Sätze, Überschriften) */
.bank{border:1px solid var(--line-2);background:#f8f9fa;border-radius:6px;padding:8px 12px;margin-bottom:14px}
.bank .bt{font-size:.78em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 0 6px}
.bank .bi{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px;padding:6px 0;border-top:1px solid var(--line-2);line-height:1.45}
.bank .bl{font-weight:700;color:var(--ink-2)}
.bank .bi.used{color:#8a94a0}
.bank .bi.used .bl{color:var(--acc)}
.bank .bi.used .bl::after{content:" ✓";font-weight:700}
.bank .bi .tg{font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:6px}

/* Lesen Teil 4: Äußerungen */
.stm{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.stm:last-child{border-bottom:0}
.stm .sl2{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:.85em;display:flex;align-items:center;justify-content:center}
.stm p{margin:0}
.stm .by{text-align:right;color:var(--muted);font-size:.9em;margin-top:4px}
.stm.used .sl2{background:var(--acc)}
.stm.used .sl2::after{content:"✓";margin-left:1px;font-size:.8em}
.stm.used > div{opacity:.62}
.stm .tg{font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}

/* Lesen Teil 5: Paragrafen */
.doc .dsub{text-align:center;color:var(--muted);font-size:.9em;margin:-4px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.doc .par{padding:10px 0 4px;border-bottom:1px solid var(--line-2)}
.doc .par:last-child{border-bottom:0;padding-bottom:0}
.doc .pl3{font-weight:700;margin:0 0 4px}
.bsp{font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pl3 .bsp{margin-left:8px}
.wc.reach b{color:var(--acc-2)}

/* items */
.q{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.q:last-child{border-bottom:0}
.q .qn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em;background:#fff;color:var(--ink-2)}
.q.ans .qn{background:var(--acc);border-color:var(--acc);color:#fff}
.q.ex{background:#f7f8f9;margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:6px;border-bottom:0;margin-bottom:6px}
.q.ex .qn{font-size:.72em;border-style:dashed}
.q .bsp{display:block;font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.q .qt{margin:3px 0 8px}
.q.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{background:#fff6c7}100%{background:transparent}}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.row{flex-direction:row;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border:1px solid var(--line-2);border-radius:6px;cursor:pointer;background:#fff;line-height:1.45}
.opts.row .opt{min-width:112px}
.opt:hover{background:#f3f7f5;border-color:var(--line)}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .rb{width:18px;height:18px;border:2px solid #7c8693;border-radius:50%;flex:none;margin-top:2px;position:relative;background:#fff}
.opt .lt{font-weight:700;color:var(--ink-2);min-width:12px}
.opt.on{background:var(--acc-w);border-color:var(--acc-line)}
.opt.on .rb{border-color:var(--acc)}
.opt.on .rb::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--acc)}
.opt input:focus-visible+.rb{outline:2px solid var(--acc);outline-offset:2px}
.opt.dis{cursor:default}
.opt.dis:hover{background:#fff}
.q.ex .opt{background:transparent}
.q.ex .opt.on{background:#e9ecef;border-color:#c5ccd3}
.q.ex .opt.on .rb{border-color:#7c8693}
.q.ex .opt.on .rb::after{background:#7c8693}
.selw{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.selw label{font-size:.92em;color:var(--ink-2);font-weight:700}
.selw select{min-width:92px;height:36px;border:1.5px solid var(--line);border-radius:6px;background:#fff;padding:0 10px;font-weight:700}
.q.ans .selw select{border-color:var(--acc);background:var(--acc-w)}
.grid{width:100%;border-collapse:collapse;font-size:var(--fs)}
.grid th{font-size:.82em;color:var(--ink-2);text-align:center;padding:6px 4px 8px;vertical-align:bottom;border-bottom:2px solid var(--line);line-height:1.3;position:sticky;top:-20px;background:#fff;z-index:2;box-shadow:0 1px 0 var(--line)}
.grid th:first-child,.grid th:nth-child(2){text-align:left}
.grid th .k{display:block;font-size:1.05em;color:var(--ink)}
.grid td{border-bottom:1px solid var(--line-2);padding:10px 4px;vertical-align:middle}
.grid td.no{width:40px;font-weight:700;color:var(--ink-2)}
.grid td.c{width:104px;text-align:center}
.grid tr.ex td{background:#f7f8f9}
.grid tr.ans td.no{color:var(--acc)}
.grid .bsp{display:block;font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cell{display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;position:relative}
.cell:hover{background:#eef3f1}
.cell input{position:absolute;opacity:0}
.cell .rb{width:20px;height:20px;border:2px solid #7c8693;border-radius:50%;position:relative;background:#fff}
.cell.on .rb{border-color:var(--acc)}
.cell.on .rb::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--acc)}
.cell input:focus-visible+.rb{outline:2px solid var(--acc);outline-offset:2px}
tr.ex .cell.on .rb{border-color:#7c8693}tr.ex .cell.on .rb::after{background:#7c8693}
.txh{font-size:.8em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 0;padding-top:12px;border-top:2px solid var(--line-2)}
.txh:first-child{margin-top:0;border-top:0;padding-top:0}

/* Schreiben */
.task p{margin:0 0 .7em}
.task ul{margin:0 0 .9em;padding-left:1.2em}
.task ul li{margin:.25em 0}
.wr{display:flex;flex-direction:column;flex:1;min-height:0}
.wr .pb{display:flex;flex-direction:column;padding:14px 16px 12px;gap:10px}
.sz{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sz span{font-size:12px;color:var(--muted);margin-right:4px}
.sz button{min-width:32px;height:30px;border:1px solid var(--line);border-radius:5px;background:#fff;font-weight:700;font-size:15px;padding:0 6px}
.sz button:hover{background:var(--acc-w)}
textarea.ed{flex:1;min-height:260px;width:100%;resize:none;border:1.5px solid var(--line);border-radius:6px;padding:14px 16px;font-size:var(--fs);line-height:1.65;background:#fff}
textarea.ed:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-w)}
.wc{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted)}
.wc b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px}

/* ---------- footer ---------- */
.foot{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 16px;background:#fff;border-top:1px solid var(--line);flex:none}
.ovw{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.ovw .lbl{font-size:11.5px;color:var(--muted);line-height:1.25;white-space:nowrap}
.ovw .lbl b{display:block;color:var(--ink);font-size:13px}
.chips{display:flex;align-items:center;gap:3px;overflow-x:auto;scrollbar-width:thin;padding:4px 2px;min-width:0}
.chip{flex:none;min-width:25px;height:26px;padding:0 2px;border:1px solid var(--line);border-radius:4px;background:#fff;font-size:11.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip.ans{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.cur{box-shadow:0 0 0 2px var(--ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.gap{flex:none;width:7px}
.foot .ovbtn{display:none}
.nav{display:flex;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 18px;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{background:#f3f5f7}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-2)}
.btn.out{border-color:var(--acc);color:var(--acc-2)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{height:34px;padding:0 13px;font-size:13.5px}

/* ---------- overlays ---------- */
.mbg{position:fixed;inset:0;background:rgba(14,22,31,.56);display:flex;align-items:center;justify-content:center;z-index:900;padding:16px}
.modal{background:#fff;border-radius:8px;width:100%;max-width:470px;padding:22px 24px 20px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.modal h3{font-size:18px;margin-bottom:8px}
.modal p{color:var(--ink-2);margin-bottom:6px}
.modal .ko{font-size:13px;color:var(--muted)}
.modal .mb{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:12px}
.ovgrid .chip{height:36px;font-size:13px}
.ovgrid .tp{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;font-weight:700;z-index:950;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.toast.w{background:var(--warn)}
.hole{position:fixed;z-index:1000;border-radius:7px;box-shadow:0 0 0 9999px rgba(12,19,28,.64);outline:3px solid #fff;pointer-events:none;transition:all .25s ease}
.tip{position:fixed;z-index:1001;width:340px;max-width:calc(100vw - 24px);background:#fff;border-radius:8px;padding:16px 18px 14px;box-shadow:0 12px 36px rgba(0,0,0,.3)}
.tip .stp{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.tip p{margin:6px 0 0;font-size:15px;color:var(--ink)}
.tip p.ko{font-size:13px;color:var(--muted);margin-top:6px}
.tip .tb{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
.tipblock{position:fixed;inset:0;z-index:999}

/* ---------- start / end / result pages ---------- */
.page{min-height:100vh;display:flex;flex-direction:column}
.pgm{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px 48px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:8px;width:100%;max-width:760px;padding:30px 34px 28px}
.sheet .ey{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.sheet h1{font-size:28px;line-height:1.2;margin:6px 0 4px}

.facts{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 20px}
.facts span{border:1px solid var(--line-2);background:#f6f8f9;border-radius:5px;padding:5px 11px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.rules{border-top:1px solid var(--line-2);padding-top:16px;margin-bottom:18px}
.rules h2{font-size:15px;margin-bottom:8px}

.rules li{margin:6px 0}

.namef label{font-size:13px;font-weight:700;color:var(--ink-2)}

.note{margin-top:16px;font-size:13px;color:var(--muted)}
.back{display:inline-block;margin-top:22px;font-size:13.5px;font-weight:700;color:var(--ink-2);text-decoration:none}

.score{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 8px}
.score .bx{flex:1 1 150px;border:1px solid var(--line-2);border-radius:8px;padding:12px 14px;background:#f8f9fa}
.score .bx small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.score .bx b{font-size:26px;font-variant-numeric:tabular-nums}
.score .bx.ok{border-color:var(--acc-line);background:var(--acc-w)}
.score .bx.ok b{color:var(--acc-2)}
.score .bx.no{border-color:#e3b4ae;background:var(--warn-w)}
.score .bx.no b{color:var(--warn)}
.tparts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 18px}
.tparts span{font-size:13px;border-radius:5px;padding:4px 10px;background:#f2f4f6;color:var(--ink-2);font-weight:700}
table.rv{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.rv th{text-align:left;font-size:12px;color:var(--muted);border-bottom:2px solid var(--line);padding:6px}
table.rv td{border-bottom:1px solid var(--line-2);padding:8px 6px;vertical-align:top}
table.rv td.n{font-weight:700;width:40px}
table.rv td.m{width:34px;text-align:center;font-weight:700}
table.rv tr.ok td.m{color:var(--acc)}
table.rv tr.no td.m{color:var(--warn)}
table.rv tr.no td.g{color:var(--warn)}
table.rv .tp td{background:#f6f8f9;font-weight:700;font-size:12.5px;color:var(--ink-2);letter-spacing:.04em}
.rvq{color:var(--ink-2);font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
.wtask{border:1px solid var(--line-2);border-radius:8px;padding:14px 16px;margin-top:14px}
.wtask h3{font-size:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wtask h3 small{font-size:13px;color:var(--muted)}
.wtask pre,.mdl{white-space:pre-wrap;font-family:var(--font);font-size:15px;line-height:1.6;background:#f8f9fa;border-radius:6px;padding:12px 14px;margin:10px 0 0}
.mdl{background:var(--acc-w)}
.terr{font-size:13px;color:var(--ink-2);margin-top:8px}
details summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--acc-2);margin-top:10px}

<body>
<div id="app"></div>
<audio id="aud" preload="auto"></audio>
<script id="exam-data" type="application/json">__EXAM_DATA__</script>
<script>
(function () {
  'use strict';

  /* 선생님 이메일 주소를 넣으면 '메일로 보내기'의 받는 사람에 자동으로 들어갑니다. 예: var LEHRER_MAIL = 'name@example.com'; */
  var LEHRER_MAIL = '';

  var D = JSON.parse(document.getElementById('exam-data').textContent);
  var LOGO = '__LOGO_DATA_URI__';
  var PREFIX = 'sodaGZB2.v1.';
  var MOD = {
    lesen: { name: 'Lesen', minutes: 65, ko: '읽기' },
    hoeren: { name: 'Hören', minutes: 40, ko: '듣기' },
    schreiben: { name: 'Schreiben', minutes: 75, ko: '쓰기' }
  };
  var FS = [16, 18, 20.5];

  /* ---------- helpers ---------- */
  function lsGet(k) { try { var v = window.localStorage.getItem(PREFIX + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  function lsDel(k) { try { window.localStorage.removeItem(PREFIX + k); } catch (e) { /* storage unavailable */ } }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function fmt(sec) {
    sec = Math.max(0, Math.ceil(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function wordCount(t) {
    var m = String(t || '').match(/[A-Za-zÀ-ÖØ-öø-ÿĀ-žẞ0-9]+(?:['’\-][A-Za-zÀ-ÖØ-öø-ÿĀ-žẞ0-9]+)*/g);
    return m ? m.length : 0;
  }
  function nowStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  var ICON = {
    clock: '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 5.5V10l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    lock: '<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="6" width="9" height="6.5" rx="1.3" fill="currentColor"/><path d="M4.5 6V4.5a2.5 2.5 0 0 1 5 0V6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
    check: '<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5 5.6 10.5 11.5 3.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    marker: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13.5h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4.2 10.6 10.6 4.2l2 2-6.4 6.4H4.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
    erase: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 13.5h7.3M2.8 10.2l6.4-6.4 3.4 3.4-5.6 5.6H5.1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
    vol: '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 7h2.6L9 4v10l-3.4-3H3z" fill="currentColor"/><path d="M11.5 6.2a4 4 0 0 1 0 5.6M13.4 4.3a6.7 6.7 0 0 1 0 9.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    prev: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M8.8 2.5 4.3 7l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    next: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5.2 2.5 9.7 7l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  /* ---------- route ---------- */
  function parseRoute() {
    var m = /^#?(\d{1,2})-(lesen|hoeren|schreiben)(?:-(ergebnis))?$/.exec(location.hash);
    return m ? { mt: m[1], mod: m[2], view: m[3] || '' } : null;
  }
  var R = parseRoute();
  if (!R || !D.tests[R.mt]) { location.replace('index.html#digital'); return; }
  var T = D.tests[R.mt];
  var STATE_KEY = 'mt' + R.mt + '.' + R.mod + '.state';
  var RESULT_KEY = 'mt' + R.mt + '.' + R.mod + '.result';
  var BACK = 'index.html#d' + R.mt;
  var app = document.getElementById('app');
  var AUD = document.getElementById('aud');
  document.title = 'Modelltest ' + T.roman + ' · ' + MOD[R.mod].name + ' — Goethe B2 digital';
  window.addEventListener('hashchange', function () { location.reload(); });

  /* ---------- item renderers ---------- */
  function optRow(no, val, label, letter, checked, dis) {
    return '<label class="opt' + (checked ? ' on' : '') + (dis ? ' dis' : '') + '"><input type="radio" name="a' + esc(no) + '" value="' + esc(val) + '"' +
      (checked ? ' checked' : '') + (dis ? ' disabled' : ' data-no="' + esc(no) + '"') + '><span class="rb"></span>' +
      (letter ? '<span class="lt">' + esc(letter) + '</span>' : '') + '<span>' + esc(label) + '</span></label>';
  }
  var NOLABEL = false;
  function qWrap(no, inner, ex) {
    return '<div class="q' + (ex ? ' ex' : '') + '" id="q-' + esc(no) + '"><div class="qn">' + esc(no) + '</div><div class="qb">' +
      (ex && !NOLABEL ? '<span class="bsp">Beispiel</span>' : '') + inner + '</div></div>';
  }
  function rfItem(it, ex) {
    var a = ex ? it.answer : null;
    return qWrap(it.no, '<p class="qt">' + esc(it.text) + '</p><div class="opts row" role="radiogroup" aria-label="Aufgabe ' + esc(it.no) + '">' +
      optRow(it.no, 'R', 'Richtig', '', a === 'R', ex) + optRow(it.no, 'F', 'Falsch', '', a === 'F', ex) + '</div>', ex);
  }
  function abcItem(it, ex) {
    var a = ex ? it.answer : null;
    var h = '<p class="qt">' + esc(it.stem) + '</p><div class="opts" role="radiogroup" aria-label="Aufgabe ' + esc(it.no) + '">';
    ['a', 'b', 'c'].forEach(function (k) { h += optRow(it.no, k, it.options[k], k, a === k, ex); });
    return qWrap(it.no, h + '</div>', ex);
  }
  var LET8 = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
  function perItem(it, ex, posts) {
    var a = ex ? it.answer : null;
    var h = '<p class="qt">' + esc(it.text) + '</p><div class="opts row" role="radiogroup" aria-label="Aufgabe ' + esc(it.no) + '">';
    posts.forEach(function (p) { h += optRow(it.no, p.letter, p.name, p.letter, a === p.letter, ex); });
    return qWrap(it.no, h + '</div>', ex);
  }
  function selItem(it, ex, o) {
    o = o || {};
    var h = '<p class="qt">' + (o.html != null ? o.html : esc(it.text)) + '</p><div class="selw"><label for="s-' + esc(it.no) + '">' + esc(o.label || 'Auswahl') + ':</label>';
    if (ex) {
      h += '<select id="s-' + esc(it.no) + '" disabled><option>' + esc(it.answer) + '</option></select>';
    } else {
      h += '<select id="s-' + esc(it.no) + '" data-no="' + esc(it.no) + '"><option value="">–</option>';
      (o.letters || LET8).forEach(function (k) { h += '<option value="' + k + '">' + k + '</option>'; });
      h += '</select>';
    }
    return qWrap(it.no, h + '</div>', ex);
  }
  function para(arr) { return (arr || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join(''); }

  /* ---------- text renderers ---------- */
  function articleHTML(t) {
    return '<article class="card art"><h3>' + esc(t.title) + '</h3>' + (t.lead ? '<p class="lead">' + esc(t.lead) + '</p>' : '') +
      para(t.paragraphs) + (t.footnote ? '<p class="fn">' + esc(t.footnote) + '</p>' : '') +
      (t.source ? '<p class="src">' + esc(t.source) + '</p>' : '') + '</article>';
  }
  /* ---------- Lesen: Forum, Lückentext, Äußerungen, Paragrafen ---------- */
  function forumHTML(f) {
    return '<div class="forum"><h3>' + esc(f.title) + '</h3>' + f.posts.map(function (p) {
      return '<article class="post2" id="post-' + esc(p.letter) + '"><div class="ph2"><span class="pl">' + esc(p.letter) + '</span><b>' + esc(p.name) + '</b><span class="pt2">' + esc(p.time) + '</span></div>' + para(p.paragraphs) + '</article>';
    }).join('') + '</div>';
  }
  function gapArticleHTML(t) {
    var ex = t.example || {};
    var body = (t.paragraphs || []).map(function (p) {
      return '<p>' + esc(p).replace(/\[(\d+)\]/g, function (m, n) {
        if (n === '0') return '<span class="exs"><b>Beispiel 0</b> ' + esc(ex.text || '') + '</span>';
        return '<button type="button" class="gp" data-no="' + n + '" aria-label="Lücke ' + n + '"><span class="gn">' + n + '</span><span class="gl"></span></button>';
      }) + '</p>';
    }).join('');
    return '<article class="card art"><h3>' + esc(t.title) + '</h3>' + (t.lead ? '<p class="lead">' + esc(t.lead) + '</p>' : '') + body +
      (t.source ? '<p class="src">' + esc(t.source) + '</p>' : '') + '</article>';
  }
  function bankHTML(title, map, exLetter) {
    return '<div class="bank"><div class="bt">' + esc(title) + '</div>' + LET8.filter(function (k) { return map[k] != null; }).map(function (k) {
      return '<div class="bi" data-l="' + k + '"' + (k === exLetter ? ' data-ex="1"' : '') + '><span class="bl">' + k + '</span><span>' + esc(map[k]) +
        (k === exLetter ? '<span class="tg">Beispiel</span>' : '') + '</span></div>';
    }).join('') + '</div>';
  }
  function statementsHTML(t) {
    var exLet = t.example && t.example.answer;
    return '<div class="art"><h3>' + esc(t.title) + '</h3><div class="stms">' + t.texts.map(function (x) {
      return '<div class="stm" data-l="' + esc(x.letter) + '"' + (x.letter === exLet ? ' data-ex="1"' : '') + '><span class="sl2">' + esc(x.letter) + '</span><div>' +
        (x.letter === exLet ? '<span class="tg">Beispiel 0</span>' : '') + '<p>' + esc(x.text) + '</p>' + (x.byline ? '<p class="by">' + esc(x.byline) + '</p>' : '') + '</div></div>';
    }).join('') + '</div></div>';
  }
  function docHTML(t) {
    function par(label, paras, ex) {
      return '<div class="par" id="par-' + esc(label.replace(/\W+/g, '')) + '"><p class="pl3">' + esc(label) + (ex ? '<span class="bsp">Beispiel</span>' : '') + '</p>' + para(paras) + '</div>';
    }
    var h = '<article class="card doc"><h3>' + esc(t.title) + '</h3>' + (t.subtitle ? '<p class="dsub">' + esc(t.subtitle) + '</p>' : '');
    if (t.example) h += par(t.example.label, t.example.paragraphs, true);
    t.items.forEach(function (it) { h += par(it.label, it.paragraphs, false); });
    return h + '</article>';
  }

  /* ---------- module models ---------- */
  function noRange(list) { return list[0].no + '–' + list[list.length - 1].no; }
  function mkReg(items) {
    return function (list, type, teil, page, o) {
      o = o || {};
      list.forEach(function (it) {
        items.push({ no: it.no, type: type, answer: it.answer, teil: teil, page: page, src: it, bank: o.bank || null, prompt: o.prompt ? o.prompt(it) : '' });
      });
    };
  }
  function buildLesen() {
    var L = T.lesen, pages = [], items = [], reg = mkReg(items);
    function nosOf(list) { return list.map(function (it) { return it.no; }); }

    // Teil 1: Forum, Zuordnung zu vier Personen
    var posts = L.t1.forum.posts, personBank = {};
    posts.forEach(function (p) { personBank[p.letter] = p.name; });
    pages.push({ key: 'L1', teil: 1, title: 'Lesen Teil 1', inst: [L.t1.instruction], leftTitle: 'Forum', rightTitle: 'Aufgaben ' + noRange(L.t1.items),
      left: forumHTML(L.t1.forum),
      right: perItem(L.t1.example, true, posts) + L.t1.items.map(function (it) { return perItem(it, false, posts); }).join('') });
    reg(L.t1.items, 'per', 1, pages.length - 1, { bank: personBank });

    // Teil 2: Lückentext mit acht Sätzen
    var t2 = L.t2;
    pages.push({ key: 'L2', teil: 2, title: 'Lesen Teil 2', inst: [t2.instruction], leftTitle: 'Text', rightTitle: 'Aufgaben ' + noRange(t2.items),
      left: gapArticleHTML(t2), nos: nosOf(t2.items),
      right: bankHTML('Sätze a–h', t2.sentences) +
        qWrap(t2.example.no, '<p class="qt">Lücke <b>[' + esc(t2.example.no) + ']</b> – im Text bereits ausgefüllt.</p>', true) +
        t2.items.map(function (it) { return selItem(it, false, { label: 'Satz', html: 'Lücke <b>[' + esc(it.no) + ']</b>' }); }).join('') });
    reg(t2.items, 'sel', 2, pages.length - 1, { bank: t2.sentences, prompt: function (it) { return 'Lücke [' + it.no + ']'; } });

    // Teil 3: Zeitungsartikel, Multiple Choice
    pages.push({ key: 'L3', teil: 3, title: 'Lesen Teil 3', inst: [L.t3.instruction], leftTitle: 'Text', rightTitle: 'Aufgaben ' + noRange(L.t3.items),
      left: articleHTML(L.t3),
      right: (L.t3.tasksIntro ? '<p class="ctx">' + esc(L.t3.tasksIntro) + '</p>' : '') + abcItem(L.t3.example, true) + L.t3.items.map(function (it) { return abcItem(it); }).join('') });
    reg(L.t3.items, 'abc', 3, pages.length - 1);

    // Teil 4: Aussagen und Äußerungen a–h
    var t4 = L.t4, ex4 = t4.example.answer, texts4 = {};
    t4.texts.forEach(function (x) { texts4[x.letter] = x.text; });
    var let4 = LET8.filter(function (k) { return k !== ex4; });
    pages.push({ key: 'L4', teil: 4, title: 'Lesen Teil 4', inst: [t4.instruction], leftTitle: 'Äußerungen a–h', rightTitle: 'Aufgaben ' + noRange(t4.items),
      left: statementsHTML(t4), nos: nosOf(t4.items),
      right: selItem(t4.example, true, { label: 'Äußerung' }) + t4.items.map(function (it) { return selItem(it, false, { label: 'Äußerung', letters: let4 }); }).join('') });
    reg(t4.items, 'sel', 4, pages.length - 1, { bank: texts4, prompt: function (it) { return it.text; } });

    // Teil 5: Paragrafen und Überschriften a–h
    var t5 = L.t5, ex5 = t5.example.answer, let5 = LET8.filter(function (k) { return k !== ex5; });
    function parHtml(it) { return 'Paragraf <b>' + esc(it.label) + '</b>'; }
    pages.push({ key: 'L5', teil: 5, title: 'Lesen Teil 5', inst: [t5.instruction], leftTitle: 'Text', rightTitle: 'Aufgaben ' + noRange(t5.items),
      left: docHTML(t5), nos: nosOf(t5.items),
      right: bankHTML('Überschriften a–h', t5.headings, ex5) + selItem(t5.example, true, { label: 'Überschrift', html: parHtml(t5.example) }) +
        t5.items.map(function (it) { return selItem(it, false, { label: 'Überschrift', letters: let5, html: parHtml(it) }); }).join('') });
    reg(t5.items, 'sel', 5, pages.length - 1, { bank: t5.headings, prompt: function (it) { return 'Paragraf ' + it.label; } });
    return { pages: pages, items: items, teile: [1, 2, 3, 4, 5], two: true };
  }

  function gridHTML(t) {
    var sp = t.speakers;
    var h = '<table class="grid"><thead><tr><th></th><th>Aussage</th>';
    ['a', 'b', 'c'].forEach(function (k) { h += '<th><span class="k">' + k + '</span>' + esc(sp[k]) + '</th>'; });

      h += '<div class="rules" style="margin-top:-6px"><h2>Tonprobe</h2><div class="acts"><div class="vol">' + ICON.vol +
        '<input type="range" min="0" max="100" step="1" id="volr0" aria-label="Lautstärke"></div><button class="btn sm" id="probe" type="button">Tonprobe abspielen</button></div>' +
        '<p class="note" style="margin-top:8px">Spielt die ersten Sekunden von Teil 1 ab. · 음량 확인용으로 Teil 1 앞부분을 몇 초 들려줍니다.</p></div>';

  /* ---------- volume ---------- */
  function getVol() { var v = lsGet('vol'); return typeof v === 'number' ? v : 0.85; }
  function setVol(v) { v = Math.max(0, Math.min(1, v)); AUD.volume = v; lsSet('vol', v); }

  /* ---------- exam shell ---------- */
  function begin(state, withTour) {
    clearTimeout(probeTimer); probeTimer = null;
    if (R.mod === 'hoeren') { audioAllowPause = true; try { AUD.pause(); } catch (e) { /* ignore */ } audioAllowPause = false; }
    S = state;
    warned = {}; markMode = false;
    if (S.build !== D.build) { S.marks = {}; S.build = D.build; }
    if (typeof S.font !== 'number') S.font = 0;
    if (!(S.page >= 0 && S.page < M.pages.length)) S.page = 0;
    if (S.remaining < 60 * 10) warned[10] = true;
    if (S.remaining < 60 * 5) warned[5] = true;
    renderExam();
    if (withTour) runTour(function () { startClock(); });
    else startClock();
  }

  function renderExam() {

    }

  function applyFont() {
    var root = document.documentElement;
    root.style.setProperty('--fs', FS[S ? S.font : 0] + 'px');
    $$('#fz button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.getAttribute('data-fz') === S.font)); });
  }

  function teilPages(teil) { var r = []; M.pages.forEach(function (p, i) { if (p.teil === teil) r.push(i); }); return r; }
  function maxReachable() {
    if (R.mod !== 'hoeren' || S.audio.done) return M.pages.length - 1;
    return S.audio.track;
  }

  function renderTabs() {
    var cur = M.pages[S.page].teil;
    var h = M.teile.map(function (teil) {
      var pidx = teilPages(teil)[0];
      var locked = pidx > maxReachable();
      var label, pr = '', done = false;
      if (M.writing) {
        var wc = wordCount(S.texts[teil]);
        label = 'Aufgabe ' + teil;
        pr = wc + ' Wörter';
        done = wc >= (T.schreiben.tasks[teil - 1].words || 40);
      } else {
        var its = M.items.filter(function (it) { return it.teil === teil; });
        var ans = its.filter(function (it) { return S.answers[it.no] != null; }).length;
        label = 'Teil ' + teil; pr = ans + '/' + its.length; done = ans === its.length;
      }
      return '<button class="tab' + (done ? ' done' : '') + '" role="tab" type="button" data-teil="' + teil + '" aria-selected="' + (teil === cur) + '"' + (locked ? ' disabled' : '') + '>' +
        (locked ? '<span class="lock">' + ICON.lock + '</span>' : '') + esc(label) + ' <span class="pr">' + (done && !M.writing ? ICON.check + ' ' : '') + esc(pr) + '</span></button>';
    }).join('');
    var tabs = $('#tabs');
    tabs.innerHTML = h;
    $$('.tab', tabs).forEach(function (b) {
      b.addEventListener('click', function () {
        var teil = +b.getAttribute('data-teil');
        if (teil === M.pages[S.page].teil) return;
        go(teilPages(teil)[0]);
      });
    });
    var sel = $('.tab[aria-selected="true"]', tabs);
    if (sel && sel.scrollIntoView) { try { sel.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) { /* old browser */ } }
  }

  function renderChips() {
    var chips = $('#chips');
    if (M.writing) {
      $('#ov').style.visibility = 'hidden';
      return;
    }
    var page = M.pages[S.page], h = '', lastTeil = 0;
    var open = 0, reach = maxReachable();
    M.items.forEach(function (it) {
      if (lastTeil && it.teil !== lastTeil) h += '<span class="gap"></span>';
      lastTeil = it.teil;
      var ans = S.answers[it.no] != null;
      if (!ans) open++;
      h += '<button class="chip' + (ans ? ' ans' : '') + (it.page === S.page ? ' cur' : '') + '" type="button" data-no="' + esc(it.no) + '"' +
        (it.page > reach ? ' disabled' : '') + ' title="Aufgabe ' + esc(it.no) + (ans ? ' – beantwortet' : ' – offen') + '">' + esc(it.no) + '</button>';
    });
    chips.innerHTML = h;
    $('#ovc').textContent = (M.items.length - open) + ' von ' + M.items.length + ' beantwortet';
    $('#ovbtn').textContent = 'Übersicht ' + (M.items.length - open) + '/' + M.items.length;
    $$('.chip', chips).forEach(function (c) { c.addEventListener('click', function () { jumpTo(c.getAttribute('data-no')); }); });
    var cur = $('.chip.cur', chips);
    if (cur && chips.scrollWidth > chips.clientWidth) { chips.scrollLeft = cur.offsetLeft - chips.clientWidth / 2; }
    void page;
  }

  function renderNav() {
    $('#prev').disabled = S.page <= 0;
    $('#next').disabled = S.page >= M.pages.length - 1 || S.page + 1 > maxReachable();
  }

  function renderPage() {
    var p = M.pages[S.page];
    var main = $('#main');
    var h = '';
    var inst = (p.inst || []).filter(Boolean).map(function (s) { return '<p class="inst">' + esc(s) + '</p>'; }).join('');
    var sub = '';
    var tp = teilPages(p.teil);
    if (tp.length > 1) {
      sub = '<div class="sub">' + tp.map(function (pi, k) { return '<button type="button" data-go="' + pi + '" aria-current="' + (pi === S.page) + '">Text ' + (k + 1) + '</button>'; }).join('') + '</div>';

  /* ---------- highlighting (Lesen) ---------- */

      '<p class="ey">Modelltest ' + esc(T.roman) + ' · Modul ' + MOD[R.mod].name + ' · Ergebnis</p>' +
      '<h1>' + (M.writing ? 'Ihre Texte' : 'Ergebnis') + (res.name ? ' · ' + esc(res.name) : '') + '</h1>' +
      '<p class="sl">' + esc(res.finished) + ' · Bearbeitungszeit ' + fmt(res.used) + (res.byTime ? ' · Zeit abgelaufen' : '') + '</p>';
    var pdf = T.pdf, pg = T.pages || {};
    if (res.score) {
      var sc = res.score, pass = sc.points >= 60;
      h += '<div class="score"><div class="bx"><small>Richtige Antworten</small><b>' + sc.correct + ' / ' + sc.total + '</b></div>' +
        '<div class="bx ' + (pass ? 'ok' : 'no') + '"><small>Punkte (von 100)</small><b>' + sc.points + '</b></div>' +
        '<div class="bx ' + (pass ? 'ok' : 'no') + '"><small>Bestehensgrenze 60 Punkte</small><b>' + (pass ? 'bestanden' : 'nicht bestanden') + '</b></div></div>' +
        '<div class="tparts">' + Object.keys(sc.per).map(function (k) { return '<span>Teil ' + k + ' · ' + sc.per[k].c + '/' + sc.per[k].n + '</span>'; }).join('') + '</div>' +
        '<p class="note" style="margin:0 0 12px">30문항 중 18문항(60점) 이상이면 합격선입니다. 점수 = 정답 수 × 100 ÷ 30.</p>';
      h += '<table class="rv"><thead><tr><th>Nr.</th><th>Aufgabe</th><th>Ihre Antwort</th><th>Lösung</th><th></th></tr></thead><tbody>';
      var lastT = 0;
      sc.rows.forEach(function (r) {
        var it = ITEM[r.no]; if (!it) return;
        if (r.teil !== lastT) { h += '<tr class="tp"><td colspan="5">' + MOD[R.mod].name + ' Teil ' + r.teil + '</td></tr>'; lastT = r.teil; }
        h += '<tr class="' + (r.ok ? 'ok' : 'no') + '"><td class="n">' + esc(r.no) + '</td><td class="rvq">' + esc(itemPrompt(it)) + '</td><td class="g">' + esc(ansLabel(it, r.g)) + '</td><td>' + esc(ansLabel(it, r.a)) + '</td><td class="m">' + (r.ok ? '✓' : '✗') + '</td></tr>';
      });
      h += '</tbody></table>';
      h += '<div class="links">' +
        (pg.loesung ? '<a class="btn sm" href="' + pdf + '#page=' + pg.loesung + '" target="_blank" rel="noopener">Lösungsschlüssel (PDF S. ' + pg.loesung + ')</a>' : '') +
        (pg.kommentar ? '<a class="btn sm" href="' + pdf + '#page=' + pg.kommentar + '" target="_blank" rel="noopener">Kommentar für Lehrende (S. ' + pg.kommentar + ')</a>' : '') +
        (R.mod === 'hoeren' && pg.hoertexte ? '<a class="btn sm" href="' + pdf + '#page=' + pg.hoertexte + '" target="_blank" rel="noopener">Hörtexte (S. ' + pg.hoertexte + ')</a>' : '') + '</div>';
    } else {
      T.schreiben.tasks.forEach(function (tk) {
        var tx = res.texts[tk.no] || '', wc = wordCount(tx);
        h += '<div class="wtask"><h3>Aufgabe ' + tk.no + '<small>' + wc + ' Wörter · mindestens ' + tk.words + ' Wörter verlangt</small></h3>' +
          '<pre>' + (tx.trim() ? esc(tx) : '(kein Text)') + '</pre>';
        if (tk.model && tk.model.text) {
          h += '<details><summary>Musterlösung' + (tk.model.label ? ' · ' + esc(tk.model.label) : '') + '</summary><div class="mdl">' + esc(tk.model.text) + '</div>' +
            (tk.typicalErrors ? '<p class="terr"><b>Typische Fehler:</b> ' + esc(tk.typicalErrors) + '</p>' : '') + '</details>';
        }
        h += '</div>';
      });
      h += '<p class="note">Schreiben wird von Prüfenden bewertet (Aufgabe 1 = 60, Aufgabe 2 = 40 Punkte). Schicken Sie Ihre Texte zur Korrektur an Ihre Lehrkraft. · 쓰기는 자동 채점되지 않습니다. 아래 버튼으로 선생님께 답안을 보내 첨삭을 받으세요.</p>';
      h += '<div class="links">' + (pg.muster ? '<a class="btn sm" href="' + pdf + '#page=' + pg.muster + '" target="_blank" rel="noopener">Musterlösungen (PDF S. ' + pg.muster + ')</a>' : '') + '</div>';
    }
    h += '<div class="acts" style="margin-top:22px"><button class="btn pri" id="cp" type="button">' + (M.writing ? '답안 복사' : '결과 복사') + '</button>' +
      '<button class="btn" id="dl" type="button">txt로 저장</button><button class="btn" id="ml" type="button">메일로 보내기</button>' +
      '<button class="btn" id="again" type="button">다시 풀기</button><a class="btn" href="' + BACK + '">모듈 선택</a></div>' +
      '<a class="back" href="index.html#digital">← 디지털 시험 목록</a></section></main></div>';
    app.innerHTML = h;
    var txt = resultText(res);
    var fname = 'Goethe B2 Modelltest ' + T.roman + ' ' + MOD[R.mod].name + (res.name ? ' ' + res.name : '') + '.txt';
    $('#cp').addEventListener('click', function () { copyText(txt); });
    $('#dl').addEventListener('click', function () { downloadText(txt, fname.replace(/[\\/:*?"<>|_]+/g, ' ')); });
    $('#ml').addEventListener('click', function () {
      var subj = 'Goethe B2 Modelltest ' + T.roman + ' · ' + MOD[R.mod].name + (res.name ? ' · ' + res.name : '');
      location.href = 'mailto:' + encodeURIComponent(LEHRER_MAIL) + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(txt);
    });
    $('#again').addEventListener('click', function () {
      modal('Noch einmal?', ['Das Modul beginnt von vorn. Das letzte Ergebnis bleibt gespeichert, bis Sie das Modul erneut abgeben.', '처음부터 다시 풉니다. 다시 제출하기 전까지 지난 결과는 남아 있습니다.'], [
        { label: 'Abbrechen' }, { label: 'Neu beginnen', pri: true, fn: function () { lsDel(STATE_KEY); showStart(); } }
      ]);
    });
    window.scrollTo(0, 0);
  }

  /* ---------- overlays ---------- */
  function modal(title, lines, buttons, blocking) {
    var bg = document.createElement('div');
    bg.className = 'mbg';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdt"><h3 id="mdt">' + esc(title) + '</h3>' +
      lines.map(function (l, i) { return '<p class="' + (i ? 'ko' : '') + '">' + esc(l) + '</p>'; }).join('') +
      '<div class="mb">' + buttons.map(function (b, i) { return '<button type="button" class="btn' + (b.pri ? ' pri' : '') + '" data-i="' + i + '">' + esc(b.label) + '</button>'; }).join('') + '</div></div>';
    document.body.appendChild(bg);
    function close() { if (bg.parentNode) bg.parentNode.removeChild(bg); document.removeEventListener('keydown', onKey); }
    close.el = bg;
    function onKey(e) { if (e.key === 'Escape' && !blocking) close(); }
    document.addEventListener('keydown', onKey);
    $$('button', bg).forEach(function (btn) {
      btn.addEventListener('click', function () { var b = buttons[+btn.getAttribute('data-i')]; close(); if (b.fn) b.fn(); });
    });
    if (!blocking) bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    var pri = $('.btn.pri', bg) || $('.btn', bg); if (pri) pri.focus();
    return close;
  }
  var toastTimer = null;
  function toast(msg, warn) {
    var t = $('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.toggle('w', !!warn); t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 4200);
  }
  function openOverview() {
    if (M.writing) return;
    var reach = maxReachable();
    var h = '<div class="ovgrid">', last = 0;
    M.items.forEach(function (it) {
      if (it.teil !== last) { h += '<span class="tp">Teil ' + it.teil + '</span>'; last = it.teil; }
      var ans = S.answers[it.no] != null;
      h += '<button class="chip' + (ans ? ' ans' : '') + '" type="button" data-no="' + esc(it.no) + '"' + (it.page > reach ? ' disabled' : '') + '>' + esc(it.no) + '</button>';
    });
    h += '</div>';
    var close = modal('Aufgabenübersicht', [countOpen() + ' offene Aufgaben', '번호를 누르면 그 문항으로 이동합니다.'], [{ label: 'Schließen' }]);
    var md = $('.modal', close.el);
    md.insertAdjacentHTML('beforeend', h);
    $$('.ovgrid .chip', md).forEach(function (c) { c.addEventListener('click', function () { close(); jumpTo(c.getAttribute('data-no')); }); });
  }

  /* ---------- tutorial ---------- */
  var tourEls = null;
  function tourSteps() {
    var common = [
      ['#tm', timerId ? 'Hier sehen Sie die verbleibende Zeit. Die Zeit läuft weiter, während Sie das Tutorial ansehen.' : 'Hier sehen Sie die verbleibende Zeit. Die Zeit läuft erst, wenn Sie die Prüfung starten.',
        timerId ? '남은 시험 시간입니다. 튜토리얼을 보는 동안에도 시간은 흐릅니다.' : '남은 시험 시간입니다. 시험을 시작해야 시간이 흐릅니다.']
    ];
    if (R.mod === 'lesen') return common.concat([
      ['#tabs', 'Hier wechseln Sie zwischen den Teilen 1 bis 5. Die Zahl zeigt, wie viele Aufgaben Sie im Teil schon gelöst haben.', 'Teil 1–5 사이를 이동합니다. 숫자는 그 Teil에서 푼 문항 수입니다.'],
      ['#paneL', 'Links steht der Text. In Teil 2 sehen Sie darin die Lücken, in Teil 4 die Äußerungen a–h.', '왼쪽에는 지문이 있습니다. Teil 2에는 Lücke가, Teil 4에는 Äußerung a–h가 있습니다.'],
      ['#paneR', 'Rechts stehen die Aufgaben. Klicken Sie die richtige Lösung an. Sie können Ihre Antwort jederzeit ändern.', '오른쪽에는 문항이 있습니다. 정답을 클릭하세요. 답은 언제든 바꿀 수 있습니다.'],
      ['#mk', 'Mit „Markieren“ heben Sie wichtige Textstellen farbig hervor: einschalten, dann Text mit der Maus markieren. Ein Klick auf die Markierung löscht sie wieder.', '‘Markieren’을 켜고 지문을 드래그하면 형광펜이 칠해집니다. 칠한 곳을 누르면 지워집니다.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#ov', 'In der Aufgabenübersicht sehen Sie, welche Aufgaben schon beantwortet (grün) und welche noch offen sind. Mit einem Klick springen Sie direkt zur Aufgabe.', '문항 번호표에서 푼 문항(초록)과 남은 문항을 확인하고, 번호를 눌러 바로 이동합니다.'],
      ['#nav', 'Mit „Weiter“ und „Zurück“ blättern Sie. Wenn Sie fertig sind, klicken Sie auf „Abgeben“.', '‘Weiter’와 ‘Zurück’으로 넘기고, 다 풀면 ‘Abgeben’을 누릅니다.']
    ]);
    if (R.mod === 'hoeren') return common.concat([
      ['#vol', 'Hier stellen Sie die Lautstärke ein.', '음량을 조절합니다.'],
      ['#abar', 'Hier sehen Sie, welcher Hörtext gerade läuft. Die Hörtexte starten automatisch. Sie können sie nicht anhalten oder wiederholen.', '지금 재생 중인 음원이 표시됩니다. 음원은 자동으로 시작되며 멈추거나 다시 들을 수 없습니다.'],
      ['#tabs', 'Mit dem Hörtext wechselt auch der Teil. Spätere Teile sind gesperrt, frühere Teile können Sie wieder öffnen.', '음원에 맞춰 Teil이 바뀝니다. 다음 Teil은 잠겨 있고, 지나간 Teil은 다시 열 수 있습니다.'],
      ['#paneR', 'Lesen Sie die Aufgaben und klicken Sie die richtige Lösung an.', '문항을 읽고 정답을 클릭하세요.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#ov', 'Die Aufgabenübersicht zeigt, welche Aufgaben noch offen sind.', '문항 번호표에서 남은 문항을 확인합니다.'],
      ['#nav', 'Nach dem letzten Hörtext können Sie Ihre Antworten noch prüfen und dann auf „Abgeben“ klicken.', '마지막 음원이 끝난 뒤 답을 확인하고 ‘Abgeben’을 누릅니다.']
    ]);
    return common.concat([
      ['#tabs', 'Hier wechseln Sie zwischen Aufgabe 1 und Aufgabe 2. Sie können mit jeder Aufgabe beginnen.', '과제 1과 과제 2 사이를 이동합니다. 어느 과제부터 써도 됩니다.'],
      ['.pane.l', 'Hier steht die Aufgabe.', '여기에 과제가 있습니다.'],
      ['#ed', 'Schreiben Sie Ihren Text in dieses Feld.', '이 입력란에 글을 씁니다.'],
      ['#wc', 'Die Wörter werden automatisch gezählt.', '단어 수가 자동으로 계산됩니다.'],
      ['#sz', 'Mit diesen Tasten fügen Sie ä, ö, ü, ß und Anführungszeichen ein.', '이 버튼으로 ä, ö, ü, ß와 따옴표를 넣습니다.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#nav', 'Wenn Sie fertig sind, klicken Sie auf „Abgeben“.', '다 쓰면 ‘Abgeben’을 누릅니다.']
    ]);
  }
  function runTour(done) {
    var steps = tourSteps().filter(function (s) { return $(s[0]); });
    if ($('#help') && $('#help').offsetParent !== null) {
      steps.splice(steps.length - 1, 0, ['#help', 'Mit „?“ können Sie dieses Tutorial während der Prüfung noch einmal ansehen.', '‘?’를 누르면 시험 중에도 이 튜토리얼을 다시 볼 수 있습니다.']);
    }
    var i = 0;
    var block = document.createElement('div'); block.className = 'tipblock';
    var hole = document.createElement('div'); hole.className = 'hole';
    var tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role', 'dialog'); tip.setAttribute('aria-live', 'polite');
    document.body.appendChild(block); document.body.appendChild(hole); document.body.appendChild(tip);
    tourEls = [block, hole, tip];
    function place() {
      var el = $(steps[i][0]); if (!el) return;
      try { el.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ }
      var r = el.getBoundingClientRect(), pad = 5;
      var vw = window.innerWidth, vh = window.innerHeight;
      var top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad);
      var w = Math.min(vw - 8, r.width + pad * 2), hh = Math.min(vh - 8, r.height + pad * 2);
      hole.style.top = top + 'px'; hole.style.left = left + 'px'; hole.style.width = w + 'px'; hole.style.height = hh + 'px';
      tip.innerHTML = '<div class="stp">Tutorial · Schritt ' + (i + 1) + ' von ' + steps.length + '</div><p>' + esc(steps[i][1]) + '</p><p class="ko">' + esc(steps[i][2]) + '</p>' +
        '<div class="tb"><button class="btn sm" type="button" id="tskip">Tutorial beenden</button><span style="display:flex;gap:6px">' +
        (i > 0 ? '<button class="btn sm" type="button" id="tprev">Zurück</button>' : '') +
        '<button class="btn sm pri" type="button" id="tnext">' + (i < steps.length - 1 ? 'Weiter' : 'Fertig') + '</button></span></div>';
      var tw = tip.offsetWidth, th = tip.offsetHeight, gap = 14, tx, ty;
      var clampX = function (x) { return Math.min(Math.max(8, x), vw - tw - 8); };
      var clampY = function (y) { return Math.min(Math.max(8, y), vh - th - 8); };
      if (top + hh + gap + th <= vh - 8) { ty = top + hh + gap; tx = clampX(left); }            // below
      else if (top - gap - th >= 8) { ty = top - gap - th; tx = clampX(left); }                // above
      else if (left - gap - tw >= 8) { tx = left - gap - tw; ty = clampY(top + hh / 2 - th / 2); }   // left
      else if (left + w + gap + tw <= vw - 8) { tx = left + w + gap; ty = clampY(top + hh / 2 - th / 2); } // right
      else { tx = clampX(left + w / 2 - tw / 2); ty = clampY(top + hh - th - 16); }              // inside, bottom
      tip.style.top = ty + 'px'; tip.style.left = tx + 'px';
      $('#tnext').addEventListener('click', function () { if (i < steps.length - 1) { i++; place(); } else end(); });
      if ($('#tprev')) $('#tprev').addEventListener('click', function () { i--; place(); });
      $('#tskip').addEventListener('click', end);
      $('#tnext').focus();
    }
    function end() {
      closeTour();
      window.removeEventListener('resize', place);
      if (!done) return;
      modal('Prüfung starten', ['Das Tutorial ist beendet. Wenn Sie auf „Prüfung starten“ klicken, beginnt die Prüfungszeit' + (R.mod === 'hoeren' ? ' und der erste Hörtext wird abgespielt.' : '.'),
        '‘Prüfung starten’을 누르면 시험 시간이 시작됩니다' + (R.mod === 'hoeren' ? '. 첫 음원도 바로 재생됩니다.' : '.')], [
        { label: 'Prüfung starten', pri: true, fn: done }
      ], true);
    }
    window.addEventListener('resize', place);
    place();
  }
  function closeTour() { if (tourEls) { tourEls.forEach(function (e) { if (e.parentNode) e.parentNode.removeChild(e); }); tourEls = null; } }

  /* ---------- go ---------- */
  if (R.view === 'ergebnis') {
    var rr = lsGet(RESULT_KEY);
    if (rr) { showResult(rr); return; }
  }
  showStart();
  window.__exam = {
    model: M, data: T,
    state: function () { return S; },
    seekEnd: function (left) { var t = Math.max(0, (AUD.duration || 0) - (left || 1)); audioLastPos = t; AUD.currentTime = t; }
  };
})();
</script>
