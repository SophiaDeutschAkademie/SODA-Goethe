and regelmäßig schlecht, und viele kommen unter der Woche auf weniger als sechs Stunden. Empfohlen werden für Erwachsene sieben bis neun Stunden. Besonders häufig betroffen sind Schichtarbeiter und Eltern kleiner Kinder.","Lange galt Schlaf als eine Art Pause, in der der Körper einfach abschaltet. Die Forschung der letzten Jahrzehnte hat dieses Bild gründlich korrigiert. „Im Schlaf ist das Gehirn keineswegs untätig“, erklärt der Schlafmediziner Jonas Reiter. „Es sortiert, was wir tagsüber erlebt haben, und entscheidet, welche Erinnerungen dauerhaft gespeichert werden.“ Wer nach dem Lernen gut schläft, behält den Stoff deshalb besser als jemand, der die Nacht durcharbeitet. Auch das Immunsystem ist nachts besonders aktiv.","Fehlt der Schlaf, macht sich das dagegen schnell bemerkbar. Schon nach einer kurzen Nacht reagieren wir langsamer und treffen riskantere Entscheidungen. Wer über Wochen zu wenig schläft, hat zudem ein höheres Risiko für Übergewicht, Bluthochdruck und Infektionen. Das Tückische daran: Die meisten Betroffenen schätzen ihre eigene Leistungsfähigkeit viel zu positiv ein.","Häufig wird das Smartphone als Hauptschuldiger genannt, weil sein blaues Licht die Bildung des Schlafhormons Melatonin hemmen soll. Reiter hält diesen Effekt für überschätzt. Entscheidender sei, was man auf dem Bildschirm tut: Wer kurz vor dem Schlafengehen noch dienstliche E-Mails liest oder sich über Nachrichten aufregt, sei anschließend schlicht zu aufgewühlt, um abzuschalten. Ein ruhiges Hörbuch oder ein paar Seiten auf dem E-Reader seien dagegen kein Problem.","Eine weitere Ursache sieht der Mediziner in unserem Alltag. Schule und Arbeit beginnen für viele Menschen zu früh, vor allem für Jugendliche, deren innere Uhr sich in der Pubertät nach hinten verschiebt. Beginnt der Unterricht eine Stunde später, bleiben die Schüler abends nicht einfach länger wach, sondern schlafen tatsächlich mehr, und ihre Noten verbessern sich. Trotzdem halten die meisten Schulen am frühen Beginn fest, weil Busfahrpläne und die Arbeitszeiten der Eltern darauf abgestimmt sind.","Was können Erwachsene tun? Reiter empfiehlt vor allem feste Schlafenszeiten, auch am Wochenende. Wer am Samstag bis Mittag schläft, bringt seinen Rhythmus ähnlich durcheinander wie ein Flug über mehrere Zeitzonen. Zu Schlaftabletten rät er nur in Ausnahmefällen und nur für kurze Zeit, weil sich der Körper schnell daran gewöhnt.","Und wer nachts wach liegt, sollte nach etwa zwanzig Minuten lieber aufstehen und etwas Ruhiges tun, statt sich im Bett hin und her zu wälzen. Sonst verbindet das Gehirn das Bett irgendwann nicht mehr mit Schlaf, sondern mit Grübeln."],"source":"aus einer deutschen Tageszeitung","example":{"no":"0","stem":"Viele Erwachsene in Deutschland …","options":{"a":"schlafen weniger als empfohlen.","b":"brauchen weniger als sechs Stunden.","c":"schlafen am Wochenende zu wenig."},"answer":"a"},"items":[{"no":"16","stem":"Laut Jonas Reiter ist das Gehirn im Schlaf damit beschäftigt, …","options":{"a":"sich von der Arbeit zu erholen.","b":"den Tag zu verarbeiten.","c":"alle Erinnerungen zu speichern."},"answer":"b"},{"no":"17","stem":"Wer über längere Zeit zu wenig schläft, …","options":{"a":"überschätzt die eigene Leistung.","b":"bemerkt die Folgen sofort.","c":"trifft vorsichtigere Entscheidungen."},"answer":"a"},{"no":"18","stem":"Beim Smartphone kommt es laut Reiter vor allem darauf an, …","options":{"a":"wie viel blaues Licht es abgibt.","b":"wie lange man es benutzt.","c":"was man damit macht."},"answer":"c"},{"no":"19","stem":"Ein späterer Schulbeginn führt dazu, dass Jugendliche …","options":{"a":"später ins Bett gehen.","b":"insgesamt mehr schlafen.","c":"sich schneller umstellen."},"answer":"b"},{"no":"20","stem":"Schlaftabletten sollte man laut Reiter …","options":{"a":"nur ausnahmsweise nehmen.","b":"vor allem nach Fernreisen nehmen.","c":"nur am Wochenende nehmen."},"answer":"a"},{"no":"21","stem":"Wer nachts nicht einschlafen kann, sollte …","options":{"a":"liegen bleiben.","b":"nach zwanzig Minuten etwas einnehmen.","c":"eine Weile aufstehen."},"answer":"c"}]},"t4":{"instruction":"Sie lesen in einer Zeitschrift Meinungsäußerungen zur Frage, ob Schulnoten abgeschafft werden sollten. Welche Äußerung passt zu welcher Überschrift? Eine Äußerung passt nicht. Die Äußerung a ist das Beispiel und kann nicht noch einmal verwendet werden.","title":"Schule ohne Noten?","example":{"no":"0","text":"Noten sagen wenig über das Gelernte aus.","answer":"a"},"items":[{"no":"22","text":"Ohne Vergleichbarkeit verlieren Abschlüsse an Wert.","answer":"g"},{"no":"23","text":"Rückmeldungen sollten zeigen, wie man sich verbessern kann.","answer":"d"},{"no":"24","text":"Auch mit Misserfolgen muss man umgehen lernen.","answer":"h"},{"no":"25","text":"Schriftliche Beurteilungen sind zu aufwendig.","answer":"e"},{"no":"26","text":"Für Eltern zählt eine klare, schnelle Orientierung.","answer":"b"},{"no":"27","text":"Wer nur für Noten lernt, verliert die Neugier.","answer":"f"}],"texts":[{"letter":"a","text":"Ich hatte in Chemie jahrelang eine Zwei, weil ich vor jedem Test alles auswendig gelernt habe. Verstanden habe ich kaum etwas. Eine Zahl zeigt nur, ob man an einem bestimmten Tag die richtigen Antworten parat hatte, nicht, was man wirklich kann.","byline":"Lena, Jena"},{"letter":"b","text":"Als Vater von drei Kindern möchte ich auf einen Blick sehen, wo sie stehen. Mit Formulierungen wie „bemüht sich im sozialen Miteinander“ kann ich wenig anfangen. Eine Drei ist eine Drei, da weiß ich, dass wir zu Hause etwas tun müssen.","byline":"Markus, Regensburg"},{"letter":"c","text":"Meine Tochter besucht eine Schule, an der es bis zur achten Klasse keine Noten gibt. Die Lehrer schreiben ausführliche Berichte, und sie geht jeden Tag gern hin. Ob das auf Dauer funktioniert, kann ich noch nicht beurteilen. Aber bisher bin ich zufrieden.","byline":"Petra, Kiel"},{"letter":"d","text":"Eine Fünf in Mathe sagt einem Schüler, dass etwas schiefgelaufen ist, aber nicht, was. Viel hilfreicher wäre ein Satz wie: „Beim Bruchrechnen noch unsicher, Textaufgaben gut gelöst.“ Damit weiß man, woran man als Nächstes arbeiten muss.","byline":"Moritz, Mainz"},{"letter":"e","text":"Ich unterrichte fünf Klassen mit je 28 Kindern. Für jedes Kind einen individuellen Bericht zu schreiben, würde mich jedes Halbjahr mehrere Wochenenden kosten. Das ist mit unserem Personal einfach nicht zu schaffen, so schön die Idee auch klingt.","byline":"Sabine, Essen"},{"letter":"f","text":"Mein Sohn fragt bei jeder Hausaufgabe als Erstes: „Wird das benotet?“ Wenn nicht, macht er sie nur halbherzig. Er lernt nicht mehr, weil ihn etwas interessiert, sondern nur noch für die Zahl im Zeugnis. Das finde ich traurig.","byline":"Aylin, Bremen"},{"letter":"g","text":"Man mag Noten ungerecht finden. Aber wenn sich eine Firma zwischen hundert Bewerbern entscheiden muss, braucht sie vergleichbare Kriterien. Ohne Noten würden Universitäten und Arbeitgeber eigene Tests einführen, und am Ende hätten die Schüler noch mehr Prüfungen vor sich.","byline":"Thomas, Leipzig"},{"letter":"h","text":"Im Beruf werde ich auch ständig bewertet, von meiner Chefin und von Kunden. Die Schule sollte junge Menschen darauf vorbereiten und nicht so tun, als gäbe es keine Konkurrenz. Wer nie gelernt hat, mit einer schlechten Note umzugehen, scheitert später an der ersten Kritik.","byline":"Daniel, Köln"}],"unused":["c"]},"t5":{"instruction":"Sie möchten in einem Gemeinschaftsgarten ein Beet übernehmen und lesen die Gartenordnung. Welche der Überschriften aus dem Inhaltsverzeichnis passen zu den Paragrafen? Vier Überschriften werden nicht gebraucht.","title":"Gartenordnung","subtitle":"Gemeinschaftsgarten „Grüne Mitte“ e. V.","headings":{"a":"Mitgliedschaft und Beiträge","b":"Vergabe der Beete","c":"Wasserverbrauch","d":"Gemeinschaftsarbeit","e":"Pflanzenschutz","f":"Werkzeug und Geräte","g":"Ruhezeiten","h":"Haustiere"},"unused":["a","c","f","g"],"example":{"no":"0","label":"§ 0","paragraphs":["Jede Mitgliedsfamilie erhält für eine Saison ein eigenes Beet. Die Beete werden im März verlost; wer im Vorjahr ein Beet hatte, kann dieses auf Wunsch behalten. Wird ein Beet bis Ende Mai nicht bepflanzt, vergibt es der Vorstand neu."],"answer":"b"},"items":[{"no":"28","label":"§ 28","paragraphs":["(1) Alle Mitglieder verpflichten sich, im Jahr mindestens acht Stunden auf den Gemeinschaftsflächen mitzuarbeiten, etwa beim Rasenmähen oder bei der Pflege der Wege. (2) Die Termine werden am Schwarzen Brett ausgehängt. (3) Wer die Stunden nicht leisten kann, zahlt stattdessen einen Ausgleich von 10 Euro pro Stunde."],"answer":"d"},{"no":"29","label":"§ 29","paragraphs":["Chemische Mittel gegen Schädlinge und Unkraut sind im gesamten Garten verboten. Erlaubt sind ausschließlich biologische Mittel, die auf der Liste im Geräteschuppen stehen. Bei starkem Befall wenden Sie sich bitte an den Vorstand, bevor Sie selbst etwas unternehmen."],"answer":"e"},{"no":"30","label":"§ 30","paragraphs":["Hunde dürfen nur angeleint mitgebracht werden und müssen auf den Wegen bleiben. Die Beete anderer Mitglieder dürfen sie nicht betreten. Katzen und andere Tiere dürfen nicht dauerhaft im Garten gehalten werden."],"answer":"h"}]}},"hoeren":{"t1":{"instruction":"Sie hören fünf Gespräche und Äußerungen. Sie hören jeden Text einmal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung. Lesen Sie jetzt das Beispiel. Dazu haben Sie 15 Sekunden Zeit.","example":[{"no":"01","type":"rf","text":"Die Frau möchte ein Kleidungsstück abholen.","answer":"R"},{"no":"02","type":"abc","stem":"Der Mantel …","options":{"a":"ist schon fertig.","b":"wird noch einmal behandelt.","c":"kostet jetzt mehr."},"answer":"b"}],"texts":[{"label":"Text 1","items":[{"no":"1","type":"rf","text":"Der Mann erzählt, warum er erst spät ein Instrument gelernt hat.","answer":"R"},{"no":"2","type":"abc","stem":"Am Anfang …","options":{"a":"nahm er Unterricht bei einem Lehrer.","b":"spielte er auf einem neuen Klavier.","c":"übte er nur, wenn er allein war."},"answer":"c"}]},{"label":"Text 2","items":[{"no":"3","type":"rf","text":"In der Meldung geht es um ein kostenloses Angebot.","answer":"F"},{"no":"4","type":"abc","stem":"Mit dem Ticket …","options":{"a":"kann man zwischen den Museen Sonderbusse nutzen.","b":"fährt man den ganzen Abend in der Stadt mit Bus und Bahn.","c":"kommt man zu allen Konzerten ohne weitere Karte."},"answer":"a"}]},{"label":"Text 3","items":[{"no":"5","type":"rf","text":"Die beiden sind mit der neuen Kantine rundum zufrieden.","answer":"F"},{"no":"6","type":"abc","stem":"Die Frau möchte …","options":{"a":"sich bei der Geschäftsleitung beschweren.","b":"vorschlagen, dass man vorbestellen kann.","c":"das frühere Essen zurückhaben."},"answer":"b"}]},{"label":"Text 4","items":[{"no":"7","type":"rf","text":"Der Förster rät, sich im Wald möglichst viel zu bewegen.","answer":"F"},{"no":"8","type":"abc","stem":"Für das Waldbaden …","options":{"a":"sollte man vorher einen Kurs besuchen.","b":"braucht man ein festes Ziel.","c":"reicht schon ein Park in der Nähe."},"answer":"c"}]},{"label":"Text 5","items":[{"no":"9","type":"rf","text":"Der Mann sagt seine Hilfe beim Umzug zu.","answer":"R"},{"no":"10","type":"abc","stem":"Der Mann …","options":{"a":"kommt nicht allein.","b":"ist um acht Uhr da.","c":"hat den Transporter gemietet."},"answer":"a"}]}]},"t2":{"instruction":"Sie hören im Radio ein Interview mit einer Persönlichkeit aus der Wissenschaft. Sie hören den Text zweimal. Wählen Sie bei jeder Aufgabe die richtige Lösung. Lesen Sie jetzt die Aufgaben 11 bis 16. Dazu haben Sie 90 Sekunden Zeit.","context":"In der Sendung „Sprachzeit“ spricht die Moderatorin mit dem Sprachwissenschaftler Dr. Paul Wendel über Dialekte.","items":[{"no":"11","stem":"Dialekte in Deutschland …","options":{"a":"verändern sich eher, als dass sie aussterben.","b":"verschwinden heute schneller, als man lange dachte.","c":"werden fast nur noch von Älteren gesprochen."},"answer":"a"},{"no":"12","stem":"Viele Menschen verbergen ihren Dialekt, weil …","options":{"a":"sie ihn selbst nicht mehr sicher beherrschen.","b":"er in vielen Berufen ausdrücklich unerwünscht ist.","c":"sie fürchten, für weniger gebildet gehalten zu werden."},"answer":"c"},{"no":"13","stem":"In der Werbung …","options":{"a":"gelten Dialekte als wenig seriös.","b":"setzt man Dialekte zunehmend gezielt ein.","c":"wird bis heute fast nur Hochdeutsch gesprochen."},"answer":"b"},{"no":"14","stem":"Kinder, die mit Dialekt aufwachsen, …","options":{"a":"machen in der Schule mehr Rechtschreibfehler.","b":"verlieren ihn meist bis zur Pubertät.","c":"tun sich mit weiteren Sprachen oft leichter."},"answer":"c"},{"no":"15","stem":"Für seine Forschung …","options":{"a":"nutzt Herr Wendel Aufnahmen von Laien.","b":"reist Herr Wendel in abgelegene Dörfer.","c":"wertet Herr Wendel alte Briefe aus."},"answer":"a"},{"no":"16","stem":"Herr Wendel wünscht sich, dass Menschen …","options":{"a":"Dialekt als eigenes Schulfach lernen.","b":"je nach Situation zwischen den Varianten wechseln.","c":"ihre Kinder konsequent auf Hochdeutsch erziehen."},"answer":"b"}]},"t3":{"instruction":"Sie hören im Radio ein Gespräch mit mehreren Personen. Die Personen sprechen über die Vier-Tage-Woche. Sie hören den Text einmal. Wählen Sie bei jeder Aufgabe: Wer sagt das? Lesen Sie jetzt die Aufgaben 17 bis 22. Dazu haben Sie 60 Sekunden Zeit.","speakers":{"a":"Moderatorin","b":"Frau Okafor, Pflegekraft","c":"Herr Brandl, Unternehmer"},"example":{"no":"0","text":"Mehrere Firmen haben die Vier-Tage-Woche bereits ausprobiert.","answer":"a"},"items":[{"no":"17","text":"Er/Sie findet dank der Vier-Tage-Woche leichter Nachwuchs.","answer":"c"},{"no":"18","text":"Nicht jede Arbeit lässt sich auf vier Tage verteilen.","answer":"b"},{"no":"19","text":"Er/Sie würde für mehr Freizeit nicht auf Gehalt verzichten.","answer":"a"},{"no":"20","text":"Zehn Stunden am Stück zu arbeiten, kann auf Dauer krank machen.","answer":"b"},{"no":"21","text":"In kürzerer Zeit wird nicht weniger geschafft.","answer":"c"},{"no":"22","text":"Entscheidend ist, wer über die freie Zeit bestimmen kann.","answer":"a"}]},"t4":{"instruction":"Sie hören einen kurzen Vortrag. Der Redner spricht über das Thema „Richtig zuhören“. Sie hören den Text zweimal. Wählen Sie bei jeder Aufgabe die richtige Lösung. Lesen Sie jetzt die Aufgaben 23 bis 30. Dazu haben Sie 90 Sekunden Zeit.","items":[{"no":"23","stem":"Die meisten Menschen …","options":{"a":"halten sich für bessere Zuhörer.","b":"hören im Beruf besser zu.","c":"können sich schlecht konzentrieren."},"answer":"a"},{"no":"24","stem":"Während der andere spricht, …","options":{"a":"schauen viele aufs Handy.","b":"unterbrechen ihn viele sofort.","c":"denken viele an ihre Antwort."},"answer":"c"},{"no":"25","stem":"Ungefragte Ratschläge …","options":{"a":"sind oft nicht erwünscht.","b":"gibt man besser am Ende.","c":"werden meist dankbar angenommen."},"answer":"a"},{"no":"26","stem":"Gezielte Nachfragen …","options":{"a":"wirken aufdringlich.","b":"zeigen echtes Interesse.","c":"gehören eher ins Berufsleben."},"answer":"b"},{"no":"27","stem":"Pausen im Gespräch …","options":{"a":"sollte man schnell füllen.","b":"helfen beim Nachdenken.","c":"zeigen Langeweile an."},"answer":"b"},{"no":"28","stem":"Wer zwischendurch zusammenfasst, was er verstanden hat, …","options":{"a":"wirkt schnell besserwisserisch.","b":"verlängert das Gespräch unnötig.","c":"beugt Missverständnissen vor."},"answer":"c"},{"no":"29","stem":"Am Telefon …","options":{"a":"fällt Zuhören leichter.","b":"hört man Gefühle kaum heraus.","c":"fällt Ablenkung sofort auf."},"answer":"c"},{"no":"30","stem":"Der Redner schlägt vor, …","options":{"a":"einen Kurs zu besuchen.","b":"täglich einmal nur zuzuhören.","c":"wichtige Gespräche aufzuzeichnen."},"answer":"b"}]}},"schreiben":{"intro":"Das Modul Schreiben hat zwei Teile. In Teil 1 schreiben Sie einen Forumsbeitrag. In Teil 2 schreiben Sie eine Nachricht. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf die Antwortbogen. Wörterbücher und Mobiltelefone sind nicht erlaubt.","tasks":[{"no":1,"minutes":50,"words":150,"situation":["Sie schreiben einen Forumsbeitrag zum Thema „Haustiere in der Wohnung“."],"points":["Äußern Sie Ihre Meinung dazu, ein Haustier in einer Wohnung zu halten.","Nennen Sie Gründe, warum Haustiere in Mietwohnungen oft zu Konflikten führen.","Nennen Sie andere Möglichkeiten, Zeit mit Tieren zu verbringen.","Nennen Sie Vorteile dieser anderen Möglichkeiten."],"instruction":"Denken Sie an eine Einleitung und einen Schluss. Bei der Bewertung wird darauf geachtet, wie genau die Inhaltspunkte bearbeitet sind, wie korrekt der Text ist und wie gut die Sätze und Abschnitte sprachlich miteinander verknüpft sind. Schreiben Sie mindestens 150 Wörter.","model":{"label":"Forumsbeitrag, ca. 190 Wörter","text":"Liebe Forumsmitglieder,\n\nseit sechs Jahren lebe ich mit zwei Katzen in einer Zweizimmerwohnung und verfolge diese Diskussion deshalb mit großem Interesse.\n\nMeiner Meinung nach kann man durchaus ein Haustier in der Wohnung halten, allerdings nicht jedes. Katzen oder Kaninchen fühlen sich auch auf siebzig Quadratmetern wohl, ein großer Hund dagegen kaum.\n\nDass es trotzdem oft zu Konflikten kommt, hat mehrere Gründe. Zum einen fühlen sich Nachbarn schnell durch Bellen oder Gerüche im Treppenhaus gestört. Zum anderen sind viele Tiere den ganzen Tag allein, weil ihre Besitzer arbeiten, und werden dadurch unruhig. Nicht zuletzt befürchten manche Vermieter Schäden an Böden und Türen.\n\nWer selbst kein Tier halten kann, hat trotzdem Möglichkeiten: Man kann mit Hunden aus dem Tierheim spazieren gehen, die Katze der Nachbarn versorgen, wenn diese verreist sind, oder am Wochenende auf einem Reiterhof mithelfen.\n\nDas hat den Vorteil, dass man sich nicht für fünfzehn Jahre festlegen muss und keine Tierarztkosten hat. Außerdem hilft man Tieren, die sonst kaum Zuwendung bekämen.\n\nAlles in allem finde ich: Ein Haustier in der Wohnung ist möglich, wenn man ehrlich prüft, ob man ihm gerecht werden kann. Wie seht ihr das?"},"typicalErrors":"Nur von den eigenen Tieren erzählen, ohne Gründe für Konflikte zu nennen · Alternativen nennen, aber keine Vorteile (Punkt 4 fehlt)."},{"no":2,"minutes":25,"words":100,"situation":["Sie arbeiten in der Buchhaltung eines Unternehmens. Ihre Vorgesetzte, Frau Hartmann, hat Sie gebeten, ab Montag eine neue Kollegin einzuarbeiten. Sie müssen aber bis Ende des Monats den Jahresabschluss fertigstellen und haben deshalb kaum Zeit für die Einarbeitung. Schreiben Sie eine Nachricht an Frau Hartmann."],"points":["Beschreiben Sie Ihre Situation.","Bitten Sie um Verständnis für Ihre Lage.","Machen Sie einen Vorschlag, wie die Einarbeitung trotzdem gelingen kann.","Zeigen Sie Verständnis für die Situation Ihrer Vorgesetzten."],"instruction":"Überlegen Sie sich eine passende Reihenfolge für die Inhaltspunkte. Bei der Bewertung wird darauf geachtet, wie genau die Inhaltspunkte bearbeitet sind, wie korrekt der Text ist und wie gut die Sätze und Abschnitte sprachlich miteinander verknüpft sind. Vergessen Sie nicht Anrede und Gruß. Schreiben Sie mindestens 100 Wörter.","model":{"label":"Nachricht an die Vorgesetzte, ca. 110 Wörter","text":"Betreff: Einarbeitung von Frau Yilmaz\n\nSehr geehrte Frau Hartmann,\n\nvielen Dank für Ihr Vertrauen. Ich würde Frau Yilmaz gern einarbeiten, allerdings stecke ich gerade mitten im Jahresabschluss, der bis Ende des Monats fertig sein muss. In den nächsten zwei Wochen bleibt mir deshalb kaum Zeit für eine gründliche Einarbeitung.\n\nIch hoffe sehr, dass Sie dafür Verständnis haben.\n\nMir ist bewusst, dass die neue Kollegin möglichst schnell selbstständig arbeiten soll und dass unser Team im Moment ohnehin knapp besetzt ist.\n\nDeshalb schlage ich vor, dass Herr Becker ihr in den ersten beiden Wochen unsere Programme zeigt. Gern stelle ich ihr schon jetzt meine Checklisten zur Verfügung, und ab Anfang nächsten Monats übernehme ich die Einarbeitung selbst.\n\nMit freundlichen Grüßen\nJulia Seifert"},"typicalErrors":"Die Einarbeitung ablehnen, ohne einen Vorschlag zu machen · kein Verständnis für die Vorgesetzte · unpassende Anrede (Hallo Frau Hartmann)."}]},"audio":[{"src":"Goethe%20B2%20Modelltest%203.1.mp3","dur":357.67},{"src":"Goethe%20B2%20Modelltest%203.2.mp3","dur":512.13},{"src":"Goethe%20B2%20Modelltest%203.3.mp3","dur":301.35},{"src":"Goethe%20B2%20Modelltest%203.4.mp3","dur":508.66}],"pdf":"Goethe%20B2%20Modelltest%203.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"4":{"id":4,"roman":"IV","lesen":{"t1":{"instruction":"Sie lesen in einem Forum, wie Menschen über Pünktlichkeit denken. Auf welche der vier Personen treffen die einzelnen Aussagen zu? Die Personen können mehrmals gewählt werden.","forum":{"title":"Wie pünktlich muss man sein?","posts":[{"letter":"a","name":"Nele","time":"03.09. · 21:48 Uhr","paragraphs":["Ich gebe es zu: Ich bin notorisch unpünktlich. Schuld daran ist, glaube ich, mein Studium. Dort begannen die Vorlesungen mit dem akademischen Viertel, also eine Viertelstunde nach der vollen Stunde, und irgendwann plante ich diese fünfzehn Minuten einfach überall ein. Eine Zeit lang stellte ich sogar alle Uhren in meiner Wohnung zehn Minuten vor. Das klappte genau eine Woche – danach wusste ich ja, dass ich eigentlich noch Zeit hatte. Meine Freundinnen nehmen es inzwischen gelassen. Ich schreibe ihnen immer rechtzeitig, dass es später wird, und dann ist das doch kein Problem, oder? Schwieriger ist es in meiner neuen Stelle. Mein Chef hat mich schon zweimal darauf angesprochen, dass ich morgens selten vor halb neun am Schreibtisch sitze. Und ehrlich gesagt: Er hat recht. Ich arbeite daran, aber versprechen kann ich nichts."]},{"letter":"b","name":"Jens","time":"04.09. · 07:15 Uhr","paragraphs":["Ich leite ein Team von zwölf Leuten, und früher begannen unsere Besprechungen praktisch nie zur vereinbarten Zeit. Irgendjemand fehlte immer, und alle anderen warteten. Vor einem Jahr führte ich deshalb eine einfache Regel ein: Wir fangen pünktlich an, egal wer noch fehlt, und wer später kommt, bekommt keine Zusammenfassung. Am Anfang gab es ziemlich viel Murren, inzwischen sitzen fast alle schon vor Beginn im Raum. Und die Besprechungen sind seitdem sogar kürzer geworden. Mir geht es dabei nicht um Strenge, sondern um Fairness gegenüber denen, die sich an die Zeit halten. Privat sehe ich das übrigens völlig anders. Wer zu einer Party um acht eingeladen ist und um Punkt acht klingelt, steht meistens mit dem Gastgeber in der Küche und schneidet Gemüse. Bei Feiern ist eine Viertelstunde Verspätung eher ein Zeichen von Rücksicht als von Unhöflichkeit."]},{"letter":"c","name":"Dagmar","time":"04.09. · 16:32 Uhr","paragraphs":["Bei uns zu Hause war Pünktlichkeit fast heilig. Mein Vater sagte immer: Auf jemanden, der zu spät kommt, kann man sich auch sonst nicht verlassen. Ich war deshalb mein ganzes Leben lang lieber zu früh als zu spät, als Lehrerin sowieso. Lange war ich darauf sogar ein bisschen stolz. Bis meine Tochter mir letztes Jahr erklärte, wie sehr es sie stresst, wenn ich zum Babysitten zwanzig Minuten vor der verabredeten Zeit vor der Tür stehe und sie noch nicht einmal angezogen ist. Seitdem warte ich im Auto, bis es wirklich so weit ist. Was mich allerdings nach wie vor ärgert, sind diese kurzen Nachrichten: „Komme zehn Minuten später.“ Viele halten das für höflich. Ich finde es vor allem bequem – die Zeit der anderen ist trotzdem verloren, man muss sich bloß nicht mehr dafür entschuldigen."]},{"letter":"d","name":"Emre","time":"05.09. · 12:04 Uhr","paragraphs":["Pünktlichkeit hängt leider nicht nur von einem selbst ab. Ich pendle jeden Tag mit dem Zug nach Frankfurt, und wenn der ausfällt, kann ich noch so früh aufstehen. Trotzdem wird man im Büro schief angesehen, als hätte man einfach verschlafen. Das finde ich ziemlich unfair. Inzwischen nehme ich grundsätzlich einen Zug früher. Meistens bin ich dann eine halbe Stunde zu früh da, aber verlorene Zeit ist das nicht: Ich beantworte in Ruhe meine E-Mails oder lese ein paar Seiten. Überhaupt finde ich, dass Pünktlichkeit überschätzt wird. Mir ist ein Kollege lieber, der fünf Minuten zu spät kommt, aber hält, was er verspricht, als einer, der immer auf die Minute da ist und seine Aufgaben liegen lässt. Pünktlich zu sein, kann jeder lernen – auf jemanden zählen zu können, ist mehr wert."]}]},"example":{"no":"0","text":"Wer ist mit Pünktlichkeit als wichtigem Wert aufgewachsen?","answer":"c"},"items":[{"no":"1","text":"Wer half sich mit einem Trick nur kurzfristig?","answer":"a"},{"no":"2","text":"Wer meint, dass bei Feiern andere Regeln gelten?","answer":"b"},{"no":"3","text":"Wer hält Verlässlichkeit für wichtiger als Pünktlichkeit?","answer":"d"},{"no":"4","text":"Wer hat auf Kritik aus der Familie reagiert?","answer":"c"},{"no":"5","text":"Wer erklärt das Zuspätkommen mit einer alten Gewohnheit?","answer":"a"},{"no":"6","text":"Wer ärgert sich über vorschnelle Urteile von Kollegen?","answer":"d"},{"no":"7","text":"Wer lässt Verspätungen auch mit Vorankündigung nicht gelten?","answer":"c"},{"no":"8","text":"Wer hat durch eine Regel andere pünktlicher gemacht?","answer":"b"},{"no":"9","text":"Wer hält eine Vorwarnung für ausreichend?","answer":"a"}]},"t2":{"instruction":"Sie lesen in einer Zeitschrift einen Artikel über kleine Abenteuer vor der Haustür. Welche Sätze passen in die Lücken? Zwei Sätze passen nicht.","title":"Das Abenteuer vor der Haustür","lead":"Eine Nacht unter freiem Himmel, ein Sonnenaufgang auf dem Hausberg: Immer mehr Menschen suchen das Abenteuer nicht in der Ferne, sondern gleich hinter der Stadtgrenze.","paragraphs":["Dienstag, 18 Uhr. Während seine Kollegen nach Hause fahren, packt Lukas Brenner Schlafsack und Isomatte in seinen Rucksack. [0] Am nächsten Morgen um halb acht sitzt der 34-jährige Ingenieur wieder im Büro – unrasiert, aber mit dem Gefühl, eine kleine Reise hinter sich zu haben.","Was Brenner da unternimmt, nennt man ein Mikroabenteuer. Bekannt gemacht hat den Begriff der britische Abenteurer Alastair Humphreys, der einst mit dem Fahrrad um die Welt fuhr. [10] Seine Überzeugung: Ein Abenteuer muss weder weit weg noch teuer sein. Es genügt, den Alltag für ein paar Stunden zu verlassen.","Wie ein Mikroabenteuer aussieht, bestimmt jeder selbst. Manche durchqueren ihre Stadt zu Fuß, andere folgen einem Bach bis zu seiner Quelle. [11] Entscheidend ist nur, dass die Unternehmung in den Alltag passt: Sie beginnt nach Feierabend und endet, bevor der nächste Arbeitstag anfängt.","Dass die Idee so viele Anhänger findet, überrascht Fachleute kaum. Viele fühlen sich im Beruf erschöpft, für eine längere Reise fehlen ihnen aber Zeit oder Geld. [12] Hinzu kommt, dass sich immer mehr Menschen fragen, ob für ein paar Tage Erholung wirklich ein Flug nötig ist.","Ganz ohne Regeln geht es allerdings nicht. Zelten außerhalb von Campingplätzen ist in Deutschland fast überall verboten, und auch für eine Nacht ohne Zelt gelten je nach Bundesland unterschiedliche Vorschriften. [13] Wer unsicher ist, erkundigt sich am besten vorher bei der Gemeinde oder beim Forstamt.","Für den Anfang empfehlen erfahrene Mikroabenteurer eine milde Sommernacht und einen Ort, den man schon bei Tageslicht kennt. [14] Viel Ausrüstung braucht man nicht: Ein warmer Schlafsack, eine Isomatte, eine Stirnlampe und etwas zu essen reichen völlig. Wichtig ist aber, dass jemand weiß, wo man die Nacht verbringt.","Brenner jedenfalls ist längst überzeugt. Seit drei Jahren verbringt er mindestens eine Nacht im Monat im Freien, im Winter auch einmal im Schnee. [15] „Das Abenteuer beginnt nicht am Flughafen“, sagt er, „sondern in dem Moment, in dem man das Gewohnte verlässt.“"],"source":"aus einer deutschen Zeitschrift","example":{"no":"0","text":"Eine halbe Stunde später verlässt er am Stadtrand die S-Bahn und wandert auf einen Hügel,"},"sentences":{"a":"Noch strenger sind die Regeln in Naturschutzgebieten.","b":"Seine Bürokollegen, die ihn anfangs belächelten, kommen manchmal mit.","c":"Wieder andere baden vor dem Frühstück in einem See.","d":"Dafür nehmen sich viele Anhänger regelmäßig eine Woche Urlaub.","e":"So lässt sich gefahrlos testen, ob man sich nachts draußen wohlfühlt.","f":"Zurück in England entdeckte er jedoch die Abenteuer in seiner Nähe.","g":"Die Behörden erlauben das Übernachten im Wald deshalb inzwischen überall.","h":"Ein Mikroabenteuer verschafft ihnen trotzdem eine kurze Auszeit."},"unused":["d","g"],"items":[{"no":"10","answer":"f"},{"no":"11","answer":"c"},{"no":"12","answer":"h"},{"no":"13","answer":"a"},{"no":"14","answer":"e"},{"no":"15","answer":"b"}]},"t3":{"instruction":"Sie lesen in einer Zeitung einen Artikel über das Schreiben mit der Hand. Wählen Sie bei jeder Aufgabe die richtige Lösung.","tasksIntro":"Lesen Sie die Aufgaben 16 bis 21 zum Artikel „Die Hand denkt mit“. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Die Hand denkt mit","lead":"Wir tippen, wischen und diktieren. Braucht es die Handschrift überhaupt noch? Eine Bildungsforscherin wirbt für Gelassenheit – und für den Stift.","paragraphs":["Wann haben Sie zuletzt einen Brief mit der Hand geschrieben? Vielen Menschen fällt die Antwort schwer. Einkaufszettel stehen im Handy, Glückwünsche verschickt man per Messenger, und selbst im Hörsaal sitzen die meisten Studierenden mit dem Laptop. Der Stift, so scheint es, hat ausgedient.","Die Bildungsforscherin Judith Kahle sieht das differenzierter. Seit Jahren untersucht sie, wie Menschen beim Schreiben lernen. Vor der Tastatur zu warnen, hält sie für falsch: „Niemand wird dümmer, weil er tippt.“ Entscheidend sei nicht das Werkzeug, sondern das, was dabei im Kopf passiere.","Tatsächlich deuten mehrere Studien darauf hin, dass sich Studierende Inhalte besser merken, wenn sie in Vorlesungen mit der Hand mitschreiben. Den Grund sieht Kahle allerdings nicht in der Hand selbst, sondern in der Langsamkeit: Wer mit dem Stift schreibe, könne nicht jedes Wort festhalten. Er müsse auswählen, zusammenfassen und in eigene Worte fassen – und genau dabei lerne er. Auf der Tastatur neigten dagegen viele dazu, den Vortrag fast wörtlich mitzutippen.","Auch in den Schulen wird seit Langem darüber gestritten, wie viel Handschrift noch nötig ist. In Finnland etwa gehört die verbundene Schreibschrift seit 2016 nicht mehr zum Pflichtprogramm; stattdessen üben die Kinder früh das Tippen. Kahle hält eine solche Entscheidung für vertretbar. Wichtig sei aber, dass Kinder überhaupt flüssig schreiben lernten. Wer über jeden Buchstaben nachdenken müsse, habe keinen Kopf mehr für den Inhalt.","Und die Erwachsenen? Die meisten schreiben im Alltag kaum mehr als ihre Unterschrift. Kahle beobachtet, dass sich viele für ihre Schrift regelrecht schämen, weil sie ungelenk geworden ist. Die Sicherheit komme jedoch schnell zurück, wenn man die Hand wieder regelmäßig benutze. Schon wenige Minuten am Tag reichten dafür aus, etwa für ein Tagebuch oder eine Notiz an die Familie.","Für Kahle gibt es noch einen weiteren Grund, öfter zum Stift zu greifen: Eine handgeschriebene Karte wirke persönlicher als jede Nachricht auf dem Bildschirm. Man sehe ihr an, dass sich jemand Zeit genommen habe. Offenbar sehen das nicht nur Ältere so: Schreibwarengeschäfte verkaufen seit einiger Zeit wieder mehr hochwertige Füller und Notizbücher – vor allem an junge Leute.","Eine Rückkehr zu Tinte und Löschblatt fordert Kahle trotzdem nicht. Die Zukunft gehöre nicht dem einen oder dem anderen, sondern einer klugen Mischung: der Tastatur für lange Texte, die man immer wieder überarbeite, dem Stift für alles, was man verstehen und behalten wolle. Ihr eigenes Buch hat sie übrigens am Computer geschrieben – die Gliederung dafür aber auf einem großen Bogen Papier."],"source":"aus einer deutschen Tageszeitung","example":{"no":"0","stem":"Viele Menschen …","options":{"a":"schreiben kaum noch mit der Hand.","b":"verschicken keine Glückwünsche mehr.","c":"haben ihren Laptop immer dabei."},"answer":"a"},"items":[{"no":"16","stem":"Was ist nach Judith Kahle beim Schreiben entscheidend?","options":{"a":"Ob man mit der Hand schreibt.","b":"Wie schnell man tippt.","c":"Wie intensiv man nachdenkt."},"answer":"c"},{"no":"17","stem":"Wer in Vorlesungen mit der Hand mitschreibt, …","options":{"a":"hält deutlich mehr Einzelheiten fest.","b":"verarbeitet den Stoff gründlicher.","c":"notiert fast jedes Wort."},"answer":"b"},{"no":"18","stem":"Im Schulunterricht ist es Kahle besonders wichtig, dass Kinder …","options":{"a":"mühelos schreiben können.","b":"die Schreibschrift behalten.","c":"möglichst früh tippen lernen."},"answer":"a"},{"no":"19","stem":"Was gilt nach Kahles Erfahrung für viele Erwachsene?","options":{"a":"Sie führen täglich Tagebuch.","b":"Sie brauchen einen Schreibkurs.","c":"Sie schreiben mit Übung bald wieder sicher."},"answer":"c"},{"no":"20","stem":"Eine handgeschriebene Karte …","options":{"a":"zeigt Wertschätzung für den Empfänger.","b":"ist vor allem bei Älteren beliebt.","c":"ist schneller geschrieben als eine Nachricht."},"answer":"a"},{"no":"21","stem":"Am Ende meint Kahle, man sollte …","options":{"a":"wieder mit Tinte schreiben.","b":"je nach Zweck wählen.","c":"Bücher von Hand schreiben."},"answer":"b"}]},"t4":{"instruction":"Sie lesen in einer Zeitschrift Meinungsäußerungen zur Frage, ob Zoos heute noch zeitgemäß sind. Welche Äußerung passt zu welcher Überschrift? Eine Äußerung passt nicht. Die Äußerung a ist das Beispiel und kann nicht noch einmal verwendet werden.","title":"Zoos – noch zeitgemäß?","example":{"no":"0","text":"Manche Tierart verdankt ihr Überleben den Zoos","answer":"a"},"items":[{"no":"22","text":"Echte Begegnungen machen Kinder zu Tierschützern","answer":"f"},{"no":"23","text":"Das Geld fließt vor allem in die Unterhaltung","answer":"c"},{"no":"24","text":"Für manche Tiere ist jedes Gehege zu klein","answer":"h"},{"no":"25","text":"Erfahrungen aus dem Zoo nützen auch wilden Tieren","answer":"b"},{"no":"26","text":"Artenschutz gehört in die Heimat der Tiere","answer":"g"},{"no":"27","text":"Mit den Tiergärten von früher kaum zu vergleichen","answer":"e"}],"texts":[{"letter":"a","text":"Man kann über Zoos streiten, aber ein Beispiel wird oft vergessen: Das Przewalski-Pferd war in freier Wildbahn bereits ausgestorben. Nur weil Zoos einige Tiere gezüchtet haben, leben heute wieder Herden in der Mongolei. Für mich ist das Argument genug.","byline":"Ole, Lübeck"},{"letter":"b","text":"Ich arbeite als Tierärztin, und vieles, was wir über die Behandlung von Wildtieren wissen, stammt aus Zoos. Wie betäubt man ein Nashorn sicher? Welche Krankheiten bedrohen Menschenaffen? Von diesem Wissen profitieren Tiere in Nationalparks genauso wie die im Gehege.","byline":"Hanna, Erfurt"},{"letter":"c","text":"Die Zoos werben gern mit Artenschutz. Schaut man sich aber an, wofür sie ihr Geld ausgeben, sind es vor allem neue Spielplätze, Restaurants und spektakuläre Anlagen, die möglichst viele Besucher anlocken sollen. Zoos sind in erster Linie Freizeitparks – mit Tieren als Attraktion.","byline":"Vincent, Potsdam"},{"letter":"d","text":"Ich gehe jeden Monat mit meinen beiden Enkeln in den Tierpark. Ehrlich gesagt interessieren sich die zwei weniger für die Löwen als für den Spielplatz und die Pommes. Aber sie sind an der frischen Luft, und das ist in der Stadt schon viel wert.","byline":"Elif, Wiesbaden"},{"letter":"e","text":"Wer den Zoo nur aus seiner Kindheit kennt, sollte ihn sich noch einmal ansehen. Die engen Käfige sind weitgehend verschwunden. Viele Zoos halten heute weniger Arten, geben diesen aber deutlich mehr Platz und versuchen, ihren natürlichen Lebensraum nachzubilden.","byline":"Rainer, Augsburg"},{"letter":"f","text":"Meine Tochter hat im Zoo zum ersten Mal einen Elefanten aus der Nähe gesehen. Seitdem spendet sie einen Teil ihres Taschengelds für ein Schutzprojekt in Afrika. Kein Dokumentarfilm hätte das geschafft. Ein lebendiges Tier weckt Gefühle, die Bilder nicht erzeugen können.","byline":"Svenja, Göttingen"},{"letter":"g","text":"Ein neues Elefantenhaus kostet schnell zwanzig Millionen Euro. Mit diesem Geld könnte man in Afrika oder Asien riesige Flächen schützen, auf denen Tausende Tiere in Freiheit leben. Wer Arten wirklich retten will, sollte dort investieren, wo sie zu Hause sind.","byline":"Jakob, Salzburg"},{"letter":"h","text":"Eisbären legen in der Arktis täglich große Strecken zurück, Elefanten leben in weitläufigen Familienverbänden. Kein Zoo der Welt kann ihnen das bieten. Kleinere Tiere mögen sich im Gehege wohlfühlen – für die großen Wanderer aber sollte die Haltung auslaufen.","byline":"Ines, Chemnitz"}],"unused":["d"]},"t5":{"instruction":"Sie möchten die Stadtbibliothek Lindenfeld nutzen und lesen die Benutzungsordnung. Welche der Überschriften aus dem Inhaltsverzeichnis passen zu den Paragrafen? Vier Überschriften werden nicht gebraucht.","title":"Benutzungsordnung","subtitle":"der Stadtbibliothek Lindenfeld · gültig ab 1. Januar","headings":{"a":"Öffnungszeiten und Feiertage","b":"Anmeldung und Leseausweis","c":"Leihfristen und Verlängerung","d":"Rückgabe außerhalb der Öffnungszeiten","e":"Beschädigung und Verlust","f":"Lern- und Gruppenräume","g":"Gebühren und Mahnungen","h":"Datenschutz"},"unused":["a","c","d","h"],"example":{"no":"0","label":"§ 0","paragraphs":["Für die Anmeldung benötigen Sie einen gültigen Personalausweis oder Reisepass mit Meldebescheinigung. Für Kinder unter 16 Jahren unterschreibt ein Elternteil. Die erhobenen Daten nutzen wir nur für die Ausleihe."],"answer":"b"},"items":[{"no":"28","label":"§ 28","paragraphs":["Die Jahresgebühr beträgt für Erwachsene 15 Euro, Schülerinnen, Schüler und Studierende sind befreit. Bei Überschreitung der Leihfrist erhalten Sie zunächst eine Erinnerung per E-Mail, ab dem achten Tag berechnen wir einen Euro pro Medium. Solange Beträge offen sind, ist keine Ausleihe möglich."],"answer":"g"},{"no":"29","label":"§ 29","paragraphs":["Im zweiten Stock stehen vier Räume für Lerngruppen zur Verfügung. Sie lassen sich online für höchstens drei Stunden täglich reservieren. Essen ist dort nicht erlaubt, Getränke in verschließbaren Flaschen schon. Die Räume sind eine halbe Stunde vor Schließung der Bibliothek zu verlassen."],"answer":"f"},{"no":"30","label":"§ 30","paragraphs":["Bitte prüfen Sie die Medien bei der Ausleihe auf Schäden und melden Sie diese sofort. Für beschädigte oder verlorene Medien ist der Wiederbeschaffungswert zu ersetzen. Für Medien im Rückgabekasten haften Sie bis zur Verbuchung am nächsten Öffnungstag."],"answer":"e"}]}},"hoeren":{"t1":{"instruction":"Sie hören fünf Gespräche und Äußerungen. Sie hören jeden Text einmal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung. Lesen Sie jetzt das Beispiel. Dazu haben Sie 15 Sekunden Zeit.","example":[{"no":"01","type":"rf","text":"Die Frau möchte ihr Fahrrad reparieren lassen.","answer":"R"},{"no":"02","type":"abc","stem":"Das Fahrrad …","options":{"a":"ist morgen Vormittag fertig.","b":"wird noch heute repariert.","c":"braucht keine neuen Teile."},"answer":"a"}],"texts":[{"label":"Text 1","items":[{"no":"1","type":"rf","text":"Der Mann kauft schon lange vor allem Produkte aus der Region.","answer":"F"},{"no":"2","type":"abc","stem":"Warum hat der Mann sein Einkaufsverhalten geändert?","options":{"a":"Regionale Produkte sind günstiger.","b":"Er mag im Winter keine Erdbeeren mehr.","c":"Seine Tochter hat ihn aufgeklärt."},"answer":"c"}]},{"label":"Text 2","items":[{"no":"3","type":"rf","text":"Das Bad wird wegen des Gewitters vollständig geschlossen.","answer":"F"},{"no":"4","type":"abc","stem":"Wer wegen des Wetters nach Hause geht, …","options":{"a":"bekommt einen Gutschein.","b":"erhält den Eintritt zurück.","c":"zahlt beim nächsten Besuch den halben Preis."},"answer":"a"}]},{"label":"Text 3","items":[{"no":"5","type":"rf","text":"Der Mann hat seine Stimme bereits abgegeben.","answer":"R"},{"no":"6","type":"abc","stem":"Am Ende …","options":{"a":"will der Mann zum Weinfest.","b":"überdenkt der Mann seine Wahl.","c":"sagt der Mann seine Teilnahme ab."},"answer":"b"}]},{"label":"Text 4","items":[{"no":"7","type":"rf","text":"Laut Frau Keller sind manche Giftpilze schwer zu erkennen.","answer":"R"},{"no":"8","type":"abc","stem":"Was sagt Frau Keller über Apps?","options":{"a":"Sie bestimmen Pilze meist zuverlässig.","b":"Pilzberatungen empfehlen sie.","c":"Sie eignen sich für eine erste Einschätzung."},"answer":"c"}]},{"label":"Text 5","items":[{"no":"9","type":"rf","text":"Der Kurs findet zur selben Zeit wie das Volleyballtraining statt.","answer":"F"},{"no":"10","type":"abc","stem":"Was beschließt der Mann?","options":{"a":"Er probiert den Kurs erst einmal aus.","b":"Er meldet sich für alle zehn Abende an.","c":"Er hört mit dem Volleyball auf."},"answer":"a"}]}]},"t2":{"instruction":"Sie hören im Radio ein Interview mit einer Persönlichkeit aus der Kultur. Sie hören den Text zweimal. Wählen Sie bei jeder Aufgabe die richtige Lösung. Lesen Sie jetzt die Aufgaben 11 bis 16. Dazu haben Sie 90 Sekunden Zeit.","context":"In der Sendung „Hinter den Kulissen“ spricht die Moderatorin mit Tilman Laux über seine Arbeit als Synchronsprecher.","items":[{"no":"11","stem":"Wie findet es Herr Laux, dass ihn kaum jemand erkennt?","options":{"a":"Er bedauert es manchmal ein wenig.","b":"Es ist ihm völlig gleichgültig.","c":"Er empfindet es eher als Vorteil."},"answer":"c"},{"no":"12","stem":"Wie ist Herr Laux zum Synchronsprechen gekommen?","options":{"a":"Er hat es in seiner Ausbildung gelernt.","b":"Über einen Kollegen vom Theater.","c":"Er suchte einen Nebenjob."},"answer":"b"},{"no":"13","stem":"Was sagt Herr Laux über den deutschen Text?","options":{"a":"Er wird an die Mundbewegungen angepasst.","b":"Er wird möglichst wörtlich übersetzt.","c":"Er wird von den Sprechern selbst verfasst."},"answer":"a"},{"no":"14","stem":"Bei den Aufnahmen im Studio …","options":{"a":"sieht Herr Laux den ganzen Film.","b":"ist Herr Laux meistens allein.","c":"trifft Herr Laux seine Filmpartnerinnen."},"answer":"b"},{"no":"15","stem":"Was beunruhigt Herrn Laux am meisten?","options":{"a":"Bestimmte Klauseln in manchen Verträgen.","b":"Künstliche Stimmen in der Werbung.","c":"Maschinen, die besser spielen als Menschen."},"answer":"a"},{"no":"16","stem":"Jungen Leuten empfiehlt Herr Laux, …","options":{"a":"vor allem die Stimme zu trainieren.","b":"sich gleich um große Rollen zu bewerben.","c":"zuerst gründlich Schauspiel zu lernen."},"answer":"c"}]},"t3":{"instruction":"Sie hören im Radio ein Gespräch mit mehreren Personen. Die Personen sprechen über das Nachtleben in der Stadt. Sie hören den Text einmal. Wählen Sie bei jeder Aufgabe: Wer sagt das? Lesen Sie jetzt die Aufgaben 17 bis 22. Dazu haben Sie 60 Sekunden Zeit.","speakers":{"a":"Moderator","b":"Frau Ahrens, Clubbetreiberin","c":"Herr Kowalski, Anwohner"},"example":{"no":"0","text":"Ohne Ohrstöpsel ist an Schlaf manchmal nicht zu denken.","answer":"a"},"items":[{"no":"17","text":"Mit einem gewissen Lärm hat man beim Einzug gerechnet.","answer":"c"},{"no":"18","text":"Von der Musik bekommen die Nachbarn kaum noch etwas mit.","answer":"b"},{"no":"19","text":"Die Stadt macht es sich mit Zuschüssen zu einfach.","answer":"a"},{"no":"20","text":"Vereinbarungen sind nur so gut wie ihre Kontrolle.","answer":"c"},{"no":"21","text":"Ein Verkaufsverbot würde das Problem bloß verlagern.","answer":"a"},{"no":"22","text":"Im Club ist man besser aufgehoben als auf der Straße.","answer":"b"}]},"t4":{"instruction":"Sie hören einen kurzen Vortrag. Die Rednerin spricht über das Thema „Wie neue Ideen entstehen“. Sie hören den Text zweimal. Wählen Sie bei jeder Aufgabe die richtige Lösung. Lesen Sie jetzt die Aufgaben 23 bis 30. Dazu haben Sie 90 Sekunden Zeit.","items":[{"no":"23","stem":"Frau Falk hört oft, dass Menschen …","options":{"a":"ungern kreativ arbeiten.","b":"sich für unkreativ halten.","c":"keine Zeit für Ideen haben."},"answer":"b"},{"no":"24","stem":"Kreativität ist nach Frau Falk vor allem …","options":{"a":"eine Frage der Übung.","b":"eine seltene Begabung.","c":"Sache von Künstlern."},"answer":"a"},{"no":"25","stem":"Gute Ideen entstehen häufig …","options":{"a":"bei gezielter Suche.","b":"in entspannten Momenten.","c":"nach dem Aufwachen."},"answer":"b"},{"no":"26","stem":"Wer ständig aufs Handy schaut, …","options":{"a":"findet schneller Lösungen.","b":"entspannt sich besser.","c":"lässt dem Kopf keinen Freiraum."},"answer":"c"},{"no":"27","stem":"Über Brainstorming in Gruppen sagt Frau Falk: …","options":{"a":"Es bringt die meisten Ideen hervor.","b":"Allein kommt man auf mehr Ideen.","c":"Firmen sollten es abschaffen."},"answer":"b"},{"no":"28","stem":"In Gruppen …","options":{"a":"schweigen Zurückhaltende häufig.","b":"entstehen originellere Ideen.","c":"übernimmt meist eine Person die Leitung."},"answer":"a"},{"no":"29","stem":"Einschränkungen …","options":{"a":"bremsen neue Ideen.","b":"kosten viel Geld.","c":"fördern den Einfallsreichtum."},"answer":"c"},{"no":"30","stem":"Frau Falk empfiehlt, …","options":{"a":"jede Idee umzusetzen.","b":"täglich Ideen zu notieren.","c":"verrückte Einfälle zu meiden."},"answer":"b"}]}},"schreiben":{"intro":"Das Modul Schreiben hat zwei Teile. In Teil 1 schreiben Sie einen Forumsbeitrag. In Teil 2 schreiben Sie eine Nachricht. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf die Antwortbogen. Wörterbücher und Mobiltelefone sind nicht erlaubt.","tasks":[{"no":1,"minutes":50,"words":150,"situation":["Sie schreiben einen Forumsbeitrag zum Thema „Einheitliche Kleidung an Schulen“."],"points":["Äußern Sie Ihre Meinung dazu, ob Schulen eine einheitliche Kleidung vorschreiben sollten.","Nennen Sie Gründe, warum sich viele Eltern eine Schulkleidung wünschen.","Nennen Sie andere Möglichkeiten, den Druck durch teure Markenkleidung zu verringern.","Nennen Sie Vorteile dieser anderen Möglichkeiten."],"instruction":"Denken Sie an eine Einleitung und einen Schluss. Bei der Bewertung wird darauf geachtet, wie genau die Inhaltspunkte bearbeitet sind, wie korrekt der Text ist und wie gut die Sätze und Abschnitte sprachlich miteinander verknüpft sind. Schreiben Sie mindestens 150 Wörter.","model":{"label":"Forumsbeitrag, ca. 180 Wörter","text":"Liebe Forumsmitglieder,\n\nIn unserem Forum wird gerade heftig darüber diskutiert, ob Schulen eine einheitliche Kleidung vorschreiben sollten. Auch ich habe mir dazu Gedanken gemacht, denn meine Tochter kommt bald aufs Gymnasium.\n\nEhrlich gesagt halte ich eine Pflicht zur Schulkleidung für übertrieben. Kinder sollten auch über ihre Kleidung zeigen dürfen, wer sie sind.\n\nTrotzdem kann ich gut verstehen, warum sich viele Eltern eine Schuluniform wünschen. Zum einen würden teure Marken keine Rolle mehr spielen, sodass niemand wegen seiner Kleidung ausgelacht wird. Zum anderen fiele morgens die lästige Diskussion weg, was man anziehen soll.\n\nEs gibt allerdings andere Wege, den Druck durch Markenkleidung zu verringern. Eine Schule könnte zum Beispiel freiwillige T-Shirts oder Pullover mit ihrem Logo anbieten. Außerdem wäre es sinnvoll, das Thema im Unterricht zu besprechen, etwa in einem Projekt über Werbung und Konsum.\n\nDer Vorteil solcher Lösungen liegt darin, dass niemand gezwungen wird und trotzdem ein Gemeinschaftsgefühl entstehen kann. Wer sich mit Werbung kritisch auseinandersetzt, fällt außerdem nicht mehr so leicht auf teure Marken herein.\n\nInsgesamt bin ich also gegen eine Pflicht, aber für mehr Gespräche über das Thema. Wie seht ihr das?"},"typicalErrors":"Punkt 2 verfehlt: eigene Meinung statt der Gründe der Eltern · deutlich weniger als 150 Wörter."},{"no":2,"minutes":25,"words":100,"situation":["Sie sollen morgen um zehn Uhr bei einem wichtigen Kunden die Ergebnisse Ihres Projekts präsentieren. Heute Abend erfahren Sie, dass die Kita Ihres Sohnes morgen wegen eines Wasserschadens geschlossen bleibt und Sie keine andere Betreuung finden. Ihr Vorgesetzter, Herr Seidel, weiß noch nichts davon. Schreiben Sie eine Nachricht an Herrn Seidel."],"points":["Beschreiben Sie Ihre Situation.","Bitten Sie um Verständnis für Ihre Lage.","Machen Sie einen Vorschlag, wie die Präsentation trotzdem stattfinden kann.","Zeigen Sie Verständnis für die Situation Ihres Vorgesetzten."],"instruction":"Überlegen Sie sich eine passende Reihenfolge für die Inhaltspunkte. Bei der Bewertung wird darauf geachtet, wie genau die Inhaltspunkte bearbeitet sind, wie korrekt der Text ist und wie gut die Sätze und Abschnitte sprachlich miteinander verknüpft sind. Vergessen Sie nicht Anrede und Gruß. Schreiben Sie mindestens 100 Wörter.","model":{"label":"Nachricht an den Vorgesetzten, ca. 120 Wörter","text":"Betreff: Kundenpräsentation morgen\n\nSehr geehrter Herr Seidel,\n\nleider muss ich Ihnen kurzfristig mitteilen, dass die Kita meines Sohnes morgen wegen eines Wasserschadens geschlossen bleibt. Eine andere Betreuung habe ich trotz aller Bemühungen nicht gefunden.\n\nIch bitte Sie deshalb um Verständnis, dass ich morgen nicht ins Büro kommen kann.\n\nMir ist bewusst, wie wichtig der Termin für unsere Abteilung ist und dass Sie dem Kunden gegenüber nun in einer schwierigen Lage sind.\n\nIch schlage daher vor, die Präsentation per Videokonferenz von zu Hause aus zu halten. Alternativ könnte Frau Weber, die das Projekt genauso gut kennt, den Termin vor Ort übernehmen; die Unterlagen schicke ich ihr noch heute.\n\nBitte geben Sie mir kurz Bescheid, was Ihnen lieber ist.\n\nMit freundlichen Grüßen\nTheresa Neuhaus"},"typicalErrors":"um Verständnis bitten und Verständnis zeigen verwechselt · Hallo Herr Seidel oder LG."}]},"audio":[{"src":"Goethe%20B2%20Modelltest%204.1.mp3","dur":376.97},{"src":"Goethe%20B2%20Modelltest%204.2.mp3","dur":497.82},{"src":"Goethe%20B2%20Modelltest%204.3.mp3","dur":301.45},{"src":"Goethe%20B2%20Modelltest%204.4.mp3","dur":471.33}],"pdf":"Goethe%20B2%20Modelltest%204.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}}}}</script>

      hoeren: [
        ['Die Hörtexte werden automatisch nacheinander abgespielt. Sie können sie nicht anhalten, zurückspulen oder wiederholen.', '음원은 자동으로 이어서 재생됩니다. 멈추거나 되감거나 다시 들을 수 없습니다.'],

        ['Stellen Sie die Lautstärke vor dem Start ein. Verwenden Sie am besten Kopfhörer.', '시작 전에 음량을 맞추세요. 헤드폰 사용을 권합니다.']

      schreiben: [
        ['Das Modul besteht aus zwei Aufgaben: Aufgabe 1 (Forumsbeitrag, etwa 50 Minuten) und Aufgabe 2 (Nachricht, etwa 25 Minuten). Sie können die 75 Minuten frei einteilen und zwischen den Aufgaben wechseln.', '두 과제로 이루어져 있습니다. 과제 1(Forumsbeitrag, 50분 정도), 과제 2(Nachricht, 25분 정도). 75분을 자유롭게 나누어 쓰고 과제 사이를 오갈 수 있습니다.'],
        ['Schreiben Sie Ihre Texte in das Textfeld. Die Wörter werden automatisch gezählt.', '입력란에 글을 쓰면 단어 수가 자동으로 계산됩니다.'],
        ['Umlaute und ß können Sie mit den Sonderzeichen-Tasten einfügen.', 'ä, ö, ü, ß는 특수문자 버튼으로 넣을 수 있습니다.'],
        ['Bewertet wird nur der Text im Textfeld. Nach Ablauf der Zeit wird das Modul automatisch abgegeben.', '입력란의 글만 평가 대상이며, 시간이 끝나면 자동으로 제출됩니다.']

    var resumeOK = saved && saved.remaining > 1;
    var h = '<div class="page">' + topHTML(false) + '<main class="pgm"><section class="sheet">' +

      '<h1>Goethe-Zertifikat B2 · ' + info.name + '</h1>' +
      '<p class="sl">Übungsprüfung im digitalen Format — so wie am Computer im Prüfungszentrum.</p>' +

      '<div class="rules"><h2>Hinweise</h2><ul>' + rules.map(function (r) { return '<li>' + esc(r[0]) + '<small>' + esc(r[1]) + '</small></li>'; }).join('') + '</ul></div>' +
      '<div class="namef"><label for="nm">Name (für das Ergebnis) · 이름</label><input id="nm" autocomplete="name" maxlength="40" value="' + esc(lsGet('name') || '') + '"></div>';
    if (R.mod === 'hoeren') {
      h += '<div class="rules" style="margin-top:-6px"><h2>Tonprobe</h2><div class="acts"><div class="vol">' + ICON.vol +

        '<p class="note" style="margin-top:8px">Spielt die ersten Sekunden von Teil 1 ab. · 음량 확인용으로 Teil 1 앞부분을 몇 초 들려줍니다.</p></div>';
    }
    h += '<div class="acts">';
    if (resumeOK) {
      h += '<button class="btn pri" id="resume" type="button">Prüfung fortsetzen (' + fmt(saved.remaining) + ')</button><button class="btn" id="restart" type="button">Neu beginnen</button>';
    } else {
      h += '<button class="btn pri" id="tour" type="button">Tutorial ansehen und starten</button><button class="btn out" id="go" type="button">Ohne Tutorial starten</button>';
    }
    if (res) h += '<button class="btn" id="seeres" type="button">Letztes Ergebnis</button>';
    h += '</div><p class="note">Die Prüfungszeit beginnt erst, wenn Sie auf „Starten“ klicken. · 시작 버튼을 눌러야 시간이 흐릅니다. 시험 중 창을 닫으면 그 시점까지 저장되고, 다시 열면 이어서 풀 수 있습니다.</p>' +
      '<a class="back" href="' + BACK + '">← Modelltest ' + esc(T.roman) + ' · 모듈 선택</a></section></main></div>';
    app.innerHTML = h;
    var nm = $('#nm');
    nm.addEventListener('input', function () { lsSet('name', nm.value.trim()); });
    if (R.mod === 'hoeren') {
      var vr = $('#volr0'); vr.value = Math.round(getVol() * 100);
      vr.addEventListener('input', function () { setVol(vr.value / 100); });
      $('#probe').addEventListener('click', function () {
        var b = this;
        if (curSrc() !== T.audio[0].src) AUD.src = T.audio[0].src;
        else { try { AUD.currentTime = 0; } catch (e) { /* ignore */ } }
        AUD.volume = getVol();
        var p = AUD.play();
        b.disabled = true; b.textContent = 'Tonprobe läuft …';
        clearTimeout(probeTimer);
        probeTimer = setTimeout(function () {
          probeTimer = null;
          if (!timerId) { audioAllowPause = true; AUD.pause(); audioAllowPause = false; }
          b.disabled = false; b.textContent = 'Tonprobe abspielen';
        }, 6000);
        if (p && p.catch) p.catch(function () { b.disabled = false; b.textContent = 'Tonprobe abspielen'; toast('Audio konnte nicht abgespielt werden.', true); });
      });
    }
    if ($('#tour')) $('#tour').addEventListener('click', function () { begin(freshState(), true); });
    if ($('#go')) $('#go').addEventListener('click', function () { begin(freshState(), false); });
    if ($('#resume')) $('#resume').addEventListener('click', function () { begin(saved, false); });
    if ($('#restart')) $('#restart').addEventListener('click', function () {
      modal('Neu beginnen?', ['Ihre bisherigen Antworten in diesem Modul werden gelöscht.', '지금까지의 답이 지워집니다.'], [
        { label: 'Abbrechen' },
        { label: 'Neu beginnen', pri: true, fn: function () { lsDel(STATE_KEY); showStart(); } }
      ]);
    });
    if ($('#seeres')) $('#seeres').addEventListener('click', function () { showResult(res); });
    window.scrollTo(0, 0);
  }

  /* ---------- volume ---------- */
  function getVol() { var v = lsGet('vol'); return typeof v === 'number' ? v : 0.85; }
  function setVol(v) { v = Math.max(0, Math.min(1, v)); AUD.volume = v; lsSet('vol', v); }

  /* ---------- exam shell ---------- */
  function begin(state, withTour) {
    clearTimeout(probeTimer); probeTimer = null;
    if (R.mod === 'hoeren') { audioAllowPause = true; try { AUD.pause(); } catch (e) { /* ignore */ } audioAllowPause = false; }
    S = state;
    warned = {}; markMode = false;
    if (S.build !== D.build) { S.marks = {}; S.build = D.build; }
    if (typeof S.font !== 'number') S.font = 0;
    if (!(S.page >= 0 && S.page < M.pages.length)) S.page = 0;
    if (S.remaining < 60 * 10) warned[10] = true;
    if (S.remaining < 60 * 5) warned[5] = true;
    renderExam();
    if (withTour) runTour(function () { startClock(); });
    else startClock();
  }

  function renderExam() {
    var h = '<div class="exam" id="exam">' + topHTML(true);
    h += '<nav class="tabs" aria-label="Teile"><div class="tl" role="tablist" id="tabs"></div><div class="tr" id="tools"></div></nav>';
    if (R.mod === 'hoeren') {
      h += '<div class="abar" id="abar"><div class="st"><span class="dot"></span><span id="ast">Bereit</span></div><div class="pg"><i id="apg"></i></div><span class="tm" id="atm"></span></div>';
    }
    h += '<main class="main" id="main"></main>';
    h += '<footer class="foot"><div class="ovw" id="ov"><div class="lbl">Aufgabenübersicht<b id="ovc"></b></div><div class="chips" id="chips"></div>' +
      '<button class="btn sm ovbtn" id="ovbtn" type="button"></button></div>' +
      '<div class="nav" id="nav"><button class="btn" id="prev" type="button" aria-label="Zurück">' + ICON.prev + '<span class="tx">Zurück</span></button><button class="btn pri" id="next" type="button">Weiter' + ICON.next + '</button>' +
      '<button class="btn out" id="submit" type="button">Abgeben</button></div></footer></div>';
    app.innerHTML = h;
    applyFont();
    // tools
    var tools = '';
    if (R.mod === 'lesen') {
      tools = '<button class="tbtn" id="mk" type="button" aria-pressed="false" title="Textstellen markieren">' + ICON.marker + '<span class="tx">Markieren</span></button>' +
        '<button class="tbtn icon" id="mkx" type="button" title="Markierungen auf dieser Seite löschen" aria-label="Markierungen löschen">' + ICON.erase + '</button>';
    }
    $('#tools').innerHTML = tools;
    // events
    $$('#fz button').forEach(function (b) { b.addEventListener('click', function () { S.font = +b.getAttribute('data-fz'); lsSet('font', S.font); applyFont(); saveSoon(); }); });
    if (R.mod === 'hoeren') {
      var vr = $('#volr'); vr.value = Math.round(getVol() * 100); AUD.volume = getVol();
      vr.addEventListener('input', function () { setVol(vr.value / 100); });
    }
    $('#help').addEventListener('click', function () { if (!tourEls) runTour(null); });
    $('#prev').addEventListener('click', function () { go(S.page - 1); });
    $('#next').addEventListener('click', function () { go(S.page + 1); });
    $('#submit').addEventListener('click', askSubmit);
    $('#ovbtn').addEventListener('click', openOverview);
    if (R.mod === 'lesen') {
      $('#mk').addEventListener('click', function () { markMode = !markMode; this.setAttribute('aria-pressed', String(markMode)); var pl = $('#pbL'); if (pl) pl.classList.toggle('mk', markMode); });
      $('#mkx').addEventListener('click', function () {
        var pl = $('#pbL'); if (!pl) return;
        $$('mark.hl', pl).forEach(unwrap); pl.normalize(); delete S.marks[M.pages[S.page].key]; saveSoon();
      });
    }
    var main = $('#main');
    main.addEventListener('change', onAnswer);
    main.addEventListener('mouseup', onMarkUp);
    main.addEventListener('touchend', function (e) { setTimeout(function () { onMarkUp(e); }, 30); });
    main.addEventListener('click', onMarkClick);
    renderPage();
  }

  function applyFont() {
    var root = document.documentElement;
    root.style.setProperty('--fs', FS[S ? S.font : 0] + 'px');
    $$('#fz button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.getAttribute('data-fz') === S.font)); });
  }

  function teilPages(teil) { var r = []; M.pages.forEach(function (p, i) { if (p.teil === teil) r.push(i); }); return r; }
  function maxReachable() {
    if (R.mod !== 'hoeren' || S.audio.done) return M.pages.length - 1;
    return S.audio.track;
  }

  function renderTabs() {
    var cur = M.pages[S.page].teil;
    var h = M.teile.map(function (teil) {
      var pidx = teilPages(teil)[0];
      var locked = pidx > maxReachable();
      var label, pr = '', done = false;
      if (M.writing) {
        var wc = wordCount(S.texts[teil]);
        label = 'Aufgabe ' + teil;
        pr = wc + ' Wörter';
        done = wc >= (T.schreiben.tasks[teil - 1].words || 40);
      } else {
        var its = M.items.filter(function (it) { return it.teil === teil; });
        var ans = its.filter(function (it) { return S.answers[it.no] != null; }).length;
        label = 'Teil ' + teil; pr = ans + '/' + its.length; done = ans === its.length;
      }
      return '<button class="tab' + (done ? ' done' : '') + '" role="tab" type="button" data-teil="' + teil + '" aria-selected="' + (teil === cur) + '"' + (locked ? ' disabled' : '') + '>' +
        (locked ? '<span class="lock">' + ICON.lock + '</span>' : '') + esc(label) + ' <span class="pr">' + (done && !M.writing ? ICON.check + ' ' : '') + esc(pr) + '</span></button>';
    }).join('');
    var tabs = $('#tabs');
    tabs.innerHTML = h;
    $$('.tab', tabs).forEach(function (b) {
      b.addEventListener('click', function () {
        var teil = +b.getAttribute('data-teil');
        if (teil === M.pages[S.page].teil) return;
        go(teilPages(teil)[0]);
      });
    });
    var sel = $('.tab[aria-selected="true"]', tabs);
    if (sel && sel.scrollIntoView) { try { sel.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) { /* old browser */ } }
  }

  function renderChips() {
    var chips = $('#chips');
    if (M.writing) {
      $('#ov').style.visibility = 'hidden';
      return;
    }
    var page = M.pages[S.page], h = '', lastTeil = 0;
    var open = 0, reach = maxReachable();
    M.items.forEach(function (it) {
      if (lastTeil && it.teil !== lastTeil) h += '<span class="gap"></span>';
      lastTeil = it.teil;
      var ans = S.answers[it.no] != null;
      if (!ans) open++;
      h += '<button class="chip' + (ans ? ' ans' : '') + (it.page === S.page ? ' cur' : '') + '" type="button" data-no="' + esc(it.no) + '"' +
        (it.page > reach ? ' disabled' : '') + ' title="Aufgabe ' + esc(it.no) + (ans ? ' – beantwortet' : ' – offen') + '">' + esc(it.no) + '</button>';
    });
    chips.innerHTML = h;
    $('#ovc').textContent = (M.items.length - open) + ' von ' + M.items.length + ' beantwortet';
    $('#ovbtn').textContent = 'Übersicht ' + (M.items.length - open) + '/' + M.items.length;
    $$('.chip', chips).forEach(function (c) { c.addEventListener('click', function () { jumpTo(c.getAttribute('data-no')); }); });
    var cur = $('.chip.cur', chips);
    if (cur && chips.scrollWidth > chips.clientWidth) { chips.scrollLeft = cur.offsetLeft - chips.clientWidth / 2; }
    void page;
  }

  function renderNav() {
    $('#prev').disabled = S.page <= 0;
    $('#next').disabled = S.page >= M.pages.length - 1 || S.page + 1 > maxReachable();
  }

  function renderPage() {
    var p = M.pages[S.page];
    var main = $('#main');
    var h = '';
    var inst = (p.inst || []).filter(Boolean).map(function (s) { return '<p class="inst">' + esc(s) + '</p>'; }).join('');
    var sub = '';
    var tp = teilPages(p.teil);
    if (tp.length > 1) {
      sub = '<div class="sub">' + tp.map(function (pi, k) { return '<button type="button" data-go="' + pi + '" aria-current="' + (pi === S.page) + '">Text ' + (k + 1) + '</button>'; }).join('') + '</div>';
    }
    if (M.writing) {
      h += '<section class="pane l" aria-label="Aufgabe"><div class="ph"><h2>' + esc(p.leftTitle) + '</h2></div><div class="pb">' + p.left + '</div></section>';
      h += '<section class="pane r wr" aria-label="Ihr Text"><div class="ph"><h2>Ihr Text</h2></div><div class="pb">' +
        '<div class="sz" id="sz"><span>Sonderzeichen</span>' + ['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü', '„', '“'].map(function (c) { return '<button type="button" data-ch="' + c + '" tabindex="-1">' + c + '</button>'; }).join('') + '</div>' +
        '<textarea class="ed" id="ed" spellcheck="false" autocomplete="off" autocapitalize="sentences" aria-label="Text für Aufgabe ' + p.teil + '"></textarea>' +
        '<div class="wc" id="wc"><span>mindestens ' + esc(p.task.words) + ' Wörter</span><span>Wörter: <b id="wcn">0</b></span></div></div></section>';
    } else if (M.two) {
      var left = S.marks[p.key] || p.left;
      h += '<section class="pane l" id="paneL" aria-label="Text"><div class="ph"><h2>' + esc(p.title) + ' · ' + esc(p.leftTitle) + '</h2>' + sub + '</div><div class="pb' + (markMode ? ' mk' : '') + '" id="pbL">' + inst + left + '</div></section>';
      h += '<section class="pane r" id="paneR" aria-label="Aufgaben"><div class="ph"><h2>' + esc(p.rightTitle) + '</h2></div><div class="pb" id="pbR">' + p.right + '</div></section>';
    } else {
      h += '<section class="pane one" id="paneR" aria-label="Aufgaben"><div class="ph"><h2>' + esc(p.title) + ' · ' + esc(p.rightTitle) + '</h2></div><div class="pb" id="pbR">' + inst +
        (p.ctx ? '<p class="ctx">' + esc(p.ctx) + '</p>' : '') + p.right + '</div></section>';
    }
    main.innerHTML = h;
    // restore answers
    if (!M.writing) {
      Object.keys(S.answers).forEach(function (no) {
        var v = S.answers[no];
        var inp = main.querySelector('input[data-no="' + no + '"][value="' + v + '"]');
        if (inp) { inp.checked = true; setOn(inp); }
        var sel = main.querySelector('select[data-no="' + no + '"]');
        if (sel) sel.value = v;
        markAnswered(no);
      });
      updateMatch();
    } else {
      var ed = $('#ed');
      ed.value = S.texts[p.teil] || '';
      updateWC();
      ed.addEventListener('input', function () { S.texts[p.teil] = ed.value; updateWC(); renderTabs(); saveSoon(); });
      $$('#sz button').forEach(function (b) {
        b.addEventListener('mousedown', function (e) { e.preventDefault(); });
        b.addEventListener('click', function () { insertAtCaret(ed, b.getAttribute('data-ch')); });
      });
    }
    $$('.ph .sub button', main).forEach(function (b) { b.addEventListener('click', function () { go(+b.getAttribute('data-go')); }); });
    $$('.pb', main).forEach(function (pb) { pb.scrollTop = 0; });
    if (window.innerWidth <= 900) window.scrollTo(0, 0);
    renderTabs(); renderChips(); renderNav();
    if (R.mod === 'hoeren') renderAudioBar();
  }

  function insertAtCaret(ed, ch) {
    var s = ed.selectionStart, e = ed.selectionEnd, v = ed.value;
    ed.value = v.slice(0, s) + ch + v.slice(e);
    ed.selectionStart = ed.selectionEnd = s + ch.length;
    ed.focus();
    ed.dispatchEvent(new Event('input'));
  }
  function updateWC() {
    var ed = $('#ed'); if (!ed) return;
    var n = wordCount(ed.value), w = M.pages[S.page].task.words;
    $('#wcn').textContent = n; $('#wc').classList.toggle('reach', n >= w);
  }

  function go(i) {
    if (i < 0 || i >= M.pages.length) return;
    if (i > maxReachable()) { toast('Dieser Teil beginnt erst mit dem nächsten Hörtext.'); return; }
    if (R.mod === 'lesen') saveMarks();
    S.page = i; renderPage(); saveSoon();
  }
  function jumpTo(no) {
    var it = ITEM[no]; if (!it) return;
    if (it.page !== S.page) go(it.page);
    var el = document.getElementById('q-' + no);
    if (el) {
      try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      var f = el.querySelector('input:not([disabled]),select:not([disabled])'); if (f) { try { f.focus({ preventScroll: true }); } catch (e2) { /* ignore */ } }
    }
  }

  function setOn(inp) {
    $$('input[name="' + inp.name + '"]').forEach(function (o) {
      var lab = o.closest('label'); if (lab) lab.classList.toggle('on', o.checked);
    });
  }
  function markAnswered(no) {
    var el = document.getElementById('q-' + no);
    if (el) el.classList.toggle('ans', S.answers[no] != null);
  }
  function onAnswer(e) {
    var t = e.target, no = t.getAttribute && t.getAttribute('data-no');
    if (!no || !S) return;
    if (t.type === 'radio') { S.answers[no] = t.value; setOn(t); }
    else if (t.tagName === 'SELECT') { if (t.value) S.answers[no] = t.value; else delete S.answers[no]; }
    markAnswered(no); updateMatch(); renderTabs(); renderChips(); saveSoon();
  }
  /* Lückentext-Felder und Auswahllisten (Sätze, Überschriften, Äußerungen) mit den Antworten abgleichen */
  function updateMatch() {
    if (!S || M.writing) return;
    $$('.gp').forEach(function (g) {
      var v = S.answers[g.getAttribute('data-no')];
      g.classList.toggle('on', v != null);
      var gl = $('.gl', g); if (gl) gl.textContent = v == null ? '' : v;
    });
    var p = M.pages[S.page];
    if (!p || !p.nos) return;
    var used = {};
    p.nos.forEach(function (no) { if (S.answers[no] != null) used[S.answers[no]] = true; });
    $$('[data-l]').forEach(function (el) { el.classList.toggle('used', !!used[el.getAttribute('data-l')] || el.getAttribute('data-ex') === '1'); });
  }

  /* ---------- highlighting (Lesen) ---------- */
  function unwrap(m) { var p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); }
  function saveMarks() {
    var pl = $('#pbL'); if (!pl || !S) return;
    var key = M.pages[S.page].key;
    if ($('mark.hl', pl)) {
      var clone = pl.cloneNode(true);
      $$('.inst', clone).forEach(function (n) { n.parentNode.removeChild(n); });
      S.marks[key] = clone.innerHTML;
    } else delete S.marks[key];
  }
  function onMarkUp() {
    if (!markMode || R.mod !== 'lesen') return;
    var pl = $('#pbL'); if (!pl) return;
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    if (!pl.contains(range.commonAncestorContainer)) return;
    var rootNode = range.commonAncestorContainer.nodeType === 1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentNode;
    var walker = document.createTreeWalker(rootNode, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [], n;
    while ((n = walker.nextNode())) { if (range.intersectsNode(n)) nodes.push(n); }
    nodes.forEach(function (node) {
      if (node.parentNode && node.parentNode.closest && (node.parentNode.closest('mark.hl') || node.parentNode.closest('.inst') || node.parentNode.closest('.gp'))) return;
      var start = node === range.startContainer ? range.startOffset : 0;

  /* ---------- overlays ---------- */
  function modal(title, lines, buttons, blocking) {
    var bg = document.createElement('div');

    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdt"><h3 id="mdt">' + esc(title) + '</h3>' +
      lines.map(function (l, i) { return '<p class="' + (i ? 'ko' : '') + '">' + esc(l) + '</p>'; }).join('') +
      '<div class="mb">' + buttons.map(function (b, i) { return '<button type="button" class="btn' + (b.pri ? ' pri' : '') + '" data-i="' + i + '">' + esc(b.label) + '</button>'; }).join('') + '</div></div>';
    document.body.appendChild(bg);
    function close() { if (bg.parentNode) bg.parentNode.removeChild(bg); document.removeEventListener('keydown', onKey); }
    close.el = bg;
    function onKey(e) { if (e.key === 'Escape' && !blocking) close(); }
    document.addEventListener('keydown', onKey);
    $$('button', bg).forEach(function (btn) {
      btn.addEventListener('click', function () { var b = buttons[+btn.getAttribute('data-i')]; close(); if (b.fn) b.fn(); });
    });
    if (!blocking) bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    var pri = $('.btn.pri', bg) || $('.btn', bg); if (pri) pri.focus();
    return close;
  }
  var toastTimer = null;
  function toast(msg, warn) {
    var t = $('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.toggle('w', !!warn); t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 4200);
  }
  function openOverview() {
    if (M.writing) return;
    var reach = maxReachable();
    var h = '<div class="ovgrid">', last = 0;
    M.items.forEach(function (it) {
      if (it.teil !== last) { h += '<span class="tp">Teil ' + it.teil + '</span>'; last = it.teil; }
      var ans = S.answers[it.no] != null;
      h += '<button class="chip' + (ans ? ' ans' : '') + '" type="button" data-no="' + esc(it.no) + '"' + (it.page > reach ? ' disabled' : '') + '>' + esc(it.no) + '</button>';
    });
    h += '</div>';
    var close = modal('Aufgabenübersicht', [countOpen() + ' offene Aufgaben', '번호를 누르면 그 문항으로 이동합니다.'], [{ label: 'Schließen' }]);
    var md = $('.modal', close.el);
    md.insertAdjacentHTML('beforeend', h);
    $$('.ovgrid .chip', md).forEach(function (c) { c.addEventListener('click', function () { close(); jumpTo(c.getAttribute('data-no')); }); });
  }

  /* ---------- tutorial ---------- */
  var tourEls = null;
  function tourSteps() {
    var common = [
      ['#tm', timerId ? 'Hier sehen Sie die verbleibende Zeit. Die Zeit läuft weiter, während Sie das Tutorial ansehen.' : 'Hier sehen Sie die verbleibende Zeit. Die Zeit läuft erst, wenn Sie die Prüfung starten.',
        timerId ? '남은 시험 시간입니다. 튜토리얼을 보는 동안에도 시간은 흐릅니다.' : '남은 시험 시간입니다. 시험을 시작해야 시간이 흐릅니다.']
    ];
    if (R.mod === 'lesen') return common.concat([
      ['#tabs', 'Hier wechseln Sie zwischen den Teilen 1 bis 5. Die Zahl zeigt, wie viele Aufgaben Sie im Teil schon gelöst haben.', 'Teil 1–5 사이를 이동합니다. 숫자는 그 Teil에서 푼 문항 수입니다.'],
      ['#paneL', 'Links steht der Text. In Teil 2 sehen Sie darin die Lücken, in Teil 4 die Äußerungen a–h.', '왼쪽에는 지문이 있습니다. Teil 2에는 Lücke가, Teil 4에는 Äußerung a–h가 있습니다.'],
      ['#paneR', 'Rechts stehen die Aufgaben. Klicken Sie die richtige Lösung an. Sie können Ihre Antwort jederzeit ändern.', '오른쪽에는 문항이 있습니다. 정답을 클릭하세요. 답은 언제든 바꿀 수 있습니다.'],
      ['#mk', 'Mit „Markieren“ heben Sie wichtige Textstellen farbig hervor: einschalten, dann Text mit der Maus markieren. Ein Klick auf die Markierung löscht sie wieder.', '‘Markieren’을 켜고 지문을 드래그하면 형광펜이 칠해집니다. 칠한 곳을 누르면 지워집니다.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#ov', 'In der Aufgabenübersicht sehen Sie, welche Aufgaben schon beantwortet (grün) und welche noch offen sind. Mit einem Klick springen Sie direkt zur Aufgabe.', '문항 번호표에서 푼 문항(초록)과 남은 문항을 확인하고, 번호를 눌러 바로 이동합니다.'],
      ['#nav', 'Mit „Weiter“ und „Zurück“ blättern Sie. Wenn Sie fertig sind, klicken Sie auf „Abgeben“.', '‘Weiter’와 ‘Zurück’으로 넘기고, 다 풀면 ‘Abgeben’을 누릅니다.']
    ]);
    if (R.mod === 'hoeren') return common.concat([
      ['#vol', 'Hier stellen Sie die Lautstärke ein.', '음량을 조절합니다.'],
      ['#abar', 'Hier sehen Sie, welcher Hörtext gerade läuft. Die Hörtexte starten automatisch. Sie können sie nicht anhalten oder wiederholen.', '지금 재생 중인 음원이 표시됩니다. 음원은 자동으로 시작되며 멈추거나 다시 들을 수 없습니다.'],
      ['#tabs', 'Mit dem Hörtext wechselt auch der Teil. Spätere Teile sind gesperrt, frühere Teile können Sie wieder öffnen.', '음원에 맞춰 Teil이 바뀝니다. 다음 Teil은 잠겨 있고, 지나간 Teil은 다시 열 수 있습니다.'],
      ['#paneR', 'Lesen Sie die Aufgaben und klicken Sie die richtige Lösung an.', '문항을 읽고 정답을 클릭하세요.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#ov', 'Die Aufgabenübersicht zeigt, welche Aufgaben noch offen sind.', '문항 번호표에서 남은 문항을 확인합니다.'],
      ['#nav', 'Nach dem letzten Hörtext können Sie Ihre Antworten noch prüfen und dann auf „Abgeben“ klicken.', '마지막 음원이 끝난 뒤 답을 확인하고 ‘Abgeben’을 누릅니다.']
    ]);
    return common.concat([
      ['#tabs', 'Hier wechseln Sie zwischen Aufgabe 1 und Aufgabe 2. Sie können mit jeder Aufgabe beginnen.', '과제 1과 과제 2 사이를 이동합니다. 어느 과제부터 써도 됩니다.'],
      ['.pane.l', 'Hier steht die Aufgabe.', '여기에 과제가 있습니다.'],
      ['#ed', 'Schreiben Sie Ihren Text in dieses Feld.', '이 입력란에 글을 씁니다.'],
      ['#wc', 'Die Wörter werden automatisch gezählt.', '단어 수가 자동으로 계산됩니다.'],
      ['#sz', 'Mit diesen Tasten fügen Sie ä, ö, ü, ß und Anführungszeichen ein.', '이 버튼으로 ä, ö, ü, ß와 따옴표를 넣습니다.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#nav', 'Wenn Sie fertig sind, klicken Sie auf „Abgeben“.', '다 쓰면 ‘Abgeben’을 누릅니다.']
    ]);
  }
  function runTour(done) {
    var steps = tourSteps().filter(function (s) { return $(s[0]); });
    if ($('#help') && $('#help').offsetParent !== null) {
      steps.splice(steps.length - 1, 0, ['#help', 'Mit „?“ können Sie dieses Tutorial während der Prüfung noch einmal ansehen.', '‘?’를 누르면 시험 중에도 이 튜토리얼을 다시 볼 수 있습니다.']);
    }
    var i = 0;
    var block = document.createElement('div'); block.className = 'tipblock';
    var hole = document.createElement('div'); hole.className = 'hole';
    var tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role', 'dialog'); tip.setAttribute('aria-live', 'polite');
    document.body.appendChild(block); document.body.appendChild(hole); document.body.appendChild(tip);
    tourEls = [block, hole, tip];
    function place() {
      var el = $(steps[i][0]); if (!el) return;
      try { el.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ }
      var r = el.getBoundingClientRect(), pad = 5;
      var vw = window.innerWidth, vh = window.innerHeight;
      var top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad);
      var w = Math.min(vw - 8, r.width + pad * 2), hh = Math.min(vh - 8, r.height + pad * 2);
      hole.style.top = top + 'px'; hole.style.left = left + 'px'; hole.style.width = w + 'px'; hole.style.height = hh + 'px';
      tip.innerHTML = '<div class="stp">Tutorial · Schritt ' + (i + 1) + ' von ' + steps.length + '</div><p>' + esc(steps[i][1]) + '</p><p class="ko">' + esc(steps[i][2]) + '</p>' +
        '<div class="tb"><button class="btn sm" type="button" id="tskip">Tutorial beenden</button><span style="display:flex;gap:6px">' +
        (i > 0 ? '<button class="btn sm" type="button" id="tprev">Zurück</button>' : '') +
        '<button class="btn sm pri" type="button" id="tnext">' + (i < steps.length - 1 ? 'Weiter' : 'Fertig') + '</button></span></div>';
      var tw = tip.offsetWidth, th = tip.offsetHeight, gap = 14, tx, ty;
      var clampX = function (x) { return Math.min(Math.max(8, x), vw - tw - 8); };
      var clampY = function (y) { return Math.min(Math.max(8, y), vh - th - 8); };
      if (top + hh + gap + th <= vh - 8) { ty = top + hh + gap; tx = clampX(left); }            // below
      else if (top - gap - th >= 8) { ty = top - gap - th; tx = clampX(left); }                // above
      else if (left - gap - tw >= 8) { tx = left - gap - tw; ty = clampY(top + hh / 2 - th / 2); }   // left
      else if (left + w + gap + tw <= vw - 8) { tx = left + w + gap; ty = clampY(top + hh / 2 - th / 2); } // right
      else { tx = clampX(left + w / 2 - tw / 2); ty = clampY(top + hh - th - 16); }              // inside, bottom
      tip.style.top = ty + 'px'; tip.style.left = tx + 'px';
      $('#tnext').addEventListener('click', function () { if (i < steps.length - 1) { i++; place(); } else end(); });
      if ($('#tprev')) $('#tprev').addEventListener('click', function () { i--; place(); });
      $('#tskip').addEventListener('click', end);
      $('#tnext').focus();
    }
    function end() {
      closeTour();
      window.removeEventListener('resize', place);
      if (!done) return;
      modal('Prüfung starten', ['Das Tutorial ist beendet. Wenn Sie auf „Prüfung starten“ klicken, beginnt die Prüfungszeit' + (R.mod === 'hoeren' ? ' und der erste Hörtext wird abgespielt.' : '.'),
        '‘Prüfung starten’을 누르면 시험 시간이 시작됩니다' + (R.mod === 'hoeren' ? '. 첫 음원도 바로 재생됩니다.' : '.')], [
        { label: 'Prüfung starten', pri: true, fn: done }
      ], true);
    }
    window.addEventListener('resize', place);
    place();
  }
  function closeTour() { if (tourEls) { tourEls.forEach(function (e) { if (e.parentNode) e.parentNode.removeChild(e); }); tourEls = null; } }

  /* ---------- go ---------- */
  if (R.view === 'ergebnis') {
    var rr = lsGet(RESULT_KEY);
    if (rr) { showResult(rr); return; }
  }
  showStart();
  window.__exam = {
    model: M, data: T,
    state: function () { return S; },
    seekEnd: function (left) { var t = Math.max(0, (AUD.duration || 0) - (left || 1)); audioLastPos = t; AUD.currentTime = t; }
  };
})();
</script>
</body>
</html>
