<script id="soda-theme-js">
(function(){

    var b=document.createElement('button'); b.type='button'; b.id='soda-theme-btn'; b.className='soda-theme-btn';
    function paint(){ var dk=d.getAttribute('data-theme')==='dark'; b.innerHTML=dk?SUN:MOON; b.setAttribute('aria-pressed',dk?'true':'false'); b.setAttribute('aria-label','다크 모드 '+(dk?'끄기':'켜기')); b.title='다크 모드 '+(dk?'켜짐':'꺼짐')+' · 누르면 '+(dk?'라이트':'다크')+'로 바뀌어요'; }

    paint(); document.body.appendChild(b);
    
  }
  if(document.body) mount(); else document.addEventListener('DOMContentLoaded',mount);
})();
</script>

:root{
  --bg:#e7eaee;--panel:#fff;--bar:#f5f6f8;--line:#cbd2da;--line-2:#e2e6eb;
  --ink:#1b2430;--ink-2:#434f5e;--muted:#68727f;
  --acc:#1d6a56;--acc-2:#165443;--acc-w:#e3f0eb;--acc-line:#93c4b2;
  --warn:#a8322a;--warn-w:#fbecea;--mark:#ffe680;
  --fs:16px;
  --font:"Pretendard SODA",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol{margin:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;height:58px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:5}
.top .logo{width:22px;height:auto;display:block;flex:none}
.top .id{display:flex;flex-direction:column;min-width:0;line-height:1.25;padding-left:12px;border-left:1px solid var(--line-2)}
.top .id b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .id > span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.tool{display:flex;align-items:center;gap:6px}
.hlp{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;font-weight:700;font-size:16px;color:var(--ink-2);padding:0}
.hlp:hover{background:var(--acc-w)}
.fz{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.fz button{border:0;background:none;width:34px;height:32px;padding:0;font-weight:700;color:var(--ink-2)}
.fz button+button{border-left:1px solid var(--line-2)}
.fz button[aria-pressed="true"]{background:var(--acc-w);color:var(--acc-2)}
.fz .s1{font-size:12px}.fz .s2{font-size:14px}.fz .s3{font-size:17px}
.vol{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:0 10px;height:34px;background:#fff;color:var(--ink-2)}
.vol input{width:96px;accent-color:var(--acc)}
.timer{display:flex;align-items:center;gap:9px;height:42px;padding:0 12px 0 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.timer svg{flex:none;color:var(--ink-2)}
.timer .tl{display:flex;flex-direction:column;line-height:1.1}
.timer .tl small{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.timer .tl b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.timer.low{border-color:var(--warn);background:var(--warn-w)}
.timer.low b,.timer.low svg{color:var(--warn)}

/* ---------- part tabs ---------- */
.tabs{display:flex;align-items:stretch;gap:0;background:var(--bar);border-bottom:1px solid var(--line);flex:none;padding:0 10px;min-height:46px}
.tabs .tl{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs .tl::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;border:0;border-top:3px solid transparent;background:none;padding:0 16px;font-weight:700;color:var(--ink-2);white-space:nowrap;position:relative}
.tab .pr{font-weight:400;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:0 7px;line-height:18px}
.tab.done .pr{background:var(--acc-w);border-color:var(--acc-line);color:var(--acc-2)}
.tab[aria-selected="true"]{background:#fff;border-top-color:var(--acc);color:var(--ink);box-shadow:1px 0 0 var(--line),-1px 0 0 var(--line)}
.tab:disabled{cursor:not-allowed;color:#9aa3ad}
.tab:disabled .pr{opacity:.6}
.tab .lock{display:inline-flex;color:#9aa3ad}
.tabs .tr{display:flex;align-items:center;gap:8px;padding-left:10px}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tbtn[aria-pressed="true"]{background:#fff6c7;border-color:#d9bf44;color:#5c4a00}
.tbtn.icon{padding:0 9px}

/* ---------- audio bar ---------- */
.abar{display:flex;align-items:center;gap:14px;padding:9px 18px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.abar .st{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap;min-width:0}
.abar .st .dot{width:10px;height:10px;border-radius:50%;background:#9aa3ad;flex:none}
.abar.on .st .dot{background:var(--acc);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.abar .pg{flex:1;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;min-width:60px}
.abar .pg i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s linear}
.abar .tm{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- main panes ---------- */
.exam{display:flex;flex-direction:column;height:100vh;height:100dvh}
.main{flex:1;min-height:0;display:flex;gap:12px;padding:12px}
.pane{flex:1 1 0;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pane.l{flex-basis:54%}.pane.r{flex-basis:46%}
.pane.one{max-width:980px;margin:0 auto;width:100%}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 18px;border-bottom:1px solid var(--line-2);background:#fafbfc;flex:none}
.ph h2{font-size:14px;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.ph .sub{display:flex;gap:4px}
.ph .sub button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.ph .sub button[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.pb{flex:1;overflow:auto;padding:20px 24px 48px;font-size:var(--fs);line-height:1.62;-webkit-overflow-scrolling:touch}
.pb.mk{cursor:text}
.pb.mk ::selection{background:var(--mark)}
mark.hl{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.pb.mk mark.hl{cursor:pointer}
.inst{color:var(--ink-2);font-weight:500;margin-bottom:16px}
.inst+.inst{margin-top:-8px}
.ctx{margin-bottom:16px;padding:12px 14px;background:#f6f8f9;border-left:3px solid var(--line);border-radius:0 4px 4px 0}
.h1t{font-size:calc(var(--fs)*1.15);font-weight:700;margin-bottom:10px}

/* texts */
.card{border:1px solid var(--line);border-radius:6px;padding:16px 18px;background:#fff}
.art h3,.doc h3,.forum h3{font-size:1.3em;line-height:1.25;margin-bottom:10px}
.art p,.doc p{margin:0 0 .75em}
.art .lead{font-weight:600;color:var(--ink-2);margin-bottom:12px}
.art .src{text-align:right;font-size:.85em;color:var(--muted);margin-top:8px}

/* Lesen Teil 1: Forum */
.post2{border:1px solid var(--line);border-radius:6px;margin-bottom:14px;background:#fff;overflow:hidden}

/* Lesen Teil 4: Äußerungen */
.stm{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.stm:last-child{border-bottom:0}

.stm .tg{font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}

/* Lesen Teil 5: Paragrafen */

<script id="exam-data" type="application/json">{"build":"202610270851","tests":{"1":{"id":1,"roman":"I","lesen":{"t1":{"instruction":"Sie lesen in einem Forum, wie Menschen über Auszeiten vom Smartphone denken. Auf welche der vier Personen treffen die einzelnen Aussagen zu? Die Personen können mehrmals gewählt werden.","forum":{"title":"Auszeit vom Smartphone","posts":[{"letter":"a","name":"Merve","time":"14.03. · 21:47 Uhr","paragraphs":["Ein „Digital-Detox“-Wochenende in einem Kloster, bei dem man das Handy am Eingang abgibt – das habe ich mir letzten Herbst gegönnt. Ehrlich gesagt war es eine teure Enttäuschung: Kaum hatte ich mein Telefon zurück, war alles wie vorher. Solche Angebote halte ich inzwischen eher für ein Geschäftsmodell als für eine Lösung. Was mir tatsächlich hilft, sind kleine, feste Regeln: Das Handy übernachtet in der Küche, geweckt werde ich von einem ganz normalen Wecker, und Benachrichtigungen habe ich bis auf Anrufe abgeschaltet. Ganz verzichten könnte ich ohnehin nicht, denn als Pflegekraft im Schichtdienst erfahre ich über eine App, wenn ich kurzfristig einspringen muss. Dass mich die Station jederzeit erreichen kann, finde ich sogar beruhigend. Was mich nervt, ist etwas anderes: In jeder freien Minute schaue ich automatisch aufs Display, sogar an der roten Ampel. Seit mir das aufgefallen ist, bleibt das Gerät beim Spazierengehen zu Hause."]},{"letter":"b","name":"Frank","time":"14.03. · 22:15 Uhr","paragraphs":["Bei uns steht seit einem halben Jahr eine Kiste im Flur, in der während des Abendessens alle Handys liegen – meines eingeschlossen. Die Idee stammt übrigens nicht von mir, sondern von meiner Tochter, die sich beschwert hat, dass ich beim Essen ständig E-Mails beantworte. Das hat gesessen. Als Selbstständiger hatte ich lange das Gefühl, jeden Anruf sofort annehmen zu müssen, weil der Kunde sonst eben bei der Konkurrenz anruft. Heute habe ich für das Geschäft ein zweites Telefon, das nach Feierabend ausgeschaltet bleibt, und siehe da: Mir ist dadurch kein einziger Auftrag entgangen. An unsere Regel halten sich die Kinder inzwischen deutlich besser als ich. Ab und zu ertappe ich mich dabei, wie ich heimlich in den Flur gehe und nachsehe, ob jemand geschrieben hat. Einen kompletten Verzicht halte ich trotzdem nicht für sinnvoll: Wir planen unsere Ausflüge mit dem Handy, und die Großeltern schicken uns jeden Sonntag Fotos."]},{"letter":"c","name":"Leonie","time":"15.03. · 08:02 Uhr","paragraphs":["In der Fastenzeit habe ich sämtliche Social-Media-Apps gelöscht, sieben Wochen lang. Die ersten Tage waren seltsam: Ständig hatte ich das Gefühl, mein Handy vibriere in der Tasche, obwohl es stumm auf dem Schreibtisch lag. Nach etwa zwei Wochen wurde ich ruhiger, und in den sieben Wochen habe ich mehr gelesen als im ganzen Jahr davor. Einen Preis hatte das Experiment allerdings: Weil in meinem Freundeskreis fast alles über Gruppenchats läuft, habe ich von zwei Geburtstagsfeiern erst hinterher erfahren. Niemand war auf die Idee gekommen, mich anzurufen. Inzwischen sind die Apps wieder da, diesmal aber mit einem Limit von 30 Minuten am Tag, an das ich mich meistens halte. Was mich an der ganzen Debatte ärgert: Sie tut so, als hinge alles von der Willenskraft des Einzelnen ab. Dabei werden diese Apps von Fachleuten gezielt so entwickelt, dass man möglichst lange dabeibleibt. Gegen ein ganzes Team von Psychologen komme ich mit guten Vorsätzen allein nicht an."]},{"letter":"d","name":"Tobias","time":"15.03. · 19:30 Uhr","paragraphs":["Ich bin beruflich drei, vier Tage pro Woche unterwegs, und ohne Smartphone wäre ich aufgeschmissen: Bahntickets, Hotel, Navigation, Übersetzungen – alles läuft darüber. Deshalb habe ich mit dem Wort „Entgiftung“ ein Problem. Das Handy ist für mich kein Gift, sondern ein Werkzeug; entscheidend ist, wann und wofür man es benutzt. Einen Urlaub völlig ohne Netz können sich meiner Meinung nach ohnehin nur Leute leisten, die im Job eine Vertretung haben. Ich habe keine. Was ich mir wünschen würde, wären klare Absprachen im Betrieb. In Frankreich haben Beschäftigte sogar ein Recht darauf, nach Feierabend nicht erreichbar zu sein. Bei uns hängt das von der Laune der Vorgesetzten ab. Privat habe ich mir angewöhnt, einmal im Monat meine Bildschirmzeit auszuwerten. Die Zahlen sind oft ernüchternd, vor allem was die Abende im Hotel betrifft. Aber sie helfen mir, ehrlich zu mir selbst zu sein, statt mir einzureden, ich hätte alles im Griff."]}]},"example":{"no":"0","text":"Wer hat für eine Auszeit vom Smartphone bezahlt, die nicht lange gewirkt hat?","answer":"a"},"items":[{"no":"1","text":"Wer wurde von einem Familienmitglied kritisiert?","answer":"b"},{"no":"2","text":"Wer hält eine bestimmte Bezeichnung für unpassend?","answer":"d"},{"no":"3","text":"Bei wem ließen die anfänglichen Schwierigkeiten mit der Zeit nach?","answer":"c"},{"no":"4","text":"Wen stört die ständige Erreichbarkeit eigentlich nicht?","answer":"a"},{"no":"5","text":"Wessen Befürchtung hat sich nicht bestätigt?","answer":"b"},{"no":"6","text":"Wer hat durch den Verzicht Nachteile im Freundeskreis erlebt?","answer":"c"},{"no":"7","text":"Wer hält einen Urlaub ohne Internet für ein Privileg?","answer":"d"},{"no":"8","text":"Wer verbannt das Handy nachts aus dem Schlafzimmer?","answer":"a"},{"no":"9","text":"Wer sieht auch App-Anbieter in der Verantwortung?","answer":"c"}]},"t2":{"instruction":"Sie lesen in einer Zeitschrift einen Artikel über die Rückkehr der Nachtzüge. Welche Sätze passen in die Lücken? Zwei Sätze passen nicht.","title":"Mit dem Schlafwagen durch Europa","lead":"Lange galten Nachtzüge als Auslaufmodell. Jetzt erleben sie ein Comeback – mit Nebenwirkungen.","paragraphs":["Es ist kurz vor neun am Abend, Gleis 7 am Wiener Hauptbahnhof. Familien, Geschäftsreisende und Studierende mit Rucksäcken warten auf den Zug nach Hamburg. [0] Wer am nächsten Morgen ausgeschlafen in Norddeutschland ankommen will, hat seinen Platz meist schon Wochen im Voraus reserviert. Spontan noch ein Bett zu bekommen, ist in der Hauptreisezeit fast aussichtslos.","Vor zehn Jahren hätte kaum jemand ein solches Bild für möglich gehalten. Viele europäische Bahnen hatten ihre Nachtverbindungen damals eingestellt, auch die Deutsche Bahn, die 2016 ihre letzten Schlaf- und Liegewagen abgab. [10] Die Wagen waren alt, das Personal teuer, und auf vielen Strecken waren Billigflieger schneller und günstiger.","Dass die Züge heute wieder rollen, ist vor allem den Österreichischen Bundesbahnen zu verdanken. Sie übernahmen einen Teil der Fahrzeuge und bauten unter dem Namen „Nightjet“ ein eigenes Netz auf. [11] Inzwischen verbinden Nachtzüge Dutzende Städte zwischen Brüssel und Rom.","Für den Aufschwung gibt es mehrere Gründe. Immer mehr Menschen wollen aus Klimagründen aufs Fliegen verzichten, ohne dafür einen ganzen Reisetag zu opfern. [12] Hinzu kommt, dass man ohne Sicherheitskontrolle mitten in der Stadt einsteigt und mitten in der Stadt ankommt.","Ganz ohne Schattenseiten ist das Comeback allerdings nicht. Fahrgäste klagen über Verspätungen von mehreren Stunden, defekte Klimaanlagen oder Wagen, die kurzfristig ausgetauscht werden. [13] Das liegt auch daran, dass ein Nachtzug häufig mehrere Länder durchquert, deren Bahnen sich über Fahrpläne und Personal einigen müssen.","Und billig ist die Nacht auf Schienen selten. Ein Einzelabteil im Schlafwagen kostet schnell mehr als ein Flug samt Hotelübernachtung. [14] Die Bahnen verweisen darauf, dass sie für jeden gefahrenen Kilometer Gebühren zahlen, während Kerosin in der EU bis heute weitgehend steuerfrei ist.","Trotzdem wächst das Angebot weiter. Neue Anbieter aus den Niederlanden und Schweden planen eigene Verbindungen, und auch die EU will grenzüberschreitende Nachtzüge stärker fördern. [15] Ob der Nachtzug damit dauerhaft zur Alternative wird, hängt nicht zuletzt davon ab, ob die neuen Wagen pünktlich geliefert werden."],"source":"aus einer deutschen Zeitschrift","example":{"no":"0","text":"Der Nachtzug ist an diesem Abend bis auf den letzten Platz ausgebucht."},"sentences":{"a":"Genau das verspricht der Nachtzug: Man verschläft die Strecke einfach.","b":"Seitdem baut die Deutsche Bahn ihr Nachtzugnetz stetig aus.","c":"Das Geschäft lohne sich nicht mehr, hieß es damals.","d":"Die Hersteller kommen mit der Produktion allerdings kaum hinterher.","e":"Was als riskante Wette galt, hat sich als Erfolg erwiesen.","f":"Die Preise sind deshalb in den letzten Jahren deutlich gesunken.","g":"Für viele Familien ist das ein Grund, doch wieder zu fliegen.","h":"Nicht selten schläft man dann im Sitzwagen statt im gebuchten Abteil."},"unused":["b","f"],"items":[{"no":"10","answer":"c"},{"no":"11","answer":"e"},{"no":"12","answer":"a"},{"no":"13","answer":"h"},{"no":"14","answer":"g"},{"no":"15","answer":"d"}]},"t3":{"instruction":"Sie lesen in einer Zeitung einen Artikel darüber, warum Menschen wichtige Aufgaben aufschieben. Wählen Sie bei jeder Aufgabe die richtige Lösung.","tasksIntro":"Lesen Sie die Aufgaben 16 bis 21 zum Artikel „Morgen, morgen, nur nicht heute“. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Morgen, morgen, nur nicht heute","lead":"Wer Aufgaben vor sich herschiebt, gilt schnell als faul. Ganz so einfach ist es aber nicht.","paragraphs":["Die Steuererklärung liegt seit Wochen auf dem Schreibtisch, von der Präsentation für Montag existiert noch keine einzige Folie – stattdessen wird die Küche geputzt oder ein Video nach dem anderen angesehen. Umfragen zufolge schiebt rund jeder fünfte Erwachsene regelmäßig wichtige Aufgaben so lange hinaus, dass er sich damit selbst schadet. Unter Studierenden liegt der Anteil noch deutlich höher.","Lange galt Aufschieben als Zeichen von Faulheit oder mangelnder Disziplin. Die Forschung zeichnet inzwischen ein anderes Bild. „Prokrastination ist in erster Linie kein Problem des Zeitmanagements, sondern eines der Gefühlsregulation“, sagt die Psychologin Katrin Oswald. Wer eine Aufgabe vor sich herschiebt, weicht demnach nicht der Arbeit selbst aus, sondern den Gefühlen, die mit ihr verbunden sind: der Langeweile, der Unsicherheit oder der Angst, den eigenen Ansprüchen nicht zu genügen.","Kurzfristig funktioniert diese Strategie sogar: Sobald das Dokument geschlossen ist, lässt die Anspannung nach, man fühlt sich erleichtert. Genau darin liegt jedoch die Falle, denn das Gehirn merkt sich, dass Ausweichen belohnt wird, und wählt beim nächsten Mal wieder denselben Weg. Je näher der Termin rückt, desto größer werden Druck und schlechtes Gewissen.","Besonders anfällig sind nach Oswalds Beobachtung nicht etwa die Nachlässigen, sondern Menschen mit hohen Ansprüchen an sich selbst. Wer fürchtet, dass das Ergebnis nicht perfekt wird, fängt lieber gar nicht erst an. Hinzu kommt ein Phänomen, das Fachleute als Distanz zum „zukünftigen Ich“ beschreiben. In Experimenten behandelten Versuchspersonen ihr eigenes späteres Ich ähnlich wie eine fremde Person – und überließen ihm bereitwillig die unangenehmen Aufgaben.","Was also hilft? Appelle an die Willenskraft bringen wenig, sagt Oswald. Wirksamer sei es, den Einstieg so klein wie möglich zu machen: nicht „die Hausarbeit schreiben“, sondern „die Datei anlegen und drei Sätze notieren“. Hilfreich sei außerdem, die Arbeit an feste Zeiten und Orte zu binden, statt jedes Mal neu zu entscheiden, wann man sich an den Schreibtisch setzt.","Eine Rolle spielt zudem der Umgang mit sich selbst, auch wenn das zunächst paradox klingt. Eine kanadische Studie ergab: Studierende, die nachsichtig mit sich waren, nachdem sie das Lernen für eine Prüfung aufgeschoben hatten, schoben vor der nächsten Prüfung weniger auf als jene, die sich heftige Vorwürfe machten. Strenge gegenüber sich selbst verstärkt offenbar genau die negativen Gefühle, vor denen man eigentlich flieht.","Ganz verschwinden wird das Aufschieben wohl nie, und das muss es auch nicht. Nicht jede verschobene Aufgabe ist ein Problem; manchmal stellt sich heraus, dass sie gar nicht so wichtig war. Kritisch wird es erst, wenn Gesundheit, Finanzen oder Beziehungen darunter leiden."],"source":"aus einer deutschen Tageszeitung","example":{"no":"0","stem":"Wer eine wichtige Aufgabe aufschiebt, …","options":{"a":"beschäftigt sich oft mit anderen Tätigkeiten.","b":"hat in Wirklichkeit meistens zu viel zu tun.","c":"schadet damit vor allem anderen Menschen."},"answer":"a"},"items":[{"no":"16","stem":"Nach Ansicht von Katrin Oswald schieben Menschen Aufgaben auf, weil sie …","options":{"a":"ihre Zeit schlecht einteilen.","b":"unangenehme Gefühle meiden.","c":"sich zu viel vornehmen."},"answer":"b"},{"no":"17","stem":"Das Aufschieben wird leicht zur Gewohnheit, weil …","options":{"a":"die Erleichterung als Belohnung wirkt.","b":"der Druck mit der Zeit nachlässt.","c":"das Gehirn unangenehme Aufgaben vergisst."},"answer":"a"},{"no":"18","stem":"Besonders gefährdet sind laut Oswald Menschen, die …","options":{"a":"wenig sorgfältig sind.","b":"ungern mit anderen arbeiten.","c":"viel von sich verlangen."},"answer":"c"},{"no":"19","stem":"In den Experimenten zeigte sich, dass die Versuchspersonen …","options":{"a":"Aufgaben lieber anderen überließen.","b":"ihr späteres Ich wie einen Fremden behandelten.","c":"sich für später zu viel vornahmen."},"answer":"b"},{"no":"20","stem":"Oswald empfiehlt, …","options":{"a":"an die Disziplin zu appellieren.","b":"täglich neu zu planen.","c":"ganz klein anzufangen."},"answer":"c"},{"no":"21","stem":"Die Studie aus Kanada legt nahe, dass …","options":{"a":"Selbstvorwürfe eher schaden.","b":"Studierende öfter aufschieben.","c":"Strenge gegen sich selbst hilft."},"answer":"a"}]},"t4":{"instruction":"Sie lesen in einer Zeitschrift Meinungsäußerungen zur Frage, ob das Bargeld abgeschafft werden sollte. Welche Äußerung passt zu welcher Überschrift? Eine Äußerung passt nicht. Die Äußerung a ist das Beispiel und kann nicht noch einmal verwendet werden.","title":"Bargeld – ein Auslaufmodell?","example":{"no":"0","text":"Wer bar zahlt, gibt bewusster aus.","answer":"a"},"items":[{"no":"22","text":"Was für Kunden bequem ist, kommt kleine Läden teuer zu stehen.","answer":"e"},{"no":"23","text":"Wer digital bezahlt, verrät mehr über sich, als ihm lieb ist.","answer":"b"},{"no":"24","text":"Den Wert des Geldes begreift man mit den Händen.","answer":"h"},{"no":"25","text":"Im Ernstfall ist auf Technik kein Verlass.","answer":"d"},{"no":"26","text":"Ohne Bargeld hätte illegale Arbeit weniger Chancen.","answer":"f"},{"no":"27","text":"Der Fortschritt darf niemanden zurücklassen.","answer":"c"}],"texts":[{"letter":"a","text":"Seit ich wieder bar bezahle, landet weniger Unnötiges im Einkaufswagen. Wenn die Scheine weniger werden, überlege ich zweimal, ob ich die dritte Packung Kekse wirklich brauche. Beim Bezahlen mit Karte fehlt mir dieses Gefühl völlig.","byline":"Bettina, Kassel"},{"letter":"b","text":"Jede Kartenzahlung hinterlässt Spuren: wann ich wo war und was ich gekauft habe. Die Daten landen bei Banken, und niemand kann mir sagen, was in zehn Jahren damit geschieht. Bargeld ist eine der letzten Möglichkeiten, im Alltag anonym zu bleiben.","byline":"Malte, Leipzig"},{"letter":"c","text":"Meine Mutter ist 86 und hat weder ein Smartphone noch Lust auf Apps. Ihre Rente holt sie am Schalter ab und verteilt sie auf Umschläge. Wer das Bargeld abschafft, nimmt Menschen wie ihr ein Stück Selbstständigkeit.","byline":"Renate, Bielefeld"},{"letter":"d","text":"Letzten Winter war unser Ort nach einem Sturm zwei Tage ohne Strom. Kein Kartenterminal funktionierte, die Geldautomaten waren außer Betrieb. Beim Bäcker bekam nur Brot, wer Bargeld hatte. Seitdem liegt bei uns immer eine kleine Reserve in der Schublade.","byline":"Jörg, Rosenheim"},{"letter":"e","text":"Viele zahlen sogar den Kaffee für 1,80 Euro mit Karte. Für mich kostet jede dieser Zahlungen eine Gebühr, dazu kommt die Miete für das Terminal. Bei kleinen Beträgen bleibt am Ende kaum etwas übrig. Große Ketten verkraften das, ein Kiosk wie meiner nicht.","byline":"Sevgi, Mannheim"},{"letter":"f","text":"Wer auf dem Bau oder in der Gastronomie arbeitet, weiß, wie viel dort „schwarz“ bezahlt wird. Dem Staat entgehen dadurch jedes Jahr Milliarden. Wenn jede Zahlung digital erfolgt, lässt sie sich zurückverfolgen. Wer ehrlich ist, hat davon nichts zu befürchten.","byline":"Carsten, Hamburg"},{"letter":"g","text":"Seit drei Jahren bezahle ich nur noch mit dem Handy. Ob im Café, auf dem Wochenmarkt oder am Parkscheinautomaten – überall klappt das in Sekunden. Früher habe ich ständig nach Kleingeld gesucht. Ehrlich gesagt verstehe ich die ganze Aufregung nicht.","byline":"Aylin, Köln"},{"letter":"h","text":"Unsere Kinder bekommen ihr Taschengeld in Münzen. Beim Sparen sehen sie, wie sich das Glas füllt – und dass ein Eis den Plan verschiebt. Eine Zahl in einer App bleibt für Achtjährige abstrakt. Geld muss man in der Hand gehabt haben.","byline":"Thomas, Graz"}],"unused":["g"]},"t5":{"instruction":"Sie möchten an der Volkshochschule einen Kurs belegen und lesen die Teilnahmebedingungen. Welche der Überschriften aus dem Inhaltsverzeichnis passen zu den Paragrafen? Vier Überschriften werden nicht gebraucht.","title":"Teilnahmebedingungen","subtitle":"der Volkshochschule Neustadt · gültig ab dem Herbstsemester","headings":{"a":"Kursgebühren und Zahlung","b":"Anmeldung","c":"Teilnahmebescheinigungen","d":"Ermäßigungen","e":"Rücktritt durch Teilnehmende","f":"Haftung und Versicherung","g":"Absage durch die Volkshochschule","h":"Nutzung der Räume"},"unused":["a","c","f","h"],"example":{"no":"0","label":"§ 0","paragraphs":["Die Anmeldung ist schriftlich, online oder persönlich in der Geschäftsstelle möglich und für beide Seiten verbindlich. Eine Benachrichtigung erhalten Sie nur, wenn der Kurs bereits ausgebucht ist; in diesem Fall kommen Sie auf die Warteliste."],"answer":"b"},"items":[{"no":"28","label":"§ 28","paragraphs":["(1) Eine Abmeldung ist bis spätestens sieben Tage vor Kursbeginn kostenfrei möglich. Sie bedarf der Textform; ein Anruf genügt nicht.","(2) Bei einer späteren Abmeldung wird die volle Gebühr fällig, es sei denn, Sie benennen eine Ersatzperson, die an Ihrer Stelle teilnimmt."],"answer":"e"},{"no":"29","label":"§ 29","paragraphs":["Schülerinnen und Schüler, Studierende, Auszubildende sowie Inhaberinnen und Inhaber des Neustadt-Passes erhalten auf Antrag einen Nachlass von 50 Prozent. Der Antrag ist mit der Anmeldung zu stellen; der Nachweis ist spätestens beim ersten Kurstermin vorzulegen."],"answer":"d"},{"no":"30","label":"§ 30","paragraphs":["Wird die Mindestzahl von acht Teilnehmenden nicht erreicht oder fällt die Kursleitung aus, ohne dass Ersatz gefunden werden kann, kann die Volkshochschule den Kurs absagen. Bereits gezahlte Gebühren werden dann vollständig erstattet. Weitergehende Ansprüche, etwa auf Erstattung von Fahrtkosten, sind ausgeschlossen."],"answer":"g"}]}},"hoeren":{"t1":{"instruction":"Sie hören fünf Gespräche und Äußerungen. Sie hören jeden Text einmal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung. Lesen Sie jetzt das Beispiel. Dazu haben Sie 15 Sekunden Zeit.","example":[{"no":"01","type":"rf","text":"Die Frau möchte ihren Vertrag beenden.","answer":"R"},{"no":"02","type":"abc","stem":"Einen neuen Tarif …","options":{"a":"kann sie nur schriftlich beantragen.","b":"bekommt sie sofort im Geschäft.","c":"gibt es erst ab dem nächsten Monat."},"answer":"b"}],"texts":[{"label":"Text 1","items":[{"no":"1","type":"rf","text":"Die Frau erklärt, warum ihr der Chor so wichtig ist.","answer":"R"},{"no":"2","type":"abc","stem":"Dem Chor beigetreten ist sie ursprünglich, um …","options":{"a":"ihre Stimme ausbilden zu lassen.","b":"nach einem Umzug Anschluss zu finden.","c":"besser mit Stress umgehen zu können."},"answer":"b"}]},{"label":"Text 2","items":[{"no":"3","type":"rf","text":"In der Meldung geht es um neue Regeln für Leihroller.","answer":"R"},{"no":"4","type":"abc","stem":"Wer einen Roller außerhalb der Zonen abstellt, …","options":{"a":"kann die Fahrt nicht beenden.","b":"muss ein Bußgeld zahlen.","c":"zahlt dem Anbieter mehr."},"answer":"c"}]},{"label":"Text 3","items":[{"no":"5","type":"rf","text":"Die beiden sprechen über eine Regelung, die bereits gilt.","answer":"F"},{"no":"6","type":"abc","stem":"Der Mann schlägt vor, dass …","options":{"a":"das Team selbst die Zeiten festlegt.","b":"die Chefin die Zeiten festlegt.","c":"alle spätestens um zehn Uhr anfangen."},"answer":"a"}]},{"label":"Text 4","items":[{"no":"7","type":"rf","text":"Die Frau rät von Tieren aus dem Tierheim ab.","answer":"F"},{"no":"8","type":"abc","stem":"Die meisten Tiere werden zurückgebracht, weil die Halter …","options":{"a":"die Kosten falsch einschätzen.","b":"den Zeitaufwand unterschätzen.","c":"keine passende Wohnung haben."},"answer":"b"}]},{"label":"Text 5","items":[{"no":"9","type":"rf","text":"Der Mann ändert am Ende seine eigenen Pläne.","answer":"R"},{"no":"10","type":"abc","stem":"Die Frau …","options":{"a":"hat die Eintrittskarten selbst gekauft.","b":"kennt den Fotografen persönlich.","c":"würde sonst jemand anderen fragen."},"answer":"c"}]}]},"t2":{"instruction":"Sie hören im Radio ein Interview mit einer Persönlichkeit aus der Wissenschaft. Sie hören den Text zweimal. Wählen Sie bei jeder Aufgabe die richtige Lösung. Lesen Sie jetzt die Aufgaben 11 bis 16. Dazu haben Sie 90 Sekunden Zeit.","context":"In der Sendung „Wissen am Mittag“ spricht der Moderator mit der Stadtklimaforscherin Dr. Sabine Hartung über Hitze in deutschen Städten.","items":[{"no":"11","stem":"Frau Hartung hält vor allem für problematisch, dass …","options":{"a":"es mittags in der Stadt zu heiß wird.","b":"sich der Körper nachts kaum noch erholen kann.","c":"es in vielen Straßen keinen Schatten gibt."},"answer":"b"},{"no":"12","stem":"Besonders gefährdet sind laut Frau Hartung Menschen, die …","options":{"a":"in modernen Hochhäusern wohnen.","b":"sich tagsüber viel draußen aufhalten.","c":"unter schlecht gedämmten Dächern leben."},"answer":"c"},{"no":"13","stem":"Was sagt Frau Hartung über Bäume?","options":{"a":"Sie kühlen erst nach vielen Jahren spürbar.","b":"Sie wirken stärker als helle Dächer.","c":"Sie kommen in der Stadt mit wenig Wasser aus."},"answer":"a"},{"no":"14","stem":"Klimaanlagen hält Frau Hartung …","options":{"a":"grundsätzlich für schädlich.","b":"für die beste Lösung in schlecht gedämmten Dachwohnungen.","c":"nur in manchen Einrichtungen für nötig."},"answer":"c"},{"no":"15","stem":"Das Pilotprojekt hat gezeigt, dass …","options":{"a":"persönliche Kontakte besonders viel bewirken.","b":"Broschüren die Menschen am besten erreichen.","c":"ältere Menschen ungern ihre Wohnung verlassen."},"answer":"a"},{"no":"16","stem":"Für die Anpassung der Städte fehlt nach Meinung von Frau Hartung vor allem …","options":{"a":"die nötige Technik.","b":"die Bereitschaft, sich unbeliebt zu machen.","c":"das Geld, um neue Grünflächen anzulegen."},"answer":"b"}]},"t3":{"instruction":"Sie hören im Radio ein Gespräch mit mehreren Personen. Die Personen sprechen über das Leben in kleinen Städten. Sie hören den Text einmal. Wählen Sie bei jeder Aufgabe: Wer sagt das? Lesen Sie jetzt die Aufgaben 17 bis 22. Dazu haben Sie 60 Sekunden Zeit.","speakers":{"a":"Moderatorin","b":"Herr Yilmaz, Grafikdesigner","c":"Frau Behrendt, Buchhändlerin"},"example":{"no":"0","text":"In vielen kleinen Städten ziehen inzwischen mehr Menschen zu als weg.","answer":"a"},"items":[{"no":"17","text":"Er/Sie hat den Wohnort eher aus einer Notlage heraus gewechselt.","answer":"b"},{"no":"18","text":"Durch den Zuzug ist das Wohnen für manche Einheimische teurer geworden.","answer":"c"},{"no":"19","text":"Er/Sie hat die Nähe im Dorf früher als Einengung empfunden.","answer":"a"},{"no":"20","text":"Die medizinische Versorgung hat mit der Entwicklung nicht Schritt gehalten.","answer":"c"},{"no":"21","text":"Er/Sie hat einen früheren Vorsatz nicht umsetzen können.","answer":"b"},{"no":"22","text":"Wie gut man sich einlebt, hängt vor allem von den Menschen vor Ort ab.","answer":"a"}]},"t4":{"instruction":"Sie hören einen kurzen Vortrag. Der Redner spricht über das Thema „Vertrauen im Team“. Sie hören den Text zweimal. Wählen Sie bei jeder Aufgabe die richtige Lösung. Lesen Sie jetzt die Aufgaben 23 bis 30. Dazu haben Sie 90 Sekunden Zeit.","items":[{"no":"23","stem":"Entscheidend für erfolgreiche Teams ist vor allem …","options":{"a":"die Ausstattung.","b":"die Qualifikation der Mitglieder.","c":"ein angstfreies Klima."},"answer":"c"},{"no":"24","stem":"Wo nie gestritten wird, …","options":{"a":"fehlt oft echte Offenheit.","b":"arbeitet man besonders effizient.","c":"ist die Leitung meist streng."},"answer":"a"},{"no":"25","stem":"Vertrauen entsteht vor allem durch …","options":{"a":"gemeinsame Ausflüge.","b":"Einzelgespräche mit der Leitung.","c":"verlässliches Verhalten im Alltag."},"answer":"c"},{"no":"26","stem":"Ein Vertrauensbruch …","options":{"a":"lässt sich leicht reparieren.","b":"zerstört oft lange Aufgebautes.","c":"entsteht meist durch Informationsmangel."},"answer":"b"},{"no":"27","stem":"Wenn Vorgesetzte Fehler zugeben, …","options":{"a":"verlieren sie an Autorität.","b":"machen andere mehr Fehler.","c":"wirken sie kompetenter."},"answer":"c"},{"no":"28","stem":"Programme zur Kontrolle am Computer …","options":{"a":"untergraben das Vertrauen.","b":"sind kaum zu vermeiden.","c":"sind nur ausnahmsweise sinnvoll."},"answer":"a"},{"no":"29","stem":"Für Teams im Homeoffice empfiehlt er, …","options":{"a":"sich öfter im Büro zu treffen.","b":"auch über Privates zu reden.","c":"Aufgaben genauer zu dokumentieren."},"answer":"b"},{"no":"30","stem":"Zum Schluss rät er, …","options":{"a":"mit Misserfolgen zu beginnen.","b":"Schweigen sofort zu beenden.","c":"die Agenda vorab zu senden."},"answer":"a"}]}},"schreiben":{"intro":"Das Modul Schreiben hat zwei Teile. In Teil 1 schreiben Sie einen Forumsbeitrag. In Teil 2 schreiben Sie eine Nachricht. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf die Antwortbogen. Wörterbücher und Mobiltelefone sind nicht erlaubt.","tasks":[{"no":1,"minutes":50,"words":150,"situation":["Sie schreiben einen Forumsbeitrag zum Thema „Einkaufen im Internet“."],"points":["Äußern Sie Ihre Meinung zu Online-Bewertungen von Produkten und Dienstleistungen.","Nennen Sie Gründe, warum sich viele Menschen bei ihren Entscheidungen auf solche Bewertungen verlassen.","Nennen Sie andere Möglichkeiten, sich vor einem Kauf zu informieren.","Nennen Sie Vorteile dieser anderen Möglichkeiten."],"instruction":"Denken Sie an eine Einleitung und einen Schluss. Bei der Bewertung wird darauf geachtet, wie genau die Inhaltspunkte bearbeitet sind, wie korrekt der Text ist und wie gut die Sätze und Abschnitte sprachlich miteinander verknüpft sind. Schreiben Sie mindestens 150 Wörter.","model":{"label":"Forumsbeitrag, ca. 200 Wörter","text":"Liebe Forumsmitglieder,\n\nvor einem Kauf schaue ich mir fast immer an, wie andere Kundinnen und Kunden ein Produkt bewerten. Trotzdem sehe ich solche Bewertungen inzwischen kritischer als früher.\n\nMeiner Meinung nach können Online-Bewertungen durchaus hilfreich sein, allerdings nur, wenn man sie richtig liest. Fünf Sterne allein sagen wenig aus; aufschlussreicher sind ausführliche Kommentare, in denen jemand konkrete Erfahrungen schildert. Hinzu kommt, dass längst nicht alle Bewertungen echt sind.\n\nDass sich dennoch so viele Menschen darauf verlassen, hat mehrere Gründe. Zum einen ist das Angebot im Internet so groß, dass man schnell den Überblick verliert. Zum anderen vertrauen wir den Erfahrungen vieler Menschen eher als der Werbung eines Herstellers.\n\nEs gibt aber auch andere Wege, sich zu informieren: etwa unabhängige Testberichte von Verbraucherorganisationen, die Beratung im Fachgeschäft oder ein Gespräch mit Bekannten, die das Produkt schon besitzen.\n\nDer größte Vorteil dieser Quellen besteht darin, dass man weiß, wer hinter einer Einschätzung steht. Im Geschäft kann man das Produkt außerdem ausprobieren und gezielt nachfragen.\n\nMein Fazit: Bewertungen sind ein guter Anfang, ersetzen aber keine sorgfältige Recherche. Wie handhabt ihr das?"},"typicalErrors":"Die Punkte 3 und 4 werden vermischt: andere Möglichkeiten nennen, aber keine Vorteile begründen · deutlich weniger als 150 Wörter."},{"no":2,"minutes":25,"words":100,"situation":["Ihr Team bereitet eine Veranstaltung für Kundinnen und Kunden vor. In der letzten Besprechung wurde beschlossen, dass Sie die Einladungen verschicken. Sie waren an diesem Tag krank und haben erst heute davon erfahren – verschickt werden sollten die Einladungen eigentlich schon gestern. Schreiben Sie eine Nachricht an Ihre Teamleiterin, Frau Kruse."],"points":["Entschuldigen Sie sich für die Verzögerung.","Erklären Sie, wie es zu dem Missverständnis gekommen ist.","Machen Sie einen Vorschlag, wie es jetzt weitergehen kann.","Bitten Sie darum, Aufgaben künftig auch schriftlich mitgeteilt zu bekommen."],"instruction":"Überlegen Sie sich eine passende Reihenfolge für die Inhaltspunkte. Bei der Bewertung wird darauf geachtet, wie genau die Inhaltspunkte bearbeitet sind, wie korrekt der Text ist und wie gut die Sätze und Abschnitte sprachlich miteinander verknüpft sind. Vergessen Sie nicht Anrede und Gruß. Schreiben Sie mindestens 100 Wörter.","model":{"label":"Nachricht an die Teamleiterin, ca. 110 Wörter","text":"Betreff: Einladungen zur Kundenveranstaltung\n\nSehr geehrte Frau Kruse,\n\nes tut mir sehr leid, dass die Einladungen zu unserer Kundenveranstaltung noch nicht verschickt worden sind.\n\nDa ich am Tag der letzten Besprechung krank war, habe ich erst heute aus dem Protokoll erfahren, dass mir diese Aufgabe übertragen wurde.\n\nIch schlage vor, dass ich die Einladungen noch heute per E-Mail versende und die gedruckten Exemplare morgen früh zur Post bringe. So verlieren wir höchstens einen Tag.\n\nAußerdem hätte ich eine Bitte: Könnten Aufgaben, die in meiner Abwesenheit verteilt werden, künftig kurz per E-Mail an mich weitergeleitet werden? So ließe sich ein solches Missverständnis leicht vermeiden.\n\nMit freundlichen Grüßen\nJulia Novak"},"typicalErrors":"Schuld allein bei den Kollegen suchen · Vorschlag ohne konkreten Zeitpunkt · Hallo Frau Kruse oder LG."}]},"audio":[{"src":"Goethe%20B2%20Modelltest%201.1.mp3","dur":445.54},{"src":"Goethe%20B2%20Modelltest%201.2.mp3","dur":503.51},{"src":"Goethe%20B2%20Modelltest%201.3.mp3","dur":315.12},{"src":"Goethe%20B2%20Modelltest%201.4.mp3","dur":551.44}],"pdf":"Goethe%20B2%20Modelltest%201.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"2":{"id":2,"roman":"II","lesen":{"t1":{"instruction":"Sie lesen in einem Forum, wie Menschen über Kleidung aus zweiter Hand denken. Auf welche der vier Personen treffen die einzelnen Aussagen zu? Die Personen können mehrmals gewählt werden.","forum":{"title":"Kleidung aus zweiter Hand","posts":[{"letter":"a","name":"Jana","time":"02.10. · 18:12 Uhr","paragraphs":["Angefangen habe ich im Studium, schlicht aus Geldmangel: Eine Jeans für acht Euro statt für achtzig, das war ein Argument. Inzwischen geht es mir um etwas anderes. Ich mag Sachen, die nicht jeder trägt, und auf dem Flohmarkt finde ich Stücke, die es in keinem Laden mehr gibt. Was ich selbst nicht mehr anziehe, verkaufe ich über eine App; ein paar Hundert Euro im Jahr kommen so schon zusammen. Ärgerlich finde ich, was aus manchen Vintage-Läden geworden ist. Seit „Second Hand“ als schick gilt, verlangen sie für eine alte Lederjacke so viel wie für eine neue. Mit Umweltschutz hat das für mich übrigens wenig zu tun, auch wenn man mir das oft unterstellt. Ich finde es einfach spannender, zu suchen, als im Kaufhaus zwischen fünfzig gleichen Pullovern zu wählen. Manchmal komme ich nach zwei Stunden mit leeren Händen nach Hause, aber gerade das macht den Reiz aus: Finde ich dann doch etwas Besonderes, freue ich mich umso mehr."]},{"letter":"b","name":"Holger","time":"02.10. · 21:40 Uhr","paragraphs":["Für unsere Kinder kaufe ich fast alles gebraucht. Die wachsen so schnell, dass manche Hosen nach drei Monaten schon wieder zu kurz sind – da wäre es Unsinn, jedes Mal neu zu kaufen. Bei mir selbst ist das anders: Anzüge und Hemden fürs Büro kaufe ich neu, weil mir gebrauchte Sachen nie richtig passen. Online bin ich vorsichtig geworden. Vor zwei Jahren habe ich auf einer Plattform eine teure Markenjacke bestellt, die sich als billige Fälschung herausstellte; mein Geld habe ich nie wiederbekommen. Seitdem gehe ich lieber auf den Kinderflohmarkt in unserer Schule. Dort kann ich die Sachen anfassen, die Nähte prüfen und direkt mit den Eltern reden. Und nebenbei unterstützt man den Förderverein, der einen Teil der Standgebühren bekommt. Meine Frau findet übrigens, ich sollte auch für mich öfter gebraucht kaufen. Vielleicht probiere ich es irgendwann mit einer Winterjacke, bei Anzügen bleibe ich aber skeptisch."]},{"letter":"c","name":"Sabine","time":"03.10. · 09:05 Uhr","paragraphs":["Ich freue mich über jeden, der gebraucht kauft, aber ich warne vor falschen Hoffnungen. Wer drei gebrauchte Pullover kauft statt eines neuen, hat für die Umwelt wenig gewonnen. Ich habe den Eindruck, dass viele sich mit dem guten Gewissen einfach mehr gönnen und der Konsum insgesamt nicht sinkt. Deshalb organisiere ich in unserem Stadtteil zweimal im Jahr eine Tauschparty: Alle bringen fünf Teile mit, die sie nicht mehr tragen, und nehmen dafür andere mit. Bezahlt wird nichts, und was übrig bleibt, geht an eine Kleiderkammer. Mindestens genauso wichtig finde ich es, Kleidung zu reparieren. Einen Knopf annähen oder eine Naht schließen kann fast jeder lernen. Bei unseren Treffen zeigt eine ältere Nachbarin, wie das geht, und die Jüngeren staunen jedes Mal. Viele hätten ihre Lieblingshose sonst einfach weggeworfen, nur weil ein Knopf fehlte. Das ist für mich der eigentliche Wandel, den wir brauchen."]},{"letter":"d","name":"Murat","time":"03.10. · 20:18 Uhr","paragraphs":["Ich arbeite seit zehn Jahren in einem Modegeschäft und sehe, wie sich das Verhalten verändert. Viele Kundinnen kaufen ein Kleid, tragen es einmal für ein Foto und stellen es am nächsten Tag zum Verkauf ins Netz. Kleidung wird so behandelt wie etwas, das man sich kurz ausleiht. Die Plattformen fördern das sogar, weil jeder Weiterverkauf ihnen eine Gebühr bringt. Ich habe nichts gegen gebrauchte Kleidung, im Gegenteil. Aber das Problem ist nicht, ob etwas neu oder alt ist, sondern wie oft wir kaufen. Ich selbst habe mir angewöhnt, lieber wenige, dafür gute Sachen zu kaufen und sie jahrelang zu tragen. Mein Wintermantel ist zwölf Jahre alt und sieht immer noch ordentlich aus. Das ist mir wichtiger als jede neue Kollektion. Wer gut kauft, muss eben seltener kaufen – ob man im Laden oder auf dem Flohmarkt kauft, spielt für mich eine eher untergeordnete Rolle."]}]},"example":{"no":"0","text":"Wer hat beim Kauf im Internet schlechte Erfahrungen gemacht?","answer":"b"},"items":[{"no":"1","text":"Wer kauft heute aus anderen Gründen gebraucht als früher?","answer":"a"},{"no":"2","text":"Wer sorgt dafür, dass Kleidung kostenlos den Besitzer wechselt?","answer":"c"},{"no":"3","text":"Wer beobachtet, dass Kleidung oft nur kurz getragen wird?","answer":"d"},{"no":"4","text":"Wer behandelt Familienmitglieder beim Kauf unterschiedlich?","answer":"b"},{"no":"5","text":"Wer befürchtet, dass insgesamt nicht weniger gekauft wird?","answer":"c"},{"no":"6","text":"Wer meint, der Trend habe gebrauchte Mode verteuert?","answer":"a"},{"no":"7","text":"Wer setzt lieber auf wenige, langlebige Stücke?","answer":"d"},{"no":"8","text":"Wer verdient mit alter Kleidung etwas dazu?","answer":"a"},{"no":"9","text":"Wer will Kleidung vor dem Kauf in die Hand nehmen?","answer":"b"}]},"t2":{"instruction":"Sie lesen in einer Zeitschrift einen Artikel über die neue Beliebtheit von Brettspielen. Welche Sätze passen in die Lücken? Zwei Sätze passen nicht.","title":"Zurück an den Tisch","lead":"Brettspiele galten lange als altmodisch. Heute erleben sie einen Boom – nicht nur in Familien.","paragraphs":["Freitagabend in einem Café in Leipzig: An jedem Tisch sitzen vier, fünf Leute über bunten Spielbrettern, in den Regalen stehen mehr als tausend Spiele. [0] Wer keinen Tisch reserviert hat, muss meist wieder gehen. Für zwölf Euro pro Person darf man so lange bleiben, wie man möchte, und eine Mitarbeiterin erklärt auf Wunsch die Regeln.","Solche Spielecafés gibt es inzwischen in vielen deutschen Städten. [10] Seit Jahren meldet die Branche steigende Umsätze, und die größte Publikumsmesse für Brettspiele weltweit, die jeden Herbst in Essen stattfindet, zählt fast 200.000 Besucherinnen und Besucher.","Dabei hatten Brettspiele lange ein verstaubtes Image. Man verband sie mit verregneten Nachmittagen bei den Großeltern oder mit endlosem Streit über die Regeln. [11] Moderne Spiele sind dagegen oft kooperativ: Alle am Tisch gewinnen oder verlieren gemeinsam. Statt sich gegenseitig Häuser und Hotels abzunehmen, retten die Spieler zusammen eine Stadt vor einer Epidemie oder bauen gemeinsam ein Raumschiff.","Warum aber greifen ausgerechnet junge Erwachsene, die mit Smartphone und Spielkonsole aufgewachsen sind, zu Würfeln und Karten? Fachleute sprechen von einer Gegenbewegung. [12] Wer spielt, legt das Handy beiseite und schaut seinem Gegenüber in die Augen. Auch die Corona-Jahre haben den Trend verstärkt: Als Kinos und Kneipen geschlossen waren, entdeckten viele Familien alte Spiele wieder – und kauften neue dazu.","Zudem haben sich die Spiele selbst verändert. Früher dauerte eine Partie oft einen ganzen Abend, heute sind viele Spiele nach einer halben Stunde vorbei. [13] So passt eine Runde sogar in die Mittagspause.","Der Boom hat allerdings auch Schattenseiten. Jedes Jahr kommen allein in Deutschland weit über tausend neue Titel auf den Markt. [14] Kleine Verlage klagen, dass ihre Spiele in der Masse untergehen, bevor sie überhaupt jemand kennt. Hinzu kommt, dass Papier, Holz und Transport teurer geworden sind. Viele von ihnen können ihre Spiele deshalb nur noch in kleinen Auflagen drucken lassen.","Umso wichtiger sind Auszeichnungen wie der Preis „Spiel des Jahres“, der seit 1979 vergeben wird. [15] Ein Spiel, das ihn gewinnt, verkauft sich danach oft um ein Vielfaches besser."],"source":"aus einer deutschen Zeitschrift","example":{"no":"0","text":"Das Lokal ist an solchen Abenden regelmäßig voll."},"sentences":{"a":"Erwachsene holten sie deshalb höchstens an Weihnachten hervor.","b":"Die meisten Spielecafés mussten deshalb inzwischen wieder schließen.","c":"Für viele Käuferinnen und Käufer ist er eine wichtige Orientierung.","d":"Vor zwanzig Jahren hätte man über diese Geschäftsidee wohl gelacht.","e":"Die Regeln lassen sich meist in wenigen Minuten erklären.","f":"Online-Versionen der Spiele sind deshalb heute beliebter als die gedruckten.","g":"Nach Stunden vor Bildschirmen sehnen sich viele nach Erlebnissen zum Anfassen.","h":"Der Handel verliert damit zunehmend den Überblick."},"unused":["b","f"],"items":[{"no":"10","answer":"d"},{"no":"11","answer":"a"},{"no":"12","answer":"g"},{"no":"13","answer":"e"},{"no":"14","answer":"h"},{"no":"15","answer":"c"}]},"t3":{"instruction":"Sie lesen in einer Zeitung einen Artikel über Einsamkeit. Wählen Sie bei jeder Aufgabe die richtige Lösung.","tasksIntro":"Lesen Sie die Aufgaben 16 bis 21 zum Artikel „Allein unter vielen“. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Allein unter vielen","lead":"Einsamkeit galt lange als Problem alter Menschen. Neue Studien zeichnen ein anderes Bild.","paragraphs":["Man kann in einer Großstadt mit drei Millionen Menschen leben, jeden Tag Dutzenden Leuten begegnen – und sich trotzdem einsam fühlen. Wie viele Menschen in Deutschland davon betroffen sind, lässt sich nur schätzen. Je nach Umfrage geben zwischen einem Zehntel und einem Viertel der Erwachsenen an, sich häufig einsam zu fühlen.","Fachleute unterscheiden dabei sorgfältig zwischen Alleinsein und Einsamkeit. „Wer allein lebt, ist nicht automatisch einsam“, erklärt die Sozialpsychologin Maren Albrecht. „Einsamkeit entsteht, wenn die Beziehungen, die man hat, nicht zu denen passen, die man sich wünscht.“ Entscheidend sei also nicht die Zahl der Kontakte, sondern ihre Qualität. Wer hundert Bekannte hat, aber niemanden, den er nachts um drei anrufen könnte, kann sich einsamer fühlen als jemand mit zwei engen Freunden.","Überraschend ist, wen es trifft. Lange galt Einsamkeit vor allem als Problem hochbetagter Menschen. Neuere Befragungen zeigen jedoch, dass junge Erwachsene zwischen 18 und 29 Jahren besonders häufig betroffen sind, häufiger sogar als Menschen im Rentenalter. Als Gründe nennen die Forschenden Umzüge für Ausbildung und Beruf, befristete Verträge und ein Leben, in dem Freundschaften immer wieder neu aufgebaut werden müssen.","Dass Einsamkeit nicht nur unglücklich, sondern auch krank machen kann, gilt inzwischen als gut belegt. Wer dauerhaft einsam ist, hat ein höheres Risiko für Herz-Kreislauf-Erkrankungen, Depressionen und Demenz. Eine viel zitierte Auswertung zahlreicher Studien kam zu dem Ergebnis, dass chronische Einsamkeit der Gesundheit ähnlich schadet wie das Rauchen. Der Körper reagiert auf soziale Isolation mit Stress, als befände er sich ständig in Alarmbereitschaft.","Einige Länder haben darauf politisch reagiert. Großbritannien ernannte 2018 als erstes Land eine Ministerin, die sich um das Thema kümmern sollte; in Deutschland beschloss die Bundesregierung einige Jahre später eine eigene Strategie gegen Einsamkeit. Kritiker bezweifeln allerdings, dass sich ein so persönliches Gefühl mit Programmen und Broschüren bekämpfen lässt. Zudem, so ihr Einwand, schäme sich ein großer Teil der Betroffenen und nehme deshalb keine Hilfe in Anspruch.","Albrecht sieht das differenzierter. Broschüren allein helfen tatsächlich wenig, räumt sie ein. Wirksamer seien Orte, an denen sich Menschen ohne großen Aufwand immer wieder begegnen: Bibliotheken mit Sitzecken, Gemeinschaftsgärten, Sportvereine. „Freundschaften entstehen selten beim ersten Treffen, sondern durch Wiederholung. Man sieht sich, grüßt sich und kommt irgendwann ins Gespräch.“","Und was kann jeder Einzelne tun? Albrecht rät, nicht sofort nach neuen Freundschaften zu suchen, sondern alte Kontakte wiederzubeleben. Eine kurze Nachricht an eine frühere Kollegin koste zwei Minuten und werde fast immer freundlicher aufgenommen, als man befürchte. Viele, so Albrecht, warteten nur darauf, dass sich jemand meldet."],"source":"aus einer deutschen Tageszeitung","example":{"no":"0","stem":"Wie viele Menschen einsam sind, …","options":{"a":"lässt sich nicht genau bestimmen.","b":"ist auf dem Land deutlich höher.","c":"hängt von der Größe der Stadt ab."},"answer":"a"},"items":[{"no":"16","stem":"Laut Maren Albrecht fühlt sich ein Mensch einsam, wenn …","options":{"a":"er lange allein wohnt.","b":"er weniger Kontakte hat als andere.","c":"seine Beziehungen ihn nicht erfüllen."},"answer":"c"},{"no":"17","stem":"Junge Erwachsene sind laut neueren Befragungen …","options":{"a":"wegen häufiger Umzüge gefährdet.","b":"seltener einsam als Ältere.","c":"vor allem durch soziale Medien einsam."},"answer":"a"},{"no":"18","stem":"Dauerhafte Einsamkeit …","options":{"a":"führt meist zu Depressionen.","b":"stresst den Körper dauerhaft.","c":"schadet mehr als Rauchen."},"answer":"b"},{"no":"19","stem":"Die politischen Maßnahmen gegen Einsamkeit …","options":{"a":"haben in Großbritannien gewirkt.","b":"kamen in Deutschland zuerst.","c":"halten manche für wirkungslos."},"answer":"c"},{"no":"20","stem":"Albrecht hält es für besonders hilfreich, …","options":{"a":"mehr Broschüren zu verteilen.","b":"regelmäßige Begegnungen zu fördern.","c":"Einsame zu einem ersten Treffen einzuladen."},"answer":"b"},{"no":"21","stem":"Albrecht rät Einzelnen, …","options":{"a":"alte Kontakte aufzufrischen.","b":"zuerst neue Freunde zu suchen.","c":"abzuwarten, bis andere sich melden."},"answer":"a"}]},"t4":{"instruction":"Sie lesen in einer Zeitschrift Meinungsäußerungen zur Frage, ob auf deutschen Autobahnen ein Tempolimit eingeführt werden sollte. Welche Äußerung passt zu welcher Überschrift? Eine Äußerung passt nicht. Die Äußerung a ist das Beispiel und kann nicht noch einmal verwendet werden.","title":"Tempolimit auf der Autobahn?","example":{"no":"0","text":"Sicherheit geht vor Fahrspaß.","answer":"a"},"items":[{"no":"22","text":"In anderen Ländern ist ein Limit längst selbstverständlich.","answer":"h"},{"no":"23","text":"Wirksamer Klimaschutz muss nicht teuer sein.","answer":"b"},{"no":"24","text":"Ohne Kontrollen bleibt jedes Verbot wirkungslos.","answer":"f"},{"no":"25","text":"Die eigentlichen Probleme der Autobahnen liegen woanders.","answer":"e"},{"no":"26","text":"Wer langsamer fährt, kommt gelassener am Ziel an.","answer":"d"},{"no":"27","text":"Ein Limit könnte dem Ansehen deutscher Autos schaden.","answer":"g"}],"texts":[{"letter":"a","text":"Als Notfallsanitäter komme ich zu Unfällen, die bei Tempo 200 passiert sind. Da gibt es oft nichts mehr zu retten. Jeder Kilometer pro Stunde weniger verkürzt den Bremsweg und mildert die Folgen eines Aufpralls. Wer das einmal gesehen hat, diskutiert nicht mehr über Fahrspaß.","byline":"Uwe, Kassel"},{"letter":"b","text":"Ein Tempolimit wäre die billigste Klimamaßnahme überhaupt: ein paar Schilder, fertig. Dennoch würde es jedes Jahr Millionen Tonnen CO₂ einsparen, und zwar sofort und nicht erst in zwanzig Jahren. Kein Förderprogramm und kein neues Kraftwerk erreicht so viel für so wenig Geld.","byline":"Lea, Freiburg"},{"letter":"c","text":"Ich fahre ohnehin selten schneller als 140. Aber ich möchte nachts auf einer leeren Autobahn schneller fahren dürfen, wenn mir danach ist. Der Staat muss nicht alles regeln, was vernünftige Menschen von selbst richtig machen. Es geht mir um Freiheit, nicht um Tempo.","byline":"Klaus, Stuttgart"},{"letter":"d","text":"Letzten Sommer bin ich durch Dänemark und Schweden gefahren, überall mit Tempolimit. Niemand hat gedrängelt oder mit der Lichthupe geblinkt. Nach zehn Stunden kam ich entspannter an als hier nach drei. Erst da merkte ich, wie sehr mich das ständige Bremsen und Beschleunigen stresst.","byline":"Mira, Bremen"},{"letter":"e","text":"Ich pendle jeden Tag über die A40 und stehe im Stau – bei Tempo null. Schuld sind Baustellen, marode Brücken und zu viele Lastwagen, nicht ein paar Raser. Statt über neue Schilder zu streiten, sollte man endlich die Straßen und Brücken in Ordnung bringen.","byline":"Stefan, Dortmund"},{"letter":"f","text":"Schon heute halten sich viele nicht an das Tempolimit in Baustellen, weil kaum kontrolliert wird. Bei der Polizei sind Hunderte Stellen unbesetzt. Ein neues Gesetz ohne mehr Personal und ohne mehr Blitzer wäre reine Symbolpolitik, die am Ende nichts ändert.","byline":"Nadine, Hannover"},{"letter":"g","text":"Ich arbeite seit zwanzig Jahren in der Autoindustrie. Kunden in Asien und Amerika kaufen deutsche Wagen auch deshalb, weil sie für hohe Geschwindigkeiten entwickelt und getestet werden. Ein Limit wäre für viele im Ausland ein Zeichen, dass genau diese Stärke plötzlich nicht mehr zählt.","byline":"Frank, Wolfsburg"},{"letter":"h","text":"Ich bin in den Niederlanden aufgewachsen, dort gilt tagsüber Tempo 100. Darüber regt sich niemand auf, es ist einfach normal. Fast alle Länder der Welt haben eine Höchstgeschwindigkeit auf Autobahnen. Dass Deutschland seit Jahrzehnten darüber streitet, verstehen meine Freunde dort bis heute überhaupt nicht.","byline":"Pieter, Aachen"}],"unused":["c"]},"t5":{"instruction":"Sie möchten in einem Fitnessstudio Mitglied werden und lesen die Mitgliedsbedingungen. Welche der Überschriften aus dem Inhaltsverzeichnis passen zu den Paragrafen? Vier Überschriften werden nicht gebraucht.","title":"Mitgliedsbedingungen","subtitle":"Fitnessstudio „Kraftwerk“ · Stand: Januar","headings":{"a":"Mitgliedsbeiträge","b":"Kündigung","c":"Vertragsbeginn und Laufzeit","d":"Nutzung der Trainingsgeräte","e":"Haftung","f":"Ruhen der Mitgliedschaft","g":"Öffnungszeiten","h":"Mitbringen von Gästen"},"unused":["a","b","d","g"],"example":{"no":"0","label":"§ 0","paragraphs":["Die Mitgliedschaft beginnt an dem im Vertrag genannten Tag und hat eine Mindestlaufzeit von zwölf Monaten. Wird sie nicht rechtzeitig beendet, verlängert sie sich danach auf unbestimmte Zeit."],"answer":"c"},"items":[{"no":"28","label":"§ 28","paragraphs":["(1) Bei Krankheit, Schwangerschaft oder einem beruflich bedingten Auslandsaufenthalt kann die Mitgliedschaft auf Antrag für bis zu sechs Monate ausgesetzt werden. (2) Dem Antrag ist ein Nachweis, etwa ein ärztliches Attest, beizufügen. (3) Für die Dauer der Unterbrechung werden keine Beiträge erhoben; die Mindestlaufzeit verlängert sich entsprechend."],"answer":"f"},{"no":"29","label":"§ 29","paragraphs":["Jedes Mitglied darf pro Monat bis zu zwei Begleitpersonen mitbringen. Diese müssen sich an der Theke anmelden und eine Tageskarte zum ermäßigten Preis von 8 Euro erwerben. Die Kurse im Gruppenraum stehen Gästen nicht offen."],"answer":"h"},{"no":"30","label":"§ 30","paragraphs":["Für Wertsachen, die in den Umkleiden nicht in den abschließbaren Schränken aufbewahrt werden, übernimmt das Studio keine Haftung. Dasselbe gilt für Kleidung und Taschen, die in den Trainingsräumen abgelegt werden. Schäden an Geräten, die durch unsachgemäße Benutzung entstehen, hat das Mitglied zu ersetzen."],"answer":"e"}]}},"hoeren":{"t1":{"instruction":"Sie hören fünf Gespräche und Äußerungen. Sie hören jeden Text einmal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung. Lesen Sie jetzt das Beispiel. Dazu haben Sie 15 Sekunden Zeit.","example":[{"no":"01","type":"rf","text":"Der Mann möchte einen Termin vereinbaren.","answer":"R"},{"no":"02","type":"abc","stem":"Zur Blutabnahme soll er …","options":{"a":"sich vorher telefonisch anmelden.","b":"ohne Frühstück kommen.","c":"am Nachmittag vorbeikommen."},"answer":"b"}],"texts":[{"label":"Text 1","items":[{"no":"1","type":"rf","text":"Die Frau erklärt, warum sie so früh Sport treibt.","answer":"R"},{"no":"2","type":"abc","stem":"Das Laufen hat ihr vor allem geholfen, …","options":{"a":"schneller zu werden.","b":"sich auf einen Wettkampf vorzubereiten.","c":"im Alltag gelassener zu werden."},"answer":"c"}]},{"label":"Text 2","items":[{"no":"3","type":"rf","text":"Die Meldung betrifft eine Sperrung nach einem Unfall.","answer":"F"},{"no":"4","type":"abc","stem":"Wer mit dem Ersatzbus fährt, …","options":{"a":"sollte mehr Zeit einplanen.","b":"braucht dafür ein zusätzliches Ticket.","c":"kann sein Fahrrad ohne Aufpreis mitnehmen."},"answer":"a"}]},{"label":"Text 3","items":[{"no":"5","type":"rf","text":"Die Nachbarn sprechen über eine beschädigte Sendung.","answer":"R"},{"no":"6","type":"abc","stem":"Während des Urlaubs der Frau …","options":{"a":"gießt Herr Brandt ihre Blumen.","b":"nimmt ihre Schwester die Pakete an.","c":"kümmert sich Herr Brandt um ihre Post."},"answer":"c"}]},{"label":"Text 4","items":[{"no":"7","type":"rf","text":"Die Frau hält Städte für ungeeignet, um Bienen zu halten.","answer":"F"},{"no":"8","type":"abc","stem":"Honig aus der Stadt …","options":{"a":"enthält häufig Schadstoffe aus der Luft.","b":"ist oft reiner als Honig vom Land.","c":"wird in Geschäften immer seltener angeboten."},"answer":"b"}]},{"label":"Text 5","items":[{"no":"9","type":"rf","text":"Die beiden einigen sich am Ende auf ein Geschenk.","answer":"R"},{"no":"10","type":"abc","stem":"Die Frau …","options":{"a":"hält Geld anfangs für unpersönlich.","b":"hat den Kletterkurs schon gebucht.","c":"wollte von Anfang an Kletterschuhe schenken."},"answer":"a"}]}]},"t2":{"instruction":"Sie hören im Radio ein Interview mit einer Persönlichkeit aus der Kultur. Sie hören den Text zweimal. Wählen Sie bei jeder Aufgabe die richtige Lösung. Lesen Sie jetzt die Aufgaben 11 bis 16. Dazu haben Sie 90 Sekunden Zeit.","context":"In der Sendung „Menschen hinter den Büchern“ spricht der Moderator mit der Literaturübersetzerin Ulrike Sander.","items":[{"no":"11","stem":"Dass Leser nicht auf ihren Namen achten, …","options":{"a":"empfindet Frau Sander heute als Bestätigung.","b":"ärgert Frau Sander bis heute sehr.","c":"sieht Frau Sander als Zeichen schlechter Kritiken."},"answer":"a"},{"no":"12","stem":"Bevor Frau Sander mit dem Übersetzen beginnt, …","options":{"a":"übersetzt sie zur Probe einzelne Kapitel.","b":"bespricht sie schwierige Stellen mit dem Autor.","c":"versucht sie, den Ton des ganzen Buches zu erfassen."},"answer":"c"},{"no":"13","stem":"Bei Wortspielen …","options":{"a":"lässt sie diese im Deutschen einfach weg.","b":"erfindet sie notfalls an anderer Stelle einen Witz.","c":"erklärt sie den Witz für die Leser in einer Fußnote."},"answer":"b"},{"no":"14","stem":"Im Zusammenhang mit Übersetzungsprogrammen befürchtet Frau Sander, dass …","options":{"a":"Romane bald nur noch maschinell übersetzt werden.","b":"Übersetzer künftig schlechter bezahlt werden.","c":"die Programme bei Geschäftsbriefen zu viele Fehler machen."},"answer":"b"},{"no":"15","stem":"In ihren Notizbüchern sammelt Frau Sander …","options":{"a":"Ausdrücke, die ihr im Alltag begegnen.","b":"italienische Wörter, die sie noch nicht kennt.","c":"Sätze, die ihr beim Übersetzen nicht gelungen sind."},"answer":"a"},{"no":"16","stem":"Jungen Übersetzern empfiehlt Frau Sander vor allem, …","options":{"a":"möglichst lange im Ausland zu leben.","b":"zunächst nur Sachtexte zu übersetzen.","c":"an ihrem eigenen Deutsch zu arbeiten."},"answer":"c"}]},"t3":{"instruction":"Sie hören im Radio ein Gespräch mit mehreren Personen. Die Personen sprechen darüber, ob man sein Hobby zum Beruf machen sollte. Sie hören den Text einmal. Wählen Sie bei jeder Aufgabe: Wer sagt das? Lesen Sie jetzt die Aufgaben 17 bis 22. Dazu haben Sie 60 Sekunden Zeit.","speakers":{"a":"Moderator","b":"Frau Kramer, Konditorin","c":"Herr Neumann, Softwareentwickler"},"example":{"no":"0","text":"Viele Menschen wünschen sich, mit ihrem Hobby Geld zu verdienen.","answer":"a"},"items":[{"no":"17","text":"Er/Sie hat sich auf den beruflichen Wechsel gründlich vorbereitet.","answer":"b"},{"no":"18","text":"Wer mit einem Hobby Geld verdient, muss sich nach dem Geschmack anderer richten.","answer":"c"},{"no":"19","text":"Er/Sie hat eine Freizeitbeschäftigung aufgegeben, nachdem sie zum Nebenjob geworden war.","answer":"a"},{"no":"20","text":"Im neuen Beruf bleibt für die eigentliche Lieblingstätigkeit wenig Zeit.","answer":"b"},{"no":"21","text":"Ein sicheres Einkommen verschafft ihm/ihr künstlerische Freiheit.","answer":"c"},{"no":"22","text":"Nicht jede Leidenschaft übersteht es, zur Pflicht zu werden.","answer":"a"}]},"t4":{"instruction":"Sie hören einen kurzen Vortrag. Die Rednerin spricht über das Thema „Wie Gewohnheiten entstehen“. Sie hören den Text zweimal. Wählen Sie bei jeder Aufgabe die richtige Lösung. Lesen Sie jetzt die Aufgaben 23 bis 30. Dazu haben Sie 90 Sekunden Zeit.","items":[{"no":"23","stem":"Dass wir vieles aus Gewohnheit tun, …","options":{"a":"beunruhigt die Rednerin.","b":"entlastet das Gehirn.","c":"gilt vor allem im Beruf."},"answer":"b"},{"no":"24","stem":"Ausgelöst wird eine Gewohnheit durch …","options":{"a":"Hunger oder Durst.","b":"eine bewusste Entscheidung.","c":"bestimmte Umstände."},"answer":"c"},{"no":"25","stem":"Die Zahl von 21 Tagen …","options":{"a":"stammt aus London.","b":"gilt für einfache Gewohnheiten.","c":"ist wissenschaftlich nicht belegt."},"answer":"c"},{"no":"26","stem":"Wer einen Tag ausfallen lässt, …","options":{"a":"gefährdet den Erfolg kaum.","b":"muss neu beginnen.","c":"sollte am nächsten Tag doppelt üben."},"answer":"a"},{"no":"27","stem":"Menschen, die ihre Vorsätze umsetzen, …","options":{"a":"haben mehr Willenskraft.","b":"gestalten ihr Umfeld passend.","c":"nehmen sich mehrere Ziele gleichzeitig vor."},"answer":"b"},{"no":"28","stem":"Eine neue Gewohnheit sollte man …","options":{"a":"mit einer alten verbinden.","b":"nur am Wochenende üben.","c":"gleich in großem Umfang beginnen."},"answer":"a"},{"no":"29","stem":"Schlechte Gewohnheiten …","options":{"a":"verschwinden mit der Zeit.","b":"lassen sich ganz löschen.","c":"muss man ersetzen."},"answer":"c"},{"no":"30","stem":"Am Ende empfiehlt die Rednerin, …","options":{"a":"nur ein Ziel zu verfolgen.","b":"Rückfälle zu bestrafen.","c":"Fortschritte täglich zu notieren."},"answer":"a"}]}},"schreiben":{"intro":"Das Modul Schreiben hat zwei Teile. In Teil 1 schreiben Sie einen Forumsbeitrag. In Teil 2 schreiben Sie eine Nachricht. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf die Antwortbogen. Wörterbücher und Mobiltelefone sind nicht erlaubt.","tasks":[{"no":1,"minutes":50,"words":150,"situation":["Sie schreiben einen Forumsbeitrag zum Thema „Freizeit im Verein“."],"points":["Äußern Sie Ihre Meinung dazu, die Freizeit in einem Verein zu verbringen.","Nennen Sie Gründe, warum heute weniger Menschen Mitglied in einem Verein werden.","Nennen Sie andere Möglichkeiten, die Freizeit gemeinsam mit anderen zu gestalten.","Nennen Sie Vorteile dieser anderen Möglichkeiten."],"instruction":"Denken Sie an eine Einleitung und einen Schluss. Bei der Bewertung wird darauf geachtet, wie genau die Inhaltspunkte bearbeitet sind, wie korrekt der Text ist und wie gut die Sätze und Abschnitte sprachlich miteinander verknüpft sind. Schreiben Sie mindestens 150 Wörter.","model":{"label":"Forumsbeitrag, ca. 200 Wörter","text":"Liebe Forumsmitglieder,\n\nseit fünfzehn Jahren spiele ich in einem Volleyballverein, und ich kann mir meine Woche ohne das Training kaum vorstellen.\n\nMeiner Meinung nach lohnt es sich, einen Teil der Freizeit in einem Verein zu verbringen. Man trifft regelmäßig dieselben Menschen, übernimmt Verantwortung und lernt Leute kennen, denen man sonst nie begegnet wäre.\n\nTrotzdem werden heute weniger Menschen Mitglied. Das liegt zum einen daran, dass viele beruflich so eingespannt sind, dass sie sich ungern auf feste Termine festlegen. Zum anderen gibt es heute viel mehr Freizeitangebote als früher, vom Fitnessstudio bis zum Online-Kurs.\n\nWer sich nicht binden möchte, kann seine Freizeit auch anders gemeinsam gestalten: etwa in Laufgruppen, die sich über soziale Netzwerke verabreden, in Kursen der Volkshochschule oder bei offenen Nachbarschaftstreffen.\n\nDer Vorteil solcher Angebote liegt vor allem in ihrer Flexibilität. Man kann spontan teilnehmen, zahlt keine Jahresbeiträge und kann ausprobieren, was einem wirklich Spaß macht.\n\nMeiner Ansicht nach haben beide Formen ihre Berechtigung. Wer aber auf Dauer Freundschaften sucht, ist im Verein besser aufgehoben. Wie seht ihr das?"},"typicalErrors":"Nur über den eigenen Verein erzählen, ohne Gründe für den Mitgliederrückgang zu nennen · Punkt 4 fehlt."},{"no":2,"minutes":25,"words":100,"situation":["Sie arbeiten im Vertrieb eines Unternehmens. Ihr Vorgesetzter, Herr Lindner, hat Sie gebeten, nächste Woche den Messestand Ihrer Firma zu betreuen. In derselben Woche findet jedoch eine Weiterbildung statt, für die Sie sich schon vor Monaten angemeldet haben. Schreiben Sie eine Nachricht an Herrn Lindner."],"points":["Beschreiben Sie Ihre Situation.","Bitten Sie um Verständnis für Ihre Lage.","Machen Sie einen Vorschlag, wie sich beides vereinbaren lässt.","Zeigen Sie Verständnis für die Situation Ihres Vorgesetzten."],"instruction":"Überlegen Sie sich eine passende Reihenfolge für die Inhaltspunkte. Bei der Bewertung wird darauf geachtet, wie genau die Inhaltspunkte bearbeitet sind, wie korrekt der Text ist und wie gut die Sätze und Abschnitte sprachlich miteinander verknüpft sind. Vergessen Sie nicht Anrede und Gruß. Schreiben Sie mindestens 100 Wörter.","model":{"label":"Nachricht an den Vorgesetzten, ca. 130 Wörter","text":"Betreff: Messe in der nächsten Woche\n\nSehr geehrter Herr Lindner,\n\nvielen Dank, dass Sie mir die Betreuung unseres Messestands zutrauen. Leider habe ich mich bereits im März für eine Weiterbildung zur Verhandlungsführung angemeldet, die genau in derselben Woche stattfindet. Die Teilnahme ist schon bezahlt und lässt sich nicht verschieben.\n\nIch hoffe sehr, dass Sie dafür Verständnis haben.\n\nMir ist bewusst, dass die Messe für unsere Abteilung sehr wichtig ist und dass im Moment viele Kolleginnen und Kollegen im Urlaub sind.\n\nDeshalb schlage ich vor, dass ich den Stand vorab mit aufbaue und Frau Petersen, die unsere Kunden ebenfalls gut kennt, ihn an den Messetagen betreut. Gern bereite ich alle Unterlagen für sie vor.\n\nMit freundlichen Grüßen\nDaniel Weiß"},"typicalErrors":"Die Messe einfach absagen, ohne Lösung · kein Verständnis für den Vorgesetzten · Hallo Herr Lindner."}]},"audio":[{"src":"Goethe%20B2%20Modelltest%202.1.mp3","dur":462.42},{"src":"Goethe%20B2%20Modelltest%202.2.mp3","dur":515.68},{"src":"Goethe%20B2%20Modelltest%202.3.mp3","dur":307.7},{"src":"Goethe%20B2%20Modelltest%202.4.mp3","dur":475.17}],"pdf":"Goethe%20B2%20Modelltest%202.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"3":{"id":3,"roman":"III","lesen":{"t1":{"instruction":"Sie lesen in einem Forum, wie Menschen über das Kochen im Alltag denken. Auf welche der vier Personen treffen die einzelnen Aussagen zu? Die Personen können mehrmals gewählt werden.","forum":{"title":"Selbst kochen oder bestellen?","posts":[{"letter":"a","name":"Timo","time":"11.11. · 19:02 Uhr","paragraphs":["Bis Mitte zwanzig habe ich mich von Tiefkühlpizza und Kantinenessen ernährt, kochen konnte ich schlicht nicht. Das änderte sich erst, als ich ein halbes Jahr bei einer Familie in Italien wohnte. Dort wurde jeden Abend frisch gekocht, und die Großmutter nahm mich einfach mit in die Küche. Seitdem sehe ich das Kochen völlig anders: nicht als lästige Pflicht, sondern als Entspannung nach der Arbeit. Wenn ich abends Zwiebeln schneide, vergesse ich den ganzen Ärger aus dem Büro. Rezepte benutze ich übrigens kaum noch. Die Nonna hat nie etwas abgewogen, sondern immer probiert und nach Gefühl nachgewürzt – genau so mache ich es heute auch. Manchmal geht das schief, und dann gibt es eben Brot mit Käse. Aber meistens gelingt es, und meine Freunde fragen inzwischen, ob sie am Wochenende zum Essen vorbeikommen dürfen. Das hätte mir vor zehn Jahren niemand geglaubt."]},{"letter":"b","name":"Carla","time":"11.11. · 21:15 Uhr","paragraphs":["Mit zwei Kindern und einem Vollzeitjob muss ich organisiert sein, sonst stehen wir um sieben Uhr abends ratlos vor dem Kühlschrank. Deshalb koche ich am Sonntag für die ganze Woche vor: Suppen, Soßen, ein großes Blech Gemüse. Das kostet mich zwei, drei Stunden, erspart mir aber von Montag bis Freitag jeden Abend eine Stunde Arbeit. Unter der Woche muss ich dann nur noch aufwärmen oder schnell einen Salat dazu machen. Bevor ich einkaufe, schaue ich nach, was noch da ist, und schreibe eine genaue Liste. Früher habe ich fast jede Woche Salat oder Joghurt entsorgt, weil ich zu viel gekauft hatte. Das ärgert mich heute noch, wenn ich daran denke. Die Kinder helfen am Sonntag mit, schälen Kartoffeln oder waschen das Gemüse, und dabei lernen sie ganz nebenbei, was in unserem Essen steckt. Spontan ist das alles natürlich nicht, und manchmal beneide ich meine Kollegen, die einfach essen gehen."]},{"letter":"c","name":"Ingrid","time":"12.11. · 08:40 Uhr","paragraphs":["Ich bin 71 und habe mein Leben lang für eine große Familie gekocht. Heute lebe ich allein, und für eine Person zu kochen, macht ehrlich gesagt wenig Freude. Deshalb habe ich mit zwei Nachbarinnen einen Mittagstisch gegründet: Jeden Dienstag kocht eine von uns für die anderen, und inzwischen sitzen auch zwei Herren aus dem Nachbarhaus mit am Tisch. Das Essen ist dabei fast Nebensache. Wichtiger ist, dass man jemanden hat, mit dem man sich unterhalten kann, und dass man merkt, wenn es jemandem nicht gut geht. Was mich an den vielen Kochsendungen im Fernsehen stört: Da stehen Profis in riesigen Küchen und verwenden Zutaten, die man im normalen Supermarkt gar nicht bekommt. So entsteht der Eindruck, gutes Essen sei kompliziert und teuer. Dabei reichen oft Kartoffeln, ein Ei und ein paar frische Kräuter. Das habe ich schon von meiner Mutter gelernt."]},{"letter":"d","name":"Yusuf","time":"12.11. · 22:30 Uhr","paragraphs":["Ich gebe es zu: Ich bestelle drei-, viermal pro Woche beim Lieferdienst. Zeit hätte ich eigentlich genug, ich arbeite im Homeoffice. Mir fehlt einfach die Motivation, nach Feierabend noch einzukaufen, zu schnippeln und hinterher die Küche aufzuräumen. Am Wochenende koche ich manchmal für Freunde, das macht mir sogar Spaß – aber eben nicht jeden Abend nach einem langen Tag am Bildschirm. Ich finde auch nicht, dass man sich dafür schämen muss. Für eine Person ist Bestellen oft kaum teurer, und es bleibt nichts übrig, was verdirbt. Was mich an der Debatte nervt, ist die Behauptung, alles Selbstgekochte sei automatisch gesund. Ein Freund von mir kocht sich jeden Abend Nudeln mit Sahnesoße und hält das für gesünder als den Linsensalat, den ich mir beim Lieferdienst bestelle. Entscheidend ist doch, was auf dem Teller liegt, und nicht, wer es gekocht hat."]}]},"example":{"no":"0","text":"Wer hat das Kochen erst als Erwachsener gelernt?","answer":"a"},"items":[{"no":"1","text":"Wer spart durch gute Planung Zeit unter der Woche?","answer":"b"},{"no":"2","text":"Wer sieht im gemeinsamen Essen vor allem eine soziale Funktion?","answer":"c"},{"no":"3","text":"Wer hält Lieferdienste für eine vernünftige Lösung?","answer":"d"},{"no":"4","text":"Wer hat seine Einstellung nach einem Erlebnis geändert?","answer":"a"},{"no":"5","text":"Wer kritisiert, wie in Kochsendungen gekocht wird?","answer":"c"},{"no":"6","text":"Wer will vermeiden, dass Lebensmittel weggeworfen werden?","answer":"b"},{"no":"7","text":"Wem fehlt es weniger an Zeit als an Lust?","answer":"d"},{"no":"8","text":"Wer kocht bewusst ohne genaue Mengenangaben?","answer":"a"},{"no":"9","text":"Wer bezweifelt, dass Selbstgekochtes immer gesünder ist?","answer":"d"}]},"t2":{"instruction":"Sie lesen in einer Zeitschrift einen Artikel über die Rückkehr der Wölfe nach Deutschland. Welche Sätze passen in die Lücken? Zwei Sätze passen nicht.","title":"Der Wolf ist wieder da","lead":"Über hundert Jahre lang galt er in Deutschland als ausgerottet. Seine Rückkehr begeistert die einen und beunruhigt die anderen.","paragraphs":["Es war ein Foto, das 2000 in der Lausitz für Aufsehen sorgte: Zum ersten Mal seit mehr als hundert Jahren hatte ein Wolfspaar in Deutschland Junge bekommen. [0] Heute leben nach offiziellen Zählungen weit über hundert Rudel im Land, vor allem im Norden und Osten, und jedes Jahr werden es mehr.","Dass die Tiere zurückkehren konnten, hat mehrere Gründe. Wölfe standen in der EU lange unter strengem Schutz, und in den Wäldern gibt es mehr Rehe und Wildschweine als je zuvor. [10] Ein junger Wolf, der sein Rudel verlässt, wandert auf der Suche nach einem eigenen Revier manchmal mehrere Hundert Kilometer weit.","Nicht überall ist die Freude über die Rückkehr groß. Vor allem Schäferinnen und Schäfer berichten von getöteten Tieren auf ihren Weiden. [11] Wer seine Herde mit hohen Elektrozäunen oder Herdenschutzhunden sichert, bekommt in vielen Bundesländern einen Großteil der Kosten erstattet. Auch für gerissene Tiere gibt es eine Entschädigung, wenn nachgewiesen wird, dass ein Wolf verantwortlich war.","Doch die Maßnahmen haben ihre Grenzen. Auf Deichen an der Küste oder auf steilen Almen lassen sich Zäune kaum aufstellen. [12] Zudem lernen einzelne Wölfe offenbar, selbst hohe Zäune zu überwinden. Hat ein Wolf das einmal geschafft, versucht er es immer wieder.","Die Politik reagiert darauf inzwischen mit neuen Regeln. Tiere, die wiederholt Schutzzäune überwunden haben, sollen schneller abgeschossen werden dürfen. [13] Naturschutzverbände wenden dagegen ein, dass damit das eigentliche Problem nicht gelöst werde. Solange Herden schlecht geschützt seien, würden einfach andere Wölfe nachkommen.","Und die Menschen? Seit der Rückkehr der Wölfe ist in Deutschland niemand von einem Wolf angegriffen worden. [14] Fachleute raten, Abstand zu halten, laut zu sprechen und die Tiere keinesfalls zu füttern. Durch Füttern verlieren Wölfe nämlich ihre natürliche Scheu.","Für viele Förster ist der Wolf sogar ein Verbündeter. Weil er Rehe jagt, können junge Bäume wieder besser wachsen. [15] Ob sich Mensch und Wolf dauerhaft arrangieren, wird sich aber wohl erst in einigen Jahrzehnten zeigen."],"source":"aus einer deutschen Zeitschrift","example":{"no":"0","text":"Damit begann eine Entwicklung, mit der kaum jemand gerechnet hatte."},"sentences":{"a":"Vielen Landwirten geht das allerdings nicht weit genug.","b":"Die meisten Bundesländer haben den Wolf deshalb inzwischen zum Abschuss freigegeben.","c":"Außerdem sind die Tiere erstaunlich anpassungsfähig und legen weite Strecken zurück.","d":"Wer dennoch einem Wolf begegnet, sollte ruhig bleiben.","e":"Der Staat versucht, die Betroffenen zu unterstützen.","f":"Wölfe meiden deshalb inzwischen die Nähe von Dörfern vollständig.","g":"Und die laufenden Kosten für Hunde und Futter sind für kleine Betriebe oft zu hoch.","h":"So trägt er indirekt dazu bei, dass sich der Wald verjüngt."},"unused":["b","f"],"items":[{"no":"10","answer":"c"},{"no":"11","answer":"e"},{"no":"12","answer":"g"},{"no":"13","answer":"a"},{"no":"14","answer":"d"},{"no":"15","answer":"h"}]},"t3":{"instruction":"Sie lesen in einer Zeitung einen Artikel über Schlaf. Wählen Sie bei jeder Aufgabe die richtige Lösung.","tasksIntro":"Lesen Sie die Aufgaben 16 bis 21 zum Artikel „Hellwach im Bett“. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Hellwach im Bett","lead":"Viele Deutsche schlafen zu wenig. Die Ursachen liegen nicht immer dort, wo man sie vermutet.","paragraphs":["Wer morgens müde am Schreibtisch sitzt, ist in guter Gesellschaft. Laut einer großen Krankenkassenumfrage schläft etwa jeder dritte Erwachsene in Deutschl
